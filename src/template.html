<title>PastForward</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* PastForward on one screen: a river of time on top, then one rhyme told in three steps (Then, Today, Next),
   with one button that always says where it goes. Everything else is one tap away, in the full story.
   Two themes from one set of tokens: night (dark) and day (light). The trailer and share images always use night. */
:root, .night {
  color-scheme: dark;
  --bg-rgb: 15, 13, 34;
  --surface-rgb: 27, 24, 58;
  --surface2: #241F4C;
  --ink-rgb: 241, 236, 223;
  --muted-rgb: 164, 159, 194;
  --then-rgb: 230, 184, 102;
  --now-rgb: 116, 214, 200;
  --next-rgb: 201, 182, 255;
  --bad-rgb: 229, 140, 122;
  --glow-rgb: 120, 92, 210;
  --glow-a: .16;
  --on-accent: #0F0D22;
  --shade: 0, 0, 0;
  --bg: rgb(var(--bg-rgb));
  --surface: rgb(var(--surface-rgb));
  --ink: rgb(var(--ink-rgb));
  --muted: rgb(var(--muted-rgb));
  --then: rgb(var(--then-rgb));
  --now: rgb(var(--now-rgb));
  --next: rgb(var(--next-rgb));
  --bad: rgb(var(--bad-rgb));
  --line: rgba(var(--ink-rgb), .11);
}
.night { color: var(--ink); }
:root[data-theme="light"] {
  color-scheme: light;
  --bg-rgb: 245, 243, 249; --surface-rgb: 255, 255, 255; --surface2: #ECE9F4;
  --ink-rgb: 28, 25, 48; --muted-rgb: 94, 89, 118;
  --then-rgb: 138, 92, 10; --now-rgb: 10, 118, 106; --next-rgb: 100, 71, 201; --bad-rgb: 176, 66, 46;
  --glow-a: .08; --on-accent: #FFFFFF; --shade: 40, 34, 80;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg-rgb: 245, 243, 249; --surface-rgb: 255, 255, 255; --surface2: #ECE9F4;
    --ink-rgb: 28, 25, 48; --muted-rgb: 94, 89, 118;
    --then-rgb: 138, 92, 10; --now-rgb: 10, 118, 106; --next-rgb: 100, 71, 201; --bad-rgb: 176, 66, 46;
    --glow-a: .08; --on-accent: #FFFFFF; --shade: 40, 34, 80;
  }
}
:root {
  --f-then: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-ui: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Newsreader", "Iowan Old Style", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  height: 100%; margin: 0; overflow-x: clip; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background: radial-gradient(ellipse 120% 36% at 50% 0%, rgba(var(--glow-rgb), var(--glow-a)), transparent 72%), var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; min-height: 530px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; padding-block: 2px 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--next); outline-offset: 2px; }

/* top bar: the name, and three places to go */
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
h1 { margin: 0; font-family: var(--f-then); font-weight: 400; font-size: clamp(19px, 5.6vw, 23px); line-height: 1; white-space: nowrap; }
h1 .p { color: var(--then); }
h1 .f { color: var(--next); }
h1.tap { cursor: pointer; }
.bar-r { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.navb { position: relative; min-height: 40px; padding: 0 9px; border: 0; border-radius: 10px; background: none; font: 500 15px var(--f-ui); color: rgba(var(--ink-rgb), .8); cursor: pointer; white-space: nowrap; }
.navb:hover { color: var(--ink); background: rgba(var(--ink-rgb), .07); }
.navb.icon { width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.navb svg { width: 19px; height: 19px; }
.navb.new::after { content: ""; position: absolute; top: 9px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--then); }
@media (max-width: 350px) { .navb { padding: 0 6px; font-size: 14.5px; } .bar-r { margin-right: -6px; } }

/* the river of time: full width, no frame */
.tl { position: relative; flex: none; margin-inline: calc(50% - 50vw); }
#tl { display: block; width: 100%; height: clamp(150px, 23vh, 210px); touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
#tl.dragging { cursor: grabbing; }
#tl:focus-visible { box-shadow: inset 0 0 0 2px var(--next); }
@media (min-width: 700px) { #tl { height: clamp(200px, 27vh, 290px); } }
.swipe-hint { position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%); padding: 2px 12px; border-radius: 999px; background: var(--bg); font: 500 13.5px var(--f-ui); color: var(--muted); pointer-events: none; white-space: nowrap; transition: opacity .6s ease; animation: nudge 2.4s ease-in-out infinite; }
.swipe-hint.gone { opacity: 0; }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% - 8px)); } }

/* one rhyme: its pattern, the three steps, the current step, and the way on */
.stage { --k: var(--then-rgb); position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-top: 12px; touch-action: pan-y; }
.stage.now { --k: var(--now-rgb); }
.stage.next { --k: var(--next-rgb); }
.pattern { flex: none; display: flex; flex-direction: column; align-items: flex-start; }
.motif { margin: 0; font: italic 400 19px/1.3 var(--f-body); color: var(--ink); text-wrap: balance; }
.echoes { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; min-height: 36px; margin-top: 8px; padding: 0 12px 0 12px; border: 0; border-radius: 999px; background: rgba(var(--ink-rgb), .07); font: 500 14.5px var(--f-ui); color: var(--muted); cursor: pointer; white-space: nowrap; transition: background-color .2s; }
.echoes:hover { background: rgba(var(--ink-rgb), .12); color: var(--ink); }
.echoes b { font-weight: 600; color: var(--ink); }
.echoes .chev { font-size: 17px; line-height: 1; margin-left: -3px; opacity: .7; }
.echoes .w { display: none; }
@media (min-width: 420px) { .echoes .w { display: inline; } }
@media (max-width: 335px) { .echoes .s { display: none; } }
/* one bead for each time the rhyme has happened, Then and Today in their colours, the Next still open */
.beads { display: inline-flex; align-items: center; gap: 3px; }
.beads i { display: block; width: 6px; height: 6px; border-radius: 50%; background: rgba(var(--ink-rgb), .5); }
.beads i.then { background: var(--then); }
.beads i.now { background: var(--now); }
.beads i.next { width: 7px; height: 7px; margin-left: 3px; background: none; box-shadow: inset 0 0 0 1.5px var(--next); }
.beads.pop i { animation: beadIn .5s cubic-bezier(.3, .7, .3, 1.5) both; animation-delay: var(--d, 0s); }
@keyframes beadIn { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.sig i { display: block; width: 3px; border-radius: 1px; background: rgba(var(--ink-rgb), .2); }
.sig i:nth-child(1) { height: 4px; } .sig i:nth-child(2) { height: 7px; } .sig i:nth-child(3) { height: 10px; } .sig i:nth-child(4) { height: 13px; }
.sig.s1 i:nth-child(-n+1), .sig.s2 i:nth-child(-n+2), .sig.s3 i:nth-child(-n+3), .sig.s4 i { background: rgba(var(--ink-rgb), .82); }

/* the three steps on one track: the line fills in as you go */
.steps { --fill: 100%; position: relative; flex: none; display: grid; grid-template-columns: 4.3em minmax(0, 1fr) 4.3em minmax(0, 1fr) 4.3em; margin-top: 18px; font-size: 16px; }
.steps::before, .steps::after { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 2px; border-radius: 1px; }
.steps::before { background: rgba(var(--muted-rgb), .3); }
.steps::after { background: linear-gradient(90deg, var(--then), var(--now) 50%, var(--next)); clip-path: inset(0 var(--fill) 0 0); transition: clip-path .7s cubic-bezier(.3, .7, .2, 1); }
.steps.at-now { --fill: 50%; }
.steps.at-next { --fill: 0%; }
.st { --c: var(--then-rgb); position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 0 0 4px; border: 0; background: none; cursor: pointer; text-align: left; white-space: nowrap; }
.st.now { --c: var(--now-rgb); align-items: center; text-align: center; }
.st.next { --c: var(--next-rgb); align-items: flex-end; text-align: right; }
.st i { display: block; width: 14px; height: 14px; margin-bottom: 9px; border-radius: 50%; border: 2px solid rgb(var(--c)); background: var(--bg); transition: background-color .3s, box-shadow .3s; }
.st .sy { font: 600 17px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; color: rgba(var(--ink-rgb), .72); transition: color .3s; }
.st .sl { font: 500 13.5px/1.35 var(--f-ui); color: var(--muted); }
.st:hover .sy { color: var(--ink); }
.st.on i { background: rgb(var(--c)); box-shadow: 0 0 0 5px rgba(var(--c), .2); }
.st.on .sy { color: rgb(var(--c)); }
.st.on .sl { color: var(--ink); }
.st-g { align-self: start; min-width: 0; padding: 25px 4px 0; text-align: center; font: 500 13px/1.25 var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 380px) { .st-g .yrs { display: none; } }

/* the current step */
.story { flex: none; margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; transition: opacity .2s ease, transform .2s ease; }
.story.out { opacity: 0; transform: translateX(var(--dx, -14px)); }
.ct { margin: 0; font: 500 clamp(28px, 7.6vw, 36px)/1.1 var(--f-body); color: rgb(var(--k)); text-wrap: balance; }
.ch { margin: 0; font: 400 18.5px/1.45 var(--f-body); color: rgba(var(--ink-rgb), .88); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.cx { margin: 4px 0 0; font: 400 16.5px/1.55 var(--f-body); color: rgba(var(--ink-rgb), .7); display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.more { margin-top: 2px; min-height: 36px; padding: 0; border: 0; background: none; font: 500 15px var(--f-ui); color: var(--ink); text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .3); text-decoration-thickness: 1px; text-underline-offset: 4px; cursor: pointer; }
.more:hover { text-decoration-color: currentColor; }

/* the way on: what happens next, said once, and the one button that does it */
.foot { flex: none; margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
#cVote:empty { display: none; }
.guide { margin: 0; font: 400 15px/1.45 var(--f-ui); color: var(--muted); text-wrap: pretty; }
.actions { display: flex; gap: 8px; }
.primary, .secondary { min-height: 52px; min-width: 0; border: 0; border-radius: 14px; cursor: pointer; font: 600 16px var(--f-ui); padding: 0 16px; white-space: nowrap; }
.primary { --acc: var(--ink-rgb); flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--on-accent); background: rgb(var(--acc)); transition: background-color .3s, transform .15s; }
.primary:active { transform: scale(.985); }
.primary.to-then { --acc: var(--then-rgb); }
.primary.to-now { --acc: var(--now-rgb); }
.primary.to-next { --acc: var(--next-rgb); }
.secondary { background: rgba(var(--ink-rgb), .08); color: var(--ink); }
.secondary:hover { background: rgba(var(--ink-rgb), .13); }
.iconbtn { flex: none; width: 52px; min-height: 52px; border: 0; border-radius: 14px; background: rgba(var(--ink-rgb), .08); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { background: rgba(var(--ink-rgb), .13); }
.iconbtn svg { width: 19px; height: 19px; }
.pulse { animation: glow 2.2s ease-in-out 3; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--acc, var(--ink-rgb)), 0); } 50% { box-shadow: 0 0 0 7px rgba(var(--acc, var(--ink-rgb)), .22); } }
.vote { flex: none; display: flex; flex-direction: column; gap: 8px; }
.vote-q { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.vote-q > span:first-child { font: 500 15px var(--f-ui); color: var(--ink); }
.vote-b { display: inline-flex; gap: 6px; }
.vote-b button { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(var(--ink-rgb), .2); background: none; font: 500 14.5px var(--f-ui); cursor: pointer; }
.vote-b button:hover { border-color: rgba(var(--ink-rgb), .5); }
.vote-b button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vbar { height: 6px; border-radius: 3px; background: rgba(var(--muted-rgb), .2); overflow: hidden; }
.vbar i { display: block; height: 100%; border-radius: 3px; background: var(--next); transition: width .6s ease; }
.vres { display: flex; justify-content: space-between; gap: 8px; font: 14px var(--f-ui); color: var(--muted); }

@media (min-width: 700px) {
  .stage { padding-top: 8px; }
  .pattern { margin-top: auto; }
  .foot { margin-top: 30px; margin-bottom: auto; }
  .motif { font-size: 21px; }
  .steps { margin-top: 22px; }
  .story { margin-top: 26px; }
  .ct { font-size: 44px; }
  .ch { font-size: 21px; }
  .cx { font-size: 18px; }
}
@media (max-height: 740px) { .story { margin-top: 16px; } .steps { margin-top: 14px; } }
@media (max-height: 680px) { #tl { height: 140px; } .steps { margin-top: 12px; } .story { margin-top: 12px; } .ct { font-size: 27px; } }
@media (max-height: 650px) { .motif { font-size: 17.5px; } .guide { font-size: 14.5px; } .more { min-height: 30px; } .foot { gap: 10px; } }
@media (max-height: 600px) { .bar { min-height: 46px; } #tl { height: 128px; } .guide .gx { display: none; } .steps { margin-top: 10px; } .story { margin-top: 10px; } .foot { padding-top: 10px; } }
@media (max-height: 590px) { .echoes { margin-top: 4px; min-height: 30px; font-size: 14px; } .motif { font-size: 16.5px; } .story { margin-top: 12px; } .ct { font-size: 26px; } }
@media (max-width: 359px) { .primary { padding: 0 12px; font-size: 15px; } .actions { gap: 6px; } .iconbtn { width: 48px; } }

/* shared pieces used across the sheets */
.rchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rchip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px; border-radius: 999px; border: 1px dashed rgba(var(--muted-rgb), .55); background: none; font: 500 13.5px var(--f-ui); color: var(--muted); cursor: help; white-space: nowrap; }
.rchip:hover { border-color: var(--ink); color: var(--ink); }
.sigline { display: flex; align-items: center; gap: 8px; margin: 0; font: 600 15px var(--f-ui); color: var(--ink); }
.term { display: inline; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-decoration-color: rgba(var(--muted-rgb), .75); text-underline-offset: 3px; }
.term:hover { text-decoration-color: currentColor; }
.tip { position: fixed; z-index: 70; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); box-shadow: 0 16px 44px rgba(var(--shade), .4); }
.tip b { display: block; font: 500 21px/1.15 var(--f-body); color: var(--next); }
.tip p { margin: 4px 0 8px; font: 15px/1.45 var(--f-ui); color: var(--ink); }
.lx-g { margin: 8px 0 0; font: 600 14px var(--f-ui); color: var(--muted); }
.lx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lx li { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); scroll-margin: 16px; transition: border-color .4s; }
.lx li.hl { border-color: var(--next); }
.lx .lt { display: block; font: 500 23px/1.15 var(--f-body); color: var(--ink); }
.lx .ld { margin: 4px 0 0; font: 15.5px/1.45 var(--f-ui); }
.lx .le { margin: 6px 0 0; font: 14px/1.4 var(--f-ui); color: var(--muted); }
.lx .le span { font-weight: 600; margin-right: 6px; }
.mbox p { font-size: 18px; }
.mbox .rchips { margin-top: 8px; }
.wnote { margin: 0; font: 14px/1.4 var(--f-ui); color: var(--muted); }
.apat { display: inline-flex; align-items: center; gap: 7px; font: 500 13.5px var(--f-ui); color: var(--muted); }
.dots { display: inline-flex; flex: none; gap: 3px; }
.dots i { display: block; width: 6px; height: 6px; border-radius: 50%; border: 1.2px solid var(--muted); }
.dots i.on { background: var(--muted); }
.heard { font: 500 13.5px var(--f-ui); color: var(--muted); white-space: nowrap; }
.linkbtn { color: var(--next); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(var(--ink-rgb), .07); }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; font: 500 14.5px var(--f-ui); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(var(--shade), .2); }
.prefs { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 500 15px var(--f-ui); }

/* your future */
.fut { display: flex; flex-direction: column; gap: 10px; }
.fl { font: 600 14px var(--f-ui); color: var(--muted); }
#byear { width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid rgba(var(--next-rgb), .45); background: var(--surface); color: var(--ink); font: 500 27px var(--f-ui); padding: 0 16px; letter-spacing: .04em; }
#byear:focus { outline: 2px solid var(--next); outline-offset: 2px; }
.fnote { margin: -2px 0 0; font: 13.5px/1.4 var(--f-ui); color: var(--muted); }
.fsum { margin: 4px 0 0; font-size: 20px; line-height: 1.3; }
.fsum b { color: var(--next); font-weight: 500; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flist button { width: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 1px 12px; align-items: baseline; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.flist button:hover { border-color: rgba(var(--next-rgb), .6); }
.flist .fy { font: 600 17px var(--f-ui); color: var(--next); font-variant-numeric: tabular-nums; }
.flist .ft { font: 600 17px/1.3 var(--f-ui); color: var(--ink); }
.flist .fa { font: 600 13px var(--f-ui); color: var(--muted); white-space: nowrap; }
.flist .fe { grid-column: 2 / -1; font: 14.5px/1.4 var(--f-ui); color: rgba(var(--ink-rgb), .72); }
.fshare { margin-top: 4px; width: 100%; }
.agree { color: var(--muted); font-size: 14px; }
.ix .pct { font: 500 12.5px var(--f-ui); font-style: normal; color: var(--next); margin-top: 2px; }
.ix .newtag { align-self: flex-start; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--now); color: var(--now); font-weight: 700; }
.pz-prog { display: flex; gap: 6px; }
.pz-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.pz-prog i.cur { background: var(--ink); }
.pz-prog i.ok { background: var(--now); }
.pz-prog i.bad { background: var(--bad); }
.pz-q { margin: 0; font: 500 13px var(--f-ui); color: var(--muted); }
.pz-then { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(var(--then-rgb), .45); background: rgba(var(--then-rgb), .08); }
.pz-then .y { font: 500 13.5px var(--f-ui); color: var(--then); }
.pz-then .t { font-family: var(--f-body); font-weight: 500; font-size: 27px; line-height: 1.1; color: var(--then); }

  const now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
  const hrs = Math.max(0, Math.floor((next - now) / 36e5)), mins = Math.max(0, Math.floor((next - now) / 6e4) % 60);
  dBody.scrollTop = 0;
  dBody.innerHTML = `${pzProgress(rounds, st, -1)}
    <div class="pz-res">
      <p class="pz-score">${score}<span>/${rounds.length}</span></p>
      <p class="pz-emoji" aria-label="${score} of ${rounds.length} correct">${rounds.map((r, j) => st.answers[j] === r.pi ? "🟩" : "🟥").join("")}</p>
      <p class="pz-meta">${streak > 1 ? `${streak}-day streak · ` : ""}Next puzzle in ${hrs}h ${mins}m</p>
      <p class="pz-meta" id="pzStats"></p>
    </div>
    <button type="button" class="primary" id="pzShare">Share result</button>
    <p class="pz-q">Today's rhymes</p>
    ${rounds.map(r => goBtn(r.pi, "then", `${PAIRS[r.pi].then.year} → ${PAIRS[r.pi].now.year} → c. ${nextYear(PAIRS[r.pi])}`, true)).join("")}`;
  $("pzShare").addEventListener("click", async () => {
    const text = pzShareText(day, rounds, st), btn = $("pzShare");
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied. Paste it anywhere"; }
    catch (_) { showSharePreviewText(text); }
  });
  api(`/api/puzzle?day=${day}`).then(r => {
    const el = $("pzStats");
    if (r && el && +r.players > 1) el.textContent = `${r.players} players today · ${Math.round(100 * r.perfect / r.players)}% got all three`;
  }).catch(() => {});
}
function showSharePreviewText(text) {
  const box = document.createElement("textarea");
  box.className = "pz-copy"; box.value = text; box.readOnly = true; box.rows = 3;
  dBody.appendChild(box); box.focus(); box.select();
}
dBody.addEventListener("click", e => {

const askKey = () => { const k = store.get(AKEY, ""); return typeof k === "string" ? k : ""; };
const normQ = s => String(s).toLowerCase().replace(/[^\p{L}\p{N} ]+/gu, " ").replace(/\s+/g, " ").trim();
const askHist = () => { const h = store.get(AHIST, []); return Array.isArray(h) ? h.filter(x => x && x.q && x.a) : []; };
function saveHist(q, a) {
  const h = askHist().filter(x => normQ(x.q) !== normQ(q));

const askState = { left: null, limit: 30, plan: null, busy: false };

async function askConfigLoad() {

const fmtDay = d => { try { return new Date(d + "T00:00:00Z").toLocaleDateString(undefined, { day: "numeric", month: "long", timeZone: "UTC" }); } catch (_) { return d; } };

function askChain(a) {
  const items = [...(a.earlier || []).map(e => ({ ...e, kind: "echo" })), { ...a.then, kind: "then" }, { ...a.now, kind: "now" }].sort((x, y) => x.year - y.year);
  let h = `<ol class="cv">`;
  items.forEach((e, j) => {
    if (j) h += `<li class="cv-gap">${e.year - items[j - 1].year} years later</li>`;
    const lead = e.kind === "then" ? "Then" + (e.where ? " · " + esc(e.where) : "") : e.kind === "now" ? "Today" : "";
    h += `<li class="cv-i ${e.kind}"><span class="cv-y">${fmtY(e.year)}</span><span class="cv-d"></span><span class="cv-b">${lead ? `<span class="cv-k">${lead}</span>` : ""}<span class="cv-t">${esc(e.title)}</span>${e.line ? `<span class="cv-l">${esc(e.line)}</span>` : ""}</span></li>`;
  });
  return h + `<li class="cv-gap">+ ${a.now.year - a.then.year} years, if the rhythm holds</li>
    <li class="cv-i next"><span class="cv-y">${a.next.year ? "c. " + a.next.year : "Later"}</span><span class="cv-d"></span><span class="cv-b"><span class="cv-k">Next</span><span class="cv-t">${esc(a.next.title)}</span>${a.next.line ? `<span class="cv-l">${esc(a.next.line)}</span>` : ""}</span></li></ol>`;
}

/* the preview: types a question, "researches", then draws the rhyme, on a loop */
function demoHTML() {
  return `<div class="demo" role="img" aria-label="Preview: Ask PastForward answering “${esc(DEMOS[0].q)}” with ${DEMOS[0].a.then.year}, ${DEMOS[0].a.now.year} and c. ${DEMOS[0].a.next.year}">
    <div class="demo-bar" aria-hidden="true"><span class="demo-q"><span class="demo-t"></span><span class="demo-caret"></span></span><span class="demo-btn">Ask</span></div>
    <div class="demo-body" aria-hidden="true"></div>
    <div class="demo-foot" aria-hidden="true"><span>Preview</span><span class="dd">${DEMOS.map(() => "<i></i>").join("")}</span></div>
  </div>`;
}
function runDemo(root) {
  if (!root || root.dataset.on) return;
  root.dataset.on = "1";
  const tEl = root.querySelector(".demo-t"), body = root.querySelector(".demo-body"), btn = root.querySelector(".demo-btn"), dots = root.querySelectorAll(".dd i");
  const alive = () => root.isConnected;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reveal = () => { body.querySelectorAll(".cv-i, .cv-gap").forEach(x => x.classList.add("in")); const cv = body.querySelector(".cv"); if (cv) cv.classList.add("drawn"); };
  if (reduce) { tEl.textContent = DEMOS[0].q; body.innerHTML = askChain(DEMOS[0].a); reveal(); dots[0].classList.add("on"); return; }
  (async () => {
    for (let n = 0; alive(); n++) {
      const d = DEMOS[n % DEMOS.length];
      dots.forEach((x, i) => x.classList.toggle("on", i === n % DEMOS.length));
      body.innerHTML = ""; body.classList.remove("out"); tEl.textContent = "";
      await wait(n ? 250 : 500);
      for (const ch of d.q) { if (!alive()) return; tEl.textContent += ch; await wait(30 + Math.random() * 34); }
      await wait(380); btn.classList.add("press"); await wait(170); btn.classList.remove("press");
      body.innerHTML = `<div class="thinking"><p>Searching history for the pattern…</p><i></i><i></i><i></i></div>`;
      await wait(1500);
      if (!alive()) return;
      body.innerHTML = askChain(d.a);
      const cv = body.querySelector(".cv"); void cv.offsetWidth; cv.classList.add("drawn");
      for (const el of body.querySelectorAll(".cv-i, .cv-gap")) {
        if (!alive()) return;
        el.classList.add("in");
        await wait(el.classList.contains("cv-gap") ? 240 : el.classList.contains("next") ? 300 : 560);
      }
      await wait(3800);
      if (!alive()) return;
      body.classList.add("out");
      await wait(450);
    }
  })();
}

const THINK = ["Reading your question…", "Searching history for the pattern…", "Checking the earlier cases…", "Counting the years forward…"];
function setGo(busy) { const b = $("askGo"); if (b) { b.disabled = busy; b.textContent = busy ? "Asking…" : "Ask"; } }

async function submitAsk() {
  const ta = $("askQ");
  if (!ta || askState.busy) return;
  const q = ta.value.replace(/\s+/g, " ").trim();
  if (q.length < 3) { ta.focus(); return; }
  ta.blur();
  const prev = askHist().find(x => normQ(x.q) === normQ(q));
  if (prev) { showAnswer(prev.q, prev.a); return; }          // asked before on this device: free, instant
  const c = await askConfigLoad();
  if (!c.enabled) { openPay(c.preview ? "This is a preview. Asking works on pastforward.app." : "Ask PastForward opens soon. Here is what it does."); return; }
  const k = askKey();
  if (!k) { askPending = q; openPay(); return; }
  askState.busy = true; setGo(true);
  askOut(`<div class="thinking" aria-live="polite"><p id="thinkT">${THINK[0]}</p><i></i><i></i><i></i></div>`);
  let ti = 0;
  const tick = setInterval(() => { const el = $("thinkT"); if (el) el.textContent = THINK[ti = Math.min(ti + 1, THINK.length - 1)]; }, 1500);
  let r = null;
  try { r = await askPost("/api/ask", { key: k, q }); } catch (_) {}
  clearInterval(tick); askState.busy = false; setGo(false);
  const s = r ? r.status : 0, d = r ? r.d : {};
  if (s === 200 && d.answer) {
    saveHist(q, d.answer);
    if (typeof d.left === "number") { askState.left = d.left; askState.limit = d.limit || askState.limit; }
    renderAskMeta();
    showAnswer(q, d.answer);

  if (pn > 0) {
    const y = y0 + n * rh, ya = y0 + (n - 1) * rh + 8;
    c.save(); c.setLineDash([3, 4]); c.strokeStyle = `rgba(${RGB.next},.7)`; c.lineWidth = 2;
    c.beginPath(); c.moveTo(cx, ya); c.lineTo(cx, ya + (y - 9 - ya) * pn); c.stroke(); c.restore();
    c.save(); c.globalAlpha *= pn; c.shadowColor = `rgba(${RGB.next},.9)`; c.shadowBlur = 18 * pn; c.fillStyle = `rgb(${RGB.next})`;
    c.beginPath(); c.arc(cx, y, 7.5 * (.55 + .45 * pn), 0, 6.2832); c.fill(); c.shadowBlur = 0;
    c.textAlign = "right"; c.font = FONT.monoB(fy); c.fillText("c. " + I_NEXT, cx - 20 - 8 * (1 - pn), y + 5);
    c.textAlign = "left"; c.font = FONT.then(fn); c.fillText(IP.next.short, cx + 20 + 8 * (1 - pn), y + 5); c.restore();
  }
  // the signal meter: each bar glows in as the echoes add up
  if (lt > at(0)) {
    const label = `${Math.max(1, shown)} echo${shown === 1 ? "" : "es"} · ${sigWord(Math.max(1, shown))}`;
    c.font = FONT.monoB(15);
    const mx = Math.round((W - 40 - c.measureText(label).width) / 2), my = Math.round(y0 - rh - 14), trig = [0, 2, 3, 5];
    c.save(); c.globalAlpha *= iOut(c01((lt - at(0)) / FADE));
    for (let b = 0; b < 4; b++) {
      const bh = 6 + b * 5, on = trig[b] < n ? iOut(c01((lt - at(trig[b])) / FADE)) : 0;
      const bar = () => { c.beginPath(); c.roundRect ? c.roundRect(mx + b * 8, my - bh, 5, bh, 1.5) : c.rect(mx + b * 8, my - bh, 5, bh); c.fill(); };
      c.fillStyle = `rgba(${INK},.18)`; bar();
      if (on > 0) { c.save(); c.globalAlpha *= on; c.fillStyle = `rgb(${RGB.now})`; bar(); c.restore(); }
    }
    c.textAlign = "left"; c.font = FONT.monoB(15); c.fillStyle = `rgb(${RGB.now})`;
    c.fillText(label, mx + 40, my - 3);
    c.restore();
  }
}

/* 48 rhymes: three more, drawn quickly */
function inRows(c, W, H, lt) {
  const top = H * .03, rowH = (H * .98 - top) / I_ROWS.length, xs = [W * .16, W * .5, W * .84];
  I_ROWS.forEach((p, i) => {
    const y = Math.round(top + rowH * i + Math.min(40, rowH * .4)), st = .4 + i * 2 * BEAT;
    const pd = [0, .9, 1.7].map(d => c01((lt - st - d * BEAT) / .45));
    const pa = [.3, 1.1].map(d => iEase(c01((lt - st - d * BEAT) / .7)));
    c.strokeStyle = `rgba(${INK},${(.14 * c01((lt - st) * 3)).toFixed(3)})`; c.lineWidth = 1;
    c.beginPath(); c.moveTo(xs[0] - 30, y); c.lineTo(xs[2] + 30, y); c.stroke();
    const g = p.now.year - p.then.year, h = Math.min(rowH * .22, 24);
    const a1 = inArc(c, xs[0], xs[1], y, h, pa[0], RGB.then, RGB.now, false);
    const a2 = inArc(c, xs[1], xs[2], y, h, pa[1], RGB.now, RGB.next, true);
    if (a1) inText(c, `${g} yrs`, a1.x, a1.y - 7, FONT.mono(12), `rgba(${MUTED},${pa[0].toFixed(3)})`);
    if (a2) inText(c, `${g} yrs`, a2.x, a2.y - 7, FONT.mono(12), `rgba(${MUTED},${pa[1].toFixed(3)})`);
    [["then", p.then.year, p.then.short], ["now", p.now.year, p.now.short], ["next", "c. " + nextYear(p), p.next.short]].forEach(([kk, yr, name], j) => {
      if (pd[j] <= 0) return;
      inDot(c, xs[j], y, RGB[kk], 6, pd[j], 10);
      inText(c, String(yr), xs[j], y + 23, FONT.monoB(14), `rgba(${RGB[kk]},${pd[j].toFixed(3)})`, W);
      inText(c, name, xs[j], y + 41, FONT.then(14.5), `rgba(${INK},${(pd[j] * .85).toFixed(3)})`, W);
    });
  });
}

/* how to use it: a swipe through time, then the Then / Today / Next stepper */
function inHow(c, W, H, lt) {
  const y0 = Math.round(H * .4), span = 120;
  const cc = 1790 + (I_THEN - 1790) * iOut(c01((lt - .4) / 2.1));
  const X = y => W / 2 + (y - cc) * (W / span);
  c.strokeStyle = `rgba(${INK},.22)`; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, y0); c.lineTo(W, y0); c.stroke();
  for (let y = Math.ceil((cc - span / 2) / 10) * 10; y <= cc + span / 2; y += 10) {
    const x = X(y), big = y % 50 === 0;
    c.strokeStyle = `rgba(${INK},${big ? .35 : .15})`; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y0 - (big ? 5 : 3)); c.lineTo(x, y0 + (big ? 5 : 3)); c.stroke();
    if (big) inText(c, String(y), x, y0 + 22, FONT.mono(12), `rgba(${MUTED},.8)`);
  }
  // the focus line: whatever sits in the middle comes into focus
  c.strokeStyle = `rgba(${INK},.25)`; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(W / 2, y0 - 46); c.lineTo(W / 2, y0 - 10); c.stroke(); c.setLineDash([]);
  let best = null;
  PAIRS.forEach(p => ["then", "now"].forEach(kk => {
    const x = X(p[kk].year); if (x < -10 || x > W + 10) return;
    const d = Math.abs(x - W / 2); if (!best || d < best.d) best = { d, x, p, kk };
    c.fillStyle = `rgba(${RGB[kk]},.75)`; c.beginPath(); c.arc(x, y0, 3.4, 0, 6.2832); c.fill();
  }));
  const settled = c01((lt - 2.4) / .5);
  if (best && best.d < 6 && settled > 0) {
    inDot(c, best.x, y0, RGB[best.kk], 7, settled);
    inText(c, `${best.p[best.kk].year} ${best.p[best.kk].short}`, best.x, y0 - 22, FONT.then(17), `rgba(${INK},${settled.toFixed(3)})`, W);
  }
  // a finger swiping left
  const fs = c01((lt - .3) / 1.05);
  if (fs > 0 && fs < 1) {
    const fx = W * (.78 - .56 * iEase(fs)), fa = Math.sin(fs * Math.PI);
    c.fillStyle = `rgba(${INK},${(.28 * fa).toFixed(3)})`; c.beginPath(); c.arc(fx, y0, 20, 0, 6.2832); c.fill();
    c.strokeStyle = `rgba(${INK},${(.6 * fa).toFixed(3)})`; c.lineWidth = 1.5; c.stroke();
  }
  // the stepper, tapped in turn
  const sy = Math.round(H * .76), pw = Math.min(W * .29, 170), ph = 52, cs = [W / 2 - pw - 10, W / 2, W / 2 + pw + 10];
  const show = c01((lt - 2.7) / .45);
  if (show <= 0) return;
  [["then", "Then", I_THEN], ["now", "Today", I_NOW], ["next", "Next", "c. " + I_NEXT]].forEach(([kk, lab, yr], j) => {
    const on = c01((lt - 3.15 - j * BEAT) / .3), x = cs[j] - pw / 2;
    c.save(); c.globalAlpha *= show;
    c.fillStyle = on > 0 ? `rgba(${RGB[kk]},${(.14 * on).toFixed(3)})` : `rgba(22,19,52,.8)`;
    c.strokeStyle = on > 0 ? `rgba(${RGB[kk]},${(.4 + .6 * on).toFixed(3)})` : `rgba(${INK},.18)`;
    c.lineWidth = 1.5; if (on > 0) { c.shadowColor = `rgba(${RGB[kk]},.5)`; c.shadowBlur = 18 * on; }
    c.beginPath(); c.roundRect ? c.roundRect(x, sy - ph / 2, pw, ph, 14) : c.rect(x, sy - ph / 2, pw, ph); c.fill(); c.stroke(); c.shadowBlur = 0;
    inText(c, lab.toUpperCase(), cs[j], sy - 4, FONT.monoB(12), `rgb(${RGB[kk]})`);
    inText(c, String(yr), cs[j], sy + 15, FONT.mono(15), `rgb(${INK})`);
    const tp = c01((lt - 3.1 - j * BEAT) / .5);
    if (tp > 0 && tp < 1) { c.strokeStyle = `rgba(${INK},${(.7 * (1 - tp)).toFixed(3)})`; c.lineWidth = 2; c.beginPath(); c.arc(cs[j], sy, 10 + 26 * tp, 0, 6.2832); c.stroke(); }
    c.restore();
  });
  [0, 1].forEach(j => {
    const p = c01((lt - 3.6 - j * BEAT) / .45); if (p <= 0) return;
    inText(c, "→", (cs[j] + cs[j + 1]) / 2, sy + 6, FONT.monoB(16), `rgba(${MUTED},${(p * show).toFixed(3)})`);
  });
}

/* your future: the echoes due in one lifetime */
function inYou(c, W, H, lt) {
  const y = Math.round(H * .52), x0 = W * .09, x1 = W * .91, X = yr => x0 + (yr - I_BY) / 90 * (x1 - x0);
  const grow = iOut(c01((lt - .2) / 1.3));
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, `rgba(${MUTED},.5)`); g.addColorStop(1, `rgba(${RGB.next},.9)`);
  c.strokeStyle = g; c.lineWidth = 3; c.lineCap = "round"; c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + (x1 - x0) * grow, y); c.stroke();
  inDot(c, x0, y, MUTED, 5, c01(lt / .3), 6);
  inText(c, `Born ${I_BY}`, x0, y + 26, FONT.mono(13), `rgba(${MUTED},${c01(lt / .4).toFixed(3)})`, W);
  if (grow >= 1) inText(c, "Age 90", x1, y + 26, FONT.mono(13), `rgba(${MUTED},${c01((lt - 1.5) / .4).toFixed(3)})`, W);
  const tx = X(NOWY), ta = c01((lt - .9) / .4);
  if (ta > 0) {
    c.strokeStyle = `rgba(${RGB.now},${ta.toFixed(3)})`; c.lineWidth = 2; c.beginPath(); c.moveTo(tx, y - 9); c.lineTo(tx, y + 9); c.stroke();
    inText(c, "Today", tx, y + 26, FONT.monoB(13), `rgba(${RGB.now},${ta.toFixed(3)})`, W);
  }
  // every echo due before age 90 pops in; a few get labels, alternating above and below the line
  const all = lifeEchoes(I_BY).map(e => ({ ...e, x: X(e.y) })), labels = [];
  all.forEach(e => { if (!labels.length || e.x - labels[labels.length - 1].x >= Math.max(70, W * .2)) labels.push(e); });
  let shown = 0;
  all.forEach((e, i) => {
    const p = c01((lt - 1.6 - i * .4 * BEAT) / .4); if (p <= 0) return;
    shown++;
    inDot(c, e.x, y, RGB.next, 5.5, p, 14);
  });
  labels.slice(0, 4).forEach((e, i) => {
    const p = c01((lt - 1.75 - all.indexOf(e) * .4 * BEAT) / .45); if (p <= 0) return;
    const up = i % 2 === 0, a = c01(p * 1.5).toFixed(3), p2 = PAIRS[e.pi];
    c.strokeStyle = `rgba(${RGB.next},${(.35 * p).toFixed(3)})`; c.lineWidth = 1;
    c.beginPath(); c.moveTo(e.x, up ? y - 9 : y + 9); c.lineTo(e.x, up ? y - 20 : y + 38); c.stroke();
    inText(c, p2.next.short, e.x, up ? y - 44 : y + 56, FONT.then(15), `rgba(${INK},${a})`, W);
    inText(c, `c. ${e.y} · age ${e.y - I_BY}`, e.x, up ? y - 26 : y + 74, FONT.mono(12), `rgba(${RGB.next},${a})`, W);
  });
  if (shown) inText(c, `${shown} rhyme${shown === 1 ? "" : "s"} due in one lifetime`, W / 2, Math.round(H * .2), FONT.monoB(18), `rgba(${RGB.next},${c01((lt - 1.6) / .4).toFixed(3)})`);
}

function inSize() {
  const r = inStage.getBoundingClientRect(), d = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (w !== intro.w || h !== intro.h || d !== intro.dpr) { intro.w = w; intro.h = h; intro.dpr = d; inCv.width = Math.round(w * d); inCv.height = Math.round(h * d); }
}
function inCaption(i) {
  const s = SCENES[i], cp = CAP[s.id];
  $("inCard").innerHTML = s.view === "card" ? CARDS[s.id].map((l, j) => `<p class="ic-l${!j && CARD_LEAD[s.id] ? " lead" : ""}">${l}</p>`).join("") : "";
  const k = $("inK"); k.className = "in-k " + (cp.kc || ""); k.textContent = cp.k;
  $("inT").innerHTML = cp.t; $("inL").textContent = cp.l;
  $("inAct").innerHTML = s.id !== "end" ? "" : intro.rec ? `<p class="in-url">pastforward.app</p>`
    : `<button type="button" class="primary" data-in="start">Start with ${I_THEN} →</button>
       <div class="in-row"><button type="button" class="secondary" data-in="future">See my future</button><button type="button" class="secondary" data-in="again">Watch again</button></div>`;
  $("inProg").innerHTML = SCENES.filter(x => x.id !== "end").map(() => "<i><b></b></i>").join("");
}
function renderIntro(t) {
  inSize();
  const W = intro.w, H = intro.h, i = sceneAt(t), s = SCENES[i];
  let lt = t - s.at;
  if (i !== intro.cur) { intro.cur = i; inCaption(i); }
  const end = s.dur === Infinity;
  if (reduce && !intro.rec && !end) lt = s.dur - .001;     // reduced motion: each scene appears in its finished state
  const tt = s.at + lt;
  const c = ic;
  c.setTransform(intro.dpr, 0, 0, intro.dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  for (const st of iStars) {
    c.fillStyle = `rgba(232,226,255,${(.18 + .3 * (.5 + .5 * Math.sin(tt * st.v + st.p))).toFixed(3)})`;
    c.beginPath(); c.arc(st.x * W, st.y * H * .9, st.s, 0, 6.2832); c.fill();
  }
  const prev = SCENES[i - 1], next = SCENES[i + 1];
  const aIn = prev && prev.view === s.view ? 1 : c01(lt / .45);
  const aOut = end || !next || next.view === s.view ? 1 : c01((s.dur - lt) / .35);
  c.globalAlpha = aIn * aOut;
  if (s.view === "tl") inTimeline(c, W, H, tt);
  else if (s.view === "more") inRows(c, W, H, lt);
  else if (s.view === "echoes") inEchoes(c, W, H, lt);
  else if (s.view === "how") inHow(c, W, H, lt);
  else if (s.view === "card") inCardBg(c, W, H, lt);
  else inYou(c, W, H, lt);
  c.globalAlpha = 1;
  // caption: fade and rise in, fade out before the next scene
  const ca = (reduce && !intro.rec) ? 1 : c01(lt / .45) * (end ? 1 : c01((s.dur - lt) / .3));
  const cap = $("inCap"), cardEl = $("inCard"), isCard = s.view === "card";
  cap.style.opacity = isCard ? "0" : ca.toFixed(3);
  cardEl.style.opacity = isCard ? ((reduce && !intro.rec) ? 1 : c01((s.dur - lt) / .55)).toFixed(3) : "0";
  if (isCard) cardEl.querySelectorAll(".ic-l").forEach((el, j) => {
    const r = (reduce && !intro.rec) ? 1 : iOut(c01((lt - .7 - j * CARD_GAP) / 1.1));
    el.style.opacity = r.toFixed(3);
    el.style.transform = `translateY(${((1 - r) * 16).toFixed(1)}px) scale(${(1.03 - .03 * r).toFixed(4)})`;
    el.style.filter = r < 1 ? `blur(${((1 - r) * 7).toFixed(2)}px)` : "none";
  });
  cap.style.transform = `translateY(${((1 - iOut(c01(lt / .5))) * 12).toFixed(1)}px)`;
  const rh = $("inRhymes");
  if (rh) {
    const r = (reduce && !intro.rec) ? 1 : c01((lt - I_REVEAL) / .5);
    rh.style.display = "inline-block";
    rh.style.opacity = r.toFixed(3);
    rh.style.transform = `translateY(${((1 - iOut(r)) * 10).toFixed(1)}px)`;
  }
  $("inProg").querySelectorAll("b").forEach((b, j) => { b.style.width = (j < i ? 100 : j === i ? 100 * c01(lt / s.dur) : 0) + "%"; });
  $("inTap").style.visibility = end || intro.rec ? "hidden" : "visible";
  introEl.classList.toggle("rec", intro.rec);
  $("inSkip").style.visibility = end || intro.rec ? "hidden" : "visible";
}
function introLoop(now) {
  if (!intro.open) return;
  const dt = Math.min(.05, (now - intro.last) / 1000); intro.last = now;
  if (!document.hidden && !intro.rec) intro.t += dt;
  renderIntro(intro.t);
  intro.raf = requestAnimationFrame(introLoop);
}
function openIntro(rec) {
  if (intro.open) return;
  intro.open = true; intro.rec = !!rec; intro.t = 0; intro.cur = -1;
  introEl.style.transition = rec ? "none" : "";
  introEl.hidden = false; void introEl.offsetWidth; introEl.classList.add("open");
  document.documentElement.classList.add("lock");
  if (!rec) { intro.last = performance.now(); intro.raf = requestAnimationFrame(introLoop); $("inSkip").focus({ preventScroll: true }); }
}
function closeIntro(after) {
  if (!intro.open) return;
  intro.open = false; cancelAnimationFrame(intro.raf);
  store.set(INTRO_KEY, 1);
  introEl.classList.remove("open");
  setTimeout(() => { introEl.hidden = true; }, reduce ? 0 : 450);
  if (dwrap.hidden && pwWrap.hidden) document.documentElement.classList.remove("lock");
  if (after) after();
}
function introStep(d) {
  const i = sceneAt(intro.t), j = Math.max(0, Math.min(SCENES.length - 1, i + d));
  intro.t = d < 0 && intro.t - SCENES[i].at > 1 ? SCENES[i].at : SCENES[j].at;
}
introEl.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) { if (sceneAt(intro.t) < SCENES.length - 1) introStep(1); return; }
  if (b.id === "inSkip") return closeIntro(() => $("jump").focus({ preventScroll: true }));
  const a = b.dataset.in;
  if (a === "again") { intro.t = 0; intro.cur = -1; }
  else if (a === "future") closeIntro(() => setTimeout(openFuture, 250));
  else if (a === "start") closeIntro(() => {
    const fi = PAIRS.indexOf(IP);
    if (!focus || focus.pi !== fi || focus.k !== "then") travel(fi, "then");
    if (!reduce) $("jump").classList.add("pulse");
    $("jump").focus({ preventScroll: true });
  });
});
document.addEventListener("keydown", e => {
  if (!intro.open) return;
  if (e.key === "Escape") { e.stopImmediatePropagation(); closeIntro(); }
  else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); introStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); introStep(-1); }
}, true);
$("logo").addEventListener("click", () => openIntro());
window.__pastforward = Object.assign(window.__pastforward || {}, {
  introLength: INTRO_END + 2.5,
  introFrame: t => { if (!intro.open) openIntro(true); renderIntro(t); }
});

/* ---------- night sky ---------- */
const sky = $("sky"), sctx = sky.getContext("2d");
let stars = [];
function sizeSky() {
  sky.width = Math.round(innerWidth * DPR); sky.height = Math.round(innerHeight * DPR);
  const n = Math.min(140, Math.round(innerWidth * innerHeight / 12000));
  stars = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * .9 + .25, p: Math.random() * 6.28, s: .4 + Math.random() * 1.4 }));
}
function drawSky(t) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, innerWidth, innerHeight);
  if (!TC.dark) return;
  for (const s of stars) {
    const a = reduce ? .35 : .15 + .4 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    c.fillStyle = `rgba(232,226,255,${a.toFixed(3)})`;
    c.beginPath(); c.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, 6.2832); c.fill();
  }
}

/* ---------- hint ---------- */
const hint = $("hint");
function hideHint() { hint.classList.add("gone"); }
setTimeout(hideHint, 6000);

/* ---------- loop ---------- */
let lastT = performance.now(), frame = 0;
function loop(t) {
  const dt = Math.min(48, t - lastT); lastT = t;
  if (!document.hidden && !intro.open) {
    stepFly(t); stepInertia(dt);
    draw(t); drawWorld(t);
    if (frame++ % 2 === 0) drawSky(t);
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => mcache.clear());

/* ---------- start ---------- */
resize();
const pathId = location.pathname.match(/^\/r\/([a-z0-9_-]+)\/?$/);
const h = pathId ? pathId[1] : decodeURIComponent(location.hash.slice(1));
let start = PAIRS.findIndex(p => p.id === h);
const linked = start >= 0;
if (start < 0) start = PAIRS.findIndex(p => p.id === "flu");
if (start < 0) start = 0;
cam.c = EVI[start].then.yx; cam.s = defaultScale(); clampCam();
setFocus(start, "then", 1, true);
if (linked) syncURL(start);   // a shared link: keep it as the clean /r/<id> address
else if (OWN_HOST && location.hash) { try { history.replaceState(null, "", "/"); } catch (e) {} }
if (!reduce) $("jump").classList.add("pulse");
updateDailyDot();
loadScores();
if (h === "daily") setTimeout(openDaily, 400);
if (h === "ask") setTimeout(() => openAsk(), 400);
// first visit to the home page: show what PastForward is (shared links go straight to their rhyme)
if (!linked && !h && !store.get(INTRO_KEY, 0)) setTimeout(() => openIntro(), 450);
requestAnimationFrame(loop);
})();
</script>
