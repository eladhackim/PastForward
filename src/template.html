<title>PastForward</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Atkinson+Hyperlegible:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap">
<style>
/* Layout: one phone screen. A swipeable river of time on top (about 50 years per screen, snapping to events),
   a Then → Today → Next stepper, one story card with a big jump button. Depth lives in a full-screen "dive deeper" view.
   Deliberately single-theme (night sky). */
:root {
  color-scheme: dark;
  --bg: #0C0A1D;
  --surface: #161334;
  --surface2: #1E1A46;
  --ink: #EFE8D6;
  --muted: #ABA6C9;
  --line: #2E2955;
  --then: #E2B35E;
  --now: #72D3C5;
  --next: #CDB9FF;
  --bad: #E58C7A;
  --f-then: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-mono: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Newsreader", "Iowan Old Style", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  height: 100%; margin: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background:
    radial-gradient(ellipse 90% 40% at 10% 0%, rgba(120, 92, 210, .17), transparent 70%),
    radial-gradient(ellipse 80% 50% at 100% 100%, rgba(70, 170, 160, .08), transparent 70%),
    var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; min-height: 560px; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 10px 14px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--next); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
h1 { margin: 0; font-family: var(--f-then); font-weight: 400; font-size: clamp(19px, 5.4vw, 24px); line-height: 1; white-space: nowrap; }
h1 .p { color: var(--then); }
h1 .f { color: var(--next); text-shadow: 0 0 18px rgba(205, 185, 255, .45); }
.bar-r { display: flex; gap: 6px; }
.ghost { position: relative; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(22, 19, 52, .7); font: 700 14px var(--f-mono); letter-spacing: .01em; cursor: pointer; }
.ghost.icon { width: 38px; padding: 0; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.ghost.daily { color: var(--then); border-color: rgba(226, 179, 94, .5); background: rgba(226, 179, 94, .09); }
.ghost.daily.new::after { content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--then); box-shadow: 0 0 8px var(--then); }
.ghost.hi { color: var(--next); border-color: rgba(205, 185, 255, .55); background: rgba(205, 185, 255, .1); box-shadow: 0 0 18px rgba(205, 185, 255, .15); }
.ghost svg, .iconbtn svg { width: 18px; height: 18px; }
.ghost:hover { border-color: var(--next); }

/* timeline */
.tl { position: relative; flex: none; background: rgba(22, 19, 52, .55); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
@media (max-width: 699px) {
  .tl {
    margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    border-radius: 0; border-left: 0; border-right: 0;
  }
}
#tl { display: block; width: 100%; height: 184px; touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
#tl.dragging { cursor: grabbing; }
#tl:focus-visible { box-shadow: inset 0 0 0 2px var(--next); }
@media (min-width: 700px) { #tl { height: 220px; } }
.swipe-hint { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); font: 500 13px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); background: rgba(12, 10, 29, .85); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; transition: opacity .6s ease; animation: nudge 1.8s ease-in-out infinite; }
.swipe-hint.gone { opacity: 0; }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% - 10px)); } }

/* the rhyme + stepper */
.rhyme { flex: none; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 640px; margin: 0 auto; }
.theme { margin: 2px 0 0; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; font-size: 17px; color: var(--muted); line-height: 1.25; }
.theme b { font-weight: 500; color: var(--ink); }
.rchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rchip { display: inline-flex; align-items: center; gap: 7px; min-height: 26px; padding: 0 10px; border-radius: 999px; border: 1px dashed rgba(171, 166, 201, .5); background: none; font: 700 12.5px var(--f-mono); color: var(--muted); cursor: help; white-space: nowrap; }
.rchip:hover { border-color: var(--ink); color: var(--ink); }
.heard { font: 700 12.5px var(--f-mono); color: var(--next); white-space: nowrap; }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; margin-right: 7px; }
.sig i { display: block; width: 3px; border-radius: 1px; background: rgba(239, 232, 214, .22); }
.sig i:nth-child(1) { height: 4px; } .sig i:nth-child(2) { height: 7px; } .sig i:nth-child(3) { height: 10px; } .sig i:nth-child(4) { height: 13px; }
.sig.s1 i:nth-child(-n+1), .sig.s2 i:nth-child(-n+2), .sig.s3 i:nth-child(-n+3), .sig.s4 i { background: var(--now); }
@media (max-width: 379px) { .rchips .heard { display: none; } }
.sigline { display: flex; align-items: center; gap: 2px; margin: 0; font: 700 14px var(--f-mono); color: var(--now); }
.term { display: inline; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-decoration-color: rgba(171, 166, 201, .75); text-underline-offset: 3px; }
.term:hover { text-decoration-color: currentColor; }
.tip { position: fixed; z-index: 70; padding: 12px 14px; border-radius: 14px; border: 1px solid rgba(205, 185, 255, .45); background: var(--surface2); box-shadow: 0 16px 44px rgba(0, 0, 0, .55); }
.tip b { display: block; font: 500 21px/1.15 var(--f-body); color: var(--next); }
.tip p { margin: 4px 0 8px; font: 15px/1.45 var(--f-mono); color: var(--ink); }
.lx-g { margin: 8px 0 0; font: 700 13px var(--f-mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.lx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lx li { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); scroll-margin: 16px; transition: border-color .4s; }
.lx li.hl { border-color: var(--next); box-shadow: 0 0 22px rgba(205, 185, 255, .15); }
.lx .lt { display: block; font: 500 23px/1.15 var(--f-body); color: var(--ink); }
.lx .ld { margin: 4px 0 0; font: 15.5px/1.45 var(--f-mono); }
.lx .le { margin: 6px 0 0; font: 14px/1.4 var(--f-mono); color: var(--muted); }
.lx .le span { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; font-size: 11.5px; margin-right: 6px; }
.mbox p { font-size: 18px; }
.mbox .rchips { margin-top: 8px; }
.wnote { margin: 0; font: 14px/1.4 var(--f-mono); color: var(--muted); }
.apat { font: 700 12.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.chainchip { display: inline-flex; align-items: center; vertical-align: 2px; margin-left: 4px; min-height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(239, 232, 214, .3); background: rgba(239, 232, 214, .06); font: 700 12.5px var(--f-mono); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chainchip:hover { border-color: var(--ink); }
.theme .dots { flex: none; display: inline-flex; gap: 3px; transform: translateY(-1px); }
.dots { display: inline-flex; flex: none; gap: 3px; }
.dots i { display: block; width: 6px; height: 6px; border-radius: 50%; border: 1.2px solid var(--muted); }
.dots i.on { background: var(--muted); }
.stepper { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; }
.st-b { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 4px 6px; min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: rgba(22, 19, 52, .7); cursor: pointer; transition: background-color .3s, border-color .3s, box-shadow .3s; }
.st-b .sl { font: 500 12.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.st-b .sy { font: 500 16px var(--f-mono); }
.st-b.then .sl { color: var(--then); } .st-b.now .sl { color: var(--now); } .st-b.next .sl { color: var(--next); }
.st-b.on.then { background: rgba(226, 179, 94, .14); border-color: var(--then); box-shadow: 0 0 22px rgba(226, 179, 94, .18); }
.st-b.on.now { background: rgba(114, 211, 197, .13); border-color: var(--now); box-shadow: 0 0 22px rgba(114, 211, 197, .18); }
.st-b.on.next { background: rgba(205, 185, 255, .13); border-color: var(--next); box-shadow: 0 0 22px rgba(205, 185, 255, .2); }
.st-g { font: 500 13px var(--f-mono); color: var(--muted); text-align: center; line-height: 1.15; white-space: nowrap; }
.st-g b { display: block; color: var(--ink); font-weight: 500; font-size: 12px; }

/* card */
.card { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; touch-action: pan-y; transition: border-color .4s, box-shadow .4s; }
.card.then { border-color: rgba(226, 179, 94, .35); }
.card.now { border-color: rgba(114, 211, 197, .35); }
.card.next { border-color: rgba(205, 185, 255, .4); background: radial-gradient(ellipse 100% 70% at 50% 0%, rgba(205, 185, 255, .14), transparent 75%), var(--surface); box-shadow: 0 0 40px rgba(205, 185, 255, .08); }
.card-in { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; transition: opacity .2s ease, transform .2s ease; }
.card-in.out { opacity: 0; transform: translateX(var(--dx, -14px)); }
.ck { margin: 0; font: 500 13.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.ck .lb { margin-right: 6px; }
.card.then .ck .lb { color: var(--then); } .card.now .ck .lb { color: var(--now); } .card.next .ck .lb { color: var(--next); }
.ct { margin: 0; font-weight: 400; line-height: 1.08; text-wrap: balance; }
.card.then .ct { font-family: var(--f-body); font-weight: 500; font-size: clamp(26px, 7.2vw, 34px); color: var(--then); }
.card.now .ct { font-family: var(--f-body); font-weight: 500; font-size: clamp(26px, 7.2vw, 34px); color: var(--now); }
.card.next .ct { font-family: var(--f-body); font-weight: 500; font-size: clamp(25px, 7vw, 34px); color: var(--next); text-shadow: 0 0 22px rgba(205, 185, 255, .3); }
.ch { margin: 0; font-size: 18.5px; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }

.card-in { flex: 0 1 auto; }
.glimpse { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.gl-map { position: relative; flex: 1 1 auto; min-height: 0; display: block; border-radius: 12px; background: radial-gradient(ellipse 70% 80% at 50% 45%, rgba(120, 92, 210, .12), transparent 75%); }
#gmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.eqm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.eqm[hidden] { display: none; }
.eqm svg { width: 100%; height: 100%; max-height: 120px; overflow: visible; }
.gl-cap { flex: none; display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 0 2px; }
.gl-row { display: flex; justify-content: space-between; gap: 8px; }
.gl-more { font: 500 12.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.gl-k { flex: none; font: 500 12.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.gl-t { min-width: 0; font-size: 16.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s ease; }
.gl-t b { font: 500 12.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 6px; font-weight: 500; }
.gl-t.fade { opacity: 0; }
.glimpse:hover .gl-k { color: var(--ink); }
.actions { flex: none; display: flex; gap: 8px; }
.primary, .secondary { min-height: 48px; border-radius: 14px; cursor: pointer; font: 700 15px var(--f-mono); padding: 0 12px; white-space: nowrap; }
.primary { flex: 1.5; border: 0; color: var(--bg); background: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.card.then .primary { background: linear-gradient(90deg, var(--then), var(--now)); }
.card.now .primary { background: linear-gradient(90deg, var(--now), var(--next)); }
.card.next .primary { background: var(--next); }
.secondary { flex: 1; border: 1px solid var(--line); background: rgba(12, 10, 29, .6); }
.secondary:hover { border-color: var(--ink); }
.iconbtn { flex: none; width: 48px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: rgba(12, 10, 29, .6); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { border-color: var(--next); color: var(--next); }
/* your future */
.fut { display: flex; flex-direction: column; gap: 10px; }
.fl { font: 500 13px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#byear { width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid rgba(205, 185, 255, .45); background: var(--surface); color: var(--ink); font: 500 27px var(--f-mono); padding: 0 16px; letter-spacing: .06em; }
#byear:focus { outline: 2px solid var(--next); outline-offset: 2px; }
.fnote { margin: -2px 0 0; font: 13px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.fsum { margin: 4px 0 0; font-size: 20px; line-height: 1.3; }
.fsum b { color: var(--next); font-weight: 500; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flist button { width: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 1px 12px; align-items: baseline; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.flist button:hover { border-color: rgba(205, 185, 255, .6); }
.flist .fy { font: 700 17px var(--f-mono); color: var(--next); font-variant-numeric: tabular-nums; }
.flist .ft { font: 700 17px/1.3 var(--f-mono); color: var(--ink); }
.flist .fa { font: 700 13px var(--f-mono); color: var(--muted); white-space: nowrap; }
.flist .fe { grid-column: 2 / -1; font: 14px/1.35 var(--f-mono); color: rgba(239, 232, 214, .72); }
.fshare { margin-top: 4px; width: 100%; }
.vote { flex: none; display: flex; flex-direction: column; gap: 7px; }
.vote-q { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.vote-q > span:first-child { font: 500 13px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.vote-b { display: inline-flex; gap: 6px; }
.vote-b button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(12, 10, 29, .6); font: 500 13.5px var(--f-mono); cursor: pointer; }
.vote-b button:hover { border-color: var(--ink); }
.vote-b button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vbar { height: 7px; border-radius: 4px; background: rgba(157, 151, 188, .2); overflow: hidden; }
.vbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--now), var(--next)); transition: width .6s ease; }
.vres { display: flex; justify-content: space-between; gap: 8px; font: 13.5px var(--f-mono); color: var(--muted); }
.agree { color: var(--muted); font-size: 14px; }
.ix .pct { font: 500 12.5px var(--f-mono); font-style: normal; color: var(--next); margin-top: 2px; }
.pz-prog { display: flex; gap: 6px; }
.pz-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.pz-prog i.cur { background: var(--ink); }
.pz-prog i.ok { background: var(--now); }
.pz-prog i.bad { background: var(--bad); }
.pz-q { margin: 0; font: 500 13px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.pz-then { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(226, 179, 94, .45); background: rgba(226, 179, 94, .08); }
.pz-then .y { font: 500 13.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--then); }
.pz-then .t { font-family: var(--f-body); font-weight: 500; font-size: 27px; line-height: 1.1; color: var(--then); }
.pz-then .h { font-size: 17.5px; line-height: 1.4; }
.pz-opts { display: flex; flex-direction: column; gap: 6px; }
.pz-opts button { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; align-items: baseline; text-align: left; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s, background-color .2s, opacity .3s; }
.pz-opts button:hover:not(:disabled) { border-color: var(--now); }
.pz-opts .oy { font: 500 15px var(--f-mono); color: var(--now); }
.pz-opts .ot { font-size: 17px; line-height: 1.25; }
.pz-opts button:disabled { cursor: default; opacity: .45; }
.pz-opts button.ok { opacity: 1; border-color: var(--now); background: rgba(114, 211, 197, .15); }
.pz-opts button.bad { opacity: 1; border-color: var(--bad); background: rgba(229, 140, 122, .13); }
.pz-rev { display: flex; flex-direction: column; gap: 8px; }
.pz-rev:empty { display: none; }
.pz-verdict { margin: 0; font-size: 18px; font-weight: 500; }
.pz-verdict.ok { color: var(--now); } .pz-verdict.bad { color: var(--bad); }
.pz-next { margin: 0; font-size: 16.5px; }
.pz-next b { color: var(--next); font: 500 16px var(--f-mono); }
.pz-next i { color: var(--next); font-style: normal; }
.pz-go, #pzShare { width: 100%; flex: none; }
.pz-res { text-align: center; display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
.pz-score { margin: 0; font: 500 72px/1 var(--f-body); }
.pz-score span { font-size: 36px; color: var(--muted); }
.pz-emoji { margin: 4px 0 0; font-size: 30px; letter-spacing: 6px; }
.pz-meta { margin: 0; font: 13.5px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.pz-meta:empty { display: none; }
.pz-copy { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 15px var(--f-mono); padding: 10px 12px; resize: none; }
.how summary { cursor: pointer; font: 500 13.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
.how[open] summary { color: var(--ink); }
.how .hb { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 4px; }
.sharebox { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.sharebox img { display: block; width: auto; max-width: 100%; max-height: 58vh; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.sharebox p { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
.linkrow { display: flex; gap: 8px; width: 100%; }
.linkrow input { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 14.5px var(--f-mono); padding: 0 12px; }
.pulse { animation: glow 2.2s ease-in-out 3; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 232, 214, 0); } 50% { box-shadow: 0 0 0 6px rgba(239, 232, 214, .12); } }

/* deep view */
.deep-wrap { position: fixed; inset: 0; z-index: 40; }
.deep-bd { position: absolute; inset: 0; background: rgba(5, 4, 14, .7); opacity: 0; transition: opacity .3s; }
.deep {

.meta { font: 13px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); display: flex; gap: 8px; align-items: center; }

.cv { list-style: none; margin: 0; padding: 0; position: relative; }

  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: radial-gradient(ellipse 90% 45% at 50% 32%, rgba(120, 92, 210, .2), transparent 70%), radial-gradient(ellipse 70% 40% at 100% 100%, rgba(70, 170, 160, .08), transparent 70%), var(--bg);
  opacity: 0; transition: opacity .45s ease; }

.demo-foot { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 6px 12px 9px; font: 700 11px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

}

  c.strokeStyle = `rgba(${INK},.22)`; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, y0); c.lineTo(W, y0); c.stroke();
  for (let y = Math.ceil((cc - span / 2) / 10) * 10; y <= cc + span / 2; y += 10) {
    const x = X(y), big = y % 50 === 0;
    c.strokeStyle = `rgba(${INK},${big ? .35 : .15})`; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y0 - (big ? 5 : 3)); c.lineTo(x, y0 + (big ? 5 : 3)); c.stroke();
    if (big) inText(c, String(y), x, y0 + 22, FONT.mono(12), `rgba(${MUTED},.8)`);
  }
  // the focus line: whatever sits in the middle comes into focus
  c.strokeStyle = `rgba(${INK},.25)`; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(W / 2, y0 - 46); c.lineTo(W / 2, y0 - 10); c.stroke(); c.setLineDash([]);
  let best = null;
  PAIRS.forEach(p => ["then", "now"].forEach(kk => {
    const x = X(p[kk].year); if (x < -10 || x > W + 10) return;
    const d = Math.abs(x - W / 2); if (!best || d < best.d) best = { d, x, p, kk };
    c.fillStyle = `rgba(${RGB[kk]},.75)`; c.beginPath(); c.arc(x, y0, 3.4, 0, 6.2832); c.fill();
  }));
  const settled = c01((lt - 2.4) / .5);
  if (best && best.d < 6 && settled > 0) {
    inDot(c, best.x, y0, RGB[best.kk], 7, settled);
    inText(c, `${best.p[best.kk].year} ${best.p[best.kk].short}`, best.x, y0 - 22, FONT.then(17), `rgba(${INK},${settled.toFixed(3)})`, W);
  }
  // a finger swiping left
  const fs = c01((lt - .3) / 1.05);
  if (fs > 0 && fs < 1) {
    const fx = W * (.78 - .56 * iEase(fs)), fa = Math.sin(fs * Math.PI);
    c.fillStyle = `rgba(${INK},${(.28 * fa).toFixed(3)})`; c.beginPath(); c.arc(fx, y0, 20, 0, 6.2832); c.fill();
    c.strokeStyle = `rgba(${INK},${(.6 * fa).toFixed(3)})`; c.lineWidth = 1.5; c.stroke();
  }
  // the stepper, tapped in turn
  const sy = Math.round(H * .76), pw = Math.min(W * .29, 170), ph = 52, cs = [W / 2 - pw - 10, W / 2, W / 2 + pw + 10];
  const show = c01((lt - 2.7) / .45);
  if (show <= 0) return;
  [["then", "Then", I_THEN], ["now", "Today", I_NOW], ["next", "Next", "c. " + I_NEXT]].forEach(([kk, lab, yr], j) => {
    const on = c01((lt - 3.15 - j * BEAT) / .3), x = cs[j] - pw / 2;
    c.save(); c.globalAlpha *= show;
    c.fillStyle = on > 0 ? `rgba(${RGB[kk]},${(.14 * on).toFixed(3)})` : `rgba(22,19,52,.8)`;
    c.strokeStyle = on > 0 ? `rgba(${RGB[kk]},${(.4 + .6 * on).toFixed(3)})` : `rgba(${INK},.18)`;
    c.lineWidth = 1.5; if (on > 0) { c.shadowColor = `rgba(${RGB[kk]},.5)`; c.shadowBlur = 18 * on; }
    c.beginPath(); c.roundRect ? c.roundRect(x, sy - ph / 2, pw, ph, 14) : c.rect(x, sy - ph / 2, pw, ph); c.fill(); c.stroke(); c.shadowBlur = 0;
    inText(c, lab.toUpperCase(), cs[j], sy - 4, FONT.monoB(12), `rgb(${RGB[kk]})`);
    inText(c, String(yr), cs[j], sy + 15, FONT.mono(15), `rgb(${INK})`);
    const tp = c01((lt - 3.1 - j * BEAT) / .5);
    if (tp > 0 && tp < 1) { c.strokeStyle = `rgba(${INK},${(.7 * (1 - tp)).toFixed(3)})`; c.lineWidth = 2; c.beginPath(); c.arc(cs[j], sy, 10 + 26 * tp, 0, 6.2832); c.stroke(); }
    c.restore();
  });
  [0, 1].forEach(j => {
    const p = c01((lt - 3.6 - j * BEAT) / .45); if (p <= 0) return;
    inText(c, "→", (cs[j] + cs[j + 1]) / 2, sy + 6, FONT.monoB(16), `rgba(${MUTED},${(p * show).toFixed(3)})`);
  });
}

/* your future: the echoes due in one lifetime */
function inYou(c, W, H, lt) {
  const y = Math.round(H * .52), x0 = W * .09, x1 = W * .91, X = yr => x0 + (yr - I_BY) / 90 * (x1 - x0);
  const grow = iOut(c01((lt - .2) / 1.3));
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, `rgba(${MUTED},.5)`); g.addColorStop(1, `rgba(${RGB.next},.9)`);
  c.strokeStyle = g; c.lineWidth = 3; c.lineCap = "round"; c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + (x1 - x0) * grow, y); c.stroke();
  inDot(c, x0, y, MUTED, 5, c01(lt / .3), 6);
  inText(c, `Born ${I_BY}`, x0, y + 26, FONT.mono(13), `rgba(${MUTED},${c01(lt / .4).toFixed(3)})`, W);
  if (grow >= 1) inText(c, "Age 90", x1, y + 26, FONT.mono(13), `rgba(${MUTED},${c01((lt - 1.5) / .4).toFixed(3)})`, W);
  const tx = X(NOWY), ta = c01((lt - .9) / .4);
  if (ta > 0) {
    c.strokeStyle = `rgba(${RGB.now},${ta.toFixed(3)})`; c.lineWidth = 2; c.beginPath(); c.moveTo(tx, y - 9); c.lineTo(tx, y + 9); c.stroke();
    inText(c, "Today", tx, y + 26, FONT.monoB(13), `rgba(${RGB.now},${ta.toFixed(3)})`, W);
  }
  // every echo due before age 90 pops in; a few get labels, alternating above and below the line
  const all = lifeEchoes(I_BY).map(e => ({ ...e, x: X(e.y) })), labels = [];
  all.forEach(e => { if (!labels.length || e.x - labels[labels.length - 1].x >= Math.max(70, W * .2)) labels.push(e); });
  let shown = 0;
  all.forEach((e, i) => {
    const p = c01((lt - 1.6 - i * .4 * BEAT) / .4); if (p <= 0) return;
    shown++;
    inDot(c, e.x, y, RGB.next, 5.5, p, 14);
  });
  labels.slice(0, 4).forEach((e, i) => {
    const p = c01((lt - 1.75 - all.indexOf(e) * .4 * BEAT) / .45); if (p <= 0) return;
    const up = i % 2 === 0, a = c01(p * 1.5).toFixed(3), p2 = PAIRS[e.pi];
    c.strokeStyle = `rgba(${RGB.next},${(.35 * p).toFixed(3)})`; c.lineWidth = 1;
    c.beginPath(); c.moveTo(e.x, up ? y - 9 : y + 9); c.lineTo(e.x, up ? y - 20 : y + 38); c.stroke();
    inText(c, p2.next.short, e.x, up ? y - 44 : y + 56, FONT.then(15), `rgba(${INK},${a})`, W);
    inText(c, `c. ${e.y} · age ${e.y - I_BY}`, e.x, up ? y - 26 : y + 74, FONT.mono(12), `rgba(${RGB.next},${a})`, W);
  });
  if (shown) inText(c, `${shown} rhyme${shown === 1 ? "" : "s"} due in one lifetime`, W / 2, Math.round(H * .2), FONT.monoB(18), `rgba(${RGB.next},${c01((lt - 1.6) / .4).toFixed(3)})`);
}

function inSize() {
  const r = inStage.getBoundingClientRect(), d = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (w !== intro.w || h !== intro.h || d !== intro.dpr) { intro.w = w; intro.h = h; intro.dpr = d; inCv.width = Math.round(w * d); inCv.height = Math.round(h * d); }
}
function inCaption(i) {
  const s = SCENES[i], cp = CAP[s.id];
  const k = $("inK"); k.className = "in-k " + (cp.kc || ""); k.textContent = cp.k;
  $("inT").innerHTML = cp.t; $("inL").textContent = cp.l;
  $("inAct").innerHTML = s.id !== "end" ? "" : intro.rec ? `<p class="in-url">pastforward.app</p>`
    : `<button type="button" class="primary" data-in="start">Start with ${I_THEN} →</button>
       <div class="in-row"><button type="button" class="secondary" data-in="future">See my future</button><button type="button" class="secondary" data-in="again">Watch again</button></div>`;
  $("inProg").innerHTML = SCENES.filter(x => x.id !== "end").map(() => "<i><b></b></i>").join("");
}
function renderIntro(t) {
  inSize();
  const W = intro.w, H = intro.h, i = sceneAt(t), s = SCENES[i];
  let lt = t - s.at;
  if (i !== intro.cur) { intro.cur = i; inCaption(i); }
  const end = s.dur === Infinity;
  if (reduce && !intro.rec && !end) lt = s.dur - .001;     // reduced motion: each scene appears in its finished state
  const tt = s.at + lt;
  const c = ic;
  c.setTransform(intro.dpr, 0, 0, intro.dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  for (const st of iStars) {
    c.fillStyle = `rgba(232,226,255,${(.18 + .3 * (.5 + .5 * Math.sin(tt * st.v + st.p))).toFixed(3)})`;
    c.beginPath(); c.arc(st.x * W, st.y * H * .9, st.s, 0, 6.2832); c.fill();
  }
  const prev = SCENES[i - 1], next = SCENES[i + 1];
  const aIn = prev && prev.view === s.view ? 1 : c01(lt / .45);
  const aOut = end || !next || next.view === s.view ? 1 : c01((s.dur - lt) / .35);
  c.globalAlpha = aIn * aOut;
  if (s.view === "tl") inTimeline(c, W, H, tt);
  else if (s.view === "more") inRows(c, W, H, lt);
  else if (s.view === "echoes") inEchoes(c, W, H, lt);
  else if (s.view === "how") inHow(c, W, H, lt);
  else inYou(c, W, H, lt);
  c.globalAlpha = 1;
  // caption: fade and rise in, fade out before the next scene
  const ca = (reduce && !intro.rec) ? 1 : c01(lt / .45) * (end ? 1 : c01((s.dur - lt) / .3));
  const cap = $("inCap");
  cap.style.opacity = ca.toFixed(3);
  cap.style.transform = `translateY(${((1 - iOut(c01(lt / .5))) * 12).toFixed(1)}px)`;
  const rh = $("inRhymes");
  if (rh) {
    const r = (reduce && !intro.rec) ? 1 : c01((lt - I_REVEAL) / .5);
    rh.style.display = "inline-block";
    rh.style.opacity = r.toFixed(3);
    rh.style.transform = `translateY(${((1 - iOut(r)) * 10).toFixed(1)}px)`;
  }
  $("inProg").querySelectorAll("b").forEach((b, j) => { b.style.width = (j < i ? 100 : j === i ? 100 * c01(lt / s.dur) : 0) + "%"; });
  $("inTap").style.visibility = end || intro.rec ? "hidden" : "visible";
  $("inSkip").style.visibility = end || intro.rec ? "hidden" : "visible";
}
function introLoop(now) {
  if (!intro.open) return;
  const dt = Math.min(.05, (now - intro.last) / 1000); intro.last = now;
  if (!document.hidden && !intro.rec) intro.t += dt;
  renderIntro(intro.t);
  intro.raf = requestAnimationFrame(introLoop);
}
function openIntro(rec) {
  if (intro.open) return;
  intro.open = true; intro.rec = !!rec; intro.t = 0; intro.cur = -1;
  introEl.style.transition = rec ? "none" : "";
  introEl.hidden = false; void introEl.offsetWidth; introEl.classList.add("open");
  document.documentElement.classList.add("lock");
  if (!rec) { intro.last = performance.now(); intro.raf = requestAnimationFrame(introLoop); $("inSkip").focus({ preventScroll: true }); }
}
function closeIntro(after) {
  if (!intro.open) return;
  intro.open = false; cancelAnimationFrame(intro.raf);
  store.set(INTRO_KEY, 1);
  introEl.classList.remove("open");
  setTimeout(() => { introEl.hidden = true; }, reduce ? 0 : 450);
  if (dwrap.hidden && pwWrap.hidden) document.documentElement.classList.remove("lock");
  if (after) after();
}
function introStep(d) {
  const i = sceneAt(intro.t), j = Math.max(0, Math.min(SCENES.length - 1, i + d));
  intro.t = d < 0 && intro.t - SCENES[i].at > 1 ? SCENES[i].at : SCENES[j].at;
}
introEl.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) { if (sceneAt(intro.t) < SCENES.length - 1) introStep(1); return; }
  if (b.id === "inSkip") return closeIntro(() => $("jump").focus({ preventScroll: true }));
  const a = b.dataset.in;
  if (a === "again") { intro.t = 0; intro.cur = -1; }
  else if (a === "future") closeIntro(() => setTimeout(openFuture, 250));
  else if (a === "start") closeIntro(() => {
    const fi = PAIRS.indexOf(IP);
    if (!focus || focus.pi !== fi || focus.k !== "then") travel(fi, "then");
    if (!reduce) $("jump").classList.add("pulse");
    $("jump").focus({ preventScroll: true });
  });
});
document.addEventListener("keydown", e => {
  if (!intro.open) return;
  if (e.key === "Escape") { e.stopImmediatePropagation(); closeIntro(); }
  else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); introStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); introStep(-1); }
}, true);
$("logo").addEventListener("click", () => openIntro());
window.__pastforward = Object.assign(window.__pastforward || {}, {
  introLength: INTRO_END + 2.5,
  introFrame: t => { if (!intro.open) openIntro(true); renderIntro(t); }
});

/* ---------- night sky ---------- */
const sky = $("sky"), sctx = sky.getContext("2d");
let stars = [];
function sizeSky() {
  sky.width = Math.round(innerWidth * DPR); sky.height = Math.round(innerHeight * DPR);
  const n = Math.min(200, Math.round(innerWidth * innerHeight / 9000));
  stars = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + .25, p: Math.random() * 6.28, s: .4 + Math.random() * 1.4 }));
}
function drawSky(t) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = reduce ? .5 : .25 + .55 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    c.fillStyle = `rgba(232,226,255,${a.toFixed(3)})`;
    c.beginPath(); c.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, 6.2832); c.fill();
  }
}

/* ---------- hint ---------- */
const hint = $("hint");
function hideHint() { hint.classList.add("gone"); }
setTimeout(hideHint, 6000);

/* ---------- loop ---------- */
let lastT = performance.now(), frame = 0;
function loop(t) {
  const dt = Math.min(48, t - lastT); lastT = t;
  if (!document.hidden && !intro.open) {
    stepFly(t); stepInertia(dt);
    draw(t); drawWorld(t); drawGlimpse(t);
    if (frame++ % 2 === 0) drawSky(t);
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => mcache.clear());

/* ---------- start ---------- */
resize();
const pathId = location.pathname.match(/^\/r\/([a-z0-9_-]+)\/?$/);
const h = pathId ? pathId[1] : decodeURIComponent(location.hash.slice(1));
let start = PAIRS.findIndex(p => p.id === h);
const linked = start >= 0;
if (start < 0) start = PAIRS.findIndex(p => p.id === "flu");
if (start < 0) start = 0;
cam.c = EVI[start].then.yx; cam.s = defaultScale(); clampCam();
setFocus(start, "then", 1, true);
if (linked) syncURL(start);   // a shared link: keep it as the clean /r/<id> address
else if (OWN_HOST && location.hash) { try { history.replaceState(null, "", "/"); } catch (e) {} }
if (!reduce) $("jump").classList.add("pulse");
updateDailyDot();
loadScores();
if (h === "daily") setTimeout(openDaily, 400);
if (h === "ask") setTimeout(() => openAsk(), 400);
// first visit to the home page: show what PastForward is (shared links go straight to their rhyme)
if (!linked && !h && !store.get(INTRO_KEY, 0)) setTimeout(() => openIntro(), 450);
requestAnimationFrame(loop);
})();
</script>
