  return t ? JSON.parse(t) : null;
}
let SCORES = {};
const myVotes = store.get("pastforward.votes", {});
async function loadScores() {
  try {
    const rows = await api("/api/scores");
    if (!rows) return;
    SCORES = {};
    rows.forEach(r => { SCORES[r.rhyme_id] = { yes: +r.yes, no: +r.no }; });
    refreshVotes();
  } catch (_) {}
}
function scoreOf(pi) {
  const s = SCORES[PAIRS[pi].id] || { yes: 0, no: 0 };
  const tot = s.yes + s.no;
  return { yes: s.yes, no: s.no, tot, pct: tot ? Math.round(100 * s.yes / tot) : null };
}
async function castVote(pi, v) {
  const id = PAIRS[pi].id, prev = myVotes[id];
  if (prev === v) return;
  myVotes[id] = v; store.set("pastforward.votes", myVotes);
  const s = SCORES[id] || { yes: 0, no: 0 };
  if (prev === 1) s.yes--; if (prev === -1) s.no--;
  if (v === 1) s.yes++; else s.no++;
  SCORES[id] = s;
  refreshVotes();
  try { await api("/api/vote", { rhyme: id, device: DEVICE, vote: v }); } catch (_) {}
}
function voteHTML(pi) {
  const id = PAIRS[pi].id, mine = myVotes[id], sc = scoreOf(pi);
  let res = "";
  if (mine) {
    res = apiOn() && sc.tot >= 3
      ? `<div class="vbar" aria-hidden="true"><i style="width:${sc.pct}%"></i></div><div class="vres"><span>${sc.pct}% say it rhymes</span><span>${sc.tot} votes</span></div>`
      : `<div class="vres"><span>${mine === 1 ? "You say it rhymes." : "You say it does not."} Results show as more people vote.</span></div>`;
  }
  return `<div class="vote" data-votebox="${pi}">
    <div class="vote-q"><span>Does this rhyme?</span><span class="vote-b">
      <button type="button" data-vote="${pi}:1" aria-pressed="${mine === 1}">It rhymes</button>
      <button type="button" data-vote="${pi}:-1" aria-pressed="${mine === -1}">Not really</button></span></div>${res}</div>`;
}
function refreshVotes() {
  document.querySelectorAll("[data-votebox]").forEach(el => { el.outerHTML = voteHTML(+el.dataset.votebox); });
  if (focus) renderRhyme();
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-vote]");
  if (!b) return;
  const [pi, v] = b.dataset.vote.split(":").map(Number);
  castVote(pi, v);
});
function communityLine(pi) {
  const sc = scoreOf(pi);
  return apiOn() && sc.tot >= 10 ? ` <span class="agree">· ${sc.pct}% agree</span>` : "";
}

/* ---------- daily puzzle: find the echo ---------- */
const PZ_START = Date.UTC(2026, 9, 21);
const pzDay = (d = new Date()) => Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - PZ_START) / 864e5) + 1;
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function seeded(arr, seed) { const r = mulberry(seed), a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const BY_ID = PAIRS.map((_, i) => i).sort((a, b) => PAIRS[a].id < PAIRS[b].id ? -1 : 1);
function pzRounds(day) {
  const per = Math.floor(N / 3), n = Math.max(0, day - 1), cycle = Math.floor(n / per), k = n % per;
  const order = seeded(BY_ID, 9001 + cycle * 7919);
  return order.slice(k * 3, k * 3 + 3).map((pi, j) => {
    const pool = seeded(BY_ID.filter(i => i !== pi && PAIRS[i].now.short !== PAIRS[pi].now.short), day * 977 + j * 13);
    return { pi, opts: seeded([pi, ...pool.slice(0, 3)], day * 31 + j * 7) };
  });
}
const pzKey = d => `pastforward.daily.${d}`;
function pzState(day) { return store.get(pzKey(day), { answers: [] }); }
function pzStreak(day) {
  let s = 0;
  for (let d = day; d >= 1; d--) { const st = store.get(pzKey(d), null); if (st && st.answers && st.answers.length >= 3) s++; else if (d !== day) break; else break; }
  return s;
}
function updateDailyDot() {
  const st = pzState(pzDay());
  $("dailyBtn").classList.toggle("new", !(st.answers && st.answers.length >= 3));
}
function openDaily() {
  const day = pzDay();
  setHead(`Daily · #${day} · ${new Date().toLocaleDateString(undefined, { day: "numeric", month: "short" })}`, "then", "Find the echo", "plain");
  tabs.innerHTML = ""; world = null;
  renderPuzzle();
  showDeep();
}
function pzProgress(rounds, st, cur) {
  return `<div class="pz-prog" aria-hidden="true">${rounds.map((r, j) => `<i class="${j < st.answers.length ? (st.answers[j] === r.pi ? "ok" : "bad") : j === cur ? "cur" : ""}"></i>`).join("")}</div>`;
}
function renderPuzzle() {
  const day = pzDay(), rounds = pzRounds(day), st = pzState(day), i = st.answers.length;
  if (i >= rounds.length) return renderPuzzleResult(day, rounds, st);
  const R = rounds[i], p = PAIRS[R.pi];
  dBody.scrollTop = 0;
  dBody.innerHTML = `${pzProgress(rounds, st, i)}
    <p class="pz-q">Round ${i + 1} of ${rounds.length} · Which recent event echoes this?</p>
    <div class="pz-then"><span class="y">${p.then.year} · ${ago(p.then.year)}</span><span class="t">${esc(p.then.title)}</span><span class="h">${esc(p.then.hook)}</span></div>
    <div class="pz-opts" role="group" aria-label="Choose the echo">${R.opts.map(o => `<button type="button" data-pz="${o}"><span class="oy">${PAIRS[o].now.year}</span><span class="ot">${esc(PAIRS[o].now.title)}</span></button>`).join("")}</div>
    <div class="pz-rev" id="pzRev" aria-live="polite"></div>`;
}
function answerPuzzle(choice) {
  const day = pzDay(), rounds = pzRounds(day), st = pzState(day), i = st.answers.length;
  if (i >= rounds.length) return;
  const R = rounds[i], p = PAIRS[R.pi], ok = choice === R.pi;
  st.answers.push(choice); store.set(pzKey(day), st);
  dBody.querySelectorAll("[data-pz]").forEach(b => {
    const o = +b.dataset.pz;
    b.disabled = true;
    if (o === R.pi) b.classList.add("ok"); else if (o === choice) b.classList.add("bad");
  });
  const prog = dBody.querySelector(".pz-prog"); if (prog) prog.outerHTML = pzProgress(rounds, st, -1);
  const g = gapOf(p), last = st.answers.length >= rounds.length;
  $("pzRev").innerHTML = `<p class="pz-verdict ${ok ? "ok" : "bad"}">${ok ? "Right." : "Not this time."} ${esc(p.then.short)} → ${esc(p.now.short)}, ${g} years apart.</p>
    <p class="pz-next">Another ${g} years on, around <b>${nextYear(p)}</b>: <i>${esc(p.next.title)}</i></p>
    <button type="button" class="primary pz-go" id="pzGo">${last ? "See your result" : "Next round"} →</button>`;
  $("pzGo").addEventListener("click", () => renderPuzzle());
  if (last) { updateDailyDot(); const score = rounds.filter((r, j) => st.answers[j] === r.pi).length; api("/api/puzzle", { day, device: DEVICE, score }).catch(() => {}); }
  $("pzGo").scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" });
}
function pzShareText(day, rounds, st) {
  const score = rounds.filter((r, j) => st.answers[j] === r.pi).length;
  return `PastForward Daily #${day} · ${score}/${rounds.length}\n${rounds.map((r, j) => st.answers[j] === r.pi ? "🟩" : "🟥").join("")}\n${siteBase()}`;
}
function renderPuzzleResult(day, rounds, st) {
  const score = rounds.filter((r, j) => st.answers[j] === r.pi).length, streak = pzStreak(day);
  const now = new Date(), next = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate() + 1);
  const hrs = Math.max(0, Math.floor((next - now) / 36e5)), mins = Math.max(0, Math.floor((next - now) / 6e4) % 60);
  dBody.scrollTop = 0;
  dBody.innerHTML = `${pzProgress(rounds, st, -1)}
    <div class="pz-res">
      <p class="pz-score">${score}<span>/${rounds.length}</span></p>
      <p class="pz-emoji" aria-label="${score} of ${rounds.length} correct">${rounds.map((r, j) => st.answers[j] === r.pi ? "🟩" : "🟥").join("")}</p>
      <p class="pz-meta">${streak > 1 ? `${streak}-day streak · ` : ""}Next puzzle in ${hrs}h ${mins}m</p>
      <p class="pz-meta" id="pzStats"></p>
    </div>
    <button type="button" class="primary" id="pzShare">Share result</button>
    <p class="pz-q">Today's rhymes</p>
    ${rounds.map(r => goBtn(r.pi, "then", `${PAIRS[r.pi].then.year} → ${PAIRS[r.pi].now.year} → c. ${nextYear(PAIRS[r.pi])}`, true)).join("")}`;
  $("pzShare").addEventListener("click", async () => {
    const text = pzShareText(day, rounds, st), btn = $("pzShare");
    try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(text); btn.textContent = "Copied. Paste it anywhere"; }
    catch (_) { showSharePreviewText(text); }
  });
  api(`/api/puzzle?day=${day}`).then(r => {
    const el = $("pzStats");
    if (r && el && +r.players > 1) el.textContent = `${r.players} players today · ${Math.round(100 * r.perfect / r.players)}% got all three`;
  }).catch(() => {});
}
function showSharePreviewText(text) {
  const box = document.createElement("textarea");
  box.className = "pz-copy"; box.value = text; box.readOnly = true; box.rows = 3;
  dBody.appendChild(box); box.focus(); box.select();
}
dBody.addEventListener("click", e => {
  const b = e.target.closest("[data-pz]");
  if (b && !b.disabled) answerPuzzle(+b.dataset.pz);
});

/* ---------- night sky ---------- */
const sky = $("sky"), sctx = sky.getContext("2d");
let stars = [];
function sizeSky() {
  sky.width = Math.round(innerWidth * DPR); sky.height = Math.round(innerHeight * DPR);
  const n = Math.min(200, Math.round(innerWidth * innerHeight / 9000));
  stars = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.1 + .25, p: Math.random() * 6.28, s: .4 + Math.random() * 1.4 }));
}
function drawSky(t) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, innerWidth, innerHeight);
  for (const s of stars) {
    const a = reduce ? .5 : .25 + .55 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    c.fillStyle = `rgba(232,226,255,${a.toFixed(3)})`;
    c.beginPath(); c.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, 6.2832); c.fill();
  }
}

/* ---------- hint ---------- */
const hint = $("hint");
function hideHint() { hint.classList.add("gone"); }
setTimeout(hideHint, 6000);

/* ---------- loop ---------- */
let lastT = performance.now(), frame = 0;
function loop(t) {
  const dt = Math.min(48, t - lastT); lastT = t;
  if (!document.hidden) {
    stepFly(t); stepInertia(dt);
    draw(t); drawWorld(t); drawGlimpse(t);
    if (frame++ % 2 === 0) drawSky(t);
  }

}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => mcache.clear());

/* ---------- start ---------- */

const pathId = location.pathname.match(/^\/r\/([a-z0-9_-]+)\/?$/);
const h = pathId ? pathId[1] : decodeURIComponent(location.hash.slice(1));
let start = PAIRS.findIndex(p => p.id === h);
const linked = start >= 0;

if (!reduce) $("jump").classList.add("pulse");

})();
