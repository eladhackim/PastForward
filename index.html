 "line": "The Soviet Union tested its first atomic bomb years before US experts expected, and Truman ordered a crash hydrogen bomb program."}, {"year": 1961, "short": "Gagarin Orbits", "title": "Gagarin becomes the first human in space", "region": "russia", "line": "Yuri Gagarin’s orbit beat America into space, and six weeks later Kennedy asked Congress to land a man on the Moon."}, {"year": 1987, "short": "Japan's Chips", "title": "Japan's chip lead alarms America", "region": "world", "line": "Japanese firms had overtaken America in memory chips, so Washington backed the new SEMATECH consortium with federal money to catch up."}, {"year": 2010, "short": "Tianhe-1A", "title": "China builds the world’s fastest computer", "region": "china", "line": "China’s Tianhe-1A topped the world supercomputer ranking, and Obama called rivals’ advances “our generation’s Sputnik moment,” urging new research spending."}, {"year": 2021, "short": "Hypersonic Test", "title": "China’s reported hypersonic test alarms Washington", "region": "china", "line": "A reported Chinese hypersonic glide vehicle circled the globe, and the top US general called it “very close” to a Sputnik moment."}], "opp": {"lastTime": "After Sputnik, the US created NASA and ARPA in 1958, and the National Defense Education Act funded student loans and math, science and language teaching. US college enrollment roughly doubled in the 1960s, and Apollo employed about 400,000 people.", "ideas": [{"kind": "build", "title": "Math, science and AI teaching tools", "line": "Courses and classroom tools for math, science and AI basics, the kind of education push the 1958 act funded.", "guide": {"what": "Courses, apps and classroom kits that help students and teachers learn math, science and the basics of how AI works.", "why": "After Sputnik, the 1958 National Defense Education Act funded math, science and language teaching, and US college enrollment roughly doubled in the 1960s. A new technology scare may bring similar funding for AI and science teaching.", "how": ["Ask three teachers which math or AI topic their students struggle with most.", "Review free AI curricula, such as Code.org's, to see what already exists.", "Build one short lesson or tool and test it with a real class."], "read": [{"title": "Code.org: AI curriculum for teachers and students", "url": "https://code.org/en-US/artificial-intelligence"}]}}, {"kind": "work", "title": "Researchers in national tech programs", "line": "Engineers, researchers and technicians in government-funded AI, chip and energy programs, which tend to expand quickly after a rival's surprise.", "guide": {"what": "Engineers, scientists and technicians who work on government-funded research in AI, chips, energy or space, at national labs, agencies, universities or contractors.", "why": "Sputnik led the US to create NASA and ARPA in 1958, and Apollo employed about 400,000 people. After DeepSeek in 2025, the US and EU announced new AI plans, which may open more research roles.", "how": ["Browse open calls from DARPA, the EU's Marie Skłodowska-Curie Actions or your national research agency.", "Ask a researcher at a national lab how they were hired.", "Build one in-demand skill, such as chip design or machine learning, through a project."], "read": [{"title": "DARPA", "url": "https://www.darpa.mil/"}, {"title": "Marie Skłodowska-Curie Actions (EU research fellowships)", "url": "https://marie-sklodowska-curie-actions.ec.europa.eu/"}]}}, {"kind": "work", "title": "Math and science teachers", "line": "Math, science and computing teachers, as governments tend to fund teacher training and scholarships after a technology scare.", "guide": {"what": "Teachers of math, science and computing in schools and colleges, who help young people build the skills that national technology races depend on.", "why": "After Sputnik, the 1958 education act funded student loans and better science teaching. UNESCO estimated in 2024 that the world needs 44 million more teachers by 2030, and a new tech shock may bring more training funds.", "how": ["Shadow a math or science teacher for a day at a local school.", "Check which teaching qualification your country requires and how long it takes.", "Look for teacher scholarships, such as the US Noyce program for STEM teachers."], "read": [{"title": "NSF: Robert Noyce Teacher Scholarship Program", "url": "https://www.nsf.gov/funding/opportunities/robert-noyce-teacher-scholarship-program"}, {"title": "National Council of Teachers of Mathematics", "url": "https://www.nctm.org/"}]}}, {"kind": "learn", "title": "Doing more with less compute", "line": "Methods for training and running AI models with less computing power, the approach that let DeepSeek compete at lower reported cost.", "guide": {"what": "Methods to train and run AI models with less computing power and memory, such as smaller models, mixture-of-experts designs, quantization and distillation.", "why": "DeepSeek reported training its models at far lower cost than rivals, and on 27 January 2025 Nvidia lost about $590 billion in value. With chips scarce and power costly, efficiency skills may stay valuable.", "how": ["Read the DeepSeek-V3 technical report sections on training cost and efficiency.", "Follow MIT's free course on efficient deep learning, starting with the quantization lectures.", "Quantize a small open model and compare its speed and accuracy before and after."], "read": [{"title": "DeepSeek-V3 Technical Report (arXiv)", "url": "https://arxiv.org/abs/2412.19437"}, {"title": "MIT 6.5940: TinyML and Efficient Deep Learning Computing", "url": "https://hanlab.mit.edu/courses/2024-fall-65940"}]}}], "watch": "New crash programs or education acts for AI, chips or fusion, and surprise model releases from unexpected labs."}}, {"id": "springs", "theme": "One voice wakes an environmental movement", "rhyme": 2, "then": {"year": 1962, "short": "Silent Spring", "title": "Rachel Carson’s Silent Spring", "where": "United States", "region": "us", "hook": "The book that warned pesticides like DDT were silencing birds and poisoning the food chain.", "text": "Biologist Rachel Carson published Silent Spring in September 1962, documenting how DDT and other pesticides harmed wildlife and could threaten people. The chemical industry attacked her, but the book became a bestseller and President Kennedy ordered a scientific review of pesticides."}, "now": {"year": 2018, "short": "School Strike", "title": "Greta Thunberg’s School Strike", "where": "Stockholm, Sweden", "region": "europe", "hook": "The Friday climate strikes: a lone Swedish teenager’s sign, then millions of students marching.", "text": "In August 2018, 15-year-old Greta Thunberg began skipping school to sit outside Sweden’s parliament with a sign reading “School strike for climate”. Students worldwide copied her as Fridays for Future. On 20 September 2019, organizers counted about 4 million strikers."}, "followed": "Public pressure grew fast. About 20 million Americans joined the first Earth Day in 1970, the Environmental Protection Agency opened that year, and the US banned DDT for farm use in 1972.", "next": {"short": "A New Wake-Up", "title": "A new voice for a new threat", "text": "Around 2074, a single voice might again rally millions, perhaps over microplastics in human bodies, failing oceans or a geoengineering project, spreading through media we cannot yet picture.", "watch": "Rising alarm over microplastics, ocean acidification or solar geoengineering, and young activists organizing across borders around one simple act."}, "breaks": "DDT could be banned by national laws within a decade, while cutting greenhouse gases requires every major economy to change how it makes energy.", "topic": "society", "echoes": [{"year": 1485, "short": "Bishnoi Rules", "title": "Guru Jambheshwar founds the Bishnoi community", "region": "india", "line": "In Rajasthan, Guru Jambheshwar founded the Bishnoi community, whose 29 rules forbid felling green trees and killing animals; followers still protect wildlife."}, {"year": 1892, "short": "John Muir", "title": "John Muir founds the Sierra Club", "region": "us", "line": "Naturalist John Muir’s writings rallied Americans to save wild places; he co-founded the Sierra Club and inspired the national parks movement."}, {"year": 1977, "short": "Green Belt", "title": "Wangari Maathai’s Green Belt Movement", "region": "africa", "line": "Kenyan scientist Wangari Maathai got rural women planting trees, growing a movement that planted tens of millions and earned her a Nobel."}, {"year": 1978, "short": "Love Canal", "title": "Lois Gibbs and Love Canal", "region": "us", "line": "Homemaker Lois Gibbs organized neighbors over toxic waste buried under their Niagara Falls neighborhood, forcing evacuations and helping inspire the Superfund law."}, {"year": 1988, "short": "Chico Mendes", "title": "Chico Mendes defends the Amazon", "region": "latam", "line": "Rubber tapper Chico Mendes fought ranchers clearing the Amazon; his 1988 murder made world headlines and led Brazil to create forest reserves."}, {"year": 2006, "short": "Al Gore’s Film", "title": "Al Gore’s An Inconvenient Truth", "region": "us", "line": "Al Gore’s climate slideshow became a hit film that alarmed millions about global warming; he shared the 2007 Nobel Peace Prize."}], "opp": {"lastTime": "The 1970 National Environmental Policy Act required environmental impact statements for major federal projects, fueling an environmental consulting industry, and Clean Air Act rules put catalytic converters on most new US cars from 1975. Environmental law became a field of its own.", "ideas": [{"kind": "build", "title": "Testing for microplastics and PFAS", "line": "Affordable testing and filtration for microplastics and “forever chemicals” in water, food and homes may see demand as alarm and legal limits grow.", "guide": {"what": "Affordable lab tests, home kits and filters that measure or remove microplastics and PFAS, the long-lasting forever chemicals found in water, food and homes.", "why": "After Silent Spring, 1970s laws built whole testing and cleanup industries. EU limits on PFAS in drinking water took effect in January 2026, and the US has kept limits for two PFAS, so demand for testing may grow.", "how": ["Read your water supplier's latest quality report and check whether it tests for PFAS.", "Ask a certified water lab what PFAS tests cost and how long results take.", "Ask schools or landlords whether they would pay for regular water testing."], "read": [{"title": "EPA: PFAS National Primary Drinking Water Regulation", "url": "https://www.epa.gov/sdwa/and-polyfluoroalkyl-substances-pfas"}, {"title": "ATSDR: PFAS and Your Health", "url": "https://www.atsdr.cdc.gov/pfas/"}]}}, {"kind": "build", "title": "Product passports and supply data", "line": "Software that records a product’s materials, chemicals and emissions for buyers and regulators, as EU digital product passports phase in over coming years.", "guide": {"what": "Software that records what a product is made of, where it came from and its environmental impact, and shares that data with buyers, recyclers and regulators through a digital passport.", "why": "After 1970, NEPA's impact statements created a consulting industry. EU Digital Product Passports are due to become mandatory for some batteries from February 2027, with textiles, steel and more to follow, so firms may need help.", "how": ["Read the European Commission's Digital Product Passport page and its timeline.", "Interview a manufacturer about what data they hold on materials and suppliers.", "Prototype a passport for one simple product, such as a T-shirt or a battery."], "read": [{"title": "European Commission: Digital Product Passport", "url": "https://single-market-economy.ec.europa.eu/single-market/digital-product-passport_en"}, {"title": "European Commission: The Digital Product Passport Registry is now live (2026)", "url": "https://single-market-economy.ec.europa.eu/news/digital-product-passport-registry-now-live-2026-07-20_en"}]}}, {"kind": "work", "title": "Environmental compliance and cleanup", "line": "Like the consultants who multiplied after NEPA, PFAS remediation engineers, environmental health scientists and compliance staff may grow as chemical rules tighten.", "guide": {"what": "Engineers, scientists and compliance staff who test soil and water, design cleanups for pollutants such as PFAS, and help firms meet environmental rules.", "why": "After NEPA in 1970, environmental consultants multiplied, and Clean Air Act rules put catalytic converters on most new US cars from 1975. Tighter PFAS limits in Europe and the US may create similar demand.", "how": ["Ask an environmental consultant which entry roles and degrees their firm hires for.", "Read the EPA's PFAS pages to learn the main sources and cleanup methods.", "Look into credentials from the National Environmental Health Association."], "read": [{"title": "EPA: Per- and Polyfluoroalkyl Substances (PFAS)", "url": "https://www.epa.gov/pfas"}, {"title": "National Environmental Health Association", "url": "https://www.neha.org/"}]}}, {"kind": "learn", "title": "Toxicology and chemical regulation", "line": "How pollutants like PFAS and microplastics move through bodies and ecosystems, and how EU and US rules measure and limit them.", "guide": {"what": "How chemicals move through bodies and ecosystems, what doses cause harm, and how regulators measure, test and limit them.", "why": "Carson's 1962 book showed how DDT built up in food chains, and the US banned it for farm use in 1972. Similar questions now surround PFAS and microplastics, and the EU is weighing a broad PFAS restriction.", "how": ["Read ATSDR's plain-language pages on PFAS and health.", "Read Silent Spring and note how Carson explains dose and buildup.", "Take an introductory toxicology or environmental health course online."], "read": [{"title": "ATSDR: PFAS and Your Health", "url": "https://www.atsdr.cdc.gov/pfas/"}, {"title": "ATSDR: Toxicological Profiles", "url": "https://www.atsdr.cdc.gov/toxicological-profiles/about/index.html"}]}}], "watch": "New legal limits on PFAS or microplastics, and youth-led campaigns turning into laws, would signal rising demand; rollbacks of rules would signal the reverse."}}, {"id": "protests", "theme": "Protests ripple across the globe at once", "rhyme": 2, "then": {"year": 1968, "short": "1968 Protests", "title": "The global protest wave of 1968", "where": "Worldwide", "region": "world", "hook": "Barricades in Paris, Soviet tanks in Prague: the year the whole world seemed to boil over.", "text": "In May 1968, French students built barricades and about 10 million workers went on strike. Americans protested the Vietnam War, and riots followed Martin Luther King’s assassination. Soviet-led troops crushed the Prague Spring, and Mexican troops fired on students at Tlatelolco."}, "now": {"year": 2020, "short": "George Floyd", "title": "The George Floyd protests", "where": "Minneapolis, then worldwide", "region": "us", "hook": "June 2020: masked crowds kneeling in the streets in the middle of a pandemic.", "text": "A Minneapolis police officer killed George Floyd on 25 May 2020, kneeling on his neck for over nine minutes. Video of his death sparked protests in all 50 states and dozens of countries. Polls suggested 15 to 26 million Americans took part."}, "followed": "Elections swung toward order. Richard Nixon won the US presidency promising “law and order”, de Gaulle’s party won a landslide in June, and Prague’s reforms were rolled back under Soviet pressure.", "next": {"short": "Next Wave", "title": "Global protests sparked within hours", "text": "Around 2072, one video or one killing might again set off protests in dozens of countries within days, organized on networks that do not yet exist.", "watch": "Large generations of young people with blocked prospects, a shared grievance that crosses borders, and new ways to spread images instantly."}, "breaks": "The 1968 revolts had many separate causes, from Vietnam to Soviet rule, while the 2020 protests shared one focus: policing and racial injustice.", "older": "The Revolutions of 1848", "topic": "society", "echoes": [{"year": 1378, "short": "Europe’s Revolts", "title": "Revolts sweep Europe’s cities, 1378–1382", "region": "europe", "line": "From Florence’s Ciompi to Ghent, England’s Peasants’ Revolt, Rouen and Paris, revolts against taxes and elites swept Europe in 1378–1382."}, {"year": 1848, "short": "1848 Revolutions", "title": "The Revolutions of 1848", "region": "europe", "line": "Revolutions spread from Paris to Vienna, Berlin, Milan and Budapest within weeks, as crowds demanded constitutions, voting rights and national freedom."}, {"year": 1919, "short": "1919 Protests", "title": "The anticolonial protests of 1919", "region": "world", "line": "Hopes raised by Wilson’s talk of self-determination fed near-simultaneous protests in Korea, Egypt, India and China during the Paris peace talks."}, {"year": 1989, "short": "1989 Revolutions", "title": "The revolutions of 1989 in Eastern Europe", "region": "europe", "line": "Protests and strikes swept Eastern Europe, toppling communist governments from Poland to Romania within months and bringing down the Berlin Wall."}, {"year": 2003, "short": "Iraq War Protest", "title": "The global Iraq war protests", "region": "world", "line": "On one day, millions marched against the coming Iraq war in about 600 cities, from Rome and London to Sydney."}, {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring and Occupy protests", "region": "world", "line": "Uprisings spread from Tunisia across the Arab world, and Occupy protest camps soon appeared in hundreds of cities worldwide."}, {"year": 2025, "short": "Gen Z Protests", "title": "The Gen Z protest wave", "region": "world", "line": "Youth-led protests spread from Indonesia and Nepal to Madagascar, Morocco and Peru, many under a One Piece anime flag, toppling two governments."}], "opp": {"lastTime": "After 1968, France’s Grenelle agreements raised the minimum wage 35%, and US universities opened Black and ethnic studies departments, such as San Francisco State’s College of Ethnic Studies in 1969. The 1968 Safe Streets Act funneled federal money into police training and equipment.", "ideas": [{"kind": "build", "title": "Verifying viral protest footage", "line": "Tools that help newsrooms, courts and platforms verify the time, place and authenticity of protest videos could see demand as AI fakes spread.", "guide": {"what": "Tools and services that check whether a protest photo or video is real, and when and where it was taken, using metadata, maps, shadows and content credentials attached at capture.", "why": "In 2020, one bystander’s video set off protests in dozens of countries. With cheap AI fakes, newsrooms, courts and platforms may pay for fast checks, and C2PA content credentials could become a common base to build on.", "how": ["Practise checking a viral clip with reverse image search, satellite maps and metadata viewers.", "Read the C2PA overview and test a Content Credentials inspection tool on sample images.", "Ask a newsroom verification editor which checks take longest and which they would pay to speed up."], "read": [{"title": "C2PA: Coalition for Content Provenance and Authenticity", "url": "https://c2pa.org/"}, {"title": "Content Authenticity Initiative", "url": "https://contentauthenticity.org/"}]}}, {"kind": "build", "title": "Civic trackers for local reform", "line": "Tools that let residents track police budgets, council votes and reform pledges, helping street protest turn into lasting local policy.", "guide": {"what": "Websites or apps that turn public records, such as budgets, council votes and promises made by officials, into simple trackers residents can follow and share.", "why": "After 1968, protest turned into new laws and budgets, from police funding to ethnic studies. In 2020, several US cities pledged police budget cuts and many later restored funding, so tools showing what really changed could find users.", "how": ["Pick one city and list where its budget, council votes and meeting minutes are published.", "Build a simple tracker for one public pledge using a spreadsheet and open data.", "Show it to a local journalist or council member and ask what they would actually use."], "read": [{"title": "Open Data Handbook (Open Knowledge Foundation)", "url": "https://opendatahandbook.org/"}, {"title": "Code for America", "url": "https://codeforamerica.org/"}]}}, {"kind": "work", "title": "Crisis responders and mediators", "line": "Civilian crisis responders, police oversight investigators and community mediators may grow as cities test alternatives to armed response after protest waves.", "guide": {"what": "Civilian crisis responders answer some mental health and welfare calls instead of armed police. Oversight investigators review police conduct, and mediators help neighbors, protesters and officials settle disputes.", "why": "After 1968, the Safe Streets Act poured federal money into policing. In 2020, cities such as Denver began sending health workers to some calls instead. Whether such teams grow may depend on funding and published results.", "how": ["Read how civilian crisis teams work, and why Eugene’s long-running CAHOOTS ran into funding trouble.", "Volunteer on a crisis line or take a basic mediation course to test your fit.", "Talk to a civilian oversight investigator through NACOLE about their daily work and training."], "read": [{"title": "NACOLE: National Association for Civilian Oversight of Law Enforcement", "url": "https://www.nacole.org/"}, {"title": "Vera Institute: Behavioral health crisis alternatives", "url": "https://www.vera.org/behavioral-health-crisis-alternatives"}]}}, {"kind": "learn", "title": "Open-source investigation", "line": "Geolocating and verifying photos and videos, a skill newsrooms and human-rights groups use to document protests and crackdowns accurately.", "guide": {"what": "Using public material, such as social media posts, satellite images and maps, to find where and when a photo or video was made and to check claims about events.", "why": "The 2020 protests began with a bystander’s video. Since then, AI fakes and mass sharing have made checking footage harder. Newsrooms, rights groups and courts now use open-source methods, and the Berkeley Protocol sets standards for them.", "how": ["Work through Bellingcat’s free guides and try one of its online geolocation challenges.", "Geolocate one protest photo using street view, shadows and landmarks, then write up your steps.", "Read the Berkeley Protocol sections on verifying content and preserving evidence."], "read": [{"title": "Bellingcat’s Online Investigation Toolkit", "url": "https://bellingcat.gitbook.io/toolkit"}, {"title": "Berkeley Protocol on Digital Open Source Investigations", "url": "https://humanrights.berkeley.edu/publications/berkeley-protocol-on-digital-open-source-investigations/"}]}}], "watch": "Cities funding and publishing results for civilian crisis teams, and courts or platforms adopting content provenance standards, would show these areas opening."}}, {"id": "oil", "theme": "Energy supply turned into a weapon", "rhyme": 3, "then": {"year": 1973, "short": "Oil Crisis", "title": "The 1973 oil crisis", "where": "Middle East and the West", "region": "world", "hook": "Empty highways on car-free Sundays and long lines at gas stations.", "text": "In October 1973, during the Yom Kippur War, Arab oil producers cut output and embargoed the United States and the Netherlands for supporting Israel. Oil prices roughly quadrupled within months. Several European countries banned Sunday driving."}, "now": {"year": 2022, "short": "Gas Crisis", "title": "Europe’s 2022 energy crisis", "where": "Europe", "region": "europe", "hook": "Autumn 2022: thermostats turned down, shop windows dimmed, and dread opening the energy bill.", "text": "After invading Ukraine, Russia cut pipeline gas to Europe and halted Nord Stream 1 in September 2022. Wholesale gas prices rose to more than ten times pre-crisis levels. Governments capped bills, and EU countries agreed to cut gas use by 15%."}, "followed": "Years of stagflation followed. Rich nations founded the International Energy Agency in 1974, built emergency oil stocks, and turned to smaller cars, nuclear power and new oil from the North Sea and Alaska.", "next": {"short": "Metal Squeeze", "title": "A squeeze on battery metals", "text": "Around 2071, the choke point might be lithium, cobalt or rare earths for batteries and motors, with a dominant supplier cutting exports to win a political fight.", "watch": "Export controls on critical minerals, refining concentrated in one or two countries, and power grids leaning on a single foreign source."}, "breaks": "In 2022 Europe also chose to cut its own Russian imports, and it replaced much of the lost gas with shipped liquefied gas within about a year.", "older": "The Suez Crisis, 1956", "topic": "power", "echoes": [{"year": 1941, "short": "Japan Embargo", "title": "The US oil embargo on Japan", "region": "china", "line": "The US halted oil exports to Japan, which imported most of its oil from America, pushing Tokyo toward war."}, {"year": 1956, "short": "Suez Crisis", "title": "The Suez Crisis", "region": "mideast", "line": "During the Suez war, Egypt blocked the canal and Saudi Arabia embargoed Britain and France, bringing petrol rationing to Britain."}, {"year": 1967, "short": "1967 Embargo", "title": "The 1967 Arab oil embargo", "region": "mideast", "line": "After the Six-Day War, Arab producers cut oil to the US, Britain and West Germany, but extra US output blunted the embargo."}, {"year": 2009, "short": "Gas Cutoff 2009", "title": "The 2009 Russia-Ukraine gas cutoff", "region": "europe", "line": "Russia cut gas to Ukraine in a price dispute, and transit stopped for two weeks, leaving parts of Europe cold in midwinter."}, {"year": 2026, "short": "Hormuz Closed", "title": "Iran closes the Strait of Hormuz", "region": "mideast", "line": "In retaliation for US and Israeli strikes, Iran effectively closed the Strait of Hormuz, through which a fifth of world oil passes."}], "opp": {"lastTime": "After 1973, fuel-efficient Japanese cars won over US buyers, France’s 1974 Messmer plan began building dozens of nuclear reactors, and Brazil launched its Proálcool ethanol program in 1975. The US set its first car fuel economy standards the same year.", "ideas": [{"kind": "build", "title": "Battery and magnet metal recycling", "line": "Recovering lithium, nickel, cobalt and rare earths from old batteries and magnets could gain value as supply chokepoints and export controls tighten.", "guide": {"what": "Collecting old batteries, motors and electronics and recovering lithium, nickel, cobalt and rare earth metals from them, so the metals can go into new products.", "why": "After 1973, importers built emergency stocks and found new oil sources. Today China refines most of several key battery and magnet metals and has restricted some exports, while EU rules require recycled content in car and industrial batteries from 2031.", "how": ["Map who collects used batteries in your area and where they currently send them.", "Talk to an e-waste recycler or scrapyard about volumes, prices and safety rules.", "Read the European Commission’s batteries page on recycling targets and battery passports."], "read": [{"title": "European Commission: Batteries", "url": "https://environment.ec.europa.eu/topics/waste-and-recycling/batteries_en"}, {"title": "IEA: Global Critical Minerals Outlook 2025", "url": "https://www.iea.org/reports/global-critical-minerals-outlook-2025"}]}}, {"kind": "build", "title": "Home efficiency and heat pumps", "line": "Insulation, heat pumps and smart controls that cut household fuel use, echoing the 1970s efficiency push, may stay in demand while energy prices swing.", "guide": {"what": "Services that cut household energy use: insulation, draught sealing, heat pumps that move heat instead of burning fuel, and smart controls that run heating at cheaper times.", "why": "After 1973, saving fuel became national policy, and US car fuel economy rules followed in 1975. In 2022, European heat pump sales jumped as gas prices spiked, then fell as prices eased. Demand may track price swings and subsidies.", "how": ["Get an energy audit of your own home and note which fixes pay back fastest.", "Shadow a heat pump installer for a day to learn about sizing, noise and permits.", "Check which local subsidies exist for insulation and heat pumps, and how long approvals take."], "read": [{"title": "IEA: The Future of Heat Pumps", "url": "https://www.iea.org/reports/the-future-of-heat-pumps"}]}}, {"kind": "work", "title": "Efficiency and critical-mineral specialists", "line": "Energy auditors, heat pump installers and mineral processing engineers may be needed as countries reduce reliance on any single energy or metals supplier.", "guide": {"what": "Jobs that reduce dependence on one supplier: energy auditors and heat pump installers who cut fuel use, and engineers who mine, refine and recycle critical minerals outside today’s main producers.", "why": "After 1973, countries built new supply, from North Sea oil to French reactors, and that needed new skills. The EU’s Critical Raw Materials Act now targets more refining and recycling in Europe by 2030, which may need trained engineers.", "how": ["Look at energy auditor certifications, such as BPI in the US or national schemes in Europe.", "Talk to a mining or materials engineering department about short courses for career changers.", "Follow new refining and recycling projects and note which skills their job ads request."], "read": [{"title": "Building Performance Institute (BPI)", "url": "https://www.bpi.org/"}, {"title": "EIT RawMaterials", "url": "https://eitrawmaterials.eu/"}]}}, {"kind": "learn", "title": "Supply chain chokepoint mapping", "line": "Tracing where critical minerals are mined, refined and processed, and how export controls and stockpiles work, a skill procurement and policy teams increasingly need.", "guide": {"what": "Tracing a product’s materials back through mining, refining and manufacturing to see where one country or company controls a step, and what happens if that step stops.", "why": "In 1973 a few producers could squeeze the West because so much oil came from one region. Today the IEA reports that refining of many critical minerals is concentrated in one country, and export controls have already been used.", "how": ["Pick one product, like an electric car battery, and list every mineral it needs.", "Use the USGS Mineral Commodity Summaries to find the top producers of each mineral.", "Note which steps rely on one country, and read how recent export controls worked."], "read": [{"title": "USGS: Mineral Commodity Summaries", "url": "https://www.usgs.gov/centers/national-minerals-information-center/mineral-commodity-summaries"}, {"title": "IEA: Global Critical Minerals Outlook 2025", "url": "https://www.iea.org/reports/global-critical-minerals-outlook-2025"}]}}], "watch": "New export controls on critical minerals, national stockpile programs and refineries opening outside today’s dominant suppliers would signal this opportunity widening."}}, {"id": "saigon", "theme": "A superpower’s chaotic final exit", "rhyme": 3, "then": {"year": 1975, "short": "Fall of Saigon", "title": "The Fall of Saigon", "where": "Saigon, South Vietnam", "region": "china", "hook": "Helicopters lifting people off a Saigon rooftop as the Vietnam War ended.", "text": "On 30 April 1975, North Vietnamese tanks broke through the gates of the presidential palace and South Vietnam surrendered. In the final hours, US helicopters flew about 7,000 Americans and Vietnamese out of the city in Operation Frequent Wind."}, "now": {"year": 2021, "short": "Fall of Kabul", "title": "The Fall of Kabul", "where": "Kabul, Afghanistan", "region": "india", "hook": "August 2021: crowds running alongside a US military plane on Kabul airport’s runway.", "text": "The Taliban entered Kabul on 15 August 2021 as US troops were withdrawing, and President Ashraf Ghani fled. A chaotic airlift flew out more than 120,000 people. A suicide bombing at an airport gate killed about 170 Afghans and 13 US troops."}, "followed": "Vietnam was formally reunified under communist rule in 1976. Cambodia and Laos also fell to communist forces in 1975, and hundreds of thousands of “boat people” fled Vietnam by sea.", "next": {"short": "Last Flights", "title": "Another great power’s rushed last flight", "text": "Around 2067, a major power might again fly its last people out of a capital after a long intervention, with the scramble broadcast live from drones and phones.", "watch": "Long foreign deployments losing support at home, fixed withdrawal deadlines, and local armies that depend on outside air power and contractors."}, "breaks": "US combat troops had left Vietnam two years before Saigon fell to a conventional army, while Kabul fell to an insurgency before the US withdrawal was finished.", "older": "The British retreat from Kabul, 1842", "topic": "power", "echoes": [{"year": -413, "short": "Sicily Retreat", "title": "Athens’ doomed retreat from Sicily", "region": "europe", "line": "After failing to take Syracuse, some 40,000 Athenians, allies and camp followers fled overland; nearly all were killed or captured."}, {"year": 1291, "short": "Fall of Acre", "title": "Crusaders flee the fall of Acre", "region": "mideast", "line": "Mamluks stormed Acre, the crusader kingdom’s capital; in a chaotic flight to the ships, the rich paid fortunes for passage."}, {"year": 1368, "short": "Yuan Flees", "title": "The last Yuan emperor flees Beijing", "region": "china", "line": "As Ming armies neared, the last Yuan emperor abandoned Dadu, today’s Beijing, and fled north, ending Mongol rule over China."}, {"year": 1842, "short": "Kabul 1842", "title": "The British retreat from Kabul", "region": "india", "line": "About 4,500 British and Indian troops and 12,000 civilians left Kabul in winter under a truce; almost all were killed or captured."}, {"year": 1947, "short": "Partition", "title": "Britain’s rushed exit from India", "region": "india", "line": "Britain moved India’s independence up by ten months; partition into India and Pakistan uprooted over 10 million people amid mass killings."}, {"year": 1962, "short": "Algeria 1962", "title": "France’s exit from Algeria", "region": "africa", "line": "After an eight-year war, France left Algeria; some 800,000 settlers fled within months, and many Algerians who served France were killed."}, {"year": 1984, "short": "Beirut Exit", "title": "US Marines leave Beirut", "region": "mideast", "line": "As the Lebanese army it backed collapsed, the US pulled its Marines out of Beirut, months after a bombing killed 241 servicemen."}], "opp": {"lastTime": "In 1975 about 130,000 Vietnamese evacuees reached the US, where resettlement agencies, sponsors and caseworkers were in sudden demand; the 1980 Refugee Act made that system permanent. Refugee entrepreneurs built Little Saigon in California’s Orange County.", "ideas": [{"kind": "build", "title": "Credential recognition for refugees", "line": "Services that verify and translate refugees’ diplomas, licenses and work histories could help newcomers rejoin skilled work faster after sudden evacuations.", "guide": {"what": "Services that check, translate and vouch for a refugee’s diplomas, licenses and work history, even when papers were lost, so employers and licensing bodies can trust them.", "why": "About 130,000 Vietnamese reached the US in 1975, and many skilled people restarted in lower-paid jobs. Afghans arriving in 2021 faced similar hurdles. The Council of Europe’s refugee qualifications passport shows assessment is possible without full paperwork.", "how": ["Interview two refugees about which papers they lost and what employers asked for.", "Study how the European Qualifications Passport for Refugees assesses people without full documents.", "Ask a licensing body, such as a nursing board, about its rules when records are missing."], "read": [{"title": "Council of Europe: European Qualifications Passport for Refugees", "url": "https://www.coe.int/en/web/education/recognition-of-refugees-qualifications"}]}}, {"kind": "build", "title": "Verified records for local staff", "line": "Secure digital records of local employees’ service with foreign forces or aid groups could speed visa cases, a recurring bottleneck in rushed withdrawals.", "guide": {"what": "Secure digital records that prove a local person worked for a foreign army, embassy or aid group, signed by the employer and kept safe even if offices close.", "why": "Visa programs for local staff need proof of past work. In 2021, many Afghans struggled to show it as contractors closed and records were lost, slowing their cases. Digital credential standards could make such proof easier to keep.", "how": ["Read the W3C Verifiable Credentials overview to see how signed digital records work.", "Ask an immigration lawyer or IRAP volunteer which documents most often stall visa cases.", "Plan for safety: such records could endanger people if seized, so store as little as possible."], "read": [{"title": "W3C: Verifiable Credentials Data Model v2.0", "url": "https://www.w3.org/TR/vc-data-model-2.0/"}, {"title": "International Refugee Assistance Project (IRAP)", "url": "https://refugeerights.org/"}]}}, {"kind": "work", "title": "Resettlement caseworkers and interpreters", "line": "Resettlement caseworkers, immigration lawyers and community interpreters may stay in demand, since each rushed withdrawal has produced years of displacement.", "guide": {"what": "Caseworkers help new refugees find housing, jobs, schools and health care. Immigration lawyers handle visa and asylum cases, and community interpreters help people speak with doctors, courts and officials.", "why": "After 1975, US agencies suddenly needed caseworkers and sponsors, and the 1980 Refugee Act made that system permanent. Demand swings with politics: in 2025 the US paused most refugee admissions and agencies cut staff.", "how": ["Volunteer with a resettlement agency, for example helping a family with school enrollment or appointments.", "If you speak a needed language, look into community or medical interpreter training.", "Ask a caseworker which skills and certifications their agency looks for when hiring."], "read": [{"title": "International Rescue Committee: Volunteer", "url": "https://www.rescue.org/volunteer"}, {"title": "US Office of Refugee Resettlement", "url": "https://acf.gov/orr"}]}}, {"kind": "learn", "title": "Evacuation and duty-of-care planning", "line": "Evacuation planning and duty-of-care for staff abroad, useful for aid groups, firms and agencies working in fragile states that depend on foreign troops.", "guide": {"what": "Planning how an organization keeps staff safe abroad and gets them out in a crisis: risk assessments, contact trees, safe routes, transport deals and clear rules on who decides when to leave.", "why": "In 1975 and 2021, evacuations were rushed and many local staff were left behind. Aid groups, firms and agencies in fragile states may need people who can plan exits early, for both international and national employees.", "how": ["Read GISF guides on security risk management and summaries of the ISO 31030 standard.", "Take a hostile environment awareness training course, often called HEAT, offered to aid workers.", "Draft a sample evacuation plan for one city, including who decides and options for local staff."], "read": [{"title": "ISO 31030:2021 Travel risk management", "url": "https://www.iso.org/standard/54204.html"}, {"title": "Global Interagency Security Forum (GISF)", "url": "https://gisf.ngo/"}]}}], "watch": "Fixed withdrawal deadlines for foreign forces and growing visa backlogs for local staff would signal rising need for evacuation and resettlement work."}}, {"id": "volcker", "theme": "Crushing inflation with sharply higher rates", "rhyme": 3, "then": {"year": 1980, "short": "Volcker Shock", "title": "The Volcker shock", "where": "United States", "region": "us", "hook": "Interest rates near 20% and a Fed chair set on breaking inflation, whatever the cost.", "text": "Fed chair Paul Volcker pushed short-term interest rates to about 20% in 1980 to break inflation that peaked near 15%. Angry home builders mailed him pieces of lumber. Two recessions followed, and unemployment hit 10.8% in 1982."}, "now": {"year": 2022, "short": "Rate Hikes", "title": "The great rate hikes of 2022", "where": "Worldwide", "region": "world", "hook": "2022: grocery prices jumping every week and mortgage rates doubling within a year.", "text": "With US inflation at 9.1% in June 2022, the Federal Reserve raised rates from near zero to over 4% by December, including four three-quarter-point hikes in a row. The European Central Bank and Bank of England also raised rates quickly."}, "followed": "US inflation fell to about 3% by 1983 and stayed lower for decades. Mexico said in 1982 it could not pay its debts, starting a Latin American debt crisis.", "next": {"short": "Next Squeeze", "title": "Another painful fight against inflation", "text": "Around 2064, a central bank might again choose between tolerating inflation driven by debt, aging or climate costs and causing a recession to stop it.", "watch": "Government debt growing faster than economies, political pressure on central banks to keep rates low, and inflation stuck above target for years."}, "breaks": "Volcker’s rates neared 20% and came with deep recessions, while the 2022 hikes topped out near 5.5% and inflation eased without a 1980s-style slump.", "older": "The Fed’s post-war rate hikes, 1920", "topic": "money", "echoes": [{"year": 1920, "short": "Fed Hikes 1920", "title": "The Fed’s post-war rate hikes", "region": "us", "line": "To stop post-World War I inflation, the Fed raised its discount rate to 7%; prices fell sharply and a severe recession followed."}, {"year": 1989, "short": "Lawson Hikes", "title": "Britain doubles rates to 15%", "region": "europe", "line": "To cool a boom and rising inflation, Nigel Lawson doubled UK interest rates from 7.5% to 15%; a recession followed in 1990."}, {"year": 2023, "short": "Turkey 2023", "title": "Turkey’s steep rate hikes", "region": "europe", "line": "After cutting rates as inflation soared past 80%, Turkey’s central bank raised them from 8.5% to 50% in under a year."}, {"year": 2024, "short": "Russia 21%", "title": "Russia raises rates to a record 21%", "region": "russia", "line": "As wartime spending fueled inflation, Russia’s central bank raised its key rate from 7.5% to a record 21% within 16 months."}], "opp": {"lastTime": "As rates rose toward 20%, savers moved cash into money market funds, which grew from about $4 billion in 1977 to $185 billion in 1981. The 1989 Brady Plan then turned Latin America’s bad bank loans into tradable bonds, helping create an emerging-market debt market.", "ideas": [{"kind": "build", "title": "Refinancing help for cheap-era debt", "line": "Services helping households and small firms refinance or restructure loans taken at near-zero rates may be needed as that cheap debt comes due.", "guide": {"what": "Services that help households and small firms review loans taken when rates were very low, compare refinancing or restructuring options, and talk to lenders before payments jump.", "why": "As rates rose toward 20% around 1980, new services grew fast, such as money market funds. Many loans taken in 2020 and 2021 at very low rates may reset or mature at much higher rates.", "how": ["Talk to a nonprofit credit counselor about the most common refinancing problems they see.", "Interview five small business owners about loans maturing in the next three years.", "Learn the basics of loan restructuring and consumer credit rules where you live before advising anyone."], "read": [{"title": "National Foundation for Credit Counseling (NFCC)", "url": "https://www.nfcc.org/"}]}}, {"kind": "build", "title": "Cash management for small firms", "line": "Tools that help small businesses manage cash, interest costs and payment timing, which matter far more when money is no longer nearly free.", "guide": {"what": "Tools that help small businesses forecast cash, chase late invoices, time payments and compare borrowing costs, so a rate rise or slow payer does not leave them short.", "why": "Around 1980, high rates made carrying stock and unpaid invoices expensive, and business failures rose in the recessions that followed. After the 2022 hikes, borrowing is no longer nearly free, so small firms may value tighter cash control.", "how": ["Ask three small business owners how they forecast cash today and what goes wrong.", "Build a 13-week cash flow forecast template and test it with one real business.", "Study how invoice finance and payment terms work, and what late payment laws allow."], "read": [{"title": "SCORE: free small business mentoring", "url": "https://www.score.org/"}]}}, {"kind": "work", "title": "Credit risk and insolvency roles", "line": "Credit analysts, insolvency practitioners and debt counselors tend to be in demand when debt taken on cheaply must be refinanced at higher rates.", "guide": {"what": "Credit analysts judge whether borrowers can repay. Insolvency practitioners take charge of companies that cannot pay their debts, and debt counselors help households make repayment plans.", "why": "After 1980, high rates pushed many borrowers and lenders into trouble, including hundreds of US savings and loans. In 2023, company insolvencies in England and Wales reached their highest level since 1993, partly as borrowing costs rose.", "how": ["Talk to an insolvency practitioner or credit analyst about entry routes and qualifications.", "Practise reading a company’s accounts to judge whether it can cover its interest payments.", "Look at INSOL or local professional body courses for newcomers to restructuring."], "read": [{"title": "INSOL International", "url": "https://www.insol.org/"}, {"title": "Turnaround Management Association", "url": "https://turnaround.org/"}]}}, {"kind": "learn", "title": "Interest rate risk basics", "line": "Bond duration and interest rate risk, the blind spot that sank many 1980s savings and loan lenders and some US banks in 2023.", "guide": {"what": "How bond prices fall when interest rates rise, and how duration measures that sensitivity. It explains why lenders who borrow short and lend long can lose money fast when rates jump.", "why": "In the 1980s, many savings and loans held long fixed-rate mortgages funded by short-term deposits and were crippled when rates soared. In 2023, Silicon Valley Bank failed after rising rates cut the value of its bonds and depositors fled.", "how": ["Read the SEC investor bulletin on interest rate risk and work through its examples.", "Calculate how a 10-year bond’s price changes if rates rise by one percentage point.", "Read the summary of the Federal Reserve’s review of Silicon Valley Bank’s failure."], "read": [{"title": "Investor.gov: Interest rate risk and fixed-rate bonds", "url": "https://www.investor.gov/introduction-investing/general-resources/news-alerts/alerts-bulletins/investor-bulletins-86"}, {"title": "Federal Reserve: Review of the supervision of Silicon Valley Bank", "url": "https://www.federalreserve.gov/publications/review-of-the-federal-reserves-supervision-and-regulation-of-silicon-valley-bank.htm"}]}}], "watch": "Inflation stuck above central bank targets, rising defaults as cheap loans reset, and political pressure on central banks would signal this pattern returning."}}, {"id": "chernobyl", "theme": "A nuclear disaster shakes faith in atomic power", "rhyme": 3, "then": {"year": 1986, "short": "Chernobyl", "title": "The Chernobyl disaster", "where": "Chernobyl, Soviet Ukraine", "region": "russia", "hook": "A Soviet reactor explodes, and Sweden detects the radiation before Moscow admits anything.", "text": "On 26 April 1986, reactor No. 4 at Chernobyl exploded during a safety test. About 49,000 people in nearby Pripyat were evacuated the next day. Thirty-one people died in the short term, and fallout spread across Europe."}, "now": {"year": 2011, "short": "Fukushima", "title": "The Fukushima nuclear disaster", "where": "Fukushima, Japan", "region": "china", "hook": "March 2011: a tsunami sweeping over Japan, then TV footage of reactor buildings exploding.", "text": "On 11 March 2011, a magnitude 9.0 earthquake sent a tsunami about 14 meters high over the Fukushima Daiichi plant. Three reactors melted down and more than 150,000 people were evacuated. Germany soon decided to close all its nuclear plants."}, "followed": "The disaster pushed Mikhail Gorbachev toward more openness, or glasnost, and slowed nuclear building worldwide. Gorbachev later called Chernobyl perhaps the real cause of the Soviet collapse.", "next": {"short": "Next Meltdown", "title": "Nuclear fears return with new reactors", "text": "Around 2036, a serious accident could strike a reactor caught in a war zone or one of the new small reactors built to power data centers.", "watch": "Reactors on front lines like Zaporizhzhia, old plants run past their design life, and a rush to build small reactors quickly."}, "breaks": "Chernobyl was caused by a flawed reactor and a botched test inside a secretive state, while Fukushima was triggered by a tsunami that overwhelmed its defenses.", "older": "Three Mile Island, 1979", "topic": "disaster", "echoes": [{"year": 1957, "short": "Windscale Fire", "title": "The Windscale reactor fire", "region": "europe", "line": "Britain’s worst nuclear accident spread radioactive iodine; milk was dumped, and Macmillan censored the report to protect public confidence in nuclear power."}, {"year": 1979, "short": "Three Mile", "title": "The Three Mile Island accident", "region": "us", "line": "A Pennsylvania reactor partly melted down; no one died, but public fear soared and many Americans turned against nuclear power."}, {"year": 1999, "short": "Tokaimura", "title": "Japan’s Tokaimura nuclear accident", "region": "china", "line": "Workers mixing uranium in steel buckets set off a chain reaction that killed two, shaking Japanese trust in the nuclear industry."}], "opp": {"lastTime": "After Chernobyl, IAEA safety advisers coined the term “safety culture”, and plant operators founded the World Association of Nuclear Operators in 1989 to run peer reviews. Italy voted to quit nuclear power in 1987 and turned to imported gas and electricity.", "ideas": [{"kind": "build", "title": "Public radiation monitoring networks", "line": "Low-cost public radiation sensor networks, like the volunteer ones that grew after Fukushima, could matter as reactors age or sit near front lines.", "guide": {"what": "Networks of low-cost radiation sensors run by volunteers, schools or cities, publishing readings online so anyone can check local levels instead of relying only on official reports.", "why": "In 1986, Sweden detected Chernobyl’s fallout before Moscow admitted the accident. After Fukushima, volunteers built Safecast to fill gaps in official data. Aging reactors and plants on front lines, like Zaporizhzhia, may sustain demand for independent readings.", "how": ["Look at Safecast’s open data and hardware designs to see how volunteer networks work.", "Compare official networks, such as Europe’s EURDEP map, with gaps near your region.", "Ask a physics teacher or makerspace about building and calibrating a simple sensor."], "read": [{"title": "Safecast", "url": "https://safecast.org/"}, {"title": "EURDEP: European Radiological Data Exchange Platform", "url": "https://remon.jrc.ec.europa.eu/About/Rad-Data-Exchange"}]}}, {"kind": "build", "title": "Reactor decommissioning and waste robotics", "line": "Robots and services for dismantling old reactors and handling waste may see steady demand as plants built in the 1970s and 1980s retire.", "guide": {"what": "Robots, tools and services for safely taking apart closed nuclear plants and handling their radioactive waste, so fewer people have to work in high-radiation areas.", "why": "After Chernobyl, Italy voted to quit nuclear power, and after Fukushima, Germany closed its last reactors in 2023. Many reactors built in the 1970s and 1980s are nearing retirement, and dismantling them can take decades.", "how": ["Read the UK Nuclear Decommissioning Authority’s plans to see which tasks it contracts out.", "Talk to a robotics lab about radiation-hardened sensors and remote handling challenges.", "Look for supplier days run by decommissioning agencies or large nuclear contractors."], "read": [{"title": "UK Nuclear Decommissioning Authority", "url": "https://www.gov.uk/government/organisations/nuclear-decommissioning-authority"}]}}, {"kind": "work", "title": "Nuclear safety and licensing staff", "line": "Reactor operators, safety inspectors and licensing specialists may be scarce as small reactor projects multiply and regulators face pressure to approve faster.", "guide": {"what": "People who run reactors, inspect them and review designs before approval: reactor operators, safety inspectors at regulators, and licensing specialists who prepare and check safety cases.", "why": "After Chernobyl, operators founded WANO in 1989 to run peer reviews of each other’s plants. Now small reactor projects are multiplying, and the US has pushed its regulator to decide faster, which may strain the supply of trained inspectors.", "how": ["Browse regulator job pages, such as the US NRC or UK ONR, for entry roles.", "Talk to a nuclear engineering department about conversion courses for engineers from other fields.", "Learn what a safety case is by reading a published summary of a reactor design assessment."], "read": [{"title": "US Nuclear Regulatory Commission: Careers", "url": "https://www.nrc.gov/about-nrc/employment"}, {"title": "UK Office for Nuclear Regulation", "url": "https://www.onr.org.uk/"}]}}, {"kind": "learn", "title": "Safety culture and risk analysis", "line": "Probabilistic risk assessment and human-factors engineering, core lessons from both disasters, transfer to small reactors and other safety-critical systems.", "guide": {"what": "Probabilistic risk assessment estimates how likely chains of failures are and which matter most. Safety culture and human-factors work study how people, rules and pressure cause or prevent mistakes.", "why": "After Chernobyl, IAEA advisers coined the term “safety culture”, and a commission of Japan’s parliament later called Fukushima a man-made disaster. As small reactors and other complex systems spread quickly, these methods may be needed widely.", "how": ["Read INSAG-4, the IAEA’s short 1991 report that defined safety culture.", "Learn the basics of fault trees and event trees, then draw one for a simple system.", "Read one accident report, such as Fukushima’s, and list its human and organizational causes."], "read": [{"title": "IAEA INSAG-4: Safety Culture (1991)", "url": "https://www-pub.iaea.org/MTCD/Publications/PDF/Pub882_web.pdf"}, {"title": "US NRC: Probabilistic Risk Assessment", "url": "https://www.nrc.gov/regulations-legislation/how-we-regulate/risk-assessment/probabilistic-risk-assessment-pra"}]}}], "watch": "Fast-tracked licensing for small reactors, shortages of trained inspectors, or fighting near nuclear plants would show where safety work is most needed."}}, {"id": "tiananmen", "theme": "Mass protests over political freedoms under Beijing", "rhyme": 2, "then": {"year": 1989, "short": "Tiananmen", "title": "The Tiananmen Square protests", "where": "Beijing, China", "region": "china", "hook": "A lone man standing in front of a column of tanks in Beijing.", "text": "After reformer Hu Yaobang died in April 1989, students occupied Beijing’s Tiananmen Square for seven weeks, calling for political reform and press freedom. On the night of 3-4 June, troops cleared the area by force. The government put the death toll near 300; other estimates are far higher."}, "now": {"year": 2019, "short": "Hong Kong 2019", "title": "The Hong Kong protests", "where": "Hong Kong", "region": "china", "hook": "Summer 2019: Hong Kong streets filled with black-clad marchers holding umbrellas against tear gas.", "text": "Protests began in June 2019 against a bill allowing extradition to mainland China. Organizers said about 2 million marched on 16 June; police gave lower figures. The bill was withdrawn in October, and in 2020 Beijing enacted a national security law for the city."}, "followed": "Beijing said the crackdown ensured stability, while Western governments imposed sanctions, including an EU arms embargo. Deng Xiaoping relaunched market reforms in 1992, and the events remain censored in mainland China.", "next": {"short": "Centenary 2049", "title": "New protest tools meet new controls", "text": "Around 2049, the 100th anniversary of the People’s Republic, a generation raised online might find new ways to press demands, and authorities new ways to respond.", "watch": "The approach of 2047, when Hong Kong’s 50-year “one country, two systems” guarantee ends, and job prospects for young graduates."}, "breaks": "Hong Kong kept its own laws and police under “one country, two systems”, and its protests wound down amid arrests, pandemic rules and a new security law, without the army.", "older": "The May Fourth Movement, 1919", "topic": "society", "echoes": [{"year": 166, "short": "Partisan Purge", "title": "Han China purges its student critics", "region": "china", "line": "When Imperial Academy students backed officials denouncing palace eunuchs, Emperor Huan arrested some 200 and banned the critics from office for life."}, {"year": 1126, "short": "Chen Dong 1126", "title": "Song students besiege the palace gate", "region": "china", "line": "Imperial University students led crowds to Kaifeng’s palace gate demanding a sacked minister back; the court yielded, but later executed their leader."}, {"year": 1919, "short": "May Fourth", "title": "The May Fourth Movement", "region": "china", "line": "Beijing students protested the Versailles deal giving Shandong to Japan, sparking a movement for democracy and science that 1989 protesters invoked."}, {"year": 1976, "short": "April Fifth", "title": "The 1976 Tiananmen Incident", "region": "china", "line": "Crowds mourning Premier Zhou Enlai filled Tiananmen Square with wreaths and poems criticizing radical leaders, until police and militia cleared them."}, {"year": 1978, "short": "Democracy Wall", "title": "Beijing’s Democracy Wall movement", "region": "china", "line": "Crowds read posters on a Beijing wall calling democracy the “Fifth Modernization,” until a 1979 crackdown jailed Wei Jingsheng for 15 years."}, {"year": 2003, "short": "HK March 2003", "title": "Half a million march in Hong Kong", "region": "china", "line": "About 500,000 people marched against a national security bill they feared would curb free speech, and the government shelved it."}, {"year": 2014, "short": "Umbrella 2014", "title": "Hong Kong’s Umbrella Movement", "region": "china", "line": "Protesters occupied main Hong Kong streets for 79 days, demanding open elections for the city’s leader and shielding themselves with umbrellas."}, {"year": 2022, "short": "Blank Paper", "title": "China’s blank paper protests", "region": "china", "line": "After a deadly Urumqi fire, crowds in Shanghai, Beijing and other cities protested COVID lockdowns, holding blank paper to signal censored speech."}], "opp": {"lastTime": "Hong Kong emigration averaged about 55,000 people a year from 1988 to 1994, bringing skills and capital to Vancouver, Toronto and Sydney. On the mainland, Deng Xiaoping’s 1992 southern tour set off a surge of foreign investment and factory building around Shenzhen.", "ideas": [{"kind": "build", "title": "Relocation help for professionals", "line": "Services that help relocating families move pensions, qualifications and small businesses abroad, a need seen in Hong Kong’s 1990s and 2020s emigration waves.", "guide": {"what": "Services that help families move abroad with their working lives intact: transferring pensions and savings, getting qualifications recognized, finding schools and moving or restarting a small business.", "why": "From 1988 to 1994, about 55,000 people a year left Hong Kong. Since 2021, the UK’s BN(O) visa route has drawn well over 100,000. Each wave has needed help moving money, careers and families.", "how": ["Talk to recent emigrants about what was hardest: pensions, school places, licenses or banking.", "Read the UK BN(O) visa rules to see which documents and costs families face.", "Pick one profession, such as nursing or accounting, and map how it is recognized abroad."], "read": [{"title": "GOV.UK: British National (Overseas) visa", "url": "https://www.gov.uk/british-national-overseas-bno-visa"}]}}, {"kind": "build", "title": "Preserving records and community archives", "line": "Tools that preserve news, records and community archives against deletion, since protest histories in this pattern are often censored or erased.", "guide": {"what": "Tools and services that save copies of news sites, social posts, documents and community histories in several places, so they survive if the original is deleted or blocked.", "why": "Tiananmen remains censored in mainland China. In Hong Kong, Apple Daily’s website went offline when the paper closed in 2021, and a June 4th museum shut. Copies held in many places may help such records survive.", "how": ["Try Webrecorder’s free tools to capture a website, then replay the saved copy offline.", "Save important public pages to the Wayback Machine and learn its limits.", "Talk to a librarian or archivist about storing copies safely in more than one country."], "read": [{"title": "Webrecorder", "url": "https://webrecorder.net/"}, {"title": "Internet Archive: Save pages in the Wayback Machine", "url": "https://help.archive.org/help/save-pages-in-the-wayback-machine/"}]}}, {"kind": "work", "title": "Digital safety trainers", "line": "Digital security trainers for journalists, researchers and diaspora groups may be needed as concern grows over surveillance and transnational repression.", "guide": {"what": "Trainers who teach journalists, researchers, activists and diaspora groups to protect their phones, accounts and contacts from hacking, tracking and leaks.", "why": "After 1989, a secret network smuggled hundreds of activists out via Hong Kong. Since 2023, Hong Kong police have offered bounties for activists living abroad, so people at risk may need security training they can trust.", "how": ["Work through EFF’s Surveillance Self-Defense guides and practise threat modeling on yourself.", "Take a training-of-trainers course from a digital security or press freedom group.", "Volunteer to run a short phone security session for a local journalist or community group."], "read": [{"title": "EFF: Surveillance Self-Defense", "url": "https://ssd.eff.org/"}, {"title": "CPJ: Digital Safety Kit", "url": "https://cpj.org/2019/07/digital-safety-kit-journalists/"}]}}, {"kind": "learn", "title": "China and Hong Kong legal literacy", "line": "Understanding China’s national security, data and exit-ban rules helps firms, journalists and researchers work safely with or in China and Hong Kong.", "guide": {"what": "Knowing the main laws that shape work with China and Hong Kong, such as national security, counter-espionage, data and exit-ban rules, and how courts and police have applied them.", "why": "After 1989, Deng’s 1992 reforms drew a wave of foreign investment. Since 2020, national security laws, a wider counter-espionage law and exit bans have raised legal risks for firms, journalists and researchers working with China.", "how": ["Read English translations of key laws on China Law Translate, starting with data rules.", "Follow NPC Observer to see how new Chinese laws are drafted and passed.", "Ask a lawyer who advises firms in Hong Kong which rules clients misunderstand most."], "read": [{"title": "China Law Translate", "url": "https://www.chinalawtranslate.com/"}, {"title": "NPC Observer", "url": "https://npcobserver.com/"}]}}], "watch": "Emigration figures from Hong Kong, new visa routes for its residents and debate over 2047 would signal shifting demand for relocation and legal help."}}, {"id": "netscape", "theme": "A new technology reaches everyone at once", "rhyme": 3, "then": {"year": 1994, "short": "Netscape", "title": "The Netscape Navigator browser", "where": "Mountain View, California", "region": "us", "hook": "The browser that took millions of people onto the World Wide Web for the first time.", "text": "Released in December 1994 by a startup co-founded by Marc Andreessen, Netscape Navigator made the web easy for ordinary people to browse. Within months it was the most-used browser in the world."}, "now": {"year": 2022, "short": "ChatGPT", "title": "The launch of ChatGPT", "where": "San Francisco, California", "region": "us", "hook": "December 2022: everyone sharing screenshots of a chatbot writing poems, essays and computer code.", "text": "OpenAI released ChatGPT on 30 November 2022 as a free research preview. It passed 1 million users in five days and an estimated 100 million in about two months, the fastest growth yet seen for a consumer app."}, "followed": "Netscape’s 1995 stock debut helped set off the dot-com boom. Microsoft bundled Internet Explorer with Windows, won the “browser war” and faced a US antitrust case, and AOL bought Netscape in 1999.", "next": {"short": "Next Leap", "title": "The next technology everyone adopts overnight", "text": "Around 2050, another tool might reach hundreds of millions within weeks, perhaps brain-computer interfaces or household robots, setting off its own boom, bust and fight over who controls it.", "watch": "Lab demos that suddenly become cheap consumer products, user records broken in days, and investors rushing into a single new category."}, "breaks": "The web Netscape opened ran on open, shared standards, while the leading AI models cost vast sums to build and are controlled by a handful of firms.", "topic": "tech", "echoes": [{"year": 1455, "short": "Printing Press", "title": "Gutenberg’s printing press spreads across Europe", "region": "europe", "line": "After Gutenberg’s Bible of the 1450s, presses spread to over 200 European towns by 1500, turning out millions of books."}, {"year": 1839, "short": "Daguerreotype", "title": "France gives photography free to the world", "region": "europe", "line": "France bought Daguerre’s process and gave it free to the world; by 1853 Americans made an estimated three million daguerreotypes a year."}, {"year": 1900, "short": "Kodak Brownie", "title": "Kodak’s $1 Brownie camera", "region": "us", "line": "Kodak’s $1 Brownie shipped over 150,000 cameras in its first year, bringing snapshot photography to ordinary people."}, {"year": 1920, "short": "Radio Boom", "title": "The first radio broadcasting boom", "region": "us", "line": "Pittsburgh’s KDKA began regular commercial broadcasts, setting off a craze that put radio sets in millions of homes within five years."}, {"year": 1948, "short": "TV Boom", "title": "Television sweeps into American homes", "region": "us", "line": "The share of US homes with a television jumped from 1 percent in 1948 to 75 percent in 1955."}, {"year": 2007, "short": "iPhone", "title": "The launch of the iPhone", "region": "us", "line": "Apple’s iPhone put the web, music and phone in one touchscreen device; within a decade, billions of people carried smartphones."}], "opp": {"lastTime": "After Netscape, “webmaster” and web designer became common jobs, online shops and search engines multiplied, and in 1998 the US raised the H-1B visa cap from 65,000 to 115,000 as tech firms sought programmers. App stores set off a similar developer rush after 2008.", "ideas": [{"kind": "build", "title": "Making small firms AI-ready", "line": "Services that organize small firms’ documents, data and workflows so AI tools can use them, as web agencies once built firms’ first websites.", "guide": {"what": "Services that organize a small firm’s documents, data and routines so AI tools can use them safely, such as cleaning files, setting permissions and picking tasks worth automating.", "why": "After Netscape, web designers built first websites for many small firms. ChatGPT reached an estimated 100 million users in about two months, but many small firms lack tidy data or know-how, which may create local service work.", "how": ["Ask three local businesses which repetitive tasks eat their time and where their files live.", "Take the free Elements of AI course to learn what AI can and cannot do.", "Pilot one small project, like a searchable document library, and measure the time saved."], "read": [{"title": "Elements of AI (free course)", "url": "https://www.elementsofai.com/"}, {"title": "NIST AI Risk Management Framework", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}]}}, {"kind": "build", "title": "Visibility in AI answers", "line": "Services helping organizations appear accurately in AI assistant answers could grow, much as search engine optimization grew out of the late-1990s web.", "guide": {"what": "Helping organizations show up accurately when people ask AI assistants or AI search, by keeping facts clear, consistent and machine-readable on their own sites and trusted sources.", "why": "Search engine optimization grew out of the late-1990s web as search became the front door. Google now shows AI summaries above many results, and some sites report fewer clicks, so accurate presence in AI answers may matter.", "how": ["Ask several AI assistants about one local business and record errors and missing facts.", "Read Google’s guidance on AI features and learn basic Schema.org markup.", "Offer one organization a before-and-after audit, and be honest that results are hard to guarantee."], "read": [{"title": "Google Search Central: AI features and your website", "url": "https://developers.google.com/search/docs/appearance/ai-features"}, {"title": "Schema.org", "url": "https://schema.org/"}]}}, {"kind": "work", "title": "AI integration and evaluation roles", "line": "Roles that fit AI into everyday work, such as integration engineers and model evaluation specialists, may grow the way webmaster jobs did after 1995.", "guide": {"what": "Integration engineers connect AI models to a company’s data and software. Evaluation specialists design tests that show whether a model is accurate, safe and useful for a specific task.", "why": "After Netscape, webmaster became a common job, and in 1998 the US raised the H-1B visa cap as firms sought programmers. As companies move AI from demos to daily work, testing and integration skills may be in demand.", "how": ["Take the free Hugging Face LLM course to learn how models are built and used.", "Write a small evaluation with the open-source Inspect framework for a task you know well.", "Talk to someone who deploys AI at work about which skills they struggle to hire."], "read": [{"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "Inspect: open-source framework for AI evaluations", "url": "https://inspect.aisi.org.uk/"}]}}, {"kind": "learn", "title": "Competition rules for AI platforms", "line": "Antitrust and interoperability rules for AI platforms, as regulators revisit browser-war questions about bundling, defaults and access for smaller rivals.", "guide": {"what": "The antitrust and interoperability rules that decide whether big firms may bundle AI assistants into phones, browsers and office software, set defaults, or block smaller rivals from access.", "why": "Microsoft bundled Internet Explorer with Windows, won the browser war and faced a US antitrust case. Today the EU’s Digital Markets Act limits gatekeeper platforms, and a 2024 US ruling found Google illegally kept its search monopoly.", "how": ["Read the European Commission’s Digital Markets Act pages on gatekeeper obligations.", "Skim the UK CMA’s report on AI foundation models and its proposed principles.", "Study the US v. Microsoft browser case and note which questions repeat for AI."], "read": [{"title": "European Commission: About the Digital Markets Act", "url": "https://digital-markets-act.ec.europa.eu/about-dma_en"}, {"title": "UK CMA: AI Foundation Models initial report", "url": "https://www.gov.uk/government/publications/ai-foundation-models-initial-report"}]}}], "watch": "Falling prices per AI task, small firms hiring for AI roles, and antitrust cases over bundled AI assistants would show where openings are forming."}}, {"id": "dolly", "theme": "Science crosses a line in making life", "rhyme": 2, "then": {"year": 1996, "short": "Dolly", "title": "Dolly the cloned sheep", "where": "Roslin, Scotland", "region": "europe", "hook": "A Scottish sheep named Dolly that made the world ask whether humans would be cloned next.", "text": "Born at the Roslin Institute in July 1996 and unveiled in February 1997, Dolly was the first mammal cloned from an adult cell. She was the only lamb from 277 attempts, and her birth set off a global debate about human cloning."}, "now": {"year": 2018, "short": "CRISPR Babies", "title": "The first gene-edited babies", "where": "Shenzhen, China", "region": "china", "hook": "November 2018: a Chinese scientist announcing on YouTube that gene-edited twin girls had been born.", "text": "Scientist He Jiankui said he had used CRISPR to edit the CCR5 gene in twin girls’ embryos, aiming to make them resistant to HIV. Scientists worldwide condemned the work. In 2019 a Chinese court sentenced him to three years in prison."}, "followed": "Dozens of countries banned human reproductive cloning, and the UN adopted a non-binding declaration against it in 2005. In 2006, Japan’s Shinya Yamanaka found how to reprogram adult cells into stem cells without using embryos.", "next": {"short": "Lab-Made Life", "title": "Babies from lab-grown eggs and sperm", "text": "Around 2040, a clinic might announce a baby made from eggs or sperm grown from skin cells, reigniting the debate Dolly began.", "watch": "Lab-grown human eggs and sperm, embryo screening sold for traits, and countries with loose rules on reproductive technology."}, "breaks": "Dolly was a sheep made by a team that published its work openly, while He secretly edited human embryos, making heritable changes in real children.", "older": "Louise Brown, the first IVF baby, 1978", "topic": "health", "echoes": [{"year": 1803, "short": "Aldini’s Corpse", "title": "Aldini tries to revive a corpse", "region": "europe", "line": "In London, Giovanni Aldini electrified a hanged murderer’s corpse; the jaw quivered, an eye opened, and onlookers thought the man might revive."}, {"year": 1927, "short": "Ivanov’s Apes", "title": "Ivanov’s human-ape hybrid experiments", "region": "russia", "line": "Funded by the Soviet government, biologist Ilya Ivanov inseminated chimpanzees in French Guinea with human sperm, trying to create a human-ape hybrid."}, {"year": 1973, "short": "Gene Splicing", "title": "The first genetically engineered bacteria", "region": "us", "line": "Stanley Cohen and Herbert Boyer spliced foreign genes into bacteria, prompting scientists to pause such work and meet at Asilomar in 1975."}, {"year": 1978, "short": "IVF Baby", "title": "Louise Brown, the first IVF baby", "region": "europe", "line": "Louise Brown, the first baby conceived outside the body, was born in England, setting off a global debate over “test-tube babies”."}, {"year": 2010, "short": "Synthetic Cell", "title": "The first cell with a synthetic genome", "region": "us", "line": "Craig Venter’s team made a bacterium run on a lab-built genome, and President Obama asked his bioethics commission to study the risks."}, {"year": 2016, "short": "Three-Parent", "title": "The Mexico three-parent baby", "region": "latam", "line": "A US doctor went to Mexico, where he said “there are no rules,” to make a baby with DNA from three people."}], "opp": {"lastTime": "After the 1973 gene-splicing breakthrough, Herbert Boyer co-founded Genentech, whose lab-made human insulin won US approval in 1982, and after 1978 IVF grew into a global fertility industry. Dolly prompted national bioethics reviews and inspired research into reprogramming adult cells.", "ideas": [{"kind": "build", "title": "Clear genetic counseling services", "line": "Services that explain embryo screening and gene-therapy results clearly to patients could see demand as reproductive genetics moves from labs into clinics.", "guide": {"what": "Services that explain genetic test results, including embryo screening and gene therapy options, in plain language, helping patients understand risks, uncertainty and choices before they decide.", "why": "After 1978, IVF grew into a global industry, and Dolly prompted national bioethics reviews. Some firms now sell embryo screening for complex traits, which many geneticists call unproven, so clear, independent explanation may be valuable.", "how": ["Talk to a certified genetic counselor about what patients most often misunderstand.", "Read MedlinePlus Genetics pages on testing to learn plain explanations of key terms.", "Check local rules, since in many countries only licensed professionals may give genetic advice."], "read": [{"title": "National Society of Genetic Counselors", "url": "https://www.nsgc.org/"}, {"title": "MedlinePlus Genetics", "url": "https://medlineplus.gov/genetics/"}]}}, {"kind": "build", "title": "Compliance tools for fertility clinics", "line": "Consent, record-keeping and audit systems helping fertility and gene-therapy clinics meet tightening, country-by-country rules on embryo testing and editing.", "guide": {"what": "Software that helps fertility and gene therapy clinics manage consent forms, patient and embryo records, lab audits and reports to regulators, as rules differ from country to country.", "why": "After 1978, IVF grew into a global industry, and the UK set up a dedicated regulator, the HFEA, in 1991. Rules on embryo testing and editing differ widely and keep changing, which may raise demand for auditable records.", "how": ["Ask a clinic manager which reports and audits take the most staff time.", "Compare how two countries regulate embryo testing, for example the UK and Portugal.", "Learn health data protection basics, such as GDPR rules on genetic data, before building."], "read": [{"title": "ESHRE: European Society of Human Reproduction and Embryology", "url": "https://www.eshre.eu/"}]}}, {"kind": "work", "title": "Genetic counselors and embryologists", "line": "Genetic counselors, clinical embryologists and bioethics staff at hospitals and regulators may grow, as each breakthrough here has brought new oversight.", "guide": {"what": "Genetic counselors explain inherited risks and test results to patients. Clinical embryologists handle eggs, sperm and embryos in IVF labs, and bioethics staff help hospitals and regulators weigh new methods.", "why": "Genentech’s insulin and the IVF boom each created new kinds of jobs, and Dolly brought national ethics reviews. As embryo screening and gene therapies reach clinics and lab-made eggs are studied, trained staff and oversight may be needed.", "how": ["Check accredited routes: ABGC certification in the US, or ESHRE embryologist certification in Europe.", "Interview a genetic counselor or embryologist about their daily work and how long training took.", "Try a clinic or lab support role to test your interest before a long degree."], "read": [{"title": "American Board of Genetic Counseling", "url": "https://www.abgc.net/"}, {"title": "ESHRE: Certification for clin
