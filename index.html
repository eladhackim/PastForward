ith Hitler in August and invaded eastern Poland in September. Georgy Zhukov defeated Japan at Khalkhin Gol, and the Winter War with Finland began in November.", "mideast": "Britain's White Paper capped Jewish immigration to Palestine at 75,000 over five years. France ceded Hatay, part of its Syrian mandate, to Turkey, and Iraq's King Ghazi died in a car crash.", "africa": "South Africa's parliament voted 80 to 67 to join the war against Germany, and Prime Minister J.B.M. Hertzog, who wanted neutrality, gave way to Jan Smuts. Colonial armies began recruiting across Africa.", "india": "The viceroy declared India at war without consulting Indian leaders, and Congress provincial governments resigned in protest. Muhammad Ali Jinnah's Muslim League celebrated a “Day of Deliverance” from Congress rule.", "china": "Japanese bombers pounded the wartime capital Chongqing, killing thousands in May. Chinese forces held Changsha, while former Nationalist leader Wang Jingwei negotiated with Japan to head a collaborationist government."}, "1947": {"us": "Jackie Robinson broke baseball's color line with the Brooklyn Dodgers. The Truman Doctrine and Marshall Plan launched Cold War containment, and Chuck Yeager flew faster than sound.", "latam": "Argentina gave women the vote, a cause championed by Eva Perón, who also made a celebrated tour of Europe. Nations of the Americas signed the Rio Treaty, pledging mutual defense.", "europe": "Britain shivered through a brutal winter of fuel shortages. In June the US offered Marshall Plan aid, and Communists were forced out of the French and Italian governments.", "russia": "A postwar famine killed a million or more Soviet citizens. Stalin made Eastern Europe reject Marshall Plan aid and founded the Cominform to coordinate Europe's Communist parties.", "mideast": "The UN voted on 29 November to partition Palestine into Jewish and Arab states, and fighting broke out within days. Bedouin shepherds found the first Dead Sea Scrolls at Qumran.", "africa": "A revolt against French rule erupted in Madagascar in March; the French crackdown left tens of thousands dead. Kwame Nkrumah returned to the Gold Coast to organize a new nationalist party.", "india": "On 15 August, British India became independent as India and Pakistan. Partition uprooted about 15 million people and killed hundreds of thousands, and war over Kashmir began in October.", "china": "Civil war between Nationalists and Communists spread across China. In Taiwan, Nationalist troops crushed the February 28 uprising, and Japan's new pacifist constitution took effect in May."}, "1950": {"us": "Truman approved work on the hydrogen bomb and sent US troops to Korea in June. Senator Joseph McCarthy's anti-Communist crusade began, and Charles Schulz's Peanuts debuted.", "latam": "Uruguay stunned Brazil 2–1 at Rio's Maracanã stadium to win the World Cup before nearly 200,000 fans. In Guatemala, Jacobo Árbenz won the presidency promising land reform.", "europe": "On 9 May, France's Robert Schuman proposed pooling French and West German coal and steel, the seed of today's European Union. The European Convention on Human Rights was signed in November.", "russia": "Stalin and Mao signed a Sino-Soviet friendship treaty in Moscow. Stalin approved North Korea's invasion of the South, while Soviet diplomats boycotted the UN Security Council.", "mideast": "Israel passed the Law of Return, giving every Jew the right to immigrate, and Jordan annexed the West Bank. Egypt's Wafd party returned to power after January elections.", "africa": "South Africa passed the Population Registration and Group Areas acts, classifying people by race and segregating neighborhoods. In the Gold Coast, British authorities jailed Kwame Nkrumah after mass strikes.", "india": "India became a republic on 26 January as its new constitution took effect, with Rajendra Prasad as president. A magnitude 8.6 earthquake struck Assam and Tibet in August.", "china": "North Korea invaded the South on 25 June, and Chinese troops entered the war in October. Mao's new government launched land reform and sent the army into Tibet."}, "1956": {"us": "Eisenhower signed the act creating the Interstate Highway System and won re-election. Elvis Presley became a national sensation, and the Montgomery bus boycott ended after the Supreme Court struck down bus segregation.", "latam": "Fidel Castro and 81 other rebels landed in Cuba aboard the yacht Granma in December. Brazil's President Juscelino Kubitschek began building Brasília, and Nicaraguan dictator Anastasio Somoza García was assassinated.", "europe": "Hungarians rose against Soviet-backed rule in October until Soviet tanks crushed the revolution in November. Switzerland hosted the first Eurovision Song Contest in Lugano.", "russia": "Nikita Khrushchev denounced Stalin's crimes in a secret speech to the 20th Party Congress in February. In November, Soviet forces crushed the Hungarian uprising.", "mideast": "Gamal Abdel Nasser nationalized the Suez Canal Company, leading to an Israeli, British and French attack. Morocco and Tunisia won independence from France, while Algeria's war of independence intensified.", "africa": "Sudan became independent on 1 January. In South Africa, 20,000 women marched in Pretoria against pass laws, and in December police arrested 156 activists, including Nelson Mandela, for treason.", "india": "India redrew its state borders along language lines. B.R. Ambedkar led hundreds of thousands of Dalits in converting to Buddhism, and Pakistan became an Islamic republic under its first constitution.", "china": "Mao invited open criticism with the Hundred Flowers campaign, launched in May. Japan restored relations with the Soviet Union and joined the United Nations in December."}, "1957": {"us": "Eisenhower sent troops to protect nine Black students integrating Little Rock's Central High School. Congress passed the first civil rights act since Reconstruction, and Jack Kerouac's On the Road appeared.", "latam": "François “Papa Doc” Duvalier won Haiti's presidency in September. Colombia's military ruler Gustavo Rojas Pinilla fell in May, and Fidel Castro's rebels fought on in Cuba's Sierra Maestra.", "europe": "Six nations signed the Treaty of Rome, founding the European Economic Community. Harold Macmillan succeeded Anthony Eden in Britain, telling voters they had “never had it so good”.", "russia": "Khrushchev beat a Kremlin plot to oust him. The R-7, the first intercontinental missile, launched Sputnik in October, and a nuclear waste tank exploded at the secret Mayak plant.", "mideast": "The Suez Canal reopened in April after salvage crews cleared it. Tunisia abolished its monarchy and made Habib Bourguiba president, and the Eisenhower Doctrine offered US aid against communism.", "africa": "On 6 March the Gold Coast became independent Ghana, led by Kwame Nkrumah, inspiring independence movements across the continent. In Kenya, the British hanged Mau Mau leader Dedan Kimathi.", "india": "Kerala elected a Communist government under E.M.S. Namboodiripad, and Nehru's Congress won India's second general election. Mehboob Khan's Mother India became a landmark of Hindi cinema.", "china": "When the Hundred Flowers campaign unleashed sharp criticism, Mao launched the Anti-Rightist Campaign, branding over 500,000 people rightists. The first bridge across the Yangtze opened at Wuhan."}, "1962": {"us": "President Kennedy confronted the Soviet Union in the 13-day Cuban Missile Crisis in October. John Glenn became the first American to orbit Earth, and James Meredith integrated the University of Mississippi.", "latam": "Jamaica and Trinidad and Tobago won independence from Britain in August. Brazil won the football World Cup hosted by Chile, and Cuba became the flashpoint of the missile crisis.", "europe": "The Second Vatican Council opened in Rome in October, and the Beatles released their first single, “Love Me Do”. France signed the Évian Accords, ending its war in Algeria.", "russia": "Soviet leader Nikita Khrushchev placed nuclear missiles in Cuba, then withdrew them. Troops shot striking workers in Novocherkassk, and Solzhenitsyn’s gulag story “One Day in the Life of Ivan Denisovich” appeared.", "mideast": "Algeria won independence from France in July after an eight-year war. In North Yemen, officers overthrew the imam in September, starting a civil war that drew in Nasser’s Egyptian troops.", "africa": "Uganda, Rwanda and Burundi became independent. In South Africa, Nelson Mandela was arrested in August and jailed, and the UN General Assembly called for sanctions against apartheid.", "india": "India lost a brief border war with China in October and November, a heavy blow to Prime Minister Nehru. China declared a ceasefire and kept control of Aksai Chin.", "china": "At the Seven Thousand Cadres Conference, Mao made a rare self-criticism over the Great Leap Forward, whose famine had killed tens of millions. Japan boomed under Prime Minister Ikeda’s income-doubling plan."}, "1968": {"us": "Martin Luther King Jr. and Robert Kennedy were assassinated, and the Tet Offensive eroded support for the Vietnam War. Richard Nixon won the presidency, and Apollo 8 orbited the Moon.", "latam": "Mexican troops fired on student protesters at Tlatelolco ten days before Mexico City hosted the Olympics. Brazil’s military regime issued AI-5, suspending civil liberties, and Peru’s army seized power.", "europe": "Students and about 10 million striking workers paralyzed France in May. In August, Warsaw Pact troops invaded Czechoslovakia and ended Alexander Dubček’s Prague Spring reforms.", "russia": "Leonid Brezhnev sent tanks into Czechoslovakia and claimed a right to intervene in socialist states. A handful of dissidents protested on Red Square, and Andrei Sakharov circulated an essay calling for reform.", "mideast": "The Ba’ath Party seized power in Iraq in July, with Saddam Hussein as a rising figure. Palestinian fighters and Jordan’s army fought Israeli forces at the Battle of Karameh.", "africa": "Images of famine in breakaway Biafra, blockaded during Nigeria’s civil war, shocked the world. Mauritius and Swaziland gained independence from Britain.", "india": "India harvested a record wheat crop from new high-yield seeds, a breakthrough soon called the Green Revolution. The Beatles studied meditation in Rishikesh, and protests against Pakistan’s Ayub Khan began.", "china": "Mao began sending millions of urban youths to the countryside amid the Cultural Revolution. Japan’s economy overtook West Germany’s, second only to America’s among market economies."}, "1973": {"us": "The Supreme Court decided Roe v. Wade, and the last US combat troops left Vietnam. Televised Watergate hearings gripped the country, and the oil embargo brought lines at gas stations.", "latam": "General Augusto Pinochet seized power in Chile on 11 September, and President Allende died during the coup. Uruguay’s military took over, and Juan Perón returned as Argentina’s president.", "europe": "Britain, Ireland and Denmark joined the European Economic Community on 1 January. The oil embargo brought car-free Sundays, and Greek troops crushed a student uprising at Athens Polytechnic.", "russia": "Leonid Brezhnev toured the United States in June at the height of détente. Moscow airlifted arms to Egypt and Syria in October, and Solzhenitsyn’s “The Gulag Archipelago” was published in Paris.", "mideast": "Egypt and Syria attacked Israel on 6 October, starting the Yom Kippur War. Arab oil producers cut output and embargoed the US, and oil prices roughly quadrupled within months.", "africa": "Guinea-Bissau’s rebels declared independence from Portugal months after their leader Amílcar Cabral was assassinated. A hidden famine in Ethiopia’s Wollo province was exposed on British television.", "india": "India’s Supreme Court ruled in the Kesavananda Bharati case that Parliament cannot alter the constitution’s basic structure, and Project Tiger began. Pakistan adopted a new constitution.", "china": "Deng Xiaoping returned from political disgrace as vice premier. In Japan, the oil shock set off panic buying of toilet paper and ended nearly two decades of rapid growth."}, "1975": {"us": "New York City neared bankruptcy, and Bill Gates and Paul Allen founded Microsoft. Apollo and Soyuz spacecraft docked in orbit, and “Jaws” became the first summer blockbuster.", "latam": "Suriname gained independence from the Netherlands in November. Military governments in South America secretly launched Operation Condor to hunt down opponents across borders.", "europe": "Francisco Franco died in November, and Juan Carlos became king of Spain. Portugal held its first free elections in nearly 50 years, and 35 nations signed the Helsinki Accords.", "russia": "Brezhnev signed the Helsinki Accords, gaining recognition of postwar borders in exchange for human rights pledges. Andrei Sakharov won the Nobel Peace Prize but was barred from collecting it.", "mideast": "Lebanon’s civil war began in April. Saudi King Faisal was assassinated by a nephew, and Egypt reopened the Suez Canal, closed since the 1967 war.", "africa": "Mozambique and Angola won independence from Portugal. Angola slid into civil war as Cuban troops and South African forces intervened on opposing sides.", "india": "Indira Gandhi declared a state of Emergency in June, suspending civil liberties and jailing opponents. In Bangladesh, founding leader Sheikh Mujibur Rahman was assassinated in August.", "china": "Chiang Kai-shek died in Taiwan in April. In Beijing, Zhou Enlai called for the “Four Modernizations”, while in Cambodia the Khmer Rouge seized Phnom Penh and emptied the cities."}, "1980": {"us": "Mount St. Helens erupted in May, and CNN launched as the first 24-hour news channel. Ronald Reagan won the presidency while American hostages were still held in Iran.", "latam": "Archbishop Óscar Romero was shot dead while saying Mass in El Salvador. About 125,000 Cubans left for Florida in the Mariel boatlift, and Peru’s Shining Path launched its insurgency.", "europe": "Strikes at Gdańsk’s shipyard gave birth to Solidarity, the Soviet bloc’s first independent trade union, led by Lech Wałęsa. Yugoslavia’s leader Josip Broz Tito died in May.", "russia": "Moscow hosted the Summer Olympics, boycotted by the US and dozens of other countries over the invasion of Afghanistan. Andrei Sakharov was exiled to the closed city of Gorky.", "mideast": "Iraq invaded Iran in September, starting an eight-year war. Turkey’s military seized power in a coup, and American diplomats remained hostages in Tehran.", "africa": "Zimbabwe became independent in April with Robert Mugabe as prime minister. In Liberia, Samuel Doe seized power in a coup and President William Tolbert was killed.", "india": "Indira Gandhi returned to power in January. Her son Sanjay died in a plane crash, and India put a satellite into orbit on its own rocket for the first time.", "china": "China made Shenzhen a special economic zone and put the Gang of Four on trial. South Korean troops crushed the Gwangju Uprising in May, and Japan released the arcade game Pac-Man."}, "1986": {"us": "Space shuttle Challenger broke apart 73 seconds after launch in January, killing all seven aboard. In November, the Iran-Contra affair revealed secret arms sales to Iran under President Reagan.", "latam": "Jean-Claude Duvalier fled Haiti in February, ending his family’s 29-year rule. Diego Maradona led Argentina to World Cup victory in Mexico, scoring the “Hand of God” goal.", "europe": "Spain and Portugal joined the European Community in January. Swedish Prime Minister Olof Palme was shot dead in Stockholm, and Chernobyl’s fallout reached much of Europe.", "russia": "Chernobyl’s reactor exploded in April. Mikhail Gorbachev began promoting glasnost, met Reagan at the Reykjavík summit and freed Andrei Sakharov from exile, and the Mir space station launched.", "mideast": "US warplanes bombed Libya in April after a Berlin disco bombing that Washington blamed on Gaddafi. In the Iran-Iraq War, Iran captured Iraq’s Faw Peninsula.", "africa": "South Africa declared a nationwide state of emergency, and the US Congress imposed sanctions over Reagan’s veto. Yoweri Museveni took power in Uganda, and Wole Soyinka won the Nobel Prize in Literature.", "india": "Rajiv Gandhi’s government passed a law reversing the Shah Bano maintenance ruling, and a court ordered the disputed Babri Masjid unlocked. Benazir Bhutto returned to Pakistan to large crowds.", "china": "Student protests for political reform spread from Hefei to Shanghai in December. Japan’s asset bubble began to inflate, and People Power protests drove Ferdinand Marcos from the Philippines."}, "1989": {"us": "George H.W. Bush became president in January. The Exxon Valdez spilled oil into Alaska’s Prince William Sound, and an earthquake hit the San Francisco Bay Area during the World Series.", "latam": "Riots over price hikes shook Caracas, and Paraguay’s Alfredo Stroessner was overthrown after over three decades. Chile elected its first civilian president since 1973, and US troops invaded Panama to remove Noriega.", "europe": "Poland held partly free elections in June, and the Berlin Wall opened on 9 November. Communist rule collapsed across Eastern Europe, and Romania’s Ceaușescu was executed on Christmas Day.", "russia": "The last Soviet troops left Afghanistan, and partly free elections produced a televised parliament of fierce debate. About two million people formed a human chain across the Baltic republics.", "mideast": "Ayatollah Khomeini issued a fatwa against author Salman Rushdie in February and died in June. Lebanon’s factions signed the Taif Agreement, the framework for ending the civil war.", "africa": "F.W. de Klerk became South Africa’s president and freed Walter Sisulu and other ANC leaders. Namibia voted in UN-supervised elections, and Charles Taylor’s rebels invaded Liberia.", "india": "Rajiv Gandhi lost India’s election amid the Bofors arms scandal, and V.P. Singh became prime minister. An armed insurgency erupted in Kashmir.", "china": "Protests in Tiananmen Square ended in a military crackdown on 4 June. In Japan, Emperor Hirohito died in January, and the stock market bubble peaked on the year’s last trading day."}, "1994": {"us": "NAFTA took effect on 1 January, and millions watched O.J. Simpson’s slow-speed police chase. Republicans won both houses of Congress, taking the House for the first time in 40 years.", "latam": "Zapatista rebels rose up in Chiapas as NAFTA began, and Mexico’s peso collapsed in December. Brazil launched the real currency to tame inflation and won the World Cup.", "europe": "The Channel Tunnel opened between Britain and France, and the IRA declared a ceasefire. The siege of Sarajevo continued, and Norwegians voted against joining the European Union.", "russia": "Russia’s last troops left Germany, Estonia and Latvia, and the MMM pyramid scheme collapsed, costing millions of investors their savings. In December, Boris Yeltsin sent the army into Chechnya.", "mideast": "Yasser Arafat returned to Gaza under the Oslo Accords, and Jordan signed a peace treaty with Israel. Arafat, Yitzhak Rabin and Shimon Peres shared the Nobel Peace Prize.", "africa": "Nelson Mandela became South Africa’s first Black president after all-race elections in April. In Rwanda, about 800,000 people, mostly Tutsi, were killed in a genocide lasting about 100 days.", "india": "Plague broke out in Surat in September, sending hundreds of thousands fleeing the city. Indians Sushmita Sen and Aishwarya Rai won Miss Universe and Miss World as economic reforms opened the country.", "china": "North Korea’s founder Kim Il-sung died in July, and his son Kim Jong-il took over. China connected fully to the internet and began building the Three Gorges Dam."}, "1996": {"us": "Bill Clinton won re-election and signed a major welfare reform law. Atlanta hosted the Summer Olympics, marred by a bombing in Centennial Olympic Park.", "latam": "Guatemala signed peace accords in December, ending a 36-year civil war. In Lima, Túpac Amaru rebels seized the Japanese ambassador’s residence and took hundreds of hostages.", "europe": "Britain announced a likely link between mad cow disease and a fatal human brain illness, and the EU banned British beef exports. England hosted the Euro 96 football tournament.", "russia": "Boris Yeltsin won re-election in a July run-off against Communist Gennady Zyuganov, despite heart trouble. The Khasavyurt agreement ended the first war in Chechnya.", "mideast": "Benjamin Netanyahu won Israel’s first direct election for prime minister, and a truck bomb hit the Khobar Towers in Saudi Arabia. Qatar launched Al Jazeera in November.", "africa": "South Africa adopted its post-apartheid constitution and began Truth and Reconciliation hearings. In Zaire, Laurent Kabila’s rebels, backed by Rwanda, launched the First Congo War.", "india": "The Taliban captured Kabul. India’s Congress party lost power, Atal Bihari Vajpayee’s first government lasted 13 days, and Sri Lanka won the cricket World Cup.", "china": "China fired test missiles near Taiwan before its first direct presidential election, which Lee Teng-hui won. In Japan, Nintendo released the first Pokémon games."}, "1997": {"us": "Mars Pathfinder landed on Mars on 4 July and sent its small rover across the surface. Amazon went public, and “Titanic” opened in December on its way to becoming the top-grossing film.", "latam": "Peruvian commandos stormed the Japanese ambassador’s residence in April, ending a four-month hostage crisis. In Mexico, the ruling PRI lost its majority in the lower house for the first time.", "europe": "Tony Blair’s Labour Party won a landslide in Britain in May. Princess Diana died in a Paris car crash in August, and Scotland and Wales voted for devolved parliaments.", "russia": "Boris Yeltsin signed a peace treaty with Chechnya’s leaders and the NATO-Russia Founding Act, as NATO prepared to admit former Warsaw Pact states.", "mideast": "Reformist Mohammad Khatami won Iran’s presidential election in a landslide. In Egypt, militants killed 62 people, mostly foreign tourists, at Luxor’s Temple of Hatshepsut.", "africa": "Laurent Kabila’s forces took Kinshasa in May, ending Mobutu Sese Seko’s 32-year rule and renaming Zaire the Democratic Republic of the Congo. Ghana’s Kofi Annan became UN secretary-general.", "india": "India and Pakistan marked 50 years of independence. K.R. Narayanan became India’s first Dalit president, and Arundhati Roy won the Booker Prize for “The God of Small Things”.", "china": "Deng Xiaoping died in February, and Britain handed Hong Kong back to China on 1 July. The Asian financial crisis began in Thailand and forced South Korea to seek an IMF bailout."}, "1999": {"us": "The Senate acquitted President Clinton in his impeachment trial in February. Two students killed 13 people at Columbine High School, and protests disrupted the WTO meeting in Seattle.", "latam": "Hugo Chávez became Venezuela’s president, and floods and mudslides in Vargas state killed thousands in December. The United States handed the Panama Canal to Panama on 31 December.", "europe": "The euro launched on 1 January as an electronic currency in 11 countries. NATO bombed Yugoslavia for 78 days over Kosovo, and Poland, Hungary and the Czech Republic joined NATO.", "russia": "Apartment bombings, which officials blamed on Chechen militants, killed about 300 people, and Russia launched a second war in Chechnya. Boris Yeltsin resigned on 31 December, naming Vladimir Putin acting president.", "mideast": "Jordan’s King Hussein and Morocco’s King Hassan II died, and their sons took the thrones. An earthquake near İzmit, Turkey, killed about 17,000 people in August.", "africa": "Nigeria returned to civilian rule under Olusegun Obasanjo, and Thabo Mbeki succeeded Nelson Mandela in South Africa. Sierra Leone’s government and rebels signed the Lomé peace accord.", "india": "India and Pakistan fought the Kargil conflict in Kashmir’s mountains. General Pervez Musharraf seized power in Pakistan in October, and a super cyclone killed about 10,000 people in Orissa.", "china": "Portugal handed Macau to China in December, and Beijing banned the Falun Gong movement. An earthquake killed about 2,400 people in Taiwan, and a nuclear accident struck Tokaimura, Japan."}, "2000": {"us": "The presidential election came down to a Florida recount, halted by the Supreme Court in December, making George W. Bush the winner over Al Gore. The dot-com bubble burst.", "latam": "Vicente Fox won Mexico’s presidency, ending 71 years of rule by the PRI. In Peru, Alberto Fujimori fled to Japan amid a corruption scandal and resigned by fax.", "europe": "Mass protests in Belgrade toppled Slobodan Milošević in October. An Air France Concorde crashed near Paris in July, killing 113, and the new euro fell to record lows.", "russia": "Vladimir Putin won the presidential election in March. In August, the submarine Kursk sank in the Barents Sea with all 118 aboard, and Putin faced criticism for his slow response.", "mideast": "Israel withdrew from southern Lebanon, Camp David peace talks failed, and the Second Intifada began in September. Syria’s Hafez al-Assad died, and his son Bashar took power.", "africa": "Floods devastated Mozambique, where a baby was born in a tree above the water. Zimbabwe began seizing white-owned farms, and British troops intervened in Sierra Leone’s civil war.", "india": "India’s population passed one billion, and three new states were created: Chhattisgarh, Jharkhand and Uttaranchal, now Uttarakhand. Bill Clinton made the first US presidential visit in 22 years.", "china": "Kim Dae-jung met Kim Jong-il in Pyongyang at the first inter-Korean summit and won the Nobel Peace Prize. In Taiwan, Chen Shui-bian’s election ended five decades of Kuomintang rule."}, "2003": {"us": "The US led the invasion of Iraq in March. Space shuttle Columbia broke apart on re-entry in February, and Arnold Schwarzenegger was elected governor of California in a recall vote.", "latam": "Luiz Inácio Lula da Silva became Brazil’s president, and Néstor Kirchner took office in Argentina. Deadly protests over gas exports forced Bolivia’s president to resign in October.", "europe": "Millions marched against the Iraq war on 15 February. An August heatwave killed tens of thousands across Europe, about 15,000 in France alone, and Concorde made its last flights.", "russia": "Oil tycoon Mikhail Khodorkovsky, Russia’s richest man, was arrested in October. Putin’s United Russia party won December’s parliamentary elections, and St Petersburg celebrated its 300th anniversary.", "mideast": "US-led forces toppled Saddam Hussein in April and captured him in December. An earthquake destroyed Bam in Iran, killing about 26,000, and Libya agreed to abandon weapons of mass destruction.", "africa": "Fighting in Sudan’s Darfur escalated as government-backed militias attacked civilians. In Liberia, Charles Taylor stepped down and went into exile in Nigeria as rebels besieged Monrovia.", "india": "India and Pakistan agreed a ceasefire along the Line of Control in Kashmir in November. Twin car bombs killed more than 50 people in Mumbai in August.", "china": "SARS spread from southern China, killing about 800 people worldwide. Hu Jintao became China’s president, and Yang Liwei became the country’s first astronaut in space."}, "2007": {"us": "Steve Jobs unveiled the iPhone in January, and it went on sale in June. By spring, subprime mortgage lenders were going bankrupt, an early sign of the coming financial crisis.", "latam": "Cristina Fernández de Kirchner was elected president of Argentina, succeeding her husband Néstor. In December, Venezuelan voters narrowly rejected Hugo Chávez’s constitutional reform, his first defeat at the polls.", "europe": "Nicolas Sarkozy won France’s presidency, and Gordon Brown replaced Tony Blair as British prime minister. In September, savers queued outside Northern Rock in Britain’s first bank run in over a century.", "russia": "Vladimir Putin, barred from a third straight term, named Dmitry Medvedev as his preferred successor in December. Sochi won the 2014 Winter Olympics, and Boris Yeltsin died in April.", "mideast": "Hamas seized control of Gaza from rival Fatah in June, splitting Palestinian rule in two. In Iraq, the US sent more than 20,000 extra troops in a “surge” against sectarian violence.", "africa": "Kenya’s December election ended in disputed results and deadly unrest after Mwai Kibaki was declared the winner over Raila Odinga. Nigeria saw its first handover between elected civilian presidents.", "india": "Former Pakistani prime minister Benazir Bhutto was assassinated at a rally in December. India won cricket’s first T20 World Cup, and Pratibha Patil became its first woman president.", "china": "Xi Jinping joined the Communist Party’s top leadership in October as Beijing prepared for the Olympics. Japan’s Shinzo Abe resigned after a year, and South Korea elected Lee Myung-bak."}, "2008": {"us": "Lehman Brothers collapsed in September, turning a housing slump into a global financial crisis. In November, Barack Obama was elected the first Black president of the United States.", "latam": "Fidel Castro formally handed Cuba’s presidency to his brother Raúl in February. In July, Colombia’s army tricked FARC rebels into freeing Ingrid Betancourt and 14 other hostages without a shot fired.", "europe": "Kosovo declared independence from Serbia in February. In October, Iceland’s three biggest banks collapsed within a week, and governments across Europe rushed to rescue their lenders.", "russia": "Dmitry Medvedev became president, with Vladimir Putin as prime minister. In August, Russia fought a five-day war with Georgia, then recognized South Ossetia and Abkhazia as independent.", "mideast": "Iraq and the US agreed in November that American troops would leave by the end of 2011. On December 27, Israel launched a major offensive against Hamas in Gaza after rocket fire.", "africa": "After more than 1,000 deaths, Kenya’s rivals agreed to share power in February. Zimbabwe sank into crisis with a disputed election, runaway inflation and a cholera outbreak.", "india": "Ten gunmen attacked hotels, a train station and other sites in Mumbai in November, killing 166 people. Earlier, India launched its first Moon probe, and the Indian Premier League began.", "china": "A May earthquake in Sichuan killed nearly 70,000 people. In August, Beijing hosted the Summer Olympics, and China topped the gold medal table for the first time."}, "2011": {"us": "US Navy SEALs killed Osama bin Laden in May. Standard & Poor’s downgraded US government debt in August, and Occupy Wall Street protesters camped in lower Manhattan from September.", "latam": "Dilma Rousseff took office as Brazil’s first woman president. Chilean students held months of mass protests for free public education, and Hugo Chávez revealed he was being treated for cancer.", "europe": "The euro debt crisis pushed Portugal into a bailout and toppled leaders in Greece and Italy. In July, a far-right extremist killed 77 people in Norway, most at a youth camp.", "russia": "In September, Vladimir Putin announced he would return to the presidency, swapping jobs with Dmitry Medvedev. After December’s parliamentary election, tens of thousands protested in Moscow over alleged vote fraud.", "mideast": "The Arab Spring toppled Tunisia’s Ben Ali in January and Egypt’s Hosni Mubarak in February. Libya’s Muammar Gaddafi was killed in October, and Syria’s protests grew into an armed uprising.", "africa": "South Sudan became the world’s newest country on July 9. Famine struck parts of Somalia, and Ivory Coast’s Laurent Gbagbo was arrested after refusing to accept his election defeat.", "india": "India won the Cricket World Cup at home in April, and Anna Hazare’s hunger strikes against corruption drew huge crowds. In May, US forces killed Osama bin Laden in Abbottabad, Pakistan.", "china": "On March 11, a magnitude 9 earthquake and tsunami left about 18,000 dead or missing in Japan and caused meltdowns at Fukushima. North Korea’s Kim Jong-il died in December."}, "2014": {"us": "Protests erupted in Ferguson, Missouri, after a police officer shot dead Michael Brown, an unarmed Black teenager, in August. That summer, the Ice Bucket Challenge swept social media.", "latam": "Brazil hosted the World Cup and lost its semifinal 7-1 to Germany. In Mexico, 43 students from Ayotzinapa disappeared in September, and in December the US and Cuba agreed to restore ties.", "europe": "Ukraine’s president fled in February after months of protests in Kyiv, and war broke out in the east. In September, Scotland voted 55 to 45 percent to stay in the United Kingdom.", "russia": "Russia hosted the Winter Olympics in Sochi, then annexed Crimea from Ukraine in March. Western sanctions and falling oil prices sent the ruble crashing by December.", "mideast": "Islamic State seized Mosul in June and declared a caliphate across parts of Iraq and Syria. That summer, a 50-day war between Israel and Hamas killed over 2,200 Palestinians and 73 Israelis.", "africa": "Ebola spread through Guinea, Liberia and Sierra Leone in the worst outbreak on record. In Nigeria, Boko Haram kidnapped 276 schoolgirls from Chibok, sparking the #BringBackOurGirls campaign.", "india": "Narendra Modi led the BJP to a landslide election win in May. India’s Mangalyaan probe reached Mars orbit on its first attempt, and Malala Yousafzai shared the Nobel Peace Prize.", "china": "Pro-democracy protesters occupied Hong Kong streets for 79 days in the Umbrella Movement. In April, South Korea’s Sewol ferry sank, killing 304 people, most of them high school students."}, "2015": {"us": "In June, the Supreme Court ruled same-sex couples have the right to marry nationwide. That month, a gunman killed nine Black worshippers at a Charleston church, and Donald Trump launched his campaign.", "latam": "Zika virus spread across Brazil and was linked to a surge in babies born with small heads. Drug lord El Chapo escaped a Mexican prison through a mile-long tunnel in July.", "europe": "More than a million refugees and migrants reached Europe, many fleeing Syria’s war. Paris suffered the Charlie Hebdo attack in January and coordinated attacks that killed 130 people in November.", "russia": "Opposition politician Boris Nemtsov was shot dead near the Kremlin in February. In September, Russia began airstrikes in Syria in support of Bashar al-Assad’s government.", "mideast": "Iran agreed in July to limit its nuclear program in return for sanctions relief. In March, Saudi Arabia under new King Salman began leading airstrikes against Houthi rebels in Yemen.", "africa": "Muhammadu Buhari became the first opposition candidate to unseat a sitting president in Nigeria. In April, al-Shabaab gunmen killed 148 people at Garissa University College in Kenya.", "india": "A magnitude 7.8 earthquake struck Nepal in April, killing nearly 9,000 people. In India, Arvind Kejriwal’s young Aam Aadmi Party won 67 of 70 seats in Delhi’s election.", "china": "China’s stock market crashed in the summer, and in October Beijing announced the end of its one-child policy. In August, chemical explosions at Tianjin’s port killed 173 people."}, "2016": {"us": "Donald Trump won the presidency in November, beating Hillary Clinton in the Electoral College while losing the popular vote. In June, a gunman killed 49 people at the Pulse nightclub in Orlando.", "latam": "Rio de Janeiro hosted the Olympics, and Brazil’s Senate removed Dilma Rousseff in August. Colombia signed a peace deal with FARC rebels, and Fidel Castro died in November.", "europe": "Britain voted 52 to 48 percent in June to leave the European Union. Terror attacks hit Brussels, Nice and Berlin, and Portugal won the Euro 2016 football championship.", "russia": "The McLaren report described state-backed doping of Russian athletes, and Russia’s track team missed the Rio Olympics. US intelligence accused Russia of election interference, which Moscow denied.", "mideast": "A failed military coup in Turkey in July was followed by mass arrests under President Erdoğan. In December, Syrian government forces backed by Russia retook all of Aleppo.", "africa": "In the Gambia, Yahya Jammeh lost the December election after 22 years in power, then refused to step down. Ethiopia declared a state of emergency after months of protests.", "india": "On November 8, Narendra Modi abruptly withdrew 500 and 1,000 rupee notes, about 86 percent of the cash in circulation. Long queues formed outside banks for weeks.", "china": "Google’s AlphaGo beat Go champion Lee Sedol 4-1 in Seoul in March. Huge candlelight protests led South Korea’s parliament to impeach President Park Geun-hye in December."}, "2017": {"us": "Donald Trump took office in January, and millions joined Women’s Marches the next day. Hurricane Harvey flooded Houston in August, and in October the #MeToo movement spread online.", "latam": "Months of protests against Nicolás Maduro in Venezuela left more than 120 dead. In September, an earthquake killed about 370 people in Mexico, and Hurricane Maria devastated Puerto Rico.", "europe": "Emmanuel Macron was elected president of France at 39. In June, the Grenfell Tower fire in London killed 72 people, and in October Catalonia held a banned independence referendum.", "russia": "Alexei Navalny’s video alleging corruption by Prime Minister Dmitry Medvedev sparked nationwide protests in March. In December, the IOC barred Russia’s team from the 2018 Winter Olympics over doping.", "mideast": "Iraqi forces retook Mosul from Islamic State in July, and Raqqa fell in October. Mohammed bin Salman became Saudi crown prince, and Saudi Arabia and its allies cut ties with Qatar.", "africa": "Robert Mugabe resigned in November after 37 years in power, following a military takeover in Zimbabwe. In September, Kenya’s Supreme Court annulled the presidential election, a first in Africa.", "india": "India launched a nationwide goods and services tax on July 1, replacing many state levies. From August, more than 600,000 Rohingya refugees fled Myanmar into Bangladesh.", "china": "North Korea tested long-range missiles and its most powerful nuclear bomb. South Korea removed Park Geun-hye from office, and China’s Communist Party wrote “Xi Jinping Thought” into its constitution."}, "2018": {"us": "After a gunman killed 17 people at a high school in Parkland, Florida, students led nationwide marches. A US-China trade war began with rising tariffs, and Democrats won the House in November.", "latam": "Andrés Manuel López Obrador won Mexico’s presidency in July, and Jair Bolsonaro won Brazil’s in October. Millions of Venezuelans had fled economic collapse, many to Colombia and Peru.", "europe": "Yellow vest protests against fuel taxes spread across France from November. In May, the EU’s GDPR privacy rules took effect, flooding inboxes with consent emails.", "russia": "Vladimir Putin won a fourth term in March, and Russia hosted the football World Cup that summer. Britain blamed Russia for poisoning ex-spy Sergei Skripal with a nerve agent, which Moscow denied.", "mideast": "The US quit the Iran nuclear deal and moved its embassy to Jerusalem in May. Saudi women began driving legally, and journalist Jamal Khashoggi was killed in Saudi Arabia’s Istanbul consulate.", "africa": "Abiy Ahmed became Ethiopia’s prime minister in April and made peace with Eritrea after two decades of hostility. In South Africa, Cyril Ramaphosa replaced Jacob Zuma as president.", "india": "India’s Supreme Court decriminalized gay sex in September, and the 182-meter Statue of Unity became the world’s tallest statue. In Pakistan, former cricket star Imran Khan became prime minister.", "china": "China removed presidential term limits in March, allowing Xi Jinping to stay on indefinitely. In June, Kim Jong-un and Donald Trump held the first North Korea-US summit, in Singapore."}, "2019": {"us": "The longest government shutdown so far, 35 days, ended in January. Robert Mueller’s Russia report came out in April, and in December the House impeached Donald Trump over his dealings with Ukraine.", "latam": "A subway fare rise in Chile sparked mass protests in October. Bolivia’s Evo Morales resigned in November amid protests over a disputed election, and fires in the Amazon drew global alarm.", "europe": "Fire destroyed Notre-Dame’s roof and spire in April. Boris Johnson became British prime minister in July and won a large majority in December, promising to “get Brexit done.”", "russia": "Large protests broke out in Moscow in the summer after opposition candidates were barred from city elections. In December, the World Anti-Doping Agency banned Russia from major sporting events for four years.", "mideast": "Mass protests forced out Algeria’s Abdelaziz Bouteflika in April and broke out in Lebanon and Iraq in October. Islamic State leader Abu Bakr al-Baghdadi died during a US raid in Syria.", "africa": "After months of protests, Sudan’s army removed Omar al-Bashir in April after 30 years in power. Cyclone Idai killed more than 1,000 people in Mozambique, Zimbabwe and Malawi.", "india": "Narendra Modi won a bigger majority in May. In August, his government revoked Jammu and Kashmir’s special status, and a new citizenship law set off nationwide protests in December.", "china": "Huge crowds marched in Hong Kong from June against an extradition bill, starting months of clashes. Naruhito became Japan’s emperor in May, and a new pneumonia appeared in Wuhan in December."}, "2020": {"us": "COVID-19 shut down much of the country from March. After a Minneapolis police officer killed George Floyd in May, protests spread nationwide, and Joe Biden won the presidency in November.", "latam": "COVID-19 hit Brazil, Mexico and Peru especially hard. In October, Chileans voted 78 percent in favor of writing a new constitution, and Argentina legalized abortion in December.", "europe": "Britain formally left the EU on January 31. In March, Italy imposed Europe’s first national COVID-19 lockdown, and Belarus erupted in protests after a disputed August election.", "russia": "Voters approved constitutional changes in July that could let Vladimir Putin stay in power until 2036. In August, Alexei Navalny was poisoned with a nerve agent; the Kremlin denied involvement.", "mideast": "A US drone strike killed Iranian general Qassem Soleimani in January. In August, an explosion at Beirut’s port killed more than 200 people, and the UAE and Bahrain normalized ties with Israel.", "africa": "War broke out in Ethiopia’s Tigray region in November. In October, #EndSARS protests against police brutality swept Nigeria, and in August Mali’s military ousted its president.", "india": "India’s sudden COVID-19 lockdown in March sent millions of migrant workers walking home. In June, 20 Indian soldiers died in a clash with Chinese troops in the Himalayas.", "china": "China locked down Wuhan in January as the new coronavirus spread. In June, Beijing imposed a national security law on Hong Kong, and the Tokyo Olympics were postponed by a year."}, "2021": {"us": "Supporters of Donald Trump stormed the Capitol on January 6 as Congress certified Joe Biden’s win. In August, US troops left Afghanistan after a chaotic airlift from Kabul.", "latam": "Haiti’s president Jovenel Moïse was assassinated at home in July. Days later, Cubans staged the largest anti-government protests in decades, and El Salvador made Bitcoin legal tender in September.", "europe": "Floods in Germany and Belgium killed more than 200 people in July. Angela Merkel stepped down after 16 years as German chancellor, and Olaf Scholz took over in December.", "russia": "Alexei Navalny was arrested on returning to Russia in January, sparking nationwide protests. By December, Russia had massed troops near Ukraine and demanded that NATO stop expanding east.", "mideast": "The giant ship Ever Given blocked the Suez Canal for six days in March. In May, an 11-day Israel-Hamas war killed more than 250 people, most of them in Gaza.", "africa": "Riots after Jacob Zuma was jailed left about 350 dead in South Africa in July. Soldiers seized power in Guinea and Sudan, and the war in Ethiopia’s Tigray region spread.", "india": "A Delta variant wave overwhelmed India’s hospitals in spring, and oxygen ran short. The Taliban took Kabul in August, and Narendra Modi repealed his farm laws after a year of protests.", "china": "Tokyo held the delayed Olympics in July with almost no spectators. South Korea’s Squid Game became Netflix’s most-watched series, and China’s property giant Evergrande defaulted on its debts."}, "2022": {"us": "The Supreme Court overturned Roe v. Wade in June, ending the national right to abortion. Inflation hit 9.1 percent, a 40-year high, and OpenAI released ChatGPT in November.", "latam": "Lula narrowly beat Jair Bolsonaro in October to win back Brazil’s presidency. Gustavo Petro became Colombia’s first leftist president, and Lionel Messi led Argentina to World Cup victory in December.", "europe": "Russia’s full-scale invasion of Ukraine in February sent millions of refugees west and energy prices soaring. Queen Elizabeth II died in September, and Britain had three prime ministers in one year.", "russia": "Russia launched a full-scale invasion of Ukraine on February 24, and Western sanctions followed. A September call-up of 300,000 reservists sent many Russian men fleeing abroad.", "mideast": "Protests swept Iran after 22-year-old Mahsa Amini died in morality police custody in September. Qatar hosted the first World Cup in the Arab world, and Benjamin Netanyahu won back power in Israel.", "africa": "Ethiopia’s government and Tigrayan forces signed a peace deal in November, ending two years of war. William Ruto won Kenya’s presidency, and East Africa suffered its worst drought in 40 years.", "india": "Sri Lanka’s economic collapse drove protesters into the president’s house, and Gotabaya Rajapaksa fled in July. Floods covered about a third of Pakistan in late summer, killing more than 1,700 people.", "china": "Former Japanese prime minister Shinzo Abe was shot dead in July. Xi Jinping secured a third term in October, and after rare protests in November, China abruptly ended its zero-COVID policy."}, "2023": {"us": "Silicon Valley Bank collapsed in March, setting off a brief banking scare. Donald Trump was indicted in four criminal cases, and Hollywood writers and actors went on strike for months.", "latam": "On January 8, supporters of Jair Bolsonaro stormed Brazil’s Congress, Supreme Court and presidential palace. In November, Argentines elected Javier Milei, a libertarian who campaigned with a chainsaw to symbolize spending cuts.", "europe": "Finland joined NATO in April, and King Charles III was crowned in May. In France, President Emmanuel Macron raised the retirement age from 62 to 64 despite months of mass protests.", "russia": "The International Criminal Court issued an arrest warrant for Vladimir Putin in March. In June, Wagner chief Yevgeny Prigozhin led a brief mutiny, and in August he died in a plane crash.", "mideast": "Earthquakes in Turkey and Syria killed more than 50,000 people in February. On October 7, Hamas-led attacks killed about 1,200 people in Israel, and Israel launched a war in Gaza.", "africa": "War broke out in Sudan in April between the army and the paramilitary Rapid Support Forces, displacing millions. Soldiers seized power in Niger in July and in Gabon in August.", "india": "India passed China as the world’s most populous country, by UN estimates. In August, Chandrayaan-3 made the first landing near the Moon’s south pole, and New Delhi hosted the G20 in September.", "china": "China reopened its borders in January after three years of zero-COVID rules. In August, Japan began releasing treated water from the Fukushima plant, and China banned Japanese seafood in response."}, "2024": {"us": "Donald Trump survived an assassination attempt in July, and Joe Biden ended his reelection bid days later. Trump then defeated Kamala Harris in November to win a second, non-consecutive term.", "latam": "Claudia Sheinbaum was elected Mexico’s first woman president in June. In Venezuela, electoral authorities declared Nicolás Maduro the winner in July, while the opposition published tallies showing its candidate had won.", "europe": "Paris hosted the Summer Olympics, and Labour’s July landslide made Keir Starmer British prime minister. In October, flash floods around Valencia, Spain, killed more than 220 people.", "russia": "Alexei Navalny died in an Arctic prison in February, and Vladimir Putin won a fifth term in March. Days later, gunmen killed more than 140 people at Crocus City Hall near Moscow.", "mideast": "Israel’s war in Gaza spread to Lebanon, where an Israeli strike killed Hezbollah leader Hassan Nasrallah in September. In December, rebels swept into Damascus and Bashar al-Assad fled to Russia.", "africa": "Young Kenyans protested a tax-raising finance bill in June, briefly storming parliament. In South Africa, the ANC lost its majority for the first time since 1994 and formed a coalition government.", "india": "Narendra Modi won a third term in June, though his BJP lost its outright majority. In August, student-led protests forced Bangladesh’s Prime Minister Sheikh Hasina to flee to India.", "china": "Taiwan elected Lai Ching-te president in January. On December 3, South Korea’s President Yoon Suk Yeol declared martial law; lawmakers voted it down within hours and later impeached him."}, "2025": {"us": "Wildfires tore through Los Angeles in January as Donald Trump began his second term. His sweeping “Liberation Day” tariffs shook markets in April, and a 43-day government shutdown became the longest ever.", "latam": "Brazil’s Supreme Court sentenced Jair Bolsonaro to 27 years for plotting a coup, which he denies. Venezuelan opposition leader María Corina Machado won the Nobel Peace Prize in October.", "europe": "On April 28, a blackout cut power across Spain and Portugal for hours. Pope Francis had died a week earlier, and in May, Leo XIV became the first American pope.", "russia": "In June, Ukrainian drones hidden in trucks struck bomber bases deep inside Russia. In August, Vladimir Putin met Donald Trump in Alaska, without a deal to end the war.", "mideast": "Israel and Iran fought a 12-day war in June, and US bombers struck Iranian nuclear sites. In October, a US-brokered Gaza ceasefire freed the last living hostages and nearly 2,000 Palestinian prisoners.", "africa": "M23 rebels seized Goma and Bukavu in eastern Congo early in the year. In October, Sudan’s RSF captured El Fasher after an 18-month siege, amid reports of mass killings.", "india": "After gunmen killed 26 people in Kashmir in April, India and Pakistan fought four days of missile and drone strikes in May. Youth-led protests toppled Nepal’s government in September.", "china": "Chinese startup DeepSeek’s low-cost AI model jolted tech stocks in January. South Korea’s top court removed Yoon Suk Yeol in April, and Sanae Takaichi became Japan’s first woman prime minister in October."}};

  for (let i = 0, o = 44; i < n; i++) for (let c = 0; c < ch; c++, o += 2) out.setInt16(o, Math.max(-1, Math.min(1, data[c][i])) * 32767, true);
  return new Uint8Array(out.buffer);
}
Object.assign(window.__pastforward, {
  introAudio: async (sr = 48000) => {
    const len = INTRO_END + 4.6, AC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
    const ctx = new AC(2, Math.ceil(len * sr), sr), G = sndGraph(ctx);
    for (const e of SCORE) {
      if (e.k === "chord" && e.t < 0) SYN.chord(G, e, 0, -e.t);
      else if (e.t >= 0 && e.t < len) SYN[e.k](G, e, e.t, 0);
    }
    window.__pfWav = wavOf(await ctx.startRendering());
    return window.__pfWav.length;
  },
  beat: () => ({ step2: STEP2, scenes: { then: SCENES.find(x => x.id === "then").at, now: SCENES.find(x => x.id === "now").at, next: SCENES.find(x => x.id === "next").at }, hits: SCORE.filter(e => e.k === "kick" || e.k === "snare").map(e => `${e.k} ${e.t.toFixed(2)}`).join(", "), reveal: I_REVEAL }),
  scenes: () => SCENES.map(x => `${x.id} ${x.dur === Infinity ? "end" : x.dur.toFixed(1)}`).join(", "),
  soundState: () => ({ on: snd.on, state: snd.G ? snd.G.ctx.state : "none", voices: snd.live.length, button: $("inSnd").textContent.trim() || ($("inSnd").getAttribute("aria-pressed") === "true" ? "on" : "off") }),
  introAudioChunk: (i, size) => { let s = ""; const a = window.__pfWav.subarray(i * size, (i + 1) * size); for (let k = 0; k < a.length; k += 32768) s += String.fromCharCode.apply(null, a.subarray(k, k + 32768)); return btoa(s); }
});

/* ---------- night sky ---------- */
const sky = $("sky"), sctx = sky.getContext("2d");
let stars = [];
function sizeSky() {
  sky.width = Math.round(innerWidth * DPR); sky.height = Math.round(innerHeight * DPR);
  const n = Math.min(140, Math.round(innerWidth * innerHeight / 12000));
  stars = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * .9 + .25, p: Math.random() * 6.28, s: .4 + Math.random() * 1.4 }));
}
function drawSky(t) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, innerWidth, innerHeight);
  if (!TC.dark) return;
  for (const s of stars) {
    const a = reduce ? .35 : .15 + .4 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    c.fillStyle = `rgba(232,226,255,${a.toFixed(3)})`;
    c.beginPath(); c.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, 6.2832); c.fill();
  }
}

/* ---------- hint ---------- */
const hint = $("hint");
function hideHint() { hint.classList.add("gone"); }
setTimeout(hideHint, 6000);

/* ---------- loop ---------- */
let lastT = performance.now(), frame = 0;
function loop(t) {
  const dt = Math.min(48, t - lastT); lastT = t;
  if (!document.hidden && !intro.open) {
    stepFly(t); stepInertia(dt);
    draw(t); drawWorld(t);
    if (frame++ % 2 === 0) drawSky(t);
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => mcache.clear());

/* ---------- start ---------- */
resize();
const pathId = location.pathname.match(/^\/r\/([a-z0-9_-]+)\/?$/);
const h = pathId ? pathId[1] : decodeURIComponent(location.hash.slice(1));
let start = PAIRS.findIndex(p => p.id === h);
const linked = start >= 0;
if (start < 0) {   // this week's news if a rhyme has a fresh echo from it, else a past everyone knows
  const fresh = PAIRS.map((p, i) => ({ i, n: newsOf(i) })).filter(x => x.n).sort((a, b) => b.n.date.localeCompare(a.n.date))[0];
  start = fresh ? fresh.i : PAIRS.findIndex(p => p.id === "flu");
}
if (start < 0) start = 0;
cam.c = EVI[start].then.yx; cam.s = defaultScale(); clampCam();
setFocus(start, "then", 1, true);
if (linked) syncURL(start);   // a shared link: keep it as the clean /r/<id> address
else if (OWN_HOST && location.hash) { try { history.replaceState(null, "", "/"); } catch (e) {} }
if (!reduce) $("jump").classList.add("pulse");
updateDailyDot();
loadScores();
if (h === "daily") setTimeout(openDaily, 400);
if (h === "ask") setTimeout(() => openAsk(), 400);
// first visit to the home page: show what PastForward is (shared links go straight to their rhyme)
if (!linked && !h && !store.get(INTRO_KEY, 0)) setTimeout(() => openIntro(), 450);
requestAnimationFrame(loop);
})();
</script>
