<style>
/* Layout: one phone screen. A swipeable river of time on top (about 50 years per screen, snapping to events),
   a Then → Today → Next stepper, one story card with a big jump button. Depth lives in a full-screen "dive deeper" view.
   Deliberately single-theme (night sky). */
:root {
  color-scheme: dark;
  --bg: #0C0A1D;
  --surface: #161334;
  --surface2: #1E1A46;
  --ink: #EFE8D6;
  --muted: #ABA6C9;
  --line: #2E2955;
  --then: #E2B35E;
  --now: #72D3C5;
  --next: #CDB9FF;
  --bad: #E58C7A;
  --f-then: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-mono: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Newsreader", "Iowan Old Style", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  height: 100%; margin: 0; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background:
    radial-gradient(ellipse 90% 40% at 10% 0%, rgba(120, 92, 210, .17), transparent 70%),
    radial-gradient(ellipse 80% 50% at 100% 100%, rgba(70, 170, 160, .08), transparent 70%),
    var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; min-height: 560px; max-width: 1040px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; padding-block: 10px 14px; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--next); outline-offset: 2px; }

/* top bar */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
h1 { margin: 0; font-family: var(--f-then); font-weight: 400; font-size: clamp(19px, 5.4vw, 24px); line-height: 1; white-space: nowrap; }
h1 .p { color: var(--then); }
h1 .f { color: var(--next); text-shadow: 0 0 18px rgba(205, 185, 255, .45); }
.bar-r { display: flex; gap: 6px; }
.ghost { position: relative; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(22, 19, 52, .7); font: 700 14px var(--f-mono); letter-spacing: .01em; cursor: pointer; }
.ghost.icon { width: 38px; padding: 0; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.ghost.daily { color: var(--then); border-color: rgba(226, 179, 94, .5); background: rgba(226, 179, 94, .09); }
.ghost.daily.new::after { content: ""; position: absolute; top: 3px; right: 3px; width: 8px; height: 8px; border-radius: 50%; background: var(--then); box-shadow: 0 0 8px var(--then); }
.ghost.hi { color: var(--next); border-color: rgba(205, 185, 255, .55); background: rgba(205, 185, 255, .1); box-shadow: 0 0 18px rgba(205, 185, 255, .15); }
.ghost svg, .iconbtn svg { width: 18px; height: 18px; }
.ghost:hover { border-color: var(--next); }

/* timeline */
.tl { position: relative; flex: none; background: rgba(22, 19, 52, .55); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
@media (max-width: 699px) {
  .tl {
    margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
    margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
    border-radius: 0; border-left: 0; border-right: 0;
  }
}
#tl { display: block; width: 100%; height: 184px; touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
#tl.dragging { cursor: grabbing; }
#tl:focus-visible { box-shadow: inset 0 0 0 2px var(--next); }
@media (min-width: 700px) { #tl { height: 220px; } }
.swipe-hint { position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); font: 500 13px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink); background: rgba(12, 10, 29, .85); border: 1px solid var(--line); padding: 5px 12px; border-radius: 999px; pointer-events: none; white-space: nowrap; transition: opacity .6s ease; animation: nudge 1.8s ease-in-out infinite; }
.swipe-hint.gone { opacity: 0; }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% - 10px)); } }

/* the rhyme + stepper */
.rhyme { flex: none; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 640px; margin: 0 auto; }
.theme { margin: 2px 0 0; display: flex; align-items: baseline; gap: 8px; font-size: 17px; color: var(--muted); line-height: 1.25; }
.theme b { font-weight: 500; color: var(--ink); }
.chainchip { display: inline-flex; align-items: center; vertical-align: 2px; margin-left: 4px; min-height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(239, 232, 214, .3); background: rgba(239, 232, 214, .06); font: 700 12.5px var(--f-mono); color: var(--ink); cursor: pointer; white-space: nowrap; }
.chainchip:hover { border-color: var(--ink); }
.theme .dots { flex: none; display: inline-flex; gap: 3px; transform: translateY(-1px); }
.dots i { width: 6px; height: 6px; border-radius: 50%; border: 1.2px solid var(--muted); }
.dots i.on { background: var(--muted); }
.stepper { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 4px; }
.st-b { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 7px 4px 6px; min-height: 50px; border-radius: 14px; border: 1px solid var(--line); background: rgba(22, 19, 52, .7); cursor: pointer; transition: background-color .3s, border-color .3s, box-shadow .3s; }
.st-b .sl { font: 500 12.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.st-b .sy { font: 500 16px var(--f-mono); }
.st-b.then .sl { color: var(--then); } .st-b.now .sl { color: var(--now); } .st-b.next .sl { color: var(--next); }
.st-b.on.then { background: rgba(226, 179, 94, .14); border-color: var(--then); box-shadow: 0 0 22px rgba(226, 179, 94, .18); }
.st-b.on.now { background: rgba(114, 211, 197, .13); border-color: var(--now); box-shadow: 0 0 22px rgba(114, 211, 197, .18); }
.st-b.on.next { background: rgba(205, 185, 255, .13); border-color: var(--next); box-shadow: 0 0 22px rgba(205, 185, 255, .2); }
.st-g { font: 500 13px var(--f-mono); color: var(--muted); text-align: center; line-height: 1.15; white-space: nowrap; }
.st-g b { display: block; color: var(--ink); font-weight: 500; font-size: 12px; }

/* card */
.card { position: relative; flex: 1 1 auto; min-height: 0; width: 100%; max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px; border-radius: 18px; border: 1px solid var(--line); background: var(--surface); overflow: hidden; touch-action: pan-y; transition: border-color .4s, box-shadow .4s; }
.card.then { border-color: rgba(226, 179, 94, .35); }
.card.now { border-color: rgba(114, 211, 197, .35); }
.card.next { border-color: rgba(205, 185, 255, .4); background: radial-gradient(ellipse 100% 70% at 50% 0%, rgba(205, 185, 255, .14), transparent 75%), var(--surface); box-shadow: 0 0 40px rgba(205, 185, 255, .08); }
.card-in { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; overflow: hidden; transition: opacity .2s ease, transform .2s ease; }
.card-in.out { opacity: 0; transform: translateX(var(--dx, -14px)); }
.ck { margin: 0; font: 500 13.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.ck .lb { margin-right: 6px; }
.card.then .ck .lb { color: var(--then); } .card.now .ck .lb { color: var(--now); } .card.next .ck .lb { color: var(--next); }
.ct { margin: 0; font-weight: 400; line-height: 1.08; text-wrap: balance; }
.card.then .ct { font-family: var(--f-body); font-weight: 500; font-size: clamp(26px, 7.2vw, 34px); color: var(--then); }
.card.now .ct { font-family: var(--f-body); font-weight: 500; font-size: clamp(26px, 7.2vw, 34px); color: var(--now); }
.card.next .ct { font-family: var(--f-body); font-weight: 500; font-size: clamp(25px, 7vw, 34px); color: var(--next); text-shadow: 0 0 22px rgba(205, 185, 255, .3); }
.ch { margin: 0; font-size: 18.5px; line-height: 1.4; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden; }

.card-in { flex: 0 1 auto; }
.glimpse { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 0; border: 0; background: none; text-align: left; cursor: pointer; }
.gl-map { position: relative; flex: 1 1 auto; min-height: 0; display: block; border-radius: 12px; background: radial-gradient(ellipse 70% 80% at 50% 45%, rgba(120, 92, 210, .12), transparent 75%); }
#gmap { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.eqm { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.eqm[hidden] { display: none; }
.eqm svg { width: 100%; height: 100%; max-height: 120px; overflow: visible; }
.gl-cap { flex: none; display: flex; flex-direction: column; gap: 1px; min-width: 0; padding: 0 2px; }
.gl-row { display: flex; justify-content: space-between; gap: 8px; }
.gl-more { font: 500 12.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.gl-k { flex: none; font: 500 12.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.gl-t { min-width: 0; font-size: 16.5px; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .3s ease; }
.gl-t b { font: 500 12.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); margin-right: 6px; font-weight: 500; }
.gl-t.fade { opacity: 0; }
.glimpse:hover .gl-k { color: var(--ink); }
.actions { flex: none; display: flex; gap: 8px; }
.primary, .secondary { min-height: 48px; border-radius: 14px; cursor: pointer; font: 700 15px var(--f-mono); padding: 0 12px; white-space: nowrap; }
.primary { flex: 1.5; border: 0; color: var(--bg); background: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.card.then .primary { background: linear-gradient(90deg, var(--then), var(--now)); }
.card.now .primary { background: linear-gradient(90deg, var(--now), var(--next)); }
.card.next .primary { background: var(--next); }
.secondary { flex: 1; border: 1px solid var(--line); background: rgba(12, 10, 29, .6); }
.secondary:hover { border-color: var(--ink); }
.iconbtn { flex: none; width: 48px; min-height: 48px; border-radius: 14px; border: 1px solid var(--line); background: rgba(12, 10, 29, .6); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { border-color: var(--next); color: var(--next); }
/* your future */
.fut { display: flex; flex-direction: column; gap: 10px; }
.fl { font: 500 13px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
#byear { width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid rgba(205, 185, 255, .45); background: var(--surface); color: var(--ink); font: 500 27px var(--f-mono); padding: 0 16px; letter-spacing: .06em; }
#byear:focus { outline: 2px solid var(--next); outline-offset: 2px; }
.fnote { margin: -2px 0 0; font: 13px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.fsum { margin: 4px 0 0; font-size: 20px; line-height: 1.3; }
.fsum b { color: var(--next); font-weight: 500; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flist button { width: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 1px 12px; align-items: baseline; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.flist button:hover { border-color: rgba(205, 185, 255, .6); }
.flist .fy { font: 700 17px var(--f-mono); color: var(--next); font-variant-numeric: tabular-nums; }
.flist .ft { font: 700 17px/1.3 var(--f-mono); color: var(--ink); }
.flist .fa { font: 700 13px var(--f-mono); color: var(--muted); white-space: nowrap; }
.flist .fe { grid-column: 2 / -1; font: 14px/1.35 var(--f-mono); color: rgba(239, 232, 214, .72); }
.fshare { margin-top: 4px; width: 100%; }
.vote { flex: none; display: flex; flex-direction: column; gap: 7px; }
.vote-q { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.vote-q > span:first-child { font: 500 13px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.vote-b { display: inline-flex; gap: 6px; }
.vote-b button { min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(12, 10, 29, .6); font: 500 13.5px var(--f-mono); cursor: pointer; }
.vote-b button:hover { border-color: var(--ink); }
.vote-b button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vbar { height: 7px; border-radius: 4px; background: rgba(157, 151, 188, .2); overflow: hidden; }
.vbar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--now), var(--next)); transition: width .6s ease; }
.vres { display: flex; justify-content: space-between; gap: 8px; font: 13.5px var(--f-mono); color: var(--muted); }
.agree { color: var(--muted); font-size: 14px; }
.ix .pct { font: 500 12.5px var(--f-mono); font-style: normal; color: var(--next); margin-top: 2px; }
.pz-prog { display: flex; gap: 6px; }
.pz-prog i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.pz-prog i.cur { background: var(--ink); }
.pz-prog i.ok { background: var(--now); }
.pz-prog i.bad { background: var(--bad); }
.pz-q { margin: 0; font: 500 13px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.pz-then { display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 16px; border: 1px solid rgba(226, 179, 94, .45); background: rgba(226, 179, 94, .08); }
.pz-then .y { font: 500 13.5px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--then); }
.pz-then .t { font-family: var(--f-body); font-weight: 500; font-size: 27px; line-height: 1.1; color: var(--then); }
.pz-then .h { font-size: 17.5px; line-height: 1.4; }
.pz-opts { display: flex; flex-direction: column; gap: 6px; }
.pz-opts button { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; align-items: baseline; text-align: left; padding: 12px 14px; min-height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; transition: border-color .2s, background-color .2s, opacity .3s; }
.pz-opts button:hover:not(:disabled) { border-color: var(--now); }
.pz-opts .oy { font: 500 15px var(--f-mono); color: var(--now); }
.pz-opts .ot { font-size: 17px; line-height: 1.25; }
.pz-opts button:disabled { cursor: default; opacity: .45; }
.pz-opts button.ok { opacity: 1; border-color: var(--now); background: rgba(114, 211, 197, .15); }
.pz-opts button.bad { opacity: 1; border-color: var(--bad); background: rgba(229, 140, 122, .13); }
.pz-rev { display: flex; flex-direction: column; gap: 8px; }
.pz-rev:empty { display: none; }
.pz-verdict { margin: 0; font-size: 18px; font-weight: 500; }
.pz-verdict.ok { color: var(--now); } .pz-verdict.bad { color: var(--bad); }
.pz-next { margin: 0; font-size: 16.5px; }
.pz-next b { color: var(--next); font: 500 16px var(--f-mono); }
.pz-next i { color: var(--next); font-style: normal; }
.pz-go, #pzShare { width: 100%; flex: none; }
.pz-res { text-align: center; display: flex; flex-direction: column; gap: 4px; padding: 6px 0; }
.pz-score { margin: 0; font: 500 72px/1 var(--f-body); }
.pz-score span { font-size: 36px; color: var(--muted); }
.pz-emoji { margin: 4px 0 0; font-size: 30px; letter-spacing: 6px; }
.pz-meta { margin: 0; font: 13.5px var(--f-mono); color: var(--muted); letter-spacing: .04em; }
.pz-meta:empty { display: none; }
.pz-copy { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 15px var(--f-mono); padding: 10px 12px; resize: none; }
.how summary { cursor: pointer; font: 500 13.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
.how[open] summary { color: var(--ink); }
.how .hb { display: flex; flex-direction: column; gap: 10px; padding: 6px 0 4px; }
.sharebox { display: flex; flex-direction: column; gap: 12px; align-items: center; }
.sharebox img { display: block; width: auto; max-width: 100%; max-height: 58vh; border-radius: 16px; border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0, 0, 0, .5); }
.sharebox p { margin: 0; text-align: center; color: var(--muted); font-size: 15px; }
.linkrow { display: flex; gap: 8px; width: 100%; }
.linkrow input { flex: 1; min-width: 0; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 14.5px var(--f-mono); padding: 0 12px; }
.pulse { animation: glow 2.2s ease-in-out 3; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 232, 214, 0); } 50% { box-shadow: 0 0 0 6px rgba(239, 232, 214, .12); } }

/* deep view */
.deep-wrap { position: fixed; inset: 0; z-index: 40; }
.deep-bd { position: absolute; inset: 0; background: rgba(5, 4, 14, .7); opacity: 0; transition: opacity .3s; }
.deep {
  position: absolute; left: 0; right: 0; bottom: 0; top: 0; margin: 0 auto; max-width: 680px;
  display: flex; flex-direction: column; background: var(--bg);
  background-image: radial-gradient(ellipse 90% 35% at 50% 0%, rgba(120, 92, 210, .16), transparent 70%);
  transform: translateY(100%); transition: transform .38s cubic-bezier(.2, .8, .2, 1);
  padding-top: env(safe-area-inset-top, 0px);
}
@media (min-width: 700px) { .deep { top: 4%; bottom: 4%; border-radius: 22px; border: 1px solid var(--line); overflow: hidden; } }
.deep-wrap.open .deep-bd { opacity: 1; }
.deep-wrap.open .deep { transform: none; }
.dh { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 4px max(12px, env(safe-area-inset-left, 0px)); }
.dback { min-height: 40px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font: 500 13.5px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; }
.dk { font: 500 13.5px var(--f-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dk.then { color: var(--then); } .dk.now { color: var(--now); } .dk.next { color: var(--next); }

(() => {
const PAIRS = [{"id": "lisbon", "theme": "A great quake shakes faith in authority", "rhyme": 2, "then": {"year": 1755, "short": "Lisbon Quake", "title": "The Great Lisbon Earthquake", "where": "Lisbon, Portugal", "region": "europe", "hook": "On All Saints’ Day, a quake, a tsunami and fire wrecked Lisbon and shook Europe.", "text": "On the morning of 1 November 1755, a powerful quake struck as churches filled for Mass. A tsunami and fires followed, killing perhaps 30,000 to 40,000 people in Lisbon. In Candide, Voltaire mocked the belief that all is for the best, and minister Pombal rebuilt the Baixa with quake-resistant “gaiola” timber frames."}, "now": {"year": 2023, "short": "Turkey Quakes", "title": "The Turkey–Syria Earthquakes", "where": "Southern Turkey and northern Syria", "region": "mideast", "hook": "February 2023: rescuers pulling survivors from flattened apartment blocks in freezing winter nights.", "text": "Before dawn on 6 February, a magnitude 7.8 quake struck, followed hours later by a 7.5. More than 50,000 people died in Turkey and thousands more in Syria. Anger focused on poorly built housing, construction amnesties and weak code enforcement, and prosecutors investigated over 600 people, including contractors."}, "followed": "Pombal used the crisis to gather power and rebuilt downtown Lisbon on a planned grid. His questionnaire to every parish about the shaking is often called an early step toward modern seismology.", "next": {"short": "Megacity Quake", "title": "A megacity quake tests building promises", "text": "Around 2291, a great quake might hit a crowded megacity of glass towers and old apartment blocks. If some buildings fall while others stand, anger could turn on whoever approved, inspected or insured them.", "watch": "Watch how strictly fast-growing cities enforce quake codes, whether old housing gets retrofitted, and whether building amnesties return."}, "breaks": "Lisbon mainly shook faith in Providence and left its government stronger, while in 2023 public anger targeted builders and the officials meant to inspect them.", "echoes": [{"year": 1972, "short": "Managua Quake", "title": "The 1972 Managua earthquake", "region": "latam", "line": "A quake killed thousands in Nicaragua’s capital, and claims that Somoza’s circle pocketed foreign aid fed the revolt that toppled him."}, {"year": 1976, "short": "Tangshan Quake", "title": "The 1976 Tangshan earthquake", "region": "china", "line": "Officially 242,000 died, the toll stayed hidden for three years, and Mao’s death weeks later made the quake look like an omen."}, {"year": 1985, "short": "Mexico Quake", "title": "The 1985 Mexico City earthquake", "region": "latam", "line": "As thousands died and the government stalled, volunteers dug out survivors themselves, and anger over shoddy buildings weakened the ruling PRI."}, {"year": 2008, "short": "Sichuan Quake", "title": "The 2008 Sichuan earthquake", "region": "china", "line": "Over 69,000 died, including thousands of pupils in poorly built “tofu-dreg” schools, and grieving parents who demanded answers faced police pressure."}]}, {"id": "revolution", "theme": "Food prices and a closed elite spark revolt", "rhyme": 2, "then": {"year": 1789, "short": "Bastille Falls", "title": "The Storming of the Bastille", "where": "Paris, France", "region": "europe", "hook": "On 14 July 1789, Parisians stormed a royal fortress-prison, and France still celebrates it.", "text": "With the crown nearly bankrupt and bread near record prices, the Estates-General met in May 1789 for the first time since 1614. On 14 July, Parisians hunting for gunpowder stormed the Bastille, which held just seven prisoners. They killed its governor and paraded his head on a pike."}, "now": {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring", "where": "Tunisia, Egypt and beyond", "region": "mideast", "hook": "Early 2011: crowds packing Cairo’s Tahrir Square and cheering when Mubarak stepped down.", "text": "After a Tunisian fruit seller set himself on fire in December 2010, protests over food prices, jobs and corruption swept the region. Tunisia’s Ben Ali fled on 14 January 2011 and Egypt’s Mubarak resigned on 11 February. Uprisings followed in Libya, Yemen, Syria and Bahrain."}, "followed": "The revolution turned radical: the king was executed in 1793 and the Terror followed. In 1799 Napoleon Bonaparte seized power in a coup.", "next": {"short": "Hunger Revolt", "title": "Price shocks topple a closed regime", "text": "Around 2233, a sudden jump in food or energy prices, perhaps after failed harvests, might hit a country run by a narrow elite. Protests could spread across a whole region within weeks.", "watch": "Watch staple food prices, youth unemployment, state debt and how tightly a ruling circle guards its privileges."}, "breaks": "The French Revolution remade a great power and spread its ideas across Europe, while most Arab Spring uprisings ended in civil war or renewed authoritarian rule.", "echoes": [{"year": 1644, "short": "Ming Falls", "title": "Peasant rebels topple the Ming dynasty", "region": "china", "line": "After years of famine and a court mired in factions, Li Zicheng’s rebels took Beijing, and the last Ming emperor hanged himself."}, {"year": 1917, "short": "Tsar Falls", "title": "Russia’s February Revolution", "region": "russia", "line": "Bread protests by Petrograd women grew into strikes and army mutinies, and within a week Tsar Nicholas II abdicated."}, {"year": 1998, "short": "Suharto Falls", "title": "Indonesia’s 1998 revolt topples Suharto", "region": "world", "line": "As the Asian financial crisis sent food and fuel prices soaring, protests and riots ended Suharto’s 32-year rule, criticised for cronyism."}]}, {"id": "hamilton", "theme": "A union starts sharing its debts", "rhyme": 2, "then": {"year": 1790, "short": "Hamilton Plan", "title": "Hamilton’s Plan to Assume State Debts", "where": "New York, United States", "region": "us", "hook": "The dinner deal from the musical Hamilton: state debts for a capital on the Potomac.", "text": "Treasury Secretary Alexander Hamilton proposed that the federal government take over the states’ war debts, up to $21.5 million in the final law. States that had paid down theirs, like Virginia, objected. At a June 1790 dinner hosted by Jefferson, Madison agreed not to block it in return for a capital on the Potomac."}, "now": {"year": 2020, "short": "EU Joint Debt", "title": "The EU’s NextGenerationEU Recovery Fund", "where": "Brussels, Belgium", "region": "europe", "hook": "July 2020: masked EU leaders haggling for days over a €750 billion pandemic fund.", "text": "In July 2020, EU leaders agreed on a €750 billion recovery fund, including €390 billion in grants, paid for by joint borrowing through the European Commission. German finance minister Olaf Scholz called the plan Europe’s “Hamiltonian moment”. The “frugal” Netherlands, Austria, Sweden and Denmark pushed back on grants."}, "followed": "Assumption gave the young US strong credit, and the fight over it helped create the first political parties. When eight states defaulted in the 1840s, Congress refused to take on their debts.", "next": {"short": "Shared Debt", "title": "A new union pools its debts", "text": "Around 2250, a looser union, perhaps in Africa or Latin America, or even a global climate body, might issue its first shared bonds after a crisis. Leaders could again trade debt deals for symbols of power.", "watch": "Watch for crises that push members of a union to borrow together, and for “one-off” joint funds that quietly become permanent."}, "breaks": "The US took on states’ old debts for good, while NextGenerationEU borrowed new money as an officially one-off fund, and the EU still lacks a federal treasury.", "echoes": [{"year": 1861, "short": "Italy’s Ledger", "title": "United Italy merges its states’ debts", "region": "europe", "line": "The new Kingdom of Italy gathered the debts of the old states it absorbed into a single national ledger, the Gran Libro."}, {"year": 1867, "short": "Canada Unites", "title": "Canadian Confederation takes on provincial debts", "region": "world", "line": "At Confederation, the new Dominion of Canada took on the debts of its provinces, a key bargain in uniting them."}]}, {"id": "vaccine", "theme": "A breakthrough vaccine meets fear and backlash", "rhyme": 3, "then": {"year": 1796, "short": "First Vaccine", "title": "Edward Jenner’s Smallpox Vaccine", "where": "Berkeley, England", "region": "europe", "hook": "A country doctor used cowpox to protect a boy from smallpox, giving us the word “vaccine”.", "text": "On 14 May 1796, Edward Jenner put cowpox from milkmaid Sarah Nelmes into scratches on eight-year-old James Phipps, who later resisted smallpox. In 1802 a James Gillray cartoon showed vaccinated people sprouting cows. After England made infant vaccination compulsory in 1853, anti-vaccination leagues formed."}, "now": {"year": 2020, "short": "mRNA Vaccines", "title": "The mRNA COVID-19 Vaccines", "where": "Worldwide", "region": "world", "hook": "Winter 2020–21: vaccine queues, sore arms, and heated family arguments about the jab.", "text": "Less than a year after the virus was identified, Britain approved the Pfizer-BioNTech vaccine on 2 December 2020, the first mRNA vaccine ever approved. Moderna’s followed weeks later. Billions of doses followed, and so did false claims about microchips and altered DNA and protests against mandates."}, "followed": "Vaccination spread worldwide despite resistance, and in 1898 Britain let parents opt out as “conscientious objectors”. Smallpox was declared eradicated in 1980.", "next": {"short": "Gene Shots", "title": "A gene-editing shot meets old fears", "text": "Around 2244, a new kind of shot might reprogram cells, perhaps editing genes or training immunity against cancer and old age. Its promise could meet fears of tampering with human nature, spreading faster than any cartoon.", "watch": "Watch trust in health agencies, how fast false health claims spread, and fights over mandates and opt-outs."}, "breaks": "Smallpox killed about three in ten people it infected, while COVID-19 was far milder for most people, which made the case for mandates more contested.", "older": "The Boston smallpox inoculation fight, 1721", "echoes": [{"year": 1721, "short": "Boston Smallpox", "title": "Boston’s smallpox inoculation fight", "region": "us", "line": "Cotton Mather and Zabdiel Boylston promoted inoculation during an epidemic, and the backlash was fierce: someone threw a bomb into Mather’s house."}, {"year": 1904, "short": "Vaccine Revolt", "title": "Rio de Janeiro’s Vaccine Revolt", "region": "latam", "line": "A law making smallpox vaccination compulsory sparked a week of riots in Rio, leaving about 30 dead before the mandate was suspended."}, {"year": 1955, "short": "Polio Vaccine", "title": "Salk’s polio vaccine and the Cutter incident", "region": "us", "line": "Weeks after Jonas Salk’s polio vaccine was declared safe, faulty Cutter batches with live virus caused paralysis and ten deaths, shaking trust."}]}, {"id": "luddites", "theme": "Workers fear machines will take their jobs", "rhyme": 3, "then": {"year": 1811, "short": "Luddites", "title": "The Luddite Machine-Breakers", "where": "Nottinghamshire, England", "region": "europe", "hook": "English textile workers smashed machines taking their jobs and gave us the word “Luddite”.", "text": "From March 1811, stocking knitters near Nottingham, signing letters as “General Ludd”, smashed the frames of employers who cut pay and used cheaper, less-skilled labour. The revolt spread to Yorkshire and Lancashire. Parliament made machine-breaking a capital crime in 1812, and about 12,000 troops were deployed."}, "now": {"year": 2023, "short": "AI Anxiety", "title": "AI Anxiety and the Writers’ Strike", "where": "Hollywood, United States", "region": "us", "hook": "2023: ChatGPT writing office emails, and Hollywood writers on picket lines over AI.", "text": "Months after ChatGPT’s launch, generative AI spread into offices. Hollywood writers struck for 148 days from May 2023 and won rules that AI cannot count as a writer and studios cannot make writers use it. Actors struck too, partly over digital replicas."}, "followed": "Troops, hangings and mass trials at York in 1813 crushed the movement within a few years. Mechanised mills spread, and hand weavers’ earnings collapsed, though average wages rose decades later.", "next": {"short": "Human-Made", "title": "Workers bargain over what stays human", "text": "Around 2235, a new wave of machines, perhaps robots with general skills, might reach work once thought safe, like care or teaching. Workers could strike or push for laws and labels that keep some tasks human.", "watch": "Watch contract clauses that limit automation, how fast humanoid robots get cheaper, and whether productivity gains reach wages."}, "breaks": "The Luddites faced soldiers and the gallows and lost, while the 2023 writers bargained within the law and won limits on AI in their contract.", "echoes": [{"year": 1675, "short": "Weavers’ Riot", "title": "London weavers riot against engine looms", "region": "europe", "line": "London silk weavers rioted for days, smashing and burning the engine looms they feared would undercut their pay and jobs."}, {"year": 1830, "short": "Swing Riots", "title": "The Swing Riots", "region": "europe", "line": "Farm labourers across southern England smashed threshing machines that took their winter work, sending threats signed “Captain Swing”; 19 were hanged."}, {"year": 1986, "short": "Wapping Dispute", "title": "The Wapping print dispute", "region": "europe", "line": "Rupert Murdoch’s papers moved to a computerised plant at Wapping; about 6,000 print workers struck, were dismissed, and lost after a year."}]}, {"id": "railway", "theme": "A new machine starts carrying the public", "rhyme": 2, "then": {"year": 1830, "short": "Liverpool Line", "title": "The Liverpool and Manchester Railway Opens", "where": "Liverpool and Manchester, England", "region": "europe", "hook": "The world’s first inter-city railway opened, and a locomotive ran over a leading politician.", "text": "The 31-mile line opened on 15 September 1830, with Prime Minister the Duke of Wellington aboard. At a stop, Liverpool MP William Huskisson stepped onto the track and was hit by the locomotive Rocket, dying that evening. Even so, the line carried over a million passengers in its first two years."}, "now": {"year": 2024, "short": "Robotaxis", "title": "Robotaxis Open to the Public", "where": "San Francisco and Wuhan", "region": "world", "hook": "2024: driverless cars ferrying riders around San Francisco, and a crowd setting one ablaze.", "text": "In June 2024 Waymo opened its driverless taxis to anyone in San Francisco. Rival Cruise had its California permit suspended after one of its cars dragged a pedestrian in 2023. In Wuhan, Baidu’s Apollo Go ran hundreds of robotaxis, worrying local taxi drivers."}, "followed": "Despite the death, passengers flocked to the line, and its success set off railway building across Britain and the world. By 1850 Britain had about 6,000 miles of railway.", "next": {"short": "Rocket Commute", "title": "Pilotless rockets carry everyday travellers", "text": "Around 2218, a new machine, perhaps a pilotless rocket crossing continents in under an hour, might open to ordinary travellers. Its first public trips could bring a famous accident, and fears that fade only once trips become routine.", "watch": "Watch how courts assign blame when self-driving machines crash, and whether public trust follows their safety records."}, "breaks": "The railway still had human drivers and created many new jobs, while robotaxis take the human out of the driving seat.", "echoes": [{"year": 1857, "short": "Otis Elevator", "title": "The first passenger elevator opens", "region": "us", "line": "Elisha Otis, whose safety brake eased fears of falling, installed the first passenger elevator in a New York store."}, {"year": 1914, "short": "Airboat Line", "title": "A flying boat starts scheduled airline service", "region": "us", "line": "The St. Petersburg–Tampa Airboat Line flew paying passengers across Tampa Bay; the first ticket, auctioned off, went to an ex-mayor for $400."}, {"year": 1952, "short": "Comet Jetliner", "title": "The first jet airliner enters service", "region": "europe", "line": "BOAC’s Comet began the first jet passenger flights, but two mid-air breakups in 1954, traced to metal fatigue, grounded the fleet."}]}, {"id": "mania", "theme": "A building boom races ahead of profits", "rhyme": 2, "then": {"year": 1845, "short": "Railway Mania", "title": "Britain’s Railway Mania", "where": "Britain", "region": "europe", "hook": "Victorian Britons poured their savings into railway shares, until the bubble burst.", "text": "Cheap money and a hunt for returns sent railway shares soaring. In 1846 alone, Parliament authorised about 9,500 miles of new line. Middle-class savers, including the Brontë sisters, bought in, and George Hudson, the “Railway King”, became the face of the boom."}, "now": {"year": 2024, "short": "AI Build-Out", "title": "The AI Data-Centre Building Boom", "where": "United States and beyond", "region": "us", "hook": "2024: Nvidia briefly becoming the world’s most valuable company as tech giants built data centres.", "text": "In 2024 Microsoft, Alphabet, Amazon and Meta together spent over $200 billion on capital projects, much of it on AI data centres and chips. Microsoft signed a deal to restart a Three Mile Island reactor for power. A Sequoia partner called the gap between spending and revenue “AI’s $600 billion question”."}, "followed": "By 1849 railway shares had lost nearly two-thirds of their value, and Hudson was disgraced for fraud. Yet the lines that were built became the core of Britain’s rail network.", "next": {"short": "Orbital Rush", "title": "A rush to build in orbit", "text": "Around 2203, investors might pour fortunes into the next big infrastructure bet, perhaps power or computing in orbit, long before customers pay for it. A crash could ruin backers yet leave useful hardware behind.", "watch": "Watch for spending growing far faster than revenue, building funded by debt, and claims that “this time is different”."}, "breaks": "Railway Mania was fed by small investors in new companies, while most AI building in 2024 was paid for by tech giants with large existing profits.", "older": "Britain’s canal mania, 1793", "echoes": [{"year": 1793, "short": "Canal Mania", "title": "Britain’s canal mania", "region": "europe", "line": "Investors piled into canal schemes, and Parliament approved dozens in a few years; some never paid a dividend or were never finished."}, {"year": 1873, "short": "Panic of 1873", "title": "America’s railroad boom ends in panic", "region": "us", "line": "After 33,000 miles of new track in five years, Jay Cooke’s bank failed with unsold Northern Pacific bonds, setting off a depression."}, {"year": 2001, "short": "Telecom Bust", "title": "The fibre-optic telecom bust", "region": "us", "line": "Telecom firms borrowed to lay fibre-optic cable far beyond demand; when the bubble burst, much sat unused and Global Crossing went bankrupt."}]}, {"id": "springtime", "theme": "Uprisings leap across many countries at once", "rhyme": 2, "then": {"year": 1848, "short": "1848 Revolts", "title": "The Revolutions of 1848", "where": "Across Europe", "region": "europe", "hook": "The “Springtime of Peoples”: in weeks, revolt spread from Paris to Vienna, Berlin and Budapest.", "text": "Revolt broke out in Palermo in January 1848, and Parisians toppled King Louis-Philippe in February. In March, Vienna’s uprising forced Chancellor Metternich to flee, and Berliners fought troops on barricades. Rebels demanded constitutions, free speech and national unity after bad harvests and an economic crisis."}, "now": {"year": 2019, "short": "2019 Protests", "title": "The Global Protest Wave of 2019", "where": "From Santiago to Beirut", "region": "world", "hook": "October 2019: huge crowds in Santiago, Beirut and Baghdad, all in the same weeks.", "text": "In 2019, protests often sparked by everyday costs spread across continents: a metro fare rise in Chile, a WhatsApp tax in Lebanon, fuel subsidy cuts in Ecuador. Sudan’s Omar al-Bashir and Algeria’s Abdelaziz Bouteflika were forced out, and the prime ministers of Lebanon and Iraq resigned."}, "followed": "By 1849 most revolts had been crushed and conservative rule restored. Yet the Austrian Empire’s end of serfdom stuck, and nationalism fed Italian and German unification within about two decades.", "next": {"short": "Protest Wave", "title": "Protests leap across a connected planet", "text": "Around 2190, a shared shock, perhaps a price spike or a viral image, might set off protests in dozens of countries within days. Some leaders could fall while the systems behind them adapt and survive.", "watch": "Watch for living-cost shocks hitting many countries at once, crowded young cities, and leaders who stay in power for decades."}, "breaks": "The 1848 rebels shared ideas of liberty and nationhood across one continent, while the 2019 protests had mostly separate, local causes across many.", "older": "The revolutions of 1830", "echoes": [{"year": 1830, "short": "1830 Revolts", "title": "The revolutions of 1830", "region": "europe", "line": "France’s July Revolution toppled Charles X, and within months revolts broke out in Belgium, which won independence, and in Russian-ruled Poland."}, {"year": 1968, "short": "1968 Protests", "title": "The global protests of 1968", "region": "world", "line": "Protests swept Paris, West Germany, Mexico City and US campuses within months, as students worldwide shared slogans and television images."}, {"year": 1989, "short": "1989 Revolutions", "title": "The fall of communism in Eastern Europe", "region": "europe", "line": "Within months, communist governments fell in Poland, Hungary, East Germany, Bulgaria, Czechoslovakia and Romania, each crowd inspired by the last."}, {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring", "region": "mideast", "line": "After Tunisia’s ruler fled, protests leapt within weeks to Egypt, Libya, Yemen, Bahrain and Syria, spread by satellite TV and social media."}]}, {"id": "cable", "theme": "Wiring the planet for instant contact", "rhyme": 2, "then": {"year": 1858, "short": "Atlantic Cable", "title": "The First Transatlantic Telegraph Cable", "where": "Ireland to Newfoundland", "region": "world", "hook": "Queen Victoria and President Buchanan traded messages under the Atlantic, and then the cable died.", "text": "Cyrus Field’s company completed a cable from Ireland to Newfoundland on 5 August 1858. Queen Victoria’s 98-word greeting to President Buchanan took about 16 hours to send. New York celebrated with fireworks that set City Hall alight, but the cable failed after about three weeks."}, "now": {"year": 2019, "short": "Starlink", "title": "SpaceX Launches the First Starlink Satellites", "where": "Cape Canaveral, United States", "region": "us", "hook": "2019: a neat line of bright dots gliding across the night sky, Starlink’s first satellites.", "text": "In May 2019 a Falcon 9 rocket carried 60 Starlink satellites into orbit, the start of SpaceX’s plan to beam internet everywhere. Astronomers soon complained of streaks across their images. Within six years, thousands of satellites served millions of users, including Ukraine’s military."}, "followed": "In 1866 the giant steamship Great Eastern laid a lasting cable. Within decades, undersea lines linked every inhabited continent, letting markets, newspapers and empires react within hours.", "next": {"short": "Solar Web", "title": "A network stretching across the solar system", "text": "Around 2180, laser links might join Earth, the Moon and settlements on Mars into one network. Even at light speed, each message to Mars would take between about 3 and 22 minutes.", "watch": "Watch deep-space laser tests, the crowding of low Earth orbit, and how much of the world’s connectivity a few companies control."}, "breaks": "The 1858 cable linked just two points and soon died, while Starlink kept growing into a global network run by a single company.", "older": "Claude Chappe’s optical telegraph, 1794", "echoes": [{"year": 1794, "short": "Claude Chappe’s…", "title": "Claude Chappe’s optical telegraph", "region": "world", "line": ""}, {"year": 1901, "short": "Marconi Signal", "title": "Marconi’s radio signal crosses the Atlantic", "region": "world", "line": "Guglielmo Marconi reported hearing the Morse letter “S” in Newfoundland, sent by radio from Cornwall, showing signals could cross oceans without wires."}, {"year": 1956, "short": "TAT-1 Cable", "title": "The first transatlantic telephone cable opens", "region": "world", "line": "TAT-1 linked Scotland and Newfoundland, carrying 707 calls on its first day, far clearer than the old radio telephone service."}, {"year": 1962, "short": "Telstar", "title": "Telstar beams live TV across the Atlantic", "region": "world", "line": "The Telstar satellite relayed the first live TV across the Atlantic, and like the 1858 cable, it failed within months."}]}, {"id": "carrington", "theme": "A solar storm tests a wired world", "rhyme": 2, "then": {"year": 1859, "short": "Carrington", "title": "The Carrington Event", "where": "Worldwide", "region": "world", "hook": "The most intense solar storm on record made telegraphs spark and lit auroras near the tropics.", "text": "On 1 September 1859, English astronomer Richard Carrington saw a brilliant white flare on the Sun. About 18 hours later a severe geomagnetic storm struck, shocking telegraph operators and letting some lines work with batteries disconnected. Auroras were seen as far south as Cuba and Hawaii."}, "now": {"year": 2024, "short": "Gannon Storm", "title": "The May 2024 Gannon Solar Storm", "where": "Worldwide", "region": "world", "hook": "May 2024: phone photos of pink and green skies from places that rarely see auroras.", "text": "From 10 May 2024, eruptions from a giant sunspot group caused the first “extreme” G5 geomagnetic storm since 2003, later named after scientist Jennifer Gannon. Auroras appeared as far south as Mexico and northern India. GPS errors stalled some self-steering tractors at planting time, but no major blackouts followed."}, "followed": "Telegraphs recovered within days, and 1859 became the benchmark for worst-case planning. In March 1989 a weaker storm blacked out Quebec’s power grid for about nine hours.", "next": {"short": "Superstorm", "title": "A Carrington-sized storm hits a wired world", "text": "Around 2189, a storm as strong as 1859’s might hit a world running on satellites, grids and perhaps settlements in space. A day’s warning could let operators power down in time; a late warning could mean weeks of blackouts.", "watch": "Watch investment in solar early-warning spacecraft, grid hardening against geomagnetic currents, and near misses like the large July 2012 eruption."}, "breaks": "The 2024 storm was far weaker than 1859’s, and forecasters issued warnings a day or more ahead, something Victorian telegraph operators never had.", "older": "The great aurora seen over Japan and China, 1770", "echoes": [{"year": 1770, "short": "great aurora se…", "title": "The great aurora seen over Japan and China", "region": "world", "line": ""}, {"year": 1921, "short": "Railroad Storm", "title": "The 1921 New York Railroad Storm", "region": "world", "line": "Storm currents set a Swedish telegraph exchange and New York railroad signal equipment ablaze, and disrupted telegraphs on several continents."}, {"year": 1972, "short": "Sea Mine Storm", "title": "The August 1972 solar storm", "region": "world", "line": "A fast solar storm knocked out a Midwest phone cable and likely set off dozens of US sea mines off Vietnam."}, {"year": 1989, "short": "Quebec Blackout", "title": "Solar storm blacks out Quebec", "region": "world", "line": "A geomagnetic storm collapsed Hydro-Québec’s grid in under 90 seconds, leaving millions in Quebec without power for about nine hours."}, {"year": 2003, "short": "Halloween Storms", "title": "The 2003 Halloween solar storms", "region": "world", "line": "Solar storms blacked out part of southern Sweden for an hour, forced satellites into safe mode and rerouted polar flights."}]}, {"id": "commune", "theme": "French crowds rise against a distant government", "rhyme": 1, "then": {"year": 1871, "short": "Paris Commune", "title": "The Paris Commune", "where": "Paris, France", "region": "europe", "hook": "After France lost to Prussia, Paris workers ran the city themselves for 72 days.", "text": "On 18 March 1871, Paris National Guards stopped the army seizing their cannons, and Adolphe Thiers’ government withdrew to Versailles. The Commune separated church and state and banned night work in bakeries. In the “Bloody Week” of late May, Communards shot hostages including the archbishop, and troops retaking Paris killed thousands."}, "now": {"year": 2018, "short": "Yellow Vests", "title": "The Yellow Vest Protests", "where": "France", "region": "europe", "hook": "Late 2018: high-visibility vests on French roundabouts, and tear gas by the Arc de Triomphe.", "text": "From 17 November 2018, protesters in the high-visibility vests French drivers must carry blocked roundabouts over a planned fuel tax rise. Organised on Facebook, the movement drew heavily from small towns and the countryside. After riots in Paris, President Macron dropped the tax rise and announced about €10 billion in help for low earners."}, "followed": "Tens of thousands were arrested and thousands deported to New Caledonia before an amnesty in 1880. The Third Republic survived, and Marx and later Lenin held up the Commune as a model.", "next": {"short": "Cost Revolt", "title": "A revolt against costs set from above", "text": "Around 2165, people far from power, perhaps in fading towns, might rise against costs set by a faraway capital, such as climate rules or new taxes. Their badge could again be something ordinary, like a vest.", "watch": "Watch for climate or tax rules that hit rural and car-dependent people hardest, and leaderless protests organised online."}, "breaks": "The Commune was an armed takeover of Paris crushed by the army, while the Yellow Vests were a mostly provincial protest movement that won concessions.", "older": "Étienne Marcel’s Paris revolt, 1358", "echoes": [{"year": 1358, "short": "Paris Revolt", "title": "Étienne Marcel’s revolt in Paris", "region": "europe", "line": "After the king’s capture by the English, Paris merchant leader Étienne Marcel defied the Dauphin’s government and briefly controlled the capital."}, {"year": 1675, "short": "Red Caps Revolt", "title": "Brittany’s Bonnets Rouges revolt", "region": "europe", "line": "Breton peasants in red caps rose against Louis XIV’s new taxes on stamped paper, tobacco and tin goods, and were harshly crushed."}, {"year": 1907, "short": "Winegrowers", "title": "The revolt of the Languedoc winegrowers", "region": "europe", "line": "As wine prices collapsed, up to 800,000 rallied in Montpellier, local officials resigned en masse, and Clemenceau sent troops."}, {"year": 2013, "short": "Red Caps Return", "title": "Brittany’s red caps return", "region": "europe", "line": "Bretons in red caps recalling 1675 wrecked gantries built to collect a new truck ecotax, and the government suspended the tax."}]}, {"id": "phone", "theme": "A new phone rewires daily life", "rhyme": 2, "then": {"year": 1876, "short": "Bell’s Phone", "title": "Bell Patents the Telephone", "where": "Boston, United States", "region": "us", "hook": "“Mr. Watson, come here, I want to see you”: the famous first telephone call.", "text": "Alexander Graham Bell filed his telephone patent on 14 February 1876, the same day rival Elisha Gray filed notice of a similar idea. It was granted on 7 March. Three days later in Boston, Bell called his assistant Thomas Watson from the next room."}, "now": {"year": 2007, "short": "iPhone", "title": "Apple Unveils the iPhone", "where": "San Francisco, United States", "region": "us", "hook": "2007: Steve Jobs unveiling the iPhone on stage, then fans queuing overnight to buy one.", "text": "On 9 January 2007 at Macworld in San Francisco, Steve Jobs unveiled the iPhone, a touchscreen phone, iPod and internet device in one. It went on sale in the US on 29 June from $499 with an AT&T contract. The App Store followed in 2008."}, "followed": "Bell’s company fought off hundreds of patent challenges and grew into the Bell System. In 1915 Bell, in New York, made the first transcontinental call, to Watson in San Francisco.", "next": {"short": "Thought Phone", "title": "A device that reads thoughts goes mainstream", "text": "Around 2138, a new personal device, perhaps a brain implant or smart lens, might replace the phone. People could send words or images by thought, and daily life could reorganise around it within a decade.", "watch": "Watch brain implants moving from medical trials to healthy users, and early laws on who owns neural data."}, "breaks": "Bell’s phone took decades to reach most homes and carried only voice, while smartphones reached billions within about a decade and carried the internet.", "older": "Samuel Morse’s telegraph, 1844", "echoes": [{"year": 1844, "short": "Samuel Morse’s…", "title": "Samuel Morse’s telegraph", "region": "world", "line": ""}, {"year": 1973, "short": "First Cellphone", "title": "The first handheld mobile phone call", "region": "us", "line": "On a Manhattan sidewalk, Motorola’s Martin Cooper called a rival at AT&T’s Bell Labs on a brick-sized prototype, starting the mobile age."}]}, {"id": "krakatoa", "theme": "An eruption the whole planet feels", "rhyme": 3, "then": {"year": 1883, "short": "Krakatoa", "title": "The Eruption of Krakatoa", "where": "Sunda Strait, Dutch East Indies", "region": "world", "hook": "The volcano heard 4,800 km away, often called the loudest sound in recorded history.", "text": "On 27 August 1883, Krakatoa in the Dutch East Indies blew itself apart. The blast was heard 4,800 km away, and its pressure wave circled the globe more than three times. Tsunamis killed over 36,000 people, and ash turned sunsets red worldwide."}, "now": {"year": 2022, "short": "Hunga Tonga", "title": "The Hunga Tonga Eruption", "where": "Tonga, South Pacific", "region": "world", "hook": "January 2022: satellite loops of a vast ash cloud bursting over the Pacific near Tonga.", "text": "On 15 January 2022 the undersea volcano Hunga Tonga–Hunga Ha’apai produced the largest atmospheric explosion recorded by modern instruments. Its plume rose about 57 km, and its pressure wave circled the globe several times. Tsunamis reached Peru, and Tonga’s internet cable was cut."}, "followed": "Ash and sulfur dimmed sunlight, and Northern Hemisphere summers cooled by up to 0.4°C the next year. In 1927 a new volcano, Anak Krakatau, “Child of Krakatoa,” rose from the sea.", "next": {"short": "Dimmed Skies", "title": "An eruption that dims the whole sky", "text": "Around 2161, a bigger blast on the scale of Tambora could veil the sun for a year or two, cooling the planet and cutting harvests in a crowded, tightly linked world.", "watch": "Swelling ground and gas bursts at restless volcanoes, sulfur readings from satellites, and whether nations stockpile food for a sudden cold year."}, "breaks": "Hunga Tonga killed fewer than ten people and released little sulfur, so it barely changed global temperatures, while Krakatoa killed over 36,000 and cooled summers.", "older": "Tambora, 1815", "echoes": [{"year": 1783, "short": "Laki", "title": "Iceland’s Laki eruption", "region": "europe", "line": "Laki erupted for eight months; its sulfur haze sickened Europe and chilled the Northern Hemisphere, and famine killed a fifth of Icelanders."}, {"year": 1815, "short": "Tambora", "title": "Mount Tambora erupts in Indonesia", "region": "world", "line": "Tambora, the largest eruption in recorded history, killed tens of thousands and brought 1816’s “Year Without a Summer” to Europe and America."}, {"year": 1991, "short": "Pinatubo", "title": "Mount Pinatubo erupts in the Philippines", "region": "world", "line": "The 20th century’s second-largest eruption lofted about 15 million tonnes of sulfur dioxide and cooled the planet by about 0.5°C."}]}, {"id": "scramble", "theme": "Outside powers compete for Africa", "rhyme": 2, "then": {"year": 1884, "short": "The Scramble", "title": "The Berlin Conference and the Scramble", "where": "Berlin, Germany", "region": "europe", "hook": "European powers met in Berlin to set rules for claiming Africa, with no Africans present.", "text": "From November 1884 to February 1885, 14 states met in Berlin at Bismarck’s invitation to set rules for claiming African land. No Africans were invited. The talks recognized King Leopold II’s claim to the Congo and sped up a land grab already under way."}, "now": {"year": 2018, "short": "New Scramble", "title": "The New Scramble for Africa", "where": "Across Africa", "region": "africa", "hook": "September 2018: African leaders gathered in Beijing as Xi Jinping pledged $60 billion.", "text": "At the September 2018 China–Africa summit in Beijing, Xi Jinping pledged $60 billion in finance. Russia’s Wagner Group arrived in the Central African Republic, Gulf states built ports and bases in the Horn of Africa, and the US unveiled an Africa strategy to counter China and Russia."}, "followed": "By 1914 Europeans ruled about 90% of Africa, and only Liberia and Ethiopia, which beat Italy at Adwa in 1896, stayed independent. Most colonies won independence in the late 1950s and 1960s.", "next": {"short": "Africa’s Terms", "title": "Africa sets the terms for outsiders", "text": "Around 2152, Africa might be home to a third or more of humanity. Outside powers could compete for its workers, markets and minerals, while African blocs decide who gets access and on what terms.", "watch": "Deals for battery minerals, new foreign military bases, debt talks, and whether the African Continental Free Trade Area gives the continent one voice."}, "breaks": "African states are now sovereign: they sign or refuse deals, choose partners, and bargain with China, Russia, the Gulf and the West for better terms.", "older": "The Treaty of Tordesillas, 1494", "echoes": [{"year": 1494, "short": "Treaty of Torde…", "title": "The Treaty of Tordesillas", "region": "world", "line": ""}, {"year": 1637, "short": "Elmina", "title": "The Dutch seize Elmina Castle", "region": "africa", "line": "The Dutch seized Portugal’s Elmina Castle in today’s Ghana as European rivals fought over forts for the gold and slave trades."}, {"year": 1960, "short": "Congo Crisis", "title": "The Congo Crisis", "region": "africa", "line": "As Congo won independence, Belgium, the US, the Soviet Union and the UN intervened, making it a Cold War battleground."}, {"year": 1975, "short": "Angola", "title": "Angola becomes a Cold War battlefield", "region": "africa", "line": "At Angola’s independence, Cuban troops and Soviet arms backed one side while the US and South Africa backed its rivals."}]}, {"id": "trusts", "theme": "Government takes on a dominant monopoly", "rhyme": 3, "then": {"year": 1890, "short": "Sherman Act", "title": "The Sherman Antitrust Act", "where": "Washington, D.C.", "region": "us", "hook": "America’s first federal law against monopolies, later used to break up Rockefeller’s Standard Oil.", "text": "In July 1890 President Benjamin Harrison signed the Sherman Antitrust Act, passed almost unanimously, banning monopolization and conspiracies in restraint of trade. Its biggest target became John D. Rockefeller’s Standard Oil, which had controlled about 90% of US oil refining. In 1911 the Supreme Court split it into 34 companies."}, "now": {"year": 2020, "short": "US v. Google", "title": "The US Sues Google", "where": "Washington, D.C.", "region": "us", "hook": "October 2020: the US government sued Google, its biggest tech monopoly case since Microsoft.", "text": "On 20 October 2020 the Justice Department and 11 states sued Google under the Sherman Act over its search dominance. Google paid $26 billion in 2021 alone to be the default search engine. In August 2024 Judge Amit Mehta ruled that Google is a monopolist."}, "followed": "The breakup made Rockefeller richer as shares in the pieces soared, and they grew into Exxon, Mobil and Chevron. Congress added the Clayton Act and the Federal Trade Commission in 1914.", "next": {"short": "Next Breakup", "title": "Breaking up tomorrow’s digital gatekeeper", "text": "Around 2150, governments might try to break up whatever firm runs the dominant AI, energy or space network, perhaps still using a law first aimed at oil trusts.", "watch": "One company controlling the main gateway to information or computing power, paying to be the default, and lawmakers rewriting rules to catch up."}, "breaks": "Standard Oil sold a physical product; Google gives search away free, so harm is harder to prove, and in 2025 a judge declined to break it up.", "older": "England’s Statute of Monopolies, 1624", "echoes": [{"year": 1624, "short": "Monopolies Act", "title": "England’s Statute of Monopolies", "region": "europe", "line": "England’s Parliament voided most royal grants of monopoly over everyday trades, but allowed patents for new inventions."}, {"year": 1984, "short": "AT&T Breakup", "title": "The breakup of AT&T’s Bell System", "region": "us", "line": "To settle a federal antitrust suit, AT&T, which ran most US phone service, split off seven regional “Baby Bells.”"}, {"year": 1998, "short": "US v. Microsoft", "title": "The US sues Microsoft", "region": "us", "line": "The US accused Microsoft of using Windows to crush rivals like Netscape; a 2000 breakup order was overturned on appeal."}]}, {"id": "yellow", "theme": "False stories spread by new media", "rhyme": 2, "then": {"year": 1898, "short": "USS Maine", "title": "Yellow Journalism and the USS Maine", "where": "New York and Havana", "region": "us", "hook": "Newspapers cried “Remember the Maine!” and blamed Spain as America rushed toward war.", "text": "On 15 February 1898 the battleship USS Maine exploded in Havana harbor, killing 266 men. William Randolph Hearst’s Journal and Joseph Pulitzer’s World blamed Spain without evidence, in lurid stories that boosted sales. A 1976 US Navy study pointed to an accidental coal fire aboard."}, "now": {"year": 2016, "short": "Fake News", "title": "The Year of Fake News", "where": "United States", "region": "us", "hook": "2016: a fake story saying Pope Francis endorsed Donald Trump raced across Facebook.", "text": "During the 2016 US election, invented stories spread fast on social media. A BuzzFeed News analysis found the top 20 fake election stories drew more Facebook engagement than the top 20 from major outlets. Teenagers in Veles, Macedonia, ran pro-Trump hoax sites for ad money."}, "followed": "The press frenzy fed demands for war. The US declared war on Spain in April 1898, won within four months, and took Puerto Rico, Guam and the Philippines.", "next": {"short": "Deepfake Spark", "title": "A fabricated incident sparks a crisis", "text": "Around 2134, machines could fake any video, voice or document in seconds. A fabricated attack might go viral and push nations toward conflict before anyone can prove it false.", "watch": "Fakes that experts cannot debunk quickly, news feeds written entirely by machines, and falling trust in any shared source of facts."}, "breaks": "In 1898 a few press barons drove the story; in 2016 falsehoods spread through millions of users and platform algorithms, with no editor in charge.", "older": "The Great Moon Hoax, 1835", "echoes": [{"year": 1475, "short": "Trent Libel", "title": "The Simon of Trent blood libel", "region": "europe", "line": "After a boy died in Trent, printed accounts spread a false claim that local Jews killed him, among print’s first viral lies."}, {"year": 1835, "short": "Moon Hoax", "title": "The Great Moon Hoax", "region": "us", "line": "The New York Sun, a cheap new penny paper, claimed astronomers had spotted bat-winged people on the Moon, and its sales soared."}, {"year": 1938, "short": "Martian Panic", "title": "The War of the Worlds broadcast", "region": "us", "line": "Orson Welles’s radio drama of a Martian invasion fooled some listeners, and newspapers then spread exaggerated tales of nationwide panic."}, {"year": 2018, "short": "WhatsApp Rumors", "title": "India’s WhatsApp rumor lynchings", "region": "india", "line": "False WhatsApp rumors of child kidnappers spread among India’s new smartphone users, and mobs killed more than a dozen innocent people."}]}, {"id": "dreadnought", "theme": "A rising sea power alarms the ruling one", "rhyme": 2, "then": {"year": 1906, "short": "Dreadnought", "title": "HMS Dreadnought Starts a Naval Race", "where": "Portsmouth, England", "region": "europe", "hook": "The British battleship so advanced it made every other battleship obsolete overnight.", "text": "Launched in February 1906 and completed that December, HMS Dreadnought carried ten 12-inch guns and fast steam turbines. It made older battleships obsolete, so Britain and a rising Germany raced to build the new type. In a 1909 naval scare, the British slogan was “We want eight and we won’t wait.”"}, "now": {"year": 2020, "short": "China’s Navy", "title": "China Builds the World’s Largest Navy", "where": "China", "region": "china", "hook": "2020: amid the pandemic, the Pentagon reported China’s navy had overtaken America’s in ship count.", "text": "In September 2020 the Pentagon’s annual report said China had the world’s largest navy, about 350 ships and submarines against roughly 293 for the US. Chinese shipyards were launching warships at a rapid pace, and Beijing had built military bases on reefs in the South China Sea."}, "followed": "The rivalry deepened British-German hostility before 1914. Their great fleets met only once, at Jutland in 1916, and the German battle fleet then stayed mostly in port.", "next": {"short": "New Sea Power", "title": "A new naval challenger rises", "text": "Around 2134, another rising power might challenge the leading navy, perhaps with fleets of cheap drone ships that make today’s carriers look as dated as pre-dreadnoughts did.", "watch": "A newcomer outbuilding the leader in shipyards, a new ship type that makes old fleets obsolete, and rival alliances forming around sea lanes."}, "breaks": "The US Navy still leads in tonnage, aircraft carriers and global bases, and nuclear weapons make a direct war between great powers far more dangerous than in 1914.", "older": "The Anglo-Dutch Wars, 1652", "echoes": [{"year": -260, "short": "Rome’s Fleet", "title": "Rome builds a fleet against Carthage", "region": "europe", "line": "Rome, a land power, copied a captured Carthaginian warship, built about 100 in two months, and beat Carthage’s navy at Mylae."}, {"year": 1652, "short": "Anglo-Dutch War", "title": "The First Anglo-Dutch War", "region": "europe", "line": "England’s growing navy and trade laws aimed at Dutch shipping sparked war with the Dutch Republic, Europe’s leading sea power."}, {"year": 1922, "short": "Naval Treaty", "title": "The Washington Naval Treaty", "region": "us", "line": "Facing a costly race, Britain, the US and Japan capped battleships at a 5:5:3 ratio, with Britain accepting parity with America."}]}, {"id": "ellis", "theme": "A great migration wave, then backlash", "rhyme": 2, "then": {"year": 1907, "short": "Ellis Island", "title": "Ellis Island’s Record Year", "where": "New York, USA", "region": "us", "hook": "The island gateway where millions of immigrants first set foot in America.", "text": "In 1907 nearly 1.3 million immigrants entered the United States, a record at the time, and over a million passed through Ellis Island. Most came from southern and eastern Europe. On 17 April alone, inspectors processed 11,747 people."}, "now": {"year": 2015, "short": "Migrant Crisis", "title": "Europe’s Migrant Crisis", "where": "Europe", "region": "europe", "hook": "September 2015: the photo of drowned toddler Alan Kurdi, then crowds cheering refugees in Munich.", "text": "More than a million migrants and refugees reached Europe by sea in 2015, many fleeing Syria’s civil war. Angela Merkel told Germans “We can do this,” and Germany took in about 890,000 asylum seekers. Hungary built a border fence."}, "followed": "Backlash followed. Congress imposed a literacy test in 1917, and the 1924 quota law sharply cut arrivals from southern and eastern Europe and barred most Asians.", "next": {"short": "Climate Exodus", "title": "A climate-driven wave of migration", "text": "Around 2123, heat, drought and rising seas could push tens of millions to move, perhaps toward aging countries short of workers, setting off the same cycle of welcome and backlash.", "watch": "Regions growing too hot to farm, labor shortages in aging societies, and new walls or quota laws in the countries people head for."}, "breaks": "Ellis Island arrivals mostly came legally, seeking work in an America with few limits on Europeans; many 2015 arrivals were war refugees crossing irregularly into a 28-nation union.", "older": "The Irish famine exodus, 1845", "echoes": [{"year": 376, "short": "Danube Crossing", "title": "The Goths cross the Danube", "region": "europe", "line": "Fleeing the Huns, tens of thousands of Goths entered the Roman Empire; abuse by officials sparked a revolt that killed Emperor Valens."}, {"year": 1845, "short": "Irish Famine", "title": "Ireland’s famine exodus", "region": "us", "line": "Fleeing the Great Famine, over a million Irish emigrated, many to America, where the anti-Catholic Know-Nothing movement surged in the 1850s."}, {"year": 1882, "short": "Exclusion Act", "title": "The Chinese Exclusion Act", "region": "us", "line": "After Chinese workers came for gold mines and railroads, Congress banned Chinese laborers, the first major US law to bar one nationality."}, {"year": 1948, "short": "Windrush", "title": "The Empire Windrush reaches Britain", "region": "europe", "line": "The Empire Windrush brought Caribbean migrants to postwar Britain; as more followed, riots erupted in 1958 and entry laws tightened from 1962."}]}, {"id": "modelt", "theme": "A new vehicle goes mass market", "rhyme": 2, "then": {"year": 1908, "short": "Model T", "title": "Ford’s Model T", "where": "Detroit, Michigan", "region": "us", "hook": "Henry Ford’s simple, cheap car that put ordinary Americans on the road.", "text": "Ford launched the Model T on 1 October 1908 at about $850. After the moving assembly line arrived in 1913, prices eventually fell below $300, and over 15 million were built by 1927. By 1918, half the cars in America were Model Ts."}, "now": {"year": 2023, "short": "Electric Cars", "title": "Electric Cars Go Mass Market", "where": "Worldwide, led by China", "region": "world", "hook": "2023: a Tesla, the Model Y, became the world’s best-selling car of any kind.", "text": "Nearly 14 million electric cars were sold worldwide in 2023, about 18% of all new cars, up from about 4% in 2020. China accounted for about 60% of sales, and in late 2023 China’s BYD passed Tesla in quarterly battery-car sales."}, "followed": "Cars reshaped America with paved highways, suburbs and a booming oil industry. In 1927 Ford replaced the Model T with the Model A, as General Motors offered more style and choice.", "next": {"short": "Robot Rides", "title": "Self-driving or flying vehicles for everyone", "text": "Around 2138, another vehicle could go from rich people’s novelty to everyday tool, perhaps self-driving pods or small electric aircraft, and cities might redraw streets and parking around it.", "watch": "Prices falling year after year, one model that suddenly everyone buys, and cities rewriting street and parking rules."}, "breaks": "The Model T created mass car ownership from almost nothing; electric cars replace a machine people already own, helped by climate policy and subsidies.", "older": "Stephenson’s Rocket, 1829", "echoes": [{"year": 1829, "short": "Stephenson’s Ro…", "title": "Stephenson’s Rocket", "region": "world", "line": ""}, {"year": 1885, "short": "Safety Bicycle", "title": "The Rover safety bicycle", "region": "europe", "line": "Starley’s chain-driven Rover replaced the risky high-wheeler, and cheap safety bicycles set off a worldwide cycling craze in the 1890s."}, {"year": 1945, "short": "VW Beetle", "title": "The Volkswagen Beetle goes global", "region": "europe", "line": "After World War II, Volkswagen mass-produced the Beetle for ordinary buyers; in 1972 it passed the Model T’s production record."}, {"year": 1958, "short": "Super Cub", "title": "Honda’s Super Cub motorbike", "region": "world", "line": "Honda’s cheap, easy-to-ride Super Cub put millions on motorized wheels; over 100 million built make it the best-selling motor vehicle ever."}]}, {"id": "titanic", "theme": "Confidence in a machine built for the wealthy", "rhyme": 2, "then": {"year": 1912, "short": "Titanic", "title": "The Sinking of the Titanic", "where": "North Atlantic", "region": "europe", "hook": "The “unsinkable” luxury liner that hit an iceberg on its maiden voyage.", "text": "On 14 April 1912 the luxury liner Titanic, carrying millionaires like John Jacob Astor, struck an iceberg on its maiden voyage. It sank in under three hours. With lifeboats for only 1,178 of about 2,224 aboard, more than 1,500 died."}, "now": {"year": 2023, "short": "Titan Sub", "title": "The Titan Submersible Implodes", "where": "North Atlantic", "region": "us", "hook": "June 2023: the world counted down the Titan’s oxygen, not knowing it had already imploded.", "text": "On 18 June 2023 OceanGate’s Titan submersible imploded on a dive to the Titanic wreck, killing all five aboard, including CEO Stockton Rush. Seats cost $250,000. The carbon-fiber craft had never been certified, and experts had warned about its safety."}, "followed": "Inquiries in Britain and the US led to lifeboats for all aboard and round-the-clock radio watches. The 1914 SOLAS safety treaty and the International Ice Patrol followed.", "next": {"short": "Space Tragedy", "title": "A luxury space trip ends in disaster", "text": "Around 2134, wealthy tourists might ride to orbit, the Moon or the deep ocean on craft sold as safe. One disaster could force the safety rules the industry skipped, as Titanic did.", "watch": "Private tourist trips to space or extreme places, operators avoiding outside certification, and marketing that promises total safety."}, "breaks": "Titanic carried over 2,200 people of every class; Titan carried five people who signed waivers for an uncertified experimental craft.", "older": "The warship Vasa sinks, 1628", "echoes": [{"year": 1628, "short": "Vasa", "title": "The warship Vasa sinks", "region": "europe", "line": "Sweden’s king demanded a mighty showpiece warship, but the top-heavy Vasa capsized less than a mile into its maiden voyage."}, {"year": 1937, "short": "Hindenburg", "title": "The Hindenburg disaster", "region": "us", "line": "The hydrogen-filled luxury airship burst into flames while landing in New Jersey, killing 36 and ending the era of passenger airships."}, {"year": 2000, "short": "Concorde Crash", "title": "The Concorde crash near Paris", "region": "europe", "line": "The supersonic jet for wealthy travelers, with a spotless safety record, crashed after takeoff from Paris, killing 113; Concorde retired in 2003."}]}, {"id": "somme", "theme": "Trench attrition meets new war machines", "rhyme": 3, "then": {"year": 1916, "short": "The Somme", "title": "The Battle of the Somme", "where": "Somme, France", "region": "europe", "hook": "The battle where Britain suffered 57,000 casualties in one day and tanks made their debut.", "text": "On 1 July 1916 British and French troops attacked German trenches along the Somme. Britain suffered 57,470 casualties that day, including over 19,000 dead. Tanks first appeared in September, and by November the Allies had advanced only about 10 km, at a cost of over a million casualties on both sides."}, "now": {"year": 2023, "short": "Bakhmut", "title": "The Battle of Bakhmut", "where": "Bakhmut, Ukraine", "region": "europe", "hook": "2023: drone videos from Bakhmut showing a city ground down to rubble and craters.", "text": "Russian forces, spearheaded by the Wagner Group, fought for Bakhmut from August 2022 until claiming it in May 2023. Soldiers dug trenches, and both sides used cheap drones to spot targets and drop grenades. Tens of thousands were killed or wounded; exact figures remain disputed."}, "followed": "The war ground on for two more years. By 1918 armies combined tanks, aircraft and artillery to break the trench deadlock, and Germany signed an armistice in November.", "next": {"short": "Robot Trenches", "title": "A war of attrition fought by machines", "text": "Around 2130, two evenly matched armies might again stall in a grinding war, with swarms of autonomous drones making any open ground deadly and pushing soldiers back underground.", "watch": "Cheap autonomous weapons that favor defenders, armies digging in instead of maneuvering, and nations racing to mass-produce shells and drones."}, "breaks": "The Somme was one front of a world war between empires; Bakhmut was far smaller, and constant drone surveillance meant almost nothing could move unseen.", "older": "The Siege of Petersburg, 1864", "echoes": [{"year": 1864, "short": "Petersburg", "title": "The Siege of Petersburg", "region": "us", "line": "Union and Confederate armies faced off in trenches around Petersburg for nine months, with mortars, mines and repeating rifles foreshadowing 1916."}, {"year": 1904, "short": "Port Arthur", "title": "The Siege of Port Arthur", "region": "china", "line": "Japanese troops stormed Russian forts through barbed wire and machine-gun fire, losing tens of thousands in a preview of World War I."}, {"year": 1980, "short": "Iran–Iraq War", "title": "The Iran–Iraq War", "region": "mideast", "line": "Iran and Iraq fought eight years of World War I-style trench warfare, with human-wave attacks, poison gas and missiles fired at cities."}]}, {"id": "sykes", "theme": "Borders drawn by outsiders, defied by insurgents", "rhyme": 2, "then": {"year": 1916, "short": "Sykes–Picot", "title": "The Sykes–Picot Agreement", "where": "Ottoman Middle East", "region": "mideast", "hook": "The secret British-French pact that split the Ottoman Arab lands into zones on a map.", "text": "In May 1916 Britain’s Mark Sykes and France’s François Georges-Picot secretly agreed how to split the Ottoman Empire’s Arab lands after the war. Their map drew zones of British and French control and influence across today’s Syria, Lebanon, Iraq and Jordan. The Bolsheviks exposed the deal in 1917."}, "now": {"year": 2014, "short": "ISIS Caliphate", "title": "ISIS Declares a Caliphate", "where": "Iraq and Syria", "region": "mideast", "hook": "Summer 2014: ISIS fighters seized Mosul and bulldozed the sand berm marking the Iraq–Syria border.", "text": "In June 2014 ISIS seized Mosul, Iraq’s second-largest city, and on 29 June declared a caliphate under Abu Bakr al-Baghdadi. A propaganda video titled “The End of Sykes–Picot” showed a bulldozer flattening a sand berm on the Iraq–Syria border. At its peak ISIS ruled millions of people."}, "followed": "After the Ottoman defeat, the 1920 San Remo conference gave France mandates over Syria and Lebanon and Britain over Iraq and Palestine. Many Arab leaders felt betrayed by British wartime promises of independence.", "next": {"short": "Lines Redrawn", "title": "Old borders crack under new pressures", "text": "Around 2112, armed movements might again try to erase borders drawn by outsiders, perhaps where heat and water
