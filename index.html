nternet.", "older": "Samuel Morse’s telegraph, 1844", "echoes": [{"year": 1840, "short": "Penny Post", "title": "Britain’s Uniform Penny Post begins", "region": "europe", "line": "A flat one-penny rate for any letter in Britain made writing cheap, and letter volume more than doubled in the first year."}, {"year": 1844, "short": "Morse Telegraph", "title": "Morse’s telegraph sends its first message", "region": "us", "line": "Samuel Morse tapped “What hath God wrought” from Washington to Baltimore; within 17 years wires spanned the continent, carrying news in minutes."}, {"year": 1973, "short": "First Cellphone", "title": "The first handheld mobile phone call", "region": "us", "line": "On a Manhattan sidewalk, Motorola’s Martin Cooper called a rival at AT&T’s Bell Labs on a brick-sized prototype, starting the mobile age."}, {"year": 1992, "short": "First Text", "title": "The first text message is sent", "region": "europe", "line": "Engineer Neil Papworth sent “Merry Christmas” to a Vodafone director’s phone, the first SMS, and texting went on to reshape daily life."}, {"year": 1999, "short": "i-mode", "title": "Japan’s i-mode puts the web on phones", "region": "world", "line": "NTT DoCoMo’s i-mode put email and websites on ordinary phones, drew over 30 million Japanese users by 2002 and popularized emoji."}], "opp": {"lastTime": "The phone created a big new job for women: Emma Nutt became the first woman telephone operator, in Boston, in 1878, and by 1950 about 342,000 operators worked for US phone companies. After 2007, building smartphone apps became a new trade.", "ideas": [{"kind": "build", "title": "Neural data privacy tools", "line": "Consent and privacy tools for brain and body data may be needed as states like Colorado and California treat neural data as sensitive."}, {"kind": "build", "title": "Hands-free services on smart glasses", "line": "Services built for smart glasses, such as live captions for deaf users or step-by-step guidance for field repairs, could grow like early apps."}, {"kind": "work", "title": "Neurotech clinical and support roles", "line": "Trial coordinators, neurosurgical nurses and rehabilitation therapists who help people learn brain-computer interfaces may grow, much as operators grew around the phone."}, {"kind": "learn", "title": "Designing beyond the touchscreen", "line": "Designing interfaces for voice, gaze and gesture, with privacy and accessibility in mind, is a skill the next device shift may reward."}], "watch": "Watch brain-implant trials moving beyond paralysed patients, sales of smart glasses, and new laws treating neural data as sensitive."}}, {"id": "krakatoa", "theme": "An eruption the whole planet feels", "rhyme": 3, "then": {"year": 1883, "short": "Krakatoa", "title": "The Eruption of Krakatoa", "where": "Sunda Strait, Dutch East Indies", "region": "world", "hook": "The volcano heard 4,800 km away, often called the loudest sound in recorded history.", "text": "On 27 August 1883, Krakatoa in the Dutch East Indies blew itself apart. The blast was heard 4,800 km away, and its pressure wave circled the globe more than three times. Tsunamis killed over 36,000 people, and ash turned sunsets red worldwide."}, "now": {"year": 2022, "short": "Hunga Tonga", "title": "The Hunga Tonga Eruption", "where": "Tonga, South Pacific", "region": "world", "hook": "January 2022: satellite loops of a vast ash cloud bursting over the Pacific near Tonga.", "text": "On 15 January 2022 the undersea volcano Hunga Tonga–Hunga Ha’apai produced the largest atmospheric explosion recorded by modern instruments. Its plume rose about 57 km, and its pressure wave circled the globe several times. Tsunamis reached Peru, and Tonga’s internet cable was cut."}, "followed": "Ash and sulfur dimmed sunlight, and Northern Hemisphere summers cooled by up to 0.4°C the next year. In 1927 a new volcano, Anak Krakatau, “Child of Krakatoa,” rose from the sea.", "next": {"short": "Dimmed Skies", "title": "An eruption that dims the whole sky", "text": "Around 2161, a bigger blast on the scale of Tambora could veil the sun for a year or two, cooling the planet and cutting harvests in a crowded, tightly linked world.", "watch": "Swelling ground and gas bursts at restless volcanoes, sulfur readings from satellites, and whether nations stockpile food for a sudden cold year."}, "breaks": "Hunga Tonga killed fewer than ten people and released little sulfur, so it barely changed global temperatures, while Krakatoa killed over 36,000 and cooled summers.", "older": "Tambora, 1815", "echoes": [{"year": -43, "short": "Okmok Eruption", "title": "Alaska’s Okmok volcano chills Rome and Egypt", "region": "world", "line": "Alaska’s Okmok made 43 and 42 BC among the coldest years in recent millennia, linked to failed harvests in Rome and Egypt."}, {"year": 536, "short": "536 Dust Veil", "title": "The volcanic winter of 536", "region": "world", "line": "A volcanic haze dimmed the sun for about 18 months; summers turned cold and harvests failed from Ireland to China."}, {"year": 1257, "short": "Samalas", "title": "Indonesia’s Samalas volcano erupts", "region": "world", "line": "Indonesia’s Samalas left twice Tambora’s sulfur in polar ice, and European chroniclers recorded a cold, rainy 1258 with failed harvests."}, {"year": 1600, "short": "Huaynaputina", "title": "Peru’s Huaynaputina erupts", "region": "world", "line": "South America’s largest recorded eruption chilled the Northern Hemisphere and is linked to the cold that brought Russia’s 1601–1603 famine."}, {"year": 1783, "short": "Laki", "title": "Iceland’s Laki eruption", "region": "europe", "line": "Laki erupted for eight months; its sulfur haze sickened Europe and chilled the Northern Hemisphere, and famine killed a fifth of Icelanders."}, {"year": 1815, "short": "Tambora", "title": "Mount Tambora erupts in Indonesia", "region": "world", "line": "Tambora, the largest eruption in recorded history, killed tens of thousands and brought 1816’s “Year Without a Summer” to Europe and America."}, {"year": 1991, "short": "Pinatubo", "title": "Mount Pinatubo erupts in the Philippines", "region": "world", "line": "The 20th century’s second-largest eruption lofted about 15 million tonnes of sulfur dioxide and cooled the planet by about 0.5°C."}, {"year": 2010, "short": "Eyjafjallajökull", "title": "Iceland’s ash cloud grounds Europe’s flights", "region": "europe", "line": "Ash from Iceland’s Eyjafjallajökull closed much of Europe’s airspace for about a week, cancelling over 100,000 flights and stranding millions worldwide."}], "opp": {"lastTime": "Krakatoa was one of the first disasters reported worldwide within hours by undersea telegraph, and the Royal Society’s 1888 report helped found modern atmospheric science. At Pinatubo in 1991, US and Philippine volcano forecasts saved more than 5,000 lives, showing what monitoring is worth.", "ideas": [{"kind": "build", "title": "Backup links for island nations", "line": "Satellite links, spare cable capacity and repair planning that keep island banks, hospitals and governments online when an eruption cuts a subsea cable."}, {"kind": "build", "title": "Cold-year harvest risk tools", "line": "Models that estimate how a year of dimmed sunlight would hit regional harvests and food stocks, for insurers, farm ministries and food agencies."}, {"kind": "work", "title": "Volcano and tsunami warning staff", "line": "Observatory technicians, tsunami analysts and infrasound specialists, since Hunga Tonga’s pressure wave raised tsunamis that standard warning models did not expect."}, {"kind": "learn", "title": "Reading satellite sulfur and aerosol data", "line": "How to read satellite sulfur dioxide and aerosol measurements, which show within weeks whether an eruption is likely to cool the climate."}], "watch": "Watch satellite sulfur readings after large eruptions, and whether governments fund cable repair ships, volcano observatories and emergency grain reserves."}}, {"id": "scramble", "theme": "Outside powers compete for Africa", "rhyme": 2, "then": {"year": 1884, "short": "The Scramble", "title": "The Berlin Conference and the Scramble", "where": "Berlin, Germany", "region": "europe", "hook": "European powers met in Berlin to set rules for claiming Africa, with no Africans present.", "text": "From November 1884 to February 1885, 14 states met in Berlin at Bismarck’s invitation to set rules for claiming African land. No Africans were invited. The talks recognized King Leopold II’s claim to the Congo and sped up a land grab already under way."}, "now": {"year": 2018, "short": "New Scramble", "title": "The New Scramble for Africa", "where": "Across Africa", "region": "africa", "hook": "September 2018: African leaders gathered in Beijing as Xi Jinping pledged $60 billion.", "text": "At the September 2018 China–Africa summit in Beijing, Xi Jinping pledged $60 billion in finance. Russia’s Wagner Group arrived in the Central African Republic, Gulf states built ports and bases in the Horn of Africa, and the US unveiled an Africa strategy to counter China and Russia."}, "followed": "By 1914 Europeans ruled about 90% of Africa, and only Liberia and Ethiopia, which beat Italy at Adwa in 1896, stayed independent. Most colonies won independence in the late 1950s and 1960s.", "next": {"short": "Africa’s Terms", "title": "Africa sets the terms for outsiders", "text": "Around 2152, Africa might be home to a third or more of humanity. Outside powers could compete for its workers, markets and minerals, while African blocs decide who gets access and on what terms.", "watch": "Deals for battery minerals, new foreign military bases, debt talks, and whether the African Continental Free Trade Area gives the continent one voice."}, "breaks": "African states are now sovereign: they sign or refuse deals, choose partners, and bargain with China, Russia, the Gulf and the West for better terms.", "older": "The Treaty of Tordesillas, 1494", "echoes": [{"year": 1479, "short": "Alcáçovas", "title": "Castile and Portugal split Africa’s Atlantic coast", "region": "africa", "line": "After a naval war over Guinea’s gold and slaves, Castile got the Canaries and Portugal sole rights to Africa’s coast beyond them."}, {"year": 1494, "short": "Tordesillas", "title": "The Treaty of Tordesillas", "region": "world", "line": "Spain and Portugal split the world along a line west of Cape Verde, leaving Africa’s coasts to Portugal; other powers rejected it."}, {"year": 1637, "short": "Elmina", "title": "The Dutch seize Elmina Castle", "region": "africa", "line": "The Dutch seized Portugal’s Elmina Castle in today’s Ghana as European rivals fought over forts for the gold and slave trades."}, {"year": 1960, "short": "Congo Crisis", "title": "The Congo Crisis", "region": "africa", "line": "As Congo won independence, Belgium, the US, the Soviet Union and the UN intervened, making it a Cold War battleground."}, {"year": 1975, "short": "Angola", "title": "Angola becomes a Cold War battlefield", "region": "africa", "line": "At Angola’s independence, Cuban troops and Soviet arms backed one side while the US and South Africa backed its rivals."}], "opp": {"lastTime": "Gains went mostly to outsiders: Leopold II grew rich on Congo rubber sold into the new pneumatic tire market, and chartered firms like Rhodes’s British South Africa Company took mines and land. Africa exported raw materials while processing and profits stayed abroad.", "ideas": [{"kind": "build", "title": "Refining minerals where they are mined", "line": "Plants and services that process lithium, cobalt, copper or manganese in Africa, as Zimbabwe and Namibia now restrict exports of raw ore."}, {"kind": "build", "title": "Cross-border trade under AfCFTA", "line": "Customs, payment and logistics services that help small African firms sell to neighboring countries under the African Continental Free Trade Area."}, {"kind": "work", "title": "Resource deal negotiators and auditors", "line": "Lawyers, geologists, economists and auditors who help African governments negotiate and monitor mining contracts, debt terms and foreign infrastructure deals."}, {"kind": "learn", "title": "Mining contracts and sovereign debt", "line": "How royalties, offtake agreements and sovereign loans are structured, the terms that decided who gained during past scrambles for Africa."}], "watch": "Watch whether more African states require local mineral processing, and whether trade among African countries grows as a share of their total trade."}}, {"id": "trusts", "theme": "Government takes on a dominant monopoly", "rhyme": 3, "then": {"year": 1890, "short": "Sherman Act", "title": "The Sherman Antitrust Act", "where": "Washington, D.C.", "region": "us", "hook": "America’s first federal law against monopolies, later used to break up Rockefeller’s Standard Oil.", "text": "In July 1890 President Benjamin Harrison signed the Sherman Antitrust Act, passed almost unanimously, banning monopolization and conspiracies in restraint of trade. Its biggest target became John D. Rockefeller’s Standard Oil, which had controlled about 90% of US oil refining. In 1911 the Supreme Court split it into 34 companies."}, "now": {"year": 2020, "short": "US v. Google", "title": "The US Sues Google", "where": "Washington, D.C.", "region": "us", "hook": "October 2020: the US government sued Google, its biggest tech monopoly case since Microsoft.", "text": "On 20 October 2020 the Justice Department and 11 states sued Google under the Sherman Act over its search dominance. Google paid $26 billion in 2021 alone to be the default search engine. In August 2024 Judge Amit Mehta ruled that Google is a monopolist."}, "followed": "The breakup made Rockefeller richer as shares in the pieces soared, and they grew into Exxon, Mobil and Chevron. Congress added the Clayton Act and the Federal Trade Commission in 1914.", "next": {"short": "Next Breakup", "title": "Breaking up tomorrow’s digital gatekeeper", "text": "Around 2150, governments might try to break up whatever firm runs the dominant AI, energy or space network, perhaps still using a law first aimed at oil trusts.", "watch": "One company controlling the main gateway to information or computing power, paying to be the default, and lawmakers rewriting rules to catch up."}, "breaks": "Standard Oil sold a physical product; Google gives search away free, so harm is harder to prove, and in 2025 a judge declined to break it up.", "older": "England’s Statute of Monopolies, 1624", "echoes": [{"year": -386, "short": "Grain Cartel", "title": "Athens tries its grain dealers’ cartel", "region": "europe", "line": "Athens tried grain dealers who colluded to buy cheaply from importers and hoarded grain, one of the earliest recorded antitrust trials."}, {"year": 483, "short": "Zeno’s Edict", "title": "Emperor Zeno outlaws monopolies", "region": "europe", "line": "Eastern Roman Emperor Zeno banned monopolies and price-fixing pacts, even those earlier emperors had granted, on pain of confiscation and exile."}, {"year": 1624, "short": "Monopolies Act", "title": "England’s Statute of Monopolies", "region": "europe", "line": "England’s Parliament voided most royal grants of monopoly over everyday trades, but allowed patents for new inventions."}, {"year": 1813, "short": "EIC Loses India", "title": "Parliament ends the East India Company’s monopoly", "region": "europe", "line": "The Charter Act of 1813 ended the East India Company’s monopoly on trade with India, opening it to private British merchants."}, {"year": 1911, "short": "Standard Oil", "title": "The Supreme Court breaks up Standard Oil", "region": "us", "line": "Standard Oil once controlled about 90 percent of US refining, and the Supreme Court ordered it split into dozens of firms."}, {"year": 1984, "short": "AT&T Breakup", "title": "The breakup of AT&T’s Bell System", "region": "us", "line": "To settle a federal antitrust suit, AT&T, which ran most US phone service, split off seven regional “Baby Bells.”"}, {"year": 1998, "short": "US v. Microsoft", "title": "The US sues Microsoft", "region": "us", "line": "The US accused Microsoft of using Windows to crush rivals like Netscape; a 2000 breakup order was overturned on appeal."}], "opp": {"lastTime": "After the 1911 split, Standard Oil’s pieces grew into Exxon, Mobil and Chevron, and their shares rose. After AT&T’s 1984 breakup, long-distance rivals like MCI and Sprint gained customers and long-distance calling prices fell.", "ideas": [{"kind": "build", "title": "Search and AI rivals", "line": "Specialized search and AI assistant services that could use court-ordered access to Google’s search data and the end of exclusive default deals."}, {"kind": "build", "title": "Data portability and interoperability tools", "line": "Services that move users’ data, contacts and purchases between platforms, as rules like the EU Digital Markets Act require gatekeepers to open up."}, {"kind": "work", "title": "Compliance engineers and antitrust economists", "line": "Antitrust economists, compliance engineers and technical monitors who check whether dominant platforms follow court orders and gatekeeper rules."}, {"kind": "learn", "title": "How digital antitrust remedies work", "line": "How the Sherman Act and EU Digital Markets Act treat default deals, data sharing and self-preferencing, and how remedies can reshape a market."}], "watch": "Watch whether court-ordered data sharing and limits on default deals survive Google’s appeal and actually shift market share in search and AI assistants."}}, {"id": "yellow", "theme": "False stories spread by new media", "rhyme": 2, "then": {"year": 1898, "short": "USS Maine", "title": "Yellow Journalism and the USS Maine", "where": "New York and Havana", "region": "us", "hook": "Newspapers cried “Remember the Maine!” and blamed Spain as America rushed toward war.", "text": "On 15 February 1898 the battleship USS Maine exploded in Havana harbor, killing 266 men. William Randolph Hearst’s Journal and Joseph Pulitzer’s World blamed Spain without evidence, in lurid stories that boosted sales. A 1976 US Navy study pointed to an accidental coal fire aboard."}, "now": {"year": 2016, "short": "Fake News", "title": "The Year of Fake News", "where": "United States", "region": "us", "hook": "2016: a fake story saying Pope Francis endorsed Donald Trump raced across Facebook.", "text": "During the 2016 US election, invented stories spread fast on social media. A BuzzFeed News analysis found the top 20 fake election stories drew more Facebook engagement than the top 20 from major outlets. Teenagers in Veles, Macedonia, ran pro-Trump hoax sites for ad money."}, "followed": "The press frenzy fed demands for war. The US declared war on Spain in April 1898, won within four months, and took Puerto Rico, Guam and the Philippines.", "next": {"short": "Deepfake Spark", "title": "A fabricated incident sparks a crisis", "text": "Around 2134, machines could fake any video, voice or document in seconds. A fabricated attack might go viral and push nations toward conflict before anyone can prove it false.", "watch": "Fakes that experts cannot debunk quickly, news feeds written entirely by machines, and falling trust in any shared source of facts."}, "breaks": "In 1898 a few press barons drove the story; in 2016 falsehoods spread through millions of users and platform algorithms, with no editor in charge.", "older": "The Great Moon Hoax, 1835", "echoes": [{"year": 1193, "short": "Song Xiaobao", "title": "Song China’s “small papers” spread fabrications", "region": "china", "line": "Song officials warned that xiaobao, popular private news sheets, invented imperial orders and appointments out of nothing and spread them widely."}, {"year": 1475, "short": "Trent Libel", "title": "The Simon of Trent blood libel", "region": "europe", "line": "After a boy died in Trent, printed accounts spread a false claim that local Jews killed him, among print’s first viral lies."}, {"year": 1835, "short": "Moon Hoax", "title": "The Great Moon Hoax", "region": "us", "line": "The New York Sun, a cheap new penny paper, claimed astronomers had spotted bat-winged people on the Moon, and its sales soared."}, {"year": 1870, "short": "Ems Dispatch", "title": "Bismarck’s edited Ems telegram", "region": "europe", "line": "Bismarck edited a royal telegram to read like an insult and fed it to the press; French outrage helped spark war."}, {"year": 1938, "short": "Martian Panic", "title": "The War of the Worlds broadcast", "region": "us", "line": "Orson Welles’s radio drama of a Martian invasion fooled some listeners, and newspapers then spread exaggerated tales of nationwide panic."}, {"year": 2018, "short": "WhatsApp Rumors", "title": "India’s WhatsApp rumor lynchings", "region": "india", "line": "False WhatsApp rumors of child kidnappers spread among India’s new smartphone users, and mobs killed more than a dozen innocent people."}, {"year": 2023, "short": "Fake Pentagon", "title": "The AI-faked Pentagon explosion", "region": "us", "line": "An apparently AI-generated image of an explosion near the Pentagon spread via verified Twitter accounts, briefly knocking US stock markets lower."}], "opp": {"lastTime": "The backlash rewarded credibility: Adolph Ochs’s New York Times grew by offering sober news under the motto “All the News That’s Fit to Print,” and Missouri opened the first journalism school in 1908. After 2016, fact-checking groups multiplied and Facebook began paying outside fact-checkers.", "ideas": [{"kind": "build", "title": "Content provenance and verification tools", "line": "Tools that attach and check provenance records on photos, video and audio, helping newsrooms, courts and platforms show what is authentic."}, {"kind": "build", "title": "Trusted local and specialist news", "line": "Subscription news services that compete on accuracy and sourcing in a niche or town, as the sober press did against the yellow papers."}, {"kind": "work", "title": "Verification and open-source investigators", "line": "Verification journalists, open-source investigators and trust-and-safety analysts who check viral images, audio and claims before they shape public decisions."}, {"kind": "learn", "title": "Digital forensics for synthetic media", "line": "Geolocation, reverse image search, metadata analysis and detection of AI-generated audio and video, the skills that debunk a fake quickly."}], "watch": "Watch whether phones, cameras and platforms adopt provenance labels widely, and how long major fakes circulate before being debunked."}}, {"id": "dreadnought", "theme": "A rising sea power alarms the ruling one", "rhyme": 2, "then": {"year": 1906, "short": "Dreadnought", "title": "HMS Dreadnought Starts a Naval Race", "where": "Portsmouth, England", "region": "europe", "hook": "The British battleship so advanced it made every other battleship obsolete overnight.", "text": "Launched in February 1906 and completed that December, HMS Dreadnought carried ten 12-inch guns and fast steam turbines. It made older battleships obsolete, so Britain and a rising Germany raced to build the new type. In a 1909 naval scare, the British slogan was “We want eight and we won’t wait.”"}, "now": {"year": 2020, "short": "China’s Navy", "title": "China Builds the World’s Largest Navy", "where": "China", "region": "china", "hook": "2020: amid the pandemic, the Pentagon reported China’s navy had overtaken America’s in ship count.", "text": "In September 2020 the Pentagon’s annual report said China had the world’s largest navy, about 350 ships and submarines against roughly 293 for the US. Chinese shipyards were launching warships at a rapid pace, and Beijing had built military bases on reefs in the South China Sea."}, "followed": "The rivalry deepened British-German hostility before 1914. Their great fleets met only once, at Jutland in 1916, and the German battle fleet then stayed mostly in port.", "next": {"short": "New Sea Power", "title": "A new naval challenger rises", "text": "Around 2134, another rising power might challenge the leading navy, perhaps with fleets of cheap drone ships that make today’s carriers look as dated as pre-dreadnoughts did.", "watch": "A newcomer outbuilding the leader in shipyards, a new ship type that makes old fleets obsolete, and rival alliances forming around sea lanes."}, "breaks": "The US Navy still leads in tonnage, aircraft carriers and global bases, and nuclear weapons make a direct war between great powers far more dangerous than in 1914.", "older": "The Anglo-Dutch Wars, 1652", "echoes": [{"year": -431, "short": "Athens vs Sparta", "title": "The Peloponnesian War begins", "region": "europe", "line": "Thucydides wrote that the growth of Athens’ power, built on its navy, and the fear it caused in Sparta made war inevitable."}, {"year": -260, "short": "Rome’s Fleet", "title": "Rome builds a fleet against Carthage", "region": "europe", "line": "Rome, a land power, copied a captured Carthaginian warship, built about 100 in two months, and beat Carthage’s navy at Mylae."}, {"year": 1025, "short": "Chola Navy", "title": "Chola India’s navy humbles Srivijaya", "region": "india", "line": "Rajendra Chola’s growing navy sacked Srivijaya’s capital and seized its king, breaking the trade monopoly of Southeast Asia’s leading sea power."}, {"year": 1499, "short": "Zonchio", "title": "The Ottoman navy defeats Venice at Zonchio", "region": "europe", "line": "The Ottomans’ growing fleet beat Venice, the eastern Mediterranean’s leading sea power, at Zonchio, marking their arrival as a serious naval force."}, {"year": 1652, "short": "Anglo-Dutch War", "title": "The First Anglo-Dutch War", "region": "europe", "line": "England’s growing navy and trade laws aimed at Dutch shipping sparked war with the Dutch Republic, Europe’s leading sea power."}, {"year": 1922, "short": "Naval Treaty", "title": "The Washington Naval Treaty", "region": "us", "line": "Facing a costly race, Britain, the US and Japan capped battleships at a 5:5:3 ratio, with Britain accepting parity with America."}, {"year": 1934, "short": "Japan’s Yamato", "title": "Japan abandons the naval treaty limits", "region": "china", "line": "Denied parity with Britain and the US, Japan gave notice it would leave the naval treaties, then secretly built giant battleships."}, {"year": 1970, "short": "Soviet Navy", "title": "The Soviet Okean naval exercise", "region": "russia", "line": "Admiral Gorshkov’s fast-growing Soviet fleet staged the largest peacetime naval exercise yet across several oceans, challenging US command of the seas."}], "opp": {"lastTime": "Shipbuilders and arms makers like Vickers, Armstrong Whitworth and Krupp filled their order books, and Parsons steam turbines became standard. Churchill’s move to oil-fired warships led Britain to buy control of the Anglo-Persian Oil Company in 1914. After the 1922 treaty, many yards lost orders.", "ideas": [{"kind": "build", "title": "Shipyard capacity and repair", "line": "Ship repair, modular construction and shipyard automation services, as the US and its allies try to rebuild yards that lag far behind China’s."}, {"kind": "build", "title": "Tracking dark ships and cables", "line": "Satellite and sensor services that spot vessels with transponders switched off, guard undersea cables and help coast guards protect sea lanes."}, {"kind": "work", "title": "Shipyard trades and naval architects", "line": "Welders, pipefitters, marine electricians, naval architects and marine engineers, trades that shipyards in the US and Europe struggle to hire."}, {"kind": "learn", "title": "Uncrewed vessel design and operation", "line": "How uncrewed surface and underwater vessels are built, operated and regulated, the new ship type that could make older fleets look dated."}], "watch": "Watch shipbuilding budgets, orders for uncrewed vessels, and whether rival powers ever agree to limits as Britain, the US and Japan did in 1922."}}, {"id": "ellis", "theme": "A great migration wave, then backlash", "rhyme": 2, "then": {"year": 1907, "short": "Ellis Island", "title": "Ellis Island’s Record Year", "where": "New York, USA", "region": "us", "hook": "The island gateway where millions of immigrants first set foot in America.", "text": "In 1907 nearly 1.3 million immigrants entered the United States, a record at the time, and over a million passed through Ellis Island. Most came from southern and eastern Europe. On 17 April alone, inspectors processed 11,747 people."}, "now": {"year": 2015, "short": "Migrant Crisis", "title": "Europe’s Migrant Crisis", "where": "Europe", "region": "europe", "hook": "September 2015: the photo of drowned toddler Alan Kurdi, then crowds cheering refugees in Munich.", "text": "More than a million migrants and refugees reached Europe by sea in 2015, many fleeing Syria’s civil war. Angela Merkel told Germans “We can do this,” and Germany took in about 890,000 asylum seekers. Hungary built a border fence."}, "followed": "Backlash followed. Congress imposed a literacy test in 1917, and the 1924 quota law sharply cut arrivals from southern and eastern Europe and barred most Asians.", "next": {"short": "Climate Exodus", "title": "A climate-driven wave of migration", "text": "Around 2123, heat, drought and rising seas could push tens of millions to move, perhaps toward aging countries short of workers, setting off the same cycle of welcome and backlash.", "watch": "Regions growing too hot to farm, labor shortages in aging societies, and new walls or quota laws in the countries people head for."}, "breaks": "Ellis Island arrivals mostly came legally, seeking work in an America with few limits on Europeans; many 2015 arrivals were war refugees crossing irregularly into a 28-nation union.", "older": "The Irish famine exodus, 1845", "echoes": [{"year": -2034, "short": "Amorite Wall", "title": "Ur builds a wall against the Amorites", "region": "mideast", "line": "As Amorite herders moved into Sumer, Ur’s king built a wall called “Holding back the Tidnum”; Amorite dynasties later ruled Mesopotamia anyway."}, {"year": 376, "short": "Danube Crossing", "title": "The Goths cross the Danube", "region": "europe", "line": "Fleeing the Huns, tens of thousands of Goths entered the Roman Empire; abuse by officials sparked a revolt that killed Emperor Valens."}, {"year": 1381, "short": "Flemings 1381", "title": "London rebels massacre Flemish immigrants", "region": "europe", "line": "After Edward III welcomed Flemish weavers, rebels in the Peasants’ Revolt hunted Flemings in London, killing dozens identified by their accents."}, {"year": 1845, "short": "Irish Famine", "title": "Ireland’s famine exodus", "region": "us", "line": "Fleeing the Great Famine, over a million Irish emigrated, many to America, where the anti-Catholic Know-Nothing movement surged in the 1850s."}, {"year": 1882, "short": "Exclusion Act", "title": "The Chinese Exclusion Act", "region": "us", "line": "After Chinese workers came for gold mines and railroads, Congress banned Chinese laborers, the first major US law to bar one nationality."}, {"year": 1948, "short": "Windrush", "title": "The Empire Windrush reaches Britain", "region": "europe", "line": "The Empire Windrush brought Caribbean migrants to postwar Britain; as more followed, riots erupted in 1958 and entry laws tightened from 1962."}, {"year": 1979, "short": "Boat People", "title": "Vietnam’s boat people are turned away", "region": "world", "line": "As hundreds of thousands fled Vietnam by sea, neighboring states pushed boats back and declared they would accept no more."}, {"year": 1994, "short": "Prop 187", "title": "California passes Proposition 187", "region": "us", "line": "After years of heavy immigration, California voters approved barring undocumented immigrants from public schools and services, though courts blocked the law."}, {"year": 2008, "short": "S. Africa Riots", "title": "South Africa’s 2008 anti-migrant riots", "region": "africa", "line": "As millions fled Zimbabwe’s economic collapse for South Africa, mobs attacked foreign migrants in its townships, killing at least 62."}], "opp": {"lastTime": "Immigrants filled steel mills, mines and garment shops, and services grew around them: A.P. Giannini’s Bank of Italy, founded in 1904 for immigrants, became Bank of America. When war and the 1924 quotas cut arrivals, Northern employers recruited Black Southerners and Mexican workers.", "ideas": [{"kind": "build", "title": "Credential recognition and job matching", "line": "Services that translate foreign qualifications, speed professional licensing and match newcomers to sectors short of workers, like care, construction and transport."}, {"kind": "build", "title": "Banking and remittances for newcomers", "line": "Low-cost accounts, remittances and credit-history services for migrants, the role immigrant banks like Giannini’s filled after 1904."}, {"kind": "work", "title": "Interpreters, teachers and caseworkers", "line": "Language teachers, interpreters, caseworkers and integration coordinators, especially in aging countries recruiting abroad for care and skilled trades."}, {"kind": "learn", "title": "Migration law and integration practice", "line": "How asylum, work visa and integration rules work, including the EU Pact on Migration and Asylum, plus what helps newcomers find work quickly."}], "watch": "Watch for new quota laws, fences and asylum caps, or the opposite: aging countries widening work visas to fill care and construction jobs."}}, {"id": "modelt", "theme": "A new vehicle goes mass market", "rhyme": 2, "then": {"year": 1908, "short": "Model T", "title": "Ford’s Model T", "where": "Detroit, Michigan", "region": "us", "hook": "Henry Ford’s simple, cheap car that put ordinary Americans on the road.", "text": "Ford launched the Model T on 1 October 1908 at about $850. After the moving assembly line arrived in 1913, prices eventually fell below $300, and over 15 million were built by 1927. By 1918, half the cars in America were Model Ts."}, "now": {"year": 2023, "short": "Electric Cars", "title": "Electric Cars Go Mass Market", "where": "Worldwide, led by China", "region": "world", "hook": "2023: a Tesla, the Model Y, became the world’s best-selling car of any kind.", "text": "Nearly 14 million electric cars were sold worldwide in 2023, about 18% of all new cars, up from about 4% in 2020. China accounted for about 60% of sales, and in late 2023 China’s BYD passed Tesla in quarterly battery-car sales."}, "followed": "Cars reshaped America with paved highways, suburbs and a booming oil industry. In 1927 Ford replaced the Model T with the Model A, as General Motors offered more style and choice.", "next": {"short": "Robot Rides", "title": "Self-driving or flying vehicles for everyone", "text": "Around 2138, another vehicle could go from rich people’s novelty to everyday tool, perhaps self-driving pods or small electric aircraft, and cities might redraw streets and parking around it.", "watch": "Prices falling year after year, one model that suddenly everyone buys, and cities rewriting street and parking rules."}, "breaks": "The Model T created mass car ownership from almost nothing; electric cars replace a machine people already own, helped by climate policy and subsidies.", "older": "Stephenson’s Rocket, 1829", "echoes": [{"year": 1662, "short": "Pascal’s coaches", "title": "Pascal’s five-sol coaches open in Paris", "region": "europe", "line": "Blaise Pascal’s shared coaches ran fixed routes at a five-sol fare, opening carriage travel to paying Parisians, until rules barred commoners."}, {"year": 1829, "short": "The Rocket", "title": "Stephenson’s Rocket wins the Rainhill Trials", "region": "europe", "line": "Stephenson’s Rocket won the Rainhill Trials, and the Liverpool and Manchester steam railway was soon carrying 1,200 passengers a day."}, {"year": 1885, "short": "Safety Bicycle", "title": "The Rover safety bicycle", "region": "europe", "line": "Starley’s chain-driven Rover replaced the risky high-wheeler, and cheap safety bicycles set off a worldwide cycling craze in the 1890s."}, {"year": 1945, "short": "VW Beetle", "title": "The Volkswagen Beetle goes global", "region": "europe", "line": "After World War II, Volkswagen mass-produced the Beetle for ordinary buyers; in 1972 it passed the Model T’s production record."}, {"year": 1958, "short": "Super Cub", "title": "Honda’s Super Cub motorbike", "region": "world", "line": "Honda’s cheap, easy-to-ride Super Cub put millions on motorized wheels; over 100 million built make it the best-selling motor vehicle ever."}], "opp": {"lastTime": "Demand rose for oil, tires and roads: Akron, Ohio became the world’s tire capital, drive-in filling stations spread from 1913, and GM’s lending arm GMAC, founded in 1919, made buying cars on credit common. Ford’s 1914 $5 day drew workers to Detroit.", "ideas": [{"kind": "build", "title": "Charging for drivers without garages", "line": "Curbside, workplace and apartment charging for drivers who cannot plug in at home, the filling station of the electric era."}, {"kind": "build", "title": "Battery recycling and second life", "line": "Collecting, testing and recycling used EV batteries, or reusing them for grid storage, as the first large waves of packs age out."}, {"kind": "work", "title": "EV technicians and charger electricians", "line": "High-voltage vehicle technicians, charger installers and grid electricians, as repair shops and utilities adapt to battery cars as garages once adapted to engines."}, {"kind": "learn", "title": "High-voltage battery diagnostics", "line": "Battery health testing, high-voltage safety and power electronics, skills many mechanics trained on engines do not yet have."}], "watch": "Watch battery prices, used-EV resale values, and whether cities rewrite curb and parking rules for charging and robotaxis."}}, {"id": "titanic", "theme": "Confidence in a machine built for the wealthy", "rhyme": 2, "then": {"year": 1912, "short": "Titanic", "title": "The Sinking of the Titanic", "where": "North Atlantic", "region": "europe", "hook": "The “unsinkable” luxury liner that hit an iceberg on its maiden voyage.", "text": "On 14 April 1912 the luxury liner Titanic, carrying millionaires like John Jacob Astor, struck an iceberg on its maiden voyage. It sank in under three hours. With lifeboats for only 1,178 of about 2,224 aboard, more than 1,500 died."}, "now": {"year": 2023, "short": "Titan Sub", "title": "The Titan Submersible Implodes", "where": "North Atlantic", "region": "us", "hook": "June 2023: the world counted down the Titan’s oxygen, not knowing it had already imploded.", "text": "On 18 June 2023 OceanGate’s Titan submersible imploded on a dive to the Titanic wreck, killing all five aboard, including CEO Stockton Rush. Seats cost $250,000. The carbon-fiber craft had never been certified, and experts had warned about its safety."}, "followed": "Inquiries in Britain and the US led to lifeboats for all aboard and round-the-clock radio watches. The 1914 SOLAS safety treaty and the International Ice Patrol followed.", "next": {"short": "Space Tragedy", "title": "A luxury space trip ends in disaster", "text": "Around 2134, wealthy tourists might ride to orbit, the Moon or the deep ocean on craft sold as safe. One disaster could force the safety rules the industry skipped, as Titanic did.", "watch": "Private tourist trips to space or extreme places, operators avoiding outside certification, and marketing that promises total safety."}, "breaks": "Titanic carried over 2,200 people of every class; Titan carried five people who signed waivers for an uncertified experimental craft.", "older": "The warship Vasa sinks, 1628", "echoes": [{"year": 1120, "short": "White Ship", "title": "The White Ship sinks off Normandy", "region": "europe", "line": "Nobles partying aboard the newly refitted White Ship pushed it to overtake the king’s vessel; it hit a rock, drowning his heir."}, {"year": 1628, "short": "Vasa", "title": "The warship Vasa sinks", "region": "europe", "line": "Sweden’s king demanded a mighty showpiece warship, but the top-heavy Vasa capsized less than a mile into its maiden voyage."}, {"year": 1937, "short": "Hindenburg", "title": "The Hindenburg disaster", "region": "us", "line": "The hydrogen-filled luxury airship burst into flames while landing in New Jersey, killing 36 and ending the era of passenger airships."}, {"year": 1954, "short": "Comet Jet", "title": "The de Havilland Comet crashes", "region": "europe", "line": "Britain’s Comet, the first jet airliner and a prestige symbol, was grounded after two broke apart in midair from metal fatigue."}, {"year": 1956, "short": "Andrea Doria", "title": "The sinking of the Andrea Doria", "region": "europe", "line": "Italy’s luxury liner, billed as one of the safest afloat, sank after a collision; its tilt left half its lifeboats unusable."}, {"year": 2000, "short": "Concorde Crash", "title": "The Concorde crash near Paris", "region": "europe", "line": "The supersonic jet for wealthy travelers, with a spotless safety record, crashed after takeoff from Paris, killing 113; Concorde retired in 2003."}], "opp": {"lastTime": "Safety gear and skills were suddenly in demand: liners added lifeboats for all and round-the-clock wireless operators, the US Radio Act of 1912 licensed operators, and Reginald Fessenden’s early sonar detected an iceberg by echo in 1914. The International Ice Patrol began tracking ice.", "ideas": [{"kind": "build", "title": "Independent certification for extreme travel", "line": "Third-party testing, inspection and certification for submersibles, private spacecraft and adventure tours, where operators have often avoided outside review."}, {"kind": "build", "title": "Fatigue monitoring for composite hulls", "line": "Sensors and analysis that track wear in carbon-fiber hulls and pressure vessels, with alerts reviewed by independent engineers."}, {"kind": "work", "title": "Safety inspectors and certification engineers", "line": "Marine surveyors, classification engineers and spaceflight safety specialists, roles that tend to grow when a disaster forces rules on a new industry."}, {"kind": "learn", "title": "Composite materials and failure analysis", "line": "How carbon fiber and other composites wear and fail under repeated pressure loads, and how certification standards test for it."}], "watch": "Watch whether space and deep-sea tourism operators accept outside certification, and whether regulators gain power to set passenger safety rules."}}, {"id": "somme", "theme": "Trench attrition meets new war machines", "rhyme": 3, "then": {"year": 1916, "short": "The Somme", "title": "The Battle of the Somme", "where": "Somme, France", "region": "europe", "hook": "The battle where Britain suffered 57,000 casualties in one day and tanks made their debut.", "text": "On 1 July 1916 British and French troops attacked German trenches along the Somme. Britain suffered 57,470 casualties that day, including over 19,000 dead. Tanks first appeared in September, and by November the Allies had advanced only about 10 km, at a cost of over a million casualties on both sides."}, "now": {"year": 2023, "short": "Bakhmut", "title": "The Battle of Bakhmut", "where": "Bakhmut, Ukraine", "region": "europe", "hook": "2023: drone videos from Bakhmut showing a city ground down to rubble and craters.", "text": "Russian forces, spearheaded by the Wagner Group, fought for Bakhmut from August 2022 until claiming it in May 2023. Soldiers dug trenches, and both sides used cheap drones to spot targets and drop grenades. Tens of thousands were killed or wounded; exact figures remain disputed."}, "followed": "The war ground on for two more years. By 1918 armies combined tanks, aircraft and artillery to break the trench deadlock, and Germany signed an armistice in November.", "next": {"short": "Robot Trenches", "title": "A war of attrition fought by machines", "text": "Around 2130, two evenly matched armies might again stall in a grinding war, with swarms of autonomous drones making any open ground deadly and pushing soldiers back underground.", "watch": "Cheap autonomous weapons that favor defenders, armies digging in instead of maneuvering, and nations racing to mass-produce shells and drones."}, "breaks": "The Somme was one front of a world war between empires; Bakhmut was far smaller, and constant drone surveillance meant almost nothing could move unseen.", "older": "The Siege of Petersburg, 1864", "echoes": [{"year": -213, "short": "Syracuse Siege", "title": "Archimedes’ machines stall Rome at Syracuse", "region": "europe", "line": "Archimedes’ cranes and catapults wrecked Roman assaults on Syracuse, forcing a long stalemate and blockade until the city fell in 212 BC."}, {"year": 1268, "short": "Xiangyang Siege", "title": "The Mongol siege of Xiangyang", "region": "china", "line": "Mongols besieged Song China’s twin river fortresses for nearly five years until Persian-designed counterweight trebuchets broke them in 1273."}, {"year": 1453, "short": "Constantinople", "title": "Ottoman cannon pound Constantinople’s walls", "region": "europe", "line": "Mehmed II’s giant cannon pounded Constantinople’s walls for 53 days while sappers and defenders fought in tunnels below, until the city fell."}, {"year": 1854, "short": "Sevastopol", "title": "The Siege of Sevastopol", "region": "europe", "line": "Allied troops besieged Sevastopol for 11 months in trench lines fed by a new military railway, a foretaste of World War I."}, {"year": 1864, "short": "Petersburg", "title": "The Siege of Petersburg", "region": "us", "line": "Union and Confederate armies faced off in trenches around Petersburg for nine months, with mortars, mines and repeating rifles foreshadowing 1916."}, {"year": 1904, "short": "Port Arthur", "title": "The Siege of Port Arthur", "region": "china", "line": "Japanese troops stormed Russian forts through barbed wire and machine-gun fire, losing tens of thousands in a preview of World War I."}, {"year": 1951, "short": "Korea Stalemate", "title": "Korea’s trench stalemate", "region": "china", "line": "From mid-1951 Korea’s front froze into trenches and hill battles like Pork Chop Hill, while jet fighters dueled overhead in “MiG Alley.”"}, {"year": 1980, "short": "Iran–Iraq War", "title": "The Iran–Iraq War", "region": "mideast", "line": "Iran and Iraq fought eight years of World War I-style trench warfare, with human-wave attacks, poison gas and missiles fired at cities."}, {"year": 1998, "short": "Eritrea–Ethiopia", "title": "The Eritrea–Ethiopia border war", "region": "africa", "line": "Ethiopia and Eritrea fought a trench war likened to World War I, with jet strikes and human-wave assaults; tens of thousands died."}], "opp": {"lastTime": "Wounds drove new medicine: Harold Gillies pioneered facial reconstruction at Sidcup from 1917, Oswald Robertson set up the first depot of stored blood in 1917, and limb-fitting centers like Roehampton expanded prosthetics for disabled veterans.", "ideas": [{"kind": "build", "title": "Demining survey and clearance tools", "line": "Drone surveys, mapping software and machinery that find and clear mines and unexploded shells, which in France still surface a century later."}, {"kind": "build", "title": "Prosthetics and remote rehabilitation", "line": "Affordable prosthetics, 3D-printed limb sockets and remote rehabilitation services for wounded soldiers and civilians in Ukraine and other conflict zones."}, {"kind": "work", "title": "Deminers, prosthetists and trauma therapists", "line": "Deminers, prosthetists, physical therapists and trauma psychologists, roles that grew after the Somme and are needed again in Ukraine."}, {"kind": "learn", "title": "Drone defense for civilian sites", "line": "How to detect and defend against small drones, a skill now needed at power plants, airports and prisons, not only on battlefields."}], "watch": "Watch ceasefire talks and reconstruction funding for Ukraine, which could shift demand toward demining, rebuilding and long-term rehabilitation."}}, {"id": "sykes", "theme": "Borders drawn by outsiders, defied by insurgents", "rhyme": 2, "then": {"year": 1916, "short": "Sykes–Picot", "title": "The Sykes–Picot Agreement", "where": "Ottoman Middle East", "region": "mideast", "hook": "The secret British-French pact that split the Ottoman Arab lands into zones on a map.", "text": "In May 1916 Britain’s Mark Sykes and France’s François Georges-Picot secretly agreed how to split the Ottoman Empire’s Arab lands after the war. Their map drew zones of British and French control and influence across today’s Syria, Lebanon, Iraq and Jordan. The Bolsheviks exposed the deal in 1917."}, "now": {"year": 2014, "short": "ISIS Caliphate", "title": "ISIS Declares a Caliphate", "where": "Iraq and Syria", "region": "mideast", "hook": "Summer 2014: ISIS fighters seized Mosul and bulldozed the sand berm marking the Iraq–Syria border.", "text": "In June 2014 ISIS seized Mosul, Iraq’s second-largest city, and on 29 June declared a caliphate under Abu Bakr al-Baghdadi. A propaganda video titled “The End of Sykes–Picot” showed a bulldozer flattening a sand berm on the Iraq–Syria border. At its peak ISIS ruled millions of people."}, "followed": "After the Ottoman defeat, the 1920 San Remo conference gave France mandates over Syria and Lebanon and Britain over Iraq and Palestine. Many Arab leaders felt betrayed by British wartime promises of independence.", "next": {"short": "Lines Redrawn", "title": "Old borders crack under new pressures", "text": "Around 2112, armed movements might again try to erase borders drawn by outsiders, perhaps where heat and water shortages leave weak states unable to hold their frontier regions.", "watch": "Governments losing control of border areas, groups invoking colonial-era maps as a grievance, and disputes over shared rivers like the Tigris and Euphrates."}, "breaks": "Today’s borders were mostly set by deals after 1918 that departed from the 1916 map, and ISIS lost its last territory in 2019.", "older": "The First Partition of Poland, 1772", "echoes": [{"year": -167, "short": "Macedonia Split", "title": "Rome splits Macedonia into four republics", "region": "europe", "line": "Rome cut Macedonia into four republics, banning marriage across the new lines; in 149 BC the pretender Andriscus reunited it in revolt."}, {"year": 1772, "short": "Poland Divided", "title": "The First Partition of Poland", "region": "europe", "line": "Russia, Prussia and Austria seized about a third of Poland; Polish insurgents rose against the partitions in 1794, 1830 and 1863."}, {"year": 1893, "short": "Durand Line", "title": "Britain draws the Durand Line", "region": "india", "line": "Britain drew a border splitting Pashtun lands between Afghanistan and British India; Afghanistan never recognized it, and Pashtun fighters defied it."}, {"year": 1920, "short": "Sèvres Defied", "title": "Turkish nationalists overturn the Treaty of Sèvres", "region": "mideast", "line": "The victorious Allies carved up Anatolia at Sèvres, but Mustafa Kemal’s nationalists fought on and won new borders at Lausanne in 1923."}, {"year": 1967, "short": "Biafra", "title": "The Biafran War", "region": "africa", "line": "Biafra declared independence from Nigeria, a country whose borders Britain had drawn; the war and famine that followed killed perhaps a million."}, {"year": 2012, "short": "Azawad Declared", "title": "Tuareg rebels declare Azawad", "region": "africa", "line": "Tuareg rebels declared northern Mali independent as Azawad, saying France had joined it to Mali without consent in 1960."}], "opp": {"lastTime": "Oil interests gained most: Britain kept oil-rich Mosul in Iraq, the Turkish Petroleum Company struck oil at Baba Gurgur near Kirkuk in 1927, and the 1928 Red Line Agreement divided former Ottoman oil among Western firms, with Calouste Gulbenkian keeping 5%.", "ideas": [{"kind": "build", "title": "Shared river data and monitoring", "line": "Satellite and sensor services that measure river flows, dam releases and groundwater, giving neighbors shared facts in disputes over the Tigris and Euphrates."}, {"kind": "build", "title": "Rebuilding war-damaged historic cities", "line": "Reconstruction, 3D documentation and restoration of war-damaged cities, as UNESCO-led teams did in Mosul, where the al-Nuri Mosque reopened in 2025."}, {"kind": "work", "title": "Mediators and local service engineers", "line": "Mediators, water diplomats, civil engineers and local governance advisers who help fragile border regions deliver services so armed groups cannot fill the gap."}, {"kind": "learn", "title": "Border history and transboundary water law", "line": "The history of colonial-era borders and the law of shared rivers, useful in diplomacy, journalism, humanitarian work and risk analysis."}], "watch": "Watch Tigris and Euphrates flows and dam disputes, and whether governments restore services in border areas that armed groups exploit."}}, {"id": "flu", "theme": "A pandemic in a hyper-connected world", "rhyme": 3, "then": {"year": 1918, "short": "Spanish Flu", "title": "The Spanish Flu", "where": "Worldwide", "region": "world", "hook": "The pandemic that killed more people than the First World War.", "text": "From 1918 to 1920 an influenza pandemic infected about a third of the world’s people and killed an estimated 50 million. It struck healthy young adults especially hard. It was called “Spanish” because neutral Spain’s uncensored press reported it openly."}, "now": {"year": 2020, "short": "COVID-19", "title": "The COVID-19 Pandemic", "where": "Worldwide", "region": "world", "hook": "Spring 2020: empty streets, homemade bread, and life on video calls.", "text": "The WHO declared COVID-19 a pandemic on 11 March 2020. By April about half of humanity lived under some form of lockdown. Vaccines arrived within a year, and over 7 million deaths were officially reported, though the true toll was likely much higher."}, "followed": "After further waves the flu faded in 1920. Many countries invested in public health, with Britain creating a Ministry of Health in 1919, and the Roaring Twenties followed.", "next": {"short": "Next Pandemic", "title": "A new virus in a crowded world", "text": "Around 2122, a new virus, perhaps a bird flu, could circle the globe within weeks. Vaccines might be designed in days, but how fast people accept them could decide the death toll.", "watch": "Bird flu spreading between mammals, outbreaks where farms and forests meet, and how quickly vaccines can be made, shipped and trusted."}, "breaks": "In 1918 doctors did not know a virus caused flu; in 2020 scientists sequenced the virus within weeks and had vaccines within a year.", "older": "The Black Death, 1347", "echoes": [{"year": -430, "short": "Athens Plague", "title": "The Plague of Athens", "region": "europe", "line": "Thucydides says a plague from Ethiopia, via Egypt, first struck Athens at its port, Piraeus; about a quarter of Athenians died."}, {"year": 165, "short": "Antonine Plague", "title": "The Antonine Plague sweeps Rome’s empire", "region": "europe", "line": "Brought back by soldiers from Mesopotamia, a plague spread along Roman roads and sea lanes, killing perhaps 5 to 10 million."}, {"year": 249, "short": "Cyprian Plague", "title": "The Plague of Cyprian", "region": "europe", "line": "A new disease spread from Egypt across the Roman Empire, reaching Rome by 251, where up to 5,000 a day reportedly died."}, {"year": 541, "short": "Justinian Plague", "title": "The Plague of Justinian", "region": "europe", "line": "Bubonic plague rode grain ships from Egypt to Constantinople and spread along Mediterranean trade routes, killing millions across the Roman world."}, {"year": 735, "short": "Japan Smallpox", "title": "The great smallpox epidemic in Japan", "region": "china", "line": "Smallpox, reportedly carried from Korea by a fisherman, reached the capital with travelling officials and killed perhaps a third of Japan’s people."}, {"year": 1347, "short": "Black Death", "title": "The Black Death", "region": "world", "line": "Plague spread along Silk Road caravans and Genoese trading ships, killing perhaps a third to half of Europe’s people within five years."}, {"year": 1831, "short": "Cholera Pandemic", "title": "Asiatic cholera reaches Europe and America", "region": "world", "line": "Cholera from India’s Ganges Delta followed trade routes and armies into Russia and Europe by 1831, then crossed the Atlantic by ship."}, {"year": 1889, "short": "Russian Flu", "title": "The 1889 Russian flu", "region": "world", "line": "Carried by rail and steamship, a new flu swept the Northern Hemisphere in about four months, killing roughly a million people."}, {"year": 1957, "short": "Asian Flu", "title": "The 1957 Asian flu", "region": "world", "line": "A new flu strain from China spread worldwide within months, killing over a million, as labs raced to make vaccines."}, {"year": 2009, "short": "Swine Flu", "title": "The 2009 swine flu pandemic", "region": "world", "line": "A new H1N1 flu found in Mexico spread worldwide within two months, and WHO declared the first flu pandemic in 41 years."}], "opp": {"lastTime": "After the Black Death, scarce laborers won higher wages despite England’s 1351 Statute of Labourers. In the 1918 pandemic, Vicks VapoRub sales rose from $900,000 to $2.9 million in a year. After 2020, demand jumped for telehealth, home delivery, video calls and mRNA vaccines.", "ideas": [{"kind": "build", "title": "Wastewater and air pathogen monitoring", "line": "Services that test sewage, airport air and farm sites for new pathogens, giving cities and farms earlier warning than clinic case counts."}, {"kind": "build", "title": "Cleaner indoor air for buildings", "line": "Ventilation upgrades, filtration and air-quality monitoring for schools, offices and clinics, guided by standards like ASHRAE 241, written after COVID."}, {"kind": "work", "title": "Epidemiologists and veterinary disease specialists", "line": "Field epidemiologists, veterinary disease specialists and lab technicians who track bird flu where farms, wildlife and people meet."}, {"kind": "learn", "title": "Health risk communication and trust", "line": "How to explain uncertain health risks clearly and build trust, which tends to decide how fast people accept a new vaccine."}], "watch": "Watch bird flu infections in mammals and people, any sign of human-to-human spread, and whether surveillance funding grows or shrinks."}}, {"id": "weimar", "theme": "Printing money until it is worthless", "rhyme": 3, "then": {"year": 1923, "short": "Hyperinflation", "title": "Weimar Germany’s Hyperinflation", "where": "Germany", "region": "europe", "hook": "Germans carted banknotes in wheelbarrows, and children played with bundles of worthless money.", "text": "In January 1923 France and Belgium occupied the Ruhr after Germany fell behind on reparations. The government printed money to pay striking workers, and by autumn prices doubled every few days. By November one US dollar cost 4.2 trillion marks."}, "now": {"year": 2018, "short": "Venezuela", "title": "Venezuela’s Hyperinflation", "where": "Venezuela", "region": "latam", "hook": "2018: a chicken pictured beside stacks of bolívars, and handbags woven from worthless notes.", "text": "In 2018 Venezuela’s prices rose 130,060% by the central bank’s own count, and outside estimates ran far higher. In August the government cut five zeros from the bolívar. By November the UN said 3 million Venezuelans had left the country."}, "followed": "A new currency, the Rentenmark, ended the crisis in November 1923, and the 1924 Dawes Plan eased reparations. Many Germans had lost their savings, a wound many historians link to later support for extremists.", "next": {"short": "Money Collapse", "title": "A currency printed into worthlessness", "text": "Around 2113, a government buried in debt or cut off from markets might again print money until its currency collapses, as savers flee into foreign or digital money.", "watch": "Central banks funding governments directly, price controls, mass emigration, and ordinary people switching to dollars or cryptocurrencies to protect savings."}, "breaks": "Germany stabilized its money in late 1923; Venezuela’s crisis dragged on for years, blamed by many economists on mismanagement and by its government on US sanctions.", "older": "Revolutionary France’s assignats, 1795", "echoes": [{"year": 301, "short": "Roman Debasement", "title": "Rome’s debased coins and Diocletian’s price edict", "region": "europe", "line": "Emperors debased Rome’s silver coins to pay soldiers until prices soared; Diocletian’s edict capped prices on pain of death, but largely failed."}, {"year": 1214, "short": "Jin Paper Money", "title": "The Jin dynasty prints notes without limit", "region": "china", "line": "Fighting the Mongols, northern China’s Jin dynasty printed notes without limit; by 1214 it issued 1,000-string notes, and people turned to silver."}, {"year": 1330, "short": "Tughluq Tokens", "title": "Delhi’s token currency collapses", "region": "india", "line": "Sultan Muhammad bin Tughluq issued brass and copper tokens valued as silver; people forged them at home until the coins were worthless."}, {"year": 1352, "short": "Yuan Paper Money", "title": "The Yuan dynasty’s paper money collapse", "region": "china", "line": "To fund wars against rebels, China’s Mongol-led Yuan dynasty printed paper money ever faster in the 1350s until it was nearly worthless."}, {"year": 1779, "short": "Continentals", "title": "The collapse of the Continental dollar", "region": "us", "line": "Congress printed Continental dollars to pay for the Revolution until they were nearly worthless, giving rise to “not worth a Continental.”"}, {"year": 1795, "short": "Assignats", "title": "Revolutionary France’s assignats collapse", "region": "europe", "line": "Revolutionary France printed about 45 billion livres in assignats to pay debts and wars; by 1796 they were nearly worthless."}, {"year": 1946, "short": "Hungary’s Pengő", "title": "Hungary’s record hyperinflation", "region": "europe", "line": "In the worst hyperinflation ever recorded, Hungarian prices doubled about every 15 hours, and a 100 quintillion pengő note was issued."}, {"year": 1948, "short": "Gold Yuan", "title": "Nationalist China’s gold yuan collapse", "region": "china", "line": "Launched in August 1948, Nationalist China’s gold yuan was printed without limit and was nearly worthless within a year, sapping middle-class support."}, {"year": 1993, "short": "Yugoslav Dinar", "title": "Yugoslavia’s hyperinflation under sanctions", "region": "europe", "line": "Printing money to cover deficits amid war and sanctions, Yugoslavia saw prices rise about 313 million percent in January 1994 alone."}, {"year": 2008, "short": "Zimbabwe", "title": "Zimbabwe’s hyperinflation", "region": "africa", "line": "Zimbabwe’s central bank printed money until monthly inflation hit about 80 billion percent and a 100 trillion dollar note appeared."}], "opp": {"lastTime": "Debtors holding real assets gained: industrialist Hugo Stinnes borrowed marks, built an empire of some 4,500 companies and repaid in near-worthless money, while savers lost. In Venezuela, people turned to US dollars, remittances and dollar stablecoins, and import shops called bodegones spread.", "ideas": [{"kind": "build", "title": "Independent price tracking", "line": "Independent price indexes and apps that track real prices when official inflation data is late or distrusted, as happened in Venezuela and Argentina."}, {"kind": "build", "title": "Safe remittance and savings channels", "line": "Low-cost, regulated ways for families in high-inflation countries to receive remittances and hold savings in stable currencies, with fraud protection."}, {"kind": "work", "title": "Inflation-aware finance and payroll staff", "line": "Accountants, payroll and treasury staff skilled in indexed contracts, multi-currency books and hyperinflation accounting for firms in unstable economies."}, {"kind": "learn", "title": "Monetary history and inflation accounting", "line": "How hyperinflations start and end, from the Rentenmark to dollarization, plus IAS 29, the accounting standard for hyperinflationary economies."}], "watch": "Watch for central banks funding governments directly, a widening gap between official and street exchange rates, and rising emigration."}}, {"id": "crash", "theme": "A speculative boom ends in a global crash", "rhyme": 3, "then": {"year": 1929, "short": "Wall St Crash", "title": "The Wall Street Crash", "where": "New York, USA", "region": "us", "hook": "Black Tuesday: the day Wall Street's Roaring Twenties boom collapsed into panic.", "text": "On Black Thursday, 24 October 1929, panic selling hit Wall Street. Over the next Monday and Tuesday the Dow fell about 23%, as a record 16 million shares changed hands on 29 October. By July 1932, the Dow had lost 89% of its 1929 peak."}, "now": {"year": 2008, "short": "Lehman Crash", "title": "The Global Financial Crisis", "where": "New York, USA", "region": "us", "hook": "September 2008: Lehman Brothers staff leaving their offices carrying cardboard boxes.", "text": "On 15 September 2008, Lehman Brothers filed for bankruptcy with $639 billion in assets, the largest in US history. Credit froze worldwide. Congress passed a $700 billion bank rescue, and governments from Britain to China spent heavily to stop a collapse."}, "followed": "The Great Depression followed. Thousands of banks failed, US unemployment reached about 25% in 1933, and economic misery helped extremist movements rise in Europe.", "next": {"short": "The Next Bust", "title": "A crash in machine-run markets", "text": "Around 2087, a crash might begin in assets that barely exist today, traded by AI systems in milliseconds. Panic could cross the globe before any human trader or central banker has time to react.", "watch": "Soaring debt, a new asset everyone says is different this time, and risk piling up in lightly regulated corners of finance."}, "breaks": "Governments in 2008 rescued banks and pumped in money within weeks, so the Great Recession, with US unemployment peaking at 10%, stayed far milder than the Depression.", "older": "The South Sea Bubble, 1720", "echoes": [{"year": 1345, "short": "Bardi & Peruzzi", "title": "Florence’s great banks collapse", "region": "europe", "line": "Florence’s Bardi and Peruzzi banks, with branches across Europe, had lent fortunes to warring kings; defaults helped topple both by 1346."}, {"year": 1720, "short": "South Sea Bubble", "title": "The South Sea Bubble bursts", "region": "europe", "line": "South Sea Company shares soared from £128 to £1,000 in 1720, then fell to £150 by September as Paris’s Mississippi bubble burst."}, {"year": 1857, "short": "Panic of 1857", "title": "The Panic of 1857", "region": "world", "line": "When a US railroad and land boom collapsed, panic spread to Britain and Europe in what is called the first worldwide crisis."}, {"year": 1873, "short": "Panic of 1873", "title": "The Panic of 1873", "region": "world", "line": "A railway and property boom burst on the Vienna stock exchange, spread to New York, and opened a long worldwide slump."}, {"year": 1987, "short": "Black Monday", "title": "Black Monday", "region": "us", "line": "After a five-year bull market, the Dow fell 22.6% on 19 October 1987, its worst day ever, as markets crashed worldwide."}, {"year": 1990, "short": "Japan’s Bubble", "title": "Japan’s asset bubble bursts", "region": "china", "line": "After a stock and property frenzy, Tokyo’s Nikkei peaked in December 1989 and lost about 60% by 1992, starting Japan’s “Lost Decade.”"}, {"year": 1997, "short": "Asian Crisis", "title": "The Asian financial crisis", "region": "world", "line": "Southeast Asia’s borrowing and property boom ended when Thailand’s baht collapsed, and panic spread to South Korea, Russia and Wall Street."}, {"year": 2000, "short": "Dot-com Bust", "title": "The dot-com bubble bursts", "region": "us", "line": "Investors poured money into internet startups until the Nasdaq peaked in March 2000, then it lost about 78% over two years."}], "opp": {"lastTime": "After 1929, new US securities laws required audited accounts, lifting demand for accountants, while 60 to 80 million Americans a week sought cheap escape at the movies. After 2008, the Dodd-Frank Act set off waves of hiring in bank compliance and risk.", "ideas": [{"kind": "build", "title": "Reporting tools for lightly regulated finance", "line": "Compliance and reporting software for private credit, crypto and AI-run trading, where new rules tend to land after a crash."}, {"kind": "build", "title": "Budgeting and debt repair services", "line": "Low-cost budgeting, debt counseling and repair-over-replace services, which tend to see demand rise as households cut back after a bust."}, {"kind": "work", "title": "Risk, audit and compliance roles", "line": "Auditors, compliance officers and risk analysts tend to be hired in waves after crashes, as new rules follow the losses."}, {"kind": "learn", "title": "Reading leverage and liquidity", "line": "How to read leverage, liquidity and funding risk in filings, the warning signs behind 1929 margin loans and 2008 mortgage debt."}], "watch": "Borrowed money piling into one hot asset, and regulators opening inquiries into private credit or AI-driven trading."}}, {"id": "tariffs", "theme": "Tariff walls rise and trading partners hit back", "rhyme": 2, "then": {"year": 1930, "short": "Smoot–Hawley", "title": "The Smoot–Hawley Tariff", "where": "Washington, DC, USA", "region": "us", "hook": "The tariff law often blamed for deepening the Great Depression.", "text": "President Herbert Hoover signed the Smoot–Hawley Tariff Act on 17 June 1930, raising duties on over 20,000 imported goods. More than 1,000 economists had urged him to veto it. Canada, France, Italy, Spain and others answered with tariffs of their own."}, "now": {"year": 2025, "short": "Liberation Day", "title": "Trump's “Liberation Day” Tariffs", "where": "Washington, DC, USA", "region": "us", "hook": "2 April 2025: Trump's Rose Garden chart of tariff rates, then plunging stock markets.", "text": "On 2 April 2025, President Donald Trump announced a 10% tariff on most imports and higher rates on dozens of countries. Supporters said it would revive American industry and counter unfair trade, while critics warned of higher prices. China retaliated, and US tariffs on Chinese goods briefly reached 145%."}, "followed": "As the Depression deepened, world trade shrank by about two-thirds between 1929 and 1934. In 1934 Congress let the president negotiate tariff cuts, paving the way for the GATT trade system in 1947.", "next": {"short": "Trade Blocs", "title": "A world split into trade blocs", "text": "Around 2120, a leading power might wall off its markets over AI, data or carbon, and rivals could answer in kind. The world might split into blocs that trade freely inside and little across.", "watch": "Rising tariffs and carbon border taxes, hardening trade blocs, and leaders promising that self-sufficiency will bring back jobs."}, "breaks": "Smoot–Hawley was a law passed by Congress as a depression began; the 2025 tariffs came by presidential emergency order, which the Supreme Court ruled unlawful in February 2026.", "older": "The Tariff of Abominations, 1828", "echoes": [{"year": -220, "short": "Bosporus Toll", "title": "Rhodes goes to war over Byzantium’s toll", "region": "europe", "line": "Byzantium taxed ships leaving the Black Sea; Rhodes, speaking for the merchants, declared war and forced the toll’s repeal."}, {"year": 1358, "short": "Hanse Embargo", "title": "The Hanseatic League embargoes Flanders", "region": "europe", "line": "When Flanders raised taxes on Hanseatic traders, the League embargoed it and nearly caused a famine until the count expanded their privileges."}, {"year": 1667, "short": "Colbert Tariff", "title": "Colbert's tariff war on the Dutch", "region": "europe", "line": "France's minister Colbert put steep duties on Dutch goods, the Dutch banned French wares, and the trade war fed France's 1672 invasion."}, {"year": 1828, "short": "Abominations", "title": "The Tariff of Abominations", "region": "us", "line": "Congress sharply raised import duties; Southern planters, fearing lost cotton sales to Britain, protested, and South Carolina later tried to nullify it."}, {"year": 1888, "short": "Italy vs France", "title": "The Franco-Italian tariff war", "region": "europe", "line": "Italy raised tariffs to protect its industry, France struck back with punitive duties, and trade between them halved for a decade."}, {"year": 1963, "short": "Chicken War", "title": "The Chicken War", "region": "europe", "line": "When Europe's Common Market taxed cheap American chicken, the US hit back with a 25% tariff on light trucks that still stands."}, {"year": 2002, "short": "Steel Tariffs", "title": "Bush’s steel tariffs meet EU threats", "region": "us", "line": "The US put tariffs of up to 30% on steel, the EU threatened $2.2 billion in retaliation, and Bush lifted them."}, {"year": 2018, "short": "Trade War 2018", "title": "The US–China trade war", "region": "china", "line": "The US taxed steel, aluminum and hundreds of billions in Chinese imports, and China hit back with tariffs on American farm goods."}], "opp": {"lastTime": "After 1930, Britain and its dominions turned to “imperial preference” trade deals at Ottawa in 1932. In the 2018 trade war, China shifted its soybean buying to Brazil, and in 2023 Mexico overtook China as the top source of US imports.", "ideas": [{"kind": "build", "title": "Tariff and origin tracking tools", "line": "Software that tracks tariff codes, rules of origin and duty refunds for small importers when rates change month to month."}, {"kind": "build", "title": "Supplier vetting in new hubs", "line": "Services that find and vet suppliers in places like Mexico, Vietnam or India as buyers shift away from tariffed partners."}, {"kind": "work", "title": "Customs brokers and trade compliance", "line": "Licensed customs brokers, trade compliance analysts and sourcing managers tend to be in demand whenever tariff rules shift often."}, {"kind": "learn", "title": "Rules of origin and HS codes", "line": "How Harmonized System codes, rules of origin and trade agreements decide what a product pays at the border, including new carbon border taxes."}], "watch": "Carbon border taxes like the EU's CBAM, new bloc-only trade deals, and firms moving production to allied or neighboring countries."}}, {"id": "bankrun", "theme": "Panicked depositors rush to pull their money", "rhyme": 2, "then": {"year": 1933, "short": "Bank Holiday", "title": "Roosevelt's Bank Holiday", "where": "United States", "region": "us", "hook": "Lines of desperate savers outside locked banks, and Roosevelt's calming Fireside Chat.", "text": "About 9,000 US banks failed between 1930 and 1933, and a new wave of runs swept the country that winter. On 6 March 1933, two days after taking office, Franklin D. Roosevelt closed every bank. In his first Fireside Chat he told Americans a reopened bank was safer than a mattress."}, "now": {"year": 2023, "short": "SVB Collapse", "title": "Silicon Valley Bank Collapses", "where": "Santa Clara, California, USA", "region": "us", "hook": "March 2023: founders racing to pull money as Silicon Valley Bank collapsed in two days.", "text": "On 9 March 2023, customers withdrew $42 billion from Silicon Valley Bank in a single day, as warnings spread through group chats and social media. Regulators closed the bank the next morning. Two days later, officials guaranteed all its deposits to stop the panic spreading."}, "followed": "In June 1933 Congress created federal deposit insurance through the new FDIC, which began covering deposits in January 1934. Mass bank runs then largely vanished from American life for generations.", "next": {"short": "Instant Run", "title": "A bank run at machine speed", "text": "Around 2113, a run might happen in minutes, as AI assistants managing millions of accounts react to the same rumor at once. Regulators could need automated brakes just to keep up.", "watch": "Money flowing into new kinds of digital accounts and currencies, and automated systems allowed to move savings without a human in the loop."}, "breaks": "In 1933 thousands of banks failed and ordinary savers lost money; in 2023 a few banks failed, mostly holding uninsured business deposits, and depositors were made whole.", "older": "The Panic of 1907", "echoes": [{"year": 1499, "short": "Venice Bank Run", "title": "Runs topple Venice’s biggest banks", "region": "europe", "line": "Amid war costs and rumours, depositors rushed Venice’s banks; the Garzoni failed, and three of four main banks collapsed by 1500."}, {"year": 1797, "short": "Bank Restriction", "title": "A run on the Bank of England", "region": "europe", "line": "After a French landing in Wales, depositors rushed for gold, and the government let the Bank of England stop paying it out."}, {"year": 1866, "short": "Overend Gurney", "title": "The Overend, Gurney collapse", "region": "europe", "line": "London's biggest discount bank failed, crowds besieged banks on “Black Friday”, and the Bank of England lent freely to stop the panic."}, {"year": 1907, "short": "Panic of 1907", "title": "The Panic of 1907", "region": "us", "line": "Depositors pulled $8 million from New York’s Knickerbocker Trust within three hours; J. P. Morgan rallied bankers to stop the runs."}, {"year": 1931, "short": "German Bank Run", "title": "Germany shuts its banks after Danatbank fails", "region": "europe", "line": "When Danatbank said it could not pay, panic spread and Germany declared a bank holiday, two years before Roosevelt’s."}, {"year": 2001, "short": "Corralito", "title": "Argentina freezes bank accounts", "region": "latam", "line": "As savers drained Argentina's banks, the government capped cash withdrawals in December 2001, sparking riots and a debt default."}, {"year": 2007, "short": "Northern Rock", "title": "The run on Northern Rock", "region": "europe", "line": "Savers queued outside Northern Rock branches after it sought emergency Bank of England help, Britain's first bank run in over a century."}, {"year": 2013, "short": "Cyprus Freeze", "title": "Cyprus shuts banks to stop a run", "region": "europe", "line": "To stop a run, Cyprus shut banks for 12 days, capped withdrawals and imposed losses on large deposits in its biggest banks."}], "opp": {"lastTime": "In the 1930s runs, savers moved cash to the government's Postal Savings System, whose deposits grew about eightfold to $1.2 billion by 1933. In the week after SVB failed in 2023, the 25 largest US banks gained about $120 billion in deposits.", "ideas": [{"kind": "build", "title": "Brakes for automated money agents", "line": "Safeguards that stop AI assistants and apps from moving savings all at once on a rumor, such as delays and human confirmation."}, {"kind": "work", "title": "Bank liquidity and treasury risk", "line": "Liquidity risk analysts and bank treasury staff, roles regulators pushed banks to strengthen after the fast failures of 2023."}, {"kind": "work", "title": "Financial crisis communications", "line": "Staff who track social media and explain things plainly to customers during a scare, as Roosevelt's Fireside Chat did in 1933."}, {"kind": "learn", "title": "How deposit protection works", "line": "How deposit insurance limits, bank liquidity rules and central bank emergency lending work, so you can judge where cash is protected."}], "watch": "Runs that spread through social media in hours, AI agents allowed to move deposits on their own, and debates over raising insured deposit limits."}}, {"id": "dust", "theme": "The sky goes dark over a strained land", "rhyme": 2, "then":
