 {"year": 1935, "short": "Black Sunday", "title": "The Black Sunday Dust Storm", "where": "Great Plains, USA", "region": "us", "hook": "The Dust Bowl's darkest day, when a black wall of dust swallowed the Plains.", "text": "On 14 April 1935, a towering wall of dust rolled across the southern Great Plains and turned a sunny afternoon pitch black. The storm carried an estimated 300,000 tons of topsoil. A reporter's story about it gave the region its name: the Dust Bowl."}, "now": {"year": 2023, "short": "Orange Sky", "title": "New York's Orange Sky", "where": "New York, USA", "region": "us", "hook": "June 2023: New York under an eerie orange sky, and masks back on outdoors.", "text": "Smoke from wildfires in Quebec drifted south, and on 7 June 2023 New York's sky turned orange. The city's air quality index passed 400, in the highest ‘hazardous’ category. Canada's season burned about 18 million hectares, by far its worst on record."}, "followed": "Within two weeks, Congress created the Soil Conservation Service to fight erosion. Drought and storms lasted until about 1940, and hundreds of thousands of people left the Plains, many heading to California.", "next": {"short": "Dark Skies", "title": "Smoke and dust darken whole continents", "text": "Around 2111, a long megadrought or fire season might cloud the sky over half a continent for weeks. Cities could open clean-air shelters as routinely as they open cooling centers today.", "watch": "Longer fire seasons, shrinking groundwater under farm regions, and more days each year when officials tell people to stay indoors."}, "breaks": "The Dust Bowl grew from local plowing that stripped the soil, while New York's smoke blew in from distant Canadian forests burning in heat and drought.", "older": "New England's Dark Day, 1780", "echoes": [{"year": -44, "short": "Caesar’s Dim Sun", "title": "The dim sun after Caesar’s murder", "region": "europe", "line": "Amid turmoil after Caesar’s murder, Romans described a darkened sun; eruptions of Etna and Alaska’s Okmok brought cold, failed harvests and famine."}, {"year": 536, "short": "Year 536", "title": "The mystery haze of 536", "region": "world", "line": "Volcanic haze dimmed the sun for about 18 months; Procopius said it shone like the moon, and crops failed across Eurasia."}, {"year": 1780, "short": "Dark Day", "title": "New England’s Dark Day", "region": "us", "line": "Smoke, likely from Canadian wildfires in a drought year, darkened New England at midday during the Revolutionary War; many feared Judgment Day."}, {"year": 1783, "short": "Laki Haze", "title": "The Laki haze over Europe", "region": "europe", "line": "Iceland's Laki eruption spread a sulfurous haze across Europe, and about a fifth of Icelanders died in the famine that followed."}, {"year": 1952, "short": "Great Smog", "title": "London's Great Smog", "region": "europe", "line": "Coal smoke and fog blacked out London for five days, killing thousands and pushing Parliament to pass the 1956 Clean Air Act."}, {"year": 1997, "short": "Asian Haze", "title": "The 1997 Southeast Asian haze", "region": "world", "line": "Land-clearing fires in drought-hit Indonesia smothered Southeast Asia in smoke, often cutting visibility in Sumatra and Borneo below 100 meters."}, {"year": 2009, "short": "Sydney Red Dust", "title": "Sydney’s red dust storm", "region": "world", "line": "Winds lifted topsoil from drought-stricken inland Australia and turned Sydney’s sky red in the biggest dust storm in about 70 years."}, {"year": 2020, "short": "SF Orange Sky", "title": "San Francisco's orange sky", "region": "us", "line": "Smoke from record wildfires amid heat and drought turned San Francisco's sky dark orange, with streetlights on at midday."}], "opp": {"lastTime": "After the Dust Bowl, the new Soil Conservation Service promoted contour plowing and terracing, and the Shelterbelt project planted about 220 million trees. When smoke hit New York in June 2023, air purifier searches jumped over 450% and some stores sold out.", "ideas": [{"kind": "build", "title": "Clean-air rooms for public buildings", "line": "Filtration upgrades and clean-air rooms for schools, clinics and care homes in regions where smoke seasons are getting longer."}, {"kind": "work", "title": "Soil, fire and air quality jobs", "line": "Soil conservationists, prescribed-burn crews and air quality forecasters, much as the 1930s created soil and forestry jobs across the Plains."}, {"kind": "work", "title": "Ventilation and filtration technicians", "line": "HVAC technicians and building engineers who can upgrade filtration, as smoke days make indoor air a public health concern."}, {"kind": "learn", "title": "Soil and groundwater care", "line": "Cover cropping, no-till farming and groundwater management, the modern versions of the contour plowing and shelterbelts that eased the Dust Bowl."}], "watch": "More smoke-advisory days each year, falling groundwater under farm regions, and cities funding clean-air shelters or school filter upgrades."}}, {"id": "munich", "theme": "Land seized in the name of ethnic kin", "rhyme": 1, "then": {"year": 1938, "short": "Munich Deal", "title": "The Munich Agreement", "where": "Munich, Germany", "region": "europe", "hook": "Neville Chamberlain waving a piece of paper and promising “peace for our time”.", "text": "On 30 September 1938, Britain, France and Italy agreed to let Nazi Germany annex Czechoslovakia's Sudetenland, home to three million ethnic Germans Hitler claimed to be protecting. The Czechoslovaks were not at the table, and Neville Chamberlain flew home promising peace."}, "now": {"year": 2014, "short": "Crimea Annexed", "title": "Russia Annexes Crimea", "where": "Crimea, Ukraine", "region": "europe", "hook": "March 2014: masked soldiers without insignia taking over Crimea, then Russia claiming it.", "text": "In late February 2014, Russian troops without insignia seized Crimea from Ukraine. After a 16 March referendum that Ukraine and Western governments rejected as illegal, Russia annexed the peninsula on 18 March, saying it was protecting Russian speakers. On 24 February 2022, Russia launched a full-scale invasion of Ukraine."}, "followed": "In March 1939 Hitler seized the rest of the Czech lands. He invaded Poland on 1 September 1939, and Britain and France declared war two days later.", "next": {"short": "Border Redrawn", "title": "A border redrawn for ethnic kin", "text": "Around 2090, a power might claim a neighbor's land to protect people who share its language or faith. Others could answer with deals, sanctions or force, and the old Munich debate might return.", "watch": "Passports handed to people across a border, claims that kin abroad are under threat, and troops massing near a frontier."}, "breaks": "Many scholars dispute the Munich analogy: no Western leader signed away Crimea, and the comparison has been invoked to argue for wars from Suez to Iraq.", "echoes": [{"year": 1500, "short": "Ivan III’s War", "title": "Ivan III seizes a third of Lithuania", "region": "russia", "line": "Citing persecution of Orthodox believers, Ivan III, “sovereign of all Rus,” warred on Lithuania and took about a third of its land."}, {"year": 1864, "short": "Schleswig War", "title": "Prussia and Austria seize Schleswig-Holstein", "region": "europe", "line": "Amid German nationalist calls to free German speakers from Danish rule, Prussia and Austria seized Schleswig, Holstein and Lauenburg from Denmark."}, {"year": 1919, "short": "Fiume Seized", "title": "D'Annunzio seizes Fiume", "region": "europe", "line": "Poet Gabriele D'Annunzio led armed volunteers into the Adriatic port, claiming it for its Italian majority; Italy annexed it in 1924."}, {"year": 1920, "short": "Vilnius Seized", "title": "Poland’s staged seizure of Vilnius", "region": "europe", "line": "Polish General Żeligowski staged a “mutiny” to take Lithuanian-claimed Vilnius, citing its Polish-speaking majority; Poland annexed the region in 1922."}, {"year": 1974, "short": "Cyprus Split", "title": "Turkish troops land in Cyprus", "region": "europe", "line": "After a Greek-backed coup, Turkey sent troops, saying it was protecting Turkish Cypriots, and took about a third of the island."}, {"year": 1991, "short": "Serb Krajina", "title": "Serb rebels seize a third of Croatia", "region": "europe", "line": "As Croatia left Yugoslavia, Yugoslav army-backed Serb rebels took about a third of it, saying they were protecting Croatia’s Serbs."}, {"year": 2008, "short": "Georgia War", "title": "The Russia–Georgia war", "region": "europe", "line": "Russia fought Georgia over South Ossetia, saying it was defending residents holding Russian passports, then recognized two breakaway regions as independent."}], "opp": {"lastTime": "After Munich, Britain sped up civil defense, and about 1.5 million Anderson air-raid shelters were up by September 1939. After 2022, Germany built its first LNG import terminal in under 200 days to replace Russian gas, and European defense budgets rose.", "ideas": [{"kind": "build", "title": "Backup supply for towns and firms", "line": "Services that help towns and firms reduce reliance on one risky supplier through local energy storage, alternate fuels and backup sourcing."}, {"kind": "work", "title": "Civil protection and emergency planning", "line": "Emergency planners, civil protection staff and infrastructure security specialists, as European states rebuild shelters, stockpiles and preparedness programs."}, {"kind": "work", "title": "Demining and reconstruction", "line": "Deminers, structural engineers and recovery planners could be needed for years, with Ukraine's recovery needs put at $588 billion in February 2026."}, {"kind": "learn", "title": "Open-source investigation skills", "line": "Verifying troop movements and official claims from public data, the skill used to test pretexts such as protecting threatened kin abroad."}], "watch": "European governments funding shelters, stockpiles and reservists, or a lasting ceasefire that shifts money and people toward rebuilding Ukraine."}}, {"id": "martians", "theme": "A fake that fools the public", "rhyme": 2, "then": {"year": 1938, "short": "War of Worlds", "title": "The War of the Worlds Broadcast", "where": "United States", "region": "us", "hook": "Orson Welles' radio play about invading Martians that supposedly sent America into a panic.", "text": "On 30 October 1938, Orson Welles staged H.G. Wells' novel on CBS radio as a string of fake news bulletins about Martians landing in New Jersey. Newspapers reported mass panic the next morning. Later research found few listeners actually panicked and the papers greatly exaggerated the scare."}, "now": {"year": 2023, "short": "Puffer Pope", "title": "Viral AI Deepfakes", "where": "Online, worldwide", "region": "world", "hook": "March 2023: the Pope in a stylish white puffer jacket, later revealed as AI-made.", "text": "In March 2023, an image of Pope Francis in a white puffer jacket, made with the AI tool Midjourney, fooled many people online. On 22 May, a fake picture of an explosion near the Pentagon spread from verified Twitter accounts, and US stocks briefly dipped before officials debunked it."}, "followed": "Welles apologized the next morning, and the FCC took no action against CBS. The fame helped him win a Hollywood contract with rare creative control, which led to Citizen Kane in 1941.", "next": {"short": "Live Deepfake", "title": "A fully faked live news event", "text": "Around 2108, a fake might be an entire live event, with video, voices and eyewitness posts all generated at once. It could move markets or spark unrest before anyone can check what really happened.", "watch": "Fakes that fool experts, markets reacting to unverified images, and fights over watermarks and who certifies what is real."}, "breaks": "Welles' drama was announced as fiction on a single network, while today's AI fakes often carry no label and can spread worldwide within minutes.", "older": "The Great Moon Hoax, 1835", "echoes": [{"year": 69, "short": "False Nero", "title": "A false Nero appears in Greece", "region": "europe", "line": "According to Tacitus, a lyre-playing lookalike claiming to be the dead emperor Nero gathered deserters in Greece until Roman soldiers killed him."}, {"year": 1165, "short": "Prester John", "title": "The letter of Prester John", "region": "europe", "line": "A forged letter from a mythical Christian king in Asia, “Prester John,” swept Europe; a pope wrote to him in 1177."}, {"year": 1440, "short": "Fake Donation", "title": "Valla exposes the Donation of Constantine", "region": "europe", "line": "Lorenzo Valla proved the Donation of Constantine, a decree popes had cited for centuries to back their worldly power, was a forgery."}, {"year": 1726, "short": "Rabbit Births", "title": "Mary Toft's rabbit births", "region": "europe", "line": "An English servant claimed to give birth to rabbits, and even a royal surgeon believed her until she confessed to the hoax."}, {"year": 1835, "short": "Moon Hoax", "title": "The Great Moon Hoax", "region": "us", "line": "The New York Sun reported that astronomer John Herschel had found bat-winged people on the Moon; the hoax went unexposed for weeks."}, {"year": 1869, "short": "Cardiff Giant", "title": "The Cardiff Giant", "region": "us", "line": "A “petrified man” dug up on a New York farm drew paying crowds, but it was a planted gypsum statue."}, {"year": 1912, "short": "Piltdown Man", "title": "The Piltdown Man forgery", "region": "europe", "line": "Fossils hailed as a missing link fooled experts for 41 years until tests showed a human skull paired with an orangutan jaw."}, {"year": 1917, "short": "Fairy Photos", "title": "The Cottingley Fairies", "region": "europe", "line": "Two English girls photographed paper cutout fairies, and Sherlock Holmes author Arthur Conan Doyle championed the pictures as real."}, {"year": 1934, "short": "Nessie Photo", "title": "The Loch Ness “surgeon’s photo”", "region": "europe", "line": "The Daily Mail’s photo of the Loch Ness Monster was believed for about 60 years, but it showed a toy submarine."}, {"year": 1957, "short": "Spaghetti Trees", "title": "The BBC's spaghetti harvest", "region": "europe", "line": "A straight-faced BBC report showed Swiss farmers picking spaghetti from trees on April Fools' Day, and viewers asked how to grow it."}, {"year": 1983, "short": "Hitler Diaries", "title": "The Hitler Diaries", "region": "europe", "line": "German magazine Stern paid millions for diaries said to be Hitler's, and within two weeks experts exposed them as modern forgeries."}], "opp": {"lastTime": "Hadley Cantril's 1940 study of the scare, The Invasion from Mars, became a classic of media research. The Hitler Diaries fell to police lab tests of paper, thread and ink, and after 2023 “Content Credentials” for tracing image origins spread to cameras and phones.", "ideas": [{"kind": "build", "title": "Provenance checks before money moves", "line": "Tools that check an image or video's origin before it moves markets or headlines, for newsrooms, trading desks and insurers."}, {"kind": "build", "title": "AI content labeling compliance", "line": "Services that help firms label AI-generated media to meet transparency rules such as those in the EU AI Act."}, {"kind": "work", "title": "Verification and digital forensics roles", "line": "Verification editors, trust and safety analysts and digital forensics examiners tend to be in demand once fakes start fooling experts."}, {"kind": "learn", "title": "Media forensics and provenance", "line": "How content credentials, watermarks and metadata work, and how to spot edits, much as document examiners learned to date paper and ink."}], "watch": "Markets or officials reacting to unverified media, and whether phones, cameras and platforms show content credentials by default."}}, {"id": "einstein", "theme": "Scientists warn about their own creation", "rhyme": 2, "then": {"year": 1939, "short": "Atomic Warning", "title": "The Einstein–Szilárd Letter", "where": "United States", "region": "us", "hook": "The letter in which Einstein warned President Roosevelt that atomic bombs were possible.", "text": "In a letter dated 2 August 1939, Albert Einstein warned President Franklin Roosevelt that uranium could power “extremely powerful bombs of a new type”, and hinted that Nazi Germany might be working on them. Physicist Leo Szilárd drafted it, and economist Alexander Sachs handed it to Roosevelt in October."}, "now": {"year": 2023, "short": "AI Warning", "title": "AI Leaders Warn of Extinction", "where": "Worldwide", "region": "world", "hook": "May 2023: headlines saying AI's own creators warned it could wipe out humanity.", "text": "On 30 May 2023, hundreds of AI scientists and executives, including Geoffrey Hinton, Sam Altman and Demis Hassabis, signed a one-sentence statement ranking AI extinction risk alongside pandemics and nuclear war. In November, 28 countries, including the US and China, signed the Bletchley Declaration at Britain's AI Safety Summit."}, "followed": "Roosevelt formed a uranium committee, the Manhattan Project began in 1942, and US atomic bombs destroyed Hiroshima and Nagasaki in 1945. Einstein later called signing the letter his “one great mistake”.", "next": {"short": "Next Warning", "title": "Inventors warn about a new creation", "text": "Around 2107, a warning might come from pioneers of a field barely born today, perhaps synthetic life or brain-computer links, urging leaders to act before their discovery outruns any control.", "watch": "Top researchers quitting to speak out, open letters from inventors about their own work, and summits devoted to a single technology."}, "breaks": "Einstein urged Roosevelt to speed up atomic research before Hitler got there first, while the AI signers urged caution about a technology many were still building.", "echoes": [{"year": 1508, "short": "Leonardo’s Dive", "title": "Leonardo keeps an underwater invention secret", "region": "europe", "line": "In his notebooks, Leonardo withheld his method of staying underwater “by reason of the evil nature of men,” who might sink ships."}, {"year": 1947, "short": "Doomsday Clock", "title": "Atomic scientists start the Doomsday Clock", "region": "us", "line": "Manhattan Project scientists launched the Doomsday Clock, set at seven minutes to midnight, to warn the world about nuclear war."}, {"year": 1955, "short": "Russell–Einstein", "title": "The Russell–Einstein Manifesto", "region": "world", "line": "Einstein and other leading scientists, with philosopher Bertrand Russell, warned that nuclear weapons could put an end to the human race."}, {"year": 1975, "short": "Asilomar", "title": "The Asilomar gene-splicing conference", "region": "us", "line": "Biologists who had just invented gene splicing paused their own experiments and met at Asilomar, California, to draft safety rules."}, {"year": 2012, "short": "Bird Flu Pause", "title": "Flu researchers pause risky bird flu work", "region": "world", "line": "After two labs made bird flu strains that spread between ferrets, 39 researchers paused such work so its risks could be debated."}, {"year": 2015, "short": "CRISPR Pause", "title": "Gene editors call for a pause", "region": "us", "line": "CRISPR pioneer Jennifer Doudna urged a pause on editing human embryos, and a Washington summit called heritable edits irresponsible for now."}], "opp": {"lastTime": "The 1939 warning led to the Manhattan Project, which employed nearly 130,000 people and left lasting national labs such as Los Alamos and Oak Ridge. After Asilomar, 1976 NIH rules required biosafety committees, and in 2023 Britain and the US set up AI safety institutes.", "ideas": [{"kind": "build", "title": "Independent AI testing services", "line": "Third-party labs that test AI models for dangerous capabilities before release, much as biosafety reviews became routine after Asilomar."}, {"kind": "build", "title": "DNA order screening tools", "line": "Screening that checks DNA synthesis orders for dangerous sequences, a safeguard that may grow as AI and biology tools combine."}, {"kind": "work", "title": "AI evaluation and governance roles", "line": "AI evaluation researchers, red-teamers and governance officers in labs, companies and government, a field that may grow as testing rules take effect."}, {"kind": "learn", "title": "Dual-use risk assessment", "line": "How to judge when useful research could also cause harm, a method shaped by nuclear arms control and Asilomar, now applied to AI."}], "watch": "Researchers leaving labs to speak out, governments requiring pre-release testing of AI models, and summits devoted to one technology."}}, {"id": "transistor", "theme": "A small lab invention that remakes the world", "rhyme": 2, "then": {"year": 1947, "short": "Transistor", "title": "The Transistor Is Born", "where": "Murray Hill, New Jersey, USA", "region": "us", "hook": "The tiny switch inside every computer, phone and gadget you have ever used.", "text": "In December 1947 at Bell Labs in New Jersey, John Bardeen and Walter Brattain built the first working transistor, a small device that could amplify and switch electric signals. Transistors would soon replace bulky vacuum tubes. With William Shockley, the pair won the 1956 Nobel Prize in Physics."}, "now": {"year": 2017, "short": "Transformer", "title": "The Transformer Paper", "where": "Mountain View, California, USA", "region": "us", "hook": "Late 2022: millions type their first question into ChatGPT, built on a 2017 Google idea.", "text": "In June 2017, eight Google researchers posted a paper called “Attention Is All You Need”, introducing a neural network design named the Transformer. It let AI learn from huge amounts of text far more efficiently. The “T” in ChatGPT stands for Transformer."}, "followed": "Transistors went into hearing aids and pocket radios in the 1950s, then onto integrated circuits. Intel's 4004 put a whole processor on one chip in 1971, and today's largest chips hold over 100 billion transistors.", "next": {"short": "The Next Leap", "title": "A quiet lab result remakes everything", "text": "Around 2087, the next leap might start as an obscure lab result, perhaps in quantum, optical or biological computing. Within a lifetime it could reshape work, war and daily life as the transistor did.", "watch": "Obscure papers that suddenly get copied by every lab, new materials for computing, and machines that keep getting cheaper at a startling pace."}, "breaks": "The transistor was hardware that took decades to reshape daily life, while the Transformer is software that reached hundreds of millions of people within a few years.", "older": "Gutenberg's printing press, about 1440", "echoes": [{"year": 105, "short": "Cai Lun’s Paper", "title": "Cai Lun improves papermaking", "region": "china", "line": "Cai Lun, head of the Han palace workshop, presented an improved papermaking method using bark, rags and fishnets; paper later spread worldwide."}, {"year": 1044, "short": "Gunpowder", "title": "China records the first gunpowder formulas", "region": "china", "line": "Chinese alchemists seeking an elixir of life likely stumbled on gunpowder; its first formulas date to 1044, and it remade warfare worldwide."}, {"year": 1440, "short": "Gutenberg Press", "title": "Gutenberg’s printing press", "region": "europe", "line": "Goldsmith Johannes Gutenberg developed a movable-type press; by 1500, presses in about 270 European cities had printed over 20 million copies."}, {"year": 1800, "short": "Volta’s Battery", "title": "Volta builds the first battery", "region": "europe", "line": "Alessandro Volta stacked zinc and silver discs with brine-soaked cloth to make the first battery, which opened the age of electricity."}, {"year": 1831, "short": "Faraday Dynamo", "title": "Faraday turns magnetism into electricity", "region": "europe", "line": "Michael Faraday showed in his London lab that moving magnets make electric current, the principle behind every power station generator."}, {"year": 1909, "short": "Haber Ammonia", "title": "Haber pulls fertilizer from the air", "region": "europe", "line": "Fritz Haber made ammonia from air on a tabletop machine; scaled up as Haber-Bosch, its fertilizer now helps feed billions."}, {"year": 1928, "short": "Penicillin", "title": "Fleming discovers penicillin", "region": "europe", "line": "Alexander Fleming noticed mold killing bacteria in a London lab dish, and mass-produced penicillin later launched the antibiotic age."}, {"year": 1938, "short": "Fission", "title": "The discovery of nuclear fission", "region": "europe", "line": "In a Berlin lab, Hahn and Strassmann split uranium atoms; within seven years, fission had produced nuclear reactors and atomic bombs."}, {"year": 1960, "short": "First Laser", "title": "Maiman builds the first laser", "region": "us", "line": "Theodore Maiman built the first laser, jokingly called “a solution looking for a problem”; lasers now carry internet data and scan barcodes."}, {"year": 1989, "short": "World Wide Web", "title": "Berners-Lee invents the Web", "region": "europe", "line": "At CERN, Tim Berners-Lee proposed a system of linked documents, and the World Wide Web he built now connects billions."}], "opp": {"lastTime": "The 1954 Regency TR-1 pocket radio brought transistors to shoppers, and Silicon Valley grew after eight engineers left Shockley's lab to found Fairchild Semiconductor in 1957. After the 1989 Web proposal, web designer became a common new job.", "ideas": [{"kind": "build", "title": "Small AI devices that run locally", "line": "Low-power devices that run AI models on board, such as hearing aids, translators and farm sensors, as transistors first spread through hearing aids."}, {"kind": "work", "title": "Chip plant and data center technicians", "line": "Fab technicians, electricians and cooling specialists for chip plants and data centers, the physical workforce the AI build-out tends to need."}, {"kind": "work", "title": "AI integration for small businesses", "line": "People who fit AI tools into the daily work of clinics, workshops and offices, as radio and TV technicians once serviced new electronics."}, {"kind": "learn", "title": "Adapting small open models", "line": "Fine-tuning and testing small open models for one field, the way 1950s engineers learned circuit design around a new component."}], "watch": "The cost of each AI task falling year after year, and whether one model design keeps spreading or a new one replaces it."}}, {"id": "mccarthy", "theme": "Careers ended over opinions and associations", "rhyme": 1, "then": {"year": 1950, "short": "McCarthyism", "title": "McCarthyism and the Blacklists", "where": "United States", "region": "us", "hook": "Senator McCarthy's lists, loyalty oaths, and Hollywood writers who suddenly could not find work.", "text": "In February 1950, Senator Joseph McCarthy claimed to hold a list of Communists working in the State Department. Federal workers faced loyalty reviews, the Hollywood Ten went to prison for contempt of Congress, and a pamphlet called Red Channels named 151 broadcasters and entertainers, many of whom lost work."}, "now": {"year": 2020, "short": "Online Pile-on", "title": "Online Pile-ons and Firings", "where": "Social media, USA", "region": "us", "hook": "2020: an old tweet resurfaces, the internet piles on, and someone loses their job.", "text": "Around 2020, online pile-ons got people fired over posts, jokes and old tweets, with pressure coming from left and right. Critics called it cancel culture, while supporters called it accountability. In January 2021, after the Capitol riot, major platforms suspended President Donald Trump."}, "followed": "After televised hearings in 1954, the Senate censured McCarthy, and his influence collapsed. Blacklists faded slowly: screenwriter Dalton Trumbo regained screen credit only in 1960, for Spartacus and Exodus.", "next": {"short": "Speech Scores", "title": "Speech judged by automated systems", "text": "Around 2090, automated systems might scan everything a person has ever said online, so one old remark could cost a job, a loan or a visa before any human reviews it.", "watch": "Employers and governments screening people's online histories, speech rules enforced by algorithms, and rising numbers of people afraid to voice opinions."}, "breaks": "McCarthyism targeted one suspected ideology using government power, while 2020-era pressure came from many directions, mostly through crowds, employers and private platforms.", "older": "The Spanish Inquisition, 1478", "echoes": [{"year": -399, "short": "Socrates Trial", "title": "The trial of Socrates", "region": "europe", "line": "Athens sentenced Socrates to death for impiety and corrupting the young, charges colored by his questioning and his ties to oligarch Critias."}, {"year": 166, "short": "Partisan Ban", "title": "Han eunuchs ban scholar-officials for life", "region": "china", "line": "Han eunuchs had scholar-officials and about 200 students, accused of forming a faction to criticize the court, barred from office for life."}, {"year": 833, "short": "The Mihna", "title": "The Abbasid Mihna tests officials’ beliefs", "region": "mideast", "line": "Caliph al-Ma’mun made judges and scholars affirm that the Quran was created; refusers lost posts or were jailed, among them Ibn Hanbal."}, {"year": 1104, "short": "Song Blacklist", "title": "Song China’s stone blacklist", "region": "china", "line": "Chancellor Cai Jing named 309 officials of a rival faction on a stone blacklist, copied across China, that sidelined them for years."}, {"year": 1478, "short": "Inquisition", "title": "Spain’s Inquisition is founded", "region": "europe", "line": "The Inquisition investigated converts suspected of secretly practicing Judaism, using anonymous denunciations, and barred the convicted and their descendants from office."}, {"year": 1633, "short": "Galileo Trial", "title": "The trial of Galileo", "region": "europe", "line": "The Inquisition convicted Galileo for teaching that Earth circles the Sun, banned his book and kept him under house arrest for life."}, {"year": 1919, "short": "Palmer Raids", "title": "The first Red Scare raids", "region": "us", "line": "In the first Red Scare, federal raids rounded up thousands of suspected radicals for their politics and deported hundreds, including Emma Goldman."}, {"year": 1957, "short": "Anti-Rightist", "title": "China’s Anti-Rightist Campaign", "region": "china", "line": "After Mao’s Hundred Flowers campaign invited criticism, over 550,000 people were branded “rightists” and many lost jobs or were sent to camps."}, {"year": 1972, "short": "Radicals Decree", "title": "West Germany’s Radicals Decree", "region": "europe", "line": "West Germany checked about 3.5 million people for public jobs; 1,250 were refused posts and 265 dismissed over alleged extremist ties."}, {"year": 2003, "short": "Dixie Chicks", "title": "The Dixie Chicks boycott", "region": "us", "line": "After singer Natalie Maines criticized President George W. Bush before the Iraq War, country radio stations across America stopped playing the band."}], "opp": {"lastTime": "The 1919 Palmer Raids prompted the founding of the ACLU in 1920. Blacklisted writers like Dalton Trumbo kept working under fronts and pen names, winning Oscars for Roman Holiday and The Brave One, and in 2022 the campus group FIRE widened its work nationwide.", "ideas": [{"kind": "build", "title": "Fair process before discipline", "line": "HR and legal services that give staff a documented, fair review before discipline over speech, rather than decisions made under online pressure."}, {"kind": "build", "title": "Context for resurfaced posts", "line": "Tools that show the date and full context of resurfaced posts, so employers and audiences can judge old remarks fairly."}, {"kind": "work", "title": "Employment and free-speech law", "line": "Employment lawyers, ombudspeople and workplace investigators, roles that tend to grow when firings over opinions lead to disputes and lawsuits."}, {"kind": "learn", "title": "Speech rights and digital footprints", "line": "What laws protect off-duty speech where you live, and how employer and visa social media screening works."}], "watch": "Job, visa or loan decisions based on automated scans of online history, and new laws that protect or restrict off-duty speech."}}, {"id": "suez", "theme": "A blocked sea route sends ships around Africa", "rhyme": 2, "then": {"year": 1956, "short": "Suez Crisis", "title": "The Suez Crisis", "where": "Suez Canal, Egypt", "region": "mideast", "hook": "The 1956 fight over the Suez Canal that humbled Britain and France.", "text": "After Egypt's President Gamal Abdel Nasser nationalized the Suez Canal Company in July 1956, Israel, Britain and France attacked in late October. Egypt sank dozens of ships to block the canal, which stayed closed until April 1957. Oil tankers had to sail around Africa's Cape of Good Hope."}, "now": {"year": 2024, "short": "Red Sea Crisis", "title": "Houthi Attacks in the Red Sea", "where": "Red Sea, off Yemen", "region": "mideast", "hook": "Early 2024: container ships turning away from the Red Sea to sail around Africa.", "text": "From November 2023, Yemen's Houthi movement attacked ships in the Red Sea with missiles and drones, saying it acted in support of Palestinians in Gaza. Through 2024, most large container lines avoided the Suez route, sailing around the Cape of Good Hope and adding one to two weeks."}, "followed": "Under heavy pressure from the US and the Soviet Union, the invaders withdrew. The UN deployed its first peacekeeping force, and British Prime Minister Anthony Eden resigned in January 1957.", "next": {"short": "Choke Point", "title": "Another chokepoint closes to shipping", "text": "Around 2092, a narrow sea lane such as the Strait of Malacca or a new Arctic route might be shut by war or swarms of drones. Ships could detour for weeks, pushing up prices worldwide.", "watch": "Cheap missiles and drones in the hands of small armed groups, insurers pulling out of key waterways, and navies escorting merchant ships."}, "breaks": "In 1956 states fought over who controlled the canal, while in 2024 a Yemeni armed movement attacked ships far to the south, and the canal itself stayed open.", "echoes": [{"year": 1498, "short": "Cape Route", "title": "Vasco da Gama sails around Africa", "region": "world", "line": "To bypass Venice and Egypt’s hold on the Red Sea spice route, Portugal’s Vasco da Gama sailed around Africa and reached India."}, {"year": 1940, "short": "Cape Route 1940", "title": "Italy’s war entry closes the Mediterranean", "region": "europe", "line": "After Italy entered the war, most Allied shipping to the Middle East was diverted around the Cape of Good Hope until 1943."}, {"year": 1967, "short": "Canal Shut", "title": "The Suez Canal closes for eight years", "region": "mideast", "line": "The Six-Day War closed the Suez Canal until 1975, trapping a fleet of cargo ships and sending tankers around Africa."}, {"year": 2021, "short": "Ever Given", "title": "The Ever Given blocks Suez", "region": "mideast", "line": "The giant container ship Ever Given wedged across the Suez Canal for six days, and some ships detoured around Africa instead."}], "opp": {"lastTime": "After the 1956 closure, owners ordered tankers too big for the canal, many from Japanese yards, which made the Cape route pay. In 2024, Asia-Europe container rates more than tripled and Red Sea war-risk insurance premiums rose about tenfold.", "ideas": [{"kind": "build", "title": "Detour and delay planning tools", "line": "Tools that model detours, delays and insurance costs so smaller importers can plan around a blocked chokepoint."}, {"kind": "build", "title": "Overland routes around chokepoints", "line": "Rail, road and pipeline links that bypass sea chokepoints, like Egypt's SUMED oil pipeline, planned after the canal's 1967 closure."}, {"kind": "work", "title": "Supply chain risk and maritime security", "line": "Supply chain risk analysts, freight planners and maritime security staff, roles that tend to be needed when a sea lane closes."}, {"kind": "learn", "title": "Chokepoints and shipping economics", "line": "How sea chokepoints, freight rates, transit times and marine insurance connect, so you can read a shipping shock early."}], "watch": "War-risk premiums for key straits, navies escorting merchant ships, and big container lines announcing a return to or exit from a route."}}, {"id": "sputnik", "theme": "A rival's breakthrough jolts America into a race", "rhyme": 2, "then": {"year": 1957, "short": "Sputnik", "title": "Sputnik Shocks America", "where": "Baikonur, Soviet Union", "region": "russia", "hook": "The beeping Soviet satellite that convinced Americans they were losing the space race.", "text": "On 4 October 1957, the Soviet Union launched Sputnik 1, the first artificial satellite, an 84-kilogram metal ball that circled Earth every 96 minutes. Radio stations and amateurs around the world picked up its beeps. Many Americans feared their country had fallen behind in science and missiles."}, "now": {"year": 2025, "short": "DeepSeek", "title": "DeepSeek's “Sputnik Moment”", "where": "Hangzhou, China", "region": "china", "hook": "January 2025: a Chinese AI app called DeepSeek topping charts and rattling Wall Street.", "text": "On 20 January 2025, Chinese startup DeepSeek released R1, a free AI model that rivaled leading American systems and, the company said, cost far less to train. Investor Marc Andreessen called it “AI's Sputnik moment”. On 27 January, Nvidia lost about $590 billion in market value, a one-day record."}, "followed": "The US founded NASA in 1958 and poured money into science teaching through the National Defense Education Act. The space race peaked with Americans walking on the Moon in July 1969.", "next": {"short": "Next Sputnik", "title": "A rival's leap sparks a race", "text": "Around 2093, a rival might suddenly leap ahead in a technology seen as decisive, perhaps fusion power or quantum computing. The shock could set off a new national race in labs, schools and budgets.", "watch": "Surprise breakthroughs from unexpected labs, sharp drops in tech stocks, and governments launching crash programs in science and education."}, "breaks": "Sputnik was a state project that beat America to a world first, while DeepSeek, a private startup, caught up with existing US models at lower reported cost.", "echoes": [{"year": -260, "short": "Rome’s Navy", "title": "Rome races to build a navy", "region": "europe", "line": "According to Polybius, Rome, a land power outmatched at sea by Carthage, copied a stranded Carthaginian warship and built 120 warships."}, {"year": 1949, "short": "Soviet A-Bomb", "title": "The Soviets test an atomic bomb", "region": "russia", "line": "The Soviet Union tested its first atomic bomb years before US experts expected, and Truman ordered a crash hydrogen bomb program."}, {"year": 1961, "short": "Gagarin Orbits", "title": "Gagarin becomes the first human in space", "region": "russia", "line": "Yuri Gagarin’s orbit beat America into space, and six weeks later Kennedy asked Congress to land a man on the Moon."}, {"year": 1987, "short": "Japan's Chips", "title": "Japan's chip lead alarms America", "region": "world", "line": "Japanese firms had overtaken America in memory chips, so Washington backed the new SEMATECH consortium with federal money to catch up."}, {"year": 2010, "short": "Tianhe-1A", "title": "China builds the world’s fastest computer", "region": "china", "line": "China’s Tianhe-1A topped the world supercomputer ranking, and Obama called rivals’ advances “our generation’s Sputnik moment,” urging new research spending."}, {"year": 2021, "short": "Hypersonic Test", "title": "China’s reported hypersonic test alarms Washington", "region": "china", "line": "A reported Chinese hypersonic glide vehicle circled the globe, and the top US general called it “very close” to a Sputnik moment."}], "opp": {"lastTime": "After Sputnik, the US created NASA and ARPA in 1958, and the National Defense Education Act funded student loans and math, science and language teaching. US college enrollment roughly doubled in the 1960s, and Apollo employed about 400,000 people.", "ideas": [{"kind": "build", "title": "Math, science and AI teaching tools", "line": "Courses and classroom tools for math, science and AI basics, the kind of education push the 1958 act funded."}, {"kind": "work", "title": "Researchers in national tech programs", "line": "Engineers, researchers and technicians in government-funded AI, chip and energy programs, which tend to expand quickly after a rival's surprise."}, {"kind": "work", "title": "Math and science teachers", "line": "Math, science and computing teachers, as governments tend to fund teacher training and scholarships after a technology scare."}, {"kind": "learn", "title": "Doing more with less compute", "line": "Methods for training and running AI models with less computing power, the approach that let DeepSeek compete at lower reported cost."}], "watch": "New crash programs or education acts for AI, chips or fusion, and surprise model releases from unexpected labs."}}, {"id": "springs", "theme": "One voice wakes an environmental movement", "rhyme": 2, "then": {"year": 1962, "short": "Silent Spring", "title": "Rachel Carson’s Silent Spring", "where": "United States", "region": "us", "hook": "The book that warned pesticides like DDT were silencing birds and poisoning the food chain.", "text": "Biologist Rachel Carson published Silent Spring in September 1962, documenting how DDT and other pesticides harmed wildlife and could threaten people. The chemical industry attacked her, but the book became a bestseller and President Kennedy ordered a scientific review of pesticides."}, "now": {"year": 2018, "short": "School Strike", "title": "Greta Thunberg’s School Strike", "where": "Stockholm, Sweden", "region": "europe", "hook": "The Friday climate strikes: a lone Swedish teenager’s sign, then millions of students marching.", "text": "In August 2018, 15-year-old Greta Thunberg began skipping school to sit outside Sweden’s parliament with a sign reading “School strike for climate”. Students worldwide copied her as Fridays for Future. On 20 September 2019, organizers counted about 4 million strikers."}, "followed": "Public pressure grew fast. About 20 million Americans joined the first Earth Day in 1970, the Environmental Protection Agency opened that year, and the US banned DDT for farm use in 1972.", "next": {"short": "A New Wake-Up", "title": "A new voice for a new threat", "text": "Around 2074, a single voice might again rally millions, perhaps over microplastics in human bodies, failing oceans or a geoengineering project, spreading through media we cannot yet picture.", "watch": "Rising alarm over microplastics, ocean acidification or solar geoengineering, and young activists organizing across borders around one simple act."}, "breaks": "DDT could be banned by national laws within a decade, while cutting greenhouse gases requires every major economy to change how it makes energy.", "echoes": [{"year": 1485, "short": "Bishnoi Rules", "title": "Guru Jambheshwar founds the Bishnoi community", "region": "india", "line": "In Rajasthan, Guru Jambheshwar founded the Bishnoi community, whose 29 rules forbid felling green trees and killing animals; followers still protect wildlife."}, {"year": 1892, "short": "John Muir", "title": "John Muir founds the Sierra Club", "region": "us", "line": "Naturalist John Muir’s writings rallied Americans to save wild places; he co-founded the Sierra Club and inspired the national parks movement."}, {"year": 1977, "short": "Green Belt", "title": "Wangari Maathai’s Green Belt Movement", "region": "africa", "line": "Kenyan scientist Wangari Maathai got rural women planting trees, growing a movement that planted tens of millions and earned her a Nobel."}, {"year": 1978, "short": "Love Canal", "title": "Lois Gibbs and Love Canal", "region": "us", "line": "Homemaker Lois Gibbs organized neighbors over toxic waste buried under their Niagara Falls neighborhood, forcing evacuations and helping inspire the Superfund law."}, {"year": 1988, "short": "Chico Mendes", "title": "Chico Mendes defends the Amazon", "region": "latam", "line": "Rubber tapper Chico Mendes fought ranchers clearing the Amazon; his 1988 murder made world headlines and led Brazil to create forest reserves."}, {"year": 2006, "short": "Al Gore’s Film", "title": "Al Gore’s An Inconvenient Truth", "region": "us", "line": "Al Gore’s climate slideshow became a hit film that alarmed millions about global warming; he shared the 2007 Nobel Peace Prize."}], "opp": {"lastTime": "The 1970 National Environmental Policy Act required environmental impact statements for major federal projects, fueling an environmental consulting industry, and Clean Air Act rules put catalytic converters on most new US cars from 1975. Environmental law became a field of its own.", "ideas": [{"kind": "build", "title": "Testing for microplastics and PFAS", "line": "Affordable testing and filtration for microplastics and “forever chemicals” in water, food and homes may see demand as alarm and legal limits grow."}, {"kind": "build", "title": "Product passports and supply data", "line": "Software that records a product’s materials, chemicals and emissions for buyers and regulators, as EU digital product passports phase in over coming years."}, {"kind": "work", "title": "Environmental compliance and cleanup", "line": "Like the consultants who multiplied after NEPA, PFAS remediation engineers, environmental health scientists and compliance staff may grow as chemical rules tighten."}, {"kind": "learn", "title": "Toxicology and chemical regulation", "line": "How pollutants like PFAS and microplastics move through bodies and ecosystems, and how EU and US rules measure and limit them."}], "watch": "New legal limits on PFAS or microplastics, and youth-led campaigns turning into laws, would signal rising demand; rollbacks of rules would signal the reverse."}}, {"id": "protests", "theme": "Protests ripple across the globe at once", "rhyme": 2, "then": {"year": 1968, "short": "1968 Protests", "title": "The global protest wave of 1968", "where": "Worldwide", "region": "world", "hook": "Barricades in Paris, Soviet tanks in Prague: the year the whole world seemed to boil over.", "text": "In May 1968, French students built barricades and about 10 million workers went on strike. Americans protested the Vietnam War, and riots followed Martin Luther King’s assassination. Soviet-led troops crushed the Prague Spring, and Mexican troops fired on students at Tlatelolco."}, "now": {"year": 2020, "short": "George Floyd", "title": "The George Floyd protests", "where": "Minneapolis, then worldwide", "region": "us", "hook": "June 2020: masked crowds kneeling in the streets in the middle of a pandemic.", "text": "A Minneapolis police officer killed George Floyd on 25 May 2020, kneeling on his neck for over nine minutes. Video of his death sparked protests in all 50 states and dozens of countries. Polls suggested 15 to 26 million Americans took part."}, "followed": "Elections swung toward order. Richard Nixon won the US presidency promising “law and order”, de Gaulle’s party won a landslide in June, and Prague’s reforms were rolled back under Soviet pressure.", "next": {"short": "Next Wave", "title": "Global protests sparked within hours", "text": "Around 2072, one video or one killing might again set off protests in dozens of countries within days, organized on networks that do not yet exist.", "watch": "Large generations of young people with blocked prospects, a shared grievance that crosses borders, and new ways to spread images instantly."}, "breaks": "The 1968 revolts had many separate causes, from Vietnam to Soviet rule, while the 2020 protests shared one focus: policing and racial injustice.", "older": "The Revolutions of 1848", "echoes": [{"year": 1378, "short": "Europe’s Revolts", "title": "Revolts sweep Europe’s cities, 1378–1382", "region": "europe", "line": "From Florence’s Ciompi to Ghent, England’s Peasants’ Revolt, Rouen and Paris, revolts against taxes and elites swept Europe in 1378–1382."}, {"year": 1848, "short": "1848 Revolutions", "title": "The Revolutions of 1848", "region": "europe", "line": "Revolutions spread from Paris to Vienna, Berlin, Milan and Budapest within weeks, as crowds demanded constitutions, voting rights and national freedom."}, {"year": 1919, "short": "1919 Protests", "title": "The anticolonial protests of 1919", "region": "world", "line": "Hopes raised by Wilson’s talk of self-determination fed near-simultaneous protests in Korea, Egypt, India and China during the Paris peace talks."}, {"year": 1989, "short": "1989 Revolutions", "title": "The revolutions of 1989 in Eastern Europe", "region": "europe", "line": "Protests and strikes swept Eastern Europe, toppling communist governments from Poland to Romania within months and bringing down the Berlin Wall."}, {"year": 2003, "short": "Iraq War Protest", "title": "The global Iraq war protests", "region": "world", "line": "On one day, millions marched against the coming Iraq war in about 600 cities, from Rome and London to Sydney."}, {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring and Occupy protests", "region": "world", "line": "Uprisings spread from Tunisia across the Arab world, and Occupy protest camps soon appeared in hundreds of cities worldwide."}, {"year": 2025, "short": "Gen Z Protests", "title": "The Gen Z protest wave", "region": "world", "line": "Youth-led protests spread from Indonesia and Nepal to Madagascar, Morocco and Peru, many under a One Piece anime flag, toppling two governments."}], "opp": {"lastTime": "After 1968, France’s Grenelle agreements raised the minimum wage 35%, and US universities opened Black and ethnic studies departments, such as San Francisco State’s College of Ethnic Studies in 1969. The 1968 Safe Streets Act funneled federal money into police training and equipment.", "ideas": [{"kind": "build", "title": "Verifying viral protest footage", "line": "Tools that help newsrooms, courts and platforms verify the time, place and authenticity of protest videos could see demand as AI fakes spread."}, {"kind": "build", "title": "Civic trackers for local reform", "line": "Tools that let residents track police budgets, council votes and reform pledges, helping street protest turn into lasting local policy."}, {"kind": "work", "title": "Crisis responders and mediators", "line": "Civilian crisis responders, police oversight investigators and community mediators may grow as cities test alternatives to armed response after protest waves."}, {"kind": "learn", "title": "Open-source investigation", "line": "Geolocating and verifying photos and videos, a skill newsrooms and human-rights groups use to document protests and crackdowns accurately."}], "watch": "Cities funding and publishing results for civilian crisis teams, and courts or platforms adopting content provenance standards, would show these areas opening."}}, {"id": "oil", "theme": "Energy supply turned into a weapon", "rhyme": 3, "then": {"year": 1973, "short": "Oil Crisis", "title": "The 1973 oil crisis", "where": "Middle East and the West", "region": "world", "hook": "Empty highways on car-free Sundays and long lines at gas stations.", "text": "In October 1973, during the Yom Kippur War, Arab oil producers cut output and embargoed the United States and the Netherlands for supporting Israel. Oil prices roughly quadrupled within months. Several European countries banned Sunday driving."}, "now": {"year": 2022, "short": "Gas Crisis", "title": "Europe’s 2022 energy crisis", "where": "Europe", "region": "europe", "hook": "Autumn 2022: thermostats turned down, shop windows dimmed, and dread opening the energy bill.", "text": "After invading Ukraine, Russia cut pipeline gas to Europe and halted Nord Stream 1 in September 2022. Wholesale gas prices rose to more than ten times pre-crisis levels. Governments capped bills, and EU countries agreed to cut gas use by 15%."}, "followed": "Years of stagflation followed. Rich nations founded the International Energy Agency in 1974, built emergency oil stocks, and turned to smaller cars, nuclear power and new oil from the North Sea and Alaska.", "next": {"short": "Metal Squeeze", "title": "A squeeze on battery metals", "text": "Around 2071, the choke point might be lithium, cobalt or rare earths for batteries and motors, with a dominant supplier cutting exports to win a political fight.", "watch": "Export controls on critical minerals, refining concentrated in one or two countries, and power grids leaning on a single foreign source."}, "breaks": "In 2022 Europe also chose to cut its own Russian imports, and it replaced much of the lost gas with shipped liquefied gas within about a year.", "older": "The Suez Crisis, 1956", "echoes": [{"year": 1941, "short": "Japan Embargo", "title": "The US oil embargo on Japan", "region": "china", "line": "The US halted oil exports to Japan, which imported most of its oil from America, pushing Tokyo toward war."}, {"year": 1956, "short": "Suez Crisis", "title": "The Suez Crisis", "region": "mideast", "line": "During the Suez war, Egypt blocked the canal and Saudi Arabia embargoed Britain and France, bringing petrol rationing to Britain."}, {"year": 1967, "short": "1967 Embargo", "title": "The 1967 Arab oil embargo", "region": "mideast", "line": "After the Six-Day War, Arab producers cut oil to the US, Britain and West Germany, but extra US output blunted the embargo."}, {"year": 2009, "short": "Gas Cutoff 2009", "title": "The 2009 Russia-Ukraine gas cutoff", "region": "europe", "line": "Russia cut gas to Ukraine in a price dispute, and transit stopped for two weeks, leaving parts of Europe cold in midwinter."}, {"year": 2026, "short": "Hormuz Closed", "title": "Iran closes the Strait of Hormuz", "region": "mideast", "line": "In retaliation for US and Israeli strikes, Iran effectively closed the Strait of Hormuz, through which a fifth of world oil passes."}], "opp": {"lastTime": "After 1973, fuel-efficient Japanese cars won over US buyers, France’s 1974 Messmer plan began building dozens of nuclear reactors, and Brazil launched its Proálcool ethanol program in 1975. The US set its first car fuel economy standards the same year.", "ideas": [{"kind": "build", "title": "Battery and magnet metal recycling", "line": "Recovering lithium, nickel, cobalt and rare earths from old batteries and magnets could gain value as supply chokepoints and export controls tighten."}, {"kind": "build", "title": "Home efficiency and heat pumps", "line": "Insulation, heat pumps and smart controls that cut household fuel use, echoing the 1970s efficiency push, may stay in demand while energy prices swing."}, {"kind": "work", "title": "Efficiency and critical-mineral specialists", "line": "Energy auditors, heat pump installers and mineral processing engineers may be needed as countries reduce reliance on any single energy or metals supplier."}, {"kind": "learn", "title": "Supply chain chokepoint mapping", "line": "Tracing where critical minerals are mined, refined and processed, and how export controls and stockpiles work, a skill procurement and policy teams increasingly need."}], "watch": "New export controls on critical minerals, national stockpile programs and refineries opening outside today’s dominant suppliers would signal this opportunity widening."}}, {"id": "saigon", "theme": "A superpower’s chaotic final exit", "rhyme": 3, "then": {"year": 1975, "short": "Fall of Saigon", "title": "The Fall of Saigon", "where": "Saigon, South Vietnam", "region": "china", "hook": "Helicopters lifting people off a Saigon rooftop as the Vietnam War ended.", "text": "On 30 April 1975, North Vietnamese tanks broke through the gates of the presidential palace and South Vietnam surrendered. In the final hours, US helicopters flew about 7,000 Americans and Vietnamese out of the city in Operation Frequent Wind."}, "now": {"year": 2021, "short": "Fall of Kabul", "title": "The Fall of Kabul", "where": "Kabul, Afghanistan", "region": "india", "hook": "August 2021: crowds running alongside a US military plane on Kabul airport’s runway.", "text": "The Taliban entered Kabul on 15 August 2021 as US troops were withdrawing, and President Ashraf Ghani fled. A chaotic airlift flew out more than 120,000 people. A suicide bombing at an airport gate killed about 170 Afghans and 13 US troops."}, "followed": "Vietnam was formally reunified under communist rule in 1976. Cambodia and Laos also fell to communist forces in 1975, and hundreds of thousands of “boat people” fled Vietnam by sea.", "next": {"short": "Last Flights", "title": "Another great power’s rushed last flight", "text": "Around 2067, a major power might again fly its last people out of a capital after a long intervention, with the scramble broadcast live from drones and phones.", "watch": "Long foreign deployments losing support at home, fixed withdrawal deadlines, and local armies that depend on outside air power and contractors."}, "breaks": "US combat troops had left Vietnam two years before Saigon fell to a conventional army, while Kabul fell to an insurgency before the US withdrawal was finished.", "older": "The British retreat from Kabul, 1842", "echoes": [{"year": -413, "short": "Sicily Retreat", "title": "Athens’ doomed retreat from Sicily", "region": "europe", "line": "After failing to take Syracuse, some 40,000 Athenians, allies and camp followers fled overland; nearly all were killed or captured."}, {"year": 1291, "short": "Fall of Acre", "title": "Crusaders flee the fall of Acre", "region": "mideast", "line": "Mamluks stormed Acre, the crusader kingdom’s capital; in a chaotic flight to the ships, the rich paid fortunes for passage."}, {"year": 1368, "short": "Yuan Flees", "title": "The last Yuan emperor flees Beijing", "region": "china", "line": "As Ming armies neared, the last Yuan emperor abandoned Dadu, today’s Beijing, and fled north, ending Mongol rule over China."}, {"year": 1842, "short": "Kabul 1842", "title": "The British retreat from Kabul", "region": "india", "line": "About 4,500 British and Indian troops and 12,000 civilians left Kabul in winter under a truce; almost all were killed or captured."}, {"year": 1947, "short": "Partition", "title": "Britain’s rushed exit from India", "region": "india", "line": "Britain moved India’s independence up by ten months; partition into India and Pakistan uprooted over 10 million people amid mass killings."}, {"year": 1962, "short": "Algeria 1962", "title": "France’s exit from Algeria", "region": "africa", "line": "After an eight-year war, France left Algeria; some 800,000 settlers fled within months, and many Algerians who served France were killed."}, {"year": 1984, "short": "Beirut Exit", "title": "US Marines leave Beirut", "region": "mideast", "line": "As the Lebanese army it backed collapsed, the US pulled its Marines out of Beirut, months after a bombing killed 241 servicemen."}], "opp": {"lastTime": "In 1975 about 130,000 Vietnamese evacuees reached the US, where resettlement agencies, sponsors and caseworkers were in sudden demand; the 1980 Refugee Act made that system permanent. Refugee entrepreneurs built Little Saigon in California’s Orange County.", "ideas": [{"kind": "build", "title": "Credential recognition for refugees", "line": "Services that verify and translate refugees’ diplomas, licenses and work histories could help newcomers rejoin skilled work faster after sudden evacuations."}, {"kind": "build", "title": "Verified records for local staff", "line": "Secure digital records of local employees’ service with foreign forces or aid groups could speed visa cases, a recurring bottleneck in rushed withdrawals."}, {"kind": "work", "title": "Resettlement caseworkers and interpreters", "line": "Resettlement caseworkers, immigration lawyers and community interpreters may stay in demand, since each rushed withdrawal has produced years of displacement."}, {"kind": "learn", "title": "Evacuation and duty-of-care planning", "line": "Evacuation planning and duty-of-care for staff abroad, useful for aid groups, firms and agencies working in fragile states that depend on foreign troops."}], "watch": "Fixed withdrawal deadlines for foreign forces and growing visa backlogs for local staff would signal rising need for evacuation and resettlement work."}}, {"id": "volcker", "theme": "Crushing inflation with sharply higher rates", "rhyme": 3, "then": {"year": 1980, "short": "Volcker Shock", "title": "The Volcker shock", "where": "United States", "region": "us", "hook": "Interest rates near 20% and a Fed chair set on breaking inflation, whatever the cost.", "text": "Fed chair Paul Volcker pushed short-term interest rates to about 20% in 1980 to break inflation that peaked near 15%. Angry home builders mailed him pieces of lumber. Two recessions followed, and unemployment hit 10.8% in 1982."}, "now": {"year": 2022, "short": "Rate Hikes", "title": "The great rate hikes of 2022", "where": "Worldwide", "region": "world", "hook": "2022: grocery prices jumping every week and mortgage rates doubling within a year.", "text": "With US inflation at 9.1% in June 2022, the Federal Reserve raised rates from near zero to over 4% by December, including four three-quarter-point hikes in a row. The European Central Bank and Bank of England also raised rates quickly."}, "followed": "US inflation fell to about 3% by 1983 and stayed lower for decades. Mexico said in 1982 it could not pay its debts, starting a Latin American debt crisis.", "next": {"short": "Next Squeeze", "title": "Another painful fight against inflation", "text": "Around 2064, a central bank might again choose between tolerating inflation driven by debt, aging or climate costs and causing a recession to stop it.", "watch": "Government debt growing faster than economies, political pressure on central banks to keep rates low, and inflation stuck above target for years."}, "breaks": "Volcker’s rates neared 20% and came with deep recessions, while the 2022 hikes topped out near 5.5% and inflation eased without a 1980s-style slump.", "older": "The Fed’s post-war rate hikes, 1920", "echoes": [{"year": 1920, "short": "Fed Hikes 1920", "title": "The Fed’s post-war rate hikes", "region": "us", "line": "To stop post-World War I inflation, the Fed raised its discount rate to 7%; prices fell sharply and a severe recession followed."}, {"year": 1989, "short": "Lawson Hikes", "title": "Britain doubles rates to 15%", "region": "europe", "line": "To cool a boom and rising inflation, Nigel Lawson doubled UK interest rates from 7.5% to 15%; a recession followed in 1990."}, {"year": 2023, "short": "Turkey 2023", "title": "Turkey’s steep rate hikes", "region": "europe", "line": "After cutting rates as inflation soared past 80%, Turkey’s central bank raised them from 8.5% to 50% in under a year."}, {"year": 2024, "short": "Russia 21%", "title": "Russia raises rates to a record 21%", "region": "russia", "line": "As wartime spending fueled inflation, Russia’s central bank raised its key rate from 7.5% to a record 21% within 16 months."}], "opp": {"lastTime": "As rates rose toward 20%, savers moved cash into money market funds, which grew from about $4 billion in 1977 to $185 billion in 1981. The 1989 Brady Plan then turned Latin America’s bad bank loans into tradable bonds, helping create an emerging-market debt market.", "ideas": [{"kind": "build", "title": "Refinancing help for cheap-era debt", "line": "Services helping households and small firms refinance or restructure loans taken at near-zero rates may be needed as that cheap debt comes due."}, {"kind": "build", "title": "Cash management for small firms", "line": "Tools that help small businesses manage cash, interest costs and payment timing, which matter far more when money is no longer nearly free."}, {"kind": "work", "title": "Credit risk and insolvency roles", "line": "Credit analysts, insolvency practitioners and debt counselors tend to be in demand when debt taken on cheaply must be refinanced at higher rates."}, {"kind": "learn", "title": "Interest rate risk basics", "line": "Bond duration and interest rate risk, the blind spot that sank many 1980s savings and loan lenders and some US banks in 2023."}], "watch": "Inflation stuck above central bank targets, rising defaults as cheap loans reset, and political pressure on central banks would signal this pattern returning."}}, {"id": "chernobyl", "theme": "A nuclear disaster shakes faith in atomic power", "rhyme": 3, "then": {"year": 1986, "short": "Chernobyl", "title": "The Chernobyl disaster", "where": "Chernobyl, Soviet Ukraine", "region": "russia", "hook": "A Soviet reactor explodes, and Sweden detects the radiation before Moscow admits anything.", "text": "On 26 April 1986, reactor No. 4 at Chernobyl exploded during a safety test. About 49,000 people in nearby Pripyat were evacuated the next day. Thirty-one people died in the short term, and fallout spread across Europe."}, "now": {"year": 2011, "short": "Fukushima", "title": "The Fukushima nuclear disaster", "where": "Fukushima, Japan", "region": "china", "hook": "March 2011: a tsunami sweeping over Japan, then TV footage of reactor buildings exploding.", "text": "On 11 March 2011, a magnitude 9.0 earthquake sent a tsunami about 14 meters high over the Fukushima Daiichi plant. Three reactors melted down and more than 150,000 people were evacuated. Germany soon decided to close all its nuclear plants."}, "followed": "The disaster pushed Mikhail Gorbachev toward more openness, or glasnost, and slowed nuclear building worldwide. Gorbachev later called Chernobyl perhaps the real cause of the Soviet collapse.", "next": {"short": "Next Meltdown", "title": "Nuclear fears return with new reactors", "text": "Around 2036, a serious accident could strike a reactor caught in a war zone or one of the new small reactors built to power data centers.", "watch": "Reactors on front lines like Zaporizhzhia, old plants run past their design life, and a rush to build small reactors quickly."}, "breaks": "Chernobyl was caused by a flawed reactor and a botched test inside a secretive state, while Fukushima was triggered by a tsunami that overwhelmed its defenses.", "older": "Three Mile Island, 1979", "echoes": [{"year": 1957, "short": "Windscale Fire", "title": "The Windscale reactor fire", "region": "europe", "line": "Britain’s worst nuclear accident spread radioactive iodine; milk was dumped, and Macmillan censored the report to protect public confidence in nuclear power."}, {"year": 1979, "short": "Three Mile", "title": "The Three Mile Island accident", "region": "us", "line": "A Pennsylvania reactor partly melted down; no one died, but public fear soared and many Americans turned against nuclear power."}, {"year": 1999, "short": "Tokaimura", "title": "Japan’s Tokaimura nuclear accident", "region": "china", "line": "Workers mixing uranium in steel buckets set off a chain reaction that killed two, shaking Japanese trust in the nuclear industry."}], "opp": {"lastTime": "After Chernobyl, IAEA safety advisers coined the term “safety culture”, and plant operators founded the World Association of Nuclear Operators in 1989 to run peer reviews. Italy voted to quit nuclear power in 1987 and turned to imported gas and electricity.", "ideas": [{"kind": "build", "title": "Public radiation monitoring networks", "line": "Low-cost public radiation sensor networks, like the volunteer ones that grew after Fukushima, could matter as reactors age or sit near front lines."}, {"kind": "build", "title": "Reactor decommissioning and waste robotics", "line": "Robots and services for dismantling old reactors and handling waste may see steady demand as plants built in the 1970s and 1980s retire."}, {"kind": "work", "title": "Nuclear safety and licensing staff", "line": "Reactor operators, safety inspectors and licensing specialists may be scarce as small reactor projects multiply and regulators face pressure to approve faster."}, {"kind": "learn", "title": "Safety culture and risk analysis", "line": "Probabilistic risk assessment and human-factors engineering, core lessons from both disasters, transfer to small reactors and other safety-critical systems."}], "watch": "Fast-tracked licensing for small reactors, shortages of trained inspectors, or fighting near nuclear plants would show where safety work is most needed."}}, {"id": "tiananmen", "theme": "Mass protests over political freedoms under Beijing", "rhyme": 2, "then": {"year": 1989, "short": "Tiananmen", "title": "The Tiananmen Square protests", "where": "Beijing, China", "region": "china", "hook": "A lone man standing in front of a column of tanks in Beijing.", "text": "After reformer Hu Yaobang died in April 1989, students occupied Beijing’s Tiananmen Square for seven weeks, calling for political reform and press freedom. On the night of 3-4 June, troops cleared the area by force. The government put the death toll near 300; other estimates are far higher."}, "now": {"year": 2019, "short": "Hong Kong 2019", "title": "The Hong Kong protests", "where": "Hong Kong", "region": "china", "hook": "Summer 2019: Hong Kong streets filled with black-clad marchers holding umbrellas against tear gas.", "text": "Protests began in June 2019 against a bill allowing extradition to mainland China. Organizers said about 2 million marched on 16 June; police gave lower figures. The bill was withdrawn in October, and in 2020 Beijing enacted a national security law for the city."}, "followed": "Beijing said the crackdown ensured stability, while Western governments imposed sanctions, including an EU arms embargo. Deng Xiaoping relaunched market reforms in 1992, and the events remain censored in mainland China.", "next": {"short": "Centenary 2049", "title": "New protest tools meet new controls", "text": "Around 2049, the 100th anniversary of the People’s Republic, a generation raised online might find new ways to press demands, and authorities new ways to respond.", "watch": "The approach of 2047, when Hong Kong’s 50-year “one country, two systems” guarantee ends, and job prospects for young graduates."}, "breaks": "Hong Kong kept its own laws and police under “one country, two systems”, and its protests wound down amid arrests, pandemic rules and a new security law, without the army.", "older": "The May Fourth Movement, 1919", "echoes": [{"year": 166, "short": "Partisan Purge", "title": "Han China purges its student critics", "region": "china", "line": "When Imperial Academy students backed officials denouncing palace eunuchs, Emperor Huan arrested some 200 and banned the critics from office for life."}, {"year": 1126, "short": "Chen Dong 1126", "title": "Song students besiege the palace gate", "region": "china", "line": "Imperial University students led crowds to Kaifeng’s palace gate demanding a sacked minister back; the court yielded, but later executed their leader."}, {"year": 1919, "short": "May Fourth", "title": "The May Fourth Movement", "region": "china", "line": "Beijing students protested the Versailles deal giving Shandong to Japan, sparking a movement for democracy and science that 1989 protesters invoked."}, {"year": 1976, "short": "April Fifth", "title": "The 1976 Tiananmen Incident", "region": "china", "line": "Crowds mourning Premier Zhou Enlai filled Tiananmen Square with wreaths and poems criticizing radical leaders, until police and militia cleared them."}, {"year": 1978, "short": "Democracy Wall", "title": "Beijing’s Democracy Wall movement", "region": "china", "line": "Crowds read posters on a Beijing wall calling democracy the “Fifth Modernization,” until a 1979 crackdown jailed Wei Jingsheng for 15 years."}, {"year": 2003, "short": "HK March 2003", "title": "Half a million march in Hong Kong", "region": "china", "line": "About 500,000 people marched against a national security bill they feared would curb free speech, and the government shelved it."}, {"year": 2014, "short": "Umbrella 2014", "title": "Hong Kong’s Umbrella Movement", "region": "china", "line": "Protesters occupied main Hong Kong streets for 79 days, demanding open elections for the city’s leader and shielding themselves with umbrellas."}, {"year": 2022, "short": "Blank Paper", "title": "China’s blank paper protests", "region": "china", "line": "After a deadly Urumqi fire, crowds in Shanghai, Beijing and other cities protested COVID lockdowns, holding blank paper to signal censored speech."}], "opp": {"lastTime": "Hong Kong emigration averaged about 55,000 people a year from 1988 to 1994, bringing skills and capital to Vancouver, Toronto and Sydney. On the mainland, Deng Xiaoping’s 1992 southern tour set off a surge of foreign investment and factory building around Shenzhen.", "ideas": [{"kind": "build", "title": "Relocation help for professionals", "line": "Services that help relocating families move pensions, qualifications and small businesses abroad, a need seen in Hong Kong’s 1990s and 2020s emigration waves."}, {"kind": "build", "title": "Preserving records and community archives", "line": "Tools that preserve news, records and community archives against deletion, since protest histories in this pattern are often censored or erased."}, {"kind": "work", "title": "Digital safety trainers", "line": "Digital security trainers for journalists, researchers and diaspora groups may be needed as concern grows over surveillance and transnational repression."}, {"kind": "learn", "title": "China and Hong Kong legal literacy", "line": "Understanding China’s national security, data and exit-ban rules helps firms, journalists and researchers work safely with or in China and Hong Kong."}], "watch": "Emigration figures from Hong Kong, new visa routes for its residents and debate over 2047 would signal shifting demand for relocation and legal help."}}, {"id": "netscape", "theme": "A new technology reaches everyone at once", "rhyme": 3, "then": {"year": 1994, "short": "Netscape", "title": "The Netscape Navigator browser", "where": "Mountain View, California", "region": "us", "hook": "The browser that took millions of people onto the World Wide Web for the first time.", "text": "Released in December 1994 by a startup co-founded by Marc Andreessen, Netscape Navigator made the web easy for ordinary people to browse. Within months it was the most-used browser in the world."}, "now": {"year": 2022, "short": "ChatGPT", "title": "The launch of ChatGPT", "where": "San Francisco, California", "region": "us", "hook": "December 2022: everyone sharing screenshots of a chatbot writing poems, essays and computer code.", "text": "OpenAI released ChatGPT on 30 November 2022 as a free research preview. It passed 1 million users in five days and an estimated 100 million in about two months, the fastest growth yet seen for a consumer app."}, "followed": "Netscape’s 1995 stock debut helped set off the dot-com boom. Microsoft bundled Internet Explorer with Windows, won the “browser war” and faced a US antitrust case, and AOL bought Netscape in 1999.", "next": {"short": "Next Leap", "title": "The next technology everyone adopts overnight", "text": "Around 2050, another tool might reach hundreds of millions within weeks, perhaps brain-computer interfaces or household robots, setting off its own boom, bust and fight over who controls it.", "watch": "Lab demos that suddenly become cheap consumer products, user records broken in days, and investors rushing into a single new category."}, "breaks": "The web Netscape opened ran on open, shared standards, while the leading AI models cost vast sums to build and are controlled by a handful of firms.", "echoes": [{"year": 1455, "short": "Printing Press", "title": "Gutenberg’s printing press spreads across Europe", "region": "europe", "line": "After Gutenberg’s Bible of the 1450s, presses spread to over 200 European towns by 1500, turning out millions of books."}, {"year": 1839, "short": "Daguerreotype", "title": "France gives photography free to the world", "region": "europe", "line": "France bought Daguerre’s process and gave it free to the world; by 1853 Americans made an estimated three million daguerreotypes a year."}, {"year": 1900, "short": "Kodak Brownie", "title": "Kodak’s $1 Brownie camera", "region": "us", "line": "Kodak’s $1 Brownie shipped over 150,000 cameras in its first year, bringing snapshot photography to ordinary people."}, {"year": 1920, "short": "Radio Boom", "title": "The first radio broadcasting boom", "region": "us", "line": "Pittsburgh’s KDKA began regular commercial broadcasts, setting off a craze that put radio sets in millions of homes within five years."}, {"year": 1948, "short": "TV Boom", "title": "Television sweeps into American homes", "region": "us", "line": "The share of US homes with a television jumped from 1 percent in 1948 to 75 percent in 1955."}, {"year": 2007, "short": "iPhone", "title": "The launch of the iPhone", "region": "us", "line": "Apple’s iPhone put the web, music and phone in one touchscreen device; within a decade, billions of people carried smartphones."}], "opp": {"lastTime": "After Netscape, “webmaster” and web designer became common jobs, online shops and search engines multiplied, and in 1998 the US raised the H-1B visa cap from 65,000 to 115,000 as tech firms sought programmers. App stores set off a similar developer rush after 2008.", "ideas": [{"kind": "build", "title": "Making small firms AI-ready", "line": "Services that organize small firms’ documents, data and workflows so AI tools can use them, as web agencies once built firms’ first websites."}, {"kind": "build", "title": "Visibility in AI answers", "line": "Services helping organizations appear accurately in AI assistant answers could grow, much as search engine optimization grew out of the late-1990s web."}, {"kind": "work", "title": "AI integration and evaluation roles", "line": "Roles that fit AI into everyday work, such as integration engineers and model evaluation specialists, may grow the way webmaster jobs did after 1995."}, {"kind": "learn", "title": "Competition rules for AI platforms", "line": "Antitrust and interoperability rules for AI platforms, as regulators revisit browser-war questions about bundling, defaults and access for smaller rivals."}], "watch": "Falling prices per AI task, small firms hiring for AI roles, and antitrust cases over bundled AI assistants would show where openings are forming."}}, {"id": "dolly", "theme": "Science crosses a line in making life", "rhyme": 2, "then": {"year": 1996, "short": "Dolly", "title": "Dolly the cloned sheep", "where": "Roslin, Scotland", "region": "europe", "hook": "A Scottish sheep named Dolly that made the world ask whether humans would be cloned next.", "text": "Born at the Roslin Institute in July 1996 and unveiled in February 1997, Dolly was the first mammal cloned from an adult cell. She was the only lamb from 277 attempts, and her birth set off a global debate about human cloning."}, "now": {"year": 2018, "short": "CRISPR Babies", "title": "The first gene-edited babies", "where": "Shenzhen, China", "region": "china", "hook": "November 2018: a Chinese scientist announcing on YouTube that gene-edited twin girls had been born.", "text": "Scientist He Jiankui said he had used CRISPR to edit the CCR5 gene in twin girls’ embryos, aiming to make them resistant to HIV. Scientists worldwide condemned the work. In 2019 a Chinese court sentenced him to three years in prison."}, "followed": "Dozens of countries banned human reproductive cloning, and the UN adopted a non-binding declaration against it in 2005. In 2006, Japan’s Shin
