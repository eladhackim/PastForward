tium taxed ships leaving the Black Sea; Rhodes, speaking for the merchants, declared war and forced the toll’s repeal."}, {"year": 1358, "short": "Hanse Embargo", "title": "The Hanseatic League embargoes Flanders", "region": "europe", "line": "When Flanders raised taxes on Hanseatic traders, the League embargoed it and nearly caused a famine until the count expanded their privileges."}, {"year": 1667, "short": "Colbert Tariff", "title": "Colbert's tariff war on the Dutch", "region": "europe", "line": "France's minister Colbert put steep duties on Dutch goods, the Dutch banned French wares, and the trade war fed France's 1672 invasion."}, {"year": 1828, "short": "Abominations", "title": "The Tariff of Abominations", "region": "us", "line": "Congress sharply raised import duties; Southern planters, fearing lost cotton sales to Britain, protested, and South Carolina later tried to nullify it."}, {"year": 1888, "short": "Italy vs France", "title": "The Franco-Italian tariff war", "region": "europe", "line": "Italy raised tariffs to protect its industry, France struck back with punitive duties, and trade between them halved for a decade."}, {"year": 1963, "short": "Chicken War", "title": "The Chicken War", "region": "europe", "line": "When Europe's Common Market taxed cheap American chicken, the US hit back with a 25% tariff on light trucks that still stands."}, {"year": 2002, "short": "Steel Tariffs", "title": "Bush’s steel tariffs meet EU threats", "region": "us", "line": "The US put tariffs of up to 30% on steel, the EU threatened $2.2 billion in retaliation, and Bush lifted them."}, {"year": 2018, "short": "Trade War 2018", "title": "The US–China trade war", "region": "china", "line": "The US taxed steel, aluminum and hundreds of billions in Chinese imports, and China hit back with tariffs on American farm goods."}], "opp": {"lastTime": "After 1930, Britain and its dominions turned to “imperial preference” trade deals at Ottawa in 1932. In the 2018 trade war, China shifted its soybean buying to Brazil, and in 2023 Mexico overtook China as the top source of US imports.", "ideas": [{"kind": "build", "title": "Tariff and origin tracking tools", "line": "Software that tracks tariff codes, rules of origin and duty refunds for small importers when rates change month to month.", "guide": {"what": "Software that helps importers find the right tariff code for each product, track duty rates as they change, check rules of origin and claim refunds they may be owed.", "why": "After 1930, partners hit back and trade shifted to deals like Ottawa in 1932. US rates changed often in 2025, and in February 2026 the Supreme Court ruled the emergency tariffs unlawful. Small importers may struggle to keep up.", "how": ["Interview five small importers about how they look up codes and track rate changes.", "Practise classifying ten products using the US HTS search or the EU TARIC database.", "Prototype an alert that flags when the duty on a saved product code changes."], "read": [{"title": "USITC Harmonized Tariff Schedule search", "url": "https://hts.usitc.gov/"}, {"title": "EU Customs Tariff (TARIC)", "url": "https://taxation-customs.ec.europa.eu/online-services/online-services-and-databases-customs/eu-customs-tariff-taric_en"}]}}, {"kind": "build", "title": "Supplier vetting in new hubs", "line": "Services that find and vet suppliers in places like Mexico, Vietnam or India as buyers shift away from tariffed partners.", "guide": {"what": "A service that finds, visits and checks factories in countries such as Mexico, Vietnam or India, so buyers moving away from tariffed suppliers know who is reliable.", "why": "After the 2018 trade war, China shifted soybean buying to Brazil, and in 2023 Mexico overtook China as the top source of US imports. If trade blocs harden, more buyers may need trusted suppliers in new places.", "how": ["Use ITC Trade Map to see which countries are growing exports of one product you know.", "Talk to two buyers who moved sourcing recently about what went wrong at first.", "Draft a factory checklist covering quality, labor practices, ownership and origin paperwork."], "read": [{"title": "ITC Trade Map", "url": "https://www.trademap.org/"}, {"title": "WTO Tariff and Trade Data", "url": "https://ttd.wto.org/en"}]}}, {"kind": "work", "title": "Customs brokers and trade compliance", "line": "Licensed customs brokers, trade compliance analysts and sourcing managers tend to be in demand whenever tariff rules shift often.", "guide": {"what": "Customs brokers file import paperwork and pay duties for clients. Trade compliance analysts check that goods are classified, valued and marked for origin correctly, so firms avoid fines and delays.", "why": "In 1930, duties rose on over 20,000 goods and partners answered with their own. When rates and rules shift often, as in 2025, importers may lean harder on licensed brokers and compliance staff.", "how": ["Ask a local customs broker or freight forwarder what an entry-level role involves.", "Find out how your country licenses customs brokers; in the US it requires passing a CBP exam.", "Study Harmonized System classification basics using the WCO's free overview."], "read": [{"title": "National Customs Brokers and Forwarders Association of America", "url": "https://www.ncbfaa.org/"}, {"title": "WCO: What is the Harmonized System (HS)?", "url": "https://www.wcoomd.org/en/topics/nomenclature/overview/what-is-the-harmonized-system.aspx"}]}}, {"kind": "learn", "title": "Rules of origin and HS codes", "line": "How Harmonized System codes, rules of origin and trade agreements decide what a product pays at the border, including new carbon border taxes.", "guide": {"what": "The Harmonized System is a six-digit product code used by over 200 countries. Rules of origin decide which country a product legally comes from, and so which tariff it pays.", "why": "As tariffs rose, firms moved production to places like Mexico and Vietnam, partly to change origin. The EU's carbon border levy, CBAM, entered its definitive phase in January 2026. Origin rules may matter more as blocs harden.", "how": ["Read the WCO's short overview of the Harmonized System.", "Classify five household items to six digits, then check your answers in HTS or TARIC.", "Read one trade agreement's origin chapter, such as the USMCA rules for cars."], "read": [{"title": "WCO: What is the Harmonized System (HS)?", "url": "https://www.wcoomd.org/en/topics/nomenclature/overview/what-is-the-harmonized-system.aspx"}, {"title": "European Commission: Carbon Border Adjustment Mechanism", "url": "https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism_en"}]}}], "watch": "Carbon border taxes like the EU's CBAM, new bloc-only trade deals, and firms moving production to allied or neighboring countries."}}, {"id": "bankrun", "theme": "Panicked depositors rush to pull their money", "rhyme": 2, "then": {"year": 1933, "short": "Bank Holiday", "title": "Roosevelt's Bank Holiday", "where": "United States", "region": "us", "hook": "Lines of desperate savers outside locked banks, and Roosevelt's calming Fireside Chat.", "text": "About 9,000 US banks failed between 1930 and 1933, and a new wave of runs swept the country that winter. On 6 March 1933, two days after taking office, Franklin D. Roosevelt closed every bank. In his first Fireside Chat he told Americans a reopened bank was safer than a mattress."}, "now": {"year": 2023, "short": "SVB Collapse", "title": "Silicon Valley Bank Collapses", "where": "Santa Clara, California, USA", "region": "us", "hook": "March 2023: founders racing to pull money as Silicon Valley Bank collapsed in two days.", "text": "On 9 March 2023, customers withdrew $42 billion from Silicon Valley Bank in a single day, as warnings spread through group chats and social media. Regulators closed the bank the next morning. Two days later, officials guaranteed all its deposits to stop the panic spreading."}, "followed": "In June 1933 Congress created federal deposit insurance through the new FDIC, which began covering deposits in January 1934. Mass bank runs then largely vanished from American life for generations.", "next": {"short": "Instant Run", "title": "A bank run at machine speed", "text": "Around 2113, a run might happen in minutes, as AI assistants managing millions of accounts react to the same rumor at once. Regulators could need automated brakes just to keep up.", "watch": "Money flowing into new kinds of digital accounts and currencies, and automated systems allowed to move savings without a human in the loop."}, "breaks": "In 1933 thousands of banks failed and ordinary savers lost money; in 2023 a few banks failed, mostly holding uninsured business deposits, and depositors were made whole.", "older": "The Panic of 1907", "topic": "money", "echoes": [{"year": 1499, "short": "Venice Bank Run", "title": "Runs topple Venice’s biggest banks", "region": "europe", "line": "Amid war costs and rumours, depositors rushed Venice’s banks; the Garzoni failed, and three of four main banks collapsed by 1500."}, {"year": 1797, "short": "Bank Restriction", "title": "A run on the Bank of England", "region": "europe", "line": "After a French landing in Wales, depositors rushed for gold, and the government let the Bank of England stop paying it out."}, {"year": 1866, "short": "Overend Gurney", "title": "The Overend, Gurney collapse", "region": "europe", "line": "London's biggest discount bank failed, crowds besieged banks on “Black Friday”, and the Bank of England lent freely to stop the panic."}, {"year": 1907, "short": "Panic of 1907", "title": "The Panic of 1907", "region": "us", "line": "Depositors pulled $8 million from New York’s Knickerbocker Trust within three hours; J. P. Morgan rallied bankers to stop the runs."}, {"year": 1931, "short": "German Bank Run", "title": "Germany shuts its banks after Danatbank fails", "region": "europe", "line": "When Danatbank said it could not pay, panic spread and Germany declared a bank holiday, two years before Roosevelt’s."}, {"year": 2001, "short": "Corralito", "title": "Argentina freezes bank accounts", "region": "latam", "line": "As savers drained Argentina's banks, the government capped cash withdrawals in December 2001, sparking riots and a debt default."}, {"year": 2007, "short": "Northern Rock", "title": "The run on Northern Rock", "region": "europe", "line": "Savers queued outside Northern Rock branches after it sought emergency Bank of England help, Britain's first bank run in over a century."}, {"year": 2013, "short": "Cyprus Freeze", "title": "Cyprus shuts banks to stop a run", "region": "europe", "line": "To stop a run, Cyprus shut banks for 12 days, capped withdrawals and imposed losses on large deposits in its biggest banks."}], "opp": {"lastTime": "In the 1930s runs, savers moved cash to the government's Postal Savings System, whose deposits grew about eightfold to $1.2 billion by 1933. In the week after SVB failed in 2023, the 25 largest US banks gained about $120 billion in deposits.", "ideas": [{"kind": "build", "title": "Brakes for automated money agents", "line": "Safeguards that stop AI assistants and apps from moving savings all at once on a rumor, such as delays and human confirmation.", "guide": {"what": "Safety features that slow or pause large money moves made by apps or AI assistants, such as waiting periods, transfer limits and asking a human to confirm.", "why": "In 2023, SVB customers pulled $42 billion in one day as warnings spread online. If AI agents manage savings and react to one rumor, runs could be faster still. Regulators such as the FSB have flagged this herd risk.", "how": ["Read the Financial Stability Board's 2024 report on AI and financial stability.", "Ask a fintech product manager how their app limits or delays large transfers today.", "Sketch rules for when an agent must pause and ask a person before moving savings."], "read": [{"title": "FSB: The Financial Stability Implications of Artificial Intelligence (2024)", "url": "https://www.fsb.org/2024/11/the-financial-stability-implications-of-artificial-intelligence/"}, {"title": "NIST AI Risk Management Framework", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}]}}, {"kind": "work", "title": "Bank liquidity and treasury risk", "line": "Liquidity risk analysts and bank treasury staff, roles regulators pushed banks to strengthen after the fast failures of 2023.", "guide": {"what": "Teams inside banks that make sure there is enough cash and easy-to-sell assets to pay depositors, even on a bad day. Roles include liquidity risk analyst and treasury analyst.", "why": "SVB failed within two days in 2023, and the Federal Reserve's review blamed basic failures to manage interest rate and liquidity risk. Regulators have since pushed banks to prepare for faster runs, which may keep these skills in demand.", "how": ["Read the Federal Reserve's April 2023 review of what went wrong at SVB.", "Learn how the Basel liquidity coverage ratio works and calculate a simple example.", "Ask a bank treasury analyst which tools and data they use each day."], "read": [{"title": "Federal Reserve: Review of the Supervision and Regulation of Silicon Valley Bank (2023)", "url": "https://www.federalreserve.gov/publications/files/svb-review-20230428.pdf"}, {"title": "Basel Committee: The Liquidity Coverage Ratio and liquidity risk monitoring tools", "url": "https://www.bis.org/publications/201301-standards-basel-iii-liquidity-coverage-ratio-and-liquidity-risk-monitoring-tools"}]}}, {"kind": "work", "title": "Financial crisis communications", "line": "Staff who track social media and explain things plainly to customers during a scare, as Roosevelt's Fireside Chat did in 1933.", "guide": {"what": "People who watch what customers and media are saying during a scare and explain the facts quickly and plainly, through statements, FAQs, calls and social media.", "why": "In March 1933, Roosevelt's first Fireside Chat helped calm savers before banks reopened. In 2023, fear about SVB spread through group chats within hours. Banks and regulators may need staff who can respond at that speed.", "how": ["Read Roosevelt's March 1933 Fireside Chat on banking and note how simply he explains it.", "Study how SVB's 8 March 2023 announcement of a loss and share sale sparked panic.", "Practise writing a calm 100-word customer message for an imagined bank scare."], "read": [{"title": "WHO: Risk communication and community engagement", "url": "https://www.who.int/emergencies/risk-communications"}]}}, {"kind": "learn", "title": "How deposit protection works", "line": "How deposit insurance limits, bank liquidity rules and central bank emergency lending work, so you can judge where cash is protected.", "guide": {"what": "Deposit insurance repays savers up to a limit if a bank fails, such as $250,000 per depositor per bank in the US and €100,000 in the EU.", "why": "After the 1933 runs, the FDIC began insuring deposits in 1934 and mass runs faded. In 2023, most SVB deposits were above the limit. Debates over higher limits and new digital accounts may change what is covered.", "how": ["Look up your country's deposit guarantee limit and who runs the scheme.", "Check whether your money sits at one bank or several, and whether fintech apps are covered.", "Read how central bank emergency lending works on your central bank's website."], "read": [{"title": "FDIC: Deposit Insurance", "url": "https://www.fdic.gov/resources/deposit-insurance"}, {"title": "European Commission: Deposit guarantee schemes", "url": "https://finance.ec.europa.eu/banking/banking-regulation/deposit-guarantee-schemes_en"}]}}], "watch": "Runs that spread through social media in hours, AI agents allowed to move deposits on their own, and debates over raising insured deposit limits."}}, {"id": "dust", "theme": "The sky goes dark over a strained land", "rhyme": 2, "then": {"year": 1935, "short": "Black Sunday", "title": "The Black Sunday Dust Storm", "where": "Great Plains, USA", "region": "us", "hook": "The Dust Bowl's darkest day, when a black wall of dust swallowed the Plains.", "text": "On 14 April 1935, a towering wall of dust rolled across the southern Great Plains and turned a sunny afternoon pitch black. The storm carried an estimated 300,000 tons of topsoil. A reporter's story about it gave the region its name: the Dust Bowl."}, "now": {"year": 2023, "short": "Orange Sky", "title": "New York's Orange Sky", "where": "New York, USA", "region": "us", "hook": "June 2023: New York under an eerie orange sky, and masks back on outdoors.", "text": "Smoke from wildfires in Quebec drifted south, and on 7 June 2023 New York's sky turned orange. The city's air quality index passed 400, in the highest ‘hazardous’ category. Canada's season burned about 18 million hectares, by far its worst on record."}, "followed": "Within two weeks, Congress created the Soil Conservation Service to fight erosion. Drought and storms lasted until about 1940, and hundreds of thousands of people left the Plains, many heading to California.", "next": {"short": "Dark Skies", "title": "Smoke and dust darken whole continents", "text": "Around 2111, a long megadrought or fire season might cloud the sky over half a continent for weeks. Cities could open clean-air shelters as routinely as they open cooling centers today.", "watch": "Longer fire seasons, shrinking groundwater under farm regions, and more days each year when officials tell people to stay indoors."}, "breaks": "The Dust Bowl grew from local plowing that stripped the soil, while New York's smoke blew in from distant Canadian forests burning in heat and drought.", "older": "New England's Dark Day, 1780", "topic": "disaster", "echoes": [{"year": -44, "short": "Caesar’s Dim Sun", "title": "The dim sun after Caesar’s murder", "region": "europe", "line": "Amid turmoil after Caesar’s murder, Romans described a darkened sun; eruptions of Etna and Alaska’s Okmok brought cold, failed harvests and famine."}, {"year": 536, "short": "Year 536", "title": "The mystery haze of 536", "region": "world", "line": "Volcanic haze dimmed the sun for about 18 months; Procopius said it shone like the moon, and crops failed across Eurasia."}, {"year": 1780, "short": "Dark Day", "title": "New England’s Dark Day", "region": "us", "line": "Smoke, likely from Canadian wildfires in a drought year, darkened New England at midday during the Revolutionary War; many feared Judgment Day."}, {"year": 1783, "short": "Laki Haze", "title": "The Laki haze over Europe", "region": "europe", "line": "Iceland's Laki eruption spread a sulfurous haze across Europe, and about a fifth of Icelanders died in the famine that followed."}, {"year": 1952, "short": "Great Smog", "title": "London's Great Smog", "region": "europe", "line": "Coal smoke and fog blacked out London for five days, killing thousands and pushing Parliament to pass the 1956 Clean Air Act."}, {"year": 1997, "short": "Asian Haze", "title": "The 1997 Southeast Asian haze", "region": "world", "line": "Land-clearing fires in drought-hit Indonesia smothered Southeast Asia in smoke, often cutting visibility in Sumatra and Borneo below 100 meters."}, {"year": 2009, "short": "Sydney Red Dust", "title": "Sydney’s red dust storm", "region": "world", "line": "Winds lifted topsoil from drought-stricken inland Australia and turned Sydney’s sky red in the biggest dust storm in about 70 years."}, {"year": 2020, "short": "SF Orange Sky", "title": "San Francisco's orange sky", "region": "us", "line": "Smoke from record wildfires amid heat and drought turned San Francisco's sky dark orange, with streetlights on at midday."}], "opp": {"lastTime": "After the Dust Bowl, the new Soil Conservation Service promoted contour plowing and terracing, and the Shelterbelt project planted about 220 million trees. When smoke hit New York in June 2023, air purifier searches jumped over 450% and some stores sold out.", "ideas": [{"kind": "build", "title": "Clean-air rooms for public buildings", "line": "Filtration upgrades and clean-air rooms for schools, clinics and care homes in regions where smoke seasons are getting longer.", "guide": {"what": "Rooms in schools, clinics or care homes where filtered air keeps smoke out, using sealed windows, better HVAC filters or portable air cleaners, so people can shelter safely.", "why": "When smoke turned New York's sky orange in June 2023, air purifier searches jumped over 450% and some stores sold out. As smoke seasons lengthen, schools and care homes may plan clean air ahead instead of scrambling.", "how": ["Read the EPA guide to creating a clean room during wildfire smoke.", "Visit a local school or care home and ask how they handled the last smoke day.", "Price a pilot: portable HEPA cleaners for one room, sized to the room's volume."], "read": [{"title": "EPA: Create a Clean Room to Protect Indoor Air Quality During a Wildfire", "url": "https://www.epa.gov/emergencies-iaq/create-clean-room-protect-indoor-air-quality-during-wildfire"}, {"title": "EPA: Wildfires and Indoor Air Quality in Schools and Commercial Buildings", "url": "https://www.epa.gov/emergencies-iaq/wildfires-and-indoor-air-quality-schools-and-commercial-buildings"}]}}, {"kind": "work", "title": "Soil, fire and air quality jobs", "line": "Soil conservationists, prescribed-burn crews and air quality forecasters, much as the 1930s created soil and forestry jobs across the Plains.", "guide": {"what": "Jobs that protect land and air: soil conservationists who help farmers stop erosion, prescribed-burn crews who reduce wildfire fuel, and forecasters who warn the public about smoke.", "why": "In 1935, Congress created the Soil Conservation Service, and the Shelterbelt project planted about 220 million trees, creating work across the Plains. Longer fire seasons, like Canada's record 2023, may grow similar demand today.", "how": ["Look at the NWCG's training courses for entry-level wildland fire roles.", "Ask a local farm advisory office or soil agency what a soil conservationist does.", "Check your area's air quality forecast daily for a month and learn how it is made."], "read": [{"title": "National Wildfire Coordinating Group (NWCG)", "url": "https://www.nwcg.gov/"}, {"title": "AirNow: air quality forecasts and maps", "url": "https://www.airnow.gov/"}]}}, {"kind": "work", "title": "Ventilation and filtration technicians", "line": "HVAC technicians and building engineers who can upgrade filtration, as smoke days make indoor air a public health concern.", "guide": {"what": "Technicians and building engineers who install, maintain and upgrade heating, ventilation and air conditioning (HVAC) systems, including higher-grade filters that catch fine smoke particles.", "why": "Smoke days turn indoor air into a health issue, as New York saw in 2023. Many older schools and offices may need filter and ventilation upgrades, and trained HVAC workers to carry them out.", "how": ["Ask a local HVAC contractor about apprenticeships or trainee roles.", "Learn what MERV 13 filters are and why the EPA suggests them during smoke events.", "Read the EPA guide on wildfire smoke in schools and commercial buildings."], "read": [{"title": "EPA: Wildfires and Indoor Air Quality in Schools and Commercial Buildings", "url": "https://www.epa.gov/emergencies-iaq/wildfires-and-indoor-air-quality-schools-and-commercial-buildings"}, {"title": "ASHRAE: Filtration and disinfection guidance", "url": "https://ashrae.org/technical-resources/filtration-disinfection"}]}}, {"kind": "learn", "title": "Soil and groundwater care", "line": "Cover cropping, no-till farming and groundwater management, the modern versions of the contour plowing and shelterbelts that eased the Dust Bowl.", "guide": {"what": "Farming and water practices that keep soil in place and aquifers from running dry, such as cover crops, no-till planting and measuring how much groundwater is pumped.", "why": "Dust Bowl plowing stripped the topsoil, and contour plowing and shelterbelts helped heal it. Groundwater is falling under farm regions such as the High Plains today, and the next long drought may test soils again.", "how": ["Read the free SARE book Managing Cover Crops Profitably.", "Visit a farm using no-till or cover crops and ask what changed in their soil.", "Look up your region's groundwater trend from your national geological or water agency."], "read": [{"title": "SARE: Managing Cover Crops Profitably, 3rd edition (free book)", "url": "https://www.sare.org/resources/managing-cover-crops-profitably-3rd-edition/"}, {"title": "FAO Soils Portal", "url": "https://www.fao.org/soils-portal/en/"}]}}], "watch": "More smoke-advisory days each year, falling groundwater under farm regions, and cities funding clean-air shelters or school filter upgrades."}}, {"id": "munich", "theme": "Land seized in the name of ethnic kin", "rhyme": 1, "then": {"year": 1938, "short": "Munich Deal", "title": "The Munich Agreement", "where": "Munich, Germany", "region": "europe", "hook": "Neville Chamberlain waving a piece of paper and promising “peace for our time”.", "text": "On 30 September 1938, Britain, France and Italy agreed to let Nazi Germany annex Czechoslovakia's Sudetenland, home to three million ethnic Germans Hitler claimed to be protecting. The Czechoslovaks were not at the table, and Neville Chamberlain flew home promising peace."}, "now": {"year": 2014, "short": "Crimea Annexed", "title": "Russia Annexes Crimea", "where": "Crimea, Ukraine", "region": "europe", "hook": "March 2014: masked soldiers without insignia taking over Crimea, then Russia claiming it.", "text": "In late February 2014, Russian troops without insignia seized Crimea from Ukraine. After a 16 March referendum that Ukraine and Western governments rejected as illegal, Russia annexed the peninsula on 18 March, saying it was protecting Russian speakers. On 24 February 2022, Russia launched a full-scale invasion of Ukraine."}, "followed": "In March 1939 Hitler seized the rest of the Czech lands. He invaded Poland on 1 September 1939, and Britain and France declared war two days later.", "next": {"short": "Border Redrawn", "title": "A border redrawn for ethnic kin", "text": "Around 2090, a power might claim a neighbor's land to protect people who share its language or faith. Others could answer with deals, sanctions or force, and the old Munich debate might return.", "watch": "Passports handed to people across a border, claims that kin abroad are under threat, and troops massing near a frontier."}, "breaks": "Many scholars dispute the Munich analogy: no Western leader signed away Crimea, and the comparison has been invoked to argue for wars from Suez to Iraq.", "topic": "power", "echoes": [{"year": 1500, "short": "Ivan III’s War", "title": "Ivan III seizes a third of Lithuania", "region": "russia", "line": "Citing persecution of Orthodox believers, Ivan III, “sovereign of all Rus,” warred on Lithuania and took about a third of its land."}, {"year": 1864, "short": "Schleswig War", "title": "Prussia and Austria seize Schleswig-Holstein", "region": "europe", "line": "Amid German nationalist calls to free German speakers from Danish rule, Prussia and Austria seized Schleswig, Holstein and Lauenburg from Denmark."}, {"year": 1919, "short": "Fiume Seized", "title": "D'Annunzio seizes Fiume", "region": "europe", "line": "Poet Gabriele D'Annunzio led armed volunteers into the Adriatic port, claiming it for its Italian majority; Italy annexed it in 1924."}, {"year": 1920, "short": "Vilnius Seized", "title": "Poland’s staged seizure of Vilnius", "region": "europe", "line": "Polish General Żeligowski staged a “mutiny” to take Lithuanian-claimed Vilnius, citing its Polish-speaking majority; Poland annexed the region in 1922."}, {"year": 1974, "short": "Cyprus Split", "title": "Turkish troops land in Cyprus", "region": "europe", "line": "After a Greek-backed coup, Turkey sent troops, saying it was protecting Turkish Cypriots, and took about a third of the island."}, {"year": 1991, "short": "Serb Krajina", "title": "Serb rebels seize a third of Croatia", "region": "europe", "line": "As Croatia left Yugoslavia, Yugoslav army-backed Serb rebels took about a third of it, saying they were protecting Croatia’s Serbs."}, {"year": 2008, "short": "Georgia War", "title": "The Russia–Georgia war", "region": "europe", "line": "Russia fought Georgia over South Ossetia, saying it was defending residents holding Russian passports, then recognized two breakaway regions as independent."}], "opp": {"lastTime": "After Munich, Britain sped up civil defense, and about 1.5 million Anderson air-raid shelters were up by September 1939. After 2022, Germany built its first LNG import terminal in under 200 days to replace Russian gas, and European defense budgets rose.", "ideas": [{"kind": "build", "title": "Backup supply for towns and firms", "line": "Services that help towns and firms reduce reliance on one risky supplier through local energy storage, alternate fuels and backup sourcing.", "guide": {"what": "Services that help a town or company avoid depending on one risky supplier, for example with battery storage, backup fuels, spare stock or second sources for key parts.", "why": "After Munich, Britain rushed civil defense. After 2022, Germany built its first LNG import terminal in under 200 days to replace Russian gas. Towns and firms may again pay for backup before a crisis, not during it.", "how": ["Map one local firm's critical suppliers and mark any that depend on a single country.", "Ask a town energy officer about backup power for water, health and emergency sites.", "Learn the basics of business continuity planning from the Business Continuity Institute."], "read": [{"title": "The Business Continuity Institute", "url": "https://www.thebci.org/"}]}}, {"kind": "work", "title": "Civil protection and emergency planning", "line": "Emergency planners, civil protection staff and infrastructure security specialists, as European states rebuild shelters, stockpiles and preparedness programs.", "guide": {"what": "Planning how a region keeps people safe in war, floods or blackouts: shelters, warnings, evacuation, stockpiles and exercises. Employers include governments, utilities, hospitals and aid groups.", "why": "After Munich, Britain put up about 1.5 million Anderson shelters by September 1939. Since 2022, European states have revived shelter, stockpile and preparedness programs, which may raise demand for trained planners.", "how": ["Take a free FEMA Independent Study course, such as the introduction to incident command.", "Volunteer with a local civil protection, fire brigade or Red Cross team.", "Read how the EU Civil Protection Mechanism shares help between countries."], "read": [{"title": "FEMA Independent Study Program (free online courses)", "url": "https://training.fema.gov/programs/independent-study/"}, {"title": "EU Civil Protection Mechanism", "url": "https://civil-protection-humanitarian-aid.ec.europa.eu/what/civil-protection/eu-civil-protection-mechanism_en"}]}}, {"kind": "work", "title": "Demining and reconstruction", "line": "Deminers, structural engineers and recovery planners could be needed for years, with Ukraine's recovery needs put at $588 billion in February 2026.", "guide": {"what": "Deminers find and destroy landmines and unexploded shells. Structural engineers and recovery planners then assess damage and rebuild homes, power lines, bridges and schools.", "why": "A February 2026 assessment by Ukraine, the World Bank, the EU and the UN put recovery needs at almost $588 billion over a decade, including about $28 billion for explosives and debris. A lasting ceasefire may speed rebuilding.", "how": ["Read the World Bank's February 2026 summary of Ukraine's recovery needs.", "Learn how demining work is organised through the International Mine Action Standards.", "Contact a mine action group or engineering firm working in Ukraine about entry roles."], "read": [{"title": "World Bank: Updated Ukraine Recovery and Reconstruction Needs Assessment (2026)", "url": "https://www.worldbank.org/en/news/press-release/2026/02/23/updated-ukraine-recovery-and-reconstruction-needs-assessment-released"}, {"title": "International Mine Action Standards (IMAS)", "url": "https://www.mineactionstandards.org/"}]}}, {"kind": "learn", "title": "Open-source investigation skills", "line": "Verifying troop movements and official claims from public data, the skill used to test pretexts such as protecting threatened kin abroad.", "guide": {"what": "Using public material such as satellite images, videos, maps and social posts to check what really happened, for example where troops are moving or whether an official claim holds up.", "why": "In 1938, Hitler claimed to protect ethnic Germans, and in 2014 Russia made similar claims over Crimea. Before the 2022 invasion, analysts tracked Russia's troop build-up from public images. These skills may help test the next pretext.", "how": ["Work through one Bellingcat beginner guide, such as geolocating a photo.", "Read the Berkeley Protocol on how to collect and preserve online evidence.", "Practise by checking the place and date of one viral news video this week."], "read": [{"title": "Bellingcat: guides and how-tos", "url": "https://www.bellingcat.com/category/resources/how-tos/"}, {"title": "Berkeley Protocol on Digital Open Source Investigations", "url": "https://humanrights.berkeley.edu/publications/berkeley-protocol-on-digital-open-source-investigations/"}]}}], "watch": "European governments funding shelters, stockpiles and reservists, or a lasting ceasefire that shifts money and people toward rebuilding Ukraine."}}, {"id": "martians", "theme": "A fake that fools the public", "rhyme": 2, "then": {"year": 1938, "short": "War of Worlds", "title": "The War of the Worlds Broadcast", "where": "United States", "region": "us", "hook": "Orson Welles' radio play about invading Martians that supposedly sent America into a panic.", "text": "On 30 October 1938, Orson Welles staged H.G. Wells' novel on CBS radio as a string of fake news bulletins about Martians landing in New Jersey. Newspapers reported mass panic the next morning. Later research found few listeners actually panicked and the papers greatly exaggerated the scare."}, "now": {"year": 2023, "short": "Puffer Pope", "title": "Viral AI Deepfakes", "where": "Online, worldwide", "region": "world", "hook": "March 2023: the Pope in a stylish white puffer jacket, later revealed as AI-made.", "text": "In March 2023, an image of Pope Francis in a white puffer jacket, made with the AI tool Midjourney, fooled many people online. On 22 May, a fake picture of an explosion near the Pentagon spread from verified Twitter accounts, and US stocks briefly dipped before officials debunked it."}, "followed": "Welles apologized the next morning, and the FCC took no action against CBS. The fame helped him win a Hollywood contract with rare creative control, which led to Citizen Kane in 1941.", "next": {"short": "Live Deepfake", "title": "A fully faked live news event", "text": "Around 2108, a fake might be an entire live event, with video, voices and eyewitness posts all generated at once. It could move markets or spark unrest before anyone can check what really happened.", "watch": "Fakes that fool experts, markets reacting to unverified images, and fights over watermarks and who certifies what is real."}, "breaks": "Welles' drama was announced as fiction on a single network, while today's AI fakes often carry no label and can spread worldwide within minutes.", "older": "The Great Moon Hoax, 1835", "topic": "society", "echoes": [{"year": 69, "short": "False Nero", "title": "A false Nero appears in Greece", "region": "europe", "line": "According to Tacitus, a lyre-playing lookalike claiming to be the dead emperor Nero gathered deserters in Greece until Roman soldiers killed him."}, {"year": 1165, "short": "Prester John", "title": "The letter of Prester John", "region": "europe", "line": "A forged letter from a mythical Christian king in Asia, “Prester John,” swept Europe; a pope wrote to him in 1177."}, {"year": 1440, "short": "Fake Donation", "title": "Valla exposes the Donation of Constantine", "region": "europe", "line": "Lorenzo Valla proved the Donation of Constantine, a decree popes had cited for centuries to back their worldly power, was a forgery."}, {"year": 1726, "short": "Rabbit Births", "title": "Mary Toft's rabbit births", "region": "europe", "line": "An English servant claimed to give birth to rabbits, and even a royal surgeon believed her until she confessed to the hoax."}, {"year": 1835, "short": "Moon Hoax", "title": "The Great Moon Hoax", "region": "us", "line": "The New York Sun reported that astronomer John Herschel had found bat-winged people on the Moon; the hoax went unexposed for weeks."}, {"year": 1869, "short": "Cardiff Giant", "title": "The Cardiff Giant", "region": "us", "line": "A “petrified man” dug up on a New York farm drew paying crowds, but it was a planted gypsum statue."}, {"year": 1912, "short": "Piltdown Man", "title": "The Piltdown Man forgery", "region": "europe", "line": "Fossils hailed as a missing link fooled experts for 41 years until tests showed a human skull paired with an orangutan jaw."}, {"year": 1917, "short": "Fairy Photos", "title": "The Cottingley Fairies", "region": "europe", "line": "Two English girls photographed paper cutout fairies, and Sherlock Holmes author Arthur Conan Doyle championed the pictures as real."}, {"year": 1934, "short": "Nessie Photo", "title": "The Loch Ness “surgeon’s photo”", "region": "europe", "line": "The Daily Mail’s photo of the Loch Ness Monster was believed for about 60 years, but it showed a toy submarine."}, {"year": 1957, "short": "Spaghetti Trees", "title": "The BBC's spaghetti harvest", "region": "europe", "line": "A straight-faced BBC report showed Swiss farmers picking spaghetti from trees on April Fools' Day, and viewers asked how to grow it."}, {"year": 1983, "short": "Hitler Diaries", "title": "The Hitler Diaries", "region": "europe", "line": "German magazine Stern paid millions for diaries said to be Hitler's, and within two weeks experts exposed them as modern forgeries."}], "opp": {"lastTime": "Hadley Cantril's 1940 study of the scare, The Invasion from Mars, became a classic of media research. The Hitler Diaries fell to police lab tests of paper, thread and ink, and after 2023 “Content Credentials” for tracing image origins spread to cameras and phones.", "ideas": [{"kind": "build", "title": "Provenance checks before money moves", "line": "Tools that check an image or video's origin before it moves markets or headlines, for newsrooms, trading desks and insurers.", "guide": {"what": "Tools that check where an image or video came from and whether it was edited, before a newsroom publishes it or a trader, insurer or bank acts on it.", "why": "In May 2023, a fake image of a Pentagon explosion briefly knocked US stocks. Since 2023, Content Credentials have spread to some cameras and phones. Firms that act on news within seconds may pay for fast checks.", "how": ["Try the free Content Credentials Verify tool on images from news sites.", "Ask a newsroom editor or trading desk how they check a breaking image today.", "Read the C2PA overview to learn how provenance data is attached and signed."], "read": [{"title": "Content Credentials: Verify tool", "url": "https://verify.contentauthenticity.org/"}, {"title": "C2PA: Coalition for Content Provenance and Authenticity", "url": "https://c2pa.org/"}]}}, {"kind": "build", "title": "AI content labeling compliance", "line": "Services that help firms label AI-generated media to meet transparency rules such as those in the EU AI Act.", "guide": {"what": "Services that help companies mark AI-made images, audio, video and text, and tell people when content is synthetic, to meet laws such as the EU AI Act.", "why": "Welles' 1938 broadcast was announced as fiction, while today's AI fakes often carry no label. EU AI Act duties to mark and disclose AI-generated content were set to apply from August 2026, so many firms may need help.", "how": ["Read Article 50 of the EU AI Act on transparency for AI-generated content.", "Ask three marketing or media teams how they label AI images today.", "Test whether content credentials survive when a file is cropped, compressed or reposted."], "read": [{"title": "Content Authenticity Initiative", "url": "https://contentauthenticity.org/"}]}}, {"kind": "work", "title": "Verification and digital forensics roles", "line": "Verification editors, trust and safety analysts and digital forensics examiners tend to be in demand once fakes start fooling experts.", "guide": {"what": "Jobs that test whether photos, videos, documents or accounts are genuine. Titles include verification editor at a newsroom, trust and safety analyst at a platform, and digital forensics examiner.", "why": "The Hitler Diaries fooled experts in 1983 until lab tests of paper and ink exposed them. AI fakes now fool many viewers, so newsrooms, platforms and courts may need more people trained to check.", "how": ["Read the free Verification Handbook and try one of its case studies yourself.", "Volunteer with a fact-checking project or online verification community.", "Ask a trust and safety worker which skills and tools they use most."], "read": [{"title": "Verification Handbook (free)", "url": "https://verificationhandbook.com/"}, {"title": "Bellingcat: guides and how-tos", "url": "https://www.bellingcat.com/category/resources/how-tos/"}]}}, {"kind": "learn", "title": "Media forensics and provenance", "line": "How content credentials, watermarks and metadata work, and how to spot edits, much as document examiners learned to date paper and ink.", "guide": {"what": "How to tell where a digital file came from and whether it was changed, using metadata, content credentials, watermarks and visual clues such as lighting, shadows and compression.", "why": "Cantril's 1940 study made the Welles scare a classic of media research, and document examiners exposed the Hitler Diaries. As fakes improve, knowing how provenance and forensics work may help you judge what to trust.", "how": ["Inspect the metadata of your own phone photos with a free EXIF viewer.", "Read the C2PA explainer on how content credentials are signed and checked.", "Run reverse image searches on five viral images and note where each first appeared."], "read": [{"title": "C2PA: Coalition for Content Provenance and Authenticity", "url": "https://c2pa.org/"}, {"title": "Verification Handbook (free)", "url": "https://verificationhandbook.com/"}]}}], "watch": "Markets or officials reacting to unverified media, and whether phones, cameras and platforms show content credentials by default."}}, {"id": "einstein", "theme": "Scientists warn about their own creation", "rhyme": 2, "then": {"year": 1939, "short": "Atomic Warning", "title": "The Einstein–Szilárd Letter", "where": "United States", "region": "us", "hook": "The letter in which Einstein warned President Roosevelt that atomic bombs were possible.", "text": "In a letter dated 2 August 1939, Albert Einstein warned President Franklin Roosevelt that uranium could power “extremely powerful bombs of a new type”, and hinted that Nazi Germany might be working on them. Physicist Leo Szilárd drafted it, and economist Alexander Sachs handed it to Roosevelt in October."}, "now": {"year": 2023, "short": "AI Warning", "title": "AI Leaders Warn of Extinction", "where": "Worldwide", "region": "world", "hook": "May 2023: headlines saying AI's own creators warned it could wipe out humanity.", "text": "On 30 May 2023, hundreds of AI scientists and executives, including Geoffrey Hinton, Sam Altman and Demis Hassabis, signed a one-sentence statement ranking AI extinction risk alongside pandemics and nuclear war. In November, 28 countries, including the US and China, signed the Bletchley Declaration at Britain's AI Safety Summit."}, "followed": "Roosevelt formed a uranium committee, the Manhattan Project began in 1942, and US atomic bombs destroyed Hiroshima and Nagasaki in 1945. Einstein later called signing the letter his “one great mistake”.", "next": {"short": "Next Warning", "title": "Inventors warn about a new creation", "text": "Around 2107, a warning might come from pioneers of a field barely born today, perhaps synthetic life or brain-computer links, urging leaders to act before their discovery outruns any control.", "watch": "Top researchers quitting to speak out, open letters from inventors about their own work, and summits devoted to a single technology."}, "breaks": "Einstein urged Roosevelt to speed up atomic research before Hitler got there first, while the AI signers urged caution about a technology many were still building.", "topic": "tech", "echoes": [{"year": 1508, "short": "Leonardo’s Dive", "title": "Leonardo keeps an underwater invention secret", "region": "europe", "line": "In his notebooks, Leonardo withheld his method of staying underwater “by reason of the evil nature of men,” who might sink ships."}, {"year": 1947, "short": "Doomsday Clock", "title": "Atomic scientists start the Doomsday Clock", "region": "us", "line": "Manhattan Project scientists launched the Doomsday Clock, set at seven minutes to midnight, to warn the world about nuclear war."}, {"year": 1955, "short": "Russell–Einstein", "title": "The Russell–Einstein Manifesto", "region": "world", "line": "Einstein and other leading scientists, with philosopher Bertrand Russell, warned that nuclear weapons could put an end to the human race."}, {"year": 1975, "short": "Asilomar", "title": "The Asilomar gene-splicing conference", "region": "us", "line": "Biologists who had just invented gene splicing paused their own experiments and met at Asilomar, California, to draft safety rules."}, {"year": 2012, "short": "Bird Flu Pause", "title": "Flu researchers pause risky bird flu work", "region": "world", "line": "After two labs made bird flu strains that spread between ferrets, 39 researchers paused such work so its risks could be debated."}, {"year": 2015, "short": "CRISPR Pause", "title": "Gene editors call for a pause", "region": "us", "line": "CRISPR pioneer Jennifer Doudna urged a pause on editing human embryos, and a Washington summit called heritable edits irresponsible for now."}], "opp": {"lastTime": "The 1939 warning led to the Manhattan Project, which employed nearly 130,000 people and left lasting national labs such as Los Alamos and Oak Ridge. After Asilomar, 1976 NIH rules required biosafety committees, and in 2023 Britain and the US set up AI safety institutes.", "ideas": [{"kind": "build", "title": "Independent AI testing services", "line": "Third-party labs that test AI models for dangerous capabilities before release, much as biosafety reviews became routine after Asilomar.", "guide": {"what": "Outside labs that test AI models before release for dangerous abilities, such as helping with cyberattacks or weapons, and report results to developers or governments.", "why": "After Asilomar, 1976 NIH rules made biosafety review routine. Britain set up an AI safety institute in 2023, and the EU AI Act now asks makers of the most powerful models to test them. Demand for outside testers may grow.", "how": ["Try the UK AI Security Institute's open-source Inspect tool on a small model.", "Read two published model evaluation reports and list the tests they ran.", "Ask an AI developer what outside testing they would pay for, and why."], "read": [{"title": "Inspect: open-source AI evaluation framework from the UK AI Security Institute", "url": "https://inspect.aisi.org.uk/"}, {"title": "UK AI Security Institute", "url": "https://www.aisi.gov.uk/"}]}}, {"kind": "build", "title": "DNA order screening tools", "line": "Screening that checks DNA synthesis orders for dangerous sequences, a safeguard that may grow as AI and biology tools combine.", "guide": {"what": "Software that checks orders for synthetic DNA against lists of dangerous sequences and suspect customers, so providers can flag or refuse risky requests before anything is made.", "why": "Asilomar in 1975 led to rules for risky gene research. AI may make biology easier to misuse. In 2024 the US told federally funded labs to buy DNA from providers that screen orders, and rules keep evolving.", "how": ["Read the International Gene Synthesis Consortium's harmonized screening protocol.", "Ask a DNA synthesis company or university core facility how they screen orders now.", "Learn sequence search tools such as BLAST, which screening methods often build on."], "read": [{"title": "International Gene Synthesis Consortium", "url": "https://genesynthesisconsortium.org/"}, {"title": "IBBIS: International Biosecurity and Biosafety Initiative for Science", "url": "https://ibbis.bio/"}]}}, {"kind": "work", "title": "AI evaluation and governance roles", "line": "AI evaluation researchers, red-teamers and governance officers in labs, companies and government, a field that may grow as testing rules take effect.", "guide": {"what": "Jobs that measure what AI systems can do and set rules for their safe use. Roles include evaluation researcher, red-teamer who tries to make models misbehave, and AI policy officer.", "why": "The 1939 warning led to the Manhattan Project and lasting national labs. After the 2023 extinction warning, Britain and the US created AI safety institutes, and new testing rules may keep this field growing.", "how": ["Take a free BlueDot Impact course on AI safety or AI governance.", "Read job ads at AI labs and government AI institutes and list the skills they repeat.", "Join a public red-teaming challenge or evaluation project to build a sample of your work."], "read": [{"title": "BlueDot Impact: free AI safety and governance courses", "url": "https://bluedot.org/"}, {"title": "80,000 Hours: AI risk problem profile", "url": "https://80000hours.org/problem-profiles/artificial-intelligence/"}]}}, {"kind": "learn", "title": "Dual-use risk assessment", "line": "How to judge when useful research could also cause harm, a method shaped by nuclear arms control and Asilomar, now applied to AI.", "guide": {"what": "Judging when useful research or tools could also be misused to cause harm, and weighing that risk against the benefits before deciding what to publish or release.", "why": "Nuclear arms control and the 1975 Asilomar meeting shaped how scientists weigh dangerous knowledge. AI now raises similar questions about models that could aid attacks, so these skills may matter in labs and governments.", "how": ["Read the WHO framework on responsible use of the life sciences.", "Read NIST's draft guide on managing misuse risk for powerful AI models.", "Pick one recent paper and list its possible misuses, benefits and safeguards."], "read": [{"title": "WHO: Global guidance framework for the responsible use of the life sciences", "url": "https://www.who.int/publications/i/item/9789240056107"}, {"title": "NIST AI 800-1 (draft): Managing Misuse Risk for Dual-Use Foundation Models", "url": "https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.800-1.ipd.pdf"}]}}], "watch": "Researchers leaving labs to speak out, governments requiring pre-release testing of AI models, and summits devoted to one technology."}}, {"id": "transistor", "theme": "A small lab invention that remakes the world", "rhyme": 2, "then": {"year": 1947, "short": "Transistor", "title": "The Transistor Is Born", "where": "Murray Hill, New Jersey, USA", "region": "us", "hook": "The tiny switch inside every computer, phone and gadget you have ever used.", "text": "In December 1947 at Bell Labs in New Jersey, John Bardeen and Walter Brattain built the first working transistor, a small device that could amplify and switch electric signals. Transistors would soon replace bulky vacuum tubes. With William Shockley, the pair won the 1956 Nobel Prize in Physics."}, "now": {"year": 2017, "short": "Transformer", "title": "The Transformer Paper", "where": "Mountain View, California, USA", "region": "us", "hook": "Late 2022: millions type their first question into ChatGPT, built on a 2017 Google idea.", "text": "In June 2017, eight Google researchers posted a paper called “Attention Is All You Need”, introducing a neural network design named the Transformer. It let AI learn from huge amounts of text far more efficiently. The “T” in ChatGPT stands for Transformer."}, "followed": "Transistors went into hearing aids and pocket radios in the 1950s, then onto integrated circuits. Intel's 4004 put a whole processor on one chip in 1971, and today's largest chips hold over 100 billion transistors.", "next": {"short": "The Next Leap", "title": "A quiet lab result remakes everything", "text": "Around 2087, the next leap might start as an obscure lab result, perhaps in quantum, optical or biological computing. Within a lifetime it could reshape work, war and daily life as the transistor did.", "watch": "Obscure papers that suddenly get copied by every lab, new materials for computing, and machines that keep getting cheaper at a startling pace."}, "breaks": "The transistor was hardware that took decades to reshape daily life, while the Transformer is software that reached hundreds of millions of people within a few years.", "older": "Gutenberg's printing press, about 1440", "topic": "tech", "echoes": [{"year": 105, "short": "Cai Lun’s Paper", "title": "Cai Lun improves papermaking", "region": "china", "line": "Cai Lun, head of the Han palace workshop, presented an improved papermaking method using bark, rags and fishnets; paper later spread worldwide."}, {"year": 1044, "short": "Gunpowder", "title": "China records the first gunpowder formulas", "region": "china", "line": "Chinese alchemists seeking an elixir of life likely stumbled on gunpowder; its first formulas date to 1044, and it remade warfare worldwide."}, {"year": 1440, "short": "Gutenberg Press", "title": "Gutenberg’s printing press", "region": "europe", "line": "Goldsmith Johannes Gutenberg developed a movable-type press; by 1500, presses in about 270 European cities had printed over 20 million copies."}, {"year": 1800, "short": "Volta’s Battery", "title": "Volta builds the first battery", "region": "europe", "line": "Alessandro Volta stacked zinc and silver discs with brine-soaked cloth to make the first battery, which opened the age of electricity."}, {"year": 1831, "short": "Faraday Dynamo", "title": "Faraday turns magnetism into electricity", "region": "europe", "line": "Michael Faraday showed in his London lab that moving magnets make electric current, the principle behind every power station generator."}, {"year": 1909, "short": "Haber Ammonia", "title": "Haber pulls fertilizer from the air", "region": "europe", "line": "Fritz Haber made ammonia from air on a tabletop machine; scaled up as Haber-Bosch, its fertilizer now helps feed billions."}, {"year": 1928, "short": "Penicillin", "title": "Fleming discovers penicillin", "region": "europe", "line": "Alexander Fleming noticed mold killing bacteria in a London lab dish, and mass-produced penicillin later launched the antibiotic age."}, {"year": 1938, "short": "Fission", "title": "The discovery of nuclear fission", "region": "europe", "line": "In a Berlin lab, Hahn and Strassmann split uranium atoms; within seven years, fission had produced nuclear reactors and atomic bombs."}, {"year": 1960, "short": "First Laser", "title": "Maiman builds the first laser", "region": "us", "line": "Theodore Maiman built the first laser, jokingly called “a solution looking for a problem”; lasers now carry internet data and scan barcodes."}, {"year": 1989, "short": "World Wide Web", "title": "Berners-Lee invents the Web", "region": "europe", "line": "At CERN, Tim Berners-Lee proposed a system of linked documents, and the World Wide Web he built now connects billions."}], "opp": {"lastTime": "The 1954 Regency TR-1 pocket radio brought transistors to shoppers, and Silicon Valley grew after eight engineers left Shockley's lab to found Fairchild Semiconductor in 1957. After the 1989 Web proposal, web designer became a common new job.", "ideas": [{"kind": "build", "title": "Small AI devices that run locally", "line": "Low-power devices that run AI models on board, such as hearing aids, translators and farm sensors, as transistors first spread through hearing aids.", "guide": {"what": "Gadgets that run an AI model on their own chip, without sending data to the cloud, such as hearing aids that filter speech, offline translators or farm sensors.", "why": "Transistors first reached the public in hearing aids and the 1954 Regency pocket radio. AI models are shrinking and getting cheaper to run, so small offline devices may be where many people meet AI day to day.", "how": ["Audit the first part of the HarvardX TinyML course on edX.", "Buy a low-cost microcontroller board and run a sample keyword-spotting model on it.", "Ask hearing aid users or farmers which task they would want done offline."], "read": [{"title": "HarvardX: Tiny Machine Learning (TinyML) on edX", "url": "https://www.edx.org/certificates/professional-certificate/harvardx-tiny-machine-learning"}, {"title": "Edge Impulse documentation", "url": "https://docs.edgeimpulse.com/"}]}}, {"kind": "work", "title": "Chip plant and data center technicians", "line": "Fab technicians, electricians and cooling specialists for chip plants and data centers, the physical workforce the AI build-out tends to need.", "guide": {"what": "Hands-on jobs that keep chip factories and data centers running: fab technicians, electricians, and cooling and power specialists who install and maintain the equipment.", "why": "After 1957, Fairchild helped grow Silicon Valley's skilled workforce. New chip plants and AI data centers are rising now, and the IEA has projected that data center electricity use could more than double by 2030.", "how": ["Look up technician apprenticeships at chip plants or data centers near you.", "Take a short course in electrical basics, cleanroom practice or HVAC at a local college.", "Ask a data center technician what a typical shift and on-call week involve."], "read": [{"title": "CHIPS for America: Workforce Development", "url": "https://www.nist.gov/chips/implementation-strategies/workforce-development"}, {"title": "European Chips Skills Academy", "url": "https://chipsacademy.eu/"}]}}, {"kind": "work", "title": "AI integration for small businesses", "line": "People who fit AI tools into the daily work of clinics, workshops and offices, as radio and TV technicians once serviced new electronics.", "guide": {"what": "Helping small firms such as clinics, workshops and shops choose AI tools, fit them into daily work, train staff and check that results stay accurate and private.", "why": "When transistors and later the Web arrived, new trades grew around them, from radio and TV repair to web design. As AI tools spread, many small firms may need someone local to set them up well.", "how": ["Take the free Elements of AI course to learn the basics without coding.", "Offer to automate one routine task for a local business and measure the time saved.", "Learn data privacy basics, such as GDPR, before handling any client data."], "read": [{"title": "Elements of AI (free course)", "url": "https://www.elementsofai.com/"}, {"title": "AI For Everyone (Coursera)", "url": "https://www.coursera.org/learn/ai-for-everyone"}]}}, {"kind": "learn", "title": "Adapting small open models", "line": "Fine-tuning and testing small open models for one field, the way 1950s engineers learned circuit design around a new component.", "guide": {"what": "Taking a small, freely available AI model and training it further on examples from one field, such as legal forms or farm records, then testing how well it works.", "why": "In the 1950s, engineers learned to design circuits around the new transistor. Since 2017 the Transformer has become AI's core building block, and small open models now run on a laptop, so adapting them may be a useful skill.", "how": ["Work through the free Hugging Face LLM course chapters on fine-tuning.", "Fine-tune a small open model on 200 examples from a field you know.", "Write 50 test questions and compare the model's answers before and after."], "read": [{"title": "Hugging Face LLM Course", "url": "https://huggingface.co/learn/llm-course/chapter1/1"}, {"title": "fast.ai: Practical Deep Learning for Coders", "url": "https://course.fast.ai/"}]}}], "watch": "The cost of each AI task falling year after year, and whether one model design keeps spreading or a new one replaces it."}}, {"id": "mccarthy", "theme": "Careers ended over opinions and associations", "rhyme": 1, "then": {"year": 1950, "short": "McCarthyism", "title": "McCarthyism and the Blacklists", "where": "United States", "region": "us", "hook": "Senator McCarthy's lists, loyalty oaths, and Hollywood writers who suddenly could not find work.", "text": "In February 1950, Senator Joseph McCarthy claimed to hold a list of Communists working in the State Department. Federal workers faced loyalty reviews, the Hollywood Ten went to prison for contempt of Congress, and a pamphlet called Red Channels named 151 broadcasters and entertainers, many of whom lost work."}, "now": {"year": 2020, "short": "Online Pile-on", "title": "Online Pile-ons and Firings", "where": "Social media, USA", "region": "us", "hook": "2020: an old tweet resurfaces, the internet piles on, and someone loses their job.", "text": "Around 2020, online pile-ons got people fired over posts, jokes and old tweets, with pressure coming from left and right. Critics called it cancel culture, while supporters called it accountability. In January 2021, after the Capitol riot, major platforms suspended President Donald Trump."}, "followed": "After televised hearings in 1954, the Senate censured McCarthy, and his influence collapsed. Blacklists faded slowly: screenwriter Dalton Trumbo regained screen credit only in 1960, for Spartacus and Exodus.", "next": {"short": "Speech Scores", "title": "Speech judged by automated systems", "text": "Around 2090, automated systems might scan everything a person has ever said online, so one old remark could cost a job, a loan or a visa before any human reviews it.", "watch": "Employers and governments screening people's online histories, speech rules enforced by algorithms, and rising numbers of people afraid to voice opinions."}, "breaks": "McCarthyism targeted one suspected ideology using government power, while 2020-era pressure came from many directions, mostly through crowds, employers and private platforms.", "older": "The Spanish Inquisition, 1478", "topic": "society", "echoes": [{"year": -399, "short": "Socrates Trial", "title": "The trial of Socrates", "region": "europe", "line": "Athens sentenced Socrates to death for impiety and corrupting the young, charges colored by his questioning and his ties to oligarch Critias."}, {"year": 166, "short": "Partisan Ban", "title": "Han eunuchs ban scholar-officials for life", "region": "china", "line": "Han eunuchs had scholar-officials and about 200 students, accused of forming a faction to criticize the court, barred from office for life."}, {"year": 833, "short": "The Mihna", "title": "The Abbasid Mihna tests officials’ beliefs", "region": "mideast", "line": "Caliph al-Ma’mun made judges and scholars affirm that the Quran was created; refusers lost posts or were jailed, among them Ibn Hanbal."}, {"year": 1104, "short": "Song Blacklist", "title": "Song China’s stone blacklist", "region": "china", "line": "Chancellor Cai Jing named 309 officials of a rival faction on a stone blacklist, copied across China, that sidelined them for years."}, {"year": 1478, "short": "Inquisition", "title": "Spain’s Inquisition is founded", "region": "europe", "line": "The Inquisition investigated converts suspected of secretly practicing Judaism, using anonymous denunciations, and barred the convicted and their descendants from office."}, {"year": 1633, "short": "Galileo Trial", "title": "The trial of Galileo", "region": "europe", "line": "The Inquisition convicted Galileo for teaching that Earth circles the Sun, banned his book and kept him under house arrest for life."}, {"year": 1919, "short": "Palmer Raids", "title": "The first Red Scare raids", "region": "us", "line": "In the first Red Scare, federal raids rounded up thousands of suspected radicals for their politics and deported hundreds, including Emma Goldman."}, {"year": 1957, "short": "Anti-Rightist", "title": "China’s Anti-Rightist Campaign", "region": "china", "line": "After Mao’s Hundred Flowers campaign invited criticism, over 550,000 people were branded “rightists” and many lost jobs or were sent to camps."}, {"year": 1972, "short": "Radicals Decree", "title": "West Germany’s Radicals Decree", "region": "europe", "line": "West Germany checked about 3.5 million people for public jobs; 1,250 were refused posts and 265 dismissed over alleged extremist ties."}, {"year": 2003, "short": "Dixie Chicks", "title": "The Dixie Chicks boycott", "region": "us", "line": "After singer Natalie Maines criticized President George W. Bush before the Iraq War, country radio stations across America stopped playing the band."}], "opp": {"lastTime": "The 1919 Palmer Raids prompted the founding of the ACLU in 1920. Blacklisted writers like Dalton Trumbo kept working under fronts and pen names, winning Oscars for Roman Holiday and The Brave One, and in 2022 the campus group FIRE widened its work nationwide.", "ideas": [{"kind": "build", "title": "Fair process before discipline", "line": "HR and legal services that give staff a documented, fair review before discipline over speech, rather than decisions made under online pressure.", "guide": {"what": "HR and legal services that give an employee a documented, fair review before any discipline over something they said, with a chance to respond and a decision based on facts.", "why": "In the 1950s, blacklists cost people work with little chance to answer the charges. Around 2020, online pile-ons led to fast firings. Firms may value clear processes that hold up legally and treat staff fairly.", "how": ["Read the Acas Code of Practice on disciplinary and grievance procedures.", "Ask HR managers how they handled a viral complaint about an employee.", "Draft a one-page review process with timelines, evidence rules and a right of reply."], "read": [{"title": "Acas Code of Practice on disciplinary and grievance procedures", "url": "https://www.acas.org.uk/acas-code-of-practice-on-disciplinary-and-grievance-procedures"}]}}, {"kind": "build", "title": "Context for resurfaced posts", "line": "Tools that show the date and full context of resurfaced posts, so employers and audiences can judge old remarks fairly.", "guide": {"what": "Tools that show when an old post was written, what it replied to and what the person has said since, so employers and audiences can judge it in context.", "why": "Around 2020, old tweets resurfaced and cost people jobs, often stripped of their date and thread. If automated systems scan online histories more widely, tools that restore context may help people get a fair hearing.", "how": ["Collect ten resurfaced-post controversies and note what context was missing in each.", "Test how web archives and platform tools show a post's date and full thread.", "Ask an HR manager or journalist what context they need to judge an old post."], "read": [{"title": "Verification Handbook (free)", "url": "https://verificationhandbook.com/"}]}}, {"kind": "work", "title": "Employment and free-speech law", "line": "Employment lawyers, ombudspeople and workplace investigators, roles that tend to grow when firings over opinions lead to disputes and lawsuits.", "guide": {"what": "Lawyers, ombudspeople and workplace investigators who handle disputes when people are disciplined or fired over what they said, at work or online.", "why": "The 1919 Palmer Raids led to the ACLU's founding in 1920, and in 2022 the campus group FIRE widened its free-speech work nationwide. Firings over opinions often end in disputes, which may keep these roles in demand.", "how": ["Ask an employment lawyer or ombudsperson how they got into the field.", "Read your country's main laws on employee speech and unfair dismissal.", "Look into training from the International Ombuds Association or a law school clinic."], "read": [{"title": "International Ombuds Association", "url": "https://www.ombudsassociation.org/"}, {"title": "FIRE: Foundation for Individual Rights and Expression", "url": "https://www.fire.org/"}]}}, {"kind": "learn", "title": "Speech rights and digital footprints", "line": "What laws protect off-duty speech where you live, and how employer and visa social media screening works.", "guide": {"what": "Knowing which laws protect what you say off duty, how employers and visa officers may review your online history, and how to manage what you leave public.", "why": "Since 2019 the US has asked most visa applicants for their social media handles, and in 2025 it told student applicants to make profiles public. Some US states protect off-duty political activity. Such checks may spread.", "how": ["Search your own name and review what an employer or visa officer could see.", "Read EFF's Surveillance Self-Defense guides on privacy and social media.", "Look up whether your state or country protects off-duty speech or political activity."], "read": [{"title": "EFF: Surveillance Self-Defense", "url": "https://ssd.eff.org/"}, {"title": "ACLU: Free Speech", "url": "https://www.aclu.org/issues/free-speech"}]}}], "watch": "Job, visa or loan decisions based on automated scans of online history, and new laws that protect or restrict off-duty speech."}}, {"id": "suez", "theme": "A blocked sea route sends ships around Africa", "rhyme": 2, "then": {"year": 1956, "short": "Suez Crisis", "title": "The Suez Crisis", "where": "Suez Canal, Egypt", "region": "mideast", "hook": "The 1956 fight over the Suez Canal that humbled Britain and France.", "text": "After Egypt's President Gamal Abdel Nasser nationalized the Suez Canal Company in July 1956, Israel, Britain and France attacked in late October. Egypt sank dozens of ships to block the canal, which stayed closed until April 1957. Oil tankers had to sail around Africa's Cape of Good Hope."}, "now": {"year": 2024, "short": "Red Sea Crisis", "title": "Houthi Attacks in the Red Sea", "where": "Red Sea, off Yemen", "region": "mideast", "hook": "Early 2024: container ships turning away from the Red Sea to sail around Africa.", "text": "From November 2023, Yemen's Houthi movement attacked ships in the Red Sea with missiles and drones, saying it acted in support of Palestinians in Gaza. Through 2024, most large container lines avoided the Suez route, sailing around the Cape of Good Hope and adding one to two weeks."}, "followed": "Under heavy pressure from the US and the Soviet Union, the invaders withdrew. The UN deployed its first peacekeeping force, and British Prime Minister Anthony Eden resigned in January 1957.", "next": {"short": "Choke Point", "title": "Another chokepoint closes to shipping", "text": "Around 2092, a narrow sea lane such as the Strait of Malacca or a new Arctic route might be shut by war or swarms of drones. Ships could detour for weeks, pushing up prices worldwide.", "watch": "Cheap missiles and drones in the hands of small armed groups, insurers pulling out of key waterways, and navies escorting merchant ships."}, "breaks": "In 1956 states fought over who controlled the canal, while in 2024 a Yemeni armed movement attacked ships far to the south, and the canal itself stayed open.", "topic": "power", "echoes": [{"year": 1498, "short": "Cape Route", "title": "Vasco da Gama sails around Africa", "region": "world", "line": "To bypass Venice and Egypt’s hold on the Red Sea spice route, Portugal’s Vasco da Gama sailed around Africa and reached India."}, {"year": 1940, "short": "Cape Route 1940", "title": "Italy’s war entry closes the Mediterranean", "region": "europe", "line": "After Italy entered the war, most Allied shipping to the Middle East was diverted around the Cape of Good Hope until 1943."}, {"year": 1967, "short": "Canal Shut", "title": "The Suez Canal closes for eight years", "region": "mideast", "line": "The Six-Day War closed the Suez Canal until 1975, trapping a fleet of cargo ships and sending tankers around Africa."}, {"year": 2021, "short": "Ever Given", "title": "The Ever Given blocks Suez", "region": "mideast", "line": "The giant container ship Ever Given wedged across the Suez Canal for six days, and some ships detoured around Africa instead."}], "opp": {"lastTime": "After the 1956 closure, owners ordered tankers too big for the canal, many from Japanese yards, which made the Cape route pay. In 2024, Asia-Europe container rates more than tripled and Red Sea war-risk insurance premiums rose about tenfold.", "ideas": [{"kind": "build", "title": "Detour and delay planning tools", "line": "Tools that model detours, delays and insurance costs so smaller importers can plan around a blocked chokepoint.", "guide": {"what": "Software that shows importers how a blocked sea route changes their delivery times, freight costs and insurance, so they can reorder early or switch routes.", "why": "In 1956, tankers sailed around Africa while the canal was blocked. In 2024, Red Sea attacks sent ships the same way, Asia-Europe container rates more than tripled and war-risk premiums rose about tenfold. Small importers may need simple planning tools.", "how": ["Explore the IMF's free PortWatch site to see how chokepoint traffic changed in 2024.", "Ask three small importers how the Red Sea detour affected their stock and cash.", "Build a spreadsheet that recalculates landed cost when a voyage takes two weeks longer."], "read": [{"title": "IMF PortWatch", "url": "https://portwatch.imf.org/"}, {"title": "UNCTAD: Review of Maritime Transport 2024", "url": "https://unctad.org/publication/review-maritime-transport-2024"}]}}, {"kind": "build", "title": "Overland routes around chokepoints", "line": "Rail, road and pipeline links that bypass sea chokepoints, like Egypt's SUMED oil pipeline, planned after the canal's 1967 closure.", "guide": {"what": "Rail, road and pipeline links that let goods or oil avoid narrow sea lanes, such as Egypt's SUMED pipeline, which carries oil from the Red Sea to the Mediterranean.", "why": "After the canal closed again in 1967, Egypt planned SUMED, which opened in 1977. Red Sea attacks since 2023 and risks at other straits may renew interest in overland links, though they are costly and slow to build.", "how": ["Read the EIA's guide to world oil chokepoints and the pipelines that bypass them.", "Compare cost and time for one shipment by sea, rail and road using freight quotes.", "Ask a logistics firm about demand for rail freight between Asia and Europe."], "read": [{"title": "EIA: World Oil Transit Chokepoints", "url": "https://www.eia.gov/international/analysis/special-topics/World_Oil_Transit_Chokepoints"}]}}, {"kind": "work", "title": "Supply chain risk and maritime security", "line": "Supply chain risk analysts, freight planners and maritime security staff, roles that tend to be needed when a sea lane closes.", "guide": {"what": "Analysts who map where a firm's goods travel and plan for disruption, plus maritime security staff who assess threats to ships and advise on routes and protection.", "why": "In 1956 and again in 2024, a blocked route sent ships around Africa. Cheap drones and missiles now let small armed groups threaten shipping, so firms and insurers may need more people who can read these risks.", "how": ["Read the IMO's pages on maritime security and threats to shipping.", "Ask a freight forwarder or insurer how they decided whether to avoid the Red Sea.", "Map one product's route from factory to shelf and mark every chokepoint it passes."], "read": [{"title": "IMO: Maritime Security", "url": "https://www.imo.org/en/OurWork/Security/Pages/Default.aspx"}, {"title": "UNCTAD: Review of Maritime Transport 2024", "url": "https://unctad.org/publication/review-maritime-transport-2024"}]}}, {"kind": "learn", "title": "Chokepoints and shipping economics", "line": "How sea chokepoints, freight rates, transit times and marine insurance connect, so you can read a shipping shock early.", "guide": {"what": "How narrow sea lanes, freight rates, sailing times and marine insurance fit together, and why a closure in one strait can raise prices far away.", "why": "After the 1956 closure, owners ordered tankers too big for the canal, making the Cape route pay. In 2024 freight rates and insurance spiked again. Knowing how these parts connect may help you read the next shock early.", "how": ["Read the EIA's overview of world oil transit chokepoints.", "Follow a weekly container freight rate index for a month and note what moves it.", "Read the opening chapters of Martin Stopford's textbook Maritime Economics."], "read": [{"title": "Martin Stopford, Maritime Economics (Routledge)", "url": "https://www.routledge.com/Maritime-Economics/Stopford/p/book/9780415275583"}, {"title": "EIA: World Oil Transit Chokepoints", "url": "https://www.eia.gov/international/analysis/special-topics/World_Oil_Transit_Chokepoints"}]}}], "watch": "War-risk premiums for key straits, navies escorting merchant ships, and big container lines announcing a return to or exit from a route."}}, {"id": "sputnik", "theme": "A rival's breakthrough jolts America into a race", "rhyme": 2, "then": {"year": 1957, "short": "Sputnik", "title": "Sputnik Shocks America", "where": "Baikonur, Soviet Union", "region": "russia", "hook": "The beeping Soviet satellite that convinced Americans they were losing the space race.", "text": "On 4 October 1957, the Soviet Union launched Sputnik 1, the first artificial satellite, an 84-kilogram metal ball that circled Earth every 96 minutes. Radio stations and amateurs around the world picked up its beeps. Many Americans feared their country had fallen behind in science and missiles."}, "now": {"year": 2025, "short": "DeepSeek", "title": "DeepSeek's “Sputnik Moment”", "where": "Hangzhou, China", "region": "china", "hook": "January 2025: a Chinese AI app called DeepSeek topping charts and rattling Wall Street.", "text": "On 20 January 2025, Chinese startup DeepSeek released R1, a free AI model that rivaled leading American systems and, the company said, cost far less to train. Investor Marc Andreessen called it “AI's Sputnik moment”. On 27 January, Nvidia lost about $590 billion in market value, a one-day record."}, "followed": "The US founded NASA in 1958 and poured money into science teaching through the National Defense Education Act. The space race peaked with Americans walking on the Moon in July 1969.", "next": {"short": "Next Sputnik", "title": "A rival's leap sparks a race", "text": "Around 2093, a rival might suddenly leap ahead in a technology seen as decisive, perhaps fusion power or quantum computing. The shock could set off a new national race in labs, schools and budgets.", "watch": "Surprise breakthroughs from unexpected labs, sharp drops in tech stocks, and governments launching crash programs in science and education."}, "breaks": "Sputnik was a state project that beat America to a world first, while DeepSeek, a private startup, caught up with existing US models at lower reported cost.", "topic": "power", "echoes": [{"year": -260, "short": "Rome’s Navy", "title": "Rome races to build a navy", "region": "europe", "line": "According to Polybius, Rome, a land power outmatched at sea by Carthage, copied a stranded Carthaginian warship and built 120 warships."}, {"year": 1949, "short": "Soviet A-Bomb", "title": "The Soviets test an atomic bomb", "region": "russia",
