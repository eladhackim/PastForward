lombia broke apart as Venezuela and Ecuador left, and Simón Bolívar died near Santa Marta in December. Uruguay adopted its first constitution.", "europe": "France’s July Revolution replaced King Charles X with Louis-Philippe, and Belgians rose against Dutch rule in August. In England, farm workers smashed threshing machines in the Swing Riots.", "russia": "In November, Polish cadets in Warsaw rose against Tsar Nicholas I, starting the November Uprising. A cholera epidemic reached Moscow, and quarantine trapped Pushkin on his Boldino estate.", "mideast": "France landed troops in Ottoman Algeria in June and took Algiers on 5 July, beginning 132 years of French rule. In February the great powers recognised Greek independence.", "africa": "Brothers Richard and John Lander traced the Niger River to its delta, settling where it met the sea. Dingane, who had killed Shaka in 1828, ruled the Zulu kingdom.", "india": "Reformer Ram Mohan Roy sailed for Britain as the Mughal emperor’s envoy, a year after Lord Bentinck outlawed sati, the burning of widows, in Bengal.", "china": "In Japan, about five million people joined the okage mairi, a mass pilgrimage to the Ise shrines. In Qing China, silver flowed out as opium imports kept rising."}, "1845": {"us": "James K. Polk became president, Florida became a state, and Texas joined in December. Frederick Douglass published his Narrative, and the phrase “manifest destiny” entered print.", "latam": "Britain and France blockaded the River Plate against Argentina’s ruler Juan Manuel de Rosas, battling his forces at Vuelta de Obligado. Mexico broke off relations with the US over Texas.", "europe": "Potato blight struck Ireland in September, beginning a famine that would kill about a million people. Sir John Franklin sailed to find the Northwest Passage and never returned.", "russia": "In the Caucasus, Mikhail Vorontsov’s army captured Imam Shamil’s stronghold at Dargo but lost thousands on the retreat. The Russian Geographical Society was founded in St Petersburg.", "mideast": "In French Algeria, troops under Colonel Pélissier suffocated hundreds of villagers sheltering in the Dahra caves. In Ottoman Mount Lebanon, Druze–Maronite fighting flared again.", "africa": "British and French warships shelled Tamatave after Madagascar’s Queen Ranavalona I ordered foreign traders to obey local law or leave. Her forces drove off the landing party.", "india": "In December the Sikh Khalsa army crossed the Sutlej, starting the First Anglo-Sikh War, with bloody battles at Mudki and Ferozeshah. Denmark sold Tranquebar and its other Indian posts to Britain.", "china": "Shanghai’s new Land Regulations set aside a British settlement, seed of the later International Settlement. In Japan, Abe Masahiro took charge of the shogun’s senior council."}, "1848": {"us": "Gold was found at Sutter’s Mill in California, and a February treaty ending the Mexican War handed the US a vast territory. The Seneca Falls Convention demanded women’s rights.", "latam": "Mexico confirmed the loss of about half its territory, including Texas, to the United States. France abolished slavery in Martinique and Guadeloupe, and Maya rebels in Yucatán’s Caste War nearly took Mérida.", "europe": "Revolutions shook France, the German states, the Austrian Empire and Italy. Marx and Engels published The Communist Manifesto, and Louis-Napoléon Bonaparte was elected French president.", "russia": "Nicholas I kept the revolutions out, sending troops to crush uprisings in Moldavia and Wallachia. A cholera epidemic killed hundreds of thousands across the empire.", "mideast": "In Iran, 17-year-old Naser al-Din Shah took the throne as the Babi movement spread. In Egypt, Ibrahim Pasha replaced his ailing father Muhammad Ali but died within months.", "africa": "Joseph Jenkins Roberts became the first president of independent Liberia. In southern Africa, Governor Harry Smith annexed the lands beyond the Orange River and defeated Boers at Boomplaats.", "india": "Lord Dalhousie arrived as governor-general and annexed Satara using the “doctrine of lapse”. A revolt at Multan in April grew into the Second Anglo-Sikh War.", "china": "In Guangxi, Hong Xiuquan’s God Worshipping Society was gaining followers, three years before the Taiping Rebellion. In Japan, American Ranald MacDonald slipped ashore and taught English to Nagasaki interpreters."}, "1858": {"us": "Abraham Lincoln and Stephen Douglas debated slavery seven times in their Illinois Senate race, which Douglas won. Minnesota became the 32nd state.", "latam": "Mexico’s Reform War began in January, pitting Benito Juárez’s liberals against a conservative government in Mexico City. Juárez set up his government in Veracruz.", "europe": "London’s “Great Stink” from the sewage-filled Thames pushed Parliament to fund new sewers. In France, Bernadette Soubirous reported visions at Lourdes, and Napoleon III secretly agreed to back Piedmont against Austria.", "russia": "In the Treaty of Aigun, Qing China ceded the north bank of the Amur to Russia. At home, noble committees set up by Alexander II debated how to free the serfs.", "mideast": "The Ottoman Land Code required farmland to be registered, reshaping rural ownership. Ferdinand de Lesseps launched the Suez Canal Company, and Kisrawan peasants in Mount Lebanon rose against their lords.", "africa": "John Hanning Speke reached the lake he named Victoria and declared it the Nile’s source. Moshoeshoe’s Basotho fought off the Orange Free State, and David Livingstone began his Zambezi expedition.", "india": "After the 1857 uprising, the British Crown took over from the East India Company. Rani Lakshmibai of Jhansi died fighting in June, and the last Mughal emperor was exiled to Rangoon.", "china": "Losing the Second Opium War, Qing China signed the Treaties of Tianjin, opening new ports. Japan signed a trade treaty with the US, and chief minister Ii Naosuke began purging critics."}, "1859": {"us": "Edwin Drake struck oil in Titusville, Pennsylvania, in August. In October John Brown raided the federal arsenal at Harpers Ferry to spark a slave revolt, and was hanged in December.", "latam": "From Veracruz, Benito Juárez issued the Reform Laws, nationalising Church property and creating civil marriage. In Argentina, the Confederation defeated Buenos Aires at Cepeda, pushing it to rejoin.", "europe": "Charles Darwin published On the Origin of Species in November. France and Piedmont defeated Austria at Magenta and Solferino, where the carnage later moved Henry Dunant to found the Red Cross.", "russia": "Imam Shamil, who had led North Caucasus resistance for 25 years, surrendered to Russian forces at Gunib. In St Petersburg, editorial commissions began drafting the emancipation of the serfs.", "mideast": "Work on the Suez Canal began at the site of Port Said in April. In October, Spain declared war on Morocco over clashes near Ceuta.", "africa": "David Livingstone’s expedition reached Lake Malawi in September. In Abeokuta, missionary Henry Townsend launched Iwe Irohin, often called Nigeria’s first newspaper, printed in Yoruba.", "india": "Rebel leader Tantia Tope was betrayed, captured and hanged in April, ending the last campaign of 1857’s uprising. In Bengal, peasants began the Indigo Revolt against European planters.", "china": "Qing guns at the Taku Forts drove off a British and French fleet in June. Japan opened Yokohama to foreign trade, and the Ansei Purge executed the teacher Yoshida Shōin."}, "1871": {"us": "The Great Chicago Fire killed about 300 people in October, and the same night a forest fire at Peshtigo, Wisconsin, killed over 1,200. The New York Times exposed Boss Tweed’s corruption.", "latam": "Brazil’s Law of Free Birth freed children born to enslaved mothers. Yellow fever killed about 14,000 people in Buenos Aires, and a liberal revolution took power in Guatemala.", "europe": "Wilhelm I was proclaimed German emperor at Versailles in January, and defeated France gave up Alsace and part of Lorraine. Rome became the capital of united Italy.", "russia": "A London conference let Russia station warships on the Black Sea again, undoing part of its Crimean War defeat. Dostoevsky began publishing Demons, inspired by the Nechayev affair.", "mideast": "In Algeria, Cheikh El Mokrani led a large Kabyle revolt against French rule, which was crushed. Iran was in the grip of a devastating famine.", "africa": "Henry Morton Stanley found David Livingstone at Ujiji on Lake Tanganyika. Diggers swarmed the diamond fields at what became Kimberley, and Britain annexed them as Griqualand West.", "india": "The Criminal Tribes Act let British officials brand whole communities “criminal” by birth. In September, acting chief justice John Paxton Norman was stabbed to death in Calcutta.", "china": "Japan abolished its feudal domains for prefectures, and the Iwakura Mission left to study the West. US marines stormed forts on Korea’s Ganghwa Island, and Russia occupied China’s Ili valley."}, "1876": {"us": "Philadelphia hosted the Centennial Exhibition, and Lakota and Cheyenne warriors destroyed Custer’s command at the Little Bighorn. The Hayes–Tilden presidential election ended in bitter dispute.", "latam": "Porfirio Díaz rebelled under the Plan of Tuxtepec and seized Mexico City in November, beginning decades in power. Brazil’s Emperor Pedro II toured the US and tried Bell’s telephone.", "europe": "Ottoman forces crushed Bulgaria’s April Uprising, killing thousands, and Gladstone’s pamphlet on the “Bulgarian Horrors” stirred Britain. Wagner opened Bayreuth with the first complete Ring cycle.", "russia": "Russia annexed the Central Asian Khanate of Kokand, and Russian volunteers under General Chernyayev fought for Serbia. Radicals of the new Land and Liberty group staged a protest in St Petersburg.", "mideast": "The Ottoman Empire had three sultans in one year, and Abdul Hamid II proclaimed its first constitution in December. Bankrupt Egypt accepted a European-run debt commission.", "africa": "Emperor Yohannes IV’s Ethiopian army routed an invading Egyptian force at Gura in March. In Brussels, Belgium’s King Leopold II hosted a conference that began his Congo ambitions.", "india": "The monsoon failed in southern and western India, starting the Great Famine of 1876–78, which killed millions. Parliament gave Queen Victoria the title Empress of India.", "china": "Japan forced Korea to open ports under the Treaty of Ganghwa, and banned samurai from wearing swords. China’s first railway opened near Shanghai, and drought began a terrible famine in the north."}, "1883": {"us": "The Brooklyn Bridge opened in May, then the world’s longest suspension bridge. That autumn railroads adopted standard time zones, and the Supreme Court struck down the Civil Rights Act of 1875.", "latam": "Chile and Peru signed the Treaty of Ancón in October, ending the war between them and costing Peru nitrate-rich Tarapacá. In Brazil, activists formed the Abolitionist Confederation to end slavery.", "europe": "Germany passed Bismarck’s Health Insurance Law, the first national sickness insurance scheme. Karl Marx died in London in March, and Nietzsche published the first part of “Thus Spoke Zarathustra.”", "russia": "Alexander III was crowned in Moscow in May, two years after his father’s assassination, and pressed a conservative crackdown. In Geneva, Georgi Plekhanov founded the first Russian Marxist group.", "mideast": "Egypt was under British occupation, and Evelyn Baring arrived as consul-general. In Sudan, the Mahdi’s forces wiped out an Egyptian army under Hicks Pasha at Shaykan in November.", "africa": "Paul Kruger became president of the Transvaal. On the coast of today’s Namibia, German merchant Adolf Lüderitz bought land at Angra Pequena, the seed of a German colony.", "india": "The Ilbert Bill, letting Indian judges try Europeans in some cases, sparked fierce protest from British residents against Viceroy Lord Ripon. Nationalists held an Indian National Conference in Calcutta.", "china": "France made Vietnam a protectorate in August and fought China-backed Black Flag forces in Tonkin, edging toward war with the Qing. In Tokyo, the Rokumeikan opened for Western-style balls."}, "1884": {"us": "Grover Cleveland won the presidency in November, the first Democrat elected since before the Civil War. In December workers set the capstone on the Washington Monument.", "latam": "Brazil’s province of Ceará abolished slavery in March, followed by Amazonas. Bolivia signed a truce leaving its coast to Chile, and Porfirio Díaz returned to Mexico’s presidency in December.", "europe": "Britain’s Third Reform Act gave the vote to most rural male householders, and the socialist Fabian Society was founded in London. In November, Bismarck opened the Berlin Conference on Africa.", "russia": "Russia annexed the Central Asian oasis of Merv, alarming Britain about India’s frontier. A new university statute ended university self-government as Alexander III tightened control.", "mideast": "Britain sent General Charles Gordon to Khartoum to evacuate Egyptian garrisons from Sudan. By spring the Mahdi’s forces had him under siege.", "africa": "Germany declared protectorates over South West Africa, Togoland and Cameroon. In November the Berlin Conference opened, speeding the European race for African land.", "india": "Lord Dufferin replaced Lord Ripon as viceroy in December. In Pune, Bal Gangadhar Tilak and fellow nationalists founded the Deccan Education Society to run Indian-led schools.", "china": "France and China fought openly: in August a French fleet destroyed China’s Fujian fleet at Fuzhou in under an hour. In Korea, pro-Japanese reformers’ Gapsin Coup collapsed after three days."}, "1890": {"us": "Idaho and Wyoming became states, Wyoming the first with women’s suffrage. On 29 December US troops killed about 250 to 300 Lakota at Wounded Knee.", "latam": "Argentina’s Revolution of the Park in July forced President Juárez Celman out, and its debts nearly sank London’s Barings bank. Brazil’s new republic was gripped by a speculative bubble, the Encilhamento.", "europe": "Kaiser Wilhelm II forced Bismarck to resign in March. Britain swapped the North Sea island of Heligoland to Germany for Zanzibar, and Vincent van Gogh died in France.", "russia": "Anton Chekhov crossed Siberia to study the penal colony on Sakhalin island. Heir Nicholas set off on a grand tour toward Asia, and a new law curbed the elected zemstvo councils.", "mideast": "Persia’s Naser al-Din Shah granted a British company a monopoly over the country’s tobacco, a deal that would spark mass protest. Sultan Abdul Hamid II ruled the Ottoman Empire from Istanbul.", "africa": "Cecil Rhodes became prime minister of the Cape Colony, and his Pioneer Column marched into Mashonaland, founding Fort Salisbury, today’s Harare. Zanzibar became a British protectorate.", "india": "Britain and China signed a convention in Calcutta recognizing Sikkim as a British protectorate. A trial over the death of child bride Phulmoni fueled debate on the age of consent.", "china": "Japan’s Meiji Constitution took effect, and the first Imperial Diet met in November after Japan’s first general election. In China, Zhang Zhidong began building the Hanyang Iron Works."}, "1898": {"us": "After the Maine blew up, the US fought Spain from April to August and annexed Hawaii in July. In November a white mob overthrew the elected government of Wilmington, North Carolina.", "latam": "US forces landed in Cuba and Puerto Rico, ending four centuries of Spanish rule there. In December’s Treaty of Paris, Spain gave up Cuba and ceded Puerto Rico to the US.", "europe": "Émile Zola’s “J’accuse…!” blew open the Dreyfus Affair in France. Germany passed its first Navy Law, Bismarck died in July, and an anarchist assassinated Austria’s Empress Elisabeth in Geneva.", "russia": "Marxists met in Minsk to found the Russian Social Democratic Labour Party. Russia leased Port Arthur from China, and the new Moscow Art Theatre staged Chekhov’s “The Seagull.”", "mideast": "Kaiser Wilhelm II toured the Ottoman Empire, riding into Jerusalem and visiting Saladin’s tomb in Damascus. On the Nile, an Anglo-Egyptian army crushed the Mahdist state at Omdurman.", "africa": "At Fashoda in Sudan, British and French forces faced off over the upper Nile, nearly causing war. In Sierra Leone, Bai Bureh led the Hut Tax War against British rule.", "india": "Bubonic plague, raging since 1896, spread from Bombay to Calcutta, and harsh British controls provoked anger. In December, Swami Vivekananda consecrated Belur Math near Calcutta.", "china": "The Guangxu Emperor’s Hundred Days’ Reform ended in September when Empress Dowager Cixi took control. Germany, Russia and Britain seized leases, including Hong Kong’s New Territories for 99 years."}, "1906": {"us": "An earthquake and fires destroyed much of San Francisco in April. After Upton Sinclair’s “The Jungle,” Congress passed the Pure Food and Drug Act and the Meat Inspection Act.", "latam": "The US occupied Cuba again in September after a revolt, and an earthquake devastated Valparaíso, Chile. In Mexico, a strike at the Cananea copper mine was crushed.", "europe": "Liberals won a British landslide, and 29 Labour MPs entered Parliament. France cleared Alfred Dreyfus, and the Algeciras Conference settled a Franco-German crisis over Morocco.", "russia": "Russia’s first elected parliament, the State Duma, opened in May and was dissolved after ten weeks. New prime minister Pyotr Stolypin launched land reforms and field courts against revolutionaries.", "mideast": "Protests forced Persia’s shah to grant a constitution, and the first Majlis met in October. In Egypt, British courts hanged four villagers after the Denshawai incident, stirring nationalist anger.", "africa": "Zulu chief Bambatha led a revolt against a poll tax in Natal, crushed with heavy loss of life. In German East Africa, the Maji Maji uprising was being brutally suppressed.", "india": "The All-India Muslim League was founded in Dhaka in December. Bengalis boycotted British goods over the partition of Bengal, and Dadabhai Naoroji called for swaraj, self-rule.", "china": "The Qing court announced it would prepare for a constitution, a year after abolishing the old civil service exams. Japan founded the South Manchuria Railway Company."}, "1907": {"us": "A banking panic in October was calmed when J.P. Morgan organized a rescue. Oklahoma became a state, and the Great White Fleet set off around the world in December.", "latam": "In Chile, soldiers massacred striking nitrate miners and their families at a school in Iquique in December. Central American states met in Washington and created a Central American Court of Justice.", "europe": "Britain and Russia settled their rivalry in the Anglo-Russian Convention, forming the Triple Entente with France. Delegates met at the Second Hague Peace Conference, and Picasso painted “Les Demoiselles d’Avignon.”", "russia": "In June, Stolypin dissolved the Second Duma and rewrote election rules to favor landowners. Russia and Britain settled their Asian rivalry in the Anglo-Russian Convention.", "mideast": "The Anglo-Russian Convention split Persia into Russian and British spheres without asking Persians. In Egypt, Lord Cromer retired, and Mustafa Kamil founded the Nationalist Party.", "africa": "In the Transvaal, Mohandas Gandhi led Indians in resisting the “Black Act” requiring them to register. In German East Africa, the Maji Maji rebellion ended after famine killed tens of thousands.", "india": "The Indian National Congress split between moderates and radicals at its Surat session. Punjab leader Lala Lajpat Rai was deported to Mandalay, and Tata Iron and Steel was founded.", "china": "Revolutionary Qiu Jin was executed by the Qing in July. Japan forced Korea’s Emperor Gojong to abdicate and disbanded the Korean army."}, "1908": {"us": "William Howard Taft won the presidential election, and the Bureau of Investigation, forerunner of the FBI, was founded. Orville Wright demonstrated his airplane to the Army at Fort Myer.", "latam": "Juan Vicente Gómez seized power in Venezuela in December, starting a 27-year rule. In Mexico, Porfirio Díaz told a US journalist the country was ready for democracy.", "europe": "Austria-Hungary annexed Bosnia and Herzegovina, enraging Serbia, and Bulgaria declared full independence. London hosted the Olympic Games, and Wilbur Wright amazed crowds flying in France.", "russia": "On 30 June a huge explosion, likely an incoming meteor or comet, flattened about 2,000 square km of forest near Tunguska, Siberia. Russia was humiliated in the Bosnian crisis.", "mideast": "The Young Turk Revolution forced Sultan Abdul Hamid II to restore the constitution. In Persia, British prospectors struck oil at Masjed Soleyman, and the Hejaz Railway reached Medina.", "africa": "Belgium annexed the Congo Free State from King Leopold II after reports of mass atrocities. Delegates from four British colonies met to plan a Union of South Africa.", "india": "Bal Gangadhar Tilak was jailed for six years in Mandalay for sedition. Eighteen-year-old Khudiram Bose was hanged after a bomb attack in Muzaffarpur.", "china": "The Guangxu Emperor and Empress Dowager Cixi died a day apart in November. Puyi, aged two, became the last Qing emperor."}, "1912": {"us": "Woodrow Wilson won a four-way presidential race against Taft, Theodore Roosevelt and Eugene Debs. New Mexico and Arizona became states, and textile workers struck in Lawrence, Massachusetts.", "latam": "US Marines landed in Nicaragua to prop up its government. Argentina’s Sáenz Peña Law brought secret, compulsory male voting, and Mexico’s President Madero fought off rebellions.", "europe": "Stockholm hosted the Summer Olympics. In October, Serbia, Bulgaria, Greece and Montenegro attacked the Ottoman Empire in the First Balkan War, seizing most of its European lands.", "russia": "Troops fired on striking workers at the Lena goldfields in Siberia, killing or wounding hundreds and sparking strikes nationwide. The Bolsheviks launched their newspaper Pravda in St. Petersburg.", "mideast": "Italy took Libya from the Ottoman Empire in the Treaty of Ouchy in October, as Balkan armies advanced on Istanbul. France made Morocco a protectorate under the Treaty of Fez.", "africa": "In January, Black leaders meeting in Bloemfontein founded the South African Native National Congress, later the ANC. Frederick Lugard returned to Nigeria to merge its northern and southern protectorates.", "india": "Delhi became the new capital of British India in place of Calcutta. In December a bomb wounded Viceroy Lord Hardinge as he rode an elephant into Delhi.", "china": "The last Qing emperor, Puyi, abdicated in February, ending over 2,000 years of imperial rule, and Yuan Shikai became president. In Japan, Emperor Meiji died, opening the Taishō era."}, "1916": {"us": "Pancho Villa raided Columbus, New Mexico, and US troops chased him into Mexico. Wilson won reelection on “He kept us out of war,” and Montana elected Jeannette Rankin, the first congresswoman.", "latam": "US Marines occupied the Dominican Republic, staying until 1924. Argentina held its first presidential election by secret ballot and chose Hipólito Yrigoyen of the Radical Civic Union.", "europe": "Germany and France bled at Verdun for ten months, and the British and German fleets clashed off Jutland. In Dublin, Irish republicans launched the Easter Rising.", "russia": "General Brusilov’s summer offensive smashed Austro-Hungarian lines but cost huge losses. In December, nobles murdered Rasputin, the mystic who influenced the royal family.", "mideast": "Sharif Hussein of Mecca launched the Arab Revolt against Ottoman rule in June. In April, a besieged British-Indian army surrendered to the Ottomans at Kut in Mesopotamia.", "africa": "Allied troops under Jan Smuts pushed into German East Africa against Paul von Lettow-Vorbeck’s forces. In Ethiopia, Lij Iyasu was deposed, and Zewditu became empress with Ras Tafari as regent.", "india": "Congress and the Muslim League agreed the Lucknow Pact, a joint demand for self-government. Tilak and Annie Besant founded Home Rule Leagues, while Indian troops fought in Mesopotamia.", "china": "Yuan Shikai tried to make himself emperor, gave up after provinces revolted, and died in June. China slid into the warlord era."}, "1918": {"us": "Wilson set out his Fourteen Points for peace in January. Over a million US troops fought in the Meuse-Argonne Offensive, and Congress passed the Sedition Act, curbing criticism of the war.", "latam": "Students in Córdoba, Argentina, launched a university reform movement that spread across Latin America. Brazil, the only South American country at war, sent a naval squadron and doctors to Europe.", "europe": "Germany’s spring offensive failed, and the Armistice ended the fighting on 11 November. The Kaiser abdicated, Austria-Hungary broke apart, and many British women over 30 gained the vote.", "russia": "The Bolsheviks signed the Treaty of Brest-Litovsk with Germany in March, giving up vast lands, and moved the capital to Moscow. Civil war spread, and the royal family was shot in July.", "mideast": "British and Arab forces took Damascus in October, and the Ottoman Empire signed the Armistice of Mudros on 30 October, ending its war. Allied ships soon anchored off Istanbul.", "africa": "The Spanish flu spread along ports and railways, killing an estimated 300,000 in South Africa alone. Lettow-Vorbeck’s German force surrendered in Northern Rhodesia two weeks after the Armistice.", "india": "Influenza killed an estimated 12 million or more Indians, the highest toll anywhere. Gandhi led protests in Kheda and Ahmedabad, and the Montagu-Chelmsford Report proposed limited self-rule.", "china": "In Japan, soaring rice prices sparked riots, and Hara Takashi became the first commoner prime minister. Japan sent troops into Siberia, and in China Lu Xun published “A Madman’s Diary.”"}, "1923": {"us": "President Warren Harding died in August, and Calvin Coolidge was sworn in by his father by lamplight in Vermont. Time magazine launched, and the Hollywoodland sign went up.", "latam": "Pancho Villa was assassinated in July. Mexico and the US signed the Bucareli Agreements, and Washington recognized Álvaro Obregón’s government.", "europe": "General Primo de Rivera seized power in Spain in September. In Munich, Adolf Hitler’s Beer Hall Putsch failed in November, and the Irish Civil War ended in May.", "russia": "Lenin was disabled by a stroke in March, and a power struggle grew among Stalin, Trotsky and others. The new Soviet Union approved its first constitution.", "mideast": "The Treaty of Lausanne set Turkey’s borders, and on 29 October Mustafa Kemal proclaimed the Republic of Turkey with Ankara as capital. Egypt adopted a constitution under King Fuad.", "africa": "Ethiopia joined the League of Nations, and Southern Rhodesia’s white settlers gained self-government. In Kenya, a British white paper declared African interests paramount.", "india": "C. R. Das and Motilal Nehru launched the Swaraj Party to contest elections and fight British rule from inside the councils, while Gandhi sat in prison.", "china": "The Great Kantō earthquake on 1 September destroyed much of Tokyo and Yokohama, killing over 100,000. In China, Sun Yat-sen allied with the Soviet Union to rebuild his Nationalist party."}, "1929": {"us": "Herbert Hoover took office in March, a month after Chicago's St. Valentine's Day Massacre. In October the stock market crashed, ending the Roaring Twenties boom.", "latam": "Mexico's Cristero War ended, and Plutarco Elías Calles founded the National Revolutionary Party, forerunner of the PRI. Chile and Peru settled their long Tacna–Arica border dispute.", "europe": "Mussolini's Italy and the Holy See signed the Lateran Treaty, creating Vatican City. Ramsay MacDonald formed Britain's second Labour government, and experts drew up the Young Plan to ease German reparations.", "russia": "Stalin expelled his rival Leon Trotsky from the Soviet Union. In December he called for “liquidating the kulaks as a class”, unleashing forced collectivization of the countryside.", "mideast": "In British-ruled Palestine, riots in August killed about 250 Jews and Arabs, including a massacre of Jews in Hebron. In Arabia, Ibn Saud crushed the Ikhwan revolt at Sabilla.", "africa": "In southeastern Nigeria, thousands of Igbo women rose against British-appointed chiefs and rumored taxes in the Women's War. Jomo Kenyatta went to London to press Kikuyu land grievances.", "india": "Bhagat Singh threw low-power bombs into Delhi's Central Legislative Assembly in April. In December, the Congress under Jawaharlal Nehru demanded Purna Swaraj, complete independence from Britain.", "china": "Chiang Kai-shek's Nationalists ruled from Nanjing, where Sun Yat-sen was reburied in a vast mausoleum. A clash over the Chinese Eastern Railway brought Soviet troops into Manchuria."}, "1930": {"us": "Hoover signed the Smoot–Hawley Tariff in June as unemployment climbed. Clyde Tombaugh discovered Pluto, and in December the Bank of United States collapsed in New York.", "latam": "Uruguay hosted and won the first football World Cup. Coups ousted Argentina's President Hipólito Yrigoyen and brought Getúlio Vargas to power in Brazil.", "europe": "In September elections, Hitler's Nazis jumped from 12 to 107 Reichstag seats. Chancellor Heinrich Brüning governed by emergency decree, and the last Allied troops left the Rhineland.", "russia": "Forced collectivization herded peasants onto collective farms, and families branded kulaks were deported east. Stalin's article “Dizzy with Success” briefly slowed the drive, and the Gulag was founded.", "mideast": "Britain signed a treaty promising Iraq independence. Turkey made “Istanbul” the city's official name and let women vote in local elections, while Egypt's Ismail Sidqi replaced the constitution.", "africa": "Ras Tafari was crowned Emperor Haile Selassie of Ethiopia in November. In Liberia, a League of Nations report on forced labor led President Charles King to resign.", "india": "Gandhi's 24-day Salt March to Dandi defied British law and sparked mass civil disobedience. Tens of thousands were jailed, and London hosted the first Round Table Conference.", "china": "Chiang Kai-shek defeated rival warlords in the Central Plains War, which left hundreds of thousands of casualties. In Japan, Prime Minister Hamaguchi Osachi was shot after accepting the London Naval Treaty."}, "1933": {"us": "Franklin D. Roosevelt took office in March, declared a national bank holiday and pushed a burst of New Deal laws through Congress in his first Hundred Days. Prohibition ended in December.", "latam": "A general strike toppled Cuban dictator Gerardo Machado, and Sergeant Fulgencio Batista rose to power in September's Sergeants' Revolt. Bolivia and Paraguay kept fighting the Chaco War.", "europe": "Hitler became German chancellor on 30 January. After the Reichstag fire, the Enabling Act let him rule by decree, and Dachau concentration camp opened in March.", "russia": "Famine killed millions across the Soviet Union, above all in Ukraine and Kazakhstan, as grain was seized from villages. In November the United States formally recognized the Soviet government.", "mideast": "Saudi Arabia granted an oil concession to Standard Oil of California. In newly independent Iraq, the army massacred Assyrian villagers at Simele, and King Faisal I died in September.", "africa": "In South Africa, rivals J.B.M. Hertzog and Jan Smuts formed a coalition government. Godfrey Huggins became prime minister of white-ruled Southern Rhodesia, a post he held for two decades.", "india": "Student Choudhry Rahmat Ali coined the name “Pakistan” in a pamphlet written in Cambridge. Gandhi launched his weekly Harijan and fasted for 21 days in his campaign against untouchability.", "china": "Japan seized Rehe province and quit the League of Nations over criticism of its Manchurian takeover. Chiang Kai-shek launched his fifth campaign against the Communists' Jiangxi base."}, "1935": {"us": "Roosevelt signed the Social Security Act and the Wagner Act protecting unions, and the new WPA put millions to work. Senator Huey Long was assassinated in Louisiana in September.", "latam": "The Chaco War ended in a ceasefire favoring Paraguay. Tango star Carlos Gardel died in a plane crash in Medellín, and Venezuela's longtime dictator Juan Vicente Gómez died in December.", "europe": "The Saar voted to rejoin Germany, and Hitler restored military conscription in defiance of the Versailles treaty. In September the Nuremberg Laws stripped German Jews of citizenship.", "russia": "The Moscow Metro opened in May. Miner Alexei Stakhanov's record coal shift launched a campaign to boost output, while arrests spread after the murder of party boss Sergei Kirov.", "mideast": "Reza Shah asked foreign governments to call Persia “Iran”. In British Palestine, police killed the militant preacher Izz ad-Din al-Qassam, whose death helped spark the 1936 Arab revolt.", "africa": "Mussolini's Italy invaded Ethiopia in October, and the League of Nations imposed limited sanctions. In Northern Rhodesia, African miners on the Copperbelt struck over a sudden tax increase.", "india": "An earthquake destroyed Quetta in May, killing tens of thousands. Britain passed the Government of India Act, promising elected provincial governments, and the Reserve Bank of India opened.", "china": "Mao Zedong gained a leading role at the Zunyi Conference, and the Red Army's Long March ended in Shaanxi in October. In December, students in Peiping (Beijing) protested Japanese encroachment."}, "1938": {"us": "Superman debuted in Action Comics, and Joe Louis knocked out Max Schmeling in one round. The Fair Labor Standards Act set the first federal minimum wage, 25 cents an hour.", "latam": "Mexican President Lázaro Cárdenas nationalized foreign oil companies on 18 March, creating the state firm Pemex. In Brazil, Getúlio Vargas's dictatorship crushed an attempted coup by the fascist Integralists.", "europe": "Germany annexed Austria in March and took the Sudetenland after the Munich Agreement. On Kristallnacht in November, Nazi mobs attacked Jews, synagogues and shops across Germany.", "russia": "Nikolai Bukharin was convicted in the last Moscow show trial and shot. Soviet troops fought Japan at Lake Khasan, and Lavrentiy Beria took over the NKVD as the purge wound down.", "mideast": "Drillers struck oil at Dammam in Saudi Arabia and at Burgan in Kuwait. Turkey's founder Mustafa Kemal Atatürk died on 10 November, and the Arab revolt raged on in Palestine.", "africa": "Afrikaners marked the centenary of the Great Trek with an ox-wagon trek across South Africa, fueling nationalism. Jomo Kenyatta published “Facing Mount Kenya”, a study of Kikuyu life.", "india": "Subhas Chandra Bose became Congress president at the Haripura session, urging a tougher line against British rule. Congress ministries, elected in 1937, governed most of India's provinces.", "china": "Nationalist forces won at Taierzhuang, then breached the Yellow River dikes to slow Japan, a flood that killed hundreds of thousands. After Wuhan fell in October, the government retreated to Chongqing."}, "1939": {"us": "Marian Anderson sang at the Lincoln Memorial after being barred from Constitution Hall, and the New York World's Fair opened. After war began in Europe, Congress allowed cash-and-carry arms sales.", "latam": "An earthquake destroyed Chillán, Chile, in January, killing about 28,000 people. In December the German warship Admiral Graf Spee was scuttled off Montevideo after the Battle of the River Plate.", "europe": "Germany seized Prague in March, and Franco won Spain's civil war. Germany invaded Poland on 1 September, and Britain and France declared war two days later.", "russia": "Stalin signed a pact with Hitler in August and invaded eastern Poland in September. Georgy Zhukov defeated Japan at Khalkhin Gol, and the Winter War with Finland began in November.", "mideast": "Britain's White Paper capped Jewish immigration to Palestine at 75,000 over five years. France ceded Hatay, part of its Syrian mandate, to Turkey, and Iraq's King Ghazi died in a car crash.", "africa": "South Africa's parliament voted 80 to 67 to join the war against Germany, and Prime Minister J.B.M. Hertzog, who wanted neutrality, gave way to Jan Smuts. Colonial armies began recruiting across Africa.", "india": "The viceroy declared India at war without consulting Indian leaders, and Congress provincial governments resigned in protest. Muhammad Ali Jinnah's Muslim League celebrated a “Day of Deliverance” from Congress rule.", "china": "Japanese bombers pounded the wartime capital Chongqing, killing thousands in May. Chinese forces held Changsha, while former Nationalist leader Wang Jingwei negotiated with Japan to head a collaborationist government."}, "1947": {"us": "Jackie Robinson broke baseball's color line with the Brooklyn Dodgers. The Truman Doctrine and Marshall Plan launched Cold War containment, and Chuck Yeager flew faster than sound.", "latam": "Argentina gave women the vote, a cause championed by Eva Perón, who also made a celebrated tour of Europe. Nations of the Americas signed the Rio Treaty, pledging mutual defense.", "europe": "Britain shivered through a brutal winter of fuel shortages. In June the US offered Marshall Plan aid, and Communists were forced out of the French and Italian governments.", "russia": "A postwar famine killed a million or more Soviet citizens. Stalin made Eastern Europe reject Marshall Plan aid and founded the Cominform to coordinate Europe's Communist parties.", "mideast": "The UN voted on 29 November to partition Palestine into Jewish and Arab states, and fighting broke out within days. Bedouin shepherds found the first Dead Sea Scrolls at Qumran.", "africa": "A revolt against French rule erupted in Madagascar in March; the French crackdown left tens of thousands dead. Kwame Nkrumah returned to the Gold Coast to organize a new nationalist party.", "india": "On 15 August, British India became independent as India and Pakistan. Partition uprooted about 15 million people and killed hundreds of thousands, and war over Kashmir began in October.", "china": "Civil war between Nationalists and Communists spread across China. In Taiwan, Nationalist troops crushed the February 28 uprising, and Japan's new pacifist constitution took effect in May."}, "1950": {"us": "Truman approved work on the hydrogen bomb and sent US troops to Korea in June. Senator Joseph McCarthy's anti-Communist crusade began, and Charles Schulz's Peanuts debuted.", "latam": "Uruguay stunned Brazil 2–1 at Rio's Maracanã stadium to win the World Cup before nearly 200,000 fans. In Guatemala, Jacobo Árbenz won the presidency promising land reform.", "europe": "On 9 May, France's Robert Schuman proposed pooling French and West German coal and steel, the seed of today's European Union. The European Convention on Human Rights was signed in November.", "russia": "Stalin and Mao signed a Sino-Soviet friendship treaty in Moscow. Stalin approved North Korea's invasion of the South, while Soviet diplomats boycotted the UN Security Council.", "mideast": "Israel passed the Law of Return, giving every Jew the right to immigrate, and Jordan annexed the West Bank. Egypt's Wafd party returned to power after January elections.", "africa": "South Africa passed the Population Registration and Group Areas acts, classifying people by race and segregating neighborhoods. In the Gold Coast, British authorities jailed Kwame Nkrumah after mass strikes.", "india": "India became a republic on 26 January as its new constitution took effect, with Rajendra Prasad as president. A magnitude 8.6 earthquake struck Assam and Tibet in August.", "china": "North Korea invaded the South on 25 June, and Chinese troops entered the war in October. Mao's new government launched land reform and sent the army into Tibet."}, "1956": {"us": "Eisenhower signed the act creating the Interstate Highway System and won re-election. Elvis Presley became a national sensation, and the Montgomery bus boycott ended after the Supreme Court struck down bus segregation.", "latam": "Fidel Castro and 81 other rebels landed in Cuba aboard the yacht Granma in December. Brazil's President Juscelino Kubitschek began building Brasília, and Nicaraguan dictator Anastasio Somoza García was assassinated.", "europe": "Hungarians rose against Soviet-backed rule in October until Soviet tanks crushed the revolution in November. Switzerland hosted the first Eurovision Song Contest in Lugano.", "russia": "Nikita Khrushchev denounced Stalin's crimes in a secret speech to the 20th Party Congress in February. In November, Soviet forces crushed the Hungarian uprising.", "mideast": "Gamal Abdel Nasser nationalized the Suez Canal Company, leading to an Israeli, British and French attack. Morocco and Tunisia won independence from France, while Algeria's war of independence intensified.", "africa": "Sudan became independent on 1 January. In South Africa, 20,000 women marched in Pretoria against pass laws, and in December police arrested 156 activists, including Nelson Mandela, for treason.", "india": "India redrew its state borders along language lines. B.R. Ambedkar led hundreds of thousands of Dalits in converting to Buddhism, and Pakistan became an Islamic republic under its first constitution.", "china": "Mao invited open criticism with the Hundred Flowers campaign, launched in May. Japan restored relations with the Soviet Union and joined the United Nations in December."}, "1957": {"us": "Eisenhower sent troops to protect nine Black students integrating Little Rock's Central High School. Congress passed the first civil rights act since Reconstruction, and Jack Kerouac's On the Road appeared.", "latam": "François “Papa Doc” Duvalier won Haiti's presidency in September. Colombia's military ruler Gustavo Rojas Pinilla fell in May, and Fidel Castro's rebels fought on in Cuba's Sierra Maestra.", "europe": "Six nations signed the Treaty of Rome, founding the European Economic Community. Harold Macmillan succeeded Anthony Eden in Britain, telling voters they had “never had it so good”.", "russia": "Khrushchev beat a Kremlin plot to oust him. The R-7, the first intercontinental missile, launched Sputnik in October, and a nuclear waste tank exploded at the secret Mayak plant.", "mideast": "The Suez Canal reopened in April after salvage crews cleared it. Tunisia abolished its monarchy and made Habib Bourguiba president, and the Eisenhower Doctrine offered US aid against communism.", "africa": "On 6 March the Gold Coast became independent Ghana, led by Kwame Nkrumah, inspiring independence movements across the continent. In Kenya, the British hanged Mau Mau leader Dedan Kimathi.", "india": "Kerala elected a Communist government under E.M.S. Namboodiripad, and Nehru's Congress won India's second general election. Mehboob Khan's Mother India became a landmark of Hindi cinema.", "china": "When the Hundred Flowers campaign unleashed sharp criticism, Mao launched the Anti-Rightist Campaign, branding over 500,000 people rightists. The first bridge across the Yangtze opened at Wuhan."}, "1962": {"us": "President Kennedy confronted the Soviet Union in the 13-day Cuban Missile Crisis in October. John Glenn became the first American to orbit Earth, and James Meredith integrated the University of Mississippi.", "latam": "Jamaica and Trinidad and Tobago won independence from Britain in August. Brazil won the football World Cup hosted by Chile, and Cuba became the flashpoint of the missile crisis.", "europe": "The Second Vatican Council opened in Rome in October, and the Beatles released their first single, “Love Me Do”. France signed the Évian Accords, ending its war in Algeria.", "russia": "Soviet leader Nikita Khrushchev placed nuclear missiles in Cuba, then withdrew them. Troops shot striking workers in Novocherkassk, and Solzhenitsyn’s gulag story “One Day in the Life of Ivan Denisovich” appeared.", "mideast": "Algeria won independence from France in July after an eight-year war. In North Yemen, officers overthrew the imam in September, starting a civil war that drew in Nasser’s Egyptian troops.", "africa": "Uganda, Rwanda and Burundi became independent. In South Africa, Nelson Mandela was arrested in August and jailed, and the UN General Assembly called for sanctions against apartheid.", "india": "India lost a brief border war with China in October and November, a heavy blow to Prime Minister Nehru. China declared a ceasefire and kept control of Aksai Chin.", "china": "At the Seven Thousand Cadres Conference, Mao made a rare self-criticism over the Great Leap Forward, whose famine had killed tens of millions. Japan boomed under Prime Minister Ikeda’s income-doubling plan."}, "1968": {"us": "Martin Luther King Jr. and Robert Kennedy were assassinated, and the Tet Offensive eroded support for the Vietnam War. Richard Nixon won the presidency, and Apollo 8 orbited the Moon.", "latam": "Mexican troops fired on student protesters at Tlatelolco ten days before Mexico City hosted the Olympics. Brazil’s military regime issued AI-5, suspending civil liberties, and Peru’s army seized power.", "europe": "Students and about 10 million striking workers paralyzed France in May. In August, Warsaw Pact troops invaded Czechoslovakia and ended Alexander Dubček’s Prague Spring reforms.", "russia": "Leonid Brezhnev sent tanks into Czechoslovakia and claimed a right to intervene in socialist states. A handful of dissidents protested on Red Square, and Andrei Sakharov circulated an essay calling for reform.", "mideast": "The Ba’ath Party seized power in Iraq in July, with Saddam Hussein as a rising figure. Palestinian fighters and Jordan’s army fought Israeli forces at the Battle of Karameh.", "africa": "Images of famine in breakaway Biafra, blockaded during Nigeria’s civil war, shocked the world. Mauritius and Swaziland gained independence from Britain.", "india": "India harvested a record wheat crop from new high-yield seeds, a breakthrough soon called the Green Revolution. The Beatles studied meditation in Rishikesh, and protests against Pakistan’s Ayub Khan began.", "china": "Mao began sending millions of urban youths to the countryside amid the Cultural Revolution. Japan’s economy overtook West Germany’s, second only to America’s among market economies."}, "1973": {"us": "The Supreme Court decided Roe v. Wade, and the last US combat troops left Vietnam. Televised Watergate hearings gripped the country, and the oil embargo brought lines at gas stations.", "latam": "General Augusto Pinochet seized power in Chile on 11 September, and President Allende died during the coup. Uruguay’s military took over, and Juan Perón returned as Argentina’s president.", "europe": "Britain, Ireland and Denmark joined the European Economic Community on 1 January. The oil embargo brought car-free Sundays, and Greek troops crushed a student uprising at Athens Polytechnic.", "russia": "Leonid Brezhnev toured the United States in June at the height of détente. Moscow airlifted arms to Egypt and Syria in October, and Solzhenitsyn’s “The Gulag Archipelago” was published in Paris.", "mideast": "Egypt and Syria attacked Israel on 6 October, starting the Yom Kippur War. Arab oil producers cut output and embargoed the US, and oil prices roughly quadrupled within months.", "africa": "Guinea-Bissau’s rebels declared independence from Portugal months after their leader Amílcar Cabral was assassinated. A hidden famine in Ethiopia’s Wollo province was exposed on British television.", "india": "India’s Supreme Court ruled in the Kesavananda Bharati case that Parliament cannot alter the constitution’s basic structure, and Project Tiger began. Pakistan adopted a new constitution.", "china": "Deng Xiaoping returned from political disgrace as vice premier. In Japan, the oil shock set off panic buying of toilet paper and ended nearly two decades of rapid growth."}, "1975": {"us": "New York City neared bankruptcy, and Bill Gates and Paul Allen founded Microsoft. Apollo and Soyuz spacecraft docked in orbit, and “Jaws” became the first summer blockbuster.", "latam": "Suriname gained independence from the Netherlands in November. Military governments in South America secretly launched Operation Condor to hunt down opponents across borders.", "europe": "Francisco Franco died in November, and Juan Carlos became king of Spain. Portugal held its first free elections in nearly 50 years, and 35 nations signed the Helsinki Accords.", "russia": "Brezhnev signed the Helsinki Accords, gaining recognition of postwar borders in exchange for human rights pledges. Andrei Sakharov won the Nobel Peace Prize but was barred from collecting it.", "mideast": "Lebanon’s civil war began in April. Saudi King Faisal was assassinated by a nephew, and Egypt reopened the Suez Canal, closed since the 1967 war.", "africa": "Mozambique and Angola won independence from Portugal. Angola slid into civil war as Cuban troops and South African forces intervened on opposing sides.", "india": "Indira Gandhi declared a state of Emergency in June, suspending civil liberties and jailing opponents. In Bangladesh, founding leader Sheikh Mujibur Rahman was assassinated in August.", "china": "Chiang Kai-shek died in Taiwan in April. In Beijing, Zhou Enlai called for the “Four Modernizations”, while in Cambodia the Khmer Rouge seized Phnom Penh and emptied the cities."}, "1980": {"us": "Mount St. Helens erupted in May, and CNN launched as the first 24-hour news channel. Ronald Reagan won the presidency while American hostages were still held in Iran.", "latam": "Archbishop Óscar Romero was shot dead while saying Mass in El Salvador. About 125,000 Cubans left for Florida in the Mariel boatlift, and Peru’s Shining Path launched its insurgency.", "europe": "Strikes at Gdańsk’s shipyard gave birth to Solidarity, the Soviet bloc’s first independent trade union, led by Lech Wałęsa. Yugoslavia’s leader Josip Broz Tito died in May.", "russia": "Moscow hosted the Summer Olympics, boycotted by the US and dozens of other countries over the invasion of Afghanistan. Andrei Sakharov was exiled to the closed city of Gorky.", "mideast": "Iraq invaded Iran in September, starting an eight-year war. Turkey’s military seized power in a coup, and American diplomats remained hostages in Tehran.", "africa": "Zimbabwe became independent in April with Robert Mugabe as prime minister. In Liberia, Samuel Doe seized power in a coup and President William Tolbert was killed.", "india": "Indira Gandhi returned to power in January. Her son Sanjay died in a plane crash, and India put a satellite into orbit on its own rocket for the first time.", "china": "China made Shenzhen a special economic zone and put the Gang of Four on trial. South Korean troops crushed the Gwangju Uprising in May, and Japan released the arcade game Pac-Man."}, "1986": {"us": "Space shuttle Challenger broke apart 73 seconds after launch in January, killing all seven aboard. In November, the Iran-Contra affair revealed secret arms sales to Iran under President Reagan.", "latam": "Jean-Claude Duvalier fled Haiti in February, ending his family’s 29-year rule. Diego Maradona led Argentina to World Cup victory in Mexico, scoring the “Hand of God” goal.", "europe": "Spain and Portugal joined the European Community in January. Swedish Prime Minister Olof Palme was shot dead in Stockholm, and Chernobyl’s fallout reached much of Europe.", "russia": "Chernobyl’s reactor exploded in April. Mikhail Gorbachev began promoting glasnost, met Reagan at the Reykjavík summit and freed Andrei Sakharov from exile, and the Mir space station launched.", "mideast": "US warplanes bombed Libya in April after a Berlin disco bombing that Washington blamed on Gaddafi. In the Iran-Iraq War, Iran captured Iraq’s Faw Peninsula.", "africa": "South Africa declared a nationwide state of emergency, and the US Congress imposed sanctions over Reagan’s veto. Yoweri Museveni took power in Uganda, and Wole Soyinka won the Nobel Prize in Literature.", "india": "Rajiv Gandhi’s government passed a law reversing the Shah Bano maintenance ruling, and a court ordered the disputed Babri Masjid unlocked. Benazir Bhutto returned to Pakistan to large crowds.", "china": "Student protests for political reform spread from Hefei to Shanghai in December. Japan’s asset bubble began to inflate, and People Power protests drove Ferdinand Marcos from the Philippines."}, "1989": {"us": "George H.W. Bush became president in January. The Exxon Valdez spilled oil into Alaska’s Prince William Sound, and an earthquake hit the San Francisco Bay Area during the World Series.", "latam": "Riots over price hikes shook Caracas, and Paraguay’s Alfredo Stroessner was overthrown after over three decades. Chile elected its first civilian president since 1973, and US troops invaded Panama to remove Noriega.", "europe": "Poland held partly free elections in June, and the Berlin Wall opened on 9 November. Communist rule collapsed across Eastern Europe, and Romania’s Ceaușescu was executed on Christmas Day.", "russia": "The last Soviet troops left Afghanistan, and partly free elections produced a televised parliament of fierce debate. About two million people formed a human chain across the Baltic republics.", "mideast": "Ayatollah Khomeini issued a fatwa against author Salman Rushdie in February and died in June. Lebanon’s factions signed the Taif Agreement, the framework for ending the civil war.", "africa": "F.W. de Klerk became South Africa’s president and freed Walter Sisulu and other ANC leaders. Namibia voted in UN-supervised elections, and Charles Taylor’s rebels invaded Liberia.", "india": "Rajiv Gandhi lost India’s election amid the Bofors arms scandal, and V.P. Singh became prime minister. An armed insurgency erupted in Kashmir.", "china": "Protests in Tiananmen Square ended in a military crackdown on 4 June. In Japan, Emperor Hirohito died in January, and the stock market bubble peaked on the year’s last trading day."}, "1994": {"us": "NAFTA took effect on 1 January, and millions watched O.J. Simpson’s slow-speed police chase. Republicans won both houses of Congress, taking the House for the first time in 40 years.", "latam": "Zapatista rebels rose up in Chiapas as NAFTA began, and Mexico’s peso collapsed in December. Brazil launched the real currency to tame inflation and won the World Cup.", "europe": "The Channel Tunnel opened between Britain and France, and the IRA declared a ceasefire. The siege of Sarajevo continued, and Norwegians voted against joining the European Union.", "russia": "Russia’s last troops left Germany, Estonia and Latvia, and the MMM pyramid scheme collapsed, costing millions of investors their savings. In December, Boris Yeltsin sent the army into Chechnya.", "mideast": "Yasser Arafat returned to Gaza under the Oslo Accords, and Jordan signed a peace treaty with Israel. Arafat, Yitzhak Rabin and Shimon Peres shared the Nobel Peace Prize.", "africa": "Nelson Mandela became South Africa’s first Black president after all-race elections in April. In Rwanda, about 800,000 people, mostly Tutsi, were killed in a genocide lasting about 100 days.", "india": "Plague broke out in Surat in September, sending hundreds of thousands fleeing the city. Indians Sushmita Sen and Aishwarya Rai won Miss Universe and Miss World as economic reforms opened the country.", "china": "North Korea’s founder Kim Il-sung died in July, and his son Kim Jong-il took over. China connected fully to the internet and began building the Three Gorges Dam."}, "1996": {"us": "Bill Clinton won re-election and signed a major welfare reform law. Atlanta hosted the Summer Olympics, marred by a bombing in Centennial Olympic Park.", "latam": "Guatemala signed peace accords in December, ending a 36-year civil war. In Lima, Túpac Amaru rebels seized the Japanese ambassador’s residence and took hundreds of hostages.", "europe": "Britain announced a likely link between mad cow disease and a fatal human brain illness, and the EU banned British beef exports. England hosted the Euro 96 football tournament.", "russia": "Boris Yeltsin won re-election in a July run-off against Communist Gennady Zyuganov, despite heart trouble. The Khasavyurt agreement ended the first war in Chechnya.", "mideast": "Benjamin Netanyahu won Israel’s first direct election for prime minister, and a truck bomb hit the Khobar Towers in Saudi Arabia. Qatar launched Al Jazeera in November.", "africa": "South Africa adopted its post-apartheid constitution and began Truth and Reconciliation hearings. In Zaire, Laurent Kabila’s rebels, backed by Rwanda, launched the First Congo War.", "india": "The Taliban captured Kabul. India’s Congress party lost power, Atal Bihari Vajpayee’s first government lasted 13 days, and Sri Lanka won the cricket World Cup.", "china": "China fired test missiles near Taiwan before its first direct presidential election, which Lee Teng-hui won. In Japan, Nintendo released the first Pokémon games."}, "1997": {"us": "Mars Pathfinder landed on Mars on 4 July and sent its small rover across the surface. Amazon went public, and “Titanic” opened in December on its way to becoming the top-grossing film.", "latam": "Peruvian commandos stormed the Japanese ambassador’s residence in April, ending a four-month hostage crisis. In Mexico, the ruling PRI lost its majority in the lower house for the first time.", "europe": "Tony Blair’s Labour Party won a landslide in Britain in May. Princess Diana died in a Paris car crash in August, and Scotland and Wales voted for devolved parliaments.", "russia": "Boris Yeltsin signed a peace treaty with Chechnya’s leaders and the NATO-Russia Founding Act, as NATO prepared to admit former Warsaw Pact states.", "mideast": "Reformist Mohammad Khatami won Iran’s presidential election in a landslide. In Egypt, militants killed 62 people, mostly foreign tourists, at Luxor’s Temple of Hatshepsut.", "africa": "Laurent Kabila’s forces took Kinshasa in May, ending Mobutu Sese Seko’s 32-year rule and renaming Zaire the Democratic Republic of the Congo. Ghana’s Kofi Annan became UN secretary-general.", "india": "India and Pakistan marked 50 years of independence. K.R. Narayanan became India’s first Dalit president, and Arundhati Roy won the Booker Prize for “The God of Small Things”.", "china": "Deng Xiaoping died in February, and Britain handed Hong Kong back to China on 1 July. The Asian financial crisis began in Thailand and forced South Korea to seek an IMF bailout."}, "1999": {"us": "The Senate acquitted President Clinton in his impeachment trial in February. Two students killed 13 people at Columbine High School, and protests disrupted the WTO meeting in Seattle.", "latam": "Hugo Chávez became Venezuela’s president, and floods and mudslides in Vargas state killed thousands in December. The United States handed the Panama Canal to Panama on 31 December.", "europe": "The euro launched on 1 January as an electronic currency in 11 countries. NATO bombed Yugoslavia for 78 days over Kosovo, and Poland, Hungary and the Czech Republic joined NATO.", "russia": "Apartment bombings, which officials blamed on Chechen militants, killed about 300 people, and Russia launched a second war in Chechnya. Boris Yeltsin resigned on 31 December, naming Vladimir Putin acting president.", "mideast": "Jordan’s King Hussein and Morocco’s King Hassan II died, and their sons took the thrones. An earthquake near İzmit, Turkey, killed about 17,000 people in August.", "africa": "Nigeria returned to civilian rule under Olusegun Obasanjo, and Thabo Mbeki succeeded Nelson Mandela in South Africa. Sierra Leone’s government and rebels signed the Lomé peace accord.", "india": "India and Pakistan fought the Kargil conflict in Kashmir’s mountains. General Pervez Musharraf seized power in Pakistan in October, and a super cyclone killed about 10,000 people in Orissa.", "china": "Portugal handed Macau to China in December, and Beijing banned the Falun Gong movement. An earthquake killed about 2,400 people in Taiwan, and a nuclear accident struck Tokaimura, Japan."}, "2000": {"us": "The presidential election came down to a Florida recount, halted by the Supreme Court in December, making George W. Bush the winner over Al Gore. The dot-com bubble burst.", "latam": "Vicente Fox won Mexico’s presidency, ending 71 years of rule by the PRI. In Peru, Alberto Fujimori fled to Japan amid a corruption scandal and resigned by fax.", "europe": "Mass protests in Belgrade toppled Slobodan Milošević in October. An Air France Concorde crashed near Paris in July, killing 113, and the new euro fell to record lows.", "russia": "Vladimir Putin won the presidential election in March. In August, the submarine Kursk sank in the Barents Sea with all 118 aboard, and Putin faced criticism for his slow response.", "mideast": "Israel withdrew from southern Lebanon, Camp David peace talks failed, and the Second Intifada began in September. Syria’s Hafez al-Assad died, and his son Bashar took power.", "africa": "Floods devastated Mozambique, where a baby was born in a tree above the water. Zimbabwe began seizing white-owned farms, and British troops intervened in Sierra Leone’s civil war.", "india": "India’s population passed one billion, and three new states were created: Chhattisgarh, Jharkhand and Uttaranchal, now Uttarakhand. Bill Clinton made the first US presidential visit in 22 years.", "china": "Kim Dae-jung met Kim Jong-il in Pyongyang at the first inter-Korean summit and won the Nobel Peace Prize. In Taiwan, Chen Shui-bian’s election ended five decades of Kuomintang rule."}, "2003": {"us": "The US led the invasion of Iraq in March. Space shuttle Columbia broke apart on re-entry in February, and Arnold Schwarzenegger was elected governor of California in a recall vote.", "latam": "Luiz Inácio Lula da Silva became Brazil’s president, and Néstor Kirchner took office in Argentina. Deadly protests over gas exports forced Bolivia’s president to resign in October.", "europe": "Millions marched against the Iraq war on 15 February. An August heatwave killed tens of thousands across Europe, about 15,000 in France alone, and Concorde made its last flights.", "russia": "Oil tycoon Mikhail Khodorkovsky, Russia’s richest man, was arrested in October. Putin’s United Russia party won December’s parliamentary elections, and St Petersburg celebrated its 300th anniversary.", "mideast": "US-led forces toppled Saddam Hussein in April and captured him in December. An earthquake destroyed Bam in Iran, killing about 26,000, and Libya agreed to abandon weapons of mass destruction.", "africa": "Fighting in Sudan’s Darfur escalated as government-backed militias attacked civilians. In Liberia, Charles Taylor stepped down and went into exile in Nigeria as rebels besieged Monrovia.", "india": "India and Pakistan agreed a ceasefire along the Line of Control in Kashmir in November. Twin car bombs killed more than 50 people in Mumbai in August.", "china": "SARS spread from southern China, killing about 800 people worldwide. Hu Jintao became China’s president, and Yang Liwei became the country’s first astronaut in space."}, "2007": {"us": "Steve Jobs unveiled the iPhone in January, and it went on sale in June. By spring, subprime mortgage lenders were going bankrupt, an early sign of the coming financial crisis.", "latam": "Cristina Fernández de Kirchner was elected president of Argentina, succeeding her husband Néstor. In December, Venezuelan voters narrowly rejected Hugo Chávez’s constitutional reform, his first defeat at the polls.", "europe": "Nicolas Sarkozy won France’s presidency, and Gordon Brown replaced Tony Blair as British prime minister. In September, savers queued outside Northern Rock in Britain’s first bank run in over a century.", "russia": "Vladimir Putin, barred from a third straight term, named Dmitry Medvedev as his preferred successor in December. Sochi won the 2014 Winter Olympics, and Boris Yeltsin died in April.", "mideast": "Hamas seized control of Gaza from rival Fatah in June, splitting Palestinian rule in two. In Iraq, the US sent more than 20,000 extra troops in a “surge” against sectarian violence.", "africa": "Kenya’s December election ended in disputed results and deadly unrest after Mwai Kibaki was declared the winner over Raila Odinga. Nigeria saw its first handover between elected civilian presidents.", "india": "Former Pakistani prime minister Benazir Bhutto was assassinated at a rally in December. India won cricket’s first T20 World Cup, and Pratibha Patil became its first woman president.", "china": "Xi Jinping joined the Communist Party’s top leadership in October as Beijing prepared for the Olympics. Japan’s Shinzo Abe resigned after a year, and South Korea elected Lee Myung-bak."}, "2008": {"us": "Lehman Brothers collapsed in September, turning a housing slump into a global financial crisis. In November, Barack Obama was elected the first Black president of the United States.", "latam": "Fidel Castro formally handed Cuba’s presidency to his brother Raúl in February. In July, Colombia’s army tricked FARC rebels into freeing Ingrid Betancourt and 14 other hostages without a shot fired.", "europe": "Kosovo declared independence from Serbia in February. In October, Iceland’s three biggest banks collapsed within a week, and governments across Europe rushed to rescue their lenders.", "russia": "Dmitry Medvedev became president, with Vladimir Putin as prime minister. In August, Russia fought a five-day war with Georgia, then recognized South Ossetia and Abkhazia as independent.", "mideast": "Iraq and the US agreed in November that American troops would leave by the end of 2011. On December 27, Israel launched a major offensive against Hamas in Gaza after rocket fire.", "africa": "After more than 1,000 deaths, Kenya’s rivals agreed to share power in February. Zimbabwe sank into crisis with a disputed election, runaway inflation and a cholera outbreak.", "india": "Ten gunmen attacked hotels, a train station and other sites in Mumbai in November, killing 166 people. Earlier, India launched its first Moon probe, and the Indian Premier League began.", "china": "A May earthquake in Sichuan killed nearly 70,000 people. In August, Beijing hosted the Summer Olympics, and China topped the gold medal table for the first time."}, "2011": {"us": "US Navy SEALs killed Osama bin Laden in May. Standard & Poor’s downgraded US government debt in August, and Occupy Wall Street protesters camped in lower Manhattan from September.", "latam": "Dilma Rousseff took office as Brazil’s first woman president. Chilean students held months of mass protests for free public education, and Hugo Chávez revealed he was being treated for cancer.", "europe": "The euro debt crisis pushed Portugal into a bailout and toppled leaders in Greece and Italy. In July, a far-right extremist killed 77 people in Norway, most at a youth camp.", "russia": "In September, Vladimir Putin announced he would return to the presidency, swapping jobs with Dmitry Medvedev. After December’s parliamentary election, tens of thousands protested in Moscow over alleged vote fraud.", "mideast": "The Arab Spring toppled Tunisia’s Ben Ali in January and Egypt’s Hosni Mubarak in February. Libya’s Muammar Gaddafi was killed in October, and Syria’s protests grew into an armed uprising.", "africa": "South Sudan became the world’s newest country on July 9. Famine struck parts of Somalia, and Ivory Coast’s Laurent Gbagbo was arrested after refusing to accept his election defeat.", "india": "India won the Cricket World Cup at home in April, and Anna Hazare’s hunger strikes against corruption drew huge crowds. In May, US forces killed Osama bin Laden in Abbottabad, Pakistan.", "china": "On March 11, a magnitude 9 earthquake and tsunami left about 18,000 dead or missing in Japan and caused meltdowns at Fukushima. North Korea’s Kim Jong-il died in December."}, "2014": {"us": "Protests erupted in Ferguson, Missouri, after a police officer shot dead Michael Brown, an unarmed Black teenager, in August. That summer, the Ice Bucket Challenge swept social media.", "latam": "Brazil hosted the World Cup and lost its semifinal 7-1 to Germany. In Mexico, 43 students from Ayotzinapa disappeared in September, and in December the US and Cuba agreed to restore ties.", "europe": "Ukraine’s president fled in February after months of protests in Kyiv, and war broke out in the east. In September, Scotland voted 55 to 45 percent to stay in the United Kingdom.", "russia": "Russia hosted the Winter Olympics in Sochi, then annexed Crimea from Ukraine in March. Western sanctions and falling oil prices sent the ruble crashing by December.", "mideast": "Islamic State seized Mosul in June and declared a caliphate across parts of Iraq and Syria. That summer, a 50-day war between Israel and Hamas killed over 2,200 Palestinians and 73 Israelis.", "africa": "Ebola spread through Guinea, Liberia and Sierra Leone in the worst outbreak on record. In Nigeria, Boko Haram kidnapped 276 schoolgirls from Chibok, sparking the #BringBackOurGirls campaign.", "india": "Narendra Modi led the BJP to a landslide election win in May. India’s Mangalyaan probe reached Mars orbit on its first attempt, and Malala Yousafzai shared the Nobel Peace Prize.", "china": "Pro-democracy protesters occupied Hong Kong streets for 79 days in the Umbrella Movement. In April, South Korea’s Sewol ferry sank, killing 304 people, most of them high school students."}, "2015": {"us": "In June, the Supreme Court ruled same-sex couples have the right to marry nationwide. That month, a gunman killed nine Black worshippers       c.save(); c.fillStyle = `rgb(${rgb})`; c.shadowColor = `rgb(${rgb})`; c.shadowBlur = 12;

    }
    if (!this.small && bw >= 480) {   // region names, nudged so neighbours do not collide
      const OFF = { us: [0, -12], latam: [0, 16], europe: [-6, -12], russia: [0, -12], mideast: [-8, 16], africa: [0, 16], india: [6, 16], china: [8, -12] };

        c.fillText(shortName(r, this.yr), p[0] + o[0], p[1] + o[1]);
      }

    if (this.callout && fp && this.yr) {
      const txt = headline(this.yr, this.focus), f = `500 ${bw < 420 ? 12.5 : 14}px "Newsreader", Georgia, serif`;
      const kf = FONT.monoB(10), kt = shortName(this.focus, this.yr);
      c.font = f;
      const tw = Math.min(Math.max(c.measureText(txt).width, mw(kf, kt)), bw * .66) + 20, th = 36;
      const bx = clamp(fp[0] - tw / 2, 4, bw - tw - 4);
      let by = fp[1] - th - 12;
      const covers = y => hp && hp[0] > bx - 6 && hp[0] < bx + tw + 6 && hp[1] > y - 6 && hp[1] < y + th + 6;
      if (by < 2 || (covers(by) && fp[1] + 14 + th < bh)) by = fp[1] + 14;
      const rgb = this.focus === this.home ? homeRGB : INK;
      c.save(); c.shadowColor = `rgba(${rgb},.45)`; c.shadowBlur = 14;
      rrect(c, bx, by, tw, th, 12); c.fillStyle = `rgba(${BG},.95)`; c.fill(); c.restore();
      rrect(c, bx, by, tw, th, 12); c.strokeStyle = `rgba(${rgb},.9)`; c.lineWidth = 1.2; c.stroke();
      c.textAlign = "center";
      c.font = kf; c.fillStyle = `rgb(${this.focus === this.home ? homeRGB : MUTED})`; c.fillText(kt, bx + tw / 2, by + 13);
      c.font = f; c.fillStyle = `rgb(${INK})`; c.fillText(fit(f, txt, tw - 16), bx + tw / 2, by + 29);
    }

}

/* ---------- the world that year ---------- */
let world = null;
function worldHTML(yr, home, k) {

    <ul class="wl world-${k}">${order.map(r => `<li data-li="${r}" class="${r === home ? "home" : ""}"><button type="button" data-r="${r}" aria-expanded="false">
      <span class="wd0"></span><span class="wr">${regionName(r, yr)}</span><span class="wh">${esc(headline(yr, r))}</span>${r === home ? '<span class="tag">Here</span>' : "<span></span>"}
      <span class="wdet" hidden>${esc(w[r])}</span></button></li>`).join("")}</ul>`;

function initWorld(yr, home, k) {

/* ---------- community: votes and puzzle stats (Cloudflare D1 behind /api, live on pastforward.app) ---------- */
const apiOn = () => /(^|\.)pastforward\.app$|\.pages\.dev$/.test(location.hostname);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (_) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }
};
const DEVICE = (() => {
  let d = store.get("pastforward.device", null);
  if (!d) {
    d = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
      : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => { const r = Math.random() * 16 | 0; return (c === "x" ? r : (r & 3 | 8)).toString(16); });
    store.set("pastforward.device", d);
  }

})();
async function api(path, body) {
  if (!apiOn()) return null;
  const r = await fetch(path, {
    method: body ? "POST" : "GET",
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined
