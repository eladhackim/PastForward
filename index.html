<style>
/* PastForward on one screen: a river of time on top, then one rhyme told in three steps (Then, Today, Next),
   with one button that always says where it goes. Everything else is one tap away, in the full story.
   Two themes from one set of tokens: night (dark) and day (light). The trailer and share images always use night. */
:root, .night {
  color-scheme: dark;
  --bg-rgb: 15, 13, 34;
  --surface-rgb: 27, 24, 58;
  --surface2: #241F4C;
  --ink-rgb: 241, 236, 223;
  --muted-rgb: 164, 159, 194;
  --then-rgb: 230, 184, 102;
  --now-rgb: 116, 214, 200;
  --next-rgb: 201, 182, 255;
  --bad-rgb: 229, 140, 122;
  --glow-rgb: 120, 92, 210;
  --glow-a: .16;
  --on-accent: #0F0D22;
  --shade: 0, 0, 0;
  --bg: rgb(var(--bg-rgb));
  --surface: rgb(var(--surface-rgb));
  --ink: rgb(var(--ink-rgb));
  --muted: rgb(var(--muted-rgb));
  --then: rgb(var(--then-rgb));
  --now: rgb(var(--now-rgb));
  --next: rgb(var(--next-rgb));
  --bad: rgb(var(--bad-rgb));
  --line: rgba(var(--ink-rgb), .11);
}
.night { color: var(--ink); }
:root[data-theme="light"] {
  color-scheme: light;
  --bg-rgb: 245, 243, 249; --surface-rgb: 255, 255, 255; --surface2: #ECE9F4;
  --ink-rgb: 28, 25, 48; --muted-rgb: 94, 89, 118;
  --then-rgb: 138, 92, 10; --now-rgb: 10, 118, 106; --next-rgb: 100, 71, 201; --bad-rgb: 176, 66, 46;
  --glow-a: .08; --on-accent: #FFFFFF; --shade: 40, 34, 80;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg-rgb: 245, 243, 249; --surface-rgb: 255, 255, 255; --surface2: #ECE9F4;
    --ink-rgb: 28, 25, 48; --muted-rgb: 94, 89, 118;
    --then-rgb: 138, 92, 10; --now-rgb: 10, 118, 106; --next-rgb: 100, 71, 201; --bad-rgb: 176, 66, 46;
    --glow-a: .08; --on-accent: #FFFFFF; --shade: 40, 34, 80;
  }
}
:root {
  --f-then: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-ui: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Newsreader", "Iowan Old Style", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  height: 100%; margin: 0; overflow-x: clip; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background: radial-gradient(ellipse 120% 36% at 50% 0%, rgba(var(--glow-rgb), var(--glow-a)), transparent 72%), var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; min-height: 530px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; padding-block: 2px 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--next); outline-offset: 2px; }

/* top bar: the name, and three places to go */
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
h1 { margin: 0; font-family: var(--f-then); font-weight: 400; font-size: clamp(19px, 5.6vw, 23px); line-height: 1; white-space: nowrap; }
h1 .p { color: var(--then); }
h1 .f { color: var(--next); }
h1.tap { cursor: pointer; }
.bar-r { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.navb { position: relative; min-height: 40px; padding: 0 9px; border: 0; border-radius: 10px; background: none; font: 500 15px var(--f-ui); color: rgba(var(--ink-rgb), .8); cursor: pointer; white-space: nowrap; }
.navb:hover { color: var(--ink); background: rgba(var(--ink-rgb), .07); }
.navb.icon { width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.navb svg { width: 19px; height: 19px; }
.navb.new::after { content: ""; position: absolute; top: 9px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--then); }
@media (max-width: 350px) { .navb { padding: 0 6px; font-size: 14.5px; } .bar-r { margin-right: -6px; } }

/* the river of time: full width, no frame */
.tl { position: relative; flex: none; margin-inline: calc(50% - 50vw); }
#tl { display: block; width: 100%; height: clamp(150px, 23vh, 210px); touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
#tl.dragging { cursor: grabbing; }
#tl:focus-visible { box-shadow: inset 0 0 0 2px var(--next); }
@media (min-width: 700px) { #tl { height: clamp(200px, 27vh, 290px); } }
.swipe-hint { position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%); padding: 2px 12px; border-radius: 999px; background: var(--bg); font: 500 13.5px var(--f-ui); color: var(--muted); pointer-events: none; white-space: nowrap; transition: opacity .6s ease; animation: nudge 2.4s ease-in-out infinite; }
.swipe-hint.gone { opacity: 0; }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% - 8px)); } }

/* one rhyme: its pattern, the three steps, the current step, and the way on */
.stage { --k: var(--then-rgb); position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-top: 12px; touch-action: pan-y; }
.stage.now { --k: var(--now-rgb); }
.stage.next { --k: var(--next-rgb); }
.pattern { flex: none; display: flex; flex-direction: column; align-items: flex-start; }
.motif { margin: 0; font: italic 400 19px/1.3 var(--f-body); color: var(--ink); text-wrap: balance; }
.echoes { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; min-height: 36px; margin-top: 8px; padding: 0 12px 0 12px; border: 0; border-radius: 999px; background: rgba(var(--ink-rgb), .07); font: 500 14.5px var(--f-ui); color: var(--muted); cursor: pointer; white-space: nowrap; transition: background-color .2s; }
.echoes:hover { background: rgba(var(--ink-rgb), .12); color: var(--ink); }
.echoes b { font-weight: 600; color: var(--ink); }
.echoes .chev { font-size: 17px; line-height: 1; margin-left: -3px; opacity: .7; }
.echoes .w { display: none; }
@media (min-width: 420px) { .echoes .w { display: inline; } }
@media (max-width: 335px) { .echoes .s { display: none; } }
/* one bead for each time the rhyme has happened, Then and Today in their colours, the Next still open */
.beads { display: inline-flex; align-items: center; gap: 3px; }
.beads i { display: block; width: 6px; height: 6px; border-radius: 50%; background: rgba(var(--ink-rgb), .5); }
.beads i.then { background: var(--then); }
.beads i.now { background: var(--now); }
.beads i.next { width: 7px; height: 7px; margin-left: 3px; background: none; box-shadow: inset 0 0 0 1.5px var(--next); }
.beads.pop i { animation: beadIn .5s cubic-bezier(.3, .7, .3, 1.5) both; animation-delay: var(--d, 0s); }
@keyframes beadIn { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.sig i { display: block; width: 3px; border-radius: 1px; background: rgba(var(--ink-rgb), .2); }
.sig i:nth-child(1) { height: 4px; } .sig i:nth-child(2) { height: 7px; } .sig i:nth-child(3) { height: 10px; } .sig i:nth-child(4) { height: 13px; }
.sig.s1 i:nth-child(-n+1), .sig.s2 i:nth-child(-n+2), .sig.s3 i:nth-child(-n+3), .sig.s4 i { background: rgba(var(--ink-rgb), .82); }

/* the three steps on one track: the line fills in as you go */
.steps { --fill: 100%; position: relative; flex: none; display: grid; grid-template-columns: 4.3em minmax(0, 1fr) 4.3em minmax(0, 1fr) 4.3em; margin-top: 18px; font-size: 16px; }
.steps::before, .steps::after { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 2px; border-radius: 1px; }
.steps::before { background: rgba(var(--muted-rgb), .3); }
.steps::after { background: linear-gradient(90deg, var(--then), var(--now) 50%, var(--next)); clip-path: inset(0 var(--fill) 0 0); transition: clip-path .7s cubic-bezier(.3, .7, .2, 1); }
.steps.at-now { --fill: 50%; }
.steps.at-next { --fill: 0%; }
.st { --c: var(--then-rgb); position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 0 0 4px; border: 0; background: none; cursor: pointer; text-align: left; white-space: nowrap; }
.st.now { --c: var(--now-rgb); align-items: center; text-align: center; }
.st.next { --c: var(--next-rgb); align-items: flex-end; text-align: right; }
.st i { display: block; width: 14px; height: 14px; margin-bottom: 9px; border-radius: 50%; border: 2px solid rgb(var(--c)); background: var(--bg); transition: background-color .3s, box-shadow .3s; }
.st .sy { font: 600 17px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; color: rgba(var(--ink-rgb), .72); transition: color .3s; }
.st .sl { font: 500 13.5px/1.35 var(--f-ui); color: var(--muted); }
.st:hover .sy { color: var(--ink); }
.st.on i { background: rgb(var(--c)); box-shadow: 0 0 0 5px rgba(var(--c), .2); }
.st.on .sy { color: rgb(var(--c)); }
.st.on .sl { color: var(--ink); }
.st-g { align-self: start; min-width: 0; padding: 25px 4px 0; text-align: center; font: 500 13px/1.25 var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 380px) { .st-g .yrs { display: none; } }

/* the current step */
.story { flex: none; margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; transition: opacity .2s ease, transform .2s ease; }
.story.out { opacity: 0; transform: translateX(var(--dx, -14px)); }
.ct { margin: 0; font: 500 clamp(28px, 7.6vw, 36px)/1.1 var(--f-body); color: rgb(var(--k)); text-wrap: balance; }
.ch { margin: 0; font: 400 18.5px/1.45 var(--f-body); color: rgba(var(--ink-rgb), .88); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.cx { margin: 4px 0 0; font: 400 16.5px/1.55 var(--f-body); color: rgba(var(--ink-rgb), .7); display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.more { margin-top: 2px; min-height: 36px; padding: 0; border: 0; background: none; font: 500 15px var(--f-ui); color: var(--ink); text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .3); text-decoration-thickness: 1px; text-underline-offset: 4px; cursor: pointer; }
.more:hover { text-decoration-color: currentColor; }

/* the way on: what happens next, said once, and the one button that does it */
.foot { flex: none; margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
#cVote:empty { display: none; }
.guide { margin: 0; font: 400 15px/1.45 var(--f-ui); color: var(--muted); text-wrap: pretty; }
.actions { display: flex; gap: 8px; }
.primary, .secondary { min-height: 52px; min-width: 0; border: 0; border-radius: 14px; cursor: pointer; font: 600 16px var(--f-ui); padding: 0 16px; white-space: nowrap; }
.primary { --acc: var(--ink-rgb); flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--on-accent); background: rgb(var(--acc)); transition: background-color .3s, transform .15s; }
.primary:active { transform: scale(.985); }
.primary.to-then { --acc: var(--then-rgb); }
.primary.to-now { --acc: var(--now-rgb); }
.primary.to-next { --acc: var(--next-rgb); }
.secondary { background: rgba(var(--ink-rgb), .08); color: var(--ink); }
.secondary:hover { background: rgba(var(--ink-rgb), .13); }
.iconbtn { flex: none; width: 52px; min-height: 52px; border: 0; border-radius: 14px; background: rgba(var(--ink-rgb), .08); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { background: rgba(var(--ink-rgb), .13); }
.iconbtn svg { width: 19px; height: 19px; }
.pulse { animation: glow 2.2s ease-in-out 3; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--acc, var(--ink-rgb)), 0); } 50% { box-shadow: 0 0 0 7px rgba(var(--acc, var(--ink-rgb)), .22); } }
.vote { flex: none; display: flex; flex-direction: column; gap: 8px; }
.vote-q { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.vote-q > span:first-child { font: 500 15px var(--f-ui); color: var(--ink); }
.vote-b { display: inline-flex; gap: 6px; }
.vote-b button { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(var(--ink-rgb), .2); background: none; font: 500 14.5px var(--f-ui); cursor: pointer; }
.vote-b button:hover { border-color: rgba(var(--ink-rgb), .5); }
.vote-b button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vbar { height: 6px; border-radius: 3px; background: rgba(var(--muted-rgb), .2); overflow: hidden; }
.vbar i { display: block; height: 100%; border-radius: 3px; background: var(--next); transition: width .6s ease; }
.vres { display: flex; justify-content: space-between; gap: 8px; font: 14px var(--f-ui); color: var(--muted); }

@media (min-width: 700px) {
  .stage { padding-top: 8px; }
  .pattern { margin-top: auto; }
  .foot { margin-top: 30px; margin-bottom: auto; }
  .motif { font-size: 21px; }
  .steps { margin-top: 22px; }
  .story { margin-top: 26px; }
  .ct { font-size: 44px; }
  .ch { font-size: 21px; }
  .cx { font-size: 18px; }
}
@media (max-height: 740px) { .story { margin-top: 16px; } .steps { margin-top: 14px; } }
@media (max-height: 680px) { #tl { height: 140px; } .steps { margin-top: 12px; } .story { margin-top: 12px; } .ct { font-size: 27px; } }
@media (max-height: 650px) { .motif { font-size: 17.5px; } .guide { font-size: 14.5px; } .more { min-height: 30px; } .foot { gap: 10px; } }
@media (max-height: 600px) { .bar { min-height: 46px; } #tl { height: 128px; } .guide .gx { display: none; } .steps { margin-top: 10px; } .story { margin-top: 10px; } .foot { padding-top: 10px; } }
@media (max-height: 590px) { .echoes { margin-top: 4px; min-height: 30px; font-size: 14px; } .motif { font-size: 16.5px; } .story { margin-top: 12px; } .ct { font-size: 26px; } }
@media (max-width: 359px) { .primary { padding: 0 12px; font-size: 15px; } .actions { gap: 6px; } .iconbtn { width: 48px; } }

/* shared pieces used across the sheets */
.rchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rchip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px; border-radius: 999px; border: 1px dashed rgba(var(--muted-rgb), .55); background: none; font: 500 13.5px var(--f-ui); color: var(--muted); cursor: help; white-space: nowrap; }
.rchip:hover { border-color: var(--ink); color: var(--ink); }
.sigline { display: flex; align-items: center; gap: 8px; margin: 0; font: 600 15px var(--f-ui); color: var(--ink); }
.term { display: inline; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-decoration-color: rgba(var(--muted-rgb), .75); text-underline-offset: 3px; }
.term:hover { text-decoration-color: currentColor; }
.tip { position: fixed; z-index: 70; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); box-shadow: 0 16px 44px rgba(var(--shade), .4); }
.tip b { display: block; font: 500 21px/1.15 var(--f-body); color: var(--next); }
.tip p { margin: 4px 0 8px; font: 15px/1.45 var(--f-ui); color: var(--ink); }
.lx-g { margin: 8px 0 0; font: 600 14px var(--f-ui); color: var(--muted); }
.lx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lx li { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); scroll-margin: 16px; transition: border-color .4s; }
.lx li.hl { border-color: var(--next); }
.lx .lt { display: block; font: 500 23px/1.15 var(--f-body); color: var(--ink); }
.lx .ld { margin: 4px 0 0; font: 15.5px/1.45 var(--f-ui); }
.lx .le { margin: 6px 0 0; font: 14px/1.4 var(--f-ui); color: var(--muted); }
.lx .le span { font-weight: 600; margin-right: 6px; }
.mbox p { font-size: 18px; }
.mbox .rchips { margin-top: 8px; }
.wnote { margin: 0; font: 14px/1.4 var(--f-ui); color: var(--muted); }
.apat { display: inline-flex; align-items: center; gap: 7px; font: 500 13.5px var(--f-ui); color: var(--muted); }
.dots { display: inline-flex; flex: none; gap: 3px; }
.dots i { display: block; width: 6px; height: 6px; border-radius: 50%; border: 1.2px solid var(--muted); }
.dots i.on { background: var(--muted); }
.heard { font: 500 13.5px var(--f-ui); color: var(--muted); white-space: nowrap; }
.linkbtn { color: var(--next); text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: rgba(var(--ink-rgb), .07); }
.seg button { min-height: 36px; padding: 0 14px; border: 0; border-radius: 9px; background: none; font: 500 14.5px var(--f-ui); color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(var(--shade), .2); }
.prefs { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 500 15px var(--f-ui); }

/* your future */
.fut { display: flex; flex-direction: column; gap: 10px; }
.fl { font: 600 14px var(--f-ui); color: var(--muted); }
#byear { width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid rgba(var(--next-rgb), .45); background: var(--surface); color: var(--ink); font: 500 27px var(--f-ui); padding: 0 16px; letter-spacing: .04em; }
#byear:focus { outline: 2px solid var(--next); outline-offset: 2px; }
.fnote { margin: -2px 0 0; font: 13.5px/1.4 var(--f-ui); color: var(--muted); }
.fsum { margin: 4px 0 0; font-size: 20px; line-height: 1.3; }
.fsum b { color: var(--next); font-weight: 500; }
.flist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.flist button { width: 100%; display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 1px 12px; align-items: baseline; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.flist button:hover { border-color: rgba(var(--next-rgb), .6); }
.flist .fy { font: 600 17px var(--f-ui); color: var(--next); font-variant-numeric: tabular-nums; }

.hook { margin: 0; font-size: 20px; line-height: 1.4; }

  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));

<script>
(() => {
const PAIRS = [{"id": "lisbon", "theme": "A great quake shakes faith in authority", "rhyme": 2, "then": {"year": 1755, "short": "Lisbon Quake", "title": "The Great Lisbon Earthquake", "where": "Lisbon, Portugal", "region": "europe", "hook": "On All Saints’ Day, a quake, a tsunami and fire wrecked Lisbon and shook Europe.", "text": "On the morning of 1 November 1755, a powerful quake struck as churches filled for Mass. A tsunami and fires followed, killing perhaps 30,000 to 40,000 people in Lisbon. In Candide, Voltaire mocked the belief that all is for the best, and minister Pombal rebuilt the Baixa with quake-resistant “gaiola” timber frames."}, "now": {"year": 2023, "short": "Turkey Quakes", "title": "The Turkey–Syria Earthquakes", "where": "Southern Turkey and northern Syria", "region": "mideast", "hook": "February 2023: rescuers pulling survivors from flattened apartment blocks in freezing winter nights.", "text": "Before dawn on 6 February, a magnitude 7.8 quake struck, followed hours later by a 7.5. More than 50,000 people died in Turkey and thousands more in Syria. Anger focused on poorly built housing, construction amnesties and weak code enforcement, and prosecutors investigated over 600 people, including contractors."}, "followed": "Pombal used the crisis to gather power and rebuilt downtown Lisbon on a planned grid. His questionnaire to every parish about the shaking is often called an early step toward modern seismology.", "next": {"short": "Megacity Quake", "title": "A megacity quake tests building promises", "text": "Around 2291, a great quake might hit a crowded megacity of glass towers and old apartment blocks. If some buildings fall while others stand, anger could turn on whoever approved, inspected or insured them.", "watch": "Watch how strictly fast-growing cities enforce quake codes, whether old housing gets retrofitted, and whether building amnesties return."}, "breaks": "Lisbon mainly shook faith in Providence and left its government stronger, while in 2023 public anger targeted builders and the officials meant to inspect them.", "echoes": [{"year": -464, "short": "Sparta Quake", "title": "An earthquake sparks Sparta’s helot revolt", "region": "europe", "line": "A quake devastated Sparta and its helot serfs seized the moment to revolt, a rising that took Sparta years to put down."}, {"year": -70, "short": "Han Quake Edict", "title": "A quake humbles Han Emperor Xuan", "region": "china", "line": "After quakes hit 49 commanderies, Emperor Xuan called disasters Heaven’s warning, asked for frank criticism and wore plain dress for five days."}, {"year": 1257, "short": "Kamakura Quake", "title": "Nichiren blames Japan’s rulers for disasters", "region": "china", "line": "After a quake and famines, monk Nichiren blamed the disasters on Japan’s rulers backing teachings he called false, and was exiled."}, {"year": 1972, "short": "Managua Quake", "title": "The 1972 Managua earthquake", "region": "latam", "line": "A quake killed thousands in Nicaragua’s capital, and claims that Somoza’s circle pocketed foreign aid fed the revolt that toppled him."}, {"year": 1976, "short": "Tangshan Quake", "title": "The 1976 Tangshan earthquake", "region": "china", "line": "Officially 242,000 died, the toll stayed hidden for three years, and Mao’s death weeks later made the quake look like an omen."}, {"year": 1980, "short": "Irpinia Quake", "title": "The 1980 Irpinia earthquake", "region": "europe", "line": "Rescuers took days to reach ruined villages in southern Italy, and President Pertini went on television to condemn the state’s failures."}, {"year": 1985, "short": "Mexico Quake", "title": "The 1985 Mexico City earthquake", "region": "latam", "line": "As thousands died and the government stalled, volunteers dug out survivors themselves, and anger over shoddy buildings weakened the ruling PRI."}, {"year": 1988, "short": "Armenia Quake", "title": "The 1988 Armenian earthquake", "region": "russia", "line": "At least 25,000 died in Soviet Armenia; shoddy Brezhnev-era buildings and slow rescues were blamed, deepening Armenians’ distrust of Moscow."}, {"year": 1999, "short": "İzmit Quake", "title": "The 1999 İzmit earthquake", "region": "mideast", "line": "Over 17,000 died; anger at shoddy buildings and a disorganized state response helped sweep the ruling coalition from power in 2002."}, {"year": 2008, "short": "Sichuan Quake", "title": "The 2008 Sichuan earthquake", "region": "china", "line": "Over 69,000 died, including thousands of pupils in poorly built “tofu-dreg” schools, and grieving parents who demanded answers faced police pressure."}], "opp": {"lastTime": "Rebuilding Lisbon put military engineers like Manuel da Maia and Eugénio dos Santos to work, using building parts made outside the city and quake-resistant “gaiola” frames. After Mexico City’s 1985 quake, a stricter 1987 building code raised demand for seismic design.", "ideas": [{"kind": "build", "title": "Seismic checks for older housing", "line": "Services that survey and strengthen older apartment blocks in quake zones, from Istanbul to Lisbon, could see steady demand as codes and insurers tighten."}, {"kind": "build", "title": "Open records of building approvals", "line": "Digital registries showing who designed, approved and inspected each building may be in demand where quake anger turns on builders and inspectors."}, {"kind": "work", "title": "Independent building inspectors", "line": "Structural engineers, independent inspectors and retrofit crews tend to be needed after deadly quakes, as Turkey’s 2023 investigations into contractors showed."}, {"kind": "learn", "title": "Retrofitting weak older buildings", "line": "How engineers assess and strengthen old masonry and soft-storey buildings, using standards such as Eurocode 8, is a skill quake-prone cities may need."}], "watch": "Watch whether quake-prone cities like Istanbul fund retrofits of older housing, and whether insurers start pricing quake risk building by building."}}, {"id": "revolution", "theme": "Food prices and a closed elite spark revolt", "rhyme": 2, "then": {"year": 1789, "short": "Bastille Falls", "title": "The Storming of the Bastille", "where": "Paris, France", "region": "europe", "hook": "On 14 July 1789, Parisians stormed a royal fortress-prison, and France still celebrates it.", "text": "With the crown nearly bankrupt and bread near record prices, the Estates-General met in May 1789 for the first time since 1614. On 14 July, Parisians hunting for gunpowder stormed the Bastille, which held just seven prisoners. They killed its governor and paraded his head on a pike."}, "now": {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring", "where": "Tunisia, Egypt and beyond", "region": "mideast", "hook": "Early 2011: crowds packing Cairo’s Tahrir Square and cheering when Mubarak stepped down.", "text": "After a Tunisian fruit seller set himself on fire in December 2010, protests over food prices, jobs and corruption swept the region. Tunisia’s Ben Ali fled on 14 January 2011 and Egypt’s Mubarak resigned on 11 February. Uprisings followed in Libya, Yemen, Syria and Bahrain."}, "followed": "The revolution turned radical: the king was executed in 1793 and the Terror followed. In 1799 Napoleon Bonaparte seized power in a coup.", "next": {"short": "Hunger Revolt", "title": "Price shocks topple a closed regime", "text": "Around 2233, a sudden jump in food or energy prices, perhaps after failed harvests, might hit a country run by a narrow elite. Protests could spread across a whole region within weeks.", "watch": "Watch staple food prices, youth unemployment, state debt and how tightly a ruling circle guards its privileges."}, "breaks": "The French Revolution remade a great power and spread its ideas across Europe, while most Arab Spring uprisings ended in civil war or renewed authoritarian rule.", "echoes": [{"year": 184, "short": "Yellow Turbans", "title": "China’s Yellow Turban Rebellion", "region": "china", "line": "After floods and poor harvests, peasants rose against a Han court run by corrupt eunuchs, and the revolt fatally weakened the dynasty."}, {"year": 875, "short": "Huang Chao", "title": "Huang Chao’s revolt shakes the Tang", "region": "china", "line": "After drought, famine and higher taxes, failed exam candidate Huang Chao led a revolt that took Chang’an; the Tang never recovered."}, {"year": 1351, "short": "Red Turbans", "title": "The Red Turbans rise against the Yuan", "region": "china", "line": "After Yellow River floods and famine, drafted dike workers joined the Red Turbans against Mongol rule, which collapsed in 1368."}, {"year": 1378, "short": "Ciompi Revolt", "title": "The Ciompi revolt seizes Florence", "region": "europe", "line": "Florence’s wool workers, barred from the guilds that ran the city and crushed by taxes, seized the government for six weeks."}, {"year": 1644, "short": "Ming Falls", "title": "Peasant rebels topple the Ming dynasty", "region": "china", "line": "After years of famine and a court mired in factions, Li Zicheng’s rebels took Beijing, and the last Ming emperor hanged himself."}, {"year": 1848, "short": "Europe’s 1848", "title": "Europe’s revolutions of 1848", "region": "europe", "line": "After blight and failed harvests sent food prices soaring, Paris toppled a monarchy where under 1% could vote, and revolt swept Europe."}, {"year": 1917, "short": "Tsar Falls", "title": "Russia’s February Revolution", "region": "russia", "line": "Bread protests by Petrograd women grew into strikes and army mutinies, and within a week Tsar Nicholas II abdicated."}, {"year": 1998, "short": "Suharto Falls", "title": "Indonesia’s 1998 revolt topples Suharto", "region": "world", "line": "As the Asian financial crisis sent food and fuel prices soaring, protests and riots ended Suharto’s 32-year rule, criticised for cronyism."}, {"year": 2022, "short": "Rajapaksas Fall", "title": "Sri Lanka’s protests oust the Rajapaksas", "region": "india", "line": "With food and fuel scarce and inflation over 50%, protesters stormed the president’s house, ending the Rajapaksa family’s hold on power."}], "opp": {"lastTime": "After 1789, over 1,300 new newspapers appeared in France within a decade, and buyers of confiscated church lands, mostly townsmen and better-off peasants, gained property. After 2011, Tunisia’s civil society grew, and four of its groups won the 2015 Nobel Peace Prize.", "ideas": [{"kind": "build", "title": "Food price early-warning tools", "line": "Dashboards that track bread, rice and fuel prices against local wages could help aid groups and cities target food support before shortages bite."}, {"kind": "build", "title": "Independent local news", "line": "When closed regimes open up, independent local news and fact-checking tend to be in demand, as the 1,300 new French papers after 1789 showed."}, {"kind": "work", "title": "Food security analysts", "line": "Roles tracking grain stocks, import bills and subsidy costs in governments, aid agencies and food importers may grow as climate shocks hit crops."}, {"kind": "learn", "title": "How subsidies and currencies interact", "line": "Understanding how bread subsidies, currency falls and wheat import bills interact, as in Egypt and Lebanon, shows where the next price shock may bite."}], "watch": "Watch the FAO Food Price Index, the wheat import bills of large importers like Egypt, and sudden cuts to bread or fuel subsidies."}}, {"id": "hamilton", "theme": "A union starts sharing its debts", "rhyme": 2, "then": {"year": 1790, "short": "Hamilton Plan", "title": "Hamilton’s Plan to Assume State Debts", "where": "New York, United States", "region": "us", "hook": "The dinner deal from the musical Hamilton: state debts for a capital on the Potomac.", "text": "Treasury Secretary Alexander Hamilton proposed that the federal government take over the states’ war debts, up to $21.5 million in the final law. States that had paid down theirs, like Virginia, objected. At a June 1790 dinner hosted by Jefferson, Madison agreed not to block it in return for a capital on the Potomac."}, "now": {"year": 2020, "short": "EU Joint Debt", "title": "The EU’s NextGenerationEU Recovery Fund", "where": "Brussels, Belgium", "region": "europe", "hook": "July 2020: masked EU leaders haggling for days over a €750 billion pandemic fund.", "text": "In July 2020, EU leaders agreed on a €750 billion recovery fund, including €390 billion in grants, paid for by joint borrowing through the European Commission. German finance minister Olaf Scholz called the plan Europe’s “Hamiltonian moment”. The “frugal” Netherlands, Austria, Sweden and Denmark pushed back on grants."}, "followed": "Assumption gave the young US strong credit, and the fight over it helped create the first political parties. When eight states defaulted in the 1840s, Congress refused to take on their debts.", "next": {"short": "Shared Debt", "title": "A new union pools its debts", "text": "Around 2250, a looser union, perhaps in Africa or Latin America, or even a global climate body, might issue its first shared bonds after a crisis. Leaders could again trade debt deals for symbols of power.", "watch": "Watch for crises that push members of a union to borrow together, and for “one-off” joint funds that quietly become permanent."}, "breaks": "The US took on states’ old debts for good, while NextGenerationEU borrowed new money as an officially one-off fund, and the EU still lacks a federal treasury.", "echoes": [{"year": 1707, "short": "The Equivalent", "title": "Scotland shares England’s debt at Union", "region": "europe", "line": "Under the 1707 Union, Scotland took on part of England’s much larger national debt, compensated by a lump sum called the Equivalent."}, {"year": 1798, "short": "Batavian Debts", "title": "The Dutch provinces merge their debts", "region": "europe", "line": "The Batavian Republic’s 1798 constitution declared the debts of the old Dutch provinces, mostly Holland’s, national debts of the whole Batavian people."}, {"year": 1815, "short": "Belgian Burden", "title": "Belgium shares the Dutch national debt", "region": "europe", "line": "In the new Kingdom of the Netherlands, Belgians shared a large Dutch debt they had not run up, a lasting grievance."}, {"year": 1861, "short": "Italy’s Ledger", "title": "United Italy merges its states’ debts", "region": "europe", "line": "The new Kingdom of Italy gathered the debts of the old states it absorbed into a single national ledger, the Gran Libro."}, {"year": 1867, "short": "Canada Unites", "title": "Canadian Confederation takes on provincial debts", "region": "world", "line": "At Confederation, the new Dominion of Canada took on the debts of its provinces, a key bargain in uniting them."}, {"year": 1927, "short": "Australia Debts", "title": "Australia’s Commonwealth takes over state debts", "region": "world", "line": "The 1927 Financial Agreement had the federal government take over state debts and created a Loan Council to manage all borrowing."}, {"year": 1990, "short": "German Unity", "title": "Reunified Germany absorbs East German debts", "region": "europe", "line": "At reunification, Bonn and the western states borrowed jointly for a unity fund, and federal funds later took over East German debts."}], "opp": {"lastTime": "Speculators who had bought soldiers’ and states’ IOUs cheaply profited. Congress chartered Hamilton’s Bank of the United States in 1791, and trading in the new federal bonds led to the 1792 Buttonwood Agreement, the root of the New York Stock Exchange.", "ideas": [{"kind": "build", "title": "Tools to track joint-fund milestones", "line": "Software that helps towns and firms apply for, track and report on milestone-based EU funds could stay in demand if joint borrowing becomes routine."}, {"kind": "build", "title": "Cross-border project partnerships", "line": "Services that match firms across member states for jointly funded EU projects, such as defence or grid links, may grow as shared funding expands."}, {"kind": "work", "title": "EU funds and public debt roles", "line": "Grant managers, auditors and debt specialists may be needed to run and check pooled EU spending, and to plan its repayment through 2058."}, {"kind": "learn", "title": "Shared bonds and fiscal rules", "line": "Learning how joint bonds, credit ratings and EU fiscal rules work helps explain fights like the one between the “frugal” states and southern members."}], "watch": "Watch whether joint EU borrowing, like the 2025 SAFE defence loans, continues after NextGenerationEU ends in 2026, making shared debt a habit."}}, {"id": "vaccine", "theme": "A breakthrough vaccine meets fear and backlash", "rhyme": 3, "then": {"year": 1796, "short": "First Vaccine", "title": "Edward Jenner’s Smallpox Vaccine", "where": "Berkeley, England", "region": "europe", "hook": "A country doctor used cowpox to protect a boy from smallpox, giving us the word “vaccine”.", "text": "On 14 May 1796, Edward Jenner put cowpox from milkmaid Sarah Nelmes into scratches on eight-year-old James Phipps, who later resisted smallpox. In 1802 a James Gillray cartoon showed vaccinated people sprouting cows. After England made infant vaccination compulsory in 1853, anti-vaccination leagues formed."}, "now": {"year": 2020, "short": "mRNA Vaccines", "title": "The mRNA COVID-19 Vaccines", "where": "Worldwide", "region": "world", "hook": "Winter 2020–21: vaccine queues, sore arms, and heated family arguments about the jab.", "text": "Less than a year after the virus was identified, Britain approved the Pfizer-BioNTech vaccine on 2 December 2020, the first mRNA vaccine ever approved. Moderna’s followed weeks later. Billions of doses followed, and so did false claims about microchips and altered DNA and protests against mandates."}, "followed": "Vaccination spread worldwide despite resistance, and in 1898 Britain let parents opt out as “conscientious objectors”. Smallpox was declared eradicated in 1980.", "next": {"short": "Gene Shots", "title": "A gene-editing shot meets old fears", "text": "Around 2244, a new kind of shot might reprogram cells, perhaps editing genes or training immunity against cancer and old age. Its promise could meet fears of tampering with human nature, spreading faster than any cartoon.", "watch": "Watch trust in health agencies, how fast false health claims spread, and fights over mandates and opt-outs."}, "breaks": "Smallpox killed about three in ten people it infected, while COVID-19 was far milder for most people, which made the case for mandates more contested.", "older": "The Boston smallpox inoculation fight, 1721", "echoes": [{"year": 1721, "short": "Boston Smallpox", "title": "Boston’s smallpox inoculation fight", "region": "us", "line": "Cotton Mather and Zabdiel Boylston promoted inoculation during an epidemic, and the backlash was fierce: someone threw a bomb into Mather’s house."}, {"year": 1763, "short": "Paris Ban", "title": "Paris bans smallpox inoculation", "region": "europe", "line": "Amid a smallpox outbreak some blamed on inoculation, the Paris Parlement banned the practice in the city until doctors and theologians ruled."}, {"year": 1774, "short": "Marblehead Riot", "title": "Marblehead burns its smallpox hospital", "region": "us", "line": "Fearing a new private inoculation hospital would spread smallpox and scare off ships, Marblehead townspeople sneaked onto its island and burned it."}, {"year": 1885, "short": "Leicester March", "title": "The Leicester anti-vaccination march", "region": "europe", "line": "Tens of thousands marched in Leicester against compulsory smallpox vaccination, led by men jailed for not vaccinating their children."}, {"year": 1904, "short": "Vaccine Revolt", "title": "Rio de Janeiro’s Vaccine Revolt", "region": "latam", "line": "A law making smallpox vaccination compulsory sparked a week of riots in Rio, leaving about 30 dead before the mandate was suspended."}, {"year": 1955, "short": "Polio Vaccine", "title": "Salk’s polio vaccine and the Cutter incident", "region": "us", "line": "Weeks after Jonas Salk’s polio vaccine was declared safe, faulty Cutter batches with live virus caused paralysis and ten deaths, shaking trust."}, {"year": 1998, "short": "MMR Scare", "title": "Wakefield’s MMR autism scare", "region": "europe", "line": "A Lancet paper by Andrew Wakefield, later retracted, linked the MMR vaccine to autism; UK vaccination rates fell and measles cases rose."}, {"year": 2003, "short": "Polio Boycott", "title": "Northern Nigeria’s polio vaccine boycott", "region": "africa", "line": "Kano and other northern Nigerian states halted polio vaccination amid rumors it caused infertility and HIV; polio cases surged and spread abroad."}], "opp": {"lastTime": "Vaccinators were in demand: Spain’s Balmis Expedition carried cowpox to the Americas, the Philippines and China from 1803, and Britain’s 1840 Vaccination Act made vaccination free. In 2021 the WHO set up an mRNA technology hub in Cape Town.", "ideas": [{"kind": "build", "title": "Regional vaccine manufacturing", "line": "Vaccine and mRNA production closer to home, like the WHO-backed hub in Cape Town, could grow as regions seek their own supply."}, {"kind": "build", "title": "Plain-language vaccine answers", "line": "Services that answer vaccine questions in local languages, for clinics, schools and pharmacies, may be needed as false health claims spread online."}, {"kind": "work", "title": "Vaccine safety monitoring", "line": "Pharmacovigilance roles that track side effects, needed since the 1955 Cutter incident, tend to grow with each new type of vaccine."}, {"kind": "learn", "title": "Explaining risk with real numbers", "line": "Explaining absolute versus relative risk, base rates and side-effect reports, such as the UK’s Yellow Card scheme, is a skill health debates keep needing."}], "watch": "Watch approvals of personalised mRNA cancer vaccines, public funding for mRNA research, and childhood vaccination rates as a gauge of trust."}}, {"id": "luddites", "theme": "Workers fear machines will take their jobs", "rhyme": 3, "then": {"year": 1811, "short": "Luddites", "title": "The Luddite Machine-Breakers", "where": "Nottinghamshire, England", "region": "europe", "hook": "English textile workers smashed machines taking their jobs and gave us the word “Luddite”.", "text": "From March 1811, stocking knitters near Nottingham, signing letters as “General Ludd”, smashed the frames of employers who cut pay and used cheaper, less-skilled labour. The revolt spread to Yorkshire and Lancashire. Parliament made machine-breaking a capital crime in 1812, and about 12,000 troops were deployed."}, "now": {"year": 2023, "short": "AI Anxiety", "title": "AI Anxiety and the Writers’ Strike", "where": "Hollywood, United States", "region": "us", "hook": "2023: ChatGPT writing office emails, and Hollywood writers on picket lines over AI.", "text": "Months after ChatGPT’s launch, generative AI spread into offices. Hollywood writers struck for 148 days from May 2023 and won rules that AI cannot count as a writer and studios cannot make writers use it. Actors struck too, partly over digital replicas."}, "followed": "Troops, hangings and mass trials at York in 1813 crushed the movement within a few years. Mechanised mills spread, and hand weavers’ earnings collapsed, though average wages rose decades later.", "next": {"short": "Human-Made", "title": "Workers bargain over what stays human", "text": "Around 2235, a new wave of machines, perhaps robots with general skills, might reach work once thought safe, like care or teaching. Workers could strike or push for laws and labels that keep some tasks human.", "watch": "Watch contract clauses that limit automation, how fast humanoid robots get cheaper, and whether productivity gains reach wages."}, "breaks": "The Luddites faced soldiers and the gallows and lost, while the 2023 writers bargained within the law and won limits on AI in their contract.", "echoes": [{"year": 1675, "short": "Weavers’ Riot", "title": "London weavers riot against engine looms", "region": "europe", "line": "London silk weavers rioted for days, smashing and burning the engine looms they feared would undercut their pay and jobs."}, {"year": 1826, "short": "Power-Loom Riots", "title": "Lancashire’s power-loom riots", "region": "europe", "line": "Handloom weavers, impoverished by factory looms, smashed over 1,000 power looms across east Lancashire; troops shot six rioters dead."}, {"year": 1830, "short": "Swing Riots", "title": "The Swing Riots", "region": "europe", "line": "Farm labourers across southern England smashed threshing machines that took their winter work, sending threats signed “Captain Swing”; 19 were hanged."}, {"year": 1986, "short": "Wapping Dispute", "title": "The Wapping print dispute", "region": "europe", "line": "Rupert Murdoch’s papers moved to a computerised plant at Wapping; about 6,000 print workers struck, were dismissed, and lost after a year."}, {"year": 2024, "short": "Port Strike", "title": "US dockworkers strike over automation", "region": "us", "line": "About 45,000 dockworkers shut 36 East and Gulf Coast ports for three days, demanding higher pay and a full ban on automation."}], "opp": {"lastTime": "Machine builders gained: Manchester’s Richard Roberts improved the power loom and built a self-acting spinning mule, and mechanics’ institutes opened in Edinburgh, Glasgow and London in the early 1820s to teach workers mechanical skills.", "ideas": [{"kind": "build", "title": "Labels for human-made work", "line": "Tools that verify and label human-made writing, art and voice work, using standards like C2PA content credentials, could grow as AI content spreads."}, {"kind": "work", "title": "People who check AI output", "line": "Like the mechanics who kept looms running, people who check, correct and supervise AI output in law, medicine and media may be in demand."}, {"kind": "work", "title": "Negotiators of automation clauses", "line": "Union staff, lawyers and HR specialists who write AI clauses into contracts, as Hollywood writers won in 2023, may be needed across more industries."}, {"kind": "learn", "title": "Spotting AI errors in your field", "line": "Deep knowledge of one trade, plus the ability to judge where AI tools fail in it, tends to hold value as routine tasks automate."}], "watch": "Watch whether AI clauses spread from Hollywood into other union contracts, and whether wages rise along with productivity in AI-heavy jobs."}}, {"id": "railway", "theme": "A new machine starts carrying the public", "rhyme": 2, "then": {"year": 1830, "short": "Liverpool Line", "title": "The Liverpool and Manchester Railway Opens", "where": "Liverpool and Manchester, England", "region": "europe", "hook": "The world’s first inter-city railway opened, and a locomotive ran over a leading politician.", "text": "The 31-mile line opened on 15 September 1830, with Prime Minister the Duke of Wellington aboard. At a stop, Liverpool MP William Huskisson stepped onto the track and was hit by the locomotive Rocket, dying that evening. Even so, the line carried over a million passengers in its first two years."}, "now": {"year": 2024, "short": "Robotaxis", "title": "Robotaxis Open to the Public", "where": "San Francisco and Wuhan", "region": "world", "hook": "2024: driverless cars ferrying riders around San Francisco, and a crowd setting one ablaze.", "text": "In June 2024 Waymo opened its driverless taxis to anyone in San Francisco. Rival Cruise had its California permit suspended after one of its cars dragged a pedestrian in 2023. In Wuhan, Baidu’s Apollo Go ran hundreds of robotaxis, worrying local taxi drivers."}, "followed": "Despite the death, passengers flocked to the line, and its success set off railway building across Britain and the world. By 1850 Britain had about 6,000 miles of railway.", "next": {"short": "Rocket Commute", "title": "Pilotless rockets carry everyday travellers", "text": "Around 2218, a new machine, perhaps a pilotless rocket crossing continents in under an hour, might open to ordinary travellers. Its first public trips could bring a famous accident, and fears that fade only once trips become routine.", "watch": "Watch how courts assign blame when self-driving machines crash, and whether public trust follows their safety records."}, "breaks": "The railway still had human drivers and created many new jobs, while robotaxis take the human out of the driving seat.", "echoes": [{"year": 1807, "short": "Fulton’s Steamer", "title": "Fulton’s steamboat starts passenger service", "region": "us", "line": "Robert Fulton’s steamboat began scheduled trips between New York and Albany, becoming the first steamboat service to make money."}, {"year": 1857, "short": "Otis Elevator", "title": "The first passenger elevator opens", "region": "us", "line": "Elisha Otis, whose safety brake eased fears of falling, installed the first passenger elevator in a New York store."}, {"year": 1863, "short": "The Underground", "title": "London opens the first underground railway", "region": "europe", "line": "Steam trains began carrying passengers through tunnels under London, and 38,000 people rode the Metropolitan Railway on its first day."}, {"year": 1914, "short": "Airboat Line", "title": "A flying boat starts scheduled airline service", "region": "us", "line": "The St. Petersburg–Tampa Airboat Line flew paying passengers across Tampa Bay; the first ticket, auctioned off, went to an ex-mayor for $400."}, {"year": 1952, "short": "Comet Jetliner", "title": "The first jet airliner enters service", "region": "europe", "line": "BOAC’s Comet began the first jet passenger flights, but two mid-air breakups in 1954, traced to metal fatigue, grounded the fleet."}, {"year": 1964, "short": "Bullet Train", "title": "Japan’s bullet train opens", "region": "world", "line": "The Tokaido Shinkansen opened between Tokyo and Osaka days before the Olympics, the first railway built to run regularly above 200 km/h."}], "opp": {"lastTime": "Railways created new trades: George Bradshaw’s printed timetables from 1839, Thomas Cook’s first rail excursion in 1841 and W. H. Smith’s station bookstalls from 1848, plus thousands of jobs for porters, signalmen and clerks.", "ideas": [{"kind": "build", "title": "Depots for driverless fleets", "line": "Charging, cleaning and repair depots for robotaxi fleets could be in demand as driverless rides expand to more cities."}, {"kind": "build", "title": "Independent safety checks for robot cars", "line": "Independent testing and crash investigation for driverless vehicles, serving insurers, cities and regulators, may grow as public trust follows safety records."}, {"kind": "work", "title": "Remote assistants and fleet technicians", "line": "Remote operators who help stuck vehicles, sensor technicians and fleet mechanics may grow in number, offering paths for some displaced drivers."}, {"kind": "learn", "title": "Safety cases for autonomous systems", "line": "Learning how safety cases are built for autonomous vehicles, under standards like ISO 21448 and UL 4600, is a niche likely to grow."}], "watch": "Watch how many cities license driverless rides without safety drivers, and whether insurers charge less to cover them than human-driven taxis."}}, {"id": "mania", "theme": "A building boom races ahead of profits", "rhyme": 2, "then": {"year": 1845, "short": "Railway Mania", "title": "Britain’s Railway Mania", "where": "Britain", "region": "europe", "hook": "Victorian Britons poured their savings into railway shares, until the bubble burst.", "text": "Cheap money and a hunt for returns sent railway shares soaring. In 1846 alone, Parliament authorised about 9,500 miles of new line. Middle-class savers, including the Brontë sisters, bought in, and George Hudson, the “Railway King”, became the face of the boom."}, "now": {"year": 2024, "short": "AI Build-Out", "title": "The AI Data-Centre Building Boom", "where": "United States and beyond", "region": "us", "hook": "2024: Nvidia briefly becoming the world’s most valuable company as tech giants built data centres.", "text": "In 2024 Microsoft, Alphabet, Amazon and Meta together spent over $200 billion on capital projects, much of it on AI data centres and chips. Microsoft signed a deal to restart a Three Mile Island reactor for power. A Sequoia partner called the gap between spending and revenue “AI’s $600 billion question”."}, "followed": "By 1849 railway shares had lost nearly two-thirds of their value, and Hudson was disgraced for fraud. Yet the lines that were built became the core of Britain’s rail network.", "next": {"short": "Orbital Rush", "title": "A rush to build in orbit", "text": "Around 2203, investors might pour fortunes into the next big infrastructure bet, perhaps power or computing in orbit, long before customers pay for it. A crash could ruin backers yet leave useful hardware behind.", "watch": "Watch for spending growing far faster than revenue, building funded by debt, and claims that “this time is different”."}, "breaks": "Railway Mania was fed by small investors in new companies, while most AI building in 2024 was paid for by tech giants with large existing profits.", "older": "Britain’s canal mania, 1793", "echoes": [{"year": 1793, "short": "Canal Mania", "title": "Britain’s canal mania", "region": "europe", "line": "Investors piled into canal schemes, and Parliament approved dozens in a few years; some never paid a dividend or were never finished."}, {"year": 1841, "short": "State Defaults", "title": "US states default after a canal boom", "region": "us", "line": "US states borrowed for canals and railways, expecting tolls to repay the loans; after the 1837 panic, Indiana, Pennsylvania and others defaulted."}, {"year": 1873, "short": "Panic of 1873", "title": "America’s railroad boom ends in panic", "region": "us", "line": "After 33,000 miles of new track in five years, Jay Cooke’s bank failed with unsold Northern Pacific bonds, setting off a depression."}, {"year": 1931, "short": "Empty State", "title": "The Empire State Building opens mostly empty", "region": "us", "line": "Built in a late-1920s skyscraper race, the Empire State Building opened 75 percent empty and earned no profit until the 1950s."}, {"year": 2001, "short": "Telecom Bust", "title": "The fibre-optic telecom bust", "region": "us", "line": "Telecom firms borrowed to lay fibre-optic cable far beyond demand; when the bubble burst, much sat unused and Global Crossing went bankrupt."}, {"year": 2008, "short": "Spain’s Bust", "title": "Spain’s building boom goes bust", "region": "europe", "line": "Spain’s construction boom crashed, leaving empty flats and ghost airports like Ciudad Real, built for €1.1 billion and sold for €10,000."}, {"year": 2021, "short": "Evergrande", "title": "China’s property giant Evergrande defaults", "region": "china", "line": "China’s long building boom left developers with unsold flats and huge debts, and Evergrande, owing about $300 billion, defaulted."}], "opp": {"lastTime": "Contractors like Thomas Brassey and Samuel Morton Peto, and up to 250,000 navvies, were in demand. After the 2001 telecom bust, unused “dark fibre” sold cheaply and later carried the broadband and online video boom.", "ideas": [{"kind": "build", "title": "Reusing data-centre waste heat", "line": "Systems that pipe data-centre heat into homes, greenhouses or district heating may spread as power-hungry sites face local pushback."}, {"kind": "build", "title": "Second-hand computing capacity", "line": "If the build-out overshoots, services that rent surplus chips and server space cheaply to universities and small firms could grow, like post-2001 dark fibre."}, {"kind": "work", "title": "Electricians and grid engineers", "line": "Data centres need electricians, high-voltage engineers and cooling technicians, skills that stay useful even if the boom cools."}, {"kind": "learn", "title": "Reading a boom’s numbers", "line": "Comparing capital spending with revenue, and spotting building funded by debt, helps judge whether an infrastructure boom is overreaching."}], "watch": "Watch whether AI revenue catches up with data-centre spending, and how much new building is funded by debt instead of existing profits."}}, {"id": "springtime", "theme": "Uprisings leap across many countries at once", "rhyme": 2, "then": {"year": 1848, "short": "1848 Revolts", "title": "The Revolutions of 1848", "where": "Across Europe", "region": "europe", "hook": "The “Springtime of Peoples”: in weeks, revolt spread from Paris to Vienna, Berlin and Budapest.", "text": "Revolt broke out in Palermo in January 1848, and Parisians toppled King Louis-Philippe in February. In March, Vienna’s uprising forced Chancellor Metternich to flee, and Berliners fought troops on barricades. Rebels demanded constitutions, free speech and national unity after bad harvests and an economic crisis."}, "now": {"year": 2019, "short": "2019 Protests", "title": "The Global Protest Wave of 2019", "where": "From Santiago to Beirut", "region": "world", "hook": "October 2019: huge crowds in Santiago, Beirut and Baghdad, all in the same weeks.", "text": "In 2019, protests often sparked by everyday costs spread across continents: a metro fare rise in Chile, a WhatsApp tax in Lebanon, fuel subsidy cuts in Ecuador. Sudan’s Omar al-Bashir and Algeria’s Abdelaziz Bouteflika were forced out, and the prime ministers of Lebanon and Iraq resigned."}, "followed": "By 1849 most revolts had been crushed and conservative rule restored. Yet the Austrian Empire’s end of serfdom stuck, and nationalism fed Italian and German unification within about two decades.", "next": {"short": "Protest Wave", "title": "Protests leap across a connected planet", "text": "Around 2190, a shared shock, perhaps a price spike or a viral image, might set off protests in dozens of countries within days. Some leaders could fall while the systems behind them adapt and survive.", "watch": "Watch for living-cost shocks hitting many countries at once, crowded young cities, and leaders who stay in power for decades."}, "breaks": "The 1848 rebels shared ideas of liberty and nationhood across one continent, while the 2019 protests had mostly separate, local causes across many.", "older": "The revolutions of 1830", "echoes": [{"year": -499, "short": "Ionian Revolt", "title": "The Ionian Revolt against Persia", "region": "mideast", "line": "Miletus’s leader ousted Persian-backed tyrants across Ionia, and the revolt leapt to Caria, Byzantium and Cyprus, according to Herodotus, the main source."}, {"year": 1381, "short": "Revolts 1378–82", "title": "Europe’s wave of revolts, 1378 to 1382", "region": "europe", "line": "Within five years, worker, peasant and tax revolts erupted in Florence, Ghent, England, Rouen and Paris, as news passed between them."}, {"year": 1820, "short": "1820 Revolts", "title": "The revolutions of 1820", "region": "europe", "line": "A Spanish army revolt forced the king to restore a liberal constitution, and within months revolts broke out in Naples and Portugal."}, {"year": 1830, "short": "1830 Revolts", "title": "The revolutions of 1830", "region": "europe", "line": "France’s July Revolution toppled Charles X, and within months revolts broke out in Belgium, which won independence, and in Russian-ruled Poland."}, {"year": 1919, "short": "1919 Uprisings", "title": "The anticolonial uprisings of 1919", "region": "world", "line": "In spring 1919, mass protests against foreign domination erupted in Egypt, Korea, India and China, all invoking Wilson’s promise of self-determination."}, {"year": 1968, "short": "1968 Protests", "title": "The global protests of 1968", "region": "world", "line": "Protests swept Paris, West Germany, Mexico City and US campuses within months, as students worldwide shared slogans and television images."}, {"year": 1989, "short": "1989 Revolutions", "title": "The fall of communism in Eastern Europe", "region": "europe", "line": "Within months, communist governments fell in Poland, Hungary, East Germany, Bulgaria, Czechoslovakia and Romania, each crowd inspired by the last."}, {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring", "region": "mideast", "line": "After Tunisia’s ruler fled, protests leapt within weeks to Egypt, Libya, Yemen, Bahrain and Syria, spread by satellite TV and social media."}], "opp": {"lastTime": "Peasants in the Austrian Empire were freed from forced labour dues in September 1848, and Piedmont, Switzerland and the Netherlands gained new constitutions. Exiled “Forty-Eighters” like Carl Schurz built new careers in the United States.", "ideas": [{"kind": "build", "title": "Tools for citizens’ assemblies", "line": "Platforms that run citizens’ assemblies, consultations and participatory budgets may be in demand where protests push governments to rewrite rules, as in Chile."}, {"kind": "build", "title": "Verifying viral protest footage", "line": "Services that verify viral videos and images by time and place could help newsrooms and rights groups when protests leap between countries."}, {"kind": "work", "title": "Mediators and dialogue facilitators", "line": "Mediators who bring governments, unions and protest groups to the table, as Tunisia’s National Dialogue Quartet did, tend to be needed after protest waves."}, {"kind": "learn", "title": "Constitutional design basics", "line": "Knowing how constitutions, electoral systems and term limits are designed helps, as Chile’s 2019 protests led to two rejected drafts in 2022 and 2023."}], "watch": "Watch for the same living-cost shock, such as a fuel or food price spike, hitting many import-dependent countries in the same season."}}, {"id": "cable", "theme": "Wiring the planet for instant contact", "rhyme": 2, "then": {"year": 1858, "short": "Atlantic Cable", "title": "The First Transatlantic Telegraph Cable", "where": "Ireland to Newfoundland", "region": "world", "hook": "Queen Victoria and President Buchanan traded messages under the Atlantic, and then the cable died.", "text": "Cyrus Field’s company completed a cable from Ireland to Newfoundland on 5 August 1858. Queen Victoria’s 98-word greeting to President Buchanan took about 16 hours to send. New York celebrated with fireworks that set City Hall alight, but the cable failed after about three weeks."}, "now": {"year": 2019, "short": "Starlink", "title": "SpaceX Launches the First Starlink Satellites", "where": "Cape Canaveral, United States", "region": "us", "hook": "2019: a neat line of bright dots gliding across the night sky, Starlink’s first satellites.", "text": "In May 2019 a Falcon 9 rocket carried 60 Starlink satellites into orbit, the start of SpaceX’s plan to beam internet everywhere. Astronomers soon complained of streaks across their images. Within six years, thousands of satellites served millions of users, including Ukraine’s military."}, "followed": "In 1866 the giant steamship Great Eastern laid a lasting cable. Within decades, undersea lines linked every inhabited continent, letting markets, newspapers and empires react within hours.", "next": {"short": "Solar Web", "title": "A network stretching across the solar system", "text": "Around 2180, laser links might join Earth, the Moon and settlements on Mars into one network. Even at light speed, each message to Mars would take between about 3 and 22 minutes.", "watch": "Watch deep-space laser tests, the crowding of low Earth orbit, and how much of the world’s connectivity a few companies control."}, "breaks": "The 1858 cable linked just two points and soon died, while Starlink kept growing into a global network run by a single company.", "older": "Claude Chappe’s optical telegraph, 1794", "echoes": [{"year": 840, "short": "Beacon Chain", "title": "Byzantium’s fire beacons warn the capital", "region": "europe", "line": "Under Emperor Theophilos, nine hilltop fire beacons could flash warnings of Arab raids about 720 km to Constantinople within an hour."}, {"year": 1794, "short": "Chappe Telegraph", "title": "Chappe’s optical telegraph links Paris and Lille", "region": "europe", "line": "Claude Chappe’s 15 semaphore towers spanned 230 km from Lille to Paris and reported the recapture of Le Quesnoy within an hour."}, {"year": 1901, "short": "Marconi Signal", "title": "Marconi’s radio signal crosses the Atlantic", "region": "world", "line": "Guglielmo Marconi reported hearing the Morse letter “S” in Newfoundland, sent by radio from Cornwall, showing signals could cross oceans without wires."}, {"year": 1903, "short": "Pacific Cable", "title": "Roosevelt’s message circles the globe by cable", "region": "world", "line": "A new Pacific cable via Hawaii reached Manila, and Roosevelt’s July 4 greeting became the first message sent around the world."}, {"year": 1956, "short": "TAT-1 Cable", "title": "The first transatlantic telephone cable opens", "region": "world", "line": "TAT-1 linked Scotland and Newfoundland, carrying 707 calls on its first day, far clearer than the old radio telephone service."}, {"year": 1962, "short": "Telstar", "title": "Telstar beams live TV across the Atlantic", "region": "world", "line": "The Telstar satellite relayed the first live TV across the Atlantic, and like the 1858 cable, it failed within months."}, {"year": 1988, "short": "TAT-8 Fiber", "title": "The first transatlantic fiber-optic cable", "region": "world", "line": "TAT-8 linked the US, Britain and France with glass fibers able to carry 40,000 calls, the first optical cable across an ocean."}, {"year": 1998, "short": "Iridium", "title": "The Iridium satellite phone network", "region": "world", "line": "Motorola-backed Iridium put 66 satellites in low orbit so phones could call from anywhere, but went bankrupt nine months after service began."}], "opp": {"lastTime": "Cable makers like the Telegraph Construction and Maintenance Company thrived, demand for gutta-percha insulation thinned wild trees in Southeast Asia, and news agencies like Reuters sold fast foreign news. William Thomson, later Lord Kelvin, grew rich from cable patents.", "ideas": [{"kind": "build", "title": "Services for newly connected places", "line": "Telehealth, remote schooling and farm monitoring for villages, ships and islands newly reached by satellite internet could grow, as cables once opened markets."}, {"kind": "build", "title": "Tracking crowded orbits", "line": "Services that track satellites and debris and warn of collisions may be in demand as tens of thousands more satellites launch."}, {"kind": "work", "title": "Cable and satellite network technicians", "line": "Subsea cable repair crews, ground-station engineers and satellite operators may be in short supply, as Baltic and Red Sea cable cuts showed."}, {"kind": "learn", "title": "How spectrum and orbits are shared", "line": "Learning how the ITU coordinates radio spectrum and orbital filings, and how countries license satellite internet, is useful as networks compete for space."}], "watch": "Watch whether rival satellite networks, such as the EU’s IRIS² and China’s constellations, reach service, and how often subsea cables are cut."}}, {"id": "carrington", "theme": "A solar storm tests a wired world", "rhyme": 2, "then": {"year": 1859, "short": "Carrington", "title": "The Carrington Event", "where": "Worldwide", "region": "world", "hook": "The most intense solar storm on record made telegraphs spark and lit auroras near the tropics.", "text": "On 1 September 1859, English astronomer Richard Carrington saw a brilliant white flare on the Sun. About 18 hours later a severe geomagnetic storm struck, shocking telegraph operators and letting some lines work with batteries disconnected. Auroras were seen as far south as Cuba and Hawaii."}, "now": {"year": 2024, "short": "Gannon Storm", "title": "The May 2024 Gannon Solar Storm", "where": "Worldwide", "region": "world", "hook": "May 2024: phone photos of pink and green skies from places that rarely see auroras.", "text": "From 10 May 2024, eruptions from a giant sunspot group caused the first “extreme” G5 geomagnetic storm since 2003, later named after scientist Jennifer Gannon. Auroras appeared as far south as Mexico and northern India. GPS errors stalled some self-steering tractors at planting time, but no major blackouts followed."}, "followed": "Telegraphs recovered within days, and 1859 became the benchmark for worst-case planning. In March 1989 a weaker storm blacked out Quebec’s power grid for about nine hours.", "next": {"short": "Superstorm", "title": "A Carrington-sized storm hits a wired world", "text": "Around 2189, a storm as strong as 1859’s might hit a world running on satellites, grids and perhaps settlements in space. A day’s warning could let operators power down in time; a late warning could mean weeks of blackouts.", "watch": "Watch investment in solar early-warning spacecraft, grid hardening against geomagnetic currents, and near misses like the large July 2012 eruption."}, "breaks": "The 2024 storm was far weaker than 1859’s, and forecasters issued warnings a day or more ahead, something Victorian telegraph operators never had.", "older": "The great aurora seen over Japan and China, 1770", "echoes": [{"year": 774, "short": "Miyake Event", "title": "Tree rings record the 774 solar storm", "region": "world", "line": "Tree rings worldwide record a carbon-14 spike, likely from a solar storm, the strongest in 11,000 years; a repeat could cripple satellites."}, {"year": 1770, "short": "1770 Aurora", "title": "The great aurora over Japan and China", "region": "world", "line": "Auroras lit skies over Japan and China for about nine nights, and Cook’s crew saw them near Timor, a storm rivaling Carrington’s."}, {"year": 1872, "short": "1872 Storm", "title": "The great solar storm of 1872", "region": "world", "line": "A storm rivaling Carrington’s lit auroras as far south as Bombay and disrupted telegraph lines, including the Bombay to Aden undersea cable."}, {"year": 1921, "short": "Railroad Storm", "title": "The 1921 New York Railroad Storm", "region": "world", "line": "Storm currents set a Swedish telegraph exchange and New York railroad signal equipment ablaze, and disrupted telegraphs on several continents."}, {"year": 1967, "short": "Radar Jammed", "title": "A solar storm jams US radar", "region": "us", "line": "A solar storm jammed US missile-warning radars, and commanders who suspected Soviet jamming readied aircraft until forecasters blamed the sun."}, {"year": 1972, "short": "Sea Mine Storm", "title": "The August 1972 solar storm", "region": "world", "line": "A fast solar storm knocked out a Midwest phone cable and likely set off dozens of US sea mines off Vietnam."}, {"year": 1989, "short": "Quebec Blackout", "title": "Solar storm blacks out Quebec", "region": "world", "line": "A geomagnetic storm collapsed Hydro-Québec’s grid in under 90 seconds, leaving millions in Quebec without power for about nine hours."}, {"year": 2003, "short": "Halloween Storms", "title": "The 2003 Halloween solar storms", "region": "world", "line": "Solar storms blacked out part of southern Sweden for an hour, forced satellites into safe mode and rerouted polar flights."}, {"year": 2022, "short": "Starlink Losses", "title": "A solar storm downs Starlink satellites", "region": "world", "line": "A minor geomagnetic storm swelled the upper atmosphere, dragging 38 of 49 newly launched Starlink satellites down to burn up."}], "opp": {"lastTime": "After the 1989 Quebec blackout, Hydro-Québec spent heavily on grid protection, and US rules approved in 2016 required utilities to assess solar storm risk. NOAA’s DSCOVR satellite was launched in 2015 to give earlier warnings from about 1.5 million km away.", "ideas": [{"kind": "build", "title": "Backup positioning and timing", "line": "Positioning and timing backups that keep farms, ships, phone networks and banks running when GPS signals fail may be needed, as May 2024 showed."}, {"kind": "build", "title": "Storm-current protection for grids", "line": "Sensors and blocking devices that protect large transformers from storm-induced currents could find demand as grids electrify and solar storms recur."}, {"kind": "work", "title": "Space weather forecasters", "line": "Space weather forecasters and grid resilience engineers tend to be needed, as national services like the UK Met Office’s, running since 2014, show."}, {"kind": "learn", "title": "How solar storms hit technology", "line": "Learning NOAA’s storm scales and how storms affect transformers, GPS and satellites, like the roughly 40 Starlink satellites lost in February 2022, is useful."}], "watch": "Watch first data from new solar monitors like NOAA’s SWFO-L1, launched in 2025, and grid rules on geomagnetic risk."}}, {"id": "commune", "theme": "French crowds rise against a distant government", "rhyme": 1, "then": {"year": 1871, "short": "Paris Commune", "title": "The Paris Commune", "where": "Paris, France", "region": "europe", "hook": "After France lost to Prussia, Paris workers ran the city themselves for 72 days.", "text": "On 18 March 1871, Paris National Guards stopped the army seizing their cannons, and Adolphe Thiers’ government withdrew to Versailles. The Commune separated church and state and banned night work in bakeries. In the “Bloody Week” of late May, Communards shot hostages including the archbishop, and troops retaking Paris killed thousands."}, "now": {"year": 2018, "short": "Yellow Vests", "title": "The Yellow Vest Protests", "where": "France", "region": "europe", "hook": "Late 2018: high-visibility vests on French roundabouts, and tear gas by the Arc de Triomphe.", "text": "From 17 November 2018, protesters in the high-visibility vests French drivers must carry blocked roundabouts over a planned fuel tax rise. Organised on Facebook, the movement drew heavily from small towns and the countryside. After riots in Paris, President Macron dropped the tax rise and announced about €10 billion in help for low earners."}, "followed": "Tens of thousands were arrested and thousands deported to New Caledonia before an amnesty in 1880. The Third Republic survived, and Marx and later Lenin held up the Commune as a model.", "next": {"short": "Cost Revolt", "title": "A revolt against costs set from above", "text": "Around 2165, people far from power, perhaps in fading towns, might rise against costs set by a faraway capital, such as climate rules or new taxes. Their badge could again be something ordinary, like a vest.", "watch": "Watch for climate or tax rules that hit rural and car-dependent people hardest, and leaderless protests organised online."}, "breaks": "The Commune was an armed takeover of Paris crushed by the army, while the Yellow Vests were a mostly provincial protest movement that won concessions.", "older": "Étienne Marcel’s Paris revolt, 1358", "echoes": [{"year": 1112, "short": "Laon Commune", "title": "Laon’s commune rises against its bishop", "region": "europe", "line": "Laon’s townspeople obtained a commune charter; when their bishop paid the king to revoke it, they rose up and killed him."}, {"year": 1358, "short": "Paris Revolt", "title": "Étienne Marcel’s revolt in Paris", "region": "europe", "line": "After the king’s capture by the English, Paris merchant leader Étienne Marcel defied the Dauphin’s government and briefly controlled the capital."}, {"year": 1382, "short": "Maillotins", "title": "The Maillotins revolt against a new tax", "region": "europe", "line": "When young Charles VI’s regents imposed a new sales tax, Parisians seized mallets from the city hall and attacked tax collectors."}, {"year": 1675, "short": "Red Caps Revolt", "title": "Brittany’s Bonnets Rouges revolt", "region": "europe", "line": "Breton peasants in red caps rose against Louis XIV’s new taxes on stamped paper, tobacco and tin goods, and were harshly crushed."}, {"year": 1789, "short": "Versailles March", "title": "The Women’s March on Versailles", "region": "europe", "line": "Angry at bread prices, Parisians led by market women marched on Versailles and forced the king to leave it for Paris."}, {"year": 1907, "short": "Winegrowers", "title": "The revolt of the Languedoc winegrowers", "region": "europe", "line": "As wine prices collapsed, up to 800,000 rallied in Montpellier, local officials resigned en masse, and Clemenceau sent troops."}, {"year": 1968, "short": "May 1968", "title": "France’s May 1968 protests and strikes", "region": "europe", "line": "Student protests grew into a general strike of millions that shook de Gaulle’s government, which protesters saw as outdated and repressive."}, {"year": 2013, "short": "Red Caps Return", "title": "Brittany’s red caps return", "region": "europe", "line": "Bretons in red caps recalling 1675 wrecked gantries built to collect a new truck ecotax, and the government suspended the tax."}], "opp": {"lastTime": "After the 1907 winegrowers’ revolt, France cracked down on wine fraud. After the Yellow Vests, minimum-wage earners got up to €100 a month more through a top-up benefit, and France ran a Great National Debate and a citizens’ climate convention.", "ideas": [{"kind": "build", "title": "Household climate-cost calculators", "line": "Tools that show rural and car-dependent households how fuel taxes and climate rules affect them, and what aid they can claim, may be needed."}, {"kind": "build", "title": "Rural transport options", "line": "Affordable rural mobility, such as shared rides, on-demand buses and low-cost electric car leasing like France’s 2024 social leasing, could see demand."}, {"kind": "work", "title": "Citizens’ assembly facilitators", "line": "Facilitators and organisers of citizens’ assemblies, debates and consultations may be in demand as governments seek consent for costly climate rules."}, {"kind": "learn", "title": "Who pays for a policy", "line": "Distributional analysis, working out how a tax or climate rule hits households by income and place, helps design rules that hold up."}], "watch": "Watch the EU’s carbon price on road fuel and heating, delayed to 2028, and how governments compensate rural and low-income households."}}, {"id": "phone", "theme": "A new phone rewires daily life", "rhyme": 2, "then": {"year": 1876, "short": "Bell’s Phone", "title": "Bell Patents the Telephone", "where": "Boston, United States", "region": "us", "hook": "“Mr. Watson, come here, I want to see you”: the famous first telephone call.", "text": "Alexander Graham Bell filed his telephone patent on 14 February 1876, the same day rival Elisha Gray filed notice of a similar idea. It was granted on 7 March. Three days later in Boston, Bell called his assistant Thomas Watson from the next room."}, "now": {"year": 2007, "short": "iPhone", "title": "Apple Unveils the iPhone", "where": "San Francisco, United States", "region": "us", "hook": "2007: Steve Jobs unveiling the iPhone on stage, then fans queuing overnight to buy one.", "text": "On 9 January 2007 at Macworld in San Francisco, Steve Jobs unveiled the iPhone, a touchscreen phone, iPod and internet device in one. It went on sale in the US on 29 June from $499 with an AT&T contract. The App Store followed in 2008."}, "followed": "Bell’s company fought off hundreds of patent challenges and grew into the Bell System. In 1915 Bell, in New York, made the first transcontinental call, to Watson in San Francisco.", "next": {"short": "Thought Phone", "title": "A device that reads thoughts goes mainstream", "text": "Around 2138, a new personal device, perhaps a brain implant or smart lens, might replace the phone. People could send words or images by thought, and daily life could reorganise around it within a decade.", "watch": "Watch brain implants moving from medical trials to healthy users, and early laws on who owns neural data."}, "breaks": "Bell’s phone took decades to reach most homes and carried only voice, while smartphones reached billions within about a decade and carried the i
