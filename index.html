shortages leave weak states unable to hold their frontier regions.", "watch": "Governments losing control of border areas, groups invoking colonial-era maps as a grievance, and disputes over shared rivers like the Tigris and Euphrates."}, "breaks": "Today’s borders were mostly set by deals after 1918 that departed from the 1916 map, and ISIS lost its last territory in 2019.", "older": "The First Partition of Poland, 1772", "echoes": [{"year": 1772, "short": "Poland Divided", "title": "The First Partition of Poland", "region": "europe", "line": "Russia, Prussia and Austria seized about a third of Poland; Polish insurgents rose against the partitions in 1794, 1830 and 1863."}, {"year": 1893, "short": "Durand Line", "title": "Britain draws the Durand Line", "region": "india", "line": "Britain drew a border splitting Pashtun lands between Afghanistan and British India; Afghanistan never recognized it, and Pashtun fighters defied it."}, {"year": 1967, "short": "Biafra", "title": "The Biafran War", "region": "africa", "line": "Biafra declared independence from Nigeria, a country whose borders Britain had drawn; the war and famine that followed killed perhaps a million."}]}, {"id": "flu", "theme": "A pandemic in a hyper-connected world", "rhyme": 3, "then": {"year": 1918, "short": "Spanish Flu", "title": "The Spanish Flu", "where": "Worldwide", "region": "world", "hook": "The pandemic that killed more people than the First World War.", "text": "From 1918 to 1920 an influenza pandemic infected about a third of the world’s people and killed an estimated 50 million. It struck healthy young adults especially hard. It was called “Spanish” because neutral Spain’s uncensored press reported it openly."}, "now": {"year": 2020, "short": "COVID-19", "title": "The COVID-19 Pandemic", "where": "Worldwide", "region": "world", "hook": "Spring 2020: empty streets, homemade bread, and life on video calls.", "text": "The WHO declared COVID-19 a pandemic on 11 March 2020. By April about half of humanity lived under some form of lockdown. Vaccines arrived within a year, and over 7 million deaths were officially reported, though the true toll was likely much higher."}, "followed": "After further waves the flu faded in 1920. Many countries invested in public health, with Britain creating a Ministry of Health in 1919, and the Roaring Twenties followed.", "next": {"short": "Next Pandemic", "title": "A new virus in a crowded world", "text": "Around 2122, a new virus, perhaps a bird flu, could circle the globe within weeks. Vaccines might be designed in days, but how fast people accept them could decide the death toll.", "watch": "Bird flu spreading between mammals, outbreaks where farms and forests meet, and how quickly vaccines can be made, shipped and trusted."}, "breaks": "In 1918 doctors did not know a virus caused flu; in 2020 scientists sequenced the virus within weeks and had vaccines within a year.", "older": "The Black Death, 1347", "echoes": [{"year": 541, "short": "Justinian Plague", "title": "The Plague of Justinian", "region": "europe", "line": "Bubonic plague rode grain ships from Egypt to Constantinople and spread along Mediterranean trade routes, killing millions across the Roman world."}, {"year": 1347, "short": "Black Death", "title": "The Black Death", "region": "world", "line": "Plague spread along Silk Road caravans and Genoese trading ships, killing perhaps a third to half of Europe’s people within five years."}, {"year": 1889, "short": "Russian Flu", "title": "The 1889 Russian flu", "region": "world", "line": "Carried by rail and steamship, a new flu swept the Northern Hemisphere in about four months, killing roughly a million people."}, {"year": 1957, "short": "Asian Flu", "title": "The 1957 Asian flu", "region": "world", "line": "A new flu strain from China spread worldwide within months, killing over a million, as labs raced to make vaccines."}]}, {"id": "weimar", "theme": "Printing money until it is worthless", "rhyme": 3, "then": {"year": 1923, "short": "Hyperinflation", "title": "Weimar Germany’s Hyperinflation", "where": "Germany", "region": "europe", "hook": "Germans carted banknotes in wheelbarrows, and children played with bundles of worthless money.", "text": "In January 1923 France and Belgium occupied the Ruhr after Germany fell behind on reparations. The government printed money to pay striking workers, and by autumn prices doubled every few days. By November one US dollar cost 4.2 trillion marks."}, "now": {"year": 2018, "short": "Venezuela", "title": "Venezuela’s Hyperinflation", "where": "Venezuela", "region": "latam", "hook": "2018: a chicken pictured beside stacks of bolívars, and handbags woven from worthless notes.", "text": "In 2018 Venezuela’s prices rose 130,060% by the central bank’s own count, and outside estimates ran far higher. In August the government cut five zeros from the bolívar. By November the UN said 3 million Venezuelans had left the country."}, "followed": "A new currency, the Rentenmark, ended the crisis in November 1923, and the 1924 Dawes Plan eased reparations. Many Germans had lost their savings, a wound many historians link to later support for extremists.", "next": {"short": "Money Collapse", "title": "A currency printed into worthlessness", "text": "Around 2113, a government buried in debt or cut off from markets might again print money until its currency collapses, as savers flee into foreign or digital money.", "watch": "Central banks funding governments directly, price controls, mass emigration, and ordinary people switching to dollars or cryptocurrencies to protect savings."}, "breaks": "Germany stabilized its money in late 1923; Venezuela’s crisis dragged on for years, blamed by many economists on mismanagement and by its government on US sanctions.", "older": "Revolutionary France’s assignats, 1795", "echoes": [{"year": 1779, "short": "Continentals", "title": "The collapse of the Continental dollar", "region": "us", "line": "Congress printed Continental dollars to pay for the Revolution until they were nearly worthless, giving rise to “not worth a Continental.”"}, {"year": 1795, "short": "Revolutionary F…", "title": "Revolutionary France’s assignats", "region": "world", "line": ""}, {"year": 1946, "short": "Hungary’s Pengő", "title": "Hungary’s record hyperinflation", "region": "europe", "line": "In the worst hyperinflation ever recorded, Hungarian prices doubled about every 15 hours, and a 100 quintillion pengő note was issued."}, {"year": 2008, "short": "Zimbabwe", "title": "Zimbabwe’s hyperinflation", "region": "africa", "line": "Zimbabwe’s central bank printed money until monthly inflation hit about 80 billion percent and a 100 trillion dollar note appeared."}]}, {"id": "crash", "theme": "A speculative boom ends in a global crash", "rhyme": 3, "then": {"year": 1929, "short": "Wall St Crash", "title": "The Wall Street Crash", "where": "New York, USA", "region": "us", "hook": "Black Tuesday: the day Wall Street's Roaring Twenties boom collapsed into panic.", "text": "On Black Thursday, 24 October 1929, panic selling hit Wall Street. Over the next Monday and Tuesday the Dow fell about 23%, as a record 16 million shares changed hands on 29 October. By July 1932, the Dow had lost 89% of its 1929 peak."}, "now": {"year": 2008, "short": "Lehman Crash", "title": "The Global Financial Crisis", "where": "New York, USA", "region": "us", "hook": "September 2008: Lehman Brothers staff leaving their offices carrying cardboard boxes.", "text": "On 15 September 2008, Lehman Brothers filed for bankruptcy with $639 billion in assets, the largest in US history. Credit froze worldwide. Congress passed a $700 billion bank rescue, and governments from Britain to China spent heavily to stop a collapse."}, "followed": "The Great Depression followed. Thousands of banks failed, US unemployment reached about 25% in 1933, and economic misery helped extremist movements rise in Europe.", "next": {"short": "The Next Bust", "title": "A crash in machine-run markets", "text": "Around 2087, a crash might begin in assets that barely exist today, traded by AI systems in milliseconds. Panic could cross the globe before any human trader or central banker has time to react.", "watch": "Soaring debt, a new asset everyone says is different this time, and risk piling up in lightly regulated corners of finance."}, "breaks": "Governments in 2008 rescued banks and pumped in money within weeks, so the Great Recession, with US unemployment peaking at 10%, stayed far milder than the Depression.", "older": "The South Sea Bubble, 1720", "echoes": [{"year": 1720, "short": "South Sea Bubble", "title": "The South Sea Bubble", "region": "world", "line": ""}, {"year": 1873, "short": "Panic of 1873", "title": "The Panic of 1873", "region": "world", "line": "A railway and property boom burst on the Vienna stock exchange, spread to New York, and opened a long worldwide slump."}, {"year": 1987, "short": "Black Monday", "title": "Black Monday", "region": "us", "line": "After a five-year bull market, the Dow fell 22.6% on 19 October 1987, its worst day ever, as markets crashed worldwide."}, {"year": 2000, "short": "Dot-com Bust", "title": "The dot-com bubble bursts", "region": "us", "line": "Investors poured money into internet startups until the Nasdaq peaked in March 2000, then it lost about 78% over two years."}]}, {"id": "tariffs", "theme": "Tariff walls rise and trading partners hit back", "rhyme": 2, "then": {"year": 1930, "short": "Smoot–Hawley", "title": "The Smoot–Hawley Tariff", "where": "Washington, DC, USA", "region": "us", "hook": "The tariff law often blamed for deepening the Great Depression.", "text": "President Herbert Hoover signed the Smoot–Hawley Tariff Act on 17 June 1930, raising duties on over 20,000 imported goods. More than 1,000 economists had urged him to veto it. Canada, France, Italy, Spain and others answered with tariffs of their own."}, "now": {"year": 2025, "short": "Liberation Day", "title": "Trump's “Liberation Day” Tariffs", "where": "Washington, DC, USA", "region": "us", "hook": "2 April 2025: Trump's Rose Garden chart of tariff rates, then plunging stock markets.", "text": "On 2 April 2025, President Donald Trump announced a 10% tariff on most imports and higher rates on dozens of countries. Supporters said it would revive American industry and counter unfair trade, while critics warned of higher prices. China retaliated, and US tariffs on Chinese goods briefly reached 145%."}, "followed": "As the Depression deepened, world trade shrank by about two-thirds between 1929 and 1934. In 1934 Congress let the president negotiate tariff cuts, paving the way for the GATT trade system in 1947.", "next": {"short": "Trade Blocs", "title": "A world split into trade blocs", "text": "Around 2120, a leading power might wall off its markets over AI, data or carbon, and rivals could answer in kind. The world might split into blocs that trade freely inside and little across.", "watch": "Rising tariffs and carbon border taxes, hardening trade blocs, and leaders promising that self-sufficiency will bring back jobs."}, "breaks": "Smoot–Hawley was a law passed by Congress as a depression began; the 2025 tariffs came by presidential emergency order, which the Supreme Court ruled unlawful in February 2026.", "older": "The Tariff of Abominations, 1828", "echoes": [{"year": 1667, "short": "Colbert Tariff", "title": "Colbert's tariff war on the Dutch", "region": "europe", "line": "France's minister Colbert put steep duties on Dutch goods, the Dutch banned French wares, and the trade war fed France's 1672 invasion."}, {"year": 1828, "short": "Tariff of Abomi…", "title": "The Tariff of Abominations", "region": "world", "line": ""}, {"year": 1963, "short": "Chicken War", "title": "The Chicken War", "region": "europe", "line": "When Europe's Common Market taxed cheap American chicken, the US hit back with a 25% tariff on light trucks that still stands."}, {"year": 2018, "short": "Trade War 2018", "title": "The US–China trade war", "region": "china", "line": "The US taxed steel, aluminum and hundreds of billions in Chinese imports, and China hit back with tariffs on American farm goods."}]}, {"id": "bankrun", "theme": "Panicked depositors rush to pull their money", "rhyme": 2, "then": {"year": 1933, "short": "Bank Holiday", "title": "Roosevelt's Bank Holiday", "where": "United States", "region": "us", "hook": "Lines of desperate savers outside locked banks, and Roosevelt's calming Fireside Chat.", "text": "About 9,000 US banks failed between 1930 and 1933, and a new wave of runs swept the country that winter. On 6 March 1933, two days after taking office, Franklin D. Roosevelt closed every bank. In his first Fireside Chat he told Americans a reopened bank was safer than a mattress."}, "now": {"year": 2023, "short": "SVB Collapse", "title": "Silicon Valley Bank Collapses", "where": "Santa Clara, California, USA", "region": "us", "hook": "March 2023: founders racing to pull money as Silicon Valley Bank collapsed in two days.", "text": "On 9 March 2023, customers withdrew $42 billion from Silicon Valley Bank in a single day, as warnings spread through group chats and social media. Regulators closed the bank the next morning. Two days later, officials guaranteed all its deposits to stop the panic spreading."}, "followed": "In June 1933 Congress created federal deposit insurance through the new FDIC, which began covering deposits in January 1934. Mass bank runs then largely vanished from American life for generations.", "next": {"short": "Instant Run", "title": "A bank run at machine speed", "text": "Around 2113, a run might happen in minutes, as AI assistants managing millions of accounts react to the same rumor at once. Regulators could need automated brakes just to keep up.", "watch": "Money flowing into new kinds of digital accounts and currencies, and automated systems allowed to move savings without a human in the loop."}, "breaks": "In 1933 thousands of banks failed and ordinary savers lost money; in 2023 a few banks failed, mostly holding uninsured business deposits, and depositors were made whole.", "older": "The Panic of 1907", "echoes": [{"year": 1866, "short": "Overend Gurney", "title": "The Overend, Gurney collapse", "region": "europe", "line": "London's biggest discount bank failed, crowds besieged banks on “Black Friday”, and the Bank of England lent freely to stop the panic."}, {"year": 2001, "short": "Corralito", "title": "Argentina freezes bank accounts", "region": "latam", "line": "As savers drained Argentina's banks, the government capped cash withdrawals in December 2001, sparking riots and a debt default."}, {"year": 2007, "short": "Northern Rock", "title": "The run on Northern Rock", "region": "europe", "line": "Savers queued outside Northern Rock branches after it sought emergency Bank of England help, Britain's first bank run in over a century."}]}, {"id": "dust", "theme": "The sky goes dark over a strained land", "rhyme": 2, "then": {"year": 1935, "short": "Black Sunday", "title": "The Black Sunday Dust Storm", "where": "Great Plains, USA", "region": "us", "hook": "The Dust Bowl's darkest day, when a black wall of dust swallowed the Plains.", "text": "On 14 April 1935, a towering wall of dust rolled across the southern Great Plains and turned a sunny afternoon pitch black. The storm carried an estimated 300,000 tons of topsoil. A reporter's story about it gave the region its name: the Dust Bowl."}, "now": {"year": 2023, "short": "Orange Sky", "title": "New York's Orange Sky", "where": "New York, USA", "region": "us", "hook": "June 2023: New York under an eerie orange sky, and masks back on outdoors.", "text": "Smoke from wildfires in Quebec drifted south, and on 7 June 2023 New York's sky turned orange. The city's air quality index passed 400, in the highest ‘hazardous’ category. Canada's season burned about 18 million hectares, by far its worst on record."}, "followed": "Within two weeks, Congress created the Soil Conservation Service to fight erosion. Drought and storms lasted until about 1940, and hundreds of thousands of people left the Plains, many heading to California.", "next": {"short": "Dark Skies", "title": "Smoke and dust darken whole continents", "text": "Around 2111, a long megadrought or fire season might cloud the sky over half a continent for weeks. Cities could open clean-air shelters as routinely as they open cooling centers today.", "watch": "Longer fire seasons, shrinking groundwater under farm regions, and more days each year when officials tell people to stay indoors."}, "breaks": "The Dust Bowl grew from local plowing that stripped the soil, while New York's smoke blew in from distant Canadian forests burning in heat and drought.", "older": "New England's Dark Day, 1780", "echoes": [{"year": 1780, "short": "New England's D…", "title": "New England's Dark Day", "region": "world", "line": ""}, {"year": 1783, "short": "Laki Haze", "title": "The Laki haze over Europe", "region": "europe", "line": "Iceland's Laki eruption spread a sulfurous haze across Europe, and about a fifth of Icelanders died in the famine that followed."}, {"year": 1952, "short": "Great Smog", "title": "London's Great Smog", "region": "europe", "line": "Coal smoke and fog blacked out London for five days, killing thousands and pushing Parliament to pass the 1956 Clean Air Act."}, {"year": 2020, "short": "SF Orange Sky", "title": "San Francisco's orange sky", "region": "us", "line": "Smoke from record wildfires amid heat and drought turned San Francisco's sky dark orange, with streetlights on at midday."}]}, {"id": "munich", "theme": "Land seized in the name of ethnic kin", "rhyme": 1, "then": {"year": 1938, "short": "Munich Deal", "title": "The Munich Agreement", "where": "Munich, Germany", "region": "europe", "hook": "Neville Chamberlain waving a piece of paper and promising “peace for our time”.", "text": "On 30 September 1938, Britain, France and Italy agreed to let Nazi Germany annex Czechoslovakia's Sudetenland, home to three million ethnic Germans Hitler claimed to be protecting. The Czechoslovaks were not at the table, and Neville Chamberlain flew home promising peace."}, "now": {"year": 2014, "short": "Crimea Annexed", "title": "Russia Annexes Crimea", "where": "Crimea, Ukraine", "region": "europe", "hook": "March 2014: masked soldiers without insignia taking over Crimea, then Russia claiming it.", "text": "In late February 2014, Russian troops without insignia seized Crimea from Ukraine. After a 16 March referendum that Ukraine and Western governments rejected as illegal, Russia annexed the peninsula on 18 March, saying it was protecting Russian speakers. On 24 February 2022, Russia launched a full-scale invasion of Ukraine."}, "followed": "In March 1939 Hitler seized the rest of the Czech lands. He invaded Poland on 1 September 1939, and Britain and France declared war two days later.", "next": {"short": "Border Redrawn", "title": "A border redrawn for ethnic kin", "text": "Around 2090, a power might claim a neighbor's land to protect people who share its language or faith. Others could answer with deals, sanctions or force, and the old Munich debate might return.", "watch": "Passports handed to people across a border, claims that kin abroad are under threat, and troops massing near a frontier."}, "breaks": "Many scholars dispute the Munich analogy: no Western leader signed away Crimea, and the comparison has been invoked to argue for wars from Suez to Iraq.", "echoes": [{"year": 1919, "short": "Fiume Seized", "title": "D'Annunzio seizes Fiume", "region": "europe", "line": "Poet Gabriele D'Annunzio led armed volunteers into the Adriatic port, claiming it for its Italian majority; Italy annexed it in 1924."}, {"year": 1974, "short": "Cyprus Split", "title": "Turkish troops land in Cyprus", "region": "europe", "line": "After a Greek-backed coup, Turkey sent troops, saying it was protecting Turkish Cypriots, and took about a third of the island."}, {"year": 2008, "short": "Georgia War", "title": "The Russia–Georgia war", "region": "europe", "line": "Russia fought Georgia over South Ossetia, saying it was defending residents holding Russian passports, then recognized two breakaway regions as independent."}]}, {"id": "martians", "theme": "A fake that fools the public", "rhyme": 2, "then": {"year": 1938, "short": "War of Worlds", "title": "The War of the Worlds Broadcast", "where": "United States", "region": "us", "hook": "Orson Welles' radio play about invading Martians that supposedly sent America into a panic.", "text": "On 30 October 1938, Orson Welles staged H.G. Wells' novel on CBS radio as a string of fake news bulletins about Martians landing in New Jersey. Newspapers reported mass panic the next morning. Later research found few listeners actually panicked and the papers greatly exaggerated the scare."}, "now": {"year": 2023, "short": "Puffer Pope", "title": "Viral AI Deepfakes", "where": "Online, worldwide", "region": "world", "hook": "March 2023: the Pope in a stylish white puffer jacket, later revealed as AI-made.", "text": "In March 2023, an image of Pope Francis in a white puffer jacket, made with the AI tool Midjourney, fooled many people online. On 22 May, a fake picture of an explosion near the Pentagon spread from verified Twitter accounts, and US stocks briefly dipped before officials debunked it."}, "followed": "Welles apologized the next morning, and the FCC took no action against CBS. The fame helped him win a Hollywood contract with rare creative control, which led to Citizen Kane in 1941.", "next": {"short": "Live Deepfake", "title": "A fully faked live news event", "text": "Around 2108, a fake might be an entire live event, with video, voices and eyewitness posts all generated at once. It could move markets or spark unrest before anyone can check what really happened.", "watch": "Fakes that fool experts, markets reacting to unverified images, and fights over watermarks and who certifies what is real."}, "breaks": "Welles' drama was announced as fiction on a single network, while today's AI fakes often carry no label and can spread worldwide within minutes.", "older": "The Great Moon Hoax, 1835", "echoes": [{"year": 1726, "short": "Rabbit Births", "title": "Mary Toft's rabbit births", "region": "europe", "line": "An English servant claimed to give birth to rabbits, and even a royal surgeon believed her until she confessed to the hoax."}, {"year": 1835, "short": "Great Moon Hoax", "title": "The Great Moon Hoax", "region": "world", "line": ""}, {"year": 1917, "short": "Fairy Photos", "title": "The Cottingley Fairies", "region": "europe", "line": "Two English girls photographed paper cutout fairies, and Sherlock Holmes author Arthur Conan Doyle championed the pictures as real."}, {"year": 1957, "short": "Spaghetti Trees", "title": "The BBC's spaghetti harvest", "region": "europe", "line": "A straight-faced BBC report showed Swiss farmers picking spaghetti from trees on April Fools' Day, and viewers asked how to grow it."}, {"year": 1983, "short": "Hitler Diaries", "title": "The Hitler Diaries", "region": "europe", "line": "German magazine Stern paid millions for diaries said to be Hitler's, and within two weeks experts exposed them as modern forgeries."}]}, {"id": "einstein", "theme": "Scientists warn about their own creation", "rhyme": 2, "then": {"year": 1939, "short": "Atomic Warning", "title": "The Einstein–Szilárd Letter", "where": "United States", "region": "us", "hook": "The letter in which Einstein warned President Roosevelt that atomic bombs were possible.", "text": "In a letter dated 2 August 1939, Albert Einstein warned President Franklin Roosevelt that uranium could power “extremely powerful bombs of a new type”, and hinted that Nazi Germany might be working on them. Physicist Leo Szilárd drafted it, and economist Alexander Sachs handed it to Roosevelt in October."}, "now": {"year": 2023, "short": "AI Warning", "title": "AI Leaders Warn of Extinction", "where": "Worldwide", "region": "world", "hook": "May 2023: headlines saying AI's own creators warned it could wipe out humanity.", "text": "On 30 May 2023, hundreds of AI scientists and executives, including Geoffrey Hinton, Sam Altman and Demis Hassabis, signed a one-sentence statement ranking AI extinction risk alongside pandemics and nuclear war. In November, 28 countries, including the US and China, signed the Bletchley Declaration at Britain's AI Safety Summit."}, "followed": "Roosevelt formed a uranium committee, the Manhattan Project began in 1942, and US atomic bombs destroyed Hiroshima and Nagasaki in 1945. Einstein later called signing the letter his “one great mistake”.", "next": {"short": "Next Warning", "title": "Inventors warn about a new creation", "text": "Around 2107, a warning might come from pioneers of a field barely born today, perhaps synthetic life or brain-computer links, urging leaders to act before their discovery outruns any control.", "watch": "Top researchers quitting to speak out, open letters from inventors about their own work, and summits devoted to a single technology."}, "breaks": "Einstein urged Roosevelt to speed up atomic research before Hitler got there first, while the AI signers urged caution about a technology many were still building.", "echoes": [{"year": 1947, "short": "Doomsday Clock", "title": "Atomic scientists start the Doomsday Clock", "region": "us", "line": "Manhattan Project scientists launched the Doomsday Clock, set at seven minutes to midnight, to warn the world about nuclear war."}, {"year": 1975, "short": "Asilomar", "title": "The Asilomar gene-splicing conference", "region": "us", "line": "Biologists who had just invented gene splicing paused their own experiments and met at Asilomar, California, to draft safety rules."}, {"year": 2015, "short": "CRISPR Pause", "title": "Gene editors call for a pause", "region": "us", "line": "CRISPR pioneer Jennifer Doudna urged a pause on editing human embryos, and a Washington summit called heritable edits irresponsible for now."}]}, {"id": "transistor", "theme": "A small lab invention that remakes the world", "rhyme": 2, "then": {"year": 1947, "short": "Transistor", "title": "The Transistor Is Born", "where": "Murray Hill, New Jersey, USA", "region": "us", "hook": "The tiny switch inside every computer, phone and gadget you have ever used.", "text": "In December 1947 at Bell Labs in New Jersey, John Bardeen and Walter Brattain built the first working transistor, a small device that could amplify and switch electric signals. Transistors would soon replace bulky vacuum tubes. With William Shockley, the pair won the 1956 Nobel Prize in Physics."}, "now": {"year": 2017, "short": "Transformer", "title": "The Transformer Paper", "where": "Mountain View, California, USA", "region": "us", "hook": "Late 2022: millions type their first question into ChatGPT, built on a 2017 Google idea.", "text": "In June 2017, eight Google researchers posted a paper called “Attention Is All You Need”, introducing a neural network design named the Transformer. It let AI learn from huge amounts of text far more efficiently. The “T” in ChatGPT stands for Transformer."}, "followed": "Transistors went into hearing aids and pocket radios in the 1950s, then onto integrated circuits. Intel's 4004 put a whole processor on one chip in 1971, and today's largest chips hold over 100 billion transistors.", "next": {"short": "The Next Leap", "title": "A quiet lab result remakes everything", "text": "Around 2087, the next leap might start as an obscure lab result, perhaps in quantum, optical or biological computing. Within a lifetime it could reshape work, war and daily life as the transistor did.", "watch": "Obscure papers that suddenly get copied by every lab, new materials for computing, and machines that keep getting cheaper at a startling pace."}, "breaks": "The transistor was hardware that took decades to reshape daily life, while the Transformer is software that reached hundreds of millions of people within a few years.", "older": "Gutenberg's printing press, about 1440", "echoes": [{"year": 1831, "short": "Faraday Dynamo", "title": "Faraday turns magnetism into electricity", "region": "europe", "line": "Michael Faraday showed in his London lab that moving magnets make electric current, the principle behind every power station generator."}, {"year": 1909, "short": "Haber Ammonia", "title": "Haber pulls fertilizer from the air", "region": "europe", "line": "Fritz Haber made ammonia from air on a tabletop machine; scaled up as Haber-Bosch, its fertilizer now helps feed billions."}, {"year": 1928, "short": "Penicillin", "title": "Fleming discovers penicillin", "region": "europe", "line": "Alexander Fleming noticed mold killing bacteria in a London lab dish, and mass-produced penicillin later launched the antibiotic age."}, {"year": 1989, "short": "World Wide Web", "title": "Berners-Lee invents the Web", "region": "europe", "line": "At CERN, Tim Berners-Lee proposed a system of linked documents, and the World Wide Web he built now connects billions."}]}, {"id": "mccarthy", "theme": "Careers ended over opinions and associations", "rhyme": 1, "then": {"year": 1950, "short": "McCarthyism", "title": "McCarthyism and the Blacklists", "where": "United States", "region": "us", "hook": "Senator McCarthy's lists, loyalty oaths, and Hollywood writers who suddenly could not find work.", "text": "In February 1950, Senator Joseph McCarthy claimed to hold a list of Communists working in the State Department. Federal workers faced loyalty reviews, the Hollywood Ten went to prison for contempt of Congress, and a pamphlet called Red Channels named 151 broadcasters and entertainers, many of whom lost work."}, "now": {"year": 2020, "short": "Online Pile-on", "title": "Online Pile-ons and Firings", "where": "Social media, USA", "region": "us", "hook": "2020: an old tweet resurfaces, the internet piles on, and someone loses their job.", "text": "Around 2020, online pile-ons got people fired over posts, jokes and old tweets, with pressure coming from left and right. Critics called it cancel culture, while supporters called it accountability. In January 2021, after the Capitol riot, major platforms suspended President Donald Trump."}, "followed": "After televised hearings in 1954, the Senate censured McCarthy, and his influence collapsed. Blacklists faded slowly: screenwriter Dalton Trumbo regained screen credit only in 1960, for Spartacus and Exodus.", "next": {"short": "Speech Scores", "title": "Speech judged by automated systems", "text": "Around 2090, automated systems might scan everything a person has ever said online, so one old remark could cost a job, a loan or a visa before any human reviews it.", "watch": "Employers and governments screening people's online histories, speech rules enforced by algorithms, and rising numbers of people afraid to voice opinions."}, "breaks": "McCarthyism targeted one suspected ideology using government power, while 2020-era pressure came from many directions, mostly through crowds, employers and private platforms.", "older": "The Spanish Inquisition, 1478", "echoes": [{"year": 1478, "short": "Spanish Inquisi…", "title": "The Spanish Inquisition", "region": "world", "line": ""}, {"year": 1633, "short": "Galileo Trial", "title": "The trial of Galileo", "region": "europe", "line": "The Inquisition convicted Galileo for teaching that Earth circles the Sun, banned his book and kept him under house arrest for life."}, {"year": 1919, "short": "Palmer Raids", "title": "The first Red Scare raids", "region": "us", "line": "In the first Red Scare, federal raids rounded up thousands of suspected radicals for their politics and deported hundreds, including Emma Goldman."}, {"year": 2003, "short": "Dixie Chicks", "title": "The Dixie Chicks boycott", "region": "us", "line": "After singer Natalie Maines criticized President George W. Bush before the Iraq War, country radio stations across America stopped playing the band."}]}, {"id": "suez", "theme": "A blocked sea route sends ships around Africa", "rhyme": 2, "then": {"year": 1956, "short": "Suez Crisis", "title": "The Suez Crisis", "where": "Suez Canal, Egypt", "region": "mideast", "hook": "The 1956 fight over the Suez Canal that humbled Britain and France.", "text": "After Egypt's President Gamal Abdel Nasser nationalized the Suez Canal Company in July 1956, Israel, Britain and France attacked in late October. Egypt sank dozens of ships to block the canal, which stayed closed until April 1957. Oil tankers had to sail around Africa's Cape of Good Hope."}, "now": {"year": 2024, "short": "Red Sea Crisis", "title": "Houthi Attacks in the Red Sea", "where": "Red Sea, off Yemen", "region": "mideast", "hook": "Early 2024: container ships turning away from the Red Sea to sail around Africa.", "text": "From November 2023, Yemen's Houthi movement attacked ships in the Red Sea with missiles and drones, saying it acted in support of Palestinians in Gaza. Through 2024, most large container lines avoided the Suez route, sailing around the Cape of Good Hope and adding one to two weeks."}, "followed": "Under heavy pressure from the US and the Soviet Union, the invaders withdrew. The UN deployed its first peacekeeping force, and British Prime Minister Anthony Eden resigned in January 1957.", "next": {"short": "Choke Point", "title": "Another chokepoint closes to shipping", "text": "Around 2092, a narrow sea lane such as the Strait of Malacca or a new Arctic route might be shut by war or swarms of drones. Ships could detour for weeks, pushing up prices worldwide.", "watch": "Cheap missiles and drones in the hands of small armed groups, insurers pulling out of key waterways, and navies escorting merchant ships."}, "breaks": "In 1956 states fought over who controlled the canal, while in 2024 a Yemeni armed movement attacked ships far to the south, and the canal itself stayed open.", "echoes": [{"year": 1967, "short": "Canal Shut", "title": "The Suez Canal closes for eight years", "region": "mideast", "line": "The Six-Day War closed the Suez Canal until 1975, trapping a fleet of cargo ships and sending tankers around Africa."}, {"year": 2021, "short": "Ever Given", "title": "The Ever Given blocks Suez", "region": "mideast", "line": "The giant container ship Ever Given wedged across the Suez Canal for six days, and some ships detoured around Africa instead."}]}, {"id": "sputnik", "theme": "A rival's breakthrough jolts America into a race", "rhyme": 2, "then": {"year": 1957, "short": "Sputnik", "title": "Sputnik Shocks America", "where": "Baikonur, Soviet Union", "region": "russia", "hook": "The beeping Soviet satellite that convinced Americans they were losing the space race.", "text": "On 4 October 1957, the Soviet Union launched Sputnik 1, the first artificial satellite, an 84-kilogram metal ball that circled Earth every 96 minutes. Radio stations and amateurs around the world picked up its beeps. Many Americans feared their country had fallen behind in science and missiles."}, "now": {"year": 2025, "short": "DeepSeek", "title": "DeepSeek's “Sputnik Moment”", "where": "Hangzhou, China", "region": "china", "hook": "January 2025: a Chinese AI app called DeepSeek topping charts and rattling Wall Street.", "text": "On 20 January 2025, Chinese startup DeepSeek released R1, a free AI model that rivaled leading American systems and, the company said, cost far less to train. Investor Marc Andreessen called it “AI's Sputnik moment”. On 27 January, Nvidia lost about $590 billion in market value, a one-day record."}, "followed": "The US founded NASA in 1958 and poured money into science teaching through the National Defense Education Act. The space race peaked with Americans walking on the Moon in July 1969.", "next": {"short": "Next Sputnik", "title": "A rival's leap sparks a race", "text": "Around 2093, a rival might suddenly leap ahead in a technology seen as decisive, perhaps fusion power or quantum computing. The shock could set off a new national race in labs, schools and budgets.", "watch": "Surprise breakthroughs from unexpected labs, sharp drops in tech stocks, and governments launching crash programs in science and education."}, "breaks": "Sputnik was a state project that beat America to a world first, while DeepSeek, a private startup, caught up with existing US models at lower reported cost.", "echoes": [{"year": 1949, "short": "Soviet A-Bomb", "title": "The Soviets test an atomic bomb", "region": "russia", "line": "The Soviet Union tested its first atomic bomb years before US experts expected, and Truman ordered a crash hydrogen bomb program."}, {"year": 1987, "short": "Japan's Chips", "title": "Japan's chip lead alarms America", "region": "world", "line": "Japanese firms had overtaken America in memory chips, so Washington backed the new SEMATECH consortium with federal money to catch up."}]}, {"id": "springs", "theme": "One voice wakes an environmental movement", "rhyme": 2, "then": {"year": 1962, "short": "Silent Spring", "title": "Rachel Carson’s Silent Spring", "where": "United States", "region": "us", "hook": "The book that warned pesticides like DDT were silencing birds and poisoning the food chain.", "text": "Biologist Rachel Carson published Silent Spring in September 1962, documenting how DDT and other pesticides harmed wildlife and could threaten people. The chemical industry attacked her, but the book became a bestseller and President Kennedy ordered a scientific review of pesticides."}, "now": {"year": 2018, "short": "School Strike", "title": "Greta Thunberg’s School Strike", "where": "Stockholm, Sweden", "region": "europe", "hook": "The Friday climate strikes: a lone Swedish teenager’s sign, then millions of students marching.", "text": "In August 2018, 15-year-old Greta Thunberg began skipping school to sit outside Sweden’s parliament with a sign reading “School strike for climate”. Students worldwide copied her as Fridays for Future. On 20 September 2019, organizers counted about 4 million strikers."}, "followed": "Public pressure grew fast. About 20 million Americans joined the first Earth Day in 1970, the Environmental Protection Agency opened that year, and the US banned DDT for farm use in 1972.", "next": {"short": "A New Wake-Up", "title": "A new voice for a new threat", "text": "Around 2074, a single voice might again rally millions, perhaps over microplastics in human bodies, failing oceans or a geoengineering project, spreading through media we cannot yet picture.", "watch": "Rising alarm over microplastics, ocean acidification or solar geoengineering, and young activists organizing across borders around one simple act."}, "breaks": "DDT could be banned by national laws within a decade, while cutting greenhouse gases requires every major economy to change how it makes energy.", "echoes": [{"year": 1892, "short": "John Muir", "title": "John Muir founds the Sierra Club", "region": "us", "line": "Naturalist John Muir’s writings rallied Americans to save wild places; he co-founded the Sierra Club and inspired the national parks movement."}, {"year": 1977, "short": "Green Belt", "title": "Wangari Maathai’s Green Belt Movement", "region": "africa", "line": "Kenyan scientist Wangari Maathai got rural women planting trees, growing a movement that planted tens of millions and earned her a Nobel."}, {"year": 2006, "short": "Al Gore’s Film", "title": "Al Gore’s An Inconvenient Truth", "region": "us", "line": "Al Gore’s climate slideshow became a hit film that alarmed millions about global warming; he shared the 2007 Nobel Peace Prize."}]}, {"id": "protests", "theme": "Protests ripple across the globe at once", "rhyme": 2, "then": {"year": 1968, "short": "1968 Protests", "title": "The global protest wave of 1968", "where": "Worldwide", "region": "world", "hook": "Barricades in Paris, Soviet tanks in Prague: the year the whole world seemed to boil over.", "text": "In May 1968, French students built barricades and about 10 million workers went on strike. Americans protested the Vietnam War, and riots followed Martin Luther King’s assassination. Soviet-led troops crushed the Prague Spring, and Mexican troops fired on students at Tlatelolco."}, "now": {"year": 2020, "short": "George Floyd", "title": "The George Floyd protests", "where": "Minneapolis, then worldwide", "region": "us", "hook": "June 2020: masked crowds kneeling in the streets in the middle of a pandemic.", "text": "A Minneapolis police officer killed George Floyd on 25 May 2020, kneeling on his neck for over nine minutes. Video of his death sparked protests in all 50 states and dozens of countries. Polls suggested 15 to 26 million Americans took part."}, "followed": "Elections swung toward order. Richard Nixon won the US presidency promising “law and order”, de Gaulle’s party won a landslide in June, and Prague’s reforms were rolled back under Soviet pressure.", "next": {"short": "Next Wave", "title": "Global protests sparked within hours", "text": "Around 2072, one video or one killing might again set off protests in dozens of countries within days, organized on networks that do not yet exist.", "watch": "Large generations of young people with blocked prospects, a shared grievance that crosses borders, and new ways to spread images instantly."}, "breaks": "The 1968 revolts had many separate causes, from Vietnam to Soviet rule, while the 2020 protests shared one focus: policing and racial injustice.", "older": "The Revolutions of 1848", "echoes": [{"year": 1848, "short": "1848 Revolutions", "title": "The Revolutions of 1848", "region": "europe", "line": "Revolutions spread from Paris to Vienna, Berlin, Milan and Budapest within weeks, as crowds demanded constitutions, voting rights and national freedom."}, {"year": 1989, "short": "1989 Revolutions", "title": "The revolutions of 1989 in Eastern Europe", "region": "europe", "line": "Protests and strikes swept Eastern Europe, toppling communist governments from Poland to Romania within months and bringing down the Berlin Wall."}, {"year": 2003, "short": "Iraq War Protest", "title": "The global Iraq war protests", "region": "world", "line": "On one day, millions marched against the coming Iraq war in about 600 cities, from Rome and London to Sydney."}, {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring and Occupy protests", "region": "world", "line": "Uprisings spread from Tunisia across the Arab world, and Occupy protest camps soon appeared in hundreds of cities worldwide."}]}, {"id": "oil", "theme": "Energy supply turned into a weapon", "rhyme": 3, "then": {"year": 1973, "short": "Oil Crisis", "title": "The 1973 oil crisis", "where": "Middle East and the West", "region": "world", "hook": "Empty highways on car-free Sundays and long lines at gas stations.", "text": "In October 1973, during the Yom Kippur War, Arab oil producers cut output and embargoed the United States and the Netherlands for supporting Israel. Oil prices roughly quadrupled within months. Several European countries banned Sunday driving."}, "now": {"year": 2022, "short": "Gas Crisis", "title": "Europe’s 2022 energy crisis", "where": "Europe", "region": "europe", "hook": "Autumn 2022: thermostats turned down, shop windows dimmed, and dread opening the energy bill.", "text": "After invading Ukraine, Russia cut pipeline gas to Europe and halted Nord Stream 1 in September 2022. Wholesale gas prices rose to more than ten times pre-crisis levels. Governments capped bills, and EU countries agreed to cut gas use by 15%."}, "followed": "Years of stagflation followed. Rich nations founded the International Energy Agency in 1974, built emergency oil stocks, and turned to smaller cars, nuclear power and new oil from the North Sea and Alaska.", "next": {"short": "Metal Squeeze", "title": "A squeeze on battery metals", "text": "Around 2071, the choke point might be lithium, cobalt or rare earths for batteries and motors, with a dominant supplier cutting exports to win a political fight.", "watch": "Export controls on critical minerals, refining concentrated in one or two countries, and power grids leaning on a single foreign source."}, "breaks": "In 2022 Europe also chose to cut its own Russian imports, and it replaced much of the lost gas with shipped liquefied gas within about a year.", "older": "The Suez Crisis, 1956", "echoes": [{"year": 1941, "short": "Japan Embargo", "title": "The US oil embargo on Japan", "region": "china", "line": "The US halted oil exports to Japan, which imported most of its oil from America, pushing Tokyo toward war."}, {"year": 1956, "short": "Suez Crisis", "title": "The Suez Crisis", "region": "mideast", "line": "During the Suez war, Egypt blocked the canal and Saudi Arabia embargoed Britain and France, bringing petrol rationing to Britain."}, {"year": 2009, "short": "Gas Cutoff 2009", "title": "The 2009 Russia-Ukraine gas cutoff", "region": "europe", "line": "Russia cut gas to Ukraine in a price dispute, and transit stopped for two weeks, leaving parts of Europe cold in midwinter."}]}, {"id": "saigon", "theme": "A superpower’s chaotic final exit", "rhyme": 3, "then": {"year": 1975, "short": "Fall of Saigon", "title": "The Fall of Saigon", "where": "Saigon, South Vietnam", "region": "china", "hook": "Helicopters lifting people off a Saigon rooftop as the Vietnam War ended.", "text": "On 30 April 1975, North Vietnamese tanks broke through the gates of the presidential palace and South Vietnam surrendered. In the final hours, US helicopters flew about 7,000 Americans and Vietnamese out of the city in Operation Frequent Wind."}, "now": {"year": 2021, "short": "Fall of Kabul", "title": "The Fall of Kabul", "where": "Kabul, Afghanistan", "region": "india", "hook": "August 2021: crowds running alongside a US military plane on Kabul airport’s runway.", "text": "The Taliban entered Kabul on 15 August 2021 as US troops were withdrawing, and President Ashraf Ghani fled. A chaotic airlift flew out more than 120,000 people. A suicide bombing at an airport gate killed about 170 Afghans and 13 US troops."}, "followed": "Vietnam was formally reunified under communist rule in 1976. Cambodia and Laos also fell to communist forces in 1975, and hundreds of thousands of “boat people” fled Vietnam by sea.", "next": {"short": "Last Flights", "title": "Another great power’s rushed last flight", "text": "Around 2067, a major power might again fly its last people out of a capital after a long intervention, with the scramble broadcast live from drones and phones.", "watch": "Long foreign deployments losing support at home, fixed withdrawal deadlines, and local armies that depend on outside air power and contractors."}, "breaks": "US combat troops had left Vietnam two years before Saigon fell to a conventional army, while Kabul fell to an insurgency before the US withdrawal was finished.", "older": "The British retreat from Kabul, 1842", "echoes": [{"year": 1842, "short": "Kabul 1842", "title": "The British retreat from Kabul", "region": "india", "line": "About 4,500 British and Indian troops and 12,000 civilians left Kabul in winter under a truce; almost all were killed or captured."}, {"year": 1947, "short": "Partition", "title": "Britain’s rushed exit from India", "region": "india", "line": "Britain moved India’s independence up by ten months; partition into India and Pakistan uprooted over 10 million people amid mass killings."}, {"year": 1962, "short": "Algeria 1962", "title": "France’s exit from Algeria", "region": "africa", "line": "After an eight-year war, France left Algeria; some 800,000 settlers fled within months, and many Algerians who served France were killed."}]}, {"id": "volcker", "theme": "Crushing inflation with sharply higher rates", "rhyme": 3, "then": {"year": 1980, "short": "Volcker Shock", "title": "The Volcker shock", "where": "United States", "region": "us", "hook": "Interest rates near 20% and a Fed chair set on breaking inflation, whatever the cost.", "text": "Fed chair Paul Volcker pushed short-term interest rates to about 20% in 1980 to break inflation that peaked near 15%. Angry home builders mailed him pieces of lumber. Two recessions followed, and unemployment hit 10.8% in 1982."}, "now": {"year": 2022, "short": "Rate Hikes", "title": "The great rate hikes of 2022", "where": "Worldwide", "region": "world", "hook": "2022: grocery prices jumping every week and mortgage rates doubling within a year.", "text": "With US inflation at 9.1% in June 2022, the Federal Reserve raised rates from near zero to over 4% by December, including four three-quarter-point hikes in a row. The European Central Bank and Bank of England also raised rates quickly."}, "followed": "US inflation fell to about 3% by 1983 and stayed lower for decades. Mexico said in 1982 it could not pay its debts, starting a Latin American debt crisis.", "next": {"short": "Next Squeeze", "title": "Another painful fight against inflation", "text": "Around 2064, a central bank might again choose between tolerating inflation driven by debt, aging or climate costs and causing a recession to stop it.", "watch": "Government debt growing faster than economies, political pressure on central banks to keep rates low, and inflation stuck above target for years."}, "breaks": "Volcker’s rates neared 20% and came with deep recessions, while the 2022 hikes topped out near 5.5% and inflation eased without a 1980s-style slump.", "older": "The Fed’s post-war rate hikes, 1920", "echoes": [{"year": 1920, "short": "Fed Hikes 1920", "title": "The Fed’s post-war rate hikes", "region": "us", "line": "To stop post-World War I inflation, the Fed raised its discount rate to 7%; prices fell sharply and a severe recession followed."}, {"year": 2023, "short": "Turkey 2023", "title": "Turkey’s steep rate hikes", "region": "europe", "line": "After cutting rates as inflation soared past 80%, Turkey’s central bank raised them from 8.5% to 50% in under a year."}]}, {"id": "chernobyl", "theme": "A nuclear disaster shakes faith in atomic power", "rhyme": 3, "then": {"year": 1986, "short": "Chernobyl", "title": "The Chernobyl disaster", "where": "Chernobyl, Soviet Ukraine", "region": "russia", "hook": "A Soviet reactor explodes, and Sweden detects the radiation before Moscow admits anything.", "text": "On 26 April 1986, reactor No. 4 at Chernobyl exploded during a safety test. About 49,000 people in nearby Pripyat were evacuated the next day. Thirty-one people died in the short term, and fallout spread across Europe."}, "now": {"year": 2011, "short": "Fukushima", "title": "The Fukushima nuclear disaster", "where": "Fukushima, Japan", "region": "china", "hook": "March 2011: a tsunami sweeping over Japan, then TV footage of reactor buildings exploding.", "text": "On 11 March 2011, a magnitude 9.0 earthquake sent a tsunami about 14 meters high over the Fukushima Daiichi plant. Three reactors melted down and more than 150,000 people were evacuated. Germany soon decided to close all its nuclear plants."}, "followed": "The disaster pushed Mikhail Gorbachev toward more openness, or glasnost, and slowed nuclear building worldwide. Gorbachev later called Chernobyl perhaps the real cause of the Soviet collapse.", "next": {"short": "Next Meltdown", "title": "Nuclear fears return with new reactors", "text": "Around 2036, a serious accident could strike a reactor caught in a war zone or one of the new small reactors built to power data centers.", "watch": "Reactors on front lines like Zaporizhzhia, old plants run past their design life, and a rush to build small reactors quickly."}, "breaks": "Chernobyl was caused by a flawed reactor and a botched test inside a secretive state, while Fukushima was triggered by a tsunami that overwhelmed its defenses.", "older": "Three Mile Island, 1979", "echoes": [{"year": 1979, "short": "Three Mile", "title": "The Three Mile Island accident", "region": "us", "line": "A Pennsylvania reactor partly melted down; no one died, but public fear soared and many Americans turned against nuclear power."}]}, {"id": "tiananmen", "theme": "Mass protests over political freedoms under Beijing", "rhyme": 2, "then": {"year": 1989, "short": "Tiananmen", "title": "The Tiananmen Square protests", "where": "Beijing, China", "region": "china", "hook": "A lone man standing in front of a column of tanks in Beijing.", "text": "After reformer Hu Yaobang died in April 1989, students occupied Beijing’s Tiananmen Square for seven weeks, calling for political reform and press freedom. On the night of 3-4 June, troops cleared the area by force. The government put the death toll near 300; other estimates are far higher."}, "now": {"year": 2019, "short": "Hong Kong 2019", "title": "The Hong Kong protests", "where": "Hong Kong", "region": "china", "hook": "Summer 2019: Hong Kong streets filled with black-clad marchers holding umbrellas against tear gas.", "text": "Protests began in June 2019 against a bill allowing extradition to mainland China. Organizers said about 2 million marched on 16 June; police gave lower figures. The bill was withdrawn in October, and in 2020 Beijing enacted a national security law for the city."}, "followed": "Beijing said the crackdown ensured stability, while Western governments imposed sanctions, including an EU arms embargo. Deng Xiaoping relaunched market reforms in 1992, and the events remain censored in mainland China.", "next": {"short": "Centenary 2049", "title": "New protest tools meet new controls", "text": "Around 2049, the 100th anniversary of the People’s Republic, a generation raised online might find new ways to press demands, and authorities new ways to respond.", "watch": "The approach of 2047, when Hong Kong’s 50-year “one country, two systems” guarantee ends, and job prospects for young graduates."}, "breaks": "Hong Kong kept its own laws and police under “one country, two systems”, and its protests wound down amid arrests, pandemic rules and a new security law, without the army.", "older": "The May Fourth Movement, 1919", "echoes": [{"year": 1919, "short": "May Fourth", "title": "The May Fourth Movement", "region": "china", "line": "Beijing students protested the Versailles deal giving Shandong to Japan, sparking a movement for democracy and science that 1989 protesters invoked."}, {"year": 1976, "short": "April Fifth", "title": "The 1976 Tiananmen Incident", "region": "china", "line": "Crowds mourning Premier Zhou Enlai filled Tiananmen Square with wreaths and poems criticizing radical leaders, until police and militia cleared them."}, {"year": 2014, "short": "Umbrella 2014", "title": "Hong Kong’s Umbrella Movement", "region": "china", "line": "Protesters occupied main Hong Kong streets for 79 days, demanding open elections for the city’s leader and shielding themselves with umbrellas."}, {"year": 2022, "short": "Blank Paper", "title": "China’s blank paper protests", "region": "china", "line": "After a deadly Urumqi fire, crowds in Shanghai, Beijing and other cities protested COVID lockdowns, holding blank paper to signal censored speech."}]}, {"id": "netscape", "theme": "A new technology reaches everyone at once", "rhyme": 3, "then": {"year": 1994, "short": "Netscape", "title": "The Netscape Navigator browser", "where": "Mountain View, California", "region": "us", "hook": "The browser that took millions of people onto the World Wide Web for the first time.", "text": "Released in December 1994 by a startup co-founded by Marc Andreessen, Netscape Navigator made the web easy for ordinary people to browse. Within months it was the most-used browser in the world."}, "now": {"year": 2022, "short": "ChatGPT", "title": "The launch of ChatGPT", "where": "San Francisco, California", "region": "us", "hook": "December 2022: everyone sharing screenshots of a chatbot writing poems, essays and computer code.", "text": "OpenAI released ChatGPT on 30 November 2022 as a free research preview. It passed 1 million users in five days and an estimated 100 million in about two months, the fastest growth yet seen for a consumer app."}, "followed": "Netscape’s 1995 stock debut helped set off the dot-com boom. Microsoft bundled Internet Explorer with Windows, won the “browser war” and faced a US antitrust case, and AOL bought Netscape in 1999.", "next": {"short": "Next Leap", "title": "The next technology everyone adopts overnight", "text": "Around 2050, another tool might reach hundreds of millions within weeks, perhaps brain-computer interfaces or household robots, setting off its own boom, bust and fight over who controls it.", "watch": "Lab demos that suddenly become cheap consumer products, user records broken in days, and investors rushing into a single new category."}, "breaks": "The web Netscape opened ran on open, shared standards, while the leading AI models cost vast sums to build and are controlled by a handful of firms.", "echoes": [{"year": 1920, "short": "Radio Boom", "title": "The first radio broadcasting boom", "region": "us", "line": "Pittsburgh’s KDKA began regular commercial broadcasts, setting off a craze that put radio sets in millions of homes within five years."}, {"year": 2007, "short": "iPhone", "title": "The launch of the iPhone", "region": "us", "line": "Apple’s iPhone put the web, music and phone in one touchscreen device; within a decade, billions of people carried smartphones."}]}, {"id": "dolly", "theme": "Science crosses a line in making life", "rhyme": 2, "then": {"year": 1996, "short": "Dolly", "title": "Dolly the cloned sheep", "where": "Roslin, Scotland", "region": "europe", "hook": "A Scottish sheep named Dolly that made the world ask whether humans would be cloned next.", "text": "Born at the Roslin Institute in July 1996 and unveiled in February 1997, Dolly was the first mammal cloned from an adult cell. She was the only lamb from 277 attempts, and her birth set off a global debate about human cloning."}, "now": {"year": 2018, "short": "CRISPR Babies", "title": "The first gene-edited babies", "where": "Shenzhen, China", "region": "china", "hook": "November 2018: a Chinese scientist announcing on YouTube that gene-edited twin girls had been born.", "text": "Scientist He Jiankui said he had used CRISPR to edit the CCR5 gene in twin girls’ embryos, aiming to make them resistant to HIV. Scientists worldwide condemned the work. In 2019 a Chinese court sentenced him to three years in prison."}, "followed": "Dozens of countries banned human reproductive cloning, and the UN adopted a non-binding declaration against it in 2005. In 2006, Japan’s Shinya Yamanaka found how to reprogram adult cells into stem cells without using embryos.", "next": {"short": "Lab-Made Life", "title": "Babies from lab-grown eggs and sperm", "text": "Around 2040, a clinic might announce a baby made from eggs or sperm grown from skin cells, reigniting the debate Dolly began.", "watch": "Lab-grown human eggs and sperm, embryo screening sold for traits, and countries with loose rules on reproductive technology."}, "breaks": "Dolly was a sheep made by a team that published its work openly, while He secretly edited human embryos, making heritable changes in real children.", "older": "Louise Brown, the first IVF baby, 1978", "echoes": [{"year": 1973, "short": "Gene Splicing", "title": "The first genetically engineered bacteria", "region": "us", "line": "Stanley Cohen and Herbert Boyer spliced foreign genes into bacteria, prompting scientists to pause such work and meet at Asilomar in 1975."}, {"year": 1978, "short": "IVF Baby", "title": "Louise Brown, the first IVF baby", "region": "europe", "line": "Louise Brown, the first baby conceived outside the body, was born in England, setting off a global debate over “test-tube babies”."}, {"year": 2010, "short": "Synthetic Cell", "title": "The first cell with a synthetic genome", "region": "us", "line": "Craig Venter’s team made a bacterium run on a lab-built genome, and President Obama asked his bioethics commission to study the risks."}]}, {"id": "deepblue", "theme": "A machine beats the best human player", "rhyme": 3, "then": {"year": 1997, "short": "Deep Blue", "title": "Deep Blue beats Kasparov", "where": "New York, USA", "region": "us", "hook": "The world chess champion walking away from the board, beaten by an IBM computer.", "text": "In May 1997, IBM’s Deep Blue beat world champion Garry Kasparov 3½ to 2½ in a six-game rematch in New York. It searched about 200 million positions per second. Kasparov suggested humans had helped the machine; IBM denied it."}, "now": {"year": 2016, "short": "AlphaGo", "title": "AlphaGo beats Lee Sedol", "where": "Seoul, South Korea", "region": "china", "hook": "March 2016: Google’s AlphaGo beating Go champion Lee Sedol, years before experts expected.", "text": "In March 2016, Google DeepMind’s AlphaGo beat Lee Sedol, one of the world’s top Go players, 4 to 1 in Seoul. Its move 37 in game two stunned professionals. Many experts had expected this milestone to be a decade away."}, "followed": "Chess engines soon outplayed every human, and players began training with them. Kasparov promoted human-computer teams, and IBM moved on to Watson, which won the TV quiz show Jeopardy! in 2011.", "next": {"short": "Beyond Games", "title": "AI outthinks humans at discovery", "text": "Around 2035, a machine might beat the best humans at something once seen as deeply creative, perhaps solving a famous open problem in mathematics or designing a working medicine largely on its own.", "watch": "AI systems producing original mathematical proofs, running lab experiments without human direction, and top experts in a field conceding defeat."}, "breaks": "Deep Blue won through brute-force search hand-tuned by experts, while AlphaGo learned much of its play from data and self-play, a method that spread far beyond games.", "echoes": [{"year": 2011, "short": "Watson", "title": "IBM’s Watson wins Jeopardy!", "region": "us", "line": "IBM’s Watson beat Ken Jennings and Brad Rutter, the quiz show’s biggest champions, by answering clues written in everyday language."}, {"year": 2017, "short": "Libratus", "title": "AI beats top poker pros", "region": "us", "line": "Carnegie Mellon’s Libratus beat four top professionals at no-limit Texas hold’em, a game of bluffing and hidden cards, over 120,000 hands."}]}, {"id": "y2k", "theme": "The day the computers fail", "rhyme": 2, "then": {"year": 1999, "short": "Y2K Bug", "title": "The Y2K millennium bug", "where": "Worldwide", "region": "world", "hook": "Stockpiled water and fears that planes, banks and power grids would fail at midnight.", "text": "Old software stored years as two digits, so 2000 could be read as 1900 and break systems. Governments and companies spent an estimated $300 billion or more on fixes. When midnight came on 1 January 2000, only minor glitches were reported."}, "now": {"year": 2024, "short": "CrowdStrike", "title": "The CrowdStrike global IT outage", "where": "Worldwide", "region": "world", "hook": "19 July 2024: blue screens on airport departure boards and handwritten boarding passes.", "text": "A faulty CrowdStrike security update crashed about 8.5 million Windows computers within hours. Airlines grounded flights, hospitals postponed procedures and some broadcasters went off air. Delta alone canceled about 7,000 flights over five days."}, "followed": "Y2K became a byword for overblown fear, though many engineers said the quiet midnight proved the fixes had worked. Within months the dot-com bubble burst.", "next": {"short": "System Crash", "title": "One bad update stops the world", "text": "Around 2049, a single faulty update or hidden bug might freeze far more critical systems, from power grids to fleets of self-driving cars, across the world in minutes.", "watch": "The Year 2038 problem, when older 32-bit Unix clocks overflow, and essential services relying on the same few software vendors."}, "breaks": "Y2K was a known deadline that years of work largely defused, while the CrowdStrike crash came without warning from one company’s routine update.", "older": "The AT&T phone network crash, 1990", "echoes": [{"year": 1990, "short": "AT&T Crash", "title": "The AT&T long-distance network crash", "region": "us", "line": "A bug in a software update crashed AT&T’s long-distance network for nine hours, blocking tens of millions of calls across the US."}, {"year": 2017, "short": "WannaCry", "title": "The WannaCry ransomware attack", "region": "world", "line": "WannaCry ransomware locked over 200,000 computers in about 150 countries, forcing British hospitals to cancel thousands of appointments."}, {"year": 2021, "short": "Facebook Outage", "title": "The great Facebook outage", "region": "world", "line": "A faulty command during routine maintenance knocked Facebook, Instagram and WhatsApp offline for about six hours for billions of users."}]}, {"id": "dotcom", "theme": "A tech investment bubble bursts", "rhyme": 2, "then": {"year": 2000, "short": "Dot-com Crash", "title": "The dot-com crash", "where": "United States", "region": "us", "hook": "Sock puppet mascots, Super Bowl ads, and internet startups that vanished almost overnight.", "text": "The tech-heavy Nasdaq index peaked in March 2000, then lost about 78% by October 2002. Hundreds of internet startups with little revenue folded, including Pets.com, which shut down nine months after its stock debut."}, "now": {"year": 2022, "short": "Crypto Crash", "title": "The crypto crash and FTX collapse", "where": "Worldwide", "region": "world", "hook": "November 2022: FTX, the crypto exchange with its name on an arena, collapsing within days.", "text": "Crypto markets lost about $2 trillion from their late-2021 peak, and Bitcoin fell from about $69,000 to below $16,000. In November 2022 the FTX exchange collapsed, with about $8 billion in customer money missing. Founder Sam Bankman-Fried was later convicted of fraud."}, "followed": "Survivors such as Amazon and eBay grew into giants, and Google went public in 2004. Many economists argue the low interest rates after the crash helped feed the housing bubble that burst in 2008.", "next": {"short": "Next Bubble", "title": "A new technology bubble bursts", "text": "Around 2044, a fresh frenzy might build around a promising technology, perhaps quantum computing, space or some invention not yet named, then burst when profits come more slowly than promised.", "watch": "Company values far ahead of revenue, first-time investors piling in through phone apps, and celebrities promoting assets they are paid to endorse."}, "breaks": "The dot-com bubble funded the internet, which went on to reshape daily life, while crypto’s lasting uses are still debated.", "older": "Britain’s Railway Mania, 1846", "echoes": [{"year": 1846, "short": "Railway Mania", "title": "Britain’s Railway Mania", "region": "europe", "line": "Britons poured savings into hundreds of new railway schemes, many never built; when share prices collapsed, thousands of investors were ruined."}, {"year": 1873, "short": "Panic of 1873", "title": "The Panic of 1873", "region": "us", "line": "After a US railroad boom, Jay Cooke’s bank collapsed under Northern Pacific debts, setting off a panic and a years-long depression."}]}, {"id": "blackout", "theme": "A sudden grid collapse darkens millions", "rhyme": 3, "then": {"year": 2003, "short": "2003 Blackout", "title": "The Northeast blackout of 2003", "where": "Northeastern US and Ontario", "region": "us", "hook": "New Yorkers walking home across bridges in the heat as the city’s lights went out.", "text": "On 14 August 2003, power lines sagging into trees in Ohio and a failed alarm system set off a cascade. About 55 million people in eight US states and Ontario lost power, some for days. Subways stopped and traffic lights went dark."}, "now": {"year": 2025, "short": "Iberian Outage", "title": "The Iberian blackout", "where": "Spain and Portugal", "region": "europe", "hook": "28 April 2025: dead traffic lights, stalled trains and battery radios across Spain and Portugal.", "text": "On 28 April 2025, at 12:33 Spanish time, the grids of Spain and Portugal collapsed within seconds. Trains stalled, phone networks faltered and tens of millions lost power until late that night or the next morning. Investigators traced it to a chain of voltage surges that tripped power plants."}, "followed": "A US-Canada task force blamed overgrown trees, failed alarms and operator errors at an Ohio utility. The Energy Policy Act of 2005 then made grid reliability rules mandatory across North America.", "next": {"short": "Next Blackout", "title": "A more electric world goes dark", "text": "Around 2047, with cars, heating and cooking running on electricity, a cyberattack, solar storm or control failure might black out a whole country and freeze daily life.", "watch": "How grids keep voltage stable as power sources change, cyberattacks on utilities, strong solar storms, and thin links between national grids."}, "breaks": "In 2003 failures built up over hours on part of a vast continental grid, while in 2025 two whole countries, weakly linked to Europe, collapsed in seconds.", "older": "The Northeast blackout, 1965", "echoes": [{"year": 1965, "short": "1965 Blackout", "title": "The Northeast blackout of 1965", "region": "us", "line": "A wrongly set relay near Niagara Falls triggered a cascade that left about 30 million people in the Northeast and Ontario dark."}, {"year": 1977, "short": "NYC Blackout", "title": "The New York City blackout of 1977", "region": "us", "line": "Lightning strikes blacked out New York City for about a day, and looting and arson broke out across many neighborhoods."}, {"year": 2012, "short": "India Blackout", "title": "India’s 2012 grid collapse", "region": "india", "line": "Two grid failures in two days left over 600 million people in northern and eastern India without power, the largest blackout recorded."}]}];
const WORLD = {"1755": {"us": "In Britain’s American colonies, French and Native forces routed General Braddock’s army near Fort Duquesne in July; young George Washington survived. In November an earthquake shook Boston.", "latam": "Guaraní mission villages fought Spanish and Portuguese troops enforcing a 1750 border swap. Pombal’s Portugal banned enslaving Amazon peoples and founded a monopoly company for Grão-Pará and Maranhão.", "europe": "Lisbon’s 1 November earthquake shocked the continent. In London, Samuel Johnson published his Dictionary of the English Language, while Britain and France drifted toward the Seven Years’ War.", "russia": "Empress Elizabeth founded Moscow University in January, a project of scholar Mikhail Lomonosov and her favourite Ivan Shuvalov. In the Urals, the mullah Batyrsha led a Bashkir uprising.", "mideast": "Sultan Osman III completed Istanbul’s Nuruosmaniye Mosque, an early Ottoman Baroque landmark. In Morocco, the Lisbon tsunami struck the coast, and a separate November quake hit Meknes.", "africa": "In Ethiopia, Emperor Iyasu II died and his son Iyoas I took the throne. At the Dutch Cape, a smallpox epidemic struck colonists, slaves and Khoikhoi.", "india": "British and Peshwa forces took the sea fort of Suvarnadurg from the naval chief Tulaji Angre in April. In Delhi, Mughal emperor Alamgir II was a puppet of his vizier Imad-ul-Mulk.", "china": "Qianlong’s armies took Ili, heart of the Dzungar Mongol state, but their ally Amursana soon rebelled. In Japan, a cold, wet summer brought the Hōreki famine to the northeast."}, "1789": {"us": "George Washington was sworn in as first president at New York’s Federal Hall on 30 April. In September Congress sent the states the amendments that became the Bill of Rights.", "latam": "In Brazil, Portuguese officials uncovered the Minas Gerais independence plot and arrested its leader, Tiradentes. In French Saint-Domingue, planters and free people of colour pressed rival claims in revolutionary Paris.", "europe": "Beyond France’s revolution, the Austrian Netherlands rose in the Brabant Revolution in October. In Britain, George III recovered from mental illness, ending the Regency Crisis.", "russia": "Catherine the Great was at war with both Sweden and the Ottomans. General Alexander Suvorov, with Austrian allies, routed Ottoman armies at Focșani and Rymnik, in today’s Romania.", "mideast": "Sultan Abdul Hamid I died in April, and the reform-minded Selim III took the Ottoman throne amid a losing war with Russia and Austria. Austria captured Belgrade in October.", "africa": "In Dahomey, King Kpengla died and his son Agonglo took the throne after a palace struggle. In Sierra Leone, Temne ruler King Jimmy burned Granville Town, home to Black settlers from London.", "india": "In December, Tipu Sultan of Mysore attacked the Travancore Lines, defences of a British ally, setting off the Third Anglo-Mysore War. Governor-General Cornwallis was reworking Bengal’s land revenue system.", "china": "In January, Vietnam’s Tây Sơn leader Nguyễn Huệ routed a Qing army at Hanoi. In Japan’s north, Ainu on Kunashir and the Menashi coast rose against Japanese traders and were crushed."}, "1790": {"us": "The first census counted about 3.9 million people, and Rhode Island became the last original state to ratify the Constitution. Benjamin Franklin died in Philadelphia in April.", "latam": "Workers paving Mexico City’s main square unearthed the Aztec Sun Stone and a statue of Coatlicue. In Saint-Domingue, Vincent Ogé led a failed revolt demanding votes for free men of colour.", "europe": "Paris celebrated the Bastille’s fall with the Festival of the Federation, and a new law made priests state employees. In London, Edmund Burke published Reflections on the Revolution in France.", "russia": "Russia made peace with Sweden at Värälä in August. Writer Alexander Radishchev attacked serfdom in print and was condemned to death, commuted to Siberian exile.", "mideast": "Under Prussian pressure, Austria agreed at Reichenbach in July to return its Ottoman conquests. In December, Russian troops stormed the Danube fortress of Izmail, killing most of its garrison.", "africa": "In Madagascar, King Andrianampoinimerina was uniting the Merina highlands from Ambohimanga. James Bruce published his account of travelling through Ethiopia to the source of the Blue Nile.", "india": "The Third Anglo-Mysore War began, with the East India Company, the Marathas and Hyderabad allied against Tipu Sultan. Tipu checked the first British invasion of Mysore.", "china": "Opera troupes from Anhui came to Beijing for the Qianlong Emperor’s 80th birthday, seeding Peking opera. Japan’s shogunate banned “heterodox” Confucian teaching at its official academy."}, "1796": {"us": "George Washington published his Farewell Address and stepped aside. John Adams narrowly beat Thomas Jefferson for president, and Tennessee became the 16th state.", "latam": "In Saint-Domingue, Toussaint Louverture rescued French governor Laveaux from a coup and was named lieutenant governor. Spain joined France against Britain in October, exposing its colonies to British attack.", "europe": "Newly married to Joséphine, Napoleon Bonaparte led France’s Army of Italy to victories at Lodi and Arcole. In December a French fleet tried and failed to land troops in Ireland.", "russia": "Catherine the Great died in November, and her son Paul I succeeded her. Paul recalled an army invading Persia and freed the Polish rebel leader Tadeusz Kościuszko.", "mideast": "Agha Mohammad Khan was formally crowned shah, founding Iran’s Qajar dynasty, and seized Mashhad from the last Afsharid ruler. Selim III kept building his European-style Nizam-ı Cedid army.", "africa": "Scottish explorer Mungo Park reached the Niger River at Ségou in July. At the Cape, seized by Britain in 1795, a Dutch fleet sent to retake it surrendered at Saldanha Bay.", "india": "Britain seized the Dutch forts of coastal Ceylon, taking Colombo in February. In Pune, Baji Rao II became Maratha Peshwa after months of court intrigue.", "china": "The Qianlong Emperor formally handed the throne to his son Jiaqing but kept real power. The White Lotus Rebellion broke out in central China, lasting until 1804."}, "1811": {"us": "In January, hundreds of enslaved people rose near New Orleans in the German Coast uprising. In November Governor Harrison fought Tecumseh’s confederacy at Tippecanoe, and in December the New Madrid earthquakes began.", "latam": "Venezuela declared independence from Spain on 5 July. In Mexico, rebel priest Miguel Hidalgo was captured and executed, while Paraguay threw off Spanish rule in May.", "europe": "In Britain, the Prince of Wales became Regent for his ailing father, George III. In Portugal, Masséna’s starving French army retreated from Wellington’s Lines of Torres Vedras.", "russia": "Alexander I opened the Tsarskoye Selo Lyceum, where young Alexander Pushkin was among the first pupils. On the Danube, Kutuzov trapped and defeated an Ottoman army near Ruse.", "mideast": "In March, Egypt’s Ottoman governor Muhammad Ali had the Mamluk leaders massacred at the Cairo Citadel. Later that year he sent an army against the first Saudi state in Arabia.", "africa": "At the British-held Cape, Colonel John Graham’s troops began driving Xhosa communities east of the Fish River in December. Black American shipowner Paul Cuffe visited Freetown to explore resettlement.", "india": "Governor-General Lord Minto sent an Indian army that seized French-controlled Java in August. In Punjab, Ranjit Singh kept building his Sikh empire.", "china": "In Korea, Hong Gyeong-nae launched a major revolt in the northwest in December. Japanese guards seized Russian captain Vasily Golovnin on Kunashir, holding him for two years."}, "1830": {"us": "President Andrew Jackson signed the Indian Removal Act in May, paving the way for the Trail of Tears. Joseph Smith published the Book of Mormon and founded his church.", "latam": "Gran Co
