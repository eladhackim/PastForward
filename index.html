<style>
/* PastForward on one screen: a river of time on top, then one rhyme told in three steps (Then, Today, Next),
   with one button that always says where it goes. Everything else is one tap away, in the full story.
   Two themes from one set of tokens: night (dark) and day (light). The trailer and share images always use night. */
:root, .night {
  color-scheme: dark;
  --bg-rgb: 15, 13, 34;
  --surface-rgb: 27, 24, 58;
  --surface2: #241F4C;
  --ink-rgb: 241, 236, 223;
  --muted-rgb: 164, 159, 194;
  --then-rgb: 230, 184, 102;
  --now-rgb: 116, 214, 200;
  --next-rgb: 201, 182, 255;
  --bad-rgb: 229, 140, 122;
  --glow-rgb: 120, 92, 210;
  --glow-a: .16;
  --on-accent: #0F0D22;
  --shade: 0, 0, 0;
  --bg: rgb(var(--bg-rgb));
  --surface: rgb(var(--surface-rgb));
  --ink: rgb(var(--ink-rgb));
  --muted: rgb(var(--muted-rgb));
  --then: rgb(var(--then-rgb));
  --now: rgb(var(--now-rgb));
  --next: rgb(var(--next-rgb));
  --bad: rgb(var(--bad-rgb));
  --line: rgba(var(--ink-rgb), .11);
}
.night { color: var(--ink); }
:root[data-theme="light"] {
  color-scheme: light;
  --bg-rgb: 245, 243, 249; --surface-rgb: 255, 255, 255; --surface2: #ECE9F4;
  --ink-rgb: 28, 25, 48; --muted-rgb: 94, 89, 118;
  --then-rgb: 138, 92, 10; --now-rgb: 10, 118, 106; --next-rgb: 100, 71, 201; --bad-rgb: 176, 66, 46;
  --glow-a: .08; --on-accent: #FFFFFF; --shade: 40, 34, 80;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg-rgb: 245, 243, 249; --surface-rgb: 255, 255, 255; --surface2: #ECE9F4;
    --ink-rgb: 28, 25, 48; --muted-rgb: 94, 89, 118;
    --then-rgb: 138, 92, 10; --now-rgb: 10, 118, 106; --next-rgb: 100, 71, 201; --bad-rgb: 176, 66, 46;
    --glow-a: .08; --on-accent: #FFFFFF; --shade: 40, 34, 80;
  }
}
/* topic colours: each rhyme belongs to one, so lists can be scanned at a glance */
:root, .night { --t-health: 236, 150, 196; --t-money: 150, 214, 138; --t-power: 240, 164, 108; --t-tech: 127, 184, 255; --t-disaster: 240, 128, 128; --t-society: 217, 182, 140; }
:root[data-theme="light"] { --t-health: 172, 52, 118; --t-money: 46, 122, 50; --t-power: 172, 82, 26; --t-tech: 30, 96, 190; --t-disaster: 178, 44, 44; --t-society: 134, 92, 50; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --t-health: 172, 52, 118; --t-money: 46, 122, 50; --t-power: 172, 82, 26; --t-tech: 30, 96, 190; --t-disaster: 178, 44, 44; --t-society: 134, 92, 50; } }
.tp-health { --tc: var(--t-health); } .tp-money { --tc: var(--t-money); } .tp-power { --tc: var(--t-power); }
.tp-tech { --tc: var(--t-tech); } .tp-disaster { --tc: var(--t-disaster); } .tp-society { --tc: var(--t-society); }
:root {
  --f-then: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --f-ui: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body: "Newsreader", "Iowan Old Style", Georgia, serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { height: 100%; background: var(--bg); -webkit-text-size-adjust: 100%; }
html.lock { overflow: hidden; }
body {
  height: 100%; margin: 0; overflow-x: clip; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  background: radial-gradient(ellipse 120% 36% at 50% 0%, rgba(var(--glow-rgb), var(--glow-a)), transparent 72%), var(--bg);
  color: var(--ink);
  font-family: var(--f-body); font-size: 17px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  -webkit-tap-highlight-color: transparent;
}
#sky { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
.app { position: relative; z-index: 1; height: 100%; min-height: 530px; max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; padding-block: 2px 16px; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 2px solid var(--next); outline-offset: 2px; }

/* top bar: the name, and three places to go */
.bar { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; }
h1 { margin: 0; font-family: var(--f-then); font-weight: 400; font-size: clamp(19px, 5.6vw, 23px); line-height: 1; white-space: nowrap; }
h1 .p { color: var(--then); }
h1 .f { color: var(--next); }
h1.tap { cursor: pointer; }
.bar-r { display: flex; align-items: center; gap: 2px; margin-right: -8px; }
.navb { position: relative; min-height: 40px; padding: 0 9px; border: 0; border-radius: 10px; background: none; font: 500 15px var(--f-ui); color: rgba(var(--ink-rgb), .8); cursor: pointer; white-space: nowrap; }
.navb:hover { color: var(--ink); background: rgba(var(--ink-rgb), .07); }
.navb.icon { width: 40px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.navb svg { width: 19px; height: 19px; }
.navb.new::after { content: ""; position: absolute; top: 9px; right: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--then); }
@media (max-width: 350px) { .navb { padding: 0 6px; font-size: 14.5px; } .bar-r { margin-right: -6px; } }

/* the river of time: full width, no frame */
.tl { position: relative; flex: none; margin-inline: calc(50% - 50vw); }
#tl { display: block; width: 100%; height: clamp(150px, 23vh, 210px); touch-action: pan-y; cursor: grab; outline: none; user-select: none; -webkit-user-select: none; }
#tl.dragging { cursor: grabbing; }
#tl:focus-visible { box-shadow: inset 0 0 0 2px var(--next); }
@media (min-width: 700px) { #tl { height: clamp(200px, 27vh, 290px); } }
.swipe-hint { position: absolute; left: 50%; bottom: 1px; transform: translateX(-50%); padding: 2px 12px; border-radius: 999px; background: var(--bg); font: 500 13.5px var(--f-ui); color: var(--muted); pointer-events: none; white-space: nowrap; transition: opacity .6s ease; animation: nudge 2.4s ease-in-out infinite; }
.swipe-hint.gone { opacity: 0; }
@keyframes nudge { 0%, 100% { transform: translateX(-50%); } 50% { transform: translateX(calc(-50% - 8px)); } }

/* one rhyme: its pattern, the three steps, the current step, and the way on */
.stage { --k: var(--then-rgb); position: relative; flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; padding-top: 12px; touch-action: pan-y; }
.stage.now { --k: var(--now-rgb); }
.stage.next { --k: var(--next-rgb); }
.pattern { flex: none; display: flex; flex-direction: column; align-items: flex-start; }
.motif { margin: 0; font: italic 400 19px/1.3 var(--f-body); color: var(--ink); text-wrap: balance; cursor: pointer; }
.echoes { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; min-height: 36px; margin-top: 8px; padding: 0 12px 0 12px; border: 0; border-radius: 999px; background: rgba(var(--ink-rgb), .07); font: 500 14.5px var(--f-ui); color: var(--muted); cursor: pointer; white-space: nowrap; transition: background-color .2s; }
.echoes:hover { background: rgba(var(--ink-rgb), .12); color: var(--ink); }
.echoes b { font-weight: 600; color: var(--ink); }
.echoes .chev { font-size: 17px; line-height: 1; margin-left: -3px; opacity: .7; }
.echoes .w { display: none; }
@media (min-width: 420px) { .echoes .w { display: inline; } }
@media (max-width: 335px) { .echoes .s { display: none; } }
/* one bead for each time the rhyme has happened, Then and Today in their colours, the Next still open */
.beads { display: inline-flex; align-items: center; gap: 3px; }
.beads i { display: block; width: 6px; height: 6px; border-radius: 50%; background: rgba(var(--ink-rgb), .5); }
.beads i.then { background: var(--then); }
.beads i.now { background: var(--now); }
.beads i.next { width: 7px; height: 7px; margin-left: 3px; background: none; box-shadow: inset 0 0 0 1.5px var(--next); }
.beads i.news { background: var(--now); box-shadow: 0 0 0 2px rgba(var(--now-rgb), .28); }
/* in the news: this week's event, already researched into this rhyme as its newest echo */
.newsln { display: inline-flex; align-items: center; gap: 9px; max-width: 100%; min-height: 32px; margin: 0 0 10px; padding: 0 12px 0 11px; border: 0; border-radius: 999px; background: rgba(var(--now-rgb), .13); font: 500 14px var(--f-ui); color: var(--ink); cursor: pointer; white-space: nowrap; transition: background-color .2s; }
.newsln:hover { background: rgba(var(--now-rgb), .2); }
.newsln .live { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--now); animation: live 2.4s ease-out infinite; }
.newsln .nt { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.newsln .nt b { font-weight: 600; color: var(--now); }
.newsln .chev { flex: none; color: var(--muted); }
@keyframes live { 0% { box-shadow: 0 0 0 0 rgba(var(--now-rgb), .5); } 70%, 100% { box-shadow: 0 0 0 7px rgba(var(--now-rgb), 0); } }
@media (prefers-reduced-motion: reduce) { .newsln .live { animation: none; } }
.beads.pop i { animation: beadIn .5s cubic-bezier(.3, .7, .3, 1.5) both; animation-delay: var(--d, 0s); }
@keyframes beadIn { from { opacity: 0; transform: scale(.2); } to { opacity: 1; transform: none; } }
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 13px; }
.sig i { display: block; width: 3px; border-radius: 1px; background: rgba(var(--ink-rgb), .2); }
.sig i:nth-child(1) { height: 4px; } .sig i:nth-child(2) { height: 7px; } .sig i:nth-child(3) { height: 10px; } .sig i:nth-child(4) { height: 13px; }
.sig.s1 i:nth-child(-n+1), .sig.s2 i:nth-child(-n+2), .sig.s3 i:nth-child(-n+3), .sig.s4 i { background: rgba(var(--ink-rgb), .82); }

/* the three steps on one track: the line fills in as you go */
.steps { --fill: 100%; position: relative; flex: none; display: grid; grid-template-columns: 4.3em minmax(0, 1fr) 4.3em minmax(0, 1fr) 4.3em; margin-top: 18px; font-size: 16px; }
.steps::before, .steps::after { content: ""; position: absolute; left: 7px; right: 7px; top: 6px; height: 2px; border-radius: 1px; }
.steps::before { background: rgba(var(--muted-rgb), .3); }
.steps::after { background: linear-gradient(90deg, var(--then), var(--now) 50%, var(--next)); clip-path: inset(0 var(--fill) 0 0); transition: clip-path .7s cubic-bezier(.3, .7, .2, 1); }
.steps.at-now { --fill: 50%; }
.steps.at-next { --fill: 0%; }
.st { --c: var(--then-rgb); position: relative; z-index: 1; display: flex; flex-direction: column; align-items: flex-start; min-width: 0; padding: 0 0 4px; border: 0; background: none; cursor: pointer; text-align: left; white-space: nowrap; }
.st.now { --c: var(--now-rgb); align-items: center; text-align: center; }
.st.next { --c: var(--next-rgb); align-items: flex-end; text-align: right; }
.st i { display: block; width: 14px; height: 14px; margin-bottom: 9px; border-radius: 50%; border: 2px solid rgb(var(--c)); background: var(--bg); transition: background-color .3s, box-shadow .3s; }
.st .sy { font: 600 17px/1.2 var(--f-ui); font-variant-numeric: tabular-nums; color: rgba(var(--ink-rgb), .72); transition: color .3s; }
.st .sl { font: 500 13.5px/1.35 var(--f-ui); color: var(--muted); }
.st:hover .sy { color: var(--ink); }
.st.on i { background: rgb(var(--c)); box-shadow: 0 0 0 5px rgba(var(--c), .2); }
.st.on .sy { color: rgb(var(--c)); }
.st.on .sl { color: var(--ink); }
.st-g { align-self: start; min-width: 0; padding: 25px 4px 0; text-align: center; font: 500 13px/1.25 var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
@media (max-width: 380px) { .st-g .yrs { display: none; } }

/* the current step */
.story { flex: none; margin-top: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; transition: opacity .2s ease, transform .2s ease; }
.story.out { opacity: 0; transform: translateX(var(--dx, -14px)); }
.ct { margin: 0; font: 500 clamp(28px, 7.6vw, 36px)/1.1 var(--f-body); color: rgb(var(--k)); text-wrap: balance; }
.ch { margin: 0; font: 400 18.5px/1.45 var(--f-body); color: rgba(var(--ink-rgb), .88); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
.cx { margin: 4px 0 0; font: 400 16.5px/1.55 var(--f-body); color: rgba(var(--ink-rgb), .7); display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.more { margin-top: 2px; min-height: 36px; padding: 0; border: 0; background: none; font: 500 15px var(--f-ui); color: var(--ink); text-decoration: underline; text-decoration-color: rgba(var(--ink-rgb), .3); text-decoration-thickness: 1px; text-underline-offset: 4px; cursor: pointer; }
.more:hover { text-decoration-color: currentColor; }

/* the way on: what happens next, said once, and the one button that does it */
.foot { flex: none; margin-top: auto; padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
#cVote:empty { display: none; }
.guide { margin: 0; font: 400 15px/1.45 var(--f-ui); color: var(--muted); text-wrap: pretty; }
.actions { display: flex; gap: 8px; }
.primary, .secondary { min-height: 52px; min-width: 0; border: 0; border-radius: 14px; cursor: pointer; font: 600 16px var(--f-ui); padding: 0 16px; white-space: nowrap; }
.primary { --acc: var(--ink-rgb); flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px; color: var(--on-accent); background: rgb(var(--acc)); transition: background-color .3s, transform .15s; }
.primary:active { transform: scale(.985); }
.primary.to-then { --acc: var(--then-rgb); }
.primary.to-now { --acc: var(--now-rgb); }
.primary.to-next { --acc: var(--next-rgb); }
.secondary { background: rgba(var(--ink-rgb), .08); color: var(--ink); }
.secondary:hover { background: rgba(var(--ink-rgb), .13); }
.iconbtn { flex: none; width: 52px; min-height: 52px; border: 0; border-radius: 14px; background: rgba(var(--ink-rgb), .08); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
.iconbtn:hover { background: rgba(var(--ink-rgb), .13); }
.iconbtn svg { width: 19px; height: 19px; }
.pulse { animation: glow 2.2s ease-in-out 3; }
@keyframes glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(var(--acc, var(--ink-rgb)), 0); } 50% { box-shadow: 0 0 0 7px rgba(var(--acc, var(--ink-rgb)), .22); } }
.vote { flex: none; display: flex; flex-direction: column; gap: 8px; }
.vote-q { display: flex; align-items: center; justify-content: space-between; gap: 6px 10px; flex-wrap: wrap; }
.vote-q > span:first-child { font: 500 15px var(--f-ui); color: var(--ink); }
.vote-b { display: inline-flex; gap: 6px; }
.vote-b button { min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(var(--ink-rgb), .2); background: none; font: 500 14.5px var(--f-ui); cursor: pointer; }
.vote-b button:hover { border-color: rgba(var(--ink-rgb), .5); }
.vote-b button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.vbar { height: 6px; border-radius: 3px; background: rgba(var(--muted-rgb), .2); overflow: hidden; }
.vbar i { display: block; height: 100%; border-radius: 3px; background: var(--next); transition: width .6s ease; }
.vres { display: flex; justify-content: space-between; gap: 8px; font: 14px var(--f-ui); color: var(--muted); }

@media (min-width: 700px) {
  .stage { padding-top: 8px; }
  .pattern { margin-top: auto; }
  .foot { margin-top: 30px; margin-bottom: auto; }
  .motif { font-size: 21px; }
  .steps { margin-top: 22px; }
  .story { margin-top: 26px; }
  .ct { font-size: 44px; }
  .ch { font-size: 21px; }
  .cx { font-size: 18px; }
}
@media (max-height: 740px) { .story { margin-top: 16px; } .steps { margin-top: 14px; } }
@media (max-height: 680px) { #tl { height: 140px; } .steps { margin-top: 12px; } .story { margin-top: 12px; } .ct { font-size: 27px; } }
@media (max-height: 650px) { .motif { font-size: 17.5px; } .guide { font-size: 14.5px; } .more { min-height: 30px; } .foot { gap: 10px; } }
@media (max-height: 600px) { .bar { min-height: 46px; } #tl { height: 128px; } .guide .gx { display: none; } .steps { margin-top: 10px; } .story { margin-top: 10px; } .foot { padding-top: 10px; } }
@media (max-height: 590px) { .newsln { min-height: 28px; margin-bottom: 6px; font-size: 13px; } .echoes { margin-top: 4px; min-height: 30px; font-size: 14px; } .motif { font-size: 16.5px; } .story { margin-top: 12px; } .ct { font-size: 26px; } }
@media (max-width: 359px) { .primary { padding: 0 12px; font-size: 15px; } .actions { gap: 6px; } .iconbtn { width: 48px; } }

/* shared pieces used across the sheets */
.rchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.rchip { display: inline-flex; align-items: center; gap: 7px; min-height: 28px; padding: 0 10px; border-radius: 999px; border: 1px dashed rgba(var(--muted-rgb), .55); background: none; font: 500 13.5px var(--f-ui); color: var(--muted); cursor: help; white-space: nowrap; }
.rchip:hover { border-color: var(--ink); color: var(--ink); }
.sigline { display: flex; align-items: center; gap: 8px; margin: 0; font: 600 15px var(--f-ui); color: var(--ink); }
.term { display: inline; background: none; border: 0; padding: 0; margin: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: help; text-decoration: underline dotted; text-decoration-thickness: 1.5px; text-decoration-color: rgba(var(--muted-rgb), .75); text-underline-offset: 3px; }
.term:hover { text-decoration-color: currentColor; }
.tip { position: fixed; z-index: 70; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface2); box-shadow: 0 16px 44px rgba(var(--shade), .4); }
.tip b { display: block; font: 500 21px/1.15 var(--f-body); color: var(--next); }
.tip p { margin: 4px 0 8px; font: 15px/1.45 var(--f-ui); color: var(--ink); }
.lx-g { margin: 8px 0 0; font: 600 14px var(--f-ui); color: var(--muted); }
.lx { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.lx li { padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); scroll-margin: 16px; transition: border-color .4s; }
.lx li.hl { border-color: var(--next); }
.lx .lt { display: block; font: 500 23px/1.15 var(--f-body); color: var(--ink); }
.lx .ld { margin: 4px 0 0; font: 15.5px/1.45 var(--f-ui); }
.lx .le { margin: 6px 0 0; font: 14px/1.4 var(--f-ui); color: var(--muted); }
.lx .le span { font-weight: 600; margin-right: 6px; }

hile in 2023 public anger targeted builders and the officials meant to inspect them.", "topic": "disaster", "echoes": [{"year": -464, "short": "Sparta Quake", "title": "An earthquake sparks Sparta’s helot revolt", "region": "europe", "line": "A quake devastated Sparta and its helot serfs seized the moment to revolt, a rising that took Sparta years to put down."}, {"year": -70, "short": "Han Quake Edict", "title": "A quake humbles Han Emperor Xuan", "region": "china", "line": "After quakes hit 49 commanderies, Emperor Xuan called disasters Heaven’s warning, asked for frank criticism and wore plain dress for five days."}, {"year": 1257, "short": "Kamakura Quake", "title": "Nichiren blames Japan’s rulers for disasters", "region": "china", "line": "After a quake and famines, monk Nichiren blamed the disasters on Japan’s rulers backing teachings he called false, and was exiled."}, {"year": 1972, "short": "Managua Quake", "title": "The 1972 Managua earthquake", "region": "latam", "line": "A quake killed thousands in Nicaragua’s capital, and claims that Somoza’s circle pocketed foreign aid fed the revolt that toppled him."}, {"year": 1976, "short": "Tangshan Quake", "title": "The 1976 Tangshan earthquake", "region": "china", "line": "Officially 242,000 died, the toll stayed hidden for three years, and Mao’s death weeks later made the quake look like an omen."}, {"year": 1980, "short": "Irpinia Quake", "title": "The 1980 Irpinia earthquake", "region": "europe", "line": "Rescuers took days to reach ruined villages in southern Italy, and President Pertini went on television to condemn the state’s failures."}, {"year": 1985, "short": "Mexico Quake", "title": "The 1985 Mexico City earthquake", "region": "latam", "line": "As thousands died and the government stalled, volunteers dug out survivors themselves, and anger over shoddy buildings weakened the ruling PRI."}, {"year": 1988, "short": "Armenia Quake", "title": "The 1988 Armenian earthquake", "region": "russia", "line": "At least 25,000 died in Soviet Armenia; shoddy Brezhnev-era buildings and slow rescues were blamed, deepening Armenians’ distrust of Moscow."}, {"year": 1999, "short": "İzmit Quake", "title": "The 1999 İzmit earthquake", "region": "mideast", "line": "Over 17,000 died; anger at shoddy buildings and a disorganized state response helped sweep the ruling coalition from power in 2002."}, {"year": 2008, "short": "Sichuan Quake", "title": "The 2008 Sichuan earthquake", "region": "china", "line": "Over 69,000 died, including thousands of pupils in poorly built “tofu-dreg” schools, and grieving parents who demanded answers faced police pressure."}], "opp": {"lastTime": "Rebuilding Lisbon put military engineers like Manuel da Maia and Eugénio dos Santos to work, using building parts made outside the city and quake-resistant “gaiola” frames. After Mexico City’s 1985 quake, a stricter 1987 building code raised demand for seismic design.", "ideas": [{"kind": "build", "title": "Seismic checks for older housing", "line": "Services that survey and strengthen older apartment blocks in quake zones, from Istanbul to Lisbon, could see steady demand as codes and insurers tighten.", "guide": {"what": "A service that inspects older apartment blocks in quake zones, rates how they might behave in a strong quake, and plans repairs that make them sturdier.", "why": "Lisbon’s 1755 rebuild and Mexico City’s 1987 code both raised demand for quake-safe design. Turkey’s 2023 quakes showed how older blocks can fail, and cities like Istanbul and Lisbon still hold much ageing housing.", "how": ["Ask a structural engineer how they quickly screen a building for quake weakness.", "Read FEMA P-154 to learn the basics of rapid visual screening.", "Ask local condo boards or housing associations whether their buildings have ever had a seismic survey."], "read": [{"title": "Eurocode 8: Design of structures for earthquake resistance (EU JRC)", "url": "https://eurocodes.jrc.ec.europa.eu/EN-Eurocodes/eurocode-8-design-structures-earthquake-resistance"}]}}, {"kind": "build", "title": "Open records of building approvals", "line": "Digital registries showing who designed, approved and inspected each building may be in demand where quake anger turns on builders and inspectors.", "guide": {"what": "A public online register showing, for each building, who designed it, who approved the plans and who inspected the work, so residents and buyers can check.", "why": "After Turkey’s 2023 quakes, anger turned on contractors, construction amnesties and weak inspection, and prosecutors investigated over 600 people. Open records could help show who signed off on what if a future quake raises the same questions.", "how": ["Check what building permit data your city already publishes online, and what is missing.", "Ask a local journalist or architect which building records are hardest to find.", "Read how CoST helps governments publish data on public construction projects."], "read": [{"title": "CoST, the Infrastructure Transparency Initiative", "url": "https://infrastructuretransparency.org/"}]}}, {"kind": "work", "title": "Independent building inspectors", "line": "Structural engineers, independent inspectors and retrofit crews tend to be needed after deadly quakes, as Turkey’s 2023 investigations into contractors showed.", "guide": {"what": "Engineers and inspectors who check that buildings are designed and built to code, working apart from the builders they check, plus crews who strengthen weak buildings.", "why": "Military engineers led Lisbon’s rebuild, and Mexico’s stricter 1987 code raised demand for seismic designers. Turkey’s 2023 probes into contractors suggest independent checking could again be in demand after a deadly quake.", "how": ["Ask a local engineering association what qualifications building inspectors need where you live.", "Follow the Earthquake Engineering Research Institute for field reports from recent quakes.", "Ask to shadow a site inspection or home survey to see what inspectors check."], "read": [{"title": "Earthquake Engineering Research Institute (EERI)", "url": "https://www.eeri.org/"}]}}, {"kind": "learn", "title": "Retrofitting weak older buildings", "line": "How engineers assess and strengthen old masonry and soft-storey buildings, using standards such as Eurocode 8, is a skill quake-prone cities may need.", "guide": {"what": "The engineering of making old buildings safer in quakes: finding weak points like unreinforced brick walls or open ground floors, then adding steel, concrete or ties.", "why": "Lisbon was rebuilt with quake-resistant gaiola timber frames, and Mexico’s 1987 code pushed seismic design forward. Much city housing today predates modern codes, so retrofit skills could matter wherever the next big quake strikes.", "how": ["Read FEMA P-774 on why unreinforced masonry fails and how cities reduce the risk.", "Learn the ideas behind Eurocode 8 Part 3, which covers assessing and retrofitting buildings.", "Walk your neighbourhood and note buildings with open ground floors, such as shops or parking."], "read": [{"title": "Eurocode 8: Design of structures for earthquake resistance (EU JRC)", "url": "https://eurocodes.jrc.ec.europa.eu/EN-Eurocodes/eurocode-8-design-structures-earthquake-resistance"}]}}], "watch": "Watch whether quake-prone cities like Istanbul fund retrofits of older housing, and whether insurers start pricing quake risk building by building."}}, {"id": "revolution", "theme": "Food prices and a closed elite spark revolt", "rhyme": 2, "then": {"year": 1789, "short": "Bastille Falls", "title": "The Storming of the Bastille", "where": "Paris, France", "region": "europe", "hook": "On 14 July 1789, Parisians stormed a royal fortress-prison, and France still celebrates it.", "text": "With the crown nearly bankrupt and bread near record prices, the Estates-General met in May 1789 for the first time since 1614. On 14 July, Parisians hunting for gunpowder stormed the Bastille, which held just seven prisoners. They killed its governor and paraded his head on a pike."}, "now": {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring", "where": "Tunisia, Egypt and beyond", "region": "mideast", "hook": "Early 2011: crowds packing Cairo’s Tahrir Square and cheering when Mubarak stepped down.", "text": "After a Tunisian fruit seller set himself on fire in December 2010, protests over food prices, jobs and corruption swept the region. Tunisia’s Ben Ali fled on 14 January 2011 and Egypt’s Mubarak resigned on 11 February. Uprisings followed in Libya, Yemen, Syria and Bahrain."}, "followed": "The revolution turned radical: the king was executed in 1793 and the Terror followed. In 1799 Napoleon Bonaparte seized power in a coup.", "next": {"short": "Hunger Revolt", "title": "Price shocks topple a closed regime", "text": "Around 2233, a sudden jump in food or energy prices, perhaps after failed harvests, might hit a country run by a narrow elite. Protests could spread across a whole region within weeks.", "watch": "Watch staple food prices, youth unemployment, state debt and how tightly a ruling circle guards its privileges."}, "breaks": "The French Revolution remade a great power and spread its ideas across Europe, while most Arab Spring uprisings ended in civil war or renewed authoritarian rule.", "topic": "society", "echoes": [{"year": 184, "short": "Yellow Turbans", "title": "China’s Yellow Turban Rebellion", "region": "china", "line": "After floods and poor harvests, peasants rose against a Han court run by corrupt eunuchs, and the revolt fatally weakened the dynasty."}, {"year": 875, "short": "Huang Chao", "title": "Huang Chao’s revolt shakes the Tang", "region": "china", "line": "After drought, famine and higher taxes, failed exam candidate Huang Chao led a revolt that took Chang’an; the Tang never recovered."}, {"year": 1351, "short": "Red Turbans", "title": "The Red Turbans rise against the Yuan", "region": "china", "line": "After Yellow River floods and famine, drafted dike workers joined the Red Turbans against Mongol rule, which collapsed in 1368."}, {"year": 1378, "short": "Ciompi Revolt", "title": "The Ciompi revolt seizes Florence", "region": "europe", "line": "Florence’s wool workers, barred from the guilds that ran the city and crushed by taxes, seized the government for six weeks."}, {"year": 1644, "short": "Ming Falls", "title": "Peasant rebels topple the Ming dynasty", "region": "china", "line": "After years of famine and a court mired in factions, Li Zicheng’s rebels took Beijing, and the last Ming emperor hanged himself."}, {"year": 1848, "short": "Europe’s 1848", "title": "Europe’s revolutions of 1848", "region": "europe", "line": "After blight and failed harvests sent food prices soaring, Paris toppled a monarchy where under 1% could vote, and revolt swept Europe."}, {"year": 1917, "short": "Tsar Falls", "title": "Russia’s February Revolution", "region": "russia", "line": "Bread protests by Petrograd women grew into strikes and army mutinies, and within a week Tsar Nicholas II abdicated."}, {"year": 1998, "short": "Suharto Falls", "title": "Indonesia’s 1998 revolt topples Suharto", "region": "world", "line": "As the Asian financial crisis sent food and fuel prices soaring, protests and riots ended Suharto’s 32-year rule, criticised for cronyism."}, {"year": 2022, "short": "Rajapaksas Fall", "title": "Sri Lanka’s protests oust the Rajapaksas", "region": "india", "line": "With food and fuel scarce and inflation over 50%, protesters stormed the president’s house, ending the Rajapaksa family’s hold on power."}], "opp": {"lastTime": "After 1789, over 1,300 new newspapers appeared in France within a decade, and buyers of confiscated church lands, mostly townsmen and better-off peasants, gained property. After 2011, Tunisia’s civil society grew, and four of its groups won the 2015 Nobel Peace Prize.", "ideas": [{"kind": "build", "title": "Food price early-warning tools", "line": "Dashboards that track bread, rice and fuel prices against local wages could help aid groups and cities target food support before shortages bite.", "guide": {"what": "Dashboards that track local prices of staples like bread, rice and fuel, compare them with wages, and warn aid groups or city officials when food is becoming unaffordable.", "why": "Bread near record prices helped spark 1789, and food prices fed the 2011 Arab Spring. Climate shocks and currency falls could cause new spikes, and earlier warnings may help target support before shortages bite.", "how": ["Explore FAO’s free food price tool to see which markets and staples it tracks.", "Ask a local aid group or food bank how they spot rising prices today.", "Build a simple prototype comparing one city’s bread price with its minimum wage."], "read": [{"title": "FAO Food Price Monitoring and Analysis (FPMA) Tool", "url": "https://www.fao.org/giews/food-prices/price-tool/en/"}, {"title": "WFP HungerMap LIVE", "url": "https://hungermap.wfp.org/"}]}}, {"kind": "build", "title": "Independent local news", "line": "When closed regimes open up, independent local news and fact-checking tend to be in demand, as the 1,300 new French papers after 1789 showed.", "guide": {"what": "Small newsrooms that report on one town or region, often online, and check claims by officials and on social media, funded by readers, grants or local ads.", "why": "After 1789, over 1,300 new newspapers appeared in France within a decade, and Tunisia’s civil society grew after 2011. If a closed regime opens up again, demand for trusted local news and fact-checking could rise quickly.", "how": ["Read the IFCN Code of Principles to see what standards fact-checkers commit to.", "Ask a local reporter which stories go uncovered in your area.", "Start a free newsletter on one local topic, such as council budgets or food prices."], "read": [{"title": "IFCN Code of Principles (International Fact-Checking Network)", "url": "https://ifcncodeofprinciples.poynter.org/"}, {"title": "Reuters Institute Digital News Report 2025", "url": "https://reutersinstitute.politics.ox.ac.uk/digital-news-report/2025"}]}}, {"kind": "work", "title": "Food security analysts", "line": "Roles tracking grain stocks, import bills and subsidy costs in governments, aid agencies and food importers may grow as climate shocks hit crops.", "guide": {"what": "Analysts who track harvests, grain stocks, import costs and food prices to judge who may go hungry, working for governments, UN agencies, charities or food importers.", "why": "Dear bread helped spark revolt in 1789 and again in 2011. Climate shocks to harvests and costly wheat imports may make careful tracking of food supplies more valuable to governments and aid agencies.", "how": ["Take a free FAO elearning course on food security analysis or market monitoring.", "Learn how the IPC scale classifies hunger, from stress to famine.", "Ask an analyst at a UN agency or charity which data they check every week."], "read": [{"title": "FAO elearning Academy (free courses)", "url": "https://elearning.fao.org/"}]}}, {"kind": "learn", "title": "How subsidies and currencies interact", "line": "Understanding how bread subsidies, currency falls and wheat import bills interact, as in Egypt and Lebanon, shows where the next price shock may bite.", "guide": {"what": "How a country’s currency, its food import bills and its bread or fuel subsidies affect each other, and why a weaker currency can quickly raise food prices and subsidy costs.", "why": "A nearly bankrupt crown and dear bread set the stage in 1789. In Egypt and Lebanon, currency falls and subsidy cuts have recently pushed up food prices, so these links may show where the next shock could bite.", "how": ["Follow the FAO Food Price Index each month and note which foods drive changes.", "Read how Egypt’s bread subsidy works and why its price rose in 2024.", "Compare one importer’s exchange rate with its local bread price over five years."], "read": [{"title": "FAO Food Price Index", "url": "https://www.fao.org/worldfoodsituation/foodpricesindex/en/"}, {"title": "Food Security Portal (IFPRI)", "url": "https://www.foodsecurityportal.org/"}]}}], "watch": "Watch the FAO Food Price Index, the wheat import bills of large importers like Egypt, and sudden cuts to bread or fuel subsidies."}}, {"id": "hamilton", "theme": "A union starts sharing its debts", "rhyme": 2, "then": {"year": 1790, "short": "Hamilton Plan", "title": "Hamilton’s Plan to Assume State Debts", "where": "New York, United States", "region": "us", "hook": "The dinner deal from the musical Hamilton: state debts for a capital on the Potomac.", "text": "Treasury Secretary Alexander Hamilton proposed that the federal government take over the states’ war debts, up to $21.5 million in the final law. States that had paid down theirs, like Virginia, objected. At a June 1790 dinner hosted by Jefferson, Madison agreed not to block it in return for a capital on the Potomac."}, "now": {"year": 2020, "short": "EU Joint Debt", "title": "The EU’s NextGenerationEU Recovery Fund", "where": "Brussels, Belgium", "region": "europe", "hook": "July 2020: masked EU leaders haggling for days over a €750 billion pandemic fund.", "text": "In July 2020, EU leaders agreed on a €750 billion recovery fund, including €390 billion in grants, paid for by joint borrowing through the European Commission. German finance minister Olaf Scholz called the plan Europe’s “Hamiltonian moment”. The “frugal” Netherlands, Austria, Sweden and Denmark pushed back on grants."}, "followed": "Assumption gave the young US strong credit, and the fight over it helped create the first political parties. When eight states defaulted in the 1840s, Congress refused to take on their debts.", "next": {"short": "Shared Debt", "title": "A new union pools its debts", "text": "Around 2250, a looser union, perhaps in Africa or Latin America, or even a global climate body, might issue its first shared bonds after a crisis. Leaders could again trade debt deals for symbols of power.", "watch": "Watch for crises that push members of a union to borrow together, and for “one-off” joint funds that quietly become permanent."}, "breaks": "The US took on states’ old debts for good, while NextGenerationEU borrowed new money as an officially one-off fund, and the EU still lacks a federal treasury.", "topic": "money", "echoes": [{"year": 1707, "short": "The Equivalent", "title": "Scotland shares England’s debt at Union", "region": "europe", "line": "Under the 1707 Union, Scotland took on part of England’s much larger national debt, compensated by a lump sum called the Equivalent."}, {"year": 1798, "short": "Batavian Debts", "title": "The Dutch provinces merge their debts", "region": "europe", "line": "The Batavian Republic’s 1798 constitution declared the debts of the old Dutch provinces, mostly Holland’s, national debts of the whole Batavian people."}, {"year": 1815, "short": "Belgian Burden", "title": "Belgium shares the Dutch national debt", "region": "europe", "line": "In the new Kingdom of the Netherlands, Belgians shared a large Dutch debt they had not run up, a lasting grievance."}, {"year": 1861, "short": "Italy’s Ledger", "title": "United Italy merges its states’ debts", "region": "europe", "line": "The new Kingdom of Italy gathered the debts of the old states it absorbed into a single national ledger, the Gran Libro."}, {"year": 1867, "short": "Canada Unites", "title": "Canadian Confederation takes on provincial debts", "region": "world", "line": "At Confederation, the new Dominion of Canada took on the debts of its provinces, a key bargain in uniting them."}, {"year": 1927, "short": "Australia Debts", "title": "Australia’s Commonwealth takes over state debts", "region": "world", "line": "The 1927 Financial Agreement had the federal government take over state debts and created a Loan Council to manage all borrowing."}, {"year": 1990, "short": "German Unity", "title": "Reunified Germany absorbs East German debts", "region": "europe", "line": "At reunification, Bonn and the western states borrowed jointly for a unity fund, and federal funds later took over East German debts."}], "opp": {"lastTime": "Speculators who had bought soldiers’ and states’ IOUs cheaply profited. Congress chartered Hamilton’s Bank of the United States in 1791, and trading in the new federal bonds led to the 1792 Buttonwood Agreement, the root of the New York Stock Exchange.", "ideas": [{"kind": "build", "title": "Tools to track joint-fund milestones", "line": "Software that helps towns and firms apply for, track and report on milestone-based EU funds could stay in demand if joint borrowing becomes routine.", "guide": {"what": "Software that helps towns, regions and firms find EU funding, apply for it, and track and report the milestones and targets that must be met before money is paid.", "why": "Hamilton’s 1790 deal spawned new trades, from bond dealing to the roots of the New York Stock Exchange. NextGenerationEU ties payments to milestones, and if joint EU borrowing continues, managing such funds may stay a steady need.", "how": ["Explore the EU Recovery and Resilience Scoreboard to see how milestones are tracked.", "Ask a town or regional grants officer which reporting tasks take the most time.", "List the reporting steps that repeat across funds and could be automated."], "read": [{"title": "EU Recovery and Resilience Scoreboard: milestones and targets", "url": "https://ec.europa.eu/economy_finance/recovery-and-resilience-scoreboard/milestones_and_targets.html?lang=en"}, {"title": "EU Funding & Tenders Portal", "url": "https://ec.europa.eu/info/funding-tenders/opportunities/portal/screen/home"}]}}, {"kind": "build", "title": "Cross-border project partnerships", "line": "Services that match firms across member states for jointly funded EU projects, such as defence or grid links, may grow as shared funding expands.", "guide": {"what": "A service that matches companies, universities or towns in different EU countries so they can team up and bid together for jointly funded EU projects, such as defence or power links.", "why": "Hamilton’s plan tied the states together through shared finance. The EU now funds joint projects through NextGenerationEU and the 2025 SAFE defence loans, and many EU funds favour partners from several countries.", "how": ["Browse the Enterprise Europe Network’s partnering database to see how matches are made today.", "Read the European Defence Fund rules, which require partners from several countries.", "Ask small firms in your sector whether finding foreign partners stops them applying."], "read": [{"title": "Enterprise Europe Network", "url": "https://een.ec.europa.eu/"}, {"title": "European Defence Fund (European Commission)", "url": "https://defence-industry-space.ec.europa.eu/eu-defence-industry/european-defence-fund-edf-official-webpage-european-commission_en"}]}}, {"kind": "work", "title": "EU funds and public debt roles", "line": "Grant managers, auditors and debt specialists may be needed to run and check pooled EU spending, and to plan its repayment through 2058.", "guide": {"what": "Jobs that manage, audit or finance shared EU spending: grant managers, auditors who check money is well spent, and debt specialists who plan borrowing and repayment.", "why": "Hamilton’s plan made federal bonds tradable and a market grew around them. The EU borrowed for NextGenerationEU and must repay through 2058, so skills in running and checking pooled money may stay in demand.", "how": ["Read the Commission’s page on the EU as a borrower to see how its bonds work.", "Check EU Careers for current openings and how EPSO selection works.", "Ask someone in a national ministry who manages EU recovery funds about their work."], "read": [{"title": "The EU as a borrower: investor relations (European Commission)", "url": "https://commission.europa.eu/strategy-and-policy/eu-budget/eu-borrower-investor-relations_en"}, {"title": "EU Careers (EPSO)", "url": "https://eu-careers.europa.eu/index_en"}]}}, {"kind": "learn", "title": "Shared bonds and fiscal rules", "line": "Learning how joint bonds, credit ratings and EU fiscal rules work helps explain fights like the one between the “frugal” states and southern members.", "guide": {"what": "How groups of countries borrow together, how credit ratings judge that debt, and how EU rules limit national deficits and debts.", "why": "Hamilton’s takeover of state debts gave the young US strong credit but angered states that had already paid. EU joint borrowing sparked similar fights between “frugal” states and southern members, and a new union could face them again.", "how": ["Read the Commission’s guide to the EU economic governance rules reformed in 2024.", "Compare an EU bond’s yield with German and Italian bonds of similar length.", "Read a short history of Hamilton’s 1790 debt plan and the dinner deal."], "read": [{"title": "New EU economic governance framework (European Commission)", "url": "https://economy-finance.ec.europa.eu/economic-governance-framework/what-economic-governance-framework/evolution-eu-economic-governance/new-economic-governance-framework_en"}, {"title": "The EU as a borrower: investor relations (European Commission)", "url": "https://commission.europa.eu/strategy-and-policy/eu-budget/eu-borrower-investor-relations_en"}]}}], "watch": "Watch whether joint EU borrowing, like the 2025 SAFE defence loans, continues after NextGenerationEU ends in 2026, making shared debt a habit."}}, {"id": "vaccine", "theme": "A breakthrough vaccine meets fear and backlash", "rhyme": 3, "then": {"year": 1796, "short": "First Vaccine", "title": "Edward Jenner’s Smallpox Vaccine", "where": "Berkeley, England", "region": "europe", "hook": "A country doctor used cowpox to protect a boy from smallpox, giving us the word “vaccine”.", "text": "On 14 May 1796, Edward Jenner put cowpox from milkmaid Sarah Nelmes into scratches on eight-year-old James Phipps, who later resisted smallpox. In 1802 a James Gillray cartoon showed vaccinated people sprouting cows. After England made infant vaccination compulsory in 1853, anti-vaccination leagues formed."}, "now": {"year": 2020, "short": "mRNA Vaccines", "title": "The mRNA COVID-19 Vaccines", "where": "Worldwide", "region": "world", "hook": "Winter 2020–21: vaccine queues, sore arms, and heated family arguments about the jab.", "text": "Less than a year after the virus was identified, Britain approved the Pfizer-BioNTech vaccine on 2 December 2020, the first mRNA vaccine ever approved. Moderna’s followed weeks later. Billions of doses followed, and so did false claims about microchips and altered DNA and protests against mandates."}, "followed": "Vaccination spread worldwide despite resistance, and in 1898 Britain let parents opt out as “conscientious objectors”. Smallpox was declared eradicated in 1980.", "next": {"short": "Gene Shots", "title": "A gene-editing shot meets old fears", "text": "Around 2244, a new kind of shot might reprogram cells, perhaps editing genes or training immunity against cancer and old age. Its promise could meet fears of tampering with human nature, spreading faster than any cartoon.", "watch": "Watch trust in health agencies, how fast false health claims spread, and fights over mandates and opt-outs."}, "breaks": "Smallpox killed about three in ten people it infected, while COVID-19 was far milder for most people, which made the case for mandates more contested.", "older": "The Boston smallpox inoculation fight, 1721", "topic": "health", "echoes": [{"year": 1721, "short": "Boston Smallpox", "title": "Boston’s smallpox inoculation fight", "region": "us", "line": "Cotton Mather and Zabdiel Boylston promoted inoculation during an epidemic, and the backlash was fierce: someone threw a bomb into Mather’s house."}, {"year": 1763, "short": "Paris Ban", "title": "Paris bans smallpox inoculation", "region": "europe", "line": "Amid a smallpox outbreak some blamed on inoculation, the Paris Parlement banned the practice in the city until doctors and theologians ruled."}, {"year": 1774, "short": "Marblehead Riot", "title": "Marblehead burns its smallpox hospital", "region": "us", "line": "Fearing a new private inoculation hospital would spread smallpox and scare off ships, Marblehead townspeople sneaked onto its island and burned it."}, {"year": 1885, "short": "Leicester March", "title": "The Leicester anti-vaccination march", "region": "europe", "line": "Tens of thousands marched in Leicester against compulsory smallpox vaccination, led by men jailed for not vaccinating their children."}, {"year": 1904, "short": "Vaccine Revolt", "title": "Rio de Janeiro’s Vaccine Revolt", "region": "latam", "line": "A law making smallpox vaccination compulsory sparked a week of riots in Rio, leaving about 30 dead before the mandate was suspended."}, {"year": 1955, "short": "Polio Vaccine", "title": "Salk’s polio vaccine and the Cutter incident", "region": "us", "line": "Weeks after Jonas Salk’s polio vaccine was declared safe, faulty Cutter batches with live virus caused paralysis and ten deaths, shaking trust."}, {"year": 1998, "short": "MMR Scare", "title": "Wakefield’s MMR autism scare", "region": "europe", "line": "A Lancet paper by Andrew Wakefield, later retracted, linked the MMR vaccine to autism; UK vaccination rates fell and measles cases rose."}, {"year": 2003, "short": "Polio Boycott", "title": "Northern Nigeria’s polio vaccine boycott", "region": "africa", "line": "Kano and other northern Nigerian states halted polio vaccination amid rumors it caused infertility and HIV; polio cases surged and spread abroad."}], "opp": {"lastTime": "Vaccinators were in demand: Spain’s Balmis Expedition carried cowpox to the Americas, the Philippines and China from 1803, and Britain’s 1840 Vaccination Act made vaccination free. In 2021 the WHO set up an mRNA technology hub in Cape Town.", "ideas": [{"kind": "build", "title": "Regional vaccine manufacturing", "line": "Vaccine and mRNA production closer to home, like the WHO-backed hub in Cape Town, could grow as regions seek their own supply.", "guide": {"what": "Factories and labs that make vaccines near the people who use them, rather than importing them, including mRNA vaccines that can be adapted quickly to new diseases.", "why": "Jenner’s vaccine spread through efforts like Spain’s Balmis Expedition from 1803. During COVID-19, poorer regions waited longest for doses, and in 2021 the WHO set up an mRNA hub in Cape Town to help them make their own.", "how": ["Read about the WHO mRNA technology transfer programme and its partner countries.", "Learn what good manufacturing practice (GMP) requires for making medicines safely.", "Ask a pharmacist or biotech worker how vaccines reach your country today."], "read": [{"title": "WHO mRNA Technology Transfer Programme", "url": "https://www.who.int/initiatives/mrna-technology-transfer-(mrna-tt)-programme"}]}}, {"kind": "build", "title": "Plain-language vaccine answers", "line": "Services that answer vaccine questions in local languages, for clinics, schools and pharmacies, may be needed as false health claims spread online.", "guide": {"what": "A service that answers common vaccine questions in simple local languages, through chat, phone lines or printed guides, for clinics, schools and pharmacies.", "why": "Jenner’s vaccine met mocking cartoons and anti-vaccination leagues. COVID-19 vaccines met false claims about microchips and altered DNA. Clear local answers may help if a new kind of vaccine stirs similar fears.", "how": ["Read the free Debunking Handbook 2020 on how to correct false claims well.", "Ask a nurse or pharmacist which vaccine questions they hear most often.", "Draft clear answers to five common questions and test them with parents."], "read": [{"title": "The Debunking Handbook 2020 (free download)", "url": "https://skepticalscience.com/debunking-handbook-2020-downloads-translations.html"}, {"title": "Vaccine Safety Net (WHO-backed network of reliable vaccine sites)", "url": "https://www.vaccinesafetynet.org/"}]}}, {"kind": "work", "title": "Vaccine safety monitoring", "line": "Pharmacovigilance roles that track side effects, needed since the 1955 Cutter incident, tend to grow with each new type of vaccine.", "guide": {"what": "Pharmacovigilance: collecting and studying reports of possible side effects after medicines or vaccines are given, to spot real safety problems early and keep the public informed.", "why": "In 1955, faulty batches of Cutter polio vaccine caused cases of polio, which led to stronger oversight. Each new kind of vaccine, from mRNA to future gene-based shots, may need more people watching for rare side effects.", "how": ["Read the EMA’s overview of how pharmacovigilance works in the EU.", "Explore how WHO’s Uppsala Monitoring Centre gathers side-effect reports worldwide.", "Look for entry roles such as drug safety associate at drug firms or research contractors."], "read": [{"title": "Pharmacovigilance: Overview (European Medicines Agency)", "url": "https://www.ema.europa.eu/en/human-regulatory-overview/pharmacovigilance-overview"}, {"title": "Uppsala Monitoring Centre: What we do", "url": "https://who-umc.org/about-uppsala-monitoring-centre/what-we-do/"}]}}, {"kind": "learn", "title": "Explaining risk with real numbers", "line": "Explaining absolute versus relative risk, base rates and side-effect reports, such as the UK’s Yellow Card scheme, is a skill health debates keep needing.", "guide": {"what": "The skill of explaining health risks clearly: absolute versus relative risk, how common a condition is to begin with, and what side-effect reports can and cannot show.", "why": "Smallpox killed about three in ten people it infected, yet vaccination still met fear. With COVID-19, raw side-effect reports were often misread online. Clear numbers may help people weigh the next new vaccine.", "how": ["Read The Art of Statistics by David Spiegelhalter for plain explanations of risk.", "Browse the UK Yellow Card site to see how suspected side effects are reported.", "Practise turning “doubles the risk” into numbers per 10,000 people."], "read": [{"title": "Winton Centre for Risk and Evidence Communication (Cambridge)", "url": "https://wintoncentre.maths.cam.ac.uk/"}, {"title": "The Art of Statistics by David Spiegelhalter (Penguin)", "url": "https://www.penguin.co.uk/books/294857/the-art-of-statistics-by-spiegelhalter-david/9780241258750"}]}}], "watch": "Watch approvals of personalised mRNA cancer vaccines, public funding for mRNA research, and childhood vaccination rates as a gauge of trust."}}, {"id": "luddites", "theme": "Workers fear machines will take their jobs", "rhyme": 3, "then": {"year": 1811, "short": "Luddites", "title": "The Luddite Machine-Breakers", "where": "Nottinghamshire, England", "region": "europe", "hook": "English textile workers smashed machines taking their jobs and gave us the word “Luddite”.", "text": "From March 1811, stocking knitters near Nottingham, signing letters as “General Ludd”, smashed the frames of employers who cut pay and used cheaper, less-skilled labour. The revolt spread to Yorkshire and Lancashire. Parliament made machine-breaking a capital crime in 1812, and about 12,000 troops were deployed."}, "now": {"year": 2023, "short": "AI Anxiety", "title": "AI Anxiety and the Writers’ Strike", "where": "Hollywood, United States", "region": "us", "hook": "2023: ChatGPT writing office emails, and Hollywood writers on picket lines over AI.", "text": "Months after ChatGPT’s launch, generative AI spread into offices. Hollywood writers struck for 148 days from May 2023 and won rules that AI cannot count as a writer and studios cannot make writers use it. Actors struck too, partly over digital replicas."}, "followed": "Troops, hangings and mass trials at York in 1813 crushed the movement within a few years. Mechanised mills spread, and hand weavers’ earnings collapsed, though average wages rose decades later.", "next": {"short": "Human-Made", "title": "Workers bargain over what stays human", "text": "Around 2235, a new wave of machines, perhaps robots with general skills, might reach work once thought safe, like care or teaching. Workers could strike or push for laws and labels that keep some tasks human.", "watch": "Watch contract clauses that limit automation, how fast humanoid robots get cheaper, and whether productivity gains reach wages."}, "breaks": "The Luddites faced soldiers and the gallows and lost, while the 2023 writers bargained within the law and won limits on AI in their contract.", "topic": "tech", "echoes": [{"year": 1675, "short": "Weavers’ Riot", "title": "London weavers riot against engine looms", "region": "europe", "line": "London silk weavers rioted for days, smashing and burning the engine looms they feared would undercut their pay and jobs."}, {"year": 1826, "short": "Power-Loom Riots", "title": "Lancashire’s power-loom riots", "region": "europe", "line": "Handloom weavers, impoverished by factory looms, smashed over 1,000 power looms across east Lancashire; troops shot six rioters dead."}, {"year": 1830, "short": "Swing Riots", "title": "The Swing Riots", "region": "europe", "line": "Farm labourers across southern England smashed threshing machines that took their winter work, sending threats signed “Captain Swing”; 19 were hanged."}, {"year": 1986, "short": "Wapping Dispute", "title": "The Wapping print dispute", "region": "europe", "line": "Rupert Murdoch’s papers moved to a computerised plant at Wapping; about 6,000 print workers struck, were dismissed, and lost after a year."}, {"year": 2024, "short": "Port Strike", "title": "US dockworkers strike over automation", "region": "us", "line": "About 45,000 dockworkers shut 36 East and Gulf Coast ports for three days, demanding higher pay and a full ban on automation."}], "opp": {"lastTime": "Machine builders gained: Manchester’s Richard Roberts improved the power loom and built a self-acting spinning mule, and mechanics’ institutes opened in Edinburgh, Glasgow and London in the early 1820s to teach workers mechanical skills.", "ideas": [{"kind": "build", "title": "Labels for human-made work", "line": "Tools that verify and label human-made writing, art and voice work, using standards like C2PA content credentials, could grow as AI content spreads.", "guide": {"what": "Tools that record and show where a piece of writing, art, photo or voice recording came from, and whether a person or an AI made it, using shared standards like C2PA.", "why": "The Luddites lost, and machine-made cloth replaced much hand work. As AI content spreads, writers, artists and voice actors may want proof of human work, and laws like the EU AI Act add labelling duties for some AI content.", "how": ["Read the C2PA overview to learn how content credentials attach a history to a file.", "Inspect an image with a free Content Credentials checker to see what it records.", "Ask illustrators or voice actors what proof of human work would help them sell."], "read": [{"title": "C2PA: Coalition for Content Provenance and Authenticity", "url": "https://c2pa.org/"}, {"title": "Content Authenticity Initiative", "url": "https://contentauthenticity.org/"}]}}, {"kind": "work", "title": "People who check AI output", "line": "Like the mechanics who kept looms running, people who check, correct and supervise AI output in law, medicine and media may be in demand.", "guide": {"what": "People who review, correct and sign off on work drafted by AI tools, such as legal briefs, medical notes or news copy, catching errors before they cause harm.", "why": "As mills spread after the Luddites, mechanics who kept machines running were in demand. AI tools now draft text in law, medicine and media but still make confident mistakes, so skilled human review may grow in value.", "how": ["Read NIST’s AI Risk Management Framework, which covers human oversight of AI systems.", "Use an AI tool on a task you know well and log every error.", "Ask a manager in your field how AI drafts are checked before they go out."], "read": [{"title": "NIST AI Risk Management Framework", "url": "https://www.nist.gov/itl/ai-risk-management-framework"}]}}, {"kind": "work", "title": "Negotiators of automation clauses", "line": "Union staff, lawyers and HR specialists who write AI clauses into contracts, as Hollywood writers won in 2023, may be needed across more industries.", "guide": {"what": "Union officials, labour lawyers and HR staff who write and bargain over contract rules on how employers may use AI and automation, and what workers get in return.", "why": "The Luddites had no legal way to bargain and were crushed by troops and courts. In 2023, Hollywood writers won AI limits in their contract after a 148-day strike, and similar clauses may spread to other industries.", "how": ["Read the WGA’s summary of the AI terms in its 2023 contract.", "Ask a union representative in your sector how AI may feature in upcoming negotiations.", "Take a short course on collective bargaining or labour law."], "read": [{"title": "WGA: Artificial Intelligence terms in the 2023 contract", "url": "https://www.wga.org/contracts/know-your-rights/artificial-intelligence"}, {"title": "ILO: Generative AI and Jobs, a refined global index of occupational exposure", "url": "https://www.ilo.org/publications/generative-ai-and-jobs-refined-global-index-occupational-exposure"}]}}, {"kind": "learn", "title": "Spotting AI errors in your field", "line": "Deep knowledge of one trade, plus the ability to judge where AI tools fail in it, tends to hold value as routine tasks automate.", "guide": {"what": "Combining deep knowledge of one trade with a clear sense of where AI tools tend to fail in it, such as made-up facts, outdated rules or missed context.", "why": "When mechanised mills spread, hand weavers’ earnings collapsed while skilled mechanics found work. As AI automates routine tasks, people who can judge its output in their own field may keep more of their value.", "how": ["Take the free Elements of AI course to understand how AI tools work.", "Test an AI tool on ten real tasks from your job and record its failures.", "Share your error log with colleagues and agree checks for common mistakes."], "read": [{"title": "Elements of AI (free online course)", "url": "https://www.elementsofai.com/"}]}}], "watch": "Watch whether AI clauses spread from Hollywood into other union contracts, and whether wages rise along with productivity in AI-heavy jobs."}}, {"id": "railway", "theme": "A new machine starts carrying the public", "rhyme": 2, "then": {"year": 1830, "short": "Liverpool Line", "title": "The Liverpool and Manchester Railway Opens", "where": "Liverpool and Manchester, England", "region": "europe", "hook": "The world’s first inter-city railway opened, and a locomotive ran over a leading politician.", "text": "The 31-mile line opened on 15 September 1830, with Prime Minister the Duke of Wellington aboard. At a stop, Liverpool MP William Huskisson stepped onto the track and was hit by the locomotive Rocket, dying that evening. Even so, the line carried over a million passengers in its first two years."}, "now": {"year": 2024, "short": "Robotaxis", "title": "Robotaxis Open to the Public", "where": "San Francisco and Wuhan", "region": "world", "hook": "2024: driverless cars ferrying riders around San Francisco, and a crowd setting one ablaze.", "text": "In June 2024 Waymo opened its driverless taxis to anyone in San Francisco. Rival Cruise had its California permit suspended after one of its cars dragged a pedestrian in 2023. In Wuhan, Baidu’s Apollo Go ran hundreds of robotaxis, worrying local taxi drivers."}, "followed": "Despite the death, passengers flocked to the line, and its success set off railway building across Britain and the world. By 1850 Britain had about 6,000 miles of railway.", "next": {"short": "Rocket Commute", "title": "Pilotless rockets carry everyday travellers", "text": "Around 2218, a new machine, perhaps a pilotless rocket crossing continents in under an hour, might open to ordinary travellers. Its first public trips could bring a famous accident, and fears that fade only once trips become routine.", "watch": "Watch how courts assign blame when self-driving machines crash, and whether public trust follows their safety records."}, "breaks": "The railway still had human drivers and created many new jobs, while robotaxis take the human out of the driving seat.", "topic": "tech", "echoes": [{"year": 1807, "short": "Fulton’s Steamer", "title": "Fulton’s steamboat starts passenger service", "region": "us", "line": "Robert Fulton’s steamboat began scheduled trips between New York and Albany, becoming the first steamboat service to make money."}, {"year": 1857, "short": "Otis Elevator", "title": "The first passenger elevator opens", "region": "us", "line": "Elisha Otis, whose safety brake eased fears of falling, installed the first passenger elevator in a New York store."}, {"year": 1863, "short": "The Underground", "title": "London opens the first underground railway", "region": "europe", "line": "Steam trains began carrying passengers through tunnels under London, and 38,000 people rode the Metropolitan Railway on its first day."}, {"year": 1914, "short": "Airboat Line", "title": "A flying boat starts scheduled airline service", "region": "us", "line": "The St. Petersburg–Tampa Airboat Line flew paying passengers across Tampa Bay; the first ticket, auctioned off, went to an ex-mayor for $400."}, {"year": 1952, "short": "Comet Jetliner", "title": "The first jet airliner enters service", "region": "europe", "line": "BOAC’s Comet began the first jet passenger flights, but two mid-air breakups in 1954, traced to metal fatigue, grounded the fleet."}, {"year": 1964, "short": "Bullet Train", "title": "Japan’s bullet train opens", "region": "world", "line": "The Tokaido Shinkansen opened between Tokyo and Osaka days before the Olympics, the first railway built to run regularly above 200 km/h."}], "opp": {"lastTime": "Railways created new trades: George Bradshaw’s printed timetables from 1839, Thomas Cook’s first rail excursion in 1841 and W. H. Smith’s station bookstalls from 1848, plus thousands of jobs for porters, signalmen and clerks.", "ideas": [{"kind": "build", "title": "Depots for driverless fleets", "line": "Charging, cleaning and repair depots for robotaxi fleets could be in demand as driverless rides expand to more cities.", "guide": {"what": "Sites where robotaxi fleets are charged, cleaned, inspected and repaired between trips, often run by service firms for the companies that own the cars.", "why": "Railways created trades around the line itself, from station bookstalls to timetables. As driverless rides spread from San Francisco and Wuhan to more cities, fleets may need local partners for charging, cleaning and repair.", "how": ["Check which companies hold driverless permits in California, the busiest robotaxi market so far.", "Ask a car-rental or taxi depot manager what turning a car around between trips involves.", "Find out whether any city near you is testing or licensing driverless rides."], "read": [{"title": "California DMV: Autonomous Vehicles permits", "url": "https://www.dmv.ca.gov/portal/vehicle-industry-services/autonomous-vehicles/"}]}}, {"kind": "build", "title": "Independent safety checks for robot cars", "line": "Independent testing and crash investigation for driverless vehicles, serving insurers, cities and regulators, may grow as public trust follows safety records.", "guide": {"what": "Independent testing and crash investigation for driverless vehicles, judging how safely they drive, for insurers, city governments and regulators rather than for the carmakers.", "why": "William Huskisson’s death on the opening day in 1830 did not stop the trains. Robotaxi trust has also swung on crashes, as when Cruise lost its California permit in 2023. Independent checks could help insurers and cities decide.", "how": ["Explore NHTSA’s public crash reports for automated driving systems.", "Read UL 4600, a free-to-read standard for judging the safety of autonomous products.", "Ask an insurer or claims adjuster how they assess self-driving risk today."], "read": [{"title": "NHTSA Standing General Order on Crash Reporting", "url": "https://www.nhtsa.gov/laws-regulations/standing-general-order-crash-reporting"}, {"title": "UL 4600 Edition 3 (UL Solutions; free digital version linked)", "url": "https://www.ul.com/news/ul-4600-edition-3-updates-incorporate-autonomous-trucking"}]}}, {"kind": "work", "title": "Remote assistants and fleet technicians", "line": "Remote operators who help stuck vehicles, sensor technicians and fleet mechanics may grow in number, offering paths for some displaced drivers.", "guide": {"what": "Remote operators who guide driverless cars that get stuck, technicians who calibrate cameras and sensors, and mechanics who keep robotaxi fleets on the road.", "why": "Railways brought thousands of jobs for porters, signalmen and clerks. Robotaxis remove the driver, but they still need people to help stuck cars remotely and keep sensors working, which could offer paths for some drivers.", "how": ["Search job ads for remote assistance or fleet technician roles at robotaxi firms.", "Take a basic course in electric vehicle maintenance and high-voltage safety.", "Learn how lidar, radar and cameras work, and how they are calibrated."]}}, {"kind": "learn", "title": "Safety cases for autonomous systems", "line": "Learning how safety cases are built for autonomous vehicles, under standards like ISO 21448 and UL 4600, is a niche likely to grow.", "guide": {"what": "A safety case is a structured, evidence-backed argument that a system such as a self-driving car is safe enough to use. Standards like ISO 21448 and UL 4600 guide how to build one.", "why": "Early railways learned safety the hard way, starting with Huskisson’s death in 1830. As robotaxis and other autonomous machines spread, regulators and insurers may ask for clear safety cases before allowing them on public roads.", "how": ["Read the free digital version of UL 4600 to see what a safety case must cover.", "Learn how functional safety (ISO 26262) differs from SOTIF (ISO 21448).", "Practise writing a short safety argument for a simple machine, like a robot lawnmower."], "read": [{"title": "UL 4600 Edition 3 (UL Solutions; free digital version linked)", "url": "https://www.ul.com/news/ul-4600-edition-3-updates-incorporate-autonomous-trucking"}, {"title": "ISO 21448:2022 Road vehicles: Safety of the intended functionality", "url": "https://www.iso.org/standard/77490.html"}]}}], "watch": "Watch how many cities license driverless rides without safety drivers, and whether insurers charge less to cover them than human-driven taxis."}}, {"id": "mania", "theme": "A building boom races ahead of profits", "rhyme": 2, "then": {"year": 1845, "short": "Railway Mania", "title": "Britain’s Railway Mania", "where": "Britain", "region": "europe", "hook": "Victorian Britons poured their savings into railway shares, until the bubble burst.", "text": "Cheap money and a hunt for returns sent railway shares soaring. In 1846 alone, Parliament authorised about 9,500 miles of new line. Middle-class savers, including the Brontë sisters, bought in, and George Hudson, the “Railway King”, became the face of the boom."}, "now": {"year": 2024, "short": "AI Build-Out", "title": "The AI Data-Centre Building Boom", "where": "United States and beyond", "region": "us", "hook": "2024: Nvidia briefly becoming the world’s most valuable company as tech giants built data centres.", "text": "In 2024 Microsoft, Alphabet, Amazon and Meta together spent over $200 billion on capital projects, much of it on AI data centres and chips. Microsoft signed a deal to restart a Three Mile Island reactor for power. A Sequoia partner called the gap between spending and revenue “AI’s $600 billion question”."}, "followed": "By 1849 railway shares had lost nearly two-thirds of their value, and Hudson was disgraced for fraud. Yet the lines that were built became the core of Britain’s rail network.", "next": {"short": "Orbital Rush", "title": "A rush to build in orbit", "text": "Around 2203, investors might pour fortunes into the next big infrastructure bet, perhaps power or computing in orbit, long before customers pay for it. A crash could ruin backers yet leave useful hardware behind.", "watch": "Watch for spending growing far faster than revenue, building funded by debt, and claims that “this time is different”."}, "breaks": "Railway Mania was fed by small investors in new companies, while most AI building in 2024 was paid for by tech giants with large existing profits.", "older": "Britain’s canal mania, 1793", "topic": "money", "echoes": [{"year": 1793, "short": "Canal Mania", "title": "Britain’s canal mania", "region": "europe", "line": "Investors piled into canal schemes, and Parliament approved dozens in a few years; some never paid a dividend or were never finished."}, {"year": 1841, "short": "State Defaults", "title": "US states default after a canal boom", "region": "us", "line": "US states borrowed for canals and railways, expecting tolls to repay the loans; after the 1837 panic, Indiana, Pennsylvania and others defaulted."}, {"year": 1873, "short": "Panic of 1873", "title": "America’s railroad boom ends in panic", "region": "us", "line": "After 33,000 miles of new track in five years, Jay Cooke’s bank failed with unsold Northern Pacific bonds, setting off a depression."}, {"year": 1931, "short": "Empty State", "title": "The Empire State Building opens mostly empty", "region": "us", "line": "Built in a late-1920s skyscraper race, the Empire State Building opened 75 percent empty and earned no profit until the 1950s."}, {"year": 2001, "short": "Telecom Bust", "title": "The fibre-optic telecom bust", "region": "us", "line": "Telecom firms borrowed to lay fibre-optic cable far beyond demand; when the bubble burst, much sat unused and Global Crossing went bankrupt."}, {"year": 2008, "short": "Spain’s Bust", "title": "Spain’s building boom goes bust", "region": "europe", "line": "Spain’s construction boom crashed, leaving empty flats and ghost airports like Ciudad Real, built for €1.1 billion and sold for €10,000."}, {"year": 2021, "short": "Evergrande", "title": "China’s property giant Evergrande defaults", "region": "china", "line": "China’s long building boom left developers with unsold flats and huge debts, and Evergrande, owing about $300 billion, defaulted."}], "opp": {"lastTime": "Contractors like Thomas Brassey and Samuel Morton Peto, and up to 250,000 navvies, were in demand. After the 2001 telecom bust, unused “dark fibre” sold cheaply and later carried the broadband and online video boom.", "ideas": [{"kind": "build", "title": "Reusing data-centre waste heat", "line": "Systems that pipe data-centre heat into homes, greenhouses or district heating may spread as power-hungry sites face local pushback.", "guide": {"what": "Systems that capture the heat servers give off and pipe it into nearby homes, offices, greenhouses or district heating networks instead of releasing it into the air.", "why": "Railway Mania left track that served Britain long after the crash. Data centres now draw more power each year, and EU rules push large sites to reuse waste heat where feasible, which may ease local pushback.", "how": ["Read how Stockholm Data Parks sells data-centre heat into the city’s heating network.", "Find out whether your town has a district heating network and who runs it.", "Ask a heating engineer how heat pumps can raise low-grade server heat for homes."], "read": [{"title": "Stockholm Data Parks", "url": "https://stockholmdataparks.com/"}, {"title": "EU Energy Efficiency Directive (European Commission)", "url": "https://energy.ec.europa.eu/topics/energy-efficiency/energy-efficiency-targets-directive-and-rules/energy-efficiency-directive_en"}]}}, {"kind": "build", "title": "Second-hand computing capacity", "line": "If the build-out overshoots, services that rent surplus chips and server space cheaply to universities and small firms could grow, like post-2001 dark fibre.", "guide": {"what": "A service that buys or rents spare chips and server space, often older or idle hardware, and offers it cheaply to universities, researchers and small firms.", "why": "After the 2001 telecom bust, unused dark fibre sold cheaply and later carried the online video boom. If AI data-centre building overshoots demand, surplus computing could likewise become a cheap resource for new users.", "how": ["Read Sequoia’s essay AI’s $600B Question on the gap between spending and revenue.", "Ask university researchers what computing they need and what they pay now.", "Price a few used AI chips and servers on resale marketplaces to gauge supply."], "read": [{"title": "AI’s $600B Question (Sequoia Capital)", "url": "https://sequoiacap.com/article/ais-600b-question/"}, {"title": "NAIRR Pilot (US National AI Research Resource)", "url": "https://nairrpilot.org/"}]}}, {"kind": "work", "title": "Electricians and grid engineers", "line": "Data centres need electricians, high-voltage engineers and cooling technicians, skills that stay useful even if the boom cools.", "guide": {"what": "Electricians, high-voltage engineers and cooling technicians who connect, power and cool large buildings such as data centres, and who build the grid links that feed them.", "why": "Railway Mania needed contractors and up to 250,000 navvies, and the lines outlived the crash. The IEA projects data-centre electricity use could roughly double by 2030, and grid skills stay useful even if the boom cools.", "how": ["Ask a local electrical contractor or technical college about apprenticeships and entry routes.", "Read the IEA’s Energy and AI summary to see where power demand is growing.", "Visit an open day or trade fair for electrical and cooling trades."], "read": [{"title": "IEA Energy and AI: Executive summary", "url": "https://www.iea.org/reports/energy-and-ai/executive-summary"}, {"title": "Electricians: Occupational Outlook Handbook (US BLS)", "url": "https://www.bls.gov/ooh/construction-and-extraction/electricians.htm"}]}}, {"kind": "learn", "title": "Reading a boom’s numbers", "line": "Comparing capital spending with revenue, and spotting building funded by debt, helps judge whether an infrastructure boom is overreaching.", "guide": {"what": "Judging whether an investment boom is sound by comparing what is spent on building with the revenue it brings in, and checking how much is paid for with borrowed money.", "why": "Railway shares lost nearly two-thirds of their value by 1849. In 2024, tech giants spent over $200 billion on capital projects while AI revenue lagged, so these numbers may show whether today’s boom is overreaching.", "how": ["Read Boom and Bust by Quinn and Turner, which covers railway mania and later bubbles.", "Pull capital spending and revenue figures from a tech giant’s annual report.", "Track how much new data-centre building is paid for with bonds or loans."], "read": [{"title": "Boom and Bust: A Global History of Financial Bubbles (Cambridge)", "url": "https://www.cambridge.org/core/books/boom-and-bust/D09C2E3BEA798F6EDC9D3880FC0300ED"}, {"title": "AI’s $600B Question (Sequoia Capital)", "url": "https://sequoiacap.com/article/ais-600b-question/"}]}}], "watch": "Watch whether AI revenue catches up with data-centre spending, and how much new building is funded by debt instead of existing profits."}}, {"id": "springtime", "theme": "Uprisings leap across many countries at once", "rhyme": 2, "then": {"year": 1848, "short": "1848 Revolts", "title": "The Revolutions of 1848", "where": "Across Europe", "region": "europe", "hook": "The “Springtime of Peoples”: in weeks, revolt spread from Paris to Vienna, Berlin and Budapest.", "text": "Revolt broke out in Palermo in J
