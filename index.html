tan adopted a new constitution.", "china": "Deng Xiaoping returned from political disgrace as vice premier. In Japan, the oil shock set off panic buying of toilet paper and ended nearly two decades of rapid growth."}, "1975": {"us": "New York City neared bankruptcy, and Bill Gates and Paul Allen founded Microsoft. Apollo and Soyuz spacecraft docked in orbit, and “Jaws” became the first summer blockbuster.", "latam": "Suriname gained independence from the Netherlands in November. Military governments in South America secretly launched Operation Condor to hunt down opponents across borders.", "europe": "Francisco Franco died in November, and Juan Carlos became king of Spain. Portugal held its first free elections in nearly 50 years, and 35 nations signed the Helsinki Accords.", "russia": "Brezhnev signed the Helsinki Accords, gaining recognition of postwar borders in exchange for human rights pledges. Andrei Sakharov won the Nobel Peace Prize but was barred from collecting it.", "mideast": "Lebanon’s civil war began in April. Saudi King Faisal was assassinated by a nephew, and Egypt reopened the Suez Canal, closed since the 1967 war.", "africa": "Mozambique and Angola won independence from Portugal. Angola slid into civil war as Cuban troops and South African forces intervened on opposing sides.", "india": "Indira Gandhi declared a state of Emergency in June, suspending civil liberties and jailing opponents. In Bangladesh, founding leader Sheikh Mujibur Rahman was assassinated in August.", "china": "Chiang Kai-shek died in Taiwan in April. In Beijing, Zhou Enlai called for the “Four Modernizations”, while in Cambodia the Khmer Rouge seized Phnom Penh and emptied the cities."}, "1980": {"us": "Mount St. Helens erupted in May, and CNN launched as the first 24-hour news channel. Ronald Reagan won the presidency while American hostages were still held in Iran.", "latam": "Archbishop Óscar Romero was shot dead while saying Mass in El Salvador. About 125,000 Cubans left for Florida in the Mariel boatlift, and Peru’s Shining Path launched its insurgency.", "europe": "Strikes at Gdańsk’s shipyard gave birth to Solidarity, the Soviet bloc’s first independent trade union, led by Lech Wałęsa. Yugoslavia’s leader Josip Broz Tito died in May.", "russia": "Moscow hosted the Summer Olympics, boycotted by the US and dozens of other countries over the invasion of Afghanistan. Andrei Sakharov was exiled to the closed city of Gorky.", "mideast": "Iraq invaded Iran in September, starting an eight-year war. Turkey’s military seized power in a coup, and American diplomats remained hostages in Tehran.", "africa": "Zimbabwe became independent in April with Robert Mugabe as prime minister. In Liberia, Samuel Doe seized power in a coup and President William Tolbert was killed.", "india": "Indira Gandhi returned to power in January. Her son Sanjay died in a plane crash, and India put a satellite into orbit on its own rocket for the first time.", "china": "China made Shenzhen a special economic zone and put the Gang of Four on trial. South Korean troops crushed the Gwangju Uprising in May, and Japan released the arcade game Pac-Man."}, "1986": {"us": "Space shuttle Challenger broke apart 73 seconds after launch in January, killing all seven aboard. In November, the Iran-Contra affair revealed secret arms sales to Iran under President Reagan.", "latam": "Jean-Claude Duvalier fled Haiti in February, ending his family’s 29-year rule. Diego Maradona led Argentina to World Cup victory in Mexico, scoring the “Hand of God” goal.", "europe": "Spain and Portugal joined the European Community in January. Swedish Prime Minister Olof Palme was shot dead in Stockholm, and Chernobyl’s fallout reached much of Europe.", "russia": "Chernobyl’s reactor exploded in April. Mikhail Gorbachev began promoting glasnost, met Reagan at the Reykjavík summit and freed Andrei Sakharov from exile, and the Mir space station launched.", "mideast": "US warplanes bombed Libya in April after a Berlin disco bombing that Washington blamed on Gaddafi. In the Iran-Iraq War, Iran captured Iraq’s Faw Peninsula.", "africa": "South Africa declared a nationwide state of emergency, and the US Congress imposed sanctions over Reagan’s veto. Yoweri Museveni took power in Uganda, and Wole Soyinka won the Nobel Prize in Literature.", "india": "Rajiv Gandhi’s government passed a law reversing the Shah Bano maintenance ruling, and a court ordered the disputed Babri Masjid unlocked. Benazir Bhutto returned to Pakistan to large crowds.", "china": "Student protests for political reform spread from Hefei to Shanghai in December. Japan’s asset bubble began to inflate, and People Power protests drove Ferdinand Marcos from the Philippines."}, "1989": {"us": "George H.W. Bush became president in January. The Exxon Valdez spilled oil into Alaska’s Prince William Sound, and an earthquake hit the San Francisco Bay Area during the World Series.", "latam": "Riots over price hikes shook Caracas, and Paraguay’s Alfredo Stroessner was overthrown after over three decades. Chile elected its first civilian president since 1973, and US troops invaded Panama to remove Noriega.", "europe": "Poland held partly free elections in June, and the Berlin Wall opened on 9 November. Communist rule collapsed across Eastern Europe, and Romania’s Ceaușescu was executed on Christmas Day.", "russia": "The last Soviet troops left Afghanistan, and partly free elections produced a televised parliament of fierce debate. About two million people formed a human chain across the Baltic republics.", "mideast": "Ayatollah Khomeini issued a fatwa against author Salman Rushdie in February and died in June. Lebanon’s factions signed the Taif Agreement, the framework for ending the civil war.", "africa": "F.W. de Klerk became South Africa’s president and freed Walter Sisulu and other ANC leaders. Namibia voted in UN-supervised elections, and Charles Taylor’s rebels invaded Liberia.", "india": "Rajiv Gandhi lost India’s election amid the Bofors arms scandal, and V.P. Singh became prime minister. An armed insurgency erupted in Kashmir.", "china": "Protests in Tiananmen Square ended in a military crackdown on 4 June. In Japan, Emperor Hirohito died in January, and the stock market bubble peaked on the year’s last trading day."}, "1994": {"us": "NAFTA took effect on 1 January, and millions watched O.J. Simpson’s slow-speed police chase. Republicans won both houses of Congress, taking the House for the first time in 40 years.", "latam": "Zapatista rebels rose up in Chiapas as NAFTA began, and Mexico’s peso collapsed in December. Brazil launched the real currency to tame inflation and won the World Cup.", "europe": "The Channel Tunnel opened between Britain and France, and the IRA declared a ceasefire. The siege of Sarajevo continued, and Norwegians voted against joining the European Union.", "russia": "Russia’s last troops left Germany, Estonia and Latvia, and the MMM pyramid scheme collapsed, costing millions of investors their savings. In December, Boris Yeltsin sent the army into Chechnya.", "mideast": "Yasser Arafat returned to Gaza under the Oslo Accords, and Jordan signed a peace treaty with Israel. Arafat, Yitzhak Rabin and Shimon Peres shared the Nobel Peace Prize.", "africa": "Nelson Mandela became South Africa’s first Black president after all-race elections in April. In Rwanda, about 800,000 people, mostly Tutsi, were killed in a genocide lasting about 100 days.", "india": "Plague broke out in Surat in September, sending hundreds of thousands fleeing the city. Indians Sushmita Sen and Aishwarya Rai won Miss Universe and Miss World as economic reforms opened the country.", "china": "North Korea’s founder Kim Il-sung died in July, and his son Kim Jong-il took over. China connected fully to the internet and began building the Three Gorges Dam."}, "1996": {"us": "Bill Clinton won re-election and signed a major welfare reform law. Atlanta hosted the Summer Olympics, marred by a bombing in Centennial Olympic Park.", "latam": "Guatemala signed peace accords in December, ending a 36-year civil war. In Lima, Túpac Amaru rebels seized the Japanese ambassador’s residence and took hundreds of hostages.", "europe": "Britain announced a likely link between mad cow disease and a fatal human brain illness, and the EU banned British beef exports. England hosted the Euro 96 football tournament.", "russia": "Boris Yeltsin won re-election in a July run-off against Communist Gennady Zyuganov, despite heart trouble. The Khasavyurt agreement ended the first war in Chechnya.", "mideast": "Benjamin Netanyahu won Israel’s first direct election for prime minister, and a truck bomb hit the Khobar Towers in Saudi Arabia. Qatar launched Al Jazeera in November.", "africa": "South Africa adopted its post-apartheid constitution and began Truth and Reconciliation hearings. In Zaire, Laurent Kabila’s rebels, backed by Rwanda, launched the First Congo War.", "india": "The Taliban captured Kabul. India’s Congress party lost power, Atal Bihari Vajpayee’s first government lasted 13 days, and Sri Lanka won the cricket World Cup.", "china": "China fired test missiles near Taiwan before its first direct presidential election, which Lee Teng-hui won. In Japan, Nintendo released the first Pokémon games."}, "1997": {"us": "Mars Pathfinder landed on Mars on 4 July and sent its small rover across the surface. Amazon went public, and “Titanic” opened in December on its way to becoming the top-grossing film.", "latam": "Peruvian commandos stormed the Japanese ambassador’s residence in April, ending a four-month hostage crisis. In Mexico, the ruling PRI lost its majority in the lower house for the first time.", "europe": "Tony Blair’s Labour Party won a landslide in Britain in May. Princess Diana died in a Paris car crash in August, and Scotland and Wales voted for devolved parliaments.", "russia": "Boris Yeltsin signed a peace treaty with Chechnya’s leaders and the NATO-Russia Founding Act, as NATO prepared to admit former Warsaw Pact states.", "mideast": "Reformist Mohammad Khatami won Iran’s presidential election in a landslide. In Egypt, militants killed 62 people, mostly foreign tourists, at Luxor’s Temple of Hatshepsut.", "africa": "Laurent Kabila’s forces took Kinshasa in May, ending Mobutu Sese Seko’s 32-year rule and renaming Zaire the Democratic Republic of the Congo. Ghana’s Kofi Annan became UN secretary-general.", "india": "India and Pakistan marked 50 years of independence. K.R. Narayanan became India’s first Dalit president, and Arundhati Roy won the Booker Prize for “The God of Small Things”.", "china": "Deng Xiaoping died in February, and Britain handed Hong Kong back to China on 1 July. The Asian financial crisis began in Thailand and forced South Korea to seek an IMF bailout."}, "1999": {"us": "The Senate acquitted President Clinton in his impeachment trial in February. Two students killed 13 people at Columbine High School, and protests disrupted the WTO meeting in Seattle.", "latam": "Hugo Chávez became Venezuela’s president, and floods and mudslides in Vargas state killed thousands in December. The United States handed the Panama Canal to Panama on 31 December.", "europe": "The euro launched on 1 January as an electronic currency in 11 countries. NATO bombed Yugoslavia for 78 days over Kosovo, and Poland, Hungary and the Czech Republic joined NATO.", "russia": "Apartment bombings, which officials blamed on Chechen militants, killed about 300 people, and Russia launched a second war in Chechnya. Boris Yeltsin resigned on 31 December, naming Vladimir Putin acting president.", "mideast": "Jordan’s King Hussein and Morocco’s King Hassan II died, and their sons took the thrones. An earthquake near İzmit, Turkey, killed about 17,000 people in August.", "africa": "Nigeria returned to civilian rule under Olusegun Obasanjo, and Thabo Mbeki succeeded Nelson Mandela in South Africa. Sierra Leone’s government and rebels signed the Lomé peace accord.", "india": "India and Pakistan fought the Kargil conflict in Kashmir’s mountains. General Pervez Musharraf seized power in Pakistan in October, and a super cyclone killed about 10,000 people in Orissa.", "china": "Portugal handed Macau to China in December, and Beijing banned the Falun Gong movement. An earthquake killed about 2,400 people in Taiwan, and a nuclear accident struck Tokaimura, Japan."}, "2000": {"us": "The presidential election came down to a Florida recount, halted by the Supreme Court in December, making George W. Bush the winner over Al Gore. The dot-com bubble burst.", "latam": "Vicente Fox won Mexico’s presidency, ending 71 years of rule by the PRI. In Peru, Alberto Fujimori fled to Japan amid a corruption scandal and resigned by fax.", "europe": "Mass protests in Belgrade toppled Slobodan Milošević in October. An Air France Concorde crashed near Paris in July, killing 113, and the new euro fell to record lows.", "russia": "Vladimir Putin won the presidential election in March. In August, the submarine Kursk sank in the Barents Sea with all 118 aboard, and Putin faced criticism for his slow response.", "mideast": "Israel withdrew from southern Lebanon, Camp David peace talks failed, and the Second Intifada began in September. Syria’s Hafez al-Assad died, and his son Bashar took power.", "africa": "Floods devastated Mozambique, where a baby was born in a tree above the water. Zimbabwe began seizing white-owned farms, and British troops intervened in Sierra Leone’s civil war.", "india": "India’s population passed one billion, and three new states were created: Chhattisgarh, Jharkhand and Uttaranchal, now Uttarakhand. Bill Clinton made the first US presidential visit in 22 years.", "china": "Kim Dae-jung met Kim Jong-il in Pyongyang at the first inter-Korean summit and won the Nobel Peace Prize. In Taiwan, Chen Shui-bian’s election ended five decades of Kuomintang rule."}, "2003": {"us": "The US led the invasion of Iraq in March. Space shuttle Columbia broke apart on re-entry in February, and Arnold Schwarzenegger was elected governor of California in a recall vote.", "latam": "Luiz Inácio Lula da Silva became Brazil’s president, and Néstor Kirchner took office in Argentina. Deadly protests over gas exports forced Bolivia’s president to resign in October.", "europe": "Millions marched against the Iraq war on 15 February. An August heatwave killed tens of thousands across Europe, about 15,000 in France alone, and Concorde made its last flights.", "russia": "Oil tycoon Mikhail Khodorkovsky, Russia’s richest man, was arrested in October. Putin’s United Russia party won December’s parliamentary elections, and St Petersburg celebrated its 300th anniversary.", "mideast": "US-led forces toppled Saddam Hussein in April and captured him in December. An earthquake destroyed Bam in Iran, killing about 26,000, and Libya agreed to abandon weapons of mass destruction.", "africa": "Fighting in Sudan’s Darfur escalated as government-backed militias attacked civilians. In Liberia, Charles Taylor stepped down and went into exile in Nigeria as rebels besieged Monrovia.", "india": "India and Pakistan agreed a ceasefire along the Line of Control in Kashmir in November. Twin car bombs killed more than 50 people in Mumbai in August.", "china": "SARS spread from southern China, killing about 800 people worldwide. Hu Jintao became China’s president, and Yang Liwei became the country’s first astronaut in space."}, "2007": {"us": "Steve Jobs unveiled the iPhone in January, and it went on sale in June. By spring, subprime mortgage lenders were going bankrupt, an early sign of the coming financial crisis.", "latam": "Cristina Fernández de Kirchner was elected president of Argentina, succeeding her husband Néstor. In December, Venezuelan voters narrowly rejected Hugo Chávez’s constitutional reform, his first defeat at the polls.", "europe": "Nicolas Sarkozy won France’s presidency, and Gordon Brown replaced Tony Blair as British prime minister. In September, savers queued outside Northern Rock in Britain’s first bank run in over a century.", "russia": "Vladimir Putin, barred from a third straight term, named Dmitry Medvedev as his preferred successor in December. Sochi won the 2014 Winter Olympics, and Boris Yeltsin died in April.", "mideast": "Hamas seized control of Gaza from rival Fatah in June, splitting Palestinian rule in two. In Iraq, the US sent more than 20,000 extra troops in a “surge” against sectarian violence.", "africa": "Kenya’s December election ended in disputed results and deadly unrest after Mwai Kibaki was declared the winner over Raila Odinga. Nigeria saw its first handover between elected civilian presidents.", "india": "Former Pakistani prime minister Benazir Bhutto was assassinated at a rally in December. India won cricket’s first T20 World Cup, and Pratibha Patil became its first woman president.", "china": "Xi Jinping joined the Communist Party’s top leadership in October as Beijing prepared for the Olympics. Japan’s Shinzo Abe resigned after a year, and South Korea elected Lee Myung-bak."}, "2008": {"us": "Lehman Brothers collapsed in September, turning a housing slump into a global financial crisis. In November, Barack Obama was elected the first Black president of the United States.", "latam": "Fidel Castro formally handed Cuba’s presidency to his brother Raúl in February. In July, Colombia’s army tricked FARC rebels into freeing Ingrid Betancourt and 14 other hostages without a shot fired.", "europe": "Kosovo declared independence from Serbia in February. In October, Iceland’s three biggest banks collapsed within a week, and governments across Europe rushed to rescue their lenders.", "russia": "Dmitry Medvedev became president, with Vladimir Putin as prime minister. In August, Russia fought a five-day war with Georgia, then recognized South Ossetia and Abkhazia as independent.", "mideast": "Iraq and the US agreed in November that American troops would leave by the end of 2011. On December 27, Israel launched a major offensive against Hamas in Gaza after rocket fire.", "africa": "After more than 1,000 deaths, Kenya’s rivals agreed to share power in February. Zimbabwe sank into crisis with a disputed election, runaway inflation and a cholera outbreak.", "india": "Ten gunmen attacked hotels, a train station and other sites in Mumbai in November, killing 166 people. Earlier, India launched its first Moon probe, and the Indian Premier League began.", "china": "A May earthquake in Sichuan killed nearly 70,000 people. In August, Beijing hosted the Summer Olympics, and China topped the gold medal table for the first time."}, "2011": {"us": "US Navy SEALs killed Osama bin Laden in May. Standard & Poor’s downgraded US government debt in August, and Occupy Wall Street protesters camped in lower Manhattan from September.", "latam": "Dilma Rousseff took office as Brazil’s first woman president. Chilean students held months of mass protests for free public education, and Hugo Chávez revealed he was being treated for cancer.", "europe": "The euro debt crisis pushed Portugal into a bailout and toppled leaders in Greece and Italy. In July, a far-right extremist killed 77 people in Norway, most at a youth camp.", "russia": "In September, Vladimir Putin announced he would return to the presidency, swapping jobs with Dmitry Medvedev. After December’s parliamentary election, tens of thousands protested in Moscow over alleged vote fraud.", "mideast": "The Arab Spring toppled Tunisia’s Ben Ali in January and Egypt’s Hosni Mubarak in February. Libya’s Muammar Gaddafi was killed in October, and Syria’s protests grew into an armed uprising.", "africa": "South Sudan became the world’s newest country on July 9. Famine struck parts of Somalia, and Ivory Coast’s Laurent Gbagbo was arrested after refusing to accept his election defeat.", "india": "India won the Cricket World Cup at home in April, and Anna Hazare’s hunger strikes against corruption drew huge crowds. In May, US forces killed Osama bin Laden in Abbottabad, Pakistan.", "china": "On March 11, a magnitude 9 earthquake and tsunami left about 18,000 dead or missing in Japan and caused meltdowns at Fukushima. North Korea’s Kim Jong-il died in December."}, "2014": {"us": "Protests erupted in Ferguson, Missouri, after a police officer shot dead Michael Brown, an unarmed Black teenager, in August. That summer, the Ice Bucket Challenge swept social media.", "latam": "Brazil hosted the World Cup and lost its semifinal 7-1 to Germany. In Mexico, 43 students from Ayotzinapa disappeared in September, and in December the US and Cuba agreed to restore ties.", "europe": "Ukraine’s president fled in February after months of protests in Kyiv, and war broke out in the east. In September, Scotland voted 55 to 45 percent to stay in the United Kingdom.", "russia": "Russia hosted the Winter Olympics in Sochi, then annexed Crimea from Ukraine in March. Western sanctions and falling oil prices sent the ruble crashing by December.", "mideast": "Islamic State seized Mosul in June and declared a caliphate across parts of Iraq and Syria. That summer, a 50-day war between Israel and Hamas killed over 2,200 Palestinians and 73 Israelis.", "africa": "Ebola spread through Guinea, Liberia and Sierra Leone in the worst outbreak on record. In Nigeria, Boko Haram kidnapped 276 schoolgirls from Chibok, sparking the #BringBackOurGirls campaign.", "india": "Narendra Modi led the BJP to a landslide election win in May. India’s Mangalyaan probe reached Mars orbit on its first attempt, and Malala Yousafzai shared the Nobel Peace Prize.", "china": "Pro-democracy protesters occupied Hong Kong streets for 79 days in the Umbrella Movement. In April, South Korea’s Sewol ferry sank, killing 304 people, most of them high school students."}, "2015": {"us": "In June, the Supreme Court ruled same-sex couples have the right to marry nationwide. That month, a gunman killed nine Black worshippers at a Charleston church, and Donald Trump launched his campaign.", "latam": "Zika virus spread across Brazil and was linked to a surge in babies born with small heads. Drug lord El Chapo escaped a Mexican prison through a mile-long tunnel in July.", "europe": "More than a million refugees and migrants reached Europe, many fleeing Syria’s war. Paris suffered the Charlie Hebdo attack in January and coordinated attacks that killed 130 people in November.", "russia": "Opposition politician Boris Nemtsov was shot dead near the Kremlin in February. In September, Russia began airstrikes in Syria in support of Bashar al-Assad’s government.", "mideast": "Iran agreed in July to limit its nuclear program in return for sanctions relief. In March, Saudi Arabia under new King Salman began leading airstrikes against Houthi rebels in Yemen.", "africa": "Muhammadu Buhari became the first opposition candidate to unseat a sitting president in Nigeria. In April, al-Shabaab gunmen killed 148 people at Garissa University College in Kenya.", "india": "A magnitude 7.8 earthquake struck Nepal in April, killing nearly 9,000 people. In India, Arvind Kejriwal’s young Aam Aadmi Party won 67 of 70 seats in Delhi’s election.", "china": "China’s stock market crashed in the summer, and in October Beijing announced the end of its one-child policy. In August, chemical explosions at Tianjin’s port killed 173 people."}, "2016": {"us": "Donald Trump won the presidency in November, beating Hillary Clinton in the Electoral College while losing the popular vote. In June, a gunman killed 49 people at the Pulse nightclub in Orlando.", "latam": "Rio de Janeiro hosted the Olympics, and Brazil’s Senate removed Dilma Rousseff in August. Colombia signed a peace deal with FARC rebels, and Fidel Castro died in November.", "europe": "Britain voted 52 to 48 percent in June to leave the European Union. Terror attacks hit Brussels, Nice and Berlin, and Portugal won the Euro 2016 football championship.", "russia": "The M function line(c, x1, y1, x2, y2) { c.beginPath(); c.moveTo(x1, y1); c.lineTo(x2, y2); c.stroke(); }

function draw(t) {
  const c = ctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, W, H);
  hits = [];
  const xt = X(TODAY);
  if (xt < W) {   // the years ahead, faintly tinted
    const a = Math.max(0, xt), g = c.createLinearGradient(0, 0, 0, BASE + 6);
    g.addColorStop(0, `rgba(${TC.next},0)`); g.addColorStop(1, `rgba(${TC.next},${TC.dark ? .08 : .07})`);

function drawYears(c) {
  const steps = [5, 10, 20, 25, 50, 100, 250, 500];
  const step = steps.find(s => s * cam.s >= 52) || 500;
  const y0 = yearAt(0), y1 = yearAt(W);
  c.font = FONT.mono(12); c.textAlign = "center";
  for (let y = Math.ceil(y0 / step) * step; y <= y1; y += step) {
    const x = Math.round(X(y)) + .5;
    c.strokeStyle = `rgba(${TC.muted},.4)`; line(c, x, BASE + 6, x, BASE + 10);
    if (trail && Math.abs(x - W / 2) < 52) continue;   // room for the travel counter
    c.fillStyle = `rgba(${TC.muted},.95)`; c.fillText(fmtY(y), x, BASE + 24);
  }
}
let lensX0 = 0, lensX1 = 0;
function drawToday(c, xt) {

  c.strokeStyle = `rgba(${TC.now},.55)`; c.lineWidth = 1; c.setLineDash([3, 4]);
  line(c, x, underLens ? LENS_Y + LENS_H + 4 : 18, x, BASE + 6);

  c.font = f; c.textAlign = "center"; c.fillStyle = `rgb(${TC.now})`;

}

function layoutDots() {

  const stacks = [];
  for (const v of vis) {
    const s = stacks[stacks.length - 1];

    else stacks.push({ items: [v], x0: v.x, xl: v.x });

    s.items.sort((a, b) => KS.indexOf(a.e.k) - KS.indexOf(b.e.k) || a.e.yx - b.e.yx);
    s.items.forEach((v, j) => { v.y = BASE - 2 - j * sp; v.stack = n; });

let focusDot = null;

function drawNeedle(c, t) {

  const nm0 = travelling ? "" : (k === "next" ? p.next.short : p[k].short);

function drawTrail(c, t) {
  if (!trail || reduce) return;
  const age = trail.done ? t - trail.done : 0;
  const a = trail.done ? clamp(1 - age / 1600, 0, 1) : 1;
  if (a <= 0) { if (trail.done) trail = null; return; }
  const xa = X(trail.a), xb = X(trail.b);
  const prog = trail.done ? 1 : clamp(Math.abs(cam.c - trail.a) / Math.max(.001, Math.abs(trail.b - trail.a)), 0, 1);
  const xe = xa + (xb - xa) * prog, top = LENS_Y + LENS_H + 10, yb = BASE - 2;
  const k1 = trail.k1, g = c.createLinearGradient(xa, 0, xb, 0);
  g.addColorStop(0, `rgba(${TC.ink},.15)`); g.addColorStop(1, `rgba(${TC[k1]},.9)`);
  c.save(); c.globalAlpha = a; c.strokeStyle = g; c.lineWidth = 2;

  const n = 40;
  for (let j = 0; j <= n; j++) {
    const u = j / n, x = xa + (xe - xa) * u;
    const v = (x - xa) / ((xb - xa) || 1);
    const y = yb - Math.sin(Math.PI * clamp(v, 0, 1)) * (yb - top);
    j ? c.lineTo(x, y) : c.moveTo(x, y);

  c.stroke(); c.restore();
}

const OVX = y => 12 + (y - YMIN) / (YMAX - YMIN) * (W - 24);
const yearAtOV = x => YMIN + (x - 12) / (W - 24) * (YMAX - YMIN);
function drawOverview(c) {

  for (const e of EV) { c.fillStyle = `rgba(${TC[e.k]},.45)`; c.fillRect(OVX(e.yx) - .5, y - 3, 1, 6); }
  const xt = OVX(TODAY);
  c.strokeStyle = `rgba(${TC.now},.9)`; c.lineWidth = 1.2; line(c, xt, y - 5, xt, y + 5);
  const a = OVX(yearAt(0)), b = OVX(yearAt(W)), w = Math.max(8, b - a);

const pointers = new Map();
let gest = null;
const local = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
cv.addEventListener("pointerdown", e => {
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  const p = local(e);
  pointers.set(e.pointerId, p);
  fly = null; inertia = null; hideHint();
  if (pointers.size === 1) {
    gest = p.y > OV - 12 ? { type: "ov", moved: 99 } : { type: "pan", x0: p.x, y0: p.y, lastX: p.x, lastT: performance.now(), v: 0, moved: 0 };
    if (gest.type === "ov") { cam.c = clamp(yearAtOV(p.x), YMIN, YMAX); userTouched = true; }
  } else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    gest = { type: "pinch", d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, s0: cam.s };
  }
});
cv.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId) || !gest) return;
  const p = local(e);
  pointers.set(e.pointerId, p);
  if (gest.type === "ov") { cam.c = clamp(yearAtOV(p.x), YMIN, YMAX); return; }
  if (gest.type === "pan") {
    const now = performance.now(), dx = p.x - gest.lastX, dt = Math.max(1, now - gest.lastT);
    gest.moved = Math.max(gest.moved, Math.hypot(p.x - gest.x0, p.y - gest.y0));
    if (gest.moved > 6) {
      cv.classList.add("dragging");
      cam.c -= dx / cam.s; clampCam(); userTouched = true;
      gest.v = .7 * gest.v + .3 * (-dx / cam.s / dt);
    }
    gest.lastX = p.x; gest.lastT = now;
  } else if (gest.type === "pinch" && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    cam.s = clamp(gest.s0 * Math.hypot(a.x - b.x, a.y - b.y) / gest.d0, sMin(), sMax()); userTouched = true;
  }
});
function endPointer(e, cancelled) {

  if (gest.type === "pan") {
    if (!cancelled && gest.moved <= 6) onTap(p.x, p.y);
    else if (performance.now() - gest.lastT < 90 && Math.abs(gest.v) > 0) inertia = { v: gest.v };
    else snap();

  } else if (gest.type === "ov") { gest = null; snap(); }
  else if (gest.type === "pinch") {
    if (pointers.size === 1) { const q = [...pointers.values()][0]; gest = { type: "pan", x0: q.x, y0: q.y, lastX: q.x, lastT: performance.now(), v: 0, moved: 99 }; }

let wheelT = null;
cv.addEventListener("wheel", e => {

function onTap(px, py) {

/* ---------- daily puzzle: find the echo ---------- */
const PZ_START = Date.UTC(2026, 9, 21);
const pzDay = (d = new Date()) => Math.floor((Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - PZ_START) / 864e5) + 1;

// A day's puzzle only uses rhymes added before that day, so new rhymes never change a puzzle someone is playing.
function pzPool(day) {
  const d = new Date(PZ_START + (day - 1) * 864e5).toISOString().slice(0, 10);
  return BY_ID.filter(i => !PAIRS[i].added || PAIRS[i].added < d);
}
function pzRounds(day) {

  const order = seeded(ids, 9001 + cycle * 7919);
  return order.slice(k * 3, k * 3 + 3).map((pi, j) => {
    const pool = seeded(ids.filter(i => i !== pi && PAIRS[i].now.short !== PAIRS[pi].now.short), day * 977 + j * 13);
    return { pi, opts: seeded([pi, ...pool.slice(0, 3)], day * 31 + j * 7) };

}

function pzState(day) { return store.get(pzKey(day), { answers: [] }); }
function pzStreak(day) {
  let s = 0;

}

}

}

}

function askChain(a) {

  });

}

function runDemo(root) {
  if (!root || root.dataset.on) return;
  root.dataset.on = "1";
  const tEl = root.querySelector(".demo-t"), body = root.querySelector(".demo-body"), btn = root.querySelector(".demo-btn"), dots = root.querySelectorAll(".dd i");
  const alive = () => root.isConnected;
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const reveal = () => { body.querySelectorAll(".cv-i, .cv-gap").forEach(x => x.classList.add("in")); const cv = body.querySelector(".cv"); if (cv) cv.classList.add("drawn"); };
  if (reduce) { tEl.textContent = DEMOS[0].q; body.innerHTML = askChain(DEMOS[0].a); reveal(); dots[0].classList.add("on"); return; }
  (async () => {
    for (let n = 0; alive(); n++) {
      const d = DEMOS[n % DEMOS.length];
      dots.forEach((x, i) => x.classList.toggle("on", i === n % DEMOS.length));
      body.innerHTML = ""; body.classList.remove("out"); tEl.textContent = "";
      await wait(n ? 250 : 500);
      for (const ch of d.q) { if (!alive()) return; tEl.textContent += ch; await wait(30 + Math.random() * 34); }
      await wait(380); btn.classList.add("press"); await wait(170); btn.classList.remove("press");
      body.innerHTML = `<div class="thinking"><p>Searching history for the pattern…</p><i></i><i></i><i></i></div>`;
      await wait(1500);
      if (!alive()) return;
      body.innerHTML = askChain(d.a);
      const cv = body.querySelector(".cv"); void cv.offsetWidth; cv.classList.add("drawn");
      for (const el of body.querySelectorAll(".cv-i, .cv-gap")) {
        if (!alive()) return;
        el.classList.add("in");
        await wait(el.classList.contains("cv-gap") ? 240 : el.classList.contains("next") ? 300 : 560);
      }
      await wait(3800);
      if (!alive()) return;
      body.classList.add("out");
      await wait(450);
    }
  })();
}

    [["then", p.then.year, p.then.short], ["now", p.now.year, p.now.short], ["next", "c. " + nextYear(p), p.next.short]].forEach(([kk, yr, name], j) => {
      if (pd[j] <= 0) return;
      inDot(c, xs[j], y, RGB[kk], 6, pd[j], 10);
      inText(c, String(yr), xs[j], y + 23, FONT.monoB(14), `rgba(${RGB[kk]},${pd[j].toFixed(3)})`, W);
      inText(c, name, xs[j], y + 41, FONT.then(14.5), `rgba(${INK},${(pd[j] * .85).toFixed(3)})`, W);
    });
  });
}

/* how to use it: a swipe through time, then the Then / Today / Next stepper */
function inHow(c, W, H, lt) {
  const y0 = Math.round(H * .4), span = 120;
  const cc = 1790 + (I_THEN - 1790) * iOut(c01((lt - .4) / 2.1));
  const X = y => W / 2 + (y - cc) * (W / span);
  c.strokeStyle = `rgba(${INK},.22)`; c.lineWidth = 1.5; c.beginPath(); c.moveTo(0, y0); c.lineTo(W, y0); c.stroke();
  for (let y = Math.ceil((cc - span / 2) / 10) * 10; y <= cc + span / 2; y += 10) {
    const x = X(y), big = y % 50 === 0;
    c.strokeStyle = `rgba(${INK},${big ? .35 : .15})`; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y0 - (big ? 5 : 3)); c.lineTo(x, y0 + (big ? 5 : 3)); c.stroke();
    if (big) inText(c, String(y), x, y0 + 22, FONT.mono(12), `rgba(${MUTED},.8)`);
  }
  // the focus line: whatever sits in the middle comes into focus
  c.strokeStyle = `rgba(${INK},.25)`; c.setLineDash([3, 4]); c.beginPath(); c.moveTo(W / 2, y0 - 46); c.lineTo(W / 2, y0 - 10); c.stroke(); c.setLineDash([]);
  let best = null;
  PAIRS.forEach(p => ["then", "now"].forEach(kk => {
    const x = X(p[kk].year); if (x < -10 || x > W + 10) return;
    const d = Math.abs(x - W / 2); if (!best || d < best.d) best = { d, x, p, kk };
    c.fillStyle = `rgba(${RGB[kk]},.75)`; c.beginPath(); c.arc(x, y0, 3.4, 0, 6.2832); c.fill();
  }));
  const settled = c01((lt - 2.4) / .5);
  if (best && best.d < 6 && settled > 0) {
    inDot(c, best.x, y0, RGB[best.kk], 7, settled);
    inText(c, `${best.p[best.kk].year} ${best.p[best.kk].short}`, best.x, y0 - 22, FONT.then(17), `rgba(${INK},${settled.toFixed(3)})`, W);
  }
  // a finger swiping left
  const fs = c01((lt - .3) / 1.05);
  if (fs > 0 && fs < 1) {
    const fx = W * (.78 - .56 * iEase(fs)), fa = Math.sin(fs * Math.PI);
    c.fillStyle = `rgba(${INK},${(.28 * fa).toFixed(3)})`; c.beginPath(); c.arc(fx, y0, 20, 0, 6.2832); c.fill();
    c.strokeStyle = `rgba(${INK},${(.6 * fa).toFixed(3)})`; c.lineWidth = 1.5; c.stroke();
  }
  // the stepper, tapped in turn
  const sy = Math.round(H * .76), pw = Math.min(W * .29, 170), ph = 52, cs = [W / 2 - pw - 10, W / 2, W / 2 + pw + 10];
  const show = c01((lt - 2.7) / .45);
  if (show <= 0) return;
  [["then", "Then", I_THEN], ["now", "Today", I_NOW], ["next", "Next", "c. " + I_NEXT]].forEach(([kk, lab, yr], j) => {
    const on = c01((lt - 3.15 - j * BEAT) / .3), x = cs[j] - pw / 2;
    c.save(); c.globalAlpha *= show;
    c.fillStyle = on > 0 ? `rgba(${RGB[kk]},${(.14 * on).toFixed(3)})` : `rgba(22,19,52,.8)`;
    c.strokeStyle = on > 0 ? `rgba(${RGB[kk]},${(.4 + .6 * on).toFixed(3)})` : `rgba(${INK},.18)`;
    c.lineWidth = 1.5; if (on > 0) { c.shadowColor = `rgba(${RGB[kk]},.5)`; c.shadowBlur = 18 * on; }
    c.beginPath(); c.roundRect ? c.roundRect(x, sy - ph / 2, pw, ph, 14) : c.rect(x, sy - ph / 2, pw, ph); c.fill(); c.stroke(); c.shadowBlur = 0;
    inText(c, lab.toUpperCase(), cs[j], sy - 4, FONT.monoB(12), `rgb(${RGB[kk]})`);
    inText(c, String(yr), cs[j], sy + 15, FONT.mono(15), `rgb(${INK})`);
    const tp = c01((lt - 3.1 - j * BEAT) / .5);
    if (tp > 0 && tp < 1) { c.strokeStyle = `rgba(${INK},${(.7 * (1 - tp)).toFixed(3)})`; c.lineWidth = 2; c.beginPath(); c.arc(cs[j], sy, 10 + 26 * tp, 0, 6.2832); c.stroke(); }
    c.restore();
  });
  [0, 1].forEach(j => {
    const p = c01((lt - 3.6 - j * BEAT) / .45); if (p <= 0) return;
    inText(c, "→", (cs[j] + cs[j + 1]) / 2, sy + 6, FONT.monoB(16), `rgba(${MUTED},${(p * show).toFixed(3)})`);
  });
}

/* your future: the echoes due in one lifetime */
function inYou(c, W, H, lt) {
  const y = Math.round(H * .52), x0 = W * .09, x1 = W * .91, X = yr => x0 + (yr - I_BY) / 90 * (x1 - x0);
  const grow = iOut(c01((lt - .2) / 1.3));
  const g = c.createLinearGradient(x0, 0, x1, 0);
  g.addColorStop(0, `rgba(${MUTED},.5)`); g.addColorStop(1, `rgba(${RGB.next},.9)`);
  c.strokeStyle = g; c.lineWidth = 3; c.lineCap = "round"; c.beginPath(); c.moveTo(x0, y); c.lineTo(x0 + (x1 - x0) * grow, y); c.stroke();
  inDot(c, x0, y, MUTED, 5, c01(lt / .3), 6);
  inText(c, `Born ${I_BY}`, x0, y + 26, FONT.mono(13), `rgba(${MUTED},${c01(lt / .4).toFixed(3)})`, W);
  if (grow >= 1) inText(c, "Age 90", x1, y + 26, FONT.mono(13), `rgba(${MUTED},${c01((lt - 1.5) / .4).toFixed(3)})`, W);
  const tx = X(NOWY), ta = c01((lt - .9) / .4);
  if (ta > 0) {
    c.strokeStyle = `rgba(${RGB.now},${ta.toFixed(3)})`; c.lineWidth = 2; c.beginPath(); c.moveTo(tx, y - 9); c.lineTo(tx, y + 9); c.stroke();
    inText(c, "Today", tx, y + 26, FONT.monoB(13), `rgba(${RGB.now},${ta.toFixed(3)})`, W);
  }
  // every echo due before age 90 pops in; a few get labels, alternating above and below the line
  const all = lifeEchoes(I_BY).map(e => ({ ...e, x: X(e.y) })), labels = [];
  all.forEach(e => { if (!labels.length || e.x - labels[labels.length - 1].x >= Math.max(70, W * .2)) labels.push(e); });
  let shown = 0;
  all.forEach((e, i) => {
    const p = c01((lt - 1.6 - i * .4 * BEAT) / .4); if (p <= 0) return;
    shown++;
    inDot(c, e.x, y, RGB.next, 5.5, p, 14);
  });
  labels.slice(0, 4).forEach((e, i) => {
    const p = c01((lt - 1.75 - all.indexOf(e) * .4 * BEAT) / .45); if (p <= 0) return;
    const up = i % 2 === 0, a = c01(p * 1.5).toFixed(3), p2 = PAIRS[e.pi];
    c.strokeStyle = `rgba(${RGB.next},${(.35 * p).toFixed(3)})`; c.lineWidth = 1;
    c.beginPath(); c.moveTo(e.x, up ? y - 9 : y + 9); c.lineTo(e.x, up ? y - 20 : y + 38); c.stroke();
    inText(c, p2.next.short, e.x, up ? y - 44 : y + 56, FONT.then(15), `rgba(${INK},${a})`, W);
    inText(c, `c. ${e.y} · age ${e.y - I_BY}`, e.x, up ? y - 26 : y + 74, FONT.mono(12), `rgba(${RGB.next},${a})`, W);
  });
  if (shown) inText(c, `${shown} rhyme${shown === 1 ? "" : "s"} due in one lifetime`, W / 2, Math.round(H * .2), FONT.monoB(18), `rgba(${RGB.next},${c01((lt - 1.6) / .4).toFixed(3)})`);
}

function inSize() {
  const r = inStage.getBoundingClientRect(), d = Math.min(3, window.devicePixelRatio || 1);
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (w !== intro.w || h !== intro.h || d !== intro.dpr) { intro.w = w; intro.h = h; intro.dpr = d; inCv.width = Math.round(w * d); inCv.height = Math.round(h * d); }
}
function inCaption(i) {
  const s = SCENES[i], cp = CAP[s.id];
  $("inCard").innerHTML = s.view === "card" ? CARDS[s.id].map((l, j) => `<p class="ic-l${!j && CARD_LEAD[s.id] ? " lead" : ""}">${l}</p>`).join("") : "";
  const k = $("inK"); k.className = "in-k " + (cp.kc || ""); k.textContent = cp.k;
  $("inT").innerHTML = cp.t; $("inL").textContent = cp.l;
  $("inAct").innerHTML = s.id !== "end" ? "" : intro.rec ? `<p class="in-url">pastforward.app</p>`
    : `<button type="button" class="primary" data-in="start">Start with ${I_THEN} →</button>
       <div class="in-row"><button type="button" class="secondary" data-in="future">See my future</button><button type="button" class="secondary" data-in="again">Watch again</button></div>`;
  $("inProg").innerHTML = SCENES.filter(x => x.id !== "end").map(() => "<i><b></b></i>").join("");
}
function renderIntro(t) {
  inSize();
  const W = intro.w, H = intro.h, i = sceneAt(t), s = SCENES[i];
  let lt = t - s.at;
  if (i !== intro.cur) { intro.cur = i; inCaption(i); }
  const end = s.dur === Infinity;
  if (reduce && !intro.rec && !end) lt = s.dur - .001;     // reduced motion: each scene appears in its finished state
  const tt = s.at + lt;
  const c = ic;
  c.setTransform(intro.dpr, 0, 0, intro.dpr, 0, 0);
  c.clearRect(0, 0, W, H);
  for (const st of iStars) {
    c.fillStyle = `rgba(232,226,255,${(.18 + .3 * (.5 + .5 * Math.sin(tt * st.v + st.p))).toFixed(3)})`;
    c.beginPath(); c.arc(st.x * W, st.y * H * .9, st.s, 0, 6.2832); c.fill();
  }
  const prev = SCENES[i - 1], next = SCENES[i + 1];
  const aIn = prev && prev.view === s.view ? 1 : c01(lt / .45);
  const aOut = end || !next || next.view === s.view ? 1 : c01((s.dur - lt) / .35);
  c.globalAlpha = aIn * aOut;
  if (s.view === "tl") inTimeline(c, W, H, tt);
  else if (s.view === "more") inRows(c, W, H, lt);
  else if (s.view === "echoes") inEchoes(c, W, H, lt);
  else if (s.view === "how") inHow(c, W, H, lt);
  else if (s.view === "card") inCardBg(c, W, H, lt);
  else inYou(c, W, H, lt);
  c.globalAlpha = 1;
  // caption: fade and rise in, fade out before the next scene
  const ca = (reduce && !intro.rec) ? 1 : c01(lt / .45) * (end ? 1 : c01((s.dur - lt) / .3));
  const cap = $("inCap"), cardEl = $("inCard"), isCard = s.view === "card";
  cap.style.opacity = isCard ? "0" : ca.toFixed(3);
  cardEl.style.opacity = isCard ? ((reduce && !intro.rec) ? 1 : c01((s.dur - lt) / .55)).toFixed(3) : "0";
  if (isCard) cardEl.querySelectorAll(".ic-l").forEach((el, j) => {
    const r = (reduce && !intro.rec) ? 1 : iOut(c01((lt - .7 - j * CARD_GAP) / 1.1));
    el.style.opacity = r.toFixed(3);
    el.style.transform = `translateY(${((1 - r) * 16).toFixed(1)}px) scale(${(1.03 - .03 * r).toFixed(4)})`;
    el.style.filter = r < 1 ? `blur(${((1 - r) * 7).toFixed(2)}px)` : "none";
  });
  cap.style.transform = `translateY(${((1 - iOut(c01(lt / .5))) * 12).toFixed(1)}px)`;
  const rh = $("inRhymes");
  if (rh) {
    const r = (reduce && !intro.rec) ? 1 : c01((lt - I_REVEAL) / .5);
    rh.style.display = "inline-block";
    rh.style.opacity = r.toFixed(3);
    rh.style.transform = `translateY(${((1 - iOut(r)) * 10).toFixed(1)}px)`;
  }
  $("inProg").querySelectorAll("b").forEach((b, j) => { b.style.width = (j < i ? 100 : j === i ? 100 * c01(lt / s.dur) : 0) + "%"; });
  $("inTap").style.visibility = end || intro.rec ? "hidden" : "visible";
  introEl.classList.toggle("rec", intro.rec);
  $("inSkip").style.visibility = end || intro.rec ? "hidden" : "visible";
}
function introLoop(now) {
  if (!intro.open) return;
  const dt = Math.min(.05, (now - intro.last) / 1000); intro.last = now;
  if (!document.hidden && !intro.rec) intro.t += dt;
  renderIntro(intro.t);
  intro.raf = requestAnimationFrame(introLoop);
}
function openIntro(rec) {
  if (intro.open) return;
  intro.open = true; intro.rec = !!rec; intro.t = 0; intro.cur = -1;
  introEl.style.transition = rec ? "none" : "";
  introEl.hidden = false; void introEl.offsetWidth; introEl.classList.add("open");
  document.documentElement.classList.add("lock");
  if (!rec) { intro.last = performance.now(); intro.raf = requestAnimationFrame(introLoop); $("inSkip").focus({ preventScroll: true }); }
}
function closeIntro(after) {
  if (!intro.open) return;
  intro.open = false; cancelAnimationFrame(intro.raf);
  store.set(INTRO_KEY, 1);
  introEl.classList.remove("open");
  setTimeout(() => { introEl.hidden = true; }, reduce ? 0 : 450);
  if (dwrap.hidden && pwWrap.hidden) document.documentElement.classList.remove("lock");
  if (after) after();
}
function introStep(d) {
  const i = sceneAt(intro.t), j = Math.max(0, Math.min(SCENES.length - 1, i + d));
  intro.t = d < 0 && intro.t - SCENES[i].at > 1 ? SCENES[i].at : SCENES[j].at;
}
introEl.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) { if (sceneAt(intro.t) < SCENES.length - 1) introStep(1); return; }
  if (b.id === "inSkip") return closeIntro(() => $("jump").focus({ preventScroll: true }));
  const a = b.dataset.in;
  if (a === "again") { intro.t = 0; intro.cur = -1; }
  else if (a === "future") closeIntro(() => setTimeout(openFuture, 250));
  else if (a === "start") closeIntro(() => {
    const fi = PAIRS.indexOf(IP);
    if (!focus || focus.pi !== fi || focus.k !== "then") travel(fi, "then");
    if (!reduce) $("jump").classList.add("pulse");
    $("jump").focus({ preventScroll: true });
  });
});
document.addEventListener("keydown", e => {
  if (!intro.open) return;
  if (e.key === "Escape") { e.stopImmediatePropagation(); closeIntro(); }
  else if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); introStep(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); introStep(-1); }
}, true);
$("logo").addEventListener("click", () => openIntro());
window.__pastforward = Object.assign(window.__pastforward || {}, {
  introLength: INTRO_END + 2.5,
  introFrame: t => { if (!intro.open) openIntro(true); renderIntro(t); }
});

/* ---------- night sky ---------- */
const sky = $("sky"), sctx = sky.getContext("2d");
let stars = [];
function sizeSky() {
  sky.width = Math.round(innerWidth * DPR); sky.height = Math.round(innerHeight * DPR);
  const n = Math.min(140, Math.round(innerWidth * innerHeight / 12000));
  stars = Array.from({ length: n }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * .9 + .25, p: Math.random() * 6.28, s: .4 + Math.random() * 1.4 }));
}
function drawSky(t) {
  const c = sctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.clearRect(0, 0, innerWidth, innerHeight);
  if (!TC.dark) return;
  for (const s of stars) {
    const a = reduce ? .35 : .15 + .4 * (.5 + .5 * Math.sin(t / 1000 * s.s + s.p));
    c.fillStyle = `rgba(232,226,255,${a.toFixed(3)})`;
    c.beginPath(); c.arc(s.x * innerWidth, s.y * innerHeight, s.r, 0, 6.2832); c.fill();
  }
}

/* ---------- hint ---------- */
const hint = $("hint");
function hideHint() { hint.classList.add("gone"); }
setTimeout(hideHint, 6000);

/* ---------- loop ---------- */
let lastT = performance.now(), frame = 0;
function loop(t) {
  const dt = Math.min(48, t - lastT); lastT = t;
  if (!document.hidden && !intro.open) {
    stepFly(t); stepInertia(dt);
    draw(t); drawWorld(t);
    if (frame++ % 2 === 0) drawSky(t);
  }
  requestAnimationFrame(loop);
}
window.addEventListener("resize", resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => mcache.clear());

/* ---------- start ---------- */
resize();
const pathId = location.pathname.match(/^\/r\/([a-z0-9_-]+)\/?$/);
const h = pathId ? pathId[1] : decodeURIComponent(location.hash.slice(1));
let start = PAIRS.findIndex(p => p.id === h);
const linked = start >= 0;
if (start < 0) start = PAIRS.findIndex(p => p.id === "flu");
if (start < 0) start = 0;
cam.c = EVI[start].then.yx; cam.s = defaultScale(); clampCam();
setFocus(start, "then", 1, true);
if (linked) syncURL(start);   // a shared link: keep it as the clean /r/<id> address
else if (OWN_HOST && location.hash) { try { history.replaceState(null, "", "/"); } catch (e) {} }
if (!reduce) $("jump").classList.add("pulse");
updateDailyDot();
loadScores();
if (h === "daily") setTimeout(openDaily, 400);
if (h === "ask") setTimeout(() => openAsk(), 400);
// first visit to the home page: show what PastForward is (shared links go straight to their rhyme)
if (!linked && !h && !store.get(INTRO_KEY, 0)) setTimeout(() => openIntro(), 450);
requestAnimationFrame(loop);
})();
</script>
