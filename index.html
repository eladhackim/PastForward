ical embryologists", "url": "https://www.eshre.eu/Accreditation-and-Certification/Certification-for-embryologists"}]}}, {"kind": "learn", "title": "Reproductive technology law and ethics", "line": "How countries regulate embryo editing, screening and lab-grown eggs and sperm, including the UK’s licensing model, useful for clinicians, lawyers and policy staff.", "guide": {"what": "How countries regulate IVF, embryo screening, embryo editing and future lab-grown eggs and sperm, and the ethical arguments behind those rules, from consent to fairness and safety.", "why": "After Dolly, dozens of countries banned reproductive cloning. After He Jiankui’s 2018 gene-edited babies, the WHO issued a governance framework in 2021. Lab-grown eggs and sperm may raise the same questions again, and rules differ widely.", "how": ["Read the Nuffield Council’s report on genome editing and human reproduction, starting with its summary.", "Compare the UK’s licensing model with the rules in your own country.", "Read the WHO governance framework and note which recommendations your country has adopted."], "read": [{"title": "Nuffield Council on Bioethics: Genome editing and human reproduction", "url": "https://www.nuffieldbioethics.org/publication/genome-editing-and-human-reproduction-social-and-ethical-issues/"}, {"title": "WHO: Human genome editing, a framework for governance", "url": "https://www.who.int/publications/i/item/9789240030060"}]}}], "watch": "Lab-grown human eggs or sperm reaching clinical trials, or new national rules on embryo screening, would signal rising demand for oversight and counseling."}}, {"id": "deepblue", "theme": "A machine beats the best human player", "rhyme": 3, "then": {"year": 1997, "short": "Deep Blue", "title": "Deep Blue beats Kasparov", "where": "New York, USA", "region": "us", "hook": "The world chess champion walking away from the board, beaten by an IBM computer.", "text": "In May 1997, IBM’s Deep Blue beat world champion Garry Kasparov 3½ to 2½ in a six-game rematch in New York. It searched about 200 million positions per second. Kasparov suggested humans had helped the machine; IBM denied it."}, "now": {"year": 2016, "short": "AlphaGo", "title": "AlphaGo beats Lee Sedol", "where": "Seoul, South Korea", "region": "china", "hook": "March 2016: Google’s AlphaGo beating Go champion Lee Sedol, years before experts expected.", "text": "In March 2016, Google DeepMind’s AlphaGo beat Lee Sedol, one of the world’s top Go players, 4 to 1 in Seoul. Its move 37 in game two stunned professionals. Many experts had expected this milestone to be a decade away."}, "followed": "Chess engines soon outplayed every human, and players began training with them. Kasparov promoted human-computer teams, and IBM moved on to Watson, which won the TV quiz show Jeopardy! in 2011.", "next": {"short": "Beyond Games", "title": "AI outthinks humans at discovery", "text": "Around 2035, a machine might beat the best humans at something once seen as deeply creative, perhaps solving a famous open problem in mathematics or designing a working medicine largely on its own.", "watch": "AI systems producing original mathematical proofs, running lab experiments without human direction, and top experts in a field conceding defeat."}, "breaks": "Deep Blue won through brute-force search hand-tuned by experts, while AlphaGo learned much of its play from data and self-play, a method that spread far beyond games.", "topic": "tech", "echoes": [{"year": 1979, "short": "Backgammon Bot", "title": "A program beats the backgammon world champion", "region": "europe", "line": "BKG 9.8 beat backgammon world champion Luigi Villa 7–1 in Monte Carlo, the first program to beat a reigning world champion."}, {"year": 2011, "short": "Watson", "title": "IBM’s Watson wins Jeopardy!", "region": "us", "line": "IBM’s Watson beat Ken Jennings and Brad Rutter, the quiz show’s biggest champions, by answering clues written in everyday language."}, {"year": 2017, "short": "Libratus", "title": "AI beats top poker pros", "region": "us", "line": "Carnegie Mellon’s Libratus beat four top professionals at no-limit Texas hold’em, a game of bluffing and hidden cards, over 120,000 hands."}, {"year": 2019, "short": "OpenAI Five", "title": "OpenAI Five beats Dota 2 world champions", "region": "us", "line": "OpenAI’s bots beat OG, reigning world champions of the team video game Dota 2, two games to none in San Francisco."}, {"year": 2022, "short": "Racing Drone AI", "title": "An AI drone outraces champion pilots", "region": "europe", "line": "The University of Zurich’s autonomous drone Swift beat three champion pilots in head-to-head races, a first for AI in a physical sport."}], "opp": {"lastTime": "Chess did not fade after Deep Blue: engines became every player’s coach, and the youngest-grandmaster record fell from 14 years in 1997 to 12 in 2002. Kasparov launched “Advanced Chess” in 1998, pairing humans with computers.", "ideas": [{"kind": "build", "title": "Practice tools against AI", "line": "Training tools where professionals practice against AI, as chess players did with engines, could spread to medicine, law, negotiation and engineering.", "guide": {"what": "Training tools where professionals rehearse against an AI opponent or simulated case, such as a difficult patient, a hostile negotiator or a courtroom question, then get feedback.", "why": "After Deep Blue, engines became every chess player’s coach, and the youngest-grandmaster record fell from 14 to 12. As AI handles more expert tasks, similar practice partners could spread to medicine, law and negotiation.", "how": ["Interview trainers in one field about which skills learners rarely get to practise.", "Build a simple role-play prototype with an AI model and test it with five learners.", "Decide how you could measure real improvement, not just engagement, before charging anyone."], "read": []}}, {"kind": "build", "title": "Proving work was done unaided", "line": "As chess needed engine-cheating detection, exams, contests and hiring tests may need trustworthy ways to confirm work was done without AI.", "guide": {"what": "Ways to confirm that an exam, contest entry or job test was done by a person without AI help, such as supervised settings, oral follow-ups, writing-process records and statistical checks.", "why": "Chess needed engine-cheating detection after computers outplayed humans, and high-profile cheating disputes still arise. Schools, contests and employers now face the same problem with AI, and some are returning to supervised or oral tests.", "how": ["Read how chess sites and FIDE detect engine use, and what mistakes they make.", "Ask teachers or recruiters which checks they trust, and why AI text detectors often fail.", "Prototype a light check, like a short recorded oral follow-up, and pilot it fairly."], "read": []}}, {"kind": "work", "title": "Human-AI team leads", "line": "Roles pairing deep field expertise with AI tools, like Kasparov’s human-computer teams, may grow in drug discovery, materials research and mathematics.", "guide": {"what": "Roles that combine deep knowledge of a field, such as chemistry or mathematics, with skill at directing AI tools, checking their output and deciding which results are worth pursuing.", "why": "In 1998, Kasparov launched Advanced Chess, pairing humans with computers. AlphaFold’s protein structure predictions, honored with a 2024 Nobel Prize, now support labs worldwide, and people able to steer and check such tools may be valued.", "how": ["Watch Kasparov’s TED talk on working with intelligent machines and note lessons for your field.", "Use a free scientific AI resource, like the AlphaFold database, on a question you understand.", "Volunteer to test AI tools in your current job and document where they fail."], "read": [{"title": "TED: Garry Kasparov, Don’t fear intelligent machines. Work with them", "url": "https://www.ted.com/talks/garry_kasparov_don_t_fear_intelligent_machines_work_with_them"}, {"title": "AlphaFold Protein Structure Database", "url": "https://alphafold.ebi.ac.uk/"}]}}, {"kind": "learn", "title": "Proof assistants and formal verification", "line": "Proof assistants such as Lean and formal verification methods, increasingly used to check machine-generated mathematics and software before people rely on them.", "guide": {"what": "Software such as Lean that checks every step of a mathematical proof or a program’s logic, so errors are caught by a machine instead of relying on a human reader or tests.", "why": "After Deep Blue, Kasparov questioned how the machine had played. As AI produces proofs and code, machine checking may matter: DeepMind’s AlphaProof wrote its 2024 Math Olympiad solutions as Lean proofs.", "how": ["Play the Natural Number Game, a free browser game that teaches Lean basics.", "Work through the first chapters of Mathematics in Lean.", "Join the Lean community chat and try formalizing one short proof you already know."], "read": [{"title": "Lean programming language and theorem prover", "url": "https://lean-lang.org/"}, {"title": "Mathematics in Lean", "url": "https://leanprover-community.github.io/mathematics_in_lean/"}]}}], "watch": "AI-produced proofs or drug candidates passing peer review, and professionals shifting to supervising machine work, would signal demand for verification and teaming skills."}}, {"id": "y2k", "theme": "The day the computers fail", "rhyme": 2, "then": {"year": 1999, "short": "Y2K Bug", "title": "The Y2K millennium bug", "where": "Worldwide", "region": "world", "hook": "Stockpiled water and fears that planes, banks and power grids would fail at midnight.", "text": "Old software stored years as two digits, so 2000 could be read as 1900 and break systems. Governments and companies spent an estimated $300 billion or more on fixes. When midnight came on 1 January 2000, only minor glitches were reported."}, "now": {"year": 2024, "short": "CrowdStrike", "title": "The CrowdStrike global IT outage", "where": "Worldwide", "region": "world", "hook": "19 July 2024: blue screens on airport departure boards and handwritten boarding passes.", "text": "A faulty CrowdStrike security update crashed about 8.5 million Windows computers within hours. Airlines grounded flights, hospitals postponed procedures and some broadcasters went off air. Delta alone canceled about 7,000 flights over five days."}, "followed": "Y2K became a byword for overblown fear, though many engineers said the quiet midnight proved the fixes had worked. Within months the dot-com bubble burst.", "next": {"short": "System Crash", "title": "One bad update stops the world", "text": "Around 2049, a single faulty update or hidden bug might freeze far more critical systems, from power grids to fleets of self-driving cars, across the world in minutes.", "watch": "The Year 2038 problem, when older 32-bit Unix clocks overflow, and essential services relying on the same few software vendors."}, "breaks": "Y2K was a known deadline that years of work largely defused, while the CrowdStrike crash came without warning from one company’s routine update.", "older": "The AT&T phone network crash, 1990", "topic": "tech", "echoes": [{"year": 1980, "short": "ARPANET Crash", "title": "A glitch crashes the ARPANET", "region": "us", "line": "A hardware fault sent corrupted routing updates circling endlessly, and for several hours almost no ARPANET node could reach another."}, {"year": 1988, "short": "Morris Worm", "title": "The Morris worm hits the early internet", "region": "us", "line": "A student’s program copied itself far faster than intended, jamming thousands of computers and forcing networks to disconnect for days."}, {"year": 1990, "short": "AT&T Crash", "title": "The AT&T long-distance network crash", "region": "us", "line": "A bug in a software update crashed AT&T’s long-distance network for nine hours, blocking tens of millions of calls across the US."}, {"year": 2000, "short": "ILOVEYOU Worm", "title": "The ILOVEYOU email worm", "region": "world", "line": "A fake love letter spread by email worldwide, infecting tens of millions of PCs and forcing many organizations to shut email down."}, {"year": 2017, "short": "WannaCry", "title": "The WannaCry ransomware attack", "region": "world", "line": "WannaCry ransomware locked over 200,000 computers in about 150 countries, forcing British hospitals to cancel thousands of appointments."}, {"year": 2021, "short": "Facebook Outage", "title": "The great Facebook outage", "region": "world", "line": "A faulty command during routine maintenance knocked Facebook, Instagram and WhatsApp offline for about six hours for billions of users."}, {"year": 2023, "short": "FAA Outage", "title": "An FAA computer failure grounds US flights", "region": "us", "line": "A contractor’s deleted files crashed the FAA’s pilot-alert system, prompting the first nationwide ground stop since 9/11 and delaying over 10,000 flights."}], "opp": {"lastTime": "Y2K fixes created heavy demand for COBOL programmers, helped India’s IT services industry win major Western clients, and pushed many companies to write formal IT contingency plans for the first time.", "ideas": [{"kind": "build", "title": "Year 2038 audits", "line": "Audits and fixes for the 2038 time overflow in embedded devices, industrial controllers and old databases, a known deadline much like Y2K.", "guide": {"what": "Checking devices, software and databases for the 2038 problem: many older systems count time as seconds since 1970 in a 32-bit number, which overflows on 19 January 2038.", "why": "Y2K fixes created heavy demand for COBOL programmers and helped India’s IT firms win Western clients. The 2038 deadline is similar, but often hides in embedded controllers and devices that may stay in service for decades.", "how": ["Read the GNU Gnulib note on avoiding the 2038 problem to understand the technical causes.", "On a test machine only, set the clock past January 2038 and see what breaks.", "Ask a factory or utility engineer how long their controllers stay in service."], "read": [{"title": "GNU Gnulib: Avoiding the year 2038 problem", "url": "https://www.gnu.org/software/gnulib/manual/html_node/Avoiding-the-year-2038-problem.html"}]}}, {"kind": "build", "title": "Safer software update rollouts", "line": "Tools for staged rollouts, automatic rollback and pre-release testing of security updates could be in demand after one faulty update grounded flights worldwide.", "guide": {"what": "Tools and practices that release updates to a small group first, watch for problems and roll back automatically, so one bad change cannot crash every machine at once.", "why": "Y2K pushed many firms to write IT contingency plans for the first time. In 2024, one faulty CrowdStrike update crashed about 8.5 million Windows computers, and the company then promised staged rollouts for such updates.", "how": ["Read Google’s SRE chapter on canary releases to learn staged rollout basics.", "Read CrowdStrike’s root cause analysis and list which safeguards could have stopped the crash.", "Interview an IT operations lead about how they test and stage vendor updates today."], "read": [{"title": "Google SRE Workbook: Canarying releases", "url": "https://sre.google/workbook/canarying-releases/"}, {"title": "CrowdStrike: Channel File 291 remediation hub and root cause analysis", "url": "https://www.crowdstrike.com/falcon-content-update-remediation-and-guidance-hub/"}]}}, {"kind": "work", "title": "Resilience and third-party risk roles", "line": "Site reliability engineers, resilience officers and vendor risk analysts may grow as the EU’s DORA rules make financial firms manage supplier risk.", "guide": {"what": "Site reliability engineers keep online services running. Resilience officers plan for outages, and vendor risk analysts check how much a firm depends on outside suppliers and what happens if one fails.", "why": "Y2K made contingency planning normal in many firms. Since January 2025, the EU’s DORA rules require banks and insurers to manage risks from technology suppliers, and the 2024 CrowdStrike outage showed how one vendor can spread failures.", "how": ["Read the EIOPA summary of DORA to see what financial firms must now do.", "Study the free Google SRE book chapters on incident response and postmortems.", "Ask a risk or IT audit team how they map their critical suppliers today."], "read": [{"title": "EIOPA: Digital Operational Resilience Act (DORA)", "url": "https://www.eiopa.europa.eu/digital-operational-resilience-act-dora_en"}, {"title": "Google: Site Reliability Engineering book", "url": "https://sre.google/sre-book/table-of-contents/"}]}}, {"kind": "learn", "title": "Legacy code and recovery drills", "line": "Maintaining legacy code such as COBOL and running manual fallback drills, skills that grow scarce as older engineers retire while critical systems keep running.", "guide": {"what": "Keeping old but critical software, often written in COBOL on mainframes, working and safe to change, and practising manual fallbacks so services continue when computers fail.", "why": "Y2K fixes created heavy demand for COBOL programmers. In 2020, US states such as New Jersey asked for COBOL volunteers to keep unemployment systems running. Many who know these systems are retiring, while banks and governments still rely on them.", "how": ["Take the free Open Mainframe Project COBOL Programming Course.", "Read NIST’s contingency planning guide and run a tabletop drill for one critical service.", "Ask a bank or public agency IT team how they train new staff on legacy systems."], "read": [{"title": "Open Mainframe Project: COBOL Programming Course", "url": "https://openmainframeproject.org/projects/cobol-programming-course/"}, {"title": "NIST SP 800-34 Rev. 1: Contingency Planning Guide", "url": "https://csrc.nist.gov/pubs/sp/800/34/r1/upd1/final"}]}}], "watch": "Regulators requiring tested recovery plans for critical software vendors, and 2038 date bugs surfacing early in long-dated systems, would show demand rising."}}, {"id": "dotcom", "theme": "A tech investment bubble bursts", "rhyme": 2, "then": {"year": 2000, "short": "Dot-com Crash", "title": "The dot-com crash", "where": "United States", "region": "us", "hook": "Sock puppet mascots, Super Bowl ads, and internet startups that vanished almost overnight.", "text": "The tech-heavy Nasdaq index peaked in March 2000, then lost about 78% by October 2002. Hundreds of internet startups with little revenue folded, including Pets.com, which shut down nine months after its stock debut."}, "now": {"year": 2022, "short": "Crypto Crash", "title": "The crypto crash and FTX collapse", "where": "Worldwide", "region": "world", "hook": "November 2022: FTX, the crypto exchange with its name on an arena, collapsing within days.", "text": "Crypto markets lost about $2 trillion from their late-2021 peak, and Bitcoin fell from about $69,000 to below $16,000. In November 2022 the FTX exchange collapsed, with about $8 billion in customer money missing. Founder Sam Bankman-Fried was later convicted of fraud."}, "followed": "Survivors such as Amazon and eBay grew into giants, and Google went public in 2004. Many economists argue the low interest rates after the crash helped feed the housing bubble that burst in 2008.", "next": {"short": "Next Bubble", "title": "A new technology bubble bursts", "text": "Around 2044, a fresh frenzy might build around a promising technology, perhaps quantum computing, space or some invention not yet named, then burst when profits come more slowly than promised.", "watch": "Company values far ahead of revenue, first-time investors piling in through phone apps, and celebrities promoting assets they are paid to endorse."}, "breaks": "The dot-com bubble funded the internet, which went on to reshape daily life, while crypto’s lasting uses are still debated.", "older": "Britain’s Railway Mania, 1846", "topic": "money", "echoes": [{"year": 1693, "short": "Patent Boom", "title": "England’s patent share boom bursts", "region": "europe", "line": "In London’s first stock market boom, investors rushed into firms with new patents such as diving engines; few survived the decade."}, {"year": 1846, "short": "Railway Mania", "title": "Britain’s Railway Mania", "region": "europe", "line": "Britons poured savings into hundreds of new railway schemes, many never built; when share prices collapsed, thousands of investors were ruined."}, {"year": 1873, "short": "Panic of 1873", "title": "The Panic of 1873", "region": "us", "line": "After a US railroad boom, Jay Cooke’s bank collapsed under Northern Pacific debts, setting off a panic and a years-long depression."}, {"year": 1897, "short": "Bicycle Bubble", "title": "Britain’s bicycle share bubble bursts", "region": "europe", "line": "Hundreds of cycle firms floated as shares soared in 1896, then the index lost over 70 percent and many makers went bust."}, {"year": 1929, "short": "Radio Stocks", "title": "Radio stocks crash with Wall Street", "region": "us", "line": "RCA, the leading radio stock of the 1920s, lost about 98 percent of its value between its 1929 peak and 1932."}, {"year": 1962, "short": "Tronics Crash", "title": "The early-1960s “tronics” boom collapses", "region": "us", "line": "New electronics issues, often named “-tronics”, soared in 1960 and 1961, then many lost 90 percent of their value in 1962."}], "opp": {"lastTime": "The crash left a glut of cheap, mostly unused fiber-optic cable that later carried broadband, online video and cloud services at low cost. Britain’s Railway Mania likewise ruined many investors but left the country 6,220 miles of new railway.", "ideas": [{"kind": "build", "title": "Reusing overbuilt infrastructure", "line": "If AI spending outruns revenue, surplus data center space and chips could become cheap inputs for new services, as unused fiber did after 2000.", "guide": {"what": "Businesses that buy or rent surplus capacity cheaply after a crash, such as unused data centers, chips or network links, and build new services on top of it.", "why": "The dot-com crash left cheap, unused fiber that later carried broadband and online video. Tech firms now spend hundreds of billions of dollars a year on AI data centers; if revenue lags, surplus capacity could become cheap.", "how": ["Read Carlota Perez on how bubbles leave infrastructure that later booms reuse.", "Track prices for renting AI chips and data center space to spot a lasting fall.", "List services that only work if computing gets much cheaper, and test demand for one now."], "read": [{"title": "Carlota Perez: research on technological revolutions and financial bubbles", "url": "https://carlotaperez.org/"}]}}, {"kind": "build", "title": "Flagging misleading investment promotions", "line": "Tools that flag paid promotions and unrealistic claims in investment ads, a recurring feature of manias from railways to crypto.", "guide": {"what": "Tools that scan ads, social posts and videos about investments for signs of paid promotion, missing risk warnings or unrealistic promises, and alert users, platforms or regulators.", "why": "Manias from Railway Mania to crypto drew in first-time investors through hype. In 2022, Kim Kardashian paid $1.26 million to settle SEC charges over an undisclosed paid crypto promotion, and the UK’s FCA issued finfluencer guidance in 2024.", "how": ["Collect 50 investment posts and label which disclose payment and risks.", "Read the FCA’s finfluencer guidance to see which claims break the rules.", "Ask a consumer protection group or platform trust team what a useful alert would include."], "read": [{"title": "UK FCA: FG24/1 Financial promotions on social media", "url": "https://www.fca.org.uk/publications/finalised-guidance/fg24-1-finalised-guidance-financial-promotions-social-media"}]}}, {"kind": "work", "title": "Forensic accounting and insolvency", "line": "Forensic accountants, blockchain tracers and insolvency administrators tend to be busy after bubbles burst, helping recover funds for creditors, as in FTX’s bankruptcy.", "guide": {"what": "Forensic accountants trace where money went and spot fraud. Blockchain tracers follow crypto payments, and insolvency administrators run failed firms and recover assets for creditors.", "why": "After the dot-com crash, accounting frauds surfaced at firms like WorldCom. After FTX collapsed in 2022, its bankruptcy team recovered billions, enough to repay most customers’ claims at 2022 values. Burst bubbles often keep investigators busy for years.", "how": ["Look at what the ACFE’s Certified Fraud Examiner credential requires.", "Talk to an insolvency or forensic team at an accounting firm about entry roles.", "Practise tracing a public crypto transaction on a block explorer."], "read": [{"title": "Association of Certified Fraud Examiners (ACFE)", "url": "https://www.acfe.com/"}]}}, {"kind": "learn", "title": "Reading unit economics", "line": "Judging revenue, cash burn and unit economics critically, the skill that separated dot-com survivors from failures like Pets.com.", "guide": {"what": "Working out whether a business makes or loses money on each sale or customer, after costs like delivery, discounts and marketing, and how long its cash can last.", "why": "Pets.com often sold goods for less than they cost to buy and ship, and shut nine months after listing. When money is cheap, such losses can hide; in the next frenzy, this skill may help separate survivors from failures.", "how": ["Pick one listed company and calculate revenue, gross margin and cash burn from its annual report.", "Use Damodaran’s free valuation lectures to learn how analysts test growth stories.", "Compare a dot-com failure and a survivor, such as Pets.com and Amazon, using old filings."], "read": [{"title": "Damodaran Online (NYU Stern): free valuation courses", "url": "https://pages.stern.nyu.edu/~adamodar/"}]}}], "watch": "Spending far outpacing revenue and a rush of first-time investors would signal a bubble; cheap surplus capacity after a crash would signal openings."}}, {"id": "blackout", "theme": "A sudden grid collapse darkens millions", "rhyme": 3, "then": {"year": 2003, "short": "2003 Blackout", "title": "The Northeast blackout of 2003", "where": "Northeastern US and Ontario", "region": "us", "hook": "New Yorkers walking home across bridges in the heat as the city’s lights went out.", "text": "On 14 August 2003, power lines sagging into trees in Ohio and a failed alarm system set off a cascade. About 55 million people in eight US states and Ontario lost power, some for days. Subways stopped and traffic lights went dark."}, "now": {"year": 2025, "short": "Iberian Outage", "title": "The Iberian blackout", "where": "Spain and Portugal", "region": "europe", "hook": "28 April 2025: dead traffic lights, stalled trains and battery radios across Spain and Portugal.", "text": "On 28 April 2025, at 12:33 Spanish time, the grids of Spain and Portugal collapsed within seconds. Trains stalled, phone networks faltered and tens of millions lost power until late that night or the next morning. Investigators traced it to a chain of voltage surges that tripped power plants."}, "followed": "A US-Canada task force blamed overgrown trees, failed alarms and operator errors at an Ohio utility. The Energy Policy Act of 2005 then made grid reliability rules mandatory across North America.", "next": {"short": "Next Blackout", "title": "A more electric world goes dark", "text": "Around 2047, with cars, heating and cooking running on electricity, a cyberattack, solar storm or control failure might black out a whole country and freeze daily life.", "watch": "How grids keep voltage stable as power sources change, cyberattacks on utilities, strong solar storms, and thin links between national grids."}, "breaks": "In 2003 failures built up over hours on part of a vast continental grid, while in 2025 two whole countries, weakly linked to Europe, collapsed in seconds.", "older": "The Northeast blackout, 1965", "topic": "disaster", "echoes": [{"year": 1965, "short": "1965 Blackout", "title": "The Northeast blackout of 1965", "region": "us", "line": "A wrongly set relay near Niagara Falls triggered a cascade that left about 30 million people in the Northeast and Ontario dark."}, {"year": 1977, "short": "NYC Blackout", "title": "The New York City blackout of 1977", "region": "us", "line": "Lightning strikes blacked out New York City for about a day, and looting and arson broke out across many neighborhoods."}, {"year": 1999, "short": "Brazil Blackout", "title": "The southern Brazil blackout of 1999", "region": "latam", "line": "Lightning at one substation triggered a cascade that darkened São Paulo and Rio, affecting an estimated 75 to 97 million Brazilians."}, {"year": 2006, "short": "Europe Blackout", "title": "The European blackout of 2006", "region": "europe", "line": "Switching off a German power line so a cruise ship could pass split Europe’s grid, cutting power to over 15 million customers."}, {"year": 2012, "short": "India Blackout", "title": "India’s 2012 grid collapse", "region": "india", "line": "Two grid failures in two days left over 600 million people in northern and eastern India without power, the largest blackout recorded."}, {"year": 2019, "short": "Argentina Outage", "title": "The Argentina and Uruguay blackout", "region": "latam", "line": "A grid operator’s error set off a 30-second cascade that blacked out nearly all of Argentina and Uruguay, about 48 million people."}], "opp": {"lastTime": "The 1965 blackout led to NERC’s founding in 1968, and after 2003 the Energy Policy Act gave it power to enforce mandatory reliability rules. Utilities stepped up tree trimming and installed phasor measurement units, sensors that track the grid in real time.", "ideas": [{"kind": "build", "title": "Backup power for homes and shops", "line": "Home batteries and small backup kits that keep phones, fridges, medical devices and card terminals running could see demand after highly visible blackouts.", "guide": {"what": "Batteries, small solar kits and simple backup setups that keep essentials running in an outage: phones, lights, fridges, medical devices, routers and card payment terminals.", "why": "After the 2003 blackout, North America made grid rules mandatory, yet outages still happen. On 28 April 2025, Spain and Portugal lost power for hours, and the EU now advises households to be ready to cope for 72 hours.", "how": ["Ask local shops what failed during the last outage, such as payments, fridges or alarms.", "Compare the cost of a small battery kit with the losses from a day without power.", "Read power outage safety advice, including safe generator use, before selling any kit."], "read": [{"title": "American Red Cross: Power outage safety", "url": "https://www.redcross.org/get-help/how-to-prepare-for-emergencies/types-of-emergencies/power-outage.html"}]}}, {"kind": "build", "title": "Voltage control for renewable-heavy grids", "line": "Equipment and services that keep voltage stable on grids with much solar and wind, such as grid-forming inverters and synchronous condensers, may be needed.", "guide": {"what": "Equipment and services that keep grid voltage steady as solar and wind replace big spinning generators, such as grid-forming inverters, synchronous condensers and reactive power control.", "why": "After 2003, utilities installed sensors that track the grid in real time. ENTSO-E’s 2026 report on the Iberian blackout cited gaps in voltage and reactive power control, which may push grid operators to buy more of this equipment.", "how": ["Read the summary of ENTSO-E’s final report on the 28 April 2025 blackout.", "Learn what grid-forming inverters do through ESIG’s webinars and reports.", "Talk to a grid operator or utility engineer about which services they plan to buy."], "read": [{"title": "ENTSO-E: 28 April 2025 Iberian blackout", "url": "https://www.entsoe.eu/publications/blackout/28-april-2025-iberian-blackout/"}, {"title": "Energy Systems Integration Group (ESIG)", "url": "https://www.esig.energy/"}]}}, {"kind": "work", "title": "Grid protection and control engineers", "line": "Power system engineers, protection specialists and control room operators may be in short supply as grids electrify and blackout inquiries rewrite operating rules.", "guide": {"what": "Power system engineers design and model grids. Protection specialists set relays that isolate faults, and control room operators balance supply and demand minute by minute.", "why": "After 2003, a US-Canada task force blamed failed alarms and operator errors, and NERC’s reliability rules became mandatory. As grids add solar, wind and big new loads like data centers, skilled operators and engineers may be in short supply.", "how": ["Join IEEE Power and Energy Society events or a student chapter to meet working engineers.", "Learn power flow basics with free open-source tools such as pandapower or PyPSA.", "Ask a utility or grid operator about trainee and operator certification routes."], "read": [{"title": "IEEE Power and Energy Society", "url": "https://ieee-pes.org/"}, {"title": "NERC: North American Electric Reliability Corporation", "url": "https://www.nerc.com/"}]}}, {"kind": "learn", "title": "Power system stability basics", "line": "How voltage, frequency and inertia interact on grids rich in solar and wind, the questions at the center of the Iberian blackout investigation.", "guide": {"what": "How grids keep voltage and frequency within safe limits, why spinning generators add inertia, and how solar, wind and batteries connected through inverters change that balance.", "why": "In 2003, failures built up over hours; in 2025, Spain and Portugal collapsed within seconds. Investigators cited oscillations and voltage control gaps, so understanding stability may help engineers, analysts and policymakers judge future grid rules.", "how": ["Read the summary of the 2003 US-Canada task force report to see how a cascade unfolds.", "Read ENTSO-E’s Iberian blackout summary and list each factor it names.", "Take an introductory power systems course online, focusing on frequency, voltage and inertia."], "read": [{"title": "US-Canada Task Force: Final report on the 14 August 2003 blackout", "url": "https://www.energy.gov/oe/articles/blackout-2003-final-report-august-14-2003-blackout-united-states-and-canada-causes-and"}, {"title": "ENTSO-E: 28 April 2025 Iberian blackout", "url": "https://www.entsoe.eu/publications/blackout/28-april-2025-iberian-blackout/"}]}}], "watch": "New grid rules letting solar and wind plants control voltage, stronger links between national grids, and household preparedness guidance would signal growing demand."}}];
const WORLD = {"1755": {"us": "In Britain’s American colonies, French and Native forces routed General Braddock’s army near Fort Duquesne in July; young George Washington survived. In November an earthquake shook Boston.", "latam": "Guaraní mission villages fought Spanish and Portuguese troops enforcing a 1750 border swap. Pombal’s Portugal banned enslaving Amazon peoples and founded a monopoly company for Grão-Pará and Maranhão.", "europe": "Lisbon’s 1 November earthquake shocked the continent. In London, Samuel Johnson published his Dictionary of the English Language, while Britain and France drifted toward the Seven Years’ War.", "russia": "Empress Elizabeth founded Moscow University in January, a project of scholar Mikhail Lomonosov and her favourite Ivan Shuvalov. In the Urals, the mullah Batyrsha led a Bashkir uprising.", "mideast": "Sultan Osman III completed Istanbul’s Nuruosmaniye Mosque, an early Ottoman Baroque landmark. In Morocco, the Lisbon tsunami struck the coast, and a separate November quake hit Meknes.", "africa": "In Ethiopia, Emperor Iyasu II died and his son Iyoas I took the throne. At the Dutch Cape, a smallpox epidemic struck colonists, slaves and Khoikhoi.", "india": "British and Peshwa forces took the sea fort of Suvarnadurg from the naval chief Tulaji Angre in April. In Delhi, Mughal emperor Alamgir II was a puppet of his vizier Imad-ul-Mulk.", "china": "Qianlong’s armies took Ili, heart of the Dzungar Mongol state, but their ally Amursana soon rebelled. In Japan, a cold, wet summer brought the Hōreki famine to the northeast."}, "1789": {"us": "George Washington was sworn in as first president at New York’s Federal Hall on 30 April. In September Congress sent the states the amendments that became the Bill of Rights.", "latam": "In Brazil, Portuguese officials uncovered the Minas Gerais independence plot and arrested its leader, Tiradentes. In French Saint-Domingue, planters and free people of colour pressed rival claims in revolutionary Paris.", "europe": "Beyond France’s revolution, the Austrian Netherlands rose in the Brabant Revolution in October. In Britain, George III recovered from mental illness, ending the Regency Crisis.", "russia": "Catherine the Great was at war with both Sweden and the Ottomans. General Alexander Suvorov, with Austrian allies, routed Ottoman armies at Focșani and Rymnik, in today’s Romania.", "mideast": "Sultan Abdul Hamid I died in April, and the reform-minded Selim III took the Ottoman throne amid a losing war with Russia and Austria. Austria captured Belgrade in October.", "africa": "In Dahomey, King Kpengla died and his son Agonglo took the throne after a palace struggle. In Sierra Leone, Temne ruler King Jimmy burned Granville Town, home to Black settlers from London.", "india": "In December, Tipu Sultan of Mysore attacked the Travancore Lines, defences of a British ally, setting off the Third Anglo-Mysore War. Governor-General Cornwallis was reworking Bengal’s land revenue system.", "china": "In January, Vietnam’s Tây Sơn leader Nguyễn Huệ routed a Qing army at Hanoi. In Japan’s north, Ainu on Kunashir and the Menashi coast rose against Japanese traders and were crushed."}, "1790": {"us": "The first census counted about 3.9 million people, and Rhode Island became the last original state to ratify the Constitution. Benjamin Franklin died in Philadelphia in April.", "latam": "Workers paving Mexico City’s main square unearthed the Aztec Sun Stone and a statue of Coatlicue. In Saint-Domingue, Vincent Ogé led a failed revolt demanding votes for free men of colour.", "europe": "Paris celebrated the Bastille’s fall with the Festival of the Federation, and a new law made priests state employees. In London, Edmund Burke published Reflections on the Revolution in France.", "russia": "Russia made peace with Sweden at Värälä in August. Writer Alexander Radishchev attacked serfdom in print and was condemned to death, commuted to Siberian exile.", "mideast": "Under Prussian pressure, Austria agreed at Reichenbach in July to return its Ottoman conquests. In December, Russian troops stormed the Danube fortress of Izmail, killing most of its garrison.", "africa": "In Madagascar, King Andrianampoinimerina was uniting the Merina highlands from Ambohimanga. James Bruce published his account of travelling through Ethiopia to the source of the Blue Nile.", "india": "The Third Anglo-Mysore War began, with the East India Company, the Marathas and Hyderabad allied against Tipu Sultan. Tipu checked the first British invasion of Mysore.", "china": "Opera troupes from Anhui came to Beijing for the Qianlong Emperor’s 80th birthday, seeding Peking opera. Japan’s shogunate banned “heterodox” Confucian teaching at its official academy."}, "1796": {"us": "George Washington published his Farewell Address and stepped aside. John Adams narrowly beat Thomas Jefferson for president, and Tennessee became the 16th state.", "latam": "In Saint-Domingue, Toussaint Louverture rescued French governor Laveaux from a coup and was named lieutenant governor. Spain joined France against Britain in October, exposing its colonies to British attack.", "europe": "Newly married to Joséphine, Napoleon Bonaparte led France’s Army of Italy to victories at Lodi and Arcole. In December a French fleet tried and failed to land troops in Ireland.", "russia": "Catherine the Great died in November, and her son Paul I succeeded her. Paul recalled an army invading Persia and freed the Polish rebel leader Tadeusz Kościuszko.", "mideast": "Agha Mohammad Khan was formally crowned shah, founding Iran’s Qajar dynasty, and seized Mashhad from the last Afsharid ruler. Selim III kept building his European-style Nizam-ı Cedid army.", "africa": "Scottish explorer Mungo Park reached the Niger River at Ségou in July. At the Cape, seized by Britain in 1795, a Dutch fleet sent to retake it surrendered at Saldanha Bay.", "india": "Britain seized the Dutch forts of coastal Ceylon, taking Colombo in February. In Pune, Baji Rao II became Maratha Peshwa after months of court intrigue.", "china": "The Qianlong Emperor formally handed the throne to his son Jiaqing but kept real power. The White Lotus Rebellion broke out in central China, lasting until 1804."}, "1811": {"us": "In January, hundreds of enslaved people rose near New Orleans in the German Coast uprising. In November Governor Harrison fought Tecumseh’s confederacy at Tippecanoe, and in December the New Madrid earthquakes began.", "latam": "Venezuela declared independence from Spain on 5 July. In Mexico, rebel priest Miguel Hidalgo was captured and executed, while Paraguay threw off Spanish rule in May.", "europe": "In Britain, the Prince of Wales became Regent for his ailing father, George III. In Portugal, Masséna’s starving French army retreated from Wellington’s Lines of Torres Vedras.", "russia": "Alexander I opened the Tsarskoye Selo Lyceum, where young Alexander Pushkin was among the first pupils. On the Danube, Kutuzov trapped and defeated an Ottoman army near Ruse.", "mideast": "In March, Egypt’s Ottoman governor Muhammad Ali had the Mamluk leaders massacred at the Cairo Citadel. Later that year he sent an army against the first Saudi state in Arabia.", "africa": "At the British-held Cape, Colonel John Graham’s troops began driving Xhosa communities east of the Fish River in December. Black American shipowner Paul Cuffe visited Freetown to explore resettlement.", "india": "Governor-General Lord Minto sent an Indian army that seized French-controlled Java in August. In Punjab, Ranjit Singh kept building his Sikh empire.", "china": "In Korea, Hong Gyeong-nae launched a major revolt in the northwest in December. Japanese guards seized Russian captain Vasily Golovnin on Kunashir, holding him for two years."}, "1830": {"us": "President Andrew Jackson signed the Indian Removal Act in May, paving the way for the Trail of Tears. Joseph Smith published the Book of Mormon and founded his church.", "latam": "Gran Colombia broke apart as Venezuela and Ecuador left, and Simón Bolívar died near Santa Marta in December. Uruguay adopted its first constitution.", "europe": "France’s July Revolution replaced King Charles X with Louis-Philippe, and Belgians rose against Dutch rule in August. In England, farm workers smashed threshing machines in the Swing Riots.", "russia": "In November, Polish cadets in Warsaw rose against Tsar Nicholas I, starting the November Uprising. A cholera epidemic reached Moscow, and quarantine trapped Pushkin on his Boldino estate.", "mideast": "France landed troops in Ottoman Algeria in June and took Algiers on 5 July, beginning 132 years of French rule. In February the great powers recognised Greek independence.", "africa": "Brothers Richard and John Lander traced the Niger River to its delta, settling where it met the sea. Dingane, who had killed Shaka in 1828, ruled the Zulu kingdom.", "india": "Reformer Ram Mohan Roy sailed for Britain as the Mughal emperor’s envoy, a year after Lord Bentinck outlawed sati, the burning of widows, in Bengal.", "china": "In Japan, about five million people joined the okage mairi, a mass pilgrimage to the Ise shrines. In Qing China, silver flowed out as opium imports kept rising."}, "1845": {"us": "James K. Polk became president, Florida became a state, and Texas joined in December. Frederick Douglass published his Narrative, and the phrase “manifest destiny” entered print.", "latam": "Britain and France blockaded the River Plate against Argentina’s ruler Juan Manuel de Rosas, battling his forces at Vuelta de Obligado. Mexico broke off relations with the US over Texas.", "europe": "Potato blight struck Ireland in September, beginning a famine that would kill about a million people. Sir John Franklin sailed to find the Northwest Passage and never returned.", "russia": "In the Caucasus, Mikhail Vorontsov’s army captured Imam Shamil’s stronghold at Dargo but lost thousands on the retreat. The Russian Geographical Society was founded in St Petersburg.", "mideast": "In French Algeria, troops under Colonel Pélissier suffocated hundreds of villagers sheltering in the Dahra caves. In Ottoman Mount Lebanon, Druze–Maronite fighting flared again.", "africa": "British and French warships shelled Tamatave after Madagascar’s Queen Ranavalona I ordered foreign traders to obey local law or leave. Her forces drove off the landing party.", "india": "In December the Sikh Khalsa army crossed the Sutlej, starting the First Anglo-Sikh War, with bloody battles at Mudki and Ferozeshah. Denmark sold Tranquebar and its other Indian posts to Britain.", "china": "Shanghai’s new Land Regulations set aside a British settlement, seed of the later International Settlement. In Japan, Abe Masahiro took charge of the shogun’s senior council."}, "1848": {"us": "Gold was found at Sutter’s Mill in California, and a February treaty ending the Mexican War handed the US a vast territory. The Seneca Falls Convention demanded women’s rights.", "latam": "Mexico confirmed the loss of about half its territory, including Texas, to the United States. France abolished slavery in Martinique and Guadeloupe, and Maya rebels in Yucatán’s Caste War nearly took Mérida.", "europe": "Revolutions shook France, the German states, the Austrian Empire and Italy. Marx and Engels published The Communist Manifesto, and Louis-Napoléon Bonaparte was elected French president.", "russia": "Nicholas I kept the revolutions out, sending troops to crush uprisings in Moldavia and Wallachia. A cholera epidemic killed hundreds of thousands across the empire.", "mideast": "In Iran, 17-year-old Naser al-Din Shah took the throne as the Babi movement spread. In Egypt, Ibrahim Pasha replaced his ailing father Muhammad Ali but died within months.", "africa": "Joseph Jenkins Roberts became the first president of independent Liberia. In southern Africa, Governor Harry Smith annexed the lands beyond the Orange River and defeated Boers at Boomplaats.", "india": "Lord Dalhousie arrived as governor-general and annexed Satara using the “doctrine of lapse”. A revolt at Multan in April grew into the Second Anglo-Sikh War.", "china": "In Guangxi, Hong Xiuquan’s God Worshipping Society was gaining followers, three years before the Taiping Rebellion. In Japan, American Ranald MacDonald slipped ashore and taught English to Nagasaki interpreters."}, "1858": {"us": "Abraham Lincoln and Stephen Douglas debated slavery seven times in their Illinois Senate race, which Douglas won. Minnesota became the 32nd state.", "latam": "Mexico’s Reform War began in January, pitting Benito Juárez’s liberals against a conservative government in Mexico City. Juárez set up his government in Veracruz.", "europe": "London’s “Great Stink” from the sewage-filled Thames pushed Parliament to fund new sewers. In France, Bernadette Soubirous reported visions at Lourdes, and Napoleon III secretly agreed to back Piedmont against Austria.", "russia": "In the Treaty of Aigun, Qing China ceded the north bank of the Amur to Russia. At home, noble committees set up by Alexander II debated how to free the serfs.", "mideast": "The Ottoman Land Code required farmland to be registered, reshaping rural ownership. Ferdinand de Lesseps launched the Suez Canal Company, and Kisrawan peasants in Mount Lebanon rose against their lords.", "africa": "John Hanning Speke reached the lake he named Victoria and declared it the Nile’s source. Moshoeshoe’s Basotho fought off the Orange Free State, and David Livingstone began his Zambezi expedition.", "india": "After the 1857 uprising, the British Crown took over from the East India Company. Rani Lakshmibai of Jhansi died fighting in June, and the last Mughal emperor was exiled to Rangoon.", "china": "Losing the Second Opium War, Qing China signed the Treaties of Tianjin, opening new ports. Japan signed a trade treaty with the US, and chief minister Ii Naosuke began purging critics."}, "1859": {"us": "Edwin Drake struck oil in Titusville, Pennsylvania, in August. In October John Brown raided the federal arsenal at Harpers Ferry to spark a slave revolt, and was hanged in December.", "latam": "From Veracruz, Benito Juárez issued the Reform Laws, nationalising Church property and creating civil marriage. In Argentina, the Confederation defeated Buenos Aires at Cepeda, pushing it to rejoin.", "europe": "Charles Darwin published On the Origin of Species in November. France and Piedmont defeated Austria at Magenta and Solferino, where the carnage later moved Henry Dunant to found the Red Cross.", "russia": "Imam Shamil, who had led North Caucasus resistance for 25 years, surrendered to Russian forces at Gunib. In St Petersburg, editorial commissions began drafting the emancipation of the serfs.", "mideast": "Work on the Suez Canal began at the site of Port Said in April. In October, Spain declared war on Morocco over clashes near Ceuta.", "africa": "David Livingstone’s expedition reached Lake Malawi in September. In Abeokuta, missionary Henry Townsend launched Iwe Irohin, often called Nigeria’s first newspaper, printed in Yoruba.", "india": "Rebel leader Tantia Tope was betrayed, captured and hanged in April, ending the last campaign of 1857’s uprising. In Bengal, peasants began the Indigo Revolt against European planters.", "china": "Qing guns at the Taku Forts drove off a British and French fleet in June. Japan opened Yokohama to foreign trade, and the Ansei Purge executed the teacher Yoshida Shōin."}, "1871": {"us": "The Great Chicago Fire killed about 300 people in October, and the same night a forest fire at Peshtigo, Wisconsin, killed over 1,200. The New York Times exposed Boss Tweed’s corruption.", "latam": "Brazil’s Law of Free Birth freed children born to enslaved mothers. Yellow fever killed about 14,000 people in Buenos Aires, and a liberal revolution took power in Guatemala.", "europe": "Wilhelm I was proclaimed German emperor at Versailles in January, and defeated France gave up Alsace and part of Lorraine. Rome became the capital of united Italy.", "russia": "A London conference let Russia station warships on the Black Sea again, undoing part of its Crimean War defeat. Dostoevsky began publishing Demons, inspired by the Nechayev affair.", "mideast": "In Algeria, Cheikh El Mokrani led a large Kabyle revolt against French rule, which was crushed. Iran was in the grip of a devastating famine.", "africa": "Henry Morton Stanley found David Livingstone at Ujiji on Lake Tanganyika. Diggers swarmed the diamond fields at what became Kimberley, and Britain annexed them as Griqualand West.", "india": "The Criminal Tribes Act let British officials brand whole communities “criminal” by birth. In September, acting chief justice John Paxton Norman was stabbed to death in Calcutta.", "china": "Japan abolished its feudal domains for prefectures, and the Iwakura Mission left to study the West. US marines stormed forts on Korea’s Ganghwa Island, and Russia occupied China’s Ili valley."}, "1876": {"us": "Philadelphia hosted the Centennial Exhibition, and Lakota and Cheyenne warriors destroyed Custer’s command at the Little Bighorn. The Hayes–Tilden presidential election ended in bitter dispute.", "latam": "Porfirio Díaz rebelled under the Plan of Tuxtepec and seized Mexico City in November, beginning decades in power. Brazil’s Emperor Pedro II toured the US and tried Bell’s telephone.", "europe": "Ottoman forces crushed Bulgaria’s April Uprising, killing thousands, and Gladstone’s pamphlet on the “Bulgarian Horrors” stirred Britain. Wagner opened Bayreuth with the first complete Ring cycle.", "russia": "Russia annexed the Central Asian Khanate of Kokand, and Russian volunteers under General Chernyayev fought for Serbia. Radicals of the new Land and Liberty group staged a protest in St Petersburg.", "mideast": "The Ottoman Empire had three sultans in one year, and Abdul Hamid II proclaimed its first constitution in December. Bankrupt Egypt accepted a European-run debt commission.", "africa": "Emperor Yohannes IV’s Ethiopian army routed an invading Egyptian force at Gura in March. In Brussels, Belgium’s King Leopold II hosted a conference that began his Congo ambitions.", "india": "The monsoon failed in southern and western India, starting the Great Famine of 1876–78, which killed millions. Parliament gave Queen Victoria the title Empress of India.", "china": "Japan forced Korea to open ports under the Treaty of Ganghwa, and banned samurai from wearing swords. China’s first railway opened near Shanghai, and drought began a terrible famine in the north."}, "1883": {"us": "The Brooklyn Bridge opened in May, then the world’s longest suspension bridge. That autumn railroads adopted standard time zones, and the Supreme Court struck down the Civil Rights Act of 1875.", "latam": "Chile and Peru signed the Treaty of Ancón in October, ending the war between them and costing Peru nitrate-rich Tarapacá. In Brazil, activists formed the Abolitionist Confederation to end slavery.", "europe": "Germany passed Bismarck’s Health Insurance Law, the first national sickness insurance scheme. Karl Marx died in London in March, and Nietzsche published the first part of “Thus Spoke Zarathustra.”", "russia": "Alexander III was crowned in Moscow in May, two years after his father’s assassination, and pressed a conservative crackdown. In Geneva, Georgi Plekhanov founded the first Russian Marxist group.", "mideast": "Egypt was under British occupation, and Evelyn Baring arrived as consul-general. In Sudan, the Mahdi’s forces wiped out an Egyptian army under Hicks Pasha at Shaykan in November.", "africa": "Paul Kruger became president of the Transvaal. On the coast of today’s Namibia, German merchant Adolf Lüderitz bought land at Angra Pequena, the seed of a German colony.", "india": "The Ilbert Bill, letting Indian judges try Europeans in some cases, sparked fierce protest from British residents against Viceroy Lord Ripon. Nationalists held an Indian National Conference in Calcutta.", "china": "France made Vietnam a protectorate in August and fought China-backed Black Flag forces in Tonkin, edging toward war with the Qing. In Tokyo, the Rokumeikan opened for Western-style balls."}, "1884": {"us": "Grover Cleveland won the presidency in November, the first Democrat elected since before the Civil War. In December workers set the capstone on the Washington Monument.", "latam": "Brazil’s province of Ceará abolished slavery in March, followed by Amazonas. Bolivia signed a truce leaving its coast to Chile, and Porfirio Díaz returned to Mexico’s presidency in December.", "europe": "Britain’s Third Reform Act gave the vote to most rural male householders, and the socialist Fabian Society was founded in London. In November, Bismarck opened the Berlin Conference on Africa.", "russia": "Russia annexed the Central Asian oasis of Merv, alarming Britain about India’s frontier. A new university statute ended university self-government as Alexander III tightened control.", "mideast": "Britain sent General Charles Gordon to Khartoum to evacuate Egyptian garrisons from Sudan. By spring the Mahdi’s forces had him under siege.", "africa": "Germany declared protectorates over South West Africa, Togoland and Cameroon. In November the Berlin Conference opened, speeding the European race for African land.", "india": "Lord Dufferin replaced Lord Ripon as viceroy in December. In Pune, Bal Gangadhar Tilak and fellow nationalists founded the Deccan Education Society to run Indian-led schools.", "china": "France and China fought openly: in August a French fleet destroyed China’s Fujian fleet at Fuzhou in under an hour. In Korea, pro-Japanese reformers’ Gapsin Coup collapsed after three days."}, "1890": {"us": "Idaho and Wyoming became states, Wyoming the first with women’s suffrage. On 29 December US troops killed about 250 to 300 Lakota at Wounded Knee.", "latam": "Argentina’s Revolution of the Park in July forced President Juárez Celman out, and its debts nearly sank London’s Barings bank. Brazil’s new republic was gripped by a speculative bubble, the Encilhamento.", "europe": "Kaiser Wilhelm II forced Bismarck to resign in March. Britain swapped the North Sea island of Heligoland to Germany for Zanzibar, and Vincent van Gogh died in France.", "russia": "Anton Chekhov crossed Siberia to study the penal colony on Sakhalin island. Heir Nicholas set off on a grand tour toward Asia, and a new law curbed the elected zemstvo councils.", "mideast": "Persia’s Naser al-Din Shah granted a British company a monopoly over the country’s tobacco, a deal that would spark mass protest. Sultan Abdul Hamid II ruled the Ottoman Empire from Istanbul.", "africa": "Cecil Rhodes became prime minister of the Cape Colony, and his Pioneer Column marched into Mashonaland, founding Fort Salisbury, today’s Harare. Zanzibar became a British protectorate.", "india": "Britain and China signed a convention in Calcutta recognizing Sikkim as a British protectorate. A trial over the death of child bride Phulmoni fueled debate on the age of consent.", "china": "Japan’s Meiji Constitution took effect, and the first Imperial Diet met in November after Japan’s first general election. In China, Zhang Zhidong began building the Hanyang Iron Works."}, "1898": {"us": "After the Maine blew up, the US fought Spain from April to August and annexed Hawaii in July. In November a white mob overthrew the elected government of Wilmington, North Carolina.", "latam": "US forces landed in Cuba and Puerto Rico, ending four centuries of Spanish rule there. In December’s Treaty of Paris, Spain gave up Cuba and ceded Puerto Rico to the US.", "europe": "Émile Zola’s “J’accuse…!” blew open the Dreyfus Affair in France. Germany passed its first Navy Law, Bismarck died in July, and an anarchist assassinated Austria’s Empress Elisabeth in Geneva.", "russia": "Marxists met in Minsk to found the Russian Social Democratic Labour Party. Russia leased Port Arthur from China, and the new Moscow Art Theatre staged Chekhov’s “The Seagull.”", "mideast": "Kaiser Wilhelm II toured the Ottoman Empire, riding into Jerusalem and visiting Saladin’s tomb in Damascus. On the Nile, an Anglo-Egyptian army crushed the Mahdist state at Omdurman.", "africa": "At Fashoda in Sudan, British and French forces faced off over the upper Nile, nearly causing war. In Sierra Leone, Bai Bureh led the Hut Tax War against British rule.", "india": "Bubonic plague, raging since 1896, spread from Bombay to Calcutta, and harsh British controls provoked anger. In December, Swami Vivekananda consecrated Belur Math near Calcutta.", "china": "The Guangxu Emperor’s Hundred Days’ Reform ended in September when Empress Dowager Cixi took control. Germany, Russia and Britain seized leases, including Hong Kong’s New Territories for 99 years."}, "1906": {"us": "An earthquake and fires destroyed much of San Francisco in April. After Upton Sinclair’s “The Jungle,” Congress passed the Pure Food and Drug Act and the Meat Inspection Act.", "latam": "The US occupied Cuba again in September after a revolt, and an earthquake devastated Valparaíso, Chile. In Mexico, a strike at the Cananea copper mine was crushed.", "europe": "Liberals won a British landslide, and 29 Labour MPs entered Parliament. France cleared Alfred Dreyfus, and the Algeciras Conference settled a Franco-German crisis over Morocco.", "russia": "Russia’s first elected parliament, the State Duma, opened in May and was dissolved after ten weeks. New prime minister Pyotr Stolypin launched land reforms and field courts against revolutionaries.", "mideast": "Protests forced Persia’s shah to grant a constitution, and the first Majlis met in October. In Egypt, British courts hanged four villagers after the Denshawai incident, stirring nationalist anger.", "africa": "Zulu chief Bambatha led a revolt against a poll tax in Natal, crushed with heavy loss of life. In German East Africa, the Maji Maji uprising was being brutally suppressed.", "india": "The All-India Muslim League was founded in Dhaka in December. Bengalis boycotted British goods over the partition of Bengal, and Dadabhai Naoroji called for swaraj, self-rule.", "china": "The Qing court announced it would prepare for a constitution, a year after abolishing the old civil service exams. Japan founded the South Manchuria Railway Company."}, "1907": {"us": "A banking panic in October was calmed when J.P. Morgan organized a rescue. Oklahoma became a state, and the Great White Fleet set off around the world in December.", "latam": "In Chile, soldiers massacred striking nitrate miners and their families at a school in Iquique in December. Central American states met in Washington and created a Central American Court of Justice.", "europe": "Britain and Russia settled their rivalry in the Anglo-Russian Convention, forming the Triple Entente with France. Delegates met at the Second Hague Peace Conference, and Picasso painted “Les Demoiselles d’Avignon.”", "russia": "In June, Stolypin dissolved the Second Duma and rewrote election rules to favor landowners. Russia and Britain settled their Asian rivalry in the Anglo-Russian Convention.", "mideast": "The Anglo-Russian Convention split Persia into Russian and British spheres without asking Persians. In Egypt, Lord Cromer retired, and Mustafa Kamil founded the Nationalist Party.", "africa": "In the Transvaal, Mohandas Gandhi led Indians in resisting the “Black Act” requiring them to register. In German East Africa, the Maji Maji rebellion ended after famine killed tens of thousands.", "india": "The Indian National Congress split between moderates and radicals at its Surat session. Punjab leader Lala Lajpat Rai was deported to Mandalay, and Tata Iron and Steel was founded.", "china": "Revolutionary Qiu Jin was executed by the Qing in July. Japan forced Korea’s Emperor Gojong to abdicate and disbanded the Korean army."}, "1908": {"us": "William Howard Taft won the presidential election, and the Bureau of Investigation, forerunner of the FBI, was founded. Orville Wright demonstrated his airplane to the Army at Fort Myer.", "latam": "Juan Vicente Gómez seized power in Venezuela in December, starting a 27-year rule. In Mexico, Porfirio Díaz told a US journalist the country was ready for democracy.", "europe": "Austria-Hungary annexed Bosnia and Herzegovina, enraging Serbia, and Bulgaria declared full independence. London hosted the Olympic Games, and Wilbur Wright amazed crowds flying in France.", "russia": "On 30 June a huge explosion, likely an incoming meteor or comet, flattened about 2,000 square km of forest near Tunguska, Siberia. Russia was humiliated in the Bosnian crisis.", "mideast": "The Young Turk Revolution forced Sultan Abdul Hamid II to restore the constitution. In Persia, British prospectors struck oil at Masjed Soleyman, and the Hejaz Railway reached Medina.", "africa": "Belgium annexed the Congo Free State from King Leopold II after reports of mass atrocities. Delegates from four British colonies met to plan a Union of South Africa.", "india": "Bal Gangadhar Tilak was jailed for six years in Mandalay for sedition. Eighteen-year-old Khudiram Bose was hanged after a bomb attack in Muzaffarpur.", "china": "The Guangxu Emperor and Empress Dowager Cixi died a day apart in November. Puyi, aged two, became the last Qing emperor."}, "1912": {"us": "Woodrow Wilson won a four-way presidential race against Taft, Theodore Roosevelt and Eugene Debs. New Mexico and Arizona became states, and textile workers struck in Lawrence, Massachusetts.", "latam": "US Marines landed in Nicaragua to prop up its government. Argentina’s Sáenz Peña Law brought secret, compulsory male voting, and Mexico’s President Madero fought off rebellions.", "europe": "Stockholm hosted the Summer Olympics. In October, Serbia, Bulgaria, Greece and Montenegro attacked the Ottoman Empire in the First Balkan War, seizing most of its European lands.", "russia": "Troops fired on striking workers at the Lena goldfields in Siberia, killing or wounding hundreds and sparking strikes nationwide. The Bolsheviks launched their newspaper Pravda in St. Petersburg.", "mideast": "Italy took Libya from the Ottoman Empire in the Treaty of Ouchy in October, as Balkan armies advanced on Istanbul. France made Morocco a protectorate under the Treaty of Fez.", "africa": "In January, Black leaders meeting in Bloemfontein founded the South African Native National Congress, later the ANC. Frederick Lugard returned to Nigeria to merge its northern and southern protectorates.", "india": "Delhi became the new capital of British India in place of Calcutta. In December a bomb wounded Viceroy Lord Hardinge as he rode an elephant into Delhi.", "china": "The last Qing emperor, Puyi, abdicated in February, ending over 2,000 years of imperial rule, and Yuan Shikai became president. In Japan, Emperor Meiji died, opening the Taishō era."}, "1916": {"us": "Pancho Villa raided Columbus, New Mexico, and US troops chased him into Mexico. Wilson won reelection on “He kept us out of war,” and Montana elected Jeannette Rankin, the first congresswoman.", "latam": "US Marines occupied the Dominican Republic, staying until 1924. Argentina held its first presidential election by secret ballot and chose Hipólito Yrigoyen of the Radical Civic Union.", "europe": "Germany and France bled at Verdun for ten months, and the British and German fleets clashed off Jutland. In Dublin, Irish republicans launched the Easter Rising.", "russia": "General Brusilov’s summer offensive smashed Austro-Hungarian lines but cost huge losses. In December, nobles murdered Rasputin, the mystic who influenced the royal family.", "mideast": "Sharif Hussein of Mecca launched the Arab Revolt against Ottoman rule in June. In April, a besieged British-Indian army surrendered to the Ottomans at Kut in Mesopotamia.", "africa": "Allied troops under Jan Smuts pushed into German East Africa against Paul von Lettow-Vorbeck’s forces. In Ethiopia, Lij Iyasu was deposed, and Zewditu became empress with Ras Tafari as regent.", "india": "Congress and the Muslim League agreed the Lucknow Pact, a joint demand for self-government. Tilak and Annie Besant founded Home Rule Leagues, while Indian troops fought in Mesopotamia.", "china": "Yuan Shikai tried to make himself emperor, gave up after provinces revolted, and died in June. China slid into the warlord era."}, "1918": {"us": "Wilson set out his Fourteen Points for peace in January. Over a million US troops fought in the Meuse-Argonne Offensive, and Congress passed the Sedition Act, curbing criticism of the war.", "latam": "Students in Córdoba, Argentina, launched a university reform movement that spread across Latin America. Brazil, the only South American country at war, sent a naval squadron and doctors to Europe.", "europe": "Germany’s spring offensive failed, and the Armistice ended the fighting on 11 November. The Kaiser abdicated, Austria-Hungary broke apart, and many British women over 30 gained the vote.", "russia": "The Bolsheviks signed the Treaty of Brest-Litovsk with Germany in March, giving up vast lands, and moved the capital to Moscow. Civil war spread, and the royal family was shot in July.", "mideast": "British and Arab forces took Damascus in October, and the Ottoman Empire signed the Armistice of Mudros on 30 October, ending its war. Allied ships soon anchored off Istanbul.", "africa": "The Spanish flu spread along ports and railways, killing an estimated 300,000 in South Africa alone. Lettow-Vorbeck’s German force surrendered in Northern Rhodesia two weeks after the Armistice.", "india": "Influenza killed an estimated 12 million or more Indians, the highest toll anywhere. Gandhi led protests in Kheda and Ahmedabad, and the Montagu-Chelmsford Report proposed limited self-rule.", "china": "In Japan, soaring rice prices sparked riots, and Hara Takashi became the first commoner prime minister. Japan sent troops into Siberia, and in China Lu Xun published “A Madman’s Diary.”"}, "1923": {"us": "President Warren Harding died in August, and Calvin Coolidge was sworn in by his father by lamplight in Vermont. Time magazine launched, and the Hollywoodland sign went up.", "latam": "Pancho Villa was assassinated in July. Mexico and the US signed the Bucareli Agreements, and Washington recognized Álvaro Obregón’s government.", "europe": "General Primo de Rivera seized power in Spain in September. In Munich, Adolf Hitler’s Beer Hall Putsch failed in November, and the Irish Civil War ended in May.", "russia": "Lenin was disabled by a stroke in March, and a power struggle grew among Stalin, Trotsky and others. The new Soviet Union approved its first constitution.", "mideast": "The Treaty of Lausanne set Turkey’s borders, and on 29 October Mustafa Kemal proclaimed the Republic of Turkey with Ankara as capital. Egypt adopted a constitution under King Fuad.", "africa": "Ethiopia joined the League of Nations, and Southern Rhodesia’s white settlers gained self-government. In Kenya, a British white paper declared African interests paramount.", "india": "C. R. Das and Motilal Nehru launched the Swaraj Party to contest elections and fight British rule from inside the councils, while Gandhi sat in prison.", "china": "The Great Kantō earthquake on 1 September destroyed much of Tokyo and Yokohama, killing over 100,000. In China, Sun Yat-sen allied with the Soviet Union to rebuild his Nationalist party."}, "1929": {"us": "Herbert Hoover took office in March, a month after Chicago's St. Valentine's Day Massacre. In October the stock market crashed, ending the Roaring Twenties boom.", "latam": "Mexico's Cristero War ended, and Plutarco Elías Calles founded the National Revolutionary Party, forerunner of the PRI. Chile and Peru settled their long Tacna–Arica border dispute.", "europe": "Mussolini's Italy and the Holy See signed the Lateran Treaty, creating Vatican City. Ramsay MacDonald formed Britain's second Labour government, and experts drew up the Young Plan to ease German reparations.", "russia": "Stalin expelled his rival Leon Trotsky from the Soviet Union. In December he called for “liquidating the kulaks as a class”, unleashing forced collectivization of the countryside.", "mideast": "In British-ruled Palestine, riots in August killed about 250 Jews and Arabs, including a massacre of Jews in Hebron. In Arabia, Ibn Saud crushed the Ikhwan revolt at Sabilla.", "africa": "In southeastern Nigeria, thousands of Igbo women rose against British-appointed chiefs and rumored taxes in the Women's War. Jomo Kenyatta went to London to press Kikuyu land grievances.", "india": "Bhagat Singh threw low-power bombs into Delhi's Central Legislative Assembly in April. In December, the Congress under Jawaharlal Nehru demanded Purna Swaraj, complete independence from Britain.", "china": "Chiang Kai-shek's Nationalists ruled from Nanjing, where Sun Yat-sen was reburied in a vast mausoleum. A clash over the Chinese Eastern Railway brought Soviet troops into Manchuria."}, "1930": {"us": "Hoover signed the Smoot–Hawley Tariff in June as unemployment climbed. Clyde Tombaugh discovered Pluto, and in December the Bank of United States collapsed in New York.", "latam": "Uruguay hosted and won the first football World Cup. Coups ousted Argentina's President Hipólito Yrigoyen and brought Getúlio Vargas to power in Brazil.", "europe": "In September elections, Hitler's Nazis jumped from 12 to 107 Reichstag seats. Chancellor Heinrich Brüning governed by emergency decree, and the last Allied troops left the Rhineland.", "russia": "Forced collectivization herded peasants onto collective farms, and families branded kulaks were deported east. Stalin's article “Dizzy with Success” briefly slowed the drive, and the Gulag was founded.", "mideast": "Britain signed a treaty promising Iraq independence. Turkey made “Istanbul” the city's official name and let women vote in local elections, while Egypt's Ismail Sidqi replaced the constitution.", "africa": "Ras Tafari was crowned Emperor Haile Selassie of Ethiopia in November. In Liberia, a League of Nations report on forced labor led President Charles King to resign.", "india": "Gandhi's 24-day Salt March to Dandi defied British law and sparked mass civil disobedience. Tens of thousands were jailed, and London hosted the first Round Table Conference.", "china": "Chiang Kai-shek defeated rival warlords in the Central Plains War, which left hundreds of thousands of casualties. In Japan, Prime Minister Hamaguchi Osachi was shot after accepting the London Naval Treaty."}, "1933": {"us": "Franklin D. Roosevelt took office in March, declared a national bank holiday and pushed a burst of New Deal laws through Congress in his first Hundred Days. Prohibition ended in December.", "latam": "A general strike toppled Cuban dictator Gerardo Machado, and Sergeant Fulgencio Batista rose to power in September's Sergeants' Revolt. Bolivia and Paraguay kept fighting the Chaco War.", "europe": "Hitler became German chancellor on 30 January. After the Reichstag fire, the Enabling Act let him rule by decree, and Dachau concentration camp opened in March.", "russia": "Famine killed millions across the Soviet Union, above all in Ukraine and Kazakhstan, as grain was seized from villages. In November the United States formally recognized the Soviet government.", "mideast": "Saudi Arabia granted an oil concession to Standard Oil of California. In newly independent Iraq, the army massacred Assyrian villagers at Simele, and King Faisal I died in September.", "africa": "In South Africa, rivals J.B.M. Hertzog and Jan Smuts formed a coalition government. Godfrey Huggins became prime minister of white-ruled Southern Rhodesia, a post he held for two decades.", "india": "Student Choudhry Rahmat Ali coined the name “Pakistan” in a pamphlet written in Cambridge. Gandhi launched his weekly Harijan and fasted for 21 days in his campaign against untouchability.", "china": "Japan seized Rehe province and quit the League of Nations over criticism of its Manchurian takeover. Chiang Kai-shek launched his fifth campaign against the Communists' Jiangxi base."}, "1935": {"us": "Roosevelt signed the Social Security Act and the Wagner Act protecting unions, and the new WPA put millions to work. Senator Huey Long was assassinated in Louisiana in September.", "latam": "The Chaco War ended in a ceasefire favoring Paraguay. Tango star Carlos Gardel died in a plane crash in Medellín, and Venezuela's longtime dictator Juan Vicente Gómez died in December.", "europe": "The Saar voted to rejoin Germany, and Hitler restored military conscription in defiance of the Versailles treaty. In September the Nuremberg Laws stripped German Jews of citizenship.", "russia": "The Moscow Metro opened in May. Miner Alexei Stakhanov's record coal shift launched a campaign to boost output, while arrests spread after the murder of party boss Sergei Kirov.", "mideast": "Reza Shah asked foreign governments to call Persia “Iran”. In British Palestine, police killed the militant preacher Izz ad-Din al-Qassam, whose death helped spark the 1936 Arab revolt.", "africa": "Mussolini's Italy invaded Ethiopia in October, and the League of Nations imposed limited sanctions. In Northern Rhodesia, African miners on the Copperbelt struck over a sudden tax increase.", "india": "An earthquake destroyed Quetta in May, killing tens of thousands. Britain passed the Government of India Act, promising elected provincial governments, and the Reserve Bank of India opened.", "china": "Mao Zedong gained a leading role at the Zunyi Conference, and the Red Army's Long March ended in Shaanxi in October. In December, students in Peiping (Beijing) protested Japanese encroachment."}, "1938": {"us": "Superman debuted in Action Comics, and Joe Louis knocked out Max Schmeling in one round. The Fair Labor Standards Act set the first federal minimum wage, 25 cents an hour.", "latam": "Mexican President Lázaro Cárdenas nationalized foreign oil companies on 18 March, creating the state firm Pemex. In Brazil, Getúlio Vargas's dictatorship crushed an attempted coup by the fascist Integralists.", "europe": "Germany annexed Austria in March and took the Sudetenland after the Munich Agreement. On Kristallnacht in November, Nazi mobs attacked Jews, synagogues and shops across Germany.", "russia": "Nikolai Bukharin was convicted in the last Moscow show trial and shot. Soviet troops fought Japan at Lake Khasan, and Lavrentiy Beria took over the NKVD as the purge wound down.", "mideast": "Drillers struck oil at Dammam in Saudi Arabia and at Burgan in Kuwait. Turkey's founder Mustafa Kemal Atatürk died on 10 November, and the Arab revolt raged on in Palestine.", "africa": "Afrikaners marked the centenary of the Great Trek with an ox-wagon trek across South Africa, fueling nationalism. Jomo Kenyatta published “Facing Mount Kenya”, a study of Kikuyu life.", "india": "Subhas Chandra Bose became Congress president at the Haripura session, urging a tougher line against British rule. Congress ministries, elected in 1937, governed most of India's provinces.", "china": "Nationalist forces won at Taierzhuang, then breached the Yellow River dikes to slow Japan, a flood that killed hundreds of thousands. After Wuhan fell in October, the government retreated to Chongqing."}, "1939": {"us": "Marian Anderson sang at the Lincoln Memorial after being barred from Constitution Hall, and the New York World's Fair opened. After war began in Europe, Congress allowed cash-and-carry arms sales.", "latam": "An earthquake destroyed Chillán, Chile, in January, killing about 28,000 people. In December the German warship Admiral Graf Spee was scuttled off Montevideo after the Battle of the River Plate.", "europe": "Germany seized Prague in March, and Franco won Spain's civil war. Germany invaded Poland on 1 September, and Britain and France declared war two days later.", "russia": "Stalin signed a pact w
