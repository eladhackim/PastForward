anuary 1848, and Parisians toppled King Louis-Philippe in February. In March, Vienna’s uprising forced Chancellor Metternich to flee, and Berliners fought troops on barricades. Rebels demanded constitutions, free speech and national unity after bad harvests and an economic crisis."}, "now": {"year": 2019, "short": "2019 Protests", "title": "The Global Protest Wave of 2019", "where": "From Santiago to Beirut", "region": "world", "hook": "October 2019: huge crowds in Santiago, Beirut and Baghdad, all in the same weeks.", "text": "In 2019, protests often sparked by everyday costs spread across continents: a metro fare rise in Chile, a WhatsApp tax in Lebanon, fuel subsidy cuts in Ecuador. Sudan’s Omar al-Bashir and Algeria’s Abdelaziz Bouteflika were forced out, and the prime ministers of Lebanon and Iraq resigned."}, "followed": "By 1849 most revolts had been crushed and conservative rule restored. Yet the Austrian Empire’s end of serfdom stuck, and nationalism fed Italian and German unification within about two decades.", "next": {"short": "Protest Wave", "title": "Protests leap across a connected planet", "text": "Around 2190, a shared shock, perhaps a price spike or a viral image, might set off protests in dozens of countries within days. Some leaders could fall while the systems behind them adapt and survive.", "watch": "Watch for living-cost shocks hitting many countries at once, crowded young cities, and leaders who stay in power for decades."}, "breaks": "The 1848 rebels shared ideas of liberty and nationhood across one continent, while the 2019 protests had mostly separate, local causes across many.", "older": "The revolutions of 1830", "topic": "society", "echoes": [{"year": -499, "short": "Ionian Revolt", "title": "The Ionian Revolt against Persia", "region": "mideast", "line": "Miletus’s leader ousted Persian-backed tyrants across Ionia, and the revolt leapt to Caria, Byzantium and Cyprus, according to Herodotus, the main source."}, {"year": 1381, "short": "Revolts 1378–82", "title": "Europe’s wave of revolts, 1378 to 1382", "region": "europe", "line": "Within five years, worker, peasant and tax revolts erupted in Florence, Ghent, England, Rouen and Paris, as news passed between them."}, {"year": 1820, "short": "1820 Revolts", "title": "The revolutions of 1820", "region": "europe", "line": "A Spanish army revolt forced the king to restore a liberal constitution, and within months revolts broke out in Naples and Portugal."}, {"year": 1830, "short": "1830 Revolts", "title": "The revolutions of 1830", "region": "europe", "line": "France’s July Revolution toppled Charles X, and within months revolts broke out in Belgium, which won independence, and in Russian-ruled Poland."}, {"year": 1919, "short": "1919 Uprisings", "title": "The anticolonial uprisings of 1919", "region": "world", "line": "In spring 1919, mass protests against foreign domination erupted in Egypt, Korea, India and China, all invoking Wilson’s promise of self-determination."}, {"year": 1968, "short": "1968 Protests", "title": "The global protests of 1968", "region": "world", "line": "Protests swept Paris, West Germany, Mexico City and US campuses within months, as students worldwide shared slogans and television images."}, {"year": 1989, "short": "1989 Revolutions", "title": "The fall of communism in Eastern Europe", "region": "europe", "line": "Within months, communist governments fell in Poland, Hungary, East Germany, Bulgaria, Czechoslovakia and Romania, each crowd inspired by the last."}, {"year": 2011, "short": "Arab Spring", "title": "The Arab Spring", "region": "mideast", "line": "After Tunisia’s ruler fled, protests leapt within weeks to Egypt, Libya, Yemen, Bahrain and Syria, spread by satellite TV and social media."}], "opp": {"lastTime": "Peasants in the Austrian Empire were freed from forced labour dues in September 1848, and Piedmont, Switzerland and the Netherlands gained new constitutions. Exiled “Forty-Eighters” like Carl Schurz built new careers in the United States.", "ideas": [{"kind": "build", "title": "Tools for citizens’ assemblies", "line": "Platforms that run citizens’ assemblies, consultations and participatory budgets may be in demand where protests push governments to rewrite rules, as in Chile.", "guide": {"what": "Software and services that help governments run citizens’ assemblies, consultations and participatory budgets, where ordinary people, often picked by lottery, discuss and propose policies.", "why": "After 1848, several states gained new constitutions, and Chile’s 2019 protests led to a constitutional process. When protest waves push governments to rewrite rules, tools for structured public input may be in demand.", "how": ["Try Decidim, the free open-source platform Barcelona built for public participation.", "Read the OECD’s good practice principles for deliberative processes.", "Ask your city council how residents can propose or vote on budget items."], "read": [{"title": "Decidim, open-source participatory democracy platform", "url": "https://decidim.org/"}, {"title": "OECD Good Practice Principles for Deliberative Processes (PDF)", "url": "https://www.oecd.org/content/dam/oecd/en/topics/policy-issue-focus/innovative-citizen-participation/good-practice-principles-for-deliberative-processes-for-public-decision-making.pdf"}]}}, {"kind": "build", "title": "Verifying viral protest footage", "line": "Services that verify viral videos and images by time and place could help newsrooms and rights groups when protests leap between countries.", "guide": {"what": "Services that check whether viral protest videos and photos are real, recent and filmed where claimed, using maps, shadows, weather records and file data.", "why": "In 1848, news of revolt spread through newspapers over weeks; in 2019, images from Santiago to Beirut spread within hours. If protests again leap between countries, newsrooms and rights groups may need fast, reliable checks.", "how": ["Read the free Verification Handbook for Disinformation and Media Manipulation.", "Practise locating a news photo using satellite maps and street-level imagery.", "Explore Bellingcat’s online toolkit of open-source investigation tools."], "read": [{"title": "Verification Handbook for Disinformation and Media Manipulation", "url": "https://datajournalism.com/read/handbook/verification-3"}, {"title": "Bellingcat’s Online Investigation Toolkit", "url": "https://bellingcat.gitbook.io/toolkit"}]}}, {"kind": "work", "title": "Mediators and dialogue facilitators", "line": "Mediators who bring governments, unions and protest groups to the table, as Tunisia’s National Dialogue Quartet did, tend to be needed after protest waves.", "guide": {"what": "Professionals who bring opposing sides, such as governments, unions and protest groups, to the table and guide talks toward agreements both can accept.", "why": "Most 1848 revolts were crushed within a year. After 2011, Tunisia’s National Dialogue Quartet steered talks between rival camps and won the 2015 Nobel Peace Prize. Skilled mediators may be needed after future protest waves.", "how": ["Read the Nobel Prize page on how Tunisia’s Quartet brokered its national dialogue.", "Look for an accredited mediation course, often run by courts, universities or bar associations.", "Volunteer as a community or workplace mediator to build practice."], "read": [{"title": "National Dialogue Quartet: Facts (NobelPrize.org)", "url": "https://www.nobelprize.org/prizes/peace/2015/tndq/facts/"}]}}, {"kind": "learn", "title": "Constitutional design basics", "line": "Knowing how constitutions, electoral systems and term limits are designed helps, as Chile’s 2019 protests led to two rejected drafts in 2022 and 2023.", "guide": {"what": "How constitutions are written and what choices they contain: how leaders are elected, how power is split, which rights are protected, and how the rules can change.", "why": "The 1848 revolts brought new constitutions in Piedmont, Switzerland and the Netherlands. Chile’s 2019 protests led to two drafts, rejected in 2022 and 2023. Knowing the design choices may help if another wave demands new rules.", "how": ["Use Constitute to compare how different countries set presidential term limits.", "Read International IDEA’s free primer What is a Constitution?", "Pick one rejected Chilean draft and list the changes that proved most divisive."], "read": [{"title": "Constitute: the world’s constitutions to read and compare", "url": "https://www.constituteproject.org/"}, {"title": "What is a Constitution? (International IDEA primer)", "url": "https://www.idea.int/publications/catalogue/what-is-a-constitution"}]}}], "watch": "Watch for the same living-cost shock, such as a fuel or food price spike, hitting many import-dependent countries in the same season."}}, {"id": "cable", "theme": "Wiring the planet for instant contact", "rhyme": 2, "then": {"year": 1858, "short": "Atlantic Cable", "title": "The First Transatlantic Telegraph Cable", "where": "Ireland to Newfoundland", "region": "world", "hook": "Queen Victoria and President Buchanan traded messages under the Atlantic, and then the cable died.", "text": "Cyrus Field’s company completed a cable from Ireland to Newfoundland on 5 August 1858. Queen Victoria’s 98-word greeting to President Buchanan took about 16 hours to send. New York celebrated with fireworks that set City Hall alight, but the cable failed after about three weeks."}, "now": {"year": 2019, "short": "Starlink", "title": "SpaceX Launches the First Starlink Satellites", "where": "Cape Canaveral, United States", "region": "us", "hook": "2019: a neat line of bright dots gliding across the night sky, Starlink’s first satellites.", "text": "In May 2019 a Falcon 9 rocket carried 60 Starlink satellites into orbit, the start of SpaceX’s plan to beam internet everywhere. Astronomers soon complained of streaks across their images. Within six years, thousands of satellites served millions of users, including Ukraine’s military."}, "followed": "In 1866 the giant steamship Great Eastern laid a lasting cable. Within decades, undersea lines linked every inhabited continent, letting markets, newspapers and empires react within hours.", "next": {"short": "Solar Web", "title": "A network stretching across the solar system", "text": "Around 2180, laser links might join Earth, the Moon and settlements on Mars into one network. Even at light speed, each message to Mars would take between about 3 and 22 minutes.", "watch": "Watch deep-space laser tests, the crowding of low Earth orbit, and how much of the world’s connectivity a few companies control."}, "breaks": "The 1858 cable linked just two points and soon died, while Starlink kept growing into a global network run by a single company.", "older": "Claude Chappe’s optical telegraph, 1794", "topic": "tech", "echoes": [{"year": 840, "short": "Beacon Chain", "title": "Byzantium’s fire beacons warn the capital", "region": "europe", "line": "Under Emperor Theophilos, nine hilltop fire beacons could flash warnings of Arab raids about 720 km to Constantinople within an hour."}, {"year": 1794, "short": "Chappe Telegraph", "title": "Chappe’s optical telegraph links Paris and Lille", "region": "europe", "line": "Claude Chappe’s 15 semaphore towers spanned 230 km from Lille to Paris and reported the recapture of Le Quesnoy within an hour."}, {"year": 1901, "short": "Marconi Signal", "title": "Marconi’s radio signal crosses the Atlantic", "region": "world", "line": "Guglielmo Marconi reported hearing the Morse letter “S” in Newfoundland, sent by radio from Cornwall, showing signals could cross oceans without wires."}, {"year": 1903, "short": "Pacific Cable", "title": "Roosevelt’s message circles the globe by cable", "region": "world", "line": "A new Pacific cable via Hawaii reached Manila, and Roosevelt’s July 4 greeting became the first message sent around the world."}, {"year": 1956, "short": "TAT-1 Cable", "title": "The first transatlantic telephone cable opens", "region": "world", "line": "TAT-1 linked Scotland and Newfoundland, carrying 707 calls on its first day, far clearer than the old radio telephone service."}, {"year": 1962, "short": "Telstar", "title": "Telstar beams live TV across the Atlantic", "region": "world", "line": "The Telstar satellite relayed the first live TV across the Atlantic, and like the 1858 cable, it failed within months."}, {"year": 1988, "short": "TAT-8 Fiber", "title": "The first transatlantic fiber-optic cable", "region": "world", "line": "TAT-8 linked the US, Britain and France with glass fibers able to carry 40,000 calls, the first optical cable across an ocean."}, {"year": 1998, "short": "Iridium", "title": "The Iridium satellite phone network", "region": "world", "line": "Motorola-backed Iridium put 66 satellites in low orbit so phones could call from anywhere, but went bankrupt nine months after service began."}], "opp": {"lastTime": "Cable makers like the Telegraph Construction and Maintenance Company thrived, demand for gutta-percha insulation thinned wild trees in Southeast Asia, and news agencies like Reuters sold fast foreign news. William Thomson, later Lord Kelvin, grew rich from cable patents.", "ideas": [{"kind": "build", "title": "Services for newly connected places", "line": "Telehealth, remote schooling and farm monitoring for villages, ships and islands newly reached by satellite internet could grow, as cables once opened markets.", "guide": {"what": "Services such as remote doctor visits, online schooling and farm sensors, built for villages, ships and islands that only recently gained reliable internet, often by satellite.", "why": "Undersea cables let markets and news agencies like Reuters react within hours. Satellite internet now reaches places cables never did, and the ITU counted about 2.2 billion people still offline in 2025, so new services may follow.", "how": ["Read ITU’s Facts and Figures to see which regions and groups remain offline.", "Ask a rural clinic, school or fishing co-op what better internet would let them do.", "Build a low-bandwidth version of a service that still works on patchy connections."], "read": [{"title": "ITU Facts and Figures 2025", "url": "https://www.itu.int/itu-d/reports/statistics/facts-figures-2025/"}, {"title": "GSMA: The State of Mobile Internet Connectivity 2025", "url": "https://www.gsmaintelligence.com/research/the-state-of-mobile-internet-connectivity-2025-overview-report"}]}}, {"kind": "build", "title": "Tracking crowded orbits", "line": "Services that track satellites and debris and warn of collisions may be in demand as tens of thousands more satellites launch.", "guide": {"what": "Services that track satellites and space debris, predict close approaches, and warn operators in time to move a satellite out of the way.", "why": "The 1858 cable linked just two points; today thousands of Starlink satellites fill low orbit, with rival networks planned. ESA reports that debris keeps growing, so collision warnings may become an essential service.", "how": ["Read ESA’s latest Space Environment Report on debris and crowded orbits.", "Learn basic orbital mechanics through a free online course or textbook.", "Ask a satellite operator or space startup how they handle collision alerts."], "read": [{"title": "ESA Space Environment Report 2025", "url": "https://www.esa.int/Space_Safety/Space_Debris/ESA_Space_Environment_Report_2025"}]}}, {"kind": "work", "title": "Cable and satellite network technicians", "line": "Subsea cable repair crews, ground-station engineers and satellite operators may be in short supply, as Baltic and Red Sea cable cuts showed.", "guide": {"what": "Crews who lay and repair undersea cables, engineers who run satellite ground stations, and operators who control satellites, keeping global internet traffic flowing.", "why": "The first Atlantic cable failed after about three weeks, and skilled crews made later cables last. Recent Baltic and Red Sea cable cuts showed how slow repairs can be, and new satellite networks also need operators.", "how": ["Read the International Cable Protection Committee’s pages on how cables are protected and repaired.", "Look for courses in fibre splicing, marine engineering or radio-frequency systems.", "Ask a telecom or satellite firm about technician apprenticeships or graduate schemes."], "read": [{"title": "International Cable Protection Committee: About", "url": "https://iscpc.org/about-the-icpc/"}]}}, {"kind": "learn", "title": "How spectrum and orbits are shared", "line": "Learning how the ITU coordinates radio spectrum and orbital filings, and how countries license satellite internet, is useful as networks compete for space.", "guide": {"what": "How countries share radio frequencies and orbital positions through the International Telecommunication Union (ITU), and how national regulators license satellite internet services.", "why": "Cable makers and patent holders like William Thomson gained from the first global network. As Starlink, the EU’s IRIS² and Chinese constellations compete for orbits and spectrum, people who understand the rules may be needed.", "how": ["Read the ITU’s overview of its Radio Regulations, the treaty for sharing spectrum.", "Follow the agenda of the next World Radiocommunication Conference on satellite issues.", "Look up how your country’s telecom regulator licenses satellite internet."], "read": [{"title": "ITU Radio Regulations", "url": "https://www.itu.int/pub/R-REG-RR"}, {"title": "ITU-R Space Services Department", "url": "https://www.itu.int/en/ITU-R/space/Pages/default.aspx"}]}}], "watch": "Watch whether rival satellite networks, such as the EU’s IRIS² and China’s constellations, reach service, and how often subsea cables are cut."}}, {"id": "carrington", "theme": "A solar storm tests a wired world", "rhyme": 2, "then": {"year": 1859, "short": "Carrington", "title": "The Carrington Event", "where": "Worldwide", "region": "world", "hook": "The most intense solar storm on record made telegraphs spark and lit auroras near the tropics.", "text": "On 1 September 1859, English astronomer Richard Carrington saw a brilliant white flare on the Sun. About 18 hours later a severe geomagnetic storm struck, shocking telegraph operators and letting some lines work with batteries disconnected. Auroras were seen as far south as Cuba and Hawaii."}, "now": {"year": 2024, "short": "Gannon Storm", "title": "The May 2024 Gannon Solar Storm", "where": "Worldwide", "region": "world", "hook": "May 2024: phone photos of pink and green skies from places that rarely see auroras.", "text": "From 10 May 2024, eruptions from a giant sunspot group caused the first “extreme” G5 geomagnetic storm since 2003, later named after scientist Jennifer Gannon. Auroras appeared as far south as Mexico and northern India. GPS errors stalled some self-steering tractors at planting time, but no major blackouts followed."}, "followed": "Telegraphs recovered within days, and 1859 became the benchmark for worst-case planning. In March 1989 a weaker storm blacked out Quebec’s power grid for about nine hours.", "next": {"short": "Superstorm", "title": "A Carrington-sized storm hits a wired world", "text": "Around 2189, a storm as strong as 1859’s might hit a world running on satellites, grids and perhaps settlements in space. A day’s warning could let operators power down in time; a late warning could mean weeks of blackouts.", "watch": "Watch investment in solar early-warning spacecraft, grid hardening against geomagnetic currents, and near misses like the large July 2012 eruption."}, "breaks": "The 2024 storm was far weaker than 1859’s, and forecasters issued warnings a day or more ahead, something Victorian telegraph operators never had.", "older": "The great aurora seen over Japan and China, 1770", "topic": "disaster", "echoes": [{"year": 774, "short": "Miyake Event", "title": "Tree rings record the 774 solar storm", "region": "world", "line": "Tree rings worldwide record a carbon-14 spike, likely from a solar storm, the strongest in 11,000 years; a repeat could cripple satellites."}, {"year": 1770, "short": "1770 Aurora", "title": "The great aurora over Japan and China", "region": "world", "line": "Auroras lit skies over Japan and China for about nine nights, and Cook’s crew saw them near Timor, a storm rivaling Carrington’s."}, {"year": 1872, "short": "1872 Storm", "title": "The great solar storm of 1872", "region": "world", "line": "A storm rivaling Carrington’s lit auroras as far south as Bombay and disrupted telegraph lines, including the Bombay to Aden undersea cable."}, {"year": 1921, "short": "Railroad Storm", "title": "The 1921 New York Railroad Storm", "region": "world", "line": "Storm currents set a Swedish telegraph exchange and New York railroad signal equipment ablaze, and disrupted telegraphs on several continents."}, {"year": 1967, "short": "Radar Jammed", "title": "A solar storm jams US radar", "region": "us", "line": "A solar storm jammed US missile-warning radars, and commanders who suspected Soviet jamming readied aircraft until forecasters blamed the sun."}, {"year": 1972, "short": "Sea Mine Storm", "title": "The August 1972 solar storm", "region": "world", "line": "A fast solar storm knocked out a Midwest phone cable and likely set off dozens of US sea mines off Vietnam."}, {"year": 1989, "short": "Quebec Blackout", "title": "Solar storm blacks out Quebec", "region": "world", "line": "A geomagnetic storm collapsed Hydro-Québec’s grid in under 90 seconds, leaving millions in Quebec without power for about nine hours."}, {"year": 2003, "short": "Halloween Storms", "title": "The 2003 Halloween solar storms", "region": "world", "line": "Solar storms blacked out part of southern Sweden for an hour, forced satellites into safe mode and rerouted polar flights."}, {"year": 2022, "short": "Starlink Losses", "title": "A solar storm downs Starlink satellites", "region": "world", "line": "A minor geomagnetic storm swelled the upper atmosphere, dragging 38 of 49 newly launched Starlink satellites down to burn up."}], "opp": {"lastTime": "After the 1989 Quebec blackout, Hydro-Québec spent heavily on grid protection, and US rules approved in 2016 required utilities to assess solar storm risk. NOAA’s DSCOVR satellite was launched in 2015 to give earlier warnings from about 1.5 million km away.", "ideas": [{"kind": "build", "title": "Backup positioning and timing", "line": "Positioning and timing backups that keep farms, ships, phone networks and banks running when GPS signals fail may be needed, as May 2024 showed.", "guide": {"what": "Systems that provide location and precise time when GPS and other satellite signals fail or are jammed, using ground radio beacons, time sent over fibre, or onboard sensors.", "why": "The 1859 storm disrupted the telegraph, then the most advanced network. In May 2024, storm-driven GPS errors stalled some self-steering tractors at planting time. Phone networks, ships and banks also rely on satellite timing.", "how": ["Read NIST’s Foundational PNT Profile on making positioning and timing more resilient.", "Ask farmers, port operators or telecom engineers what happens when GPS drops out.", "Compare backups like eLoran radio, fibre timing and inertial sensors on cost and accuracy."], "read": [{"title": "NIST IR 8323r1: Foundational PNT Profile", "url": "https://csrc.nist.gov/pubs/ir/8323/r1/final"}]}}, {"kind": "build", "title": "Storm-current protection for grids", "line": "Sensors and blocking devices that protect large transformers from storm-induced currents could find demand as grids electrify and solar storms recur.", "guide": {"what": "Sensors that measure currents induced in power lines by solar storms, and devices that stop these currents from flowing into and overheating large transformers.", "why": "In 1989 a solar storm blacked out Quebec’s grid for about nine hours, and Hydro-Québec then spent heavily on protection. As more of daily life runs on electricity, grid operators may want more monitoring and blocking devices.", "how": ["Read NERC’s TPL-007 standard on planning for geomagnetic disturbances.", "Ask a utility engineer how they watch transformer currents during solar storms.", "Study how neutral current blocking devices work and what they cost to install."], "read": [{"title": "NERC TPL-007-4: Planning for geomagnetic disturbance events (PDF)", "url": "https://www.nerc.com/globalassets/standards/reliability-standards/tpl/tpl-007-4.pdf"}]}}, {"kind": "work", "title": "Space weather forecasters", "line": "Space weather forecasters and grid resilience engineers tend to be needed, as national services like the UK Met Office’s, running since 2014, show.", "guide": {"what": "Scientists and forecasters who watch the Sun and the space around Earth, predict solar storms, and warn power grids, airlines and satellite operators.", "why": "Victorian telegraph operators had no warning in 1859; in May 2024, forecasters gave a day or more of notice. The UK Met Office has run a space weather centre since 2014, and new solar monitors may need trained staff.", "how": ["Follow the NOAA Space Weather Prediction Center’s daily forecasts for a month.", "Read how the Met Office’s space weather centre works with government and industry.", "Ask a space weather forecaster which degrees and skills led them into the job."], "read": [{"title": "NOAA Space Weather Prediction Center", "url": "https://www.spaceweather.gov/"}, {"title": "The Met Office and space weather", "url": "https://weather.metoffice.gov.uk/learn-about/space-weather/met-office-role"}]}}, {"kind": "learn", "title": "How solar storms hit technology", "line": "Learning NOAA’s storm scales and how storms affect transformers, GPS and satellites, like the roughly 40 Starlink satellites lost in February 2022, is useful.", "guide": {"what": "How eruptions from the Sun disturb Earth’s magnetic field, and how that can overload transformers, scramble GPS, disrupt radio and drag satellites down from orbit.", "why": "Carrington’s 1859 storm made telegraphs spark. In February 2022 a minor storm doomed about 40 new Starlink satellites, and in 2024 GPS errors stalled tractors. As technology spreads, these weak points may matter more.", "how": ["Learn NOAA’s G, S and R scales for geomagnetic storms, radiation and radio blackouts.", "Read ESA’s space weather pages on effects on satellites and power grids.", "Set up aurora or storm alerts and compare forecasts with what actually happens."], "read": [{"title": "NOAA Space Weather Scales", "url": "https://www.spaceweather.gov/noaa-scales-explanation"}, {"title": "ESA: Space weather", "url": "https://www.esa.int/Space_Safety/Space_weather"}]}}], "watch": "Watch first data from new solar monitors like NOAA’s SWFO-L1, launched in 2025, and grid rules on geomagnetic risk."}}, {"id": "commune", "theme": "French crowds rise against a distant government", "rhyme": 1, "then": {"year": 1871, "short": "Paris Commune", "title": "The Paris Commune", "where": "Paris, France", "region": "europe", "hook": "After France lost to Prussia, Paris workers ran the city themselves for 72 days.", "text": "On 18 March 1871, Paris National Guards stopped the army seizing their cannons, and Adolphe Thiers’ government withdrew to Versailles. The Commune separated church and state and banned night work in bakeries. In the “Bloody Week” of late May, Communards shot hostages including the archbishop, and troops retaking Paris killed thousands."}, "now": {"year": 2018, "short": "Yellow Vests", "title": "The Yellow Vest Protests", "where": "France", "region": "europe", "hook": "Late 2018: high-visibility vests on French roundabouts, and tear gas by the Arc de Triomphe.", "text": "From 17 November 2018, protesters in the high-visibility vests French drivers must carry blocked roundabouts over a planned fuel tax rise. Organised on Facebook, the movement drew heavily from small towns and the countryside. After riots in Paris, President Macron dropped the tax rise and announced about €10 billion in help for low earners."}, "followed": "Tens of thousands were arrested and thousands deported to New Caledonia before an amnesty in 1880. The Third Republic survived, and Marx and later Lenin held up the Commune as a model.", "next": {"short": "Cost Revolt", "title": "A revolt against costs set from above", "text": "Around 2165, people far from power, perhaps in fading towns, might rise against costs set by a faraway capital, such as climate rules or new taxes. Their badge could again be something ordinary, like a vest.", "watch": "Watch for climate or tax rules that hit rural and car-dependent people hardest, and leaderless protests organised online."}, "breaks": "The Commune was an armed takeover of Paris crushed by the army, while the Yellow Vests were a mostly provincial protest movement that won concessions.", "older": "Étienne Marcel’s Paris revolt, 1358", "topic": "society", "echoes": [{"year": 1112, "short": "Laon Commune", "title": "Laon’s commune rises against its bishop", "region": "europe", "line": "Laon’s townspeople obtained a commune charter; when their bishop paid the king to revoke it, they rose up and killed him."}, {"year": 1358, "short": "Paris Revolt", "title": "Étienne Marcel’s revolt in Paris", "region": "europe", "line": "After the king’s capture by the English, Paris merchant leader Étienne Marcel defied the Dauphin’s government and briefly controlled the capital."}, {"year": 1382, "short": "Maillotins", "title": "The Maillotins revolt against a new tax", "region": "europe", "line": "When young Charles VI’s regents imposed a new sales tax, Parisians seized mallets from the city hall and attacked tax collectors."}, {"year": 1675, "short": "Red Caps Revolt", "title": "Brittany’s Bonnets Rouges revolt", "region": "europe", "line": "Breton peasants in red caps rose against Louis XIV’s new taxes on stamped paper, tobacco and tin goods, and were harshly crushed."}, {"year": 1789, "short": "Versailles March", "title": "The Women’s March on Versailles", "region": "europe", "line": "Angry at bread prices, Parisians led by market women marched on Versailles and forced the king to leave it for Paris."}, {"year": 1907, "short": "Winegrowers", "title": "The revolt of the Languedoc winegrowers", "region": "europe", "line": "As wine prices collapsed, up to 800,000 rallied in Montpellier, local officials resigned en masse, and Clemenceau sent troops."}, {"year": 1968, "short": "May 1968", "title": "France’s May 1968 protests and strikes", "region": "europe", "line": "Student protests grew into a general strike of millions that shook de Gaulle’s government, which protesters saw as outdated and repressive."}, {"year": 2013, "short": "Red Caps Return", "title": "Brittany’s red caps return", "region": "europe", "line": "Bretons in red caps recalling 1675 wrecked gantries built to collect a new truck ecotax, and the government suspended the tax."}, {"year": 2026, "short": "France 2026", "title": "Student-led unrest sweeps France", "region": "europe", "line": "Protests begun by students over failing public services drew 550,000 people across France on 17 October, echoing the 2018 yellow vests.", "date": "2026-10-17", "source": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/10/17/france-wave-of-nationwide-protests"}], "opp": {"lastTime": "After the 1907 winegrowers’ revolt, France cracked down on wine fraud. After the Yellow Vests, minimum-wage earners got up to €100 a month more through a top-up benefit, and France ran a Great National Debate and a citizens’ climate convention.", "ideas": [{"kind": "build", "title": "Household climate-cost calculators", "line": "Tools that show rural and car-dependent households how fuel taxes and climate rules affect them, and what aid they can claim, may be needed.", "guide": {"what": "Simple online tools that show a household how fuel taxes, carbon prices and climate rules may change its bills, and which grants or aid it could claim.", "why": "The Yellow Vests rose in 2018 over a fuel tax rise that hit rural drivers hardest, and it was dropped. An EU carbon price on road fuel and heating is due in 2028, so households may want clear cost estimates.", "how": ["Read the EU’s page on ETS2, the carbon price for buildings and road transport.", "Ask rural drivers and renters what energy aid they know they can claim.", "Build a prototype that estimates yearly fuel costs under different carbon prices."], "read": [{"title": "ETS2: buildings, road transport and additional sectors (European Commission)", "url": "https://climate.ec.europa.eu/areas-action/carbon-markets/ets2-buildings-road-transport-and-additional-sectors_en"}, {"title": "Social Climate Fund (European Commission)", "url": "https://employment-social-affairs.ec.europa.eu/policies-and-activities/funding/social-climate-fund_en"}]}}, {"kind": "build", "title": "Rural transport options", "line": "Affordable rural mobility, such as shared rides, on-demand buses and low-cost electric car leasing like France’s 2024 social leasing, could see demand.", "guide": {"what": "Affordable ways to get around without owning a costly car: shared rides, on-demand minibuses booked by app or phone, and low-cost electric car leasing.", "why": "The Yellow Vests drew heavily from small towns where people depend on cars. France’s 2024 social leasing offered electric cars for around €100 a month and filled up within weeks. Cheaper rural mobility may ease future fuel-cost anger.", "how": ["Study France’s social leasing scheme: who qualified, what it cost and why demand was high.", "Ask a rural council how people without cars reach doctors and jobs.", "Pilot a shared-ride or minibus service for one village and record demand."]}}, {"kind": "work", "title": "Citizens’ assembly facilitators", "line": "Facilitators and organisers of citizens’ assemblies, debates and consultations may be in demand as governments seek consent for costly climate rules.", "guide": {"what": "People who design and run citizens’ assemblies and public debates, where randomly chosen residents hear evidence, discuss trade-offs and make recommendations to government.", "why": "After the Yellow Vests, France held a Great National Debate and a Citizens’ Convention for Climate of 150 randomly drawn people. Governments seeking consent for costly climate rules may turn to such processes again.", "how": ["Read the OECD’s good practice principles for deliberative processes.", "Explore KNOCA’s guides and case studies on climate assemblies across Europe.", "Train in group facilitation and volunteer at local consultations or community meetings."], "read": [{"title": "KNOCA: Knowledge Network on Climate Assemblies", "url": "https://www.knoca.eu/"}, {"title": "OECD Good Practice Principles for Deliberative Processes (PDF)", "url": "https://www.oecd.org/content/dam/oecd/en/topics/policy-issue-focus/innovative-citizen-participation/good-practice-principles-for-deliberative-processes-for-public-decision-making.pdf"}]}}, {"kind": "learn", "title": "Who pays for a policy", "line": "Distributional analysis, working out how a tax or climate rule hits households by income and place, helps design rules that hold up.", "guide": {"what": "Distributional analysis: working out how a tax, subsidy or rule affects different households by income, region and lifestyle, so its costs and benefits can be seen clearly.", "why": "France’s 2018 fuel tax rise fell hardest on rural, car-dependent households and sparked the Yellow Vests. As carbon pricing spreads to fuel and heating, checking who pays first may help design rules that hold up.", "how": ["Explore EUROMOD, the EU’s tax-benefit model, to see how policies change household incomes.", "Learn what income deciles are and how to split household survey data by them.", "Pick one tax change in the news and estimate its cost for three household types."], "read": [{"title": "What is EUROMOD? (EU tax-benefit model, JRC)", "url": "https://euromod-web.jrc.ec.europa.eu/overview/what-is-euromod"}]}}], "watch": "Watch the EU’s carbon price on road fuel and heating, delayed to 2028, and how governments compensate rural and low-income households."}}, {"id": "phone", "theme": "A new phone rewires daily life", "rhyme": 2, "then": {"year": 1876, "short": "Bell’s Phone", "title": "Bell Patents the Telephone", "where": "Boston, United States", "region": "us", "hook": "“Mr. Watson, come here, I want to see you”: the famous first telephone call.", "text": "Alexander Graham Bell filed his telephone patent on 14 February 1876, the same day rival Elisha Gray filed notice of a similar idea. It was granted on 7 March. Three days later in Boston, Bell called his assistant Thomas Watson from the next room."}, "now": {"year": 2007, "short": "iPhone", "title": "Apple Unveils the iPhone", "where": "San Francisco, United States", "region": "us", "hook": "2007: Steve Jobs unveiling the iPhone on stage, then fans queuing overnight to buy one.", "text": "On 9 January 2007 at Macworld in San Francisco, Steve Jobs unveiled the iPhone, a touchscreen phone, iPod and internet device in one. It went on sale in the US on 29 June from $499 with an AT&T contract. The App Store followed in 2008."}, "followed": "Bell’s company fought off hundreds of patent challenges and grew into the Bell System. In 1915 Bell, in New York, made the first transcontinental call, to Watson in San Francisco.", "next": {"short": "Thought Phone", "title": "A device that reads thoughts goes mainstream", "text": "Around 2138, a new personal device, perhaps a brain implant or smart lens, might replace the phone. People could send words or images by thought, and daily life could reorganise around it within a decade.", "watch": "Watch brain implants moving from medical trials to healthy users, and early laws on who owns neural data."}, "breaks": "Bell’s phone took decades to reach most homes and carried only voice, while smartphones reached billions within about a decade and carried the internet.", "older": "Samuel Morse’s telegraph, 1844", "topic": "tech", "echoes": [{"year": 1840, "short": "Penny Post", "title": "Britain’s Uniform Penny Post begins", "region": "europe", "line": "A flat one-penny rate for any letter in Britain made writing cheap, and letter volume more than doubled in the first year."}, {"year": 1844, "short": "Morse Telegraph", "title": "Morse’s telegraph sends its first message", "region": "us", "line": "Samuel Morse tapped “What hath God wrought” from Washington to Baltimore; within 17 years wires spanned the continent, carrying news in minutes."}, {"year": 1973, "short": "First Cellphone", "title": "The first handheld mobile phone call", "region": "us", "line": "On a Manhattan sidewalk, Motorola’s Martin Cooper called a rival at AT&T’s Bell Labs on a brick-sized prototype, starting the mobile age."}, {"year": 1992, "short": "First Text", "title": "The first text message is sent", "region": "europe", "line": "Engineer Neil Papworth sent “Merry Christmas” to a Vodafone director’s phone, the first SMS, and texting went on to reshape daily life."}, {"year": 1999, "short": "i-mode", "title": "Japan’s i-mode puts the web on phones", "region": "world", "line": "NTT DoCoMo’s i-mode put email and websites on ordinary phones, drew over 30 million Japanese users by 2002 and popularized emoji."}], "opp": {"lastTime": "The phone created a big new job for women: Emma Nutt became the first woman telephone operator, in Boston, in 1878, and by 1950 about 342,000 operators worked for US phone companies. After 2007, building smartphone apps became a new trade.", "ideas": [{"kind": "build", "title": "Neural data privacy tools", "line": "Consent and privacy tools for brain and body data may be needed as states like Colorado and California treat neural data as sensitive.", "guide": {"what": "Software that helps companies collect brain and nerve signals, from headbands, earbuds or implants, only with clear consent, and lets users see, limit or delete that data.", "why": "The phone and the smartphone each created new trades, from operators to app builders. As brain-sensing devices spread, Colorado in 2024 and then California began treating neural data as sensitive, so firms may need consent tools.", "how": ["Read Colorado’s 2024 law that added neural data to its privacy act.", "Read UNESCO’s 2025 recommendation on the ethics of neurotechnology.", "Ask a neurotech or wearable startup how they handle consent for brain data today."], "read": [{"title": "Colorado HB24-1058: Protect Privacy of Biological Data", "url": "https://leg.colorado.gov/bills/HB24-1058"}, {"title": "UNESCO: Ethics of neurotechnology", "url": "https://www.unesco.org/en/ethics-neurotech"}]}}, {"kind": "build", "title": "Hands-free services on smart glasses", "line": "Services built for smart glasses, such as live captions for deaf users or step-by-step guidance for field repairs, could grow like early apps.", "guide": {"what": "Apps and services designed for smart glasses, such as live captions of speech for deaf users, translation, or step-by-step guidance shown to a technician during a repair.", "why": "The iPhone was followed by the App Store in 2008, and building apps became a new trade. If smart glasses catch on, early services built for them could grow in a similar way.", "how": ["Read W3C’s XR Accessibility User Requirements for ideas on serving disabled users.", "Try a pair of smart glasses and list the tasks they handle badly today.", "Ask a field technician which repair steps would be easier with hands-free guidance."], "read": [{"title": "W3C XR Accessibility User Requirements", "url": "https://www.w3.org/TR/xaur/"}]}}, {"kind": "work", "title": "Neurotech clinical and support roles", "line": "Trial coordinators, neurosurgical nurses and rehabilitation therapists who help people learn brain-computer interfaces may grow, much as operators grew around the phone.", "guide": {"what": "Jobs that help people use brain-computer interfaces: trial coordinators who run studies, neurosurgical nurses, and therapists who train patients to control devices with their thoughts.", "why": "The telephone created a big new job for women, with about 342,000 operators at US phone companies by 1950. Brain implant trials are growing, and each patient may need a team to learn the device.", "how": ["Search ClinicalTrials.gov for brain-computer interface trials to see which centres run them.", "Follow the BCI Society for research news and its international meetings.", "Ask a rehabilitation therapist or neurology nurse about training routes into this field."], "read": [{"title": "ClinicalTrials.gov", "url": "https://clinicaltrials.gov/"}, {"title": "BCI Society", "url": "https://bcisociety.org/"}]}}, {"kind": "learn", "title": "Designing beyond the touchscreen", "line": "Designing interfaces for voice, gaze and gesture, with privacy and accessibility in mind, is a skill the next device shift may reward.", "guide": {"what": "Designing ways to use devices by voice, eye gaze and hand gestures instead of tapping a screen, while keeping them private, accessible and easy to learn.", "why": "The iPhone’s touchscreen reshaped how billions use technology within about a decade. If glasses or implants become the next main device, people who can design for voice, gaze and gesture may be in demand.", "how": ["Read Apple’s Human Interface Guidelines for visionOS on eye and hand input.", "Read W3C’s XR Accessibility User Requirements for inclusive design needs.", "Prototype a voice-only version of an app you use daily and test it with friends."], "read": [{"title": "Apple Human Interface Guidelines: Designing for visionOS", "url": "https://developer.apple.com/design/human-interface-guidelines/designing-for-visionos"}, {"title": "W3C XR Accessibility User Requirements", "url": "https://www.w3.org/TR/xaur/"}]}}], "watch": "Watch brain-implant trials moving beyond paralysed patients, sales of smart glasses, and new laws treating neural data as sensitive."}}, {"id": "krakatoa", "theme": "An eruption the whole planet feels", "rhyme": 3, "then": {"year": 1883, "short": "Krakatoa", "title": "The Eruption of Krakatoa", "where": "Sunda Strait, Dutch East Indies", "region": "world", "hook": "The volcano heard 4,800 km away, often called the loudest sound in recorded history.", "text": "On 27 August 1883, Krakatoa in the Dutch East Indies blew itself apart. The blast was heard 4,800 km away, and its pressure wave circled the globe more than three times. Tsunamis killed over 36,000 people, and ash turned sunsets red worldwide."}, "now": {"year": 2022, "short": "Hunga Tonga", "title": "The Hunga Tonga Eruption", "where": "Tonga, South Pacific", "region": "world", "hook": "January 2022: satellite loops of a vast ash cloud bursting over the Pacific near Tonga.", "text": "On 15 January 2022 the undersea volcano Hunga Tonga–Hunga Ha’apai produced the largest atmospheric explosion recorded by modern instruments. Its plume rose about 57 km, and its pressure wave circled the globe several times. Tsunamis reached Peru, and Tonga’s internet cable was cut."}, "followed": "Ash and sulfur dimmed sunlight, and Northern Hemisphere summers cooled by up to 0.4°C the next year. In 1927 a new volcano, Anak Krakatau, “Child of Krakatoa,” rose from the sea.", "next": {"short": "Dimmed Skies", "title": "An eruption that dims the whole sky", "text": "Around 2161, a bigger blast on the scale of Tambora could veil the sun for a year or two, cooling the planet and cutting harvests in a crowded, tightly linked world.", "watch": "Swelling ground and gas bursts at restless volcanoes, sulfur readings from satellites, and whether nations stockpile food for a sudden cold year."}, "breaks": "Hunga Tonga killed fewer than ten people and released little sulfur, so it barely changed global temperatures, while Krakatoa killed over 36,000 and cooled summers.", "older": "Tambora, 1815", "topic": "disaster", "echoes": [{"year": -43, "short": "Okmok Eruption", "title": "Alaska’s Okmok volcano chills Rome and Egypt", "region": "world", "line": "Alaska’s Okmok made 43 and 42 BC among the coldest years in recent millennia, linked to failed harvests in Rome and Egypt."}, {"year": 536, "short": "536 Dust Veil", "title": "The volcanic winter of 536", "region": "world", "line": "A volcanic haze dimmed the sun for about 18 months; summers turned cold and harvests failed from Ireland to China."}, {"year": 1257, "short": "Samalas", "title": "Indonesia’s Samalas volcano erupts", "region": "world", "line": "Indonesia’s Samalas left twice Tambora’s sulfur in polar ice, and European chroniclers recorded a cold, rainy 1258 with failed harvests."}, {"year": 1600, "short": "Huaynaputina", "title": "Peru’s Huaynaputina erupts", "region": "world", "line": "South America’s largest recorded eruption chilled the Northern Hemisphere and is linked to the cold that brought Russia’s 1601–1603 famine."}, {"year": 1783, "short": "Laki", "title": "Iceland’s Laki eruption", "region": "europe", "line": "Laki erupted for eight months; its sulfur haze sickened Europe and chilled the Northern Hemisphere, and famine killed a fifth of Icelanders."}, {"year": 1815, "short": "Tambora", "title": "Mount Tambora erupts in Indonesia", "region": "world", "line": "Tambora, the largest eruption in recorded history, killed tens of thousands and brought 1816’s “Year Without a Summer” to Europe and America."}, {"year": 1991, "short": "Pinatubo", "title": "Mount Pinatubo erupts in the Philippines", "region": "world", "line": "The 20th century’s second-largest eruption lofted about 15 million tonnes of sulfur dioxide and cooled the planet by about 0.5°C."}, {"year": 2010, "short": "Eyjafjallajökull", "title": "Iceland’s ash cloud grounds Europe’s flights", "region": "europe", "line": "Ash from Iceland’s Eyjafjallajökull closed much of Europe’s airspace for about a week, cancelling over 100,000 flights and stranding millions worldwide."}], "opp": {"lastTime": "Krakatoa was one of the first disasters reported worldwide within hours by undersea telegraph, and the Royal Society’s 1888 report helped found modern atmospheric science. At Pinatubo in 1991, US and Philippine volcano forecasts saved more than 5,000 lives, showing what monitoring is worth.", "ideas": [{"kind": "build", "title": "Backup links for island nations", "line": "Satellite links, spare cable capacity and repair planning that keep island banks, hospitals and governments online when an eruption cuts a subsea cable.", "guide": {"what": "Backup internet for small islands: satellite links, spare capacity on other cables and repair plans, so banks, hospitals and governments stay online if the main undersea cable is cut.", "why": "In 2022 the Hunga Tonga eruption cut Tonga’s only international cable, leaving the country largely offline for about five weeks. Many islands still rely on one cable, while low-orbit satellite services now make backups cheaper.", "how": ["Use the free Submarine Cable Map to list island states that rely on a single cable.", "Ask an island telecom regulator or bank IT team what their outage plan is.", "Price a small satellite backup kit for one clinic or bank branch and test switching over."], "read": [{"title": "International Cable Protection Committee", "url": "https://www.iscpc.org/"}, {"title": "TeleGeography Submarine Cable Map", "url": "https://www.submarinecablemap.com/"}]}}, {"kind": "build", "title": "Cold-year harvest risk tools", "line": "Models that estimate how a year of dimmed sunlight would hit regional harvests and food stocks, for insurers, farm ministries and food agencies.", "guide": {"what": "Models and software that estimate how a year of weaker sunlight and cooler weather could cut crop yields in each region, and what that means for food stocks and prices.", "why": "After Tambora erupted in 1815, 1816 became a “year without a summer,” with crop failures in Europe and North America. Pinatubo cooled the globe by roughly 0.5°C in 1992. Today’s food trade is far more tightly linked.", "how": ["Explore FAO GIEWS and AMIS reports to see how crop and stock outlooks are built.", "Run a simple crop model for one region with lower temperature and sunlight inputs.", "Ask a crop insurer or food agency which shock scenarios they already test."], "read": [{"title": "FAO Global Information and Early Warning System (GIEWS)", "url": "https://www.fao.org/giews/en/"}, {"title": "AMIS Agricultural Market Information System", "url": "https://www.amis-outlook.org/"}]}}, {"kind": "work", "title": "Volcano and tsunami warning staff", "line": "Observatory technicians, tsunami analysts and infrasound specialists, since Hunga Tonga’s pressure wave raised tsunamis that standard warning models did not expect.", "guide": {"what": "People who watch volcanoes and oceans for danger: observatory technicians who keep sensors running, analysts who read quake and gas data, and tsunami forecasters who issue alerts.", "why": "In 1991 Pinatubo forecasts saved more than 5,000 lives. In 2022 Hunga Tonga’s air pressure wave raised tsunamis that standard quake-based models did not expect, so warning centers may need staff who understand both air and sea.", "how": ["Learn how USGS volcano alert levels work and follow one observatory’s weekly updates.", "Take a free online course in seismology or geophysical data analysis.", "Contact a national geological survey or tsunami center about internships or technician roles."], "read": [{"title": "USGS Volcano Hazards Program", "url": "https://www.usgs.gov/programs/VHP"}, {"title": "U.S. Tsunami Warning Centers", "url": "https://www.tsunami.gov/"}]}}, {"kind": "learn", "title": "Reading satellite sulfur and aerosol data", "line": "How to read satellite sulfur dioxide and aerosol measurements, which show within weeks whether an eruption is likely to cool the climate.", "guide": {"what": "Learning to read satellite maps of sulfur dioxide and fine particles in the air. They show how much gas an eruption sent high into the sky, which is what drives any cooling.", "why": "Krakatoa’s sulfur cooled Northern summers by up to 0.4°C the next year, while Hunga Tonga released little sulfur and barely changed temperatures. Satellites like Sentinel-5P now measure an eruption’s sulfur within days, an early sign of possible cooling.", "how": ["Browse NASA’s sulfur dioxide monitoring pages and compare Pinatubo with Hunga Tonga.", "Take a free NASA ARSET training on air quality or aerosol data.", "Download one Sentinel-5P sulfur dioxide file and plot it with Panoply or Python."], "read": [{"title": "NASA Global Sulfur Dioxide Monitoring", "url": "https://so2.gsfc.nasa.gov/"}, {"title": "NASA Applied Remote Sensing Training (ARSET)", "url": "https://www.earthdata.nasa.gov/data/projects/arset"}]}}], "watch": "Watch satellite sulfur readings after large eruptions, and whether governments fund cable repair ships, volcano observatories and emergency grain reserves."}}, {"id": "scramble", "theme": "Outside powers compete for Africa", "rhyme": 2, "then": {"year": 1884, "short": "The Scramble", "title": "The Berlin Conference and the Scramble", "where": "Berlin, Germany", "region": "europe", "hook": "European powers met in Berlin to set rules for claiming Africa, with no Africans present.", "text": "From November 1884 to February 1885, 14 states met in Berlin at Bismarck’s invitation to set rules for claiming African land. No Africans were invited. The talks recognized King Leopold II’s claim to the Congo and sped up a land grab already under way."}, "now": {"year": 2018, "short": "New Scramble", "title": "The New Scramble for Africa", "where": "Across Africa", "region": "africa", "hook": "September 2018: African leaders gathered in Beijing as Xi Jinping pledged $60 billion.", "text": "At the September 2018 China–Africa summit in Beijing, Xi Jinping pledged $60 billion in finance. Russia’s Wagner Group arrived in the Central African Republic, Gulf states built ports and bases in the Horn of Africa, and the US unveiled an Africa strategy to counter China and Russia."}, "followed": "By 1914 Europeans ruled about 90% of Africa, and only Liberia and Ethiopia, which beat Italy at Adwa in 1896, stayed independent. Most colonies won independence in the late 1950s and 1960s.", "next": {"short": "Africa’s Terms", "title": "Africa sets the terms for outsiders", "text": "Around 2152, Africa might be home to a third or more of humanity. Outside powers could compete for its workers, markets and minerals, while African blocs decide who gets access and on what terms.", "watch": "Deals for battery minerals, new foreign military bases, debt talks, and whether the African Continental Free Trade Area gives the continent one voice."}, "breaks": "African states are now sovereign: they sign or refuse deals, choose partners, and bargain with China, Russia, the Gulf and the West for better terms.", "older": "The Treaty of Tordesillas, 1494", "topic": "power", "echoes": [{"year": 1479, "short": "Alcáçovas", "title": "Castile and Portugal split Africa’s Atlantic coast", "region": "africa", "line": "After a naval war over Guinea’s gold and slaves, Castile got the Canaries and Portugal sole rights to Africa’s coast beyond them."}, {"year": 1494, "short": "Tordesillas", "title": "The Treaty of Tordesillas", "region": "world", "line": "Spain and Portugal split the world along a line west of Cape Verde, leaving Africa’s coasts to Portugal; other powers rejected it."}, {"year": 1637, "short": "Elmina", "title": "The Dutch seize Elmina Castle", "region": "africa", "line": "The Dutch seized Portugal’s Elmina Castle in today’s Ghana as European rivals fought over forts for the gold and slave trades."}, {"year": 1960, "short": "Congo Crisis", "title": "The Congo Crisis", "region": "africa", "line": "As Congo won independence, Belgium, the US, the Soviet Union and the UN intervened, making it a Cold War battleground."}, {"year": 1975, "short": "Angola", "title": "Angola becomes a Cold War battlefield", "region": "africa", "line": "At Angola’s independence, Cuban troops and Soviet arms backed one side while the US and South Africa backed its rivals."}], "opp": {"lastTime": "Gains went mostly to outsiders: Leopold II grew rich on Congo rubber sold into the new pneumatic tire market, and chartered firms like Rhodes’s British South Africa Company took mines and land. Africa exported raw materials while processing and profits stayed abroad.", "ideas": [{"kind": "build", "title": "Refining minerals where they are mined", "line": "Plants and services that process lithium, cobalt, copper or manganese in Africa, as Zimbabwe and Namibia now restrict exports of raw ore.", "guide": {"what": "Plants that turn raw ore into higher-value products, like battery-grade lithium or refined copper and cobalt, in the country where it is mined, plus the local services those plants need.", "why": "In the last scramble, Africa shipped raw rubber and ore while profits stayed abroad. Now Zimbabwe and Namibia restrict raw lithium exports, and Indonesia’s 2020 ban on nickel ore exports drew large processing investment, a model others watch.", "how": ["Study which minerals your target country restricts and what processing it wants built.", "Ask a mining engineer or chamber of mines about power, water and skills gaps.", "List services a new plant could buy locally, like lab testing, maintenance or logistics."], "read": [{"title": "Intergovernmental Forum on Mining (IGF)", "url": "https://www.igfmining.org/"}]}}, {"kind": "build", "title": "Cross-border trade under AfCFTA", "line": "Customs, payment and logistics services that help small African firms sell to neighboring countries under the African Continental Free Trade Area.", "guide": {"what": "Services that help small African firms sell to neighboring countries: customs paperwork, cross-border payments, shipping and finding buyers, using lower tariffs under the African Continental Free Trade Area.", "why": "Colonial railways ran from mines to ports, not between neighbors, and trade among African countries is still only about 15% of their total. AfCFTA trading began in 2021, and tariffs are falling in stages.", "how": ["Read your country’s AfCFTA tariff schedule and rules of origin for one product.", "Interview three small exporters about their worst border delays and payment problems.", "Pilot a service on one busy corridor, such as Kenya to Tanzania."], "read": [{"title": "AfCFTA Secretariat", "url": "https://au-afcfta.org/"}, {"title": "Pan-African Payment and Settlement System (PAPSS)", "url": "https://papss.com/"}]}}, {"kind": "work", "title": "Resource deal negotiators and auditors", "line": "Lawyers, geologists, economists and auditors who help African governments negotiate and monitor mining contracts, debt terms and foreign infrastructure deals.", "guide": {"what": "Professionals on a government’s side of the table: lawyers, geologists, economists and auditors who shape and check mining contracts, loans and infrastructure deals with foreign partners.", "why": "In 1888 the Ndebele king Lobengula signed a mining concession whose terms Rhodes’s agents misrepresented, and chartered firms took mines and land. Today African states bargain with many partners at once, and skilled negotiators could shift who gains.", "how": ["Read real mining contracts on ResourceContracts.org and note their royalty and tax terms.", "Read the latest EITI report for one African country and see what it reveals.", "Contact NGOs, law firms or ministries that advise governments on extractive deals."], "read": [{"title": "Extractive Industries Transparency Initiative (EITI)", "url": "https://eiti.org/"}, {"title": "ResourceContracts.org", "url": "https://www.resourcecontracts.org/"}]}}, {"kind": "learn", "title": "Mining contracts and sovereign debt", "line": "How royalties, offtake agreements and sovereign loans are structured, the terms that decided who gained during past scrambles for Africa.", "guide": {"what": "The basics of how mining deals and government loans are written: royalties, taxes, offtake deals that pre-sell future output, and loans repaid with minerals or oil.", "why": "Last time, contract terms decided who got rich from Congo rubber and southern African mines. Recent debt crises in Zambia and Ghana, and minerals-for-infrastructure deals, show that the fine print still shapes who gains.", "how": ["Read the free CCSI guide on how to read mining contracts.", "Compare two real contracts for the same mineral and list where their terms differ.", "Read the IMF debt sustainability factsheet, then follow Zambia’s debt restructuring story."], "read": [{"title": "Mining Contracts: How to Read and Understand Them (CCSI)", "url": "https://ccsi.columbia.edu/mining-contracts-how-read-and-understand-them"}, {"title": "IMF-World Bank Debt Sustainability Framework for Low-Income Countries", "url": "https://www.imf.org/en/About/Factsheets/Sheets/2023/imf-world-bank-debt-sustainability-framework-for-low-income-countries"}]}}], "watch": "Watch whether more African states require local mineral processing, and whether trade among African countries grows as a share of their total trade."}}, {"id": "trusts", "theme": "Government takes on a dominant monopoly", "rhyme": 3, "then": {"year": 1890, "short": "Sherman Act", "title": "The Sherman Antitrust Act", "where": "Washington, D.C.", "region": "us", "hook": "America’s first federal law against monopolies, later used to break up Rockefeller’s Standard Oil.", "text": "In July 1890 President Benjamin Harrison signed the Sherman Antitrust Act, passed almost unanimously, banning monopolization and conspiracies in restraint of trade. Its biggest target became John D. Rockefeller’s Standard Oil, which had controlled about 90% of US oil refining. In 1911 the Supreme Court split it into 34 companies."}, "now": {"year": 2020, "short": "US v. Google", "title": "The US Sues Google", "where": "Washington, D.C.", "region": "us", "hook": "October 2020: the US government sued Google, its biggest tech monopoly case since Microsoft.", "text": "On 20 October 2020 the Justice Department and 11 states sued Google under the Sherman Act over its search dominance. Google paid $26 billion in 2021 alone to be the default search engine. In August 2024 Judge Amit Mehta ruled that Google is a monopolist."}, "followed": "The breakup made Rockefeller richer as shares in the pieces soared, and they grew into Exxon, Mobil and Chevron. Congress added the Clayton Act and the Federal Trade Commission in 1914.", "next": {"short": "Next Breakup", "title": "Breaking up tomorrow’s digital gatekeeper", "text": "Around 2150, governments might try to break up whatever firm runs the dominant AI, energy or space network, perhaps still using a law first aimed at oil trusts.", "watch": "One company controlling the main gateway to information or computing power, paying to be the default, and lawmakers rewriting rules to catch up."}, "breaks": "Standard Oil sold a physical product; Google gives search away free, so harm is harder to prove, and in 2025 a judge declined to break it up.", "older": "England’s Statute of Monopolies, 1624", "topic": "money", "echoes": [{"year": -386, "short": "Grain Cartel", "title": "Athens tries its grain dealers’ cartel", "region": "europe", "line": "Athens tried grain dealers who colluded to buy cheaply from importers and hoarded grain, one of the earliest recorded antitrust trials."}, {"year": 483, "short": "Zeno’s Edict", "title": "Emperor Zeno outlaws monopolies", "region": "europe", "line": "Eastern Roman Emperor Zeno banned monopolies and price-fixing pacts, even those earlier emperors had granted, on pain of confiscation and exile."}, {"year": 1624, "short": "Monopolies Act", "title": "England’s Statute of Monopolies", "region": "europe", "line": "England’s Parliament voided most royal grants of monopoly over everyday trades, but allowed patents for new inventions."}, {"year": 1813, "short": "EIC Loses India", "title": "Parliament ends the East India Company’s monopoly", "region": "europe", "line": "The Charter Act of 1813 ended the East India Company’s monopoly on trade with India, opening it to private British merchants."}, {"year": 1911, "short": "Standard Oil", "title": "The Supreme Court breaks up Standard Oil", "region": "us", "line": "Standard Oil once controlled about 90 percent of US refining, and the Supreme Court ordered it split into dozens of firms."}, {"year": 1984, "short": "AT&T Breakup", "title": "The breakup of AT&T’s Bell System", "region": "us", "line": "To settle a federal antitrust suit, AT&T, which ran most US phone service, split off seven regional “Baby Bells.”"}, {"year": 1998, "short": "US v. Microsoft", "title": "The US sues Microsoft", "region": "us", "line": "The US accused Microsoft of using Windows to crush rivals like Netscape; a 2000 breakup order was overturned on appeal."}], "opp": {"lastTime": "After the 1911 split, Standard Oil’s pieces grew into Exxon, Mobil and Chevron, and their shares rose. After AT&T’s 1984 breakup, long-distance rivals like MCI and Sprint gained customers and long-distance calling prices fell.", "ideas": [{"kind": "build", "title": "Search and AI rivals", "line": "Specialized search and AI assistant services that could use court-ordered access to Google’s search data and the end of exclusive default deals.", "guide": {"what": "New search engines and AI assistants, often focused on one field like law, shopping or science, that compete with Google by doing one job better.", "why": "After AT&T’s 1984 breakup, rivals like MCI and Sprint won customers and call prices fell. In 2025 a US judge barred Google’s exclusive default deals and ordered it to share some search data with qualified rivals, though Google is appealing.", "how": ["Pick a niche where general search answers poorly and interview ten people who search it.", "Read the remedies ruling on the Justice Department’s Google case page.", "Build a small prototype using a search API or open web data, and test it with them."], "read": [{"title": "U.S. and Plaintiff States v. Google LLC (Justice Department)", "url": "https://www.justice.gov/atr/case/us-and-plaintiff-states-v-google-llc"}]}}, {"kind": "build", "title": "Data portability and interoperability tools", "line": "Services that move users’ data, contacts and purchases between platforms, as rules like the EU Digital Markets Act require gatekeepers to open up.", "guide": {"what": "Tools that let people move their photos, contacts, playlists and other data from one platform to another, or let rival services work together, so switching is easier.", "why": "Standard Oil’s power came partly from controlling pipelines and rail deals rivals needed. Today’s gatekeepers control data and connections, and the EU Digital Markets Act now requires the biggest platforms to allow data portability and some interoperability.", "how": ["Read the Digital Markets Act rules on data portability and interoperability.", "Move your own data between two services and note every point of friction.", "Study the Data Transfer Initiative’s open-source tools and which services they support."], "read": [{"title": "EU Digital Markets Act", "url": "https://digital-markets-act.ec.europa.eu/index_en"}, {"title": "Data Transfer Initiative", "url": "https://dtinit.org/"}]}}, {"kind": "work", "title": "Compliance engineers and antitrust economists", "line": "Antitrust economists, compliance engineers and technical monitors who check whether dominant platforms follow court orders and gatekeeper rules.", "guide": {"what": "People who check that big platforms follow the rules: economists who measure market power, engineers who build and audit compliance systems, and monitors who report to courts or regulators.", "why": "In 1914 the US created the Federal Trade Commission to police competition permanently. Now court orders against Google and the EU Digital Markets Act need technical experts to test whether platforms actually comply.", "how": ["Read the FTC Guide to Antitrust Laws to learn the core ideas and terms.", "Follow the European Commission’s DMA compliance reports and its public compliance workshops.", "Ask someone at a competition authority, law firm or economic consultancy about entry roles."], "read": [{"title": "FTC Guide to Antitrust Laws", "url": "https://ftc.gov/advice-guidance/competition-guidance/guide-antitrust-laws"}, {"title": "EU Digital Markets Act", "url": "https://digital-markets-act.ec.europa.eu/index_en"}]}}, {"kind": "learn", "title": "How digital antitrust remedies work", "line": "How the Sherman Act and EU Digital Markets Act treat default deals, data sharing and self-preferencing, and how remedies can reshape a market.", "guide": {"what": "How courts and regulators fix a monopoly: breaking a company up, banning certain contracts, forcing it to share data, or stopping it from favoring its own products.", "why": "The 1911 Standard Oil breakup and the 1984 AT&T split reshaped their markets. In 2025 a judge chose data sharing and limits on default deals for Google instead of a breakup, a test of which remedies work.", "how": ["Read the Stigler Committee’s free report on digital platforms.", "Compare the 1911 Standard Oil decision with the 2025 Google remedies ruling.", "Follow one DMA case, such as the 2025 fines on Apple and Meta, from start to decision."], "read": [{"title": "Stigler Committee on Digital Platforms: Final Report", "url": "https://www.chicagobooth.edu/research/stigler/news-and-media/committee-on-digital-platforms-final-report"}, {"title": "The Curse of Bigness by Tim Wu", "url": "https://globalreports.columbia.edu/books/the-curse-of-bigness"}]}}], "watch": "Watch whether court-ordered data sharing and limits on default deals survive Google’s appeal and actually shift market share in search and AI assistants."}}, {"id": "yellow", "theme": "False stories spread by new media", "rhyme": 2, "then": {"year": 1898, "short": "USS Maine", "title": "Yellow Journalism and the USS Maine", "where": "New York and Havana", "region": "us", "hook": "Newspapers cried “Remember the Maine!” and blamed Spain as America rushed toward war.", "text": "On 15 February 1898 the battleship USS Maine exploded in Havana harbor, killing 266 men. William Randolph Hearst’s Journal and Joseph Pulitzer’s World blamed Spain without evidence, in lurid stories that boosted sales. A 1976 US Navy study pointed to an accidental coal fire aboard."}, "now": {"year": 2016, "short": "Fake News", "title": "The Year of Fake News", "where": "United States", "region": "us", "hook": "2016: a fake story saying Pope Francis endorsed Donald Trump raced across Facebook.", "text": "During the 2016 US election, invented stories spread fast on social media. A BuzzFeed News analysis found the top 20 fake election stories drew more Facebook engagement than the top 20 from major outlets. Teenagers in Veles, Macedonia, ran pro-Trump hoax sites for ad money."}, "followed": "The press frenzy fed demands for war. The US declared war on Spain in April 1898, won within four months, and took Puerto Rico, Guam and the Philippines.", "next": {"short": "Deepfake Spark", "title": "A fabricated incident sparks a crisis", "text": "Around 2134, machines could fake any video, voice or document in seconds. A fabricated attack might go viral and push nations toward conflict before anyone can prove it false.", "watch": "Fakes that experts cannot debunk quickly, news feeds written entirely by machines, and falling trust in any shared source of facts."}, "breaks": "In 1898 a few press barons drove the story; in 2016 falsehoods spread through millions of users and platform algorithms, with no editor in charge.", "older": "The Great Moon Hoax, 1835", "topic": "society", "echoes": [{"year": 1193, "short": "Song Xiaobao", "title": "Song China’s “small papers” spread fabrications", "region": "china", "line": "Song officials warned that xiaobao, popular private news sheets, invented imperial orders and appointments out of nothing and spread them widely."}, {"year": 1475, "short": "Trent Libel", "title": "The Simon of Trent blood libel", "region": "europe", "line": "After a boy died in Trent, printed accounts spread a false claim that local Jews killed him, among print’s first viral lies."}, {"year": 1835, "short": "Moon Hoax", "title": "The Great Moon Hoax", "region": "us", "line": "The New York Sun, a cheap new penny paper, claimed astronomers had spotted bat-winged people on the Moon, and its sales soared."}, {"year": 1870, "short": "Ems Dispatch", "title": "Bismarck’s edited Ems telegram", "region": "europe", "line": "Bismarck edited a royal telegram to read like an insult and fed it to the press; French outrage helped spark war."}, {"year": 1938, "short": "Martian Panic", "title": "The War of the Worlds broadcast", "region": "us", "line": "Orson Welles’s radio drama of a Martian invasion fooled some listeners, and newspapers then spread exaggerated tales of nationwide panic."}, {"year": 2018, "short": "WhatsApp Rumors", "title": "India’s WhatsApp rumor lynchings", "region": "india", "line": "False WhatsApp rumors of child kidnappers spread among India’s new smartphone users, and mobs killed more than a dozen innocent people."}, {"year": 2023, "short": "Fake Pentagon", "title": "The AI-faked Pentagon explosion", "region": "us", "line": "An apparently AI-generated image of an explosion near the Pentagon spread via verified Twitter accounts, briefly knocking US stock markets lower."}], "opp": {"lastTime": "The backlash rewarded credibility: Adolph Ochs’s New York Times grew by offering sober news under the motto “All the News That’s Fit to Print,” and Missouri opened the first journalism school in 1908. After 2016, fact-checking groups multiplied and Facebook began paying outside fact-checkers.", "ideas": [{"kind": "build", "title": "Content provenance and verification tools", "line": "Tools that attach and check provenance records on photos, video and audio, helping newsrooms, courts and platforms show what is authentic.", "guide": {"what": "Tools that attach a tamper-evident record to photos, video and audio, showing who made them, when and how they were edited, plus tools that read and check those records.", "why": "In 1898 papers blamed Spain for the Maine without evidence; a 1976 study pointed to an accidental fire. Now AI can fake video in seconds, and the C2PA standard lets cameras and apps attach Content Credentials.", "how": ["Read the C2PA overview and try the free Content Credentials verify tool on sample images.", "Ask a newsroom photo desk or court clerk how they check whether images are authentic.", "Build a simple plugin that shows provenance data inside one common photo workflow."], "read": [{"title": "Coalition for Content Provenance and Authenticity (C2PA)", "url": "https://c2pa.org/"}, {"title": "Content Authenticity Initiative", "url": "https://contentauthenticity.org/"}]}}, {"kind": "build", "title": "Trusted local and specialist news", "line": "Subscription news services that compete on accuracy and sourcing in a niche or town, as the sober press did against the yellow papers.", "guide": {"what": "Small news services, often paid by subscription or membership, that cover one town or one topic carefully, with clear sourcing and visible corrections.", "why": "After the yellow press era, Adolph Ochs grew the New York Times by selling sober, reliable news. Thousands of US local papers have closed since 2005, leaving gaps that fakes can fill and careful reporters could serve.", "how": ["Pick a town or topic you know and list questions no outlet answers well.", "Read the Reuters Institute Digital News Report to see what people pay for.", "Run a free weekly newsletter for three months and track sign-ups and replies."], "read": [{"title": "Reuters Institute Digital News Report", "url": "https://reutersinstitute.politics.ox.ac.uk/digital-news-report"}, {"title": "LION Publishers", "url": "https://lionpublishers.com/"}]}}, {"kind": "work", "title": "Verification and open-source investigators", "line": "Verification journalists, open-source investigators and trust-and-safety analysts who check viral images, audio and claims before they shape public decisions.", "guide": {"what": "People who check whether viral images, videos and claims are real, using maps, satellite images, metadata and public records. They work in newsrooms, research groups and platform safety teams.", "why": "After 2016, fact-checking groups multiplied and Facebook began paying outside fact-checkers. With AI fakes now cheap, people who can confirm or debunk a claim fast may be needed by newsrooms, courts and governments.", "how": ["Work through the free Verification Handbook, one chapter per week.", "Practise geolocating a viral photo with Bellingcat’s guides and free satellite maps.", "Publish one short, careful verification and ask an experienced investigator for feedback."], "read": [{"title": "Verification Handbook", "url": "https://verificationhandbook.com/"}, {"title": "Bellingcat guides", "url": "https://www.bellingcat.com/category/resources/how-tos/"}]}}, {"kind": "learn", "title": "Digital forensics for synthetic media", "line": "Geolocation, reverse image search, metadata analysis and detection of AI-generated audio and video, the skills that debunk a fake quickly.", "guide": {"what": "Skills for checking whether an image, video or voice is real: reverse image search, reading file metadata, matching places on maps and spotting signs of AI-made content.", "why": "The false Maine story spread for weeks with little way to check it. Today a fake can spread in hours, as an AI clone of Joe Biden’s voice did in a 2024 robocall, so fast checking matters more.", "how": ["Use Bellingcat’s Online Investigation Toolkit to try three reverse image and metadata tools.", "Read WITNESS’s guidance on deepfakes and how to prepare without panic.", "Test yourself on known fake and real images, noting what gave each one away."], "read": [{"title": "Bellingcat’s Online Investigation Toolkit", "url": "https://bellingcat.gitbook.io/toolkit"}, {"title": "WITNESS: Prepare, Don’t Panic on synthetic media", "url": "https://lab.witness.org/projects/synthetic-media-and-deep-fakes/"}]}}], "watch": "Watch whether phones, cameras and platforms adopt provenance labels widely, and how long major fakes circulate before being debunked."}}, {"id": "dreadnought", "theme": "A rising sea power alarms the ruling one", "rhyme": 2, "then": {"year": 1906, "short": "Dreadnought", "title": "HMS Dreadnought Starts a Naval Race", "where": "Portsmouth, England", "region": "europe", "hook": "The British battleship so advanced it made every other battleship obsolete overnight.", "text": "Launched in February 1906 and completed that December, HMS Dreadnought carried ten 12-inch guns and fast steam turbines. It made older battleships obsolete, so Britain and a rising Germany raced to build the new type. In a 1909 naval scare, the British slogan was “We want eight and we won’t wait.”"}, "now": {"year": 2020, "short": "China’s Navy", "title": "China Builds the World’s Largest Navy", "where": "China", "region": "china", "hook": "2020: amid the pandemic, the Pentagon reported China’s navy had overtaken America’s in ship count.", "text": "In September 2020 the Pentagon’s annual report said China had the world’s largest navy, about 350 ships and submarines against roughly 293 for the US. Chinese shipyards were launching warships at a rapid pace, and Beijing had built military bases on reefs in the South China Sea."}, "followed": "The rivalry deepened British-German hostility before 1914. Their great fleets met only once, at Jutland in 1916, and the German battle fleet then stayed mostly in port.", "next": {"short": "New Sea Power", "title": "A new naval challenger rises", "text": "Around 2134, another risin
