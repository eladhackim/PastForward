g power might challenge the leading navy, perhaps with fleets of cheap drone ships that make today’s carriers look as dated as pre-dreadnoughts did.", "watch": "A newcomer outbuilding the leader in shipyards, a new ship type that makes old fleets obsolete, and rival alliances forming around sea lanes."}, "breaks": "The US Navy still leads in tonnage, aircraft carriers and global bases, and nuclear weapons make a direct war between great powers far more dangerous than in 1914.", "older": "The Anglo-Dutch Wars, 1652", "topic": "power", "echoes": [{"year": -431, "short": "Athens vs Sparta", "title": "The Peloponnesian War begins", "region": "europe", "line": "Thucydides wrote that the growth of Athens’ power, built on its navy, and the fear it caused in Sparta made war inevitable."}, {"year": -260, "short": "Rome’s Fleet", "title": "Rome builds a fleet against Carthage", "region": "europe", "line": "Rome, a land power, copied a captured Carthaginian warship, built about 100 in two months, and beat Carthage’s navy at Mylae."}, {"year": 1025, "short": "Chola Navy", "title": "Chola India’s navy humbles Srivijaya", "region": "india", "line": "Rajendra Chola’s growing navy sacked Srivijaya’s capital and seized its king, breaking the trade monopoly of Southeast Asia’s leading sea power."}, {"year": 1499, "short": "Zonchio", "title": "The Ottoman navy defeats Venice at Zonchio", "region": "europe", "line": "The Ottomans’ growing fleet beat Venice, the eastern Mediterranean’s leading sea power, at Zonchio, marking their arrival as a serious naval force."}, {"year": 1652, "short": "Anglo-Dutch War", "title": "The First Anglo-Dutch War", "region": "europe", "line": "England’s growing navy and trade laws aimed at Dutch shipping sparked war with the Dutch Republic, Europe’s leading sea power."}, {"year": 1922, "short": "Naval Treaty", "title": "The Washington Naval Treaty", "region": "us", "line": "Facing a costly race, Britain, the US and Japan capped battleships at a 5:5:3 ratio, with Britain accepting parity with America."}, {"year": 1934, "short": "Japan’s Yamato", "title": "Japan abandons the naval treaty limits", "region": "china", "line": "Denied parity with Britain and the US, Japan gave notice it would leave the naval treaties, then secretly built giant battleships."}, {"year": 1970, "short": "Soviet Navy", "title": "The Soviet Okean naval exercise", "region": "russia", "line": "Admiral Gorshkov’s fast-growing Soviet fleet staged the largest peacetime naval exercise yet across several oceans, challenging US command of the seas."}], "opp": {"lastTime": "Shipbuilders and arms makers like Vickers, Armstrong Whitworth and Krupp filled their order books, and Parsons steam turbines became standard. Churchill’s move to oil-fired warships led Britain to buy control of the Anglo-Persian Oil Company in 1914. After the 1922 treaty, many yards lost orders.", "ideas": [{"kind": "build", "title": "Shipyard capacity and repair", "line": "Ship repair, modular construction and shipyard automation services, as the US and its allies try to rebuild yards that lag far behind China’s.", "guide": {"what": "Businesses that help build and fix ships faster: repair yards, makers of ready-made hull sections, and robots and software that speed up welding, cutting and planning.", "why": "In the Dreadnought race, Vickers and Armstrong Whitworth filled their order books. Today China builds far more ships than the US and its allies, and in 2024 South Korea’s Hanwha bought a Philadelphia shipyard.", "how": ["Read the CSIS Ship Wars report to understand the gap in shipyard capacity.", "Call a local ship repair yard and ask where their work gets delayed.", "Pick one bottleneck, like weld inspection or parts tracking, and sketch a fix."], "read": [{"title": "CSIS: Ship Wars, Confronting China’s Dual-Use Shipbuilding Empire", "url": "https://www.csis.org/analysis/ship-wars-confronting-chinas-dual-use-shipbuilding-empire"}]}}, {"kind": "build", "title": "Tracking dark ships and cables", "line": "Satellite and sensor services that spot vessels with transponders switched off, guard undersea cables and help coast guards protect sea lanes.", "guide": {"what": "Services that use satellite images, radar and radio signals to find ships that switch off their location beacons, and to watch over undersea cables and pipelines.", "why": "In August 1914 Britain cut Germany’s undersea telegraph cables within days of war. Since 2023 several Baltic Sea cables have been damaged, with ships suspected of dragging anchors, and sanctions-dodging tankers often hide their positions.", "how": ["Explore Global Fishing Watch maps to see how gaps in ship signals are spotted.", "Learn the basics of AIS ship tracking and satellite radar imagery.", "Ask a coast guard, port or cable operator what monitoring gaps they face."], "read": [{"title": "Global Fishing Watch", "url": "https://globalfishingwatch.org/"}, {"title": "Skylight maritime monitoring", "url": "https://www.skylight.global/"}]}}, {"kind": "work", "title": "Shipyard trades and naval architects", "line": "Welders, pipefitters, marine electricians, naval architects and marine engineers, trades that shipyards in the US and Europe struggle to hire.", "guide": {"what": "The people who design and build ships: welders, pipefitters and marine electricians on the yard floor, and naval architects and marine engineers who design hulls and systems.", "why": "In the Dreadnought era shipyards boomed, then many lost orders after the 1922 naval treaty. Today the US and Europe are trying to expand shipbuilding again, and yards report trouble hiring skilled trades.", "how": ["Visit a shipyard or apprenticeship program and ask which trades are hardest to fill.", "Try a short welding or marine electrical course at a technical college.", "For design roles, join SNAME or RINA as a student and attend a local meeting."], "read": [{"title": "Society of Naval Architects and Marine Engineers (SNAME)", "url": "https://sname.org/"}, {"title": "Royal Institution of Naval Architects (RINA)", "url": "https://www.rina.org.uk/"}]}}, {"kind": "learn", "title": "Uncrewed vessel design and operation", "line": "How uncrewed surface and underwater vessels are built, operated and regulated, the new ship type that could make older fleets look dated.", "guide": {"what": "How boats and submarines without crews are built, steered remotely or by software, and kept safe and legal at sea.", "why": "HMS Dreadnought made older battleships obsolete almost overnight. In the Black Sea, Ukrainian sea drones have damaged Russian warships, and in 2026 the IMO adopted a first, non-mandatory safety code for autonomous ships.", "how": ["Read the IMO’s autonomous shipping page to learn the levels of autonomy and the code.", "Build or program a small model boat with an open autopilot such as ArduPilot.", "Ask a marine robotics firm or university lab how they test their vessels."], "read": [{"title": "IMO: Autonomous shipping", "url": "https://www.imo.org/en/MediaCentre/HotTopics/Pages/Autonomous-shipping.aspx"}]}}], "watch": "Watch shipbuilding budgets, orders for uncrewed vessels, and whether rival powers ever agree to limits as Britain, the US and Japan did in 1922."}}, {"id": "ellis", "theme": "A great migration wave, then backlash", "rhyme": 2, "then": {"year": 1907, "short": "Ellis Island", "title": "Ellis Island’s Record Year", "where": "New York, USA", "region": "us", "hook": "The island gateway where millions of immigrants first set foot in America.", "text": "In 1907 nearly 1.3 million immigrants entered the United States, a record at the time, and over a million passed through Ellis Island. Most came from southern and eastern Europe. On 17 April alone, inspectors processed 11,747 people."}, "now": {"year": 2015, "short": "Migrant Crisis", "title": "Europe’s Migrant Crisis", "where": "Europe", "region": "europe", "hook": "September 2015: the photo of drowned toddler Alan Kurdi, then crowds cheering refugees in Munich.", "text": "More than a million migrants and refugees reached Europe by sea in 2015, many fleeing Syria’s civil war. Angela Merkel told Germans “We can do this,” and Germany took in about 890,000 asylum seekers. Hungary built a border fence."}, "followed": "Backlash followed. Congress imposed a literacy test in 1917, and the 1924 quota law sharply cut arrivals from southern and eastern Europe and barred most Asians.", "next": {"short": "Climate Exodus", "title": "A climate-driven wave of migration", "text": "Around 2123, heat, drought and rising seas could push tens of millions to move, perhaps toward aging countries short of workers, setting off the same cycle of welcome and backlash.", "watch": "Regions growing too hot to farm, labor shortages in aging societies, and new walls or quota laws in the countries people head for."}, "breaks": "Ellis Island arrivals mostly came legally, seeking work in an America with few limits on Europeans; many 2015 arrivals were war refugees crossing irregularly into a 28-nation union.", "older": "The Irish famine exodus, 1845", "topic": "society", "echoes": [{"year": -2034, "short": "Amorite Wall", "title": "Ur builds a wall against the Amorites", "region": "mideast", "line": "As Amorite herders moved into Sumer, Ur’s king built a wall called “Holding back the Tidnum”; Amorite dynasties later ruled Mesopotamia anyway."}, {"year": 376, "short": "Danube Crossing", "title": "The Goths cross the Danube", "region": "europe", "line": "Fleeing the Huns, tens of thousands of Goths entered the Roman Empire; abuse by officials sparked a revolt that killed Emperor Valens."}, {"year": 1381, "short": "Flemings 1381", "title": "London rebels massacre Flemish immigrants", "region": "europe", "line": "After Edward III welcomed Flemish weavers, rebels in the Peasants’ Revolt hunted Flemings in London, killing dozens identified by their accents."}, {"year": 1845, "short": "Irish Famine", "title": "Ireland’s famine exodus", "region": "us", "line": "Fleeing the Great Famine, over a million Irish emigrated, many to America, where the anti-Catholic Know-Nothing movement surged in the 1850s."}, {"year": 1882, "short": "Exclusion Act", "title": "The Chinese Exclusion Act", "region": "us", "line": "After Chinese workers came for gold mines and railroads, Congress banned Chinese laborers, the first major US law to bar one nationality."}, {"year": 1948, "short": "Windrush", "title": "The Empire Windrush reaches Britain", "region": "europe", "line": "The Empire Windrush brought Caribbean migrants to postwar Britain; as more followed, riots erupted in 1958 and entry laws tightened from 1962."}, {"year": 1979, "short": "Boat People", "title": "Vietnam’s boat people are turned away", "region": "world", "line": "As hundreds of thousands fled Vietnam by sea, neighboring states pushed boats back and declared they would accept no more."}, {"year": 1994, "short": "Prop 187", "title": "California passes Proposition 187", "region": "us", "line": "After years of heavy immigration, California voters approved barring undocumented immigrants from public schools and services, though courts blocked the law."}, {"year": 2008, "short": "S. Africa Riots", "title": "South Africa’s 2008 anti-migrant riots", "region": "africa", "line": "As millions fled Zimbabwe’s economic collapse for South Africa, mobs attacked foreign migrants in its townships, killing at least 62."}], "opp": {"lastTime": "Immigrants filled steel mills, mines and garment shops, and services grew around them: A.P. Giannini’s Bank of Italy, founded in 1904 for immigrants, became Bank of America. When war and the 1924 quotas cut arrivals, Northern employers recruited Black Southerners and Mexican workers.", "ideas": [{"kind": "build", "title": "Credential recognition and job matching", "line": "Services that translate foreign qualifications, speed professional licensing and match newcomers to sectors short of workers, like care, construction and transport.", "guide": {"what": "Services that help newcomers prove their skills: translating diplomas, guiding them through professional licensing, and matching them with employers short of workers in care, building and transport.", "why": "Ellis Island arrivals quickly filled steel mills and mines. Today many trained migrants in Europe work below their skill level while aging countries lack nurses and builders, so faster recognition could help both sides.", "how": ["Learn how your country’s ENIC-NARIC center assesses foreign diplomas.", "Interview a few migrant nurses or engineers about the steps that slowed them down.", "Partner with one care or construction employer to pilot faster matching."], "read": [{"title": "ENIC-NARIC recognition network", "url": "https://www.enic-naric.net/"}, {"title": "European Qualifications Passport for Refugees (Council of Europe)", "url": "https://www.coe.int/en/web/education/recognition-of-refugees-qualifications"}]}}, {"kind": "build", "title": "Banking and remittances for newcomers", "line": "Low-cost accounts, remittances and credit-history services for migrants, the role immigrant banks like Giannini’s filled after 1904.", "guide": {"what": "Simple bank accounts, cheap money transfers home and ways to build a credit history for migrants who arrive without local financial records.", "why": "In 1904 A.P. Giannini founded the Bank of Italy to serve immigrants other banks ignored; it became Bank of America. Sending money home still often costs well above the UN goal of under 3%.", "how": ["Check World Bank Remittance Prices Worldwide data for one corridor you know.", "Ask newcomers where they bank, how they send money and what it costs.", "Learn your country’s licensing rules for payment or e-money services before building anything."], "read": [{"title": "World Bank Remittance Prices Worldwide", "url": "https://remittanceprices.worldbank.org/about-remittance-prices-worldwide"}]}}, {"kind": "work", "title": "Interpreters, teachers and caseworkers", "line": "Language teachers, interpreters, caseworkers and integration coordinators, especially in aging countries recruiting abroad for care and skilled trades.", "guide": {"what": "People who help newcomers settle: language teachers, interpreters in clinics and courts, caseworkers who handle housing and paperwork, and coordinators who link people to jobs.", "why": "In the Ellis Island era, settlement houses and night schools taught many newcomers English. Today aging countries recruit abroad for care and skilled trades, and new arrivals may need similar help to settle and work.", "how": ["Volunteer a few hours a week with a local refugee or migrant support group.", "Explore the Council of Europe toolkit on language support for adult refugees.", "Look into a recognized interpreting or language teaching certificate in your country."], "read": [{"title": "Council of Europe toolkit: Language support for adult refugees", "url": "https://www.coe.int/en/web/language-support-for-adult-refugees"}]}}, {"kind": "learn", "title": "Migration law and integration practice", "line": "How asylum, work visa and integration rules work, including the EU Pact on Migration and Asylum, plus what helps newcomers find work quickly.", "guide": {"what": "How asylum, work visa and residence rules work, and what actually helps newcomers settle, such as early language classes, quick job placement and recognition of skills.", "why": "After the 1907 peak, the US passed a literacy test in 1917 and quotas in 1924. The EU’s Pact on Migration and Asylum began applying in June 2026, changing how arrivals are screened and shared.", "how": ["Read the European Commission’s overview of the Pact on Migration and Asylum.", "Attend a public talk or webinar run by a migrant legal aid group.", "Compare integration programs in two countries and note what helps people find work faster."], "read": [{"title": "European Commission: Pact on Migration and Asylum", "url": "https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"}]}}], "watch": "Watch for new quota laws, fences and asylum caps, or the opposite: aging countries widening work visas to fill care and construction jobs."}}, {"id": "modelt", "theme": "A new vehicle goes mass market", "rhyme": 2, "then": {"year": 1908, "short": "Model T", "title": "Ford’s Model T", "where": "Detroit, Michigan", "region": "us", "hook": "Henry Ford’s simple, cheap car that put ordinary Americans on the road.", "text": "Ford launched the Model T on 1 October 1908 at about $850. After the moving assembly line arrived in 1913, prices eventually fell below $300, and over 15 million were built by 1927. By 1918, half the cars in America were Model Ts."}, "now": {"year": 2023, "short": "Electric Cars", "title": "Electric Cars Go Mass Market", "where": "Worldwide, led by China", "region": "world", "hook": "2023: a Tesla, the Model Y, became the world’s best-selling car of any kind.", "text": "Nearly 14 million electric cars were sold worldwide in 2023, about 18% of all new cars, up from about 4% in 2020. China accounted for about 60% of sales, and in late 2023 China’s BYD passed Tesla in quarterly battery-car sales."}, "followed": "Cars reshaped America with paved highways, suburbs and a booming oil industry. In 1927 Ford replaced the Model T with the Model A, as General Motors offered more style and choice.", "next": {"short": "Robot Rides", "title": "Self-driving or flying vehicles for everyone", "text": "Around 2138, another vehicle could go from rich people’s novelty to everyday tool, perhaps self-driving pods or small electric aircraft, and cities might redraw streets and parking around it.", "watch": "Prices falling year after year, one model that suddenly everyone buys, and cities rewriting street and parking rules."}, "breaks": "The Model T created mass car ownership from almost nothing; electric cars replace a machine people already own, helped by climate policy and subsidies.", "older": "Stephenson’s Rocket, 1829", "topic": "tech", "echoes": [{"year": 1662, "short": "Pascal’s coaches", "title": "Pascal’s five-sol coaches open in Paris", "region": "europe", "line": "Blaise Pascal’s shared coaches ran fixed routes at a five-sol fare, opening carriage travel to paying Parisians, until rules barred commoners."}, {"year": 1829, "short": "The Rocket", "title": "Stephenson’s Rocket wins the Rainhill Trials", "region": "europe", "line": "Stephenson’s Rocket won the Rainhill Trials, and the Liverpool and Manchester steam railway was soon carrying 1,200 passengers a day."}, {"year": 1885, "short": "Safety Bicycle", "title": "The Rover safety bicycle", "region": "europe", "line": "Starley’s chain-driven Rover replaced the risky high-wheeler, and cheap safety bicycles set off a worldwide cycling craze in the 1890s."}, {"year": 1945, "short": "VW Beetle", "title": "The Volkswagen Beetle goes global", "region": "europe", "line": "After World War II, Volkswagen mass-produced the Beetle for ordinary buyers; in 1972 it passed the Model T’s production record."}, {"year": 1958, "short": "Super Cub", "title": "Honda’s Super Cub motorbike", "region": "world", "line": "Honda’s cheap, easy-to-ride Super Cub put millions on motorized wheels; over 100 million built make it the best-selling motor vehicle ever."}], "opp": {"lastTime": "Demand rose for oil, tires and roads: Akron, Ohio became the world’s tire capital, drive-in filling stations spread from 1913, and GM’s lending arm GMAC, founded in 1919, made buying cars on credit common. Ford’s 1914 $5 day drew workers to Detroit.", "ideas": [{"kind": "build", "title": "Charging for drivers without garages", "line": "Curbside, workplace and apartment charging for drivers who cannot plug in at home, the filling station of the electric era.", "guide": {"what": "Chargers on streets, at workplaces and in apartment buildings for people who cannot plug in at home, plus the apps and billing that make them easy to use.", "why": "The Model T era spread drive-in filling stations from 1913. In 2024 over 17 million electric cars were sold, more than one in five new cars, and many city drivers have no driveway to charge in.", "how": ["Map public chargers near apartment blocks in your area with a charging map app.", "Ask a building manager what stops them from installing chargers for residents.", "Learn local permit and grid connection rules for curbside or shared charging."], "read": [{"title": "IEA Global EV Outlook 2025", "url": "https://www.iea.org/reports/global-ev-outlook-2025"}, {"title": "Alternative Fuels Data Center: EV charging stations", "url": "https://afdc.energy.gov/fuels/electricity-stations"}]}}, {"kind": "build", "title": "Battery recycling and second life", "line": "Collecting, testing and recycling used EV batteries, or reusing them for grid storage, as the first large waves of packs age out.", "guide": {"what": "Collecting used electric car batteries, testing their health, then reusing them, for example as storage for solar power, or recycling them to recover lithium, nickel and cobalt.", "why": "The car boom built whole industries around tires, oil and repair. Packs from the first big wave of EVs are starting to age out, and new EU rules set recycling targets and require digital battery passports from 2027.", "how": ["Read the EU summary of the batteries rules and their recycling targets.", "Ask a car dismantler or EV repair shop what they do with old packs.", "Get high-voltage safety training, then test a small storage setup built from used modules."], "read": [{"title": "EUR-Lex summary: sustainability rules for batteries and waste batteries", "url": "https://eur-lex.europa.eu/EN/legal-content/summary/sustainability-rules-for-batteries-and-waste-batteries.html"}]}}, {"kind": "work", "title": "EV technicians and charger electricians", "line": "High-voltage vehicle technicians, charger installers and grid electricians, as repair shops and utilities adapt to battery cars as garages once adapted to engines.", "guide": {"what": "Mechanics trained to repair high-voltage battery cars safely, electricians who install and maintain chargers, and grid workers who connect them to the power network.", "why": "The Model T created a new trade of garage mechanics, and Ford’s $5 day drew workers to Detroit. Electric cars run on hundreds of volts, and many mechanics trained on engines are not yet qualified to work on them.", "how": ["Find an accredited EV safety course, such as IMI electric vehicle qualifications.", "Ask a local dealer or independent garage whether they need EV-trained staff.", "If you are an electrician, look into charger installer training such as EVITP."], "read": [{"title": "Institute of the Motor Industry (IMI)", "url": "https://www.theimi.org.uk/"}, {"title": "Electric Vehicle Infrastructure Training Program (EVITP)", "url": "https://evitp.org/"}]}}, {"kind": "learn", "title": "High-voltage battery diagnostics", "line": "Battery health testing, high-voltage safety and power electronics, skills many mechanics trained on engines do not yet have.", "guide": {"what": "Learning to test the health of an electric car battery, work safely with high voltage, and understand the power electronics that charge and drive the car.", "why": "When cars replaced horses, engine repair became a steady trade. Battery health is now a major factor in a used EV’s value, and buyers, dealers and insurers may want trusted tests as more used EVs reach the market.", "how": ["Read Battery University’s free lessons on how lithium-ion cells age.", "Take a certified high-voltage safety course before touching any EV system.", "Practise reading battery health data with an OBD scanner and app on a friend’s EV."], "read": [{"title": "Battery University", "url": "https://batteryuniversity.com/"}, {"title": "Institute of the Motor Industry (IMI)", "url": "https://www.theimi.org.uk/"}]}}], "watch": "Watch battery prices, used-EV resale values, and whether cities rewrite curb and parking rules for charging and robotaxis."}}, {"id": "titanic", "theme": "Confidence in a machine built for the wealthy", "rhyme": 2, "then": {"year": 1912, "short": "Titanic", "title": "The Sinking of the Titanic", "where": "North Atlantic", "region": "europe", "hook": "The “unsinkable” luxury liner that hit an iceberg on its maiden voyage.", "text": "On 14 April 1912 the luxury liner Titanic, carrying millionaires like John Jacob Astor, struck an iceberg on its maiden voyage. It sank in under three hours. With lifeboats for only 1,178 of about 2,224 aboard, more than 1,500 died."}, "now": {"year": 2023, "short": "Titan Sub", "title": "The Titan Submersible Implodes", "where": "North Atlantic", "region": "us", "hook": "June 2023: the world counted down the Titan’s oxygen, not knowing it had already imploded.", "text": "On 18 June 2023 OceanGate’s Titan submersible imploded on a dive to the Titanic wreck, killing all five aboard, including CEO Stockton Rush. Seats cost $250,000. The carbon-fiber craft had never been certified, and experts had warned about its safety."}, "followed": "Inquiries in Britain and the US led to lifeboats for all aboard and round-the-clock radio watches. The 1914 SOLAS safety treaty and the International Ice Patrol followed.", "next": {"short": "Space Tragedy", "title": "A luxury space trip ends in disaster", "text": "Around 2134, wealthy tourists might ride to orbit, the Moon or the deep ocean on craft sold as safe. One disaster could force the safety rules the industry skipped, as Titanic did.", "watch": "Private tourist trips to space or extreme places, operators avoiding outside certification, and marketing that promises total safety."}, "breaks": "Titanic carried over 2,200 people of every class; Titan carried five people who signed waivers for an uncertified experimental craft.", "older": "The warship Vasa sinks, 1628", "topic": "disaster", "echoes": [{"year": 1120, "short": "White Ship", "title": "The White Ship sinks off Normandy", "region": "europe", "line": "Nobles partying aboard the newly refitted White Ship pushed it to overtake the king’s vessel; it hit a rock, drowning his heir."}, {"year": 1628, "short": "Vasa", "title": "The warship Vasa sinks", "region": "europe", "line": "Sweden’s king demanded a mighty showpiece warship, but the top-heavy Vasa capsized less than a mile into its maiden voyage."}, {"year": 1937, "short": "Hindenburg", "title": "The Hindenburg disaster", "region": "us", "line": "The hydrogen-filled luxury airship burst into flames while landing in New Jersey, killing 36 and ending the era of passenger airships."}, {"year": 1954, "short": "Comet Jet", "title": "The de Havilland Comet crashes", "region": "europe", "line": "Britain’s Comet, the first jet airliner and a prestige symbol, was grounded after two broke apart in midair from metal fatigue."}, {"year": 1956, "short": "Andrea Doria", "title": "The sinking of the Andrea Doria", "region": "europe", "line": "Italy’s luxury liner, billed as one of the safest afloat, sank after a collision; its tilt left half its lifeboats unusable."}, {"year": 2000, "short": "Concorde Crash", "title": "The Concorde crash near Paris", "region": "europe", "line": "The supersonic jet for wealthy travelers, with a spotless safety record, crashed after takeoff from Paris, killing 113; Concorde retired in 2003."}], "opp": {"lastTime": "Safety gear and skills were suddenly in demand: liners added lifeboats for all and round-the-clock wireless operators, the US Radio Act of 1912 licensed operators, and Reginald Fessenden’s early sonar detected an iceberg by echo in 1914. The International Ice Patrol began tracking ice.", "ideas": [{"kind": "build", "title": "Independent certification for extreme travel", "line": "Third-party testing, inspection and certification for submersibles, private spacecraft and adventure tours, where operators have often avoided outside review.", "guide": {"what": "Outside experts who test, inspect and certify craft and tours for extreme places, like deep-sea submersibles, private spacecraft and high-risk adventure trips, before paying passengers go.", "why": "Titanic led to the 1914 SOLAS safety treaty. Titan was never certified, and the US Coast Guard’s 2025 report found its loss preventable. Private trips to space and the deep sea are growing faster than their rules.", "how": ["Read the Coast Guard’s Titan report summary and list what an inspector would have checked.", "Learn how classification societies and standards like ASME PVHO certify passenger craft.", "Ask an adventure travel operator what proof of safety their insurers require."], "read": [{"title": "U.S. Coast Guard: Marine Board of Investigation report on Titan", "url": "https://www.news.uscg.mil/Press-Releases/Article/4265651/coast-guard-marine-board-of-investigation-releases-report-on-titan-submersible/"}, {"title": "ASME PVHO-1: Safety Standard for Pressure Vessels for Human Occupancy", "url": "https://www.asme.org/codes-standards/find-codes-standards/safety-standard-for-pressure-vessels-for-human-occupancy"}]}}, {"kind": "build", "title": "Fatigue monitoring for composite hulls", "line": "Sensors and analysis that track wear in carbon-fiber hulls and pressure vessels, with alerts reviewed by independent engineers.", "guide": {"what": "Sensors and software that track tiny cracks, strain and wear in carbon-fiber hulls and pressure tanks, with alerts checked by independent engineers, not only by the operator.", "why": "After Titanic, wireless watches and early sonar made ships safer. The Coast Guard found Titan’s own sensors recorded a major warning event in 2022 that was never properly acted on, so independent review could matter.", "how": ["Read the Coast Guard’s Titan findings on the hull and its monitoring data.", "Learn the basics of acoustic emission testing and strain gauges for composites.", "Ask a pressure vessel or hydrogen tank maker how they monitor wear today."], "read": [{"title": "U.S. Coast Guard: Marine Board of Investigation report on Titan", "url": "https://www.news.uscg.mil/Press-Releases/Article/4265651/coast-guard-marine-board-of-investigation-releases-report-on-titan-submersible/"}, {"title": "ASME PVHO-1: Safety Standard for Pressure Vessels for Human Occupancy", "url": "https://www.asme.org/codes-standards/find-codes-standards/safety-standard-for-pressure-vessels-for-human-occupancy"}]}}, {"kind": "work", "title": "Safety inspectors and certification engineers", "line": "Marine surveyors, classification engineers and spaceflight safety specialists, roles that tend to grow when a disaster forces rules on a new industry.", "guide": {"what": "People who check that ships, submersibles and spacecraft are safe: marine surveyors, engineers at classification societies, and spaceflight safety specialists at regulators and companies.", "why": "After Titanic, inquiries led to lifeboats for all, round-the-clock radio watches and the International Ice Patrol. Titan’s loss and growing space tourism could push regulators to demand more outside review.", "how": ["Browse entry roles at IACS member societies such as DNV or Lloyd’s Register.", "Read the FAA’s commercial space pages on licensing and safety.", "Ask a marine surveyor how they trained and got certified."], "read": [{"title": "International Association of Classification Societies (IACS)", "url": "https://iacs.org.uk/"}, {"title": "FAA Commercial Space Transportation", "url": "https://www.faa.gov/space"}]}}, {"kind": "learn", "title": "Composite materials and failure analysis", "line": "How carbon fiber and other composites wear and fail under repeated pressure loads, and how certification standards test for it.", "guide": {"what": "How carbon fiber and other layered materials are made, how they weaken under repeated loads, and how engineers test them and work out why a part failed.", "why": "Titanic’s steel and rivets were studied for decades after the wreck was found. Investigators traced Titan’s loss to its carbon-fiber hull, and composites are spreading in aircraft, hydrogen tanks and spacecraft.", "how": ["Take a free online course in materials science or mechanics of materials.", "Read the Coast Guard’s Titan findings on the hull and its glued joints.", "Visit a composites workshop or makerspace and lay up a simple carbon-fiber part."], "read": [{"title": "U.S. Coast Guard: Marine Board of Investigation report on Titan", "url": "https://www.news.uscg.mil/Press-Releases/Article/4265651/coast-guard-marine-board-of-investigation-releases-report-on-titan-submersible/"}, {"title": "ASME PVHO-1: Safety Standard for Pressure Vessels for Human Occupancy", "url": "https://www.asme.org/codes-standards/find-codes-standards/safety-standard-for-pressure-vessels-for-human-occupancy"}]}}], "watch": "Watch whether space and deep-sea tourism operators accept outside certification, and whether regulators gain power to set passenger safety rules."}}, {"id": "somme", "theme": "Trench attrition meets new war machines", "rhyme": 3, "then": {"year": 1916, "short": "The Somme", "title": "The Battle of the Somme", "where": "Somme, France", "region": "europe", "hook": "The battle where Britain suffered 57,000 casualties in one day and tanks made their debut.", "text": "On 1 July 1916 British and French troops attacked German trenches along the Somme. Britain suffered 57,470 casualties that day, including over 19,000 dead. Tanks first appeared in September, and by November the Allies had advanced only about 10 km, at a cost of over a million casualties on both sides."}, "now": {"year": 2023, "short": "Bakhmut", "title": "The Battle of Bakhmut", "where": "Bakhmut, Ukraine", "region": "europe", "hook": "2023: drone videos from Bakhmut showing a city ground down to rubble and craters.", "text": "Russian forces, spearheaded by the Wagner Group, fought for Bakhmut from August 2022 until claiming it in May 2023. Soldiers dug trenches, and both sides used cheap drones to spot targets and drop grenades. Tens of thousands were killed or wounded; exact figures remain disputed."}, "followed": "The war ground on for two more years. By 1918 armies combined tanks, aircraft and artillery to break the trench deadlock, and Germany signed an armistice in November.", "next": {"short": "Robot Trenches", "title": "A war of attrition fought by machines", "text": "Around 2130, two evenly matched armies might again stall in a grinding war, with swarms of autonomous drones making any open ground deadly and pushing soldiers back underground.", "watch": "Cheap autonomous weapons that favor defenders, armies digging in instead of maneuvering, and nations racing to mass-produce shells and drones."}, "breaks": "The Somme was one front of a world war between empires; Bakhmut was far smaller, and constant drone surveillance meant almost nothing could move unseen.", "older": "The Siege of Petersburg, 1864", "topic": "power", "echoes": [{"year": -213, "short": "Syracuse Siege", "title": "Archimedes’ machines stall Rome at Syracuse", "region": "europe", "line": "Archimedes’ cranes and catapults wrecked Roman assaults on Syracuse, forcing a long stalemate and blockade until the city fell in 212 BC."}, {"year": 1268, "short": "Xiangyang Siege", "title": "The Mongol siege of Xiangyang", "region": "china", "line": "Mongols besieged Song China’s twin river fortresses for nearly five years until Persian-designed counterweight trebuchets broke them in 1273."}, {"year": 1453, "short": "Constantinople", "title": "Ottoman cannon pound Constantinople’s walls", "region": "europe", "line": "Mehmed II’s giant cannon pounded Constantinople’s walls for 53 days while sappers and defenders fought in tunnels below, until the city fell."}, {"year": 1854, "short": "Sevastopol", "title": "The Siege of Sevastopol", "region": "europe", "line": "Allied troops besieged Sevastopol for 11 months in trench lines fed by a new military railway, a foretaste of World War I."}, {"year": 1864, "short": "Petersburg", "title": "The Siege of Petersburg", "region": "us", "line": "Union and Confederate armies faced off in trenches around Petersburg for nine months, with mortars, mines and repeating rifles foreshadowing 1916."}, {"year": 1904, "short": "Port Arthur", "title": "The Siege of Port Arthur", "region": "china", "line": "Japanese troops stormed Russian forts through barbed wire and machine-gun fire, losing tens of thousands in a preview of World War I."}, {"year": 1951, "short": "Korea Stalemate", "title": "Korea’s trench stalemate", "region": "china", "line": "From mid-1951 Korea’s front froze into trenches and hill battles like Pork Chop Hill, while jet fighters dueled overhead in “MiG Alley.”"}, {"year": 1980, "short": "Iran–Iraq War", "title": "The Iran–Iraq War", "region": "mideast", "line": "Iran and Iraq fought eight years of World War I-style trench warfare, with human-wave attacks, poison gas and missiles fired at cities."}, {"year": 1998, "short": "Eritrea–Ethiopia", "title": "The Eritrea–Ethiopia border war", "region": "africa", "line": "Ethiopia and Eritrea fought a trench war likened to World War I, with jet strikes and human-wave assaults; tens of thousands died."}], "opp": {"lastTime": "Wounds drove new medicine: Harold Gillies pioneered facial reconstruction at Sidcup from 1917, Oswald Robertson set up the first depot of stored blood in 1917, and limb-fitting centers like Roehampton expanded prosthetics for disabled veterans.", "ideas": [{"kind": "build", "title": "Demining survey and clearance tools", "line": "Drone surveys, mapping software and machinery that find and clear mines and unexploded shells, which in France still surface a century later.", "guide": {"what": "Drones, sensors, mapping software and machines that find and safely remove landmines and unexploded shells, so farmland, roads and towns can be used again.", "why": "A century after the Somme, French farmers still turn up shells in each year’s “iron harvest.” Ukraine is now among the most mined countries in the world, and clearing it may take decades.", "how": ["Read the International Mine Action Standards to see how clearance work is regulated.", "Learn how drone imagery and machine learning are used to spot surface mines.", "Ask a demining organization what testing and approval a new tool needs."], "read": [{"title": "International Mine Action Standards (GICHD)", "url": "https://www.gichd.org/our-response/mine-action-standards/international-mine-action-standards/"}]}}, {"kind": "build", "title": "Prosthetics and remote rehabilitation", "line": "Affordable prosthetics, 3D-printed limb sockets and remote rehabilitation services for wounded soldiers and civilians in Ukraine and other conflict zones.", "guide": {"what": "Affordable artificial limbs, 3D-printed sockets that fit better, and video-based physiotherapy that lets patients keep improving after they leave the hospital.", "why": "After the Somme, limb-fitting centers like Roehampton expanded prosthetics for disabled veterans. The war in Ukraine has left many thousands of amputees, and there are too few prosthetists and clinics to serve them quickly.", "how": ["Read the WHO standards for prosthetics and orthotics.", "Ask a prosthetist or physiotherapist what slows fittings and follow-up care.", "Explore open-source 3D-printed prosthetic projects and learn their clinical limits."], "read": [{"title": "WHO standards for prosthetics and orthotics", "url": "https://www.who.int/publications/i/item/9789241512480"}, {"title": "International Society for Prosthetics and Orthotics (ISPO)", "url": "https://www.ispoint.org/"}]}}, {"kind": "work", "title": "Deminers, prosthetists and trauma therapists", "line": "Deminers, prosthetists, physical therapists and trauma psychologists, roles that grew after the Somme and are needed again in Ukraine.", "guide": {"what": "People who repair the damage of war: deminers who clear land, prosthetists who fit limbs, physical therapists who restore movement and psychologists who treat trauma.", "why": "After the Somme, facial surgery, stored blood and limb centers grew to treat the wounded. Ukraine now needs many deminers, rehabilitation staff and trauma therapists, and demand could grow further if reconstruction funding arrives.", "how": ["Read the International Mine Action Standards to see what training deminers need.", "Look into prosthetics and orthotics programs recognized by ISPO.", "Ask a trauma therapist which certified training they recommend for newcomers."], "read": [{"title": "International Mine Action Standards (GICHD)", "url": "https://www.gichd.org/our-response/mine-action-standards/international-mine-action-standards/"}, {"title": "International Society for Prosthetics and Orthotics (ISPO)", "url": "https://www.ispoint.org/"}]}}, {"kind": "learn", "title": "Drone defense for civilian sites", "line": "How to detect and defend against small drones, a skill now needed at power plants, airports and prisons, not only on battlefields.", "guide": {"what": "How to spot, track and respond to small drones near places like airports, power plants and prisons, using radar, radio sensors and cameras, within the law.", "why": "Tanks first appeared at the Somme and helped break the trench deadlock by 1918. Cheap drones have changed the war in Ukraine, and in 2025 drone sightings briefly closed airports in Copenhagen and Munich.", "how": ["Read EASA’s guidance on managing drone incidents at airports.", "Learn the basics of radio frequency detection and how drones are controlled.", "Check your country’s laws, since jamming or downing drones is often limited to authorities."], "read": [{"title": "EASA: Managing airport drone incidents", "url": "https://www.easa.europa.eu/community/topics/managing-airport-drone-incidents"}]}}], "watch": "Watch ceasefire talks and reconstruction funding for Ukraine, which could shift demand toward demining, rebuilding and long-term rehabilitation."}}, {"id": "sykes", "theme": "Borders drawn by outsiders, defied by insurgents", "rhyme": 2, "then": {"year": 1916, "short": "Sykes–Picot", "title": "The Sykes–Picot Agreement", "where": "Ottoman Middle East", "region": "mideast", "hook": "The secret British-French pact that split the Ottoman Arab lands into zones on a map.", "text": "In May 1916 Britain’s Mark Sykes and France’s François Georges-Picot secretly agreed how to split the Ottoman Empire’s Arab lands after the war. Their map drew zones of British and French control and influence across today’s Syria, Lebanon, Iraq and Jordan. The Bolsheviks exposed the deal in 1917."}, "now": {"year": 2014, "short": "ISIS Caliphate", "title": "ISIS Declares a Caliphate", "where": "Iraq and Syria", "region": "mideast", "hook": "Summer 2014: ISIS fighters seized Mosul and bulldozed the sand berm marking the Iraq–Syria border.", "text": "In June 2014 ISIS seized Mosul, Iraq’s second-largest city, and on 29 June declared a caliphate under Abu Bakr al-Baghdadi. A propaganda video titled “The End of Sykes–Picot” showed a bulldozer flattening a sand berm on the Iraq–Syria border. At its peak ISIS ruled millions of people."}, "followed": "After the Ottoman defeat, the 1920 San Remo conference gave France mandates over Syria and Lebanon and Britain over Iraq and Palestine. Many Arab leaders felt betrayed by British wartime promises of independence.", "next": {"short": "Lines Redrawn", "title": "Old borders crack under new pressures", "text": "Around 2112, armed movements might again try to erase borders drawn by outsiders, perhaps where heat and water shortages leave weak states unable to hold their frontier regions.", "watch": "Governments losing control of border areas, groups invoking colonial-era maps as a grievance, and disputes over shared rivers like the Tigris and Euphrates."}, "breaks": "Today’s borders were mostly set by deals after 1918 that departed from the 1916 map, and ISIS lost its last territory in 2019.", "older": "The First Partition of Poland, 1772", "topic": "power", "echoes": [{"year": -167, "short": "Macedonia Split", "title": "Rome splits Macedonia into four republics", "region": "europe", "line": "Rome cut Macedonia into four republics, banning marriage across the new lines; in 149 BC the pretender Andriscus reunited it in revolt."}, {"year": 1772, "short": "Poland Divided", "title": "The First Partition of Poland", "region": "europe", "line": "Russia, Prussia and Austria seized about a third of Poland; Polish insurgents rose against the partitions in 1794, 1830 and 1863."}, {"year": 1893, "short": "Durand Line", "title": "Britain draws the Durand Line", "region": "india", "line": "Britain drew a border splitting Pashtun lands between Afghanistan and British India; Afghanistan never recognized it, and Pashtun fighters defied it."}, {"year": 1920, "short": "Sèvres Defied", "title": "Turkish nationalists overturn the Treaty of Sèvres", "region": "mideast", "line": "The victorious Allies carved up Anatolia at Sèvres, but Mustafa Kemal’s nationalists fought on and won new borders at Lausanne in 1923."}, {"year": 1967, "short": "Biafra", "title": "The Biafran War", "region": "africa", "line": "Biafra declared independence from Nigeria, a country whose borders Britain had drawn; the war and famine that followed killed perhaps a million."}, {"year": 2012, "short": "Azawad Declared", "title": "Tuareg rebels declare Azawad", "region": "africa", "line": "Tuareg rebels declared northern Mali independent as Azawad, saying France had joined it to Mali without consent in 1960."}], "opp": {"lastTime": "Oil interests gained most: Britain kept oil-rich Mosul in Iraq, the Turkish Petroleum Company struck oil at Baba Gurgur near Kirkuk in 1927, and the 1928 Red Line Agreement divided former Ottoman oil among Western firms, with Calouste Gulbenkian keeping 5%.", "ideas": [{"kind": "build", "title": "Shared river data and monitoring", "line": "Satellite and sensor services that measure river flows, dam releases and groundwater, giving neighbors shared facts in disputes over the Tigris and Euphrates.", "guide": {"what": "Services that measure river flows, dam releases and groundwater using satellites and sensors, and share the numbers with every country along the river.", "why": "Sykes and Picot drew zones with little regard for who lived there. Today Iraq depends on the Tigris and Euphrates, which rise in Turkey, and dams and drought have cut flows, so trusted shared data could ease disputes.", "how": ["Explore NASA SWOT data, which measures river and lake heights from space.", "Read river dispute case studies from Oregon State’s transboundary water program.", "Ask a water ministry or aid agency which flow data they lack or distrust."], "read": [{"title": "NASA SWOT mission", "url": "https://swot.jpl.nasa.gov/"}, {"title": "Oregon State Program in Water Conflict Management and Transformation", "url": "https://transboundarywaters.ceoas.oregonstate.edu/"}]}}, {"kind": "build", "title": "Rebuilding war-damaged historic cities", "line": "Reconstruction, 3D documentation and restoration of war-damaged cities, as UNESCO-led teams did in Mosul, where the al-Nuri Mosque reopened in 2025.", "guide": {"what": "Work that documents and restores war-damaged old cities: 3D scanning of ruins, training local craftspeople, and rebuilding homes, markets and monuments with care.", "why": "In 2014 ISIS claimed to erase the Sykes-Picot border, and in 2017 it blew up Mosul’s al-Nuri Mosque. UNESCO-led teams rebuilt the mosque and nearby churches, which reopened in 2025.", "how": ["Read about UNESCO’s Revive the Spirit of Mosul project and how it trained local workers.", "Learn photogrammetry by scanning an old building in your town with a free app.", "Look at ICCROM courses on protecting cultural heritage during crises."], "read": [{"title": "UNESCO: Revive the Spirit of Mosul", "url": "https://www.unesco.org/en/articles/revive-spirit-mosul"}, {"title": "ICCROM", "url": "https://www.iccrom.org/"}]}}, {"kind": "work", "title": "Mediators and local service engineers", "line": "Mediators, water diplomats, civil engineers and local governance advisers who help fragile border regions deliver services so armed groups cannot fill the gap.", "guide": {"what": "People who keep fragile regions working: mediators and water diplomats who settle disputes, and engineers and advisers who help local governments supply water, power and schools.", "why": "After 1916, borders were imposed from outside and many Arab leaders felt betrayed. ISIS grew where Iraq and Syria had lost control of border areas, so working services and local deals may help keep armed groups out.", "how": ["Read the ICRC report on keeping urban services running during long wars.", "Take a free online course in negotiation, mediation or water governance.", "Contact an NGO working in Iraq or Syria about engineering or field roles."], "read": [{"title": "ICRC: Urban Services during Protracted Armed Conflict", "url": "https://www.icrc.org/en/publication/4249-urban-services-during-protracted-armed-conflict"}]}}, {"kind": "learn", "title": "Border history and transboundary water law", "line": "The history of colonial-era borders and the law of shared rivers, useful in diplomacy, journalism, humanitarian work and risk analysis.", "guide": {"what": "The story of how the Middle East’s borders were drawn after the Ottoman Empire fell, and the international rules for sharing rivers that cross borders.", "why": "The secret 1916 deal and the 1920 San Remo mandates still fuel grievances, and the Tigris and Euphrates face drought and upstream dams. People who know both the history and the law may be useful to diplomats and reporters.", "how": ["Read James Barr’s A Line in the Sand on the Anglo-French rivalry behind the borders.", "Read the 1997 UN Watercourses Convention, focusing on fair use and avoiding significant harm.", "Follow one current river dispute and map which countries control each dam."], "read": [{"title": "UN Watercourses Convention (1997)", "url": "https://legal.un.org/ilc/texts/instruments/english/conventions/8_3_1997.pdf"}, {"title": "A Line in the Sand by James Barr", "url": "https://www.simonandschuster.co.uk/books/A-Line-in-the-Sand/James-Barr/9781847394576"}]}}], "watch": "Watch Tigris and Euphrates flows and dam disputes, and whether governments restore services in border areas that armed groups exploit."}}, {"id": "flu", "theme": "A pandemic in a hyper-connected world", "rhyme": 3, "then": {"year": 1918, "short": "Spanish Flu", "title": "The Spanish Flu", "where": "Worldwide", "region": "world", "hook": "The pandemic that killed more people than the First World War.", "text": "From 1918 to 1920 an influenza pandemic infected about a third of the world’s people and killed an estimated 50 million. It struck healthy young adults especially hard. It was called “Spanish” because neutral Spain’s uncensored press reported it openly."}, "now": {"year": 2020, "short": "COVID-19", "title": "The COVID-19 Pandemic", "where": "Worldwide", "region": "world", "hook": "Spring 2020: empty streets, homemade bread, and life on video calls.", "text": "The WHO declared COVID-19 a pandemic on 11 March 2020. By April about half of humanity lived under some form of lockdown. Vaccines arrived within a year, and over 7 million deaths were officially reported, though the true toll was likely much higher."}, "followed": "After further waves the flu faded in 1920. Many countries invested in public health, with Britain creating a Ministry of Health in 1919, and the Roaring Twenties followed.", "next": {"short": "Next Pandemic", "title": "A new virus in a crowded world", "text": "Around 2122, a new virus, perhaps a bird flu, could circle the globe within weeks. Vaccines might be designed in days, but how fast people accept them could decide the death toll.", "watch": "Bird flu spreading between mammals, outbreaks where farms and forests meet, and how quickly vaccines can be made, shipped and trusted."}, "breaks": "In 1918 doctors did not know a virus caused flu; in 2020 scientists sequenced the virus within weeks and had vaccines within a year.", "older": "The Black Death, 1347", "topic": "health", "echoes": [{"year": -430, "short": "Athens Plague", "title": "The Plague of Athens", "region": "europe", "line": "Thucydides says a plague from Ethiopia, via Egypt, first struck Athens at its port, Piraeus; about a quarter of Athenians died."}, {"year": 165, "short": "Antonine Plague", "title": "The Antonine Plague sweeps Rome’s empire", "region": "europe", "line": "Brought back by soldiers from Mesopotamia, a plague spread along Roman roads and sea lanes, killing perhaps 5 to 10 million."}, {"year": 249, "short": "Cyprian Plague", "title": "The Plague of Cyprian", "region": "europe", "line": "A new disease spread from Egypt across the Roman Empire, reaching Rome by 251, where up to 5,000 a day reportedly died."}, {"year": 541, "short": "Justinian Plague", "title": "The Plague of Justinian", "region": "europe", "line": "Bubonic plague rode grain ships from Egypt to Constantinople and spread along Mediterranean trade routes, killing millions across the Roman world."}, {"year": 735, "short": "Japan Smallpox", "title": "The great smallpox epidemic in Japan", "region": "china", "line": "Smallpox, reportedly carried from Korea by a fisherman, reached the capital with travelling officials and killed perhaps a third of Japan’s people."}, {"year": 1347, "short": "Black Death", "title": "The Black Death", "region": "world", "line": "Plague spread along Silk Road caravans and Genoese trading ships, killing perhaps a third to half of Europe’s people within five years."}, {"year": 1831, "short": "Cholera Pandemic", "title": "Asiatic cholera reaches Europe and America", "region": "world", "line": "Cholera from India’s Ganges Delta followed trade routes and armies into Russia and Europe by 1831, then crossed the Atlantic by ship."}, {"year": 1889, "short": "Russian Flu", "title": "The 1889 Russian flu", "region": "world", "line": "Carried by rail and steamship, a new flu swept the Northern Hemisphere in about four months, killing roughly a million people."}, {"year": 1957, "short": "Asian Flu", "title": "The 1957 Asian flu", "region": "world", "line": "A new flu strain from China spread worldwide within months, killing over a million, as labs raced to make vaccines."}, {"year": 2009, "short": "Swine Flu", "title": "The 2009 swine flu pandemic", "region": "world", "line": "A new H1N1 flu found in Mexico spread worldwide within two months, and WHO declared the first flu pandemic in 41 years."}], "opp": {"lastTime": "After the Black Death, scarce laborers won higher wages despite England’s 1351 Statute of Labourers. In the 1918 pandemic, Vicks VapoRub sales rose from $900,000 to $2.9 million in a year. After 2020, demand jumped for telehealth, home delivery, video calls and mRNA vaccines.", "ideas": [{"kind": "build", "title": "Wastewater and air pathogen monitoring", "line": "Services that test sewage, airport air and farm sites for new pathogens, giving cities and farms earlier warning than clinic case counts.", "guide": {"what": "Testing sewage, air in airports and samples from farms for traces of viruses and bacteria, to spot outbreaks before many people get sick or see a doctor.", "why": "In 1918 no one knew a virus caused flu. During COVID, sewage tests often showed rising infections days before clinics did, and bird flu has since spread in mammals, including US dairy cows.", "how": ["Read how the CDC wastewater program and the EU wastewater observatory share data.", "Ask your local water utility what testing it does now.", "Learn basic PCR and sequencing workflows through a short lab course."], "read": [{"title": "CDC National Wastewater Surveillance System", "url": "https://www.cdc.gov/nwss/about.html"}, {"title": "EU Wastewater Observatory for Public Health (EU4S)", "url": "https://wastewater-observatory.jrc.ec.europa.eu/"}]}}, {"kind": "build", "title": "Cleaner indoor air for buildings", "line": "Ventilation upgrades, filtration and air-quality monitoring for schools, offices and clinics, guided by standards like ASHRAE 241, written after COVID.", "guide": {"what": "Services that improve air in schools, offices and clinics: better ventilation, filters and portable air cleaners, plus sensors that show air quality in real time.", "why": "After 1918, many countries invested in public health. COVID showed how viruses spread through shared indoor air, and ASHRAE Standard 241, published in 2023, sets targets for clean airflow in buildings.", "how": ["Read the WHO ventilation roadmap and a summary of ASHRAE Standard 241.", "Use a low-cost CO2 monitor to check the air in a classroom or office.", "Offer a free air check to one school and propose simple fixes."], "read": [{"title": "ASHRAE Standard 241, Control of Infectious Aerosols", "url": "https://www.ashrae.org/technical-resources/bookstore/ashrae-standard-241-control-of-infectious-aerosols"}, {"title": "WHO roadmap to improve and ensure good indoor ventilation", "url": "https://www.who.int/publications/i/item/9789240021280"}]}}, {"kind": "work", "title": "Epidemiologists and veterinary disease specialists", "line": "Field epidemiologists, veterinary disease specialists and lab technicians who track bird flu where farms, wildlife and people meet.", "guide": {"what": "Disease detectives who track outbreaks in people and animals: field epidemiologists, veterinarians who watch farm and wild animals, and lab staff who test samples.", "why": "After 1918, Britain created a Ministry of Health in 1919. Bird flu has spread to many mammals, including US dairy cattle since 2024, and early detection where farms, wildlife and people meet could matter.", "how": ["Read WOAH’s avian influenza pages to learn how animal outbreaks are reported.", "Look at field epidemiology programs such as ECDC’s EPIET fellowship.", "Take a free online epidemiology course to test your interest first."], "read": [{"title": "ECDC Fellowship Programme (EPIET/EUPHEM)", "url": "https://www.ecdc.europa.eu/en/epiet-euphem"}, {"title": "WOAH: Avian influenza", "url": "https://www.woah.org/en/disease/avian-influenza/"}]}}, {"kind": "learn", "title": "Health risk communication and trust", "line": "How to explain uncertain health risks clearly and build trust, which tends to decide how fast people accept a new vaccine.", "guide": {"what": "How to explain uncertain health risks in plain words, admit what is unknown, and build trust with communities before and during an outbreak.", "why": "In 1918 wartime censors played down the flu, so it was named after Spain, whose press reported it openly. During COVID, mixed messages and distrust slowed vaccine uptake in places, and trust may again shape the next response.", "how": ["Read the WHO guideline on communicating risk in public health emergencies.", "Take the CDC’s free CERC training on crisis and emergency risk communication.", "Explain one health risk to a friend in a minute, then ask what confused them."], "read": [{"title": "WHO guideline: Communicating risk in public health emergencies", "url": "https://www.who.int/publications/i/item/9789241550208"}, {"title": "CDC Crisis and Emergency Risk Communication (CERC)", "url": "https://www.cdc.gov/cerc/"}]}}], "watch": "Watch bird flu infections in mammals and people, any sign of human-to-human spread, and whether surveillance funding grows or shrinks."}}, {"id": "weimar", "theme": "Printing money until it is worthless", "rhyme": 3, "then": {"year": 1923, "short": "Hyperinflation", "title": "Weimar Germany’s Hyperinflation", "where": "Germany", "region": "europe", "hook": "Germans carted banknotes in wheelbarrows, and children played with bundles of worthless money.", "text": "In January 1923 France and Belgium occupied the Ruhr after Germany fell behind on reparations. The government printed money to pay striking workers, and by autumn prices doubled every few days. By November one US dollar cost 4.2 trillion marks."}, "now": {"year": 2018, "short": "Venezuela", "title": "Venezuela’s Hyperinflation", "where": "Venezuela", "region": "latam", "hook": "2018: a chicken pictured beside stacks of bolívars, and handbags woven from worthless notes.", "text": "In 2018 Venezuela’s prices rose 130,060% by the central bank’s own count, and outside estimates ran far higher. In August the government cut five zeros from the bolívar. By November the UN said 3 million Venezuelans had left the country."}, "followed": "A new currency, the Rentenmark, ended the crisis in November 1923, and the 1924 Dawes Plan eased reparations. Many Germans had lost their savings, a wound many historians link to later support for extremists.", "next": {"short": "Money Collapse", "title": "A currency printed into worthlessness", "text": "Around 2113, a government buried in debt or cut off from markets might again print money until its currency collapses, as savers flee into foreign or digital money.", "watch": "Central banks funding governments directly, price controls, mass emigration, and ordinary people switching to dollars or cryptocurrencies to protect savings."}, "breaks": "Germany stabilized its money in late 1923; Venezuela’s crisis dragged on for years, blamed by many economists on mismanagement and by its government on US sanctions.", "older": "Revolutionary France’s assignats, 1795", "topic": "money", "echoes": [{"year": 301, "short": "Roman Debasement", "title": "Rome’s debased coins and Diocletian’s price edict", "region": "europe", "line": "Emperors debased Rome’s silver coins to pay soldiers until prices soared; Diocletian’s edict capped prices on pain of death, but largely failed."}, {"year": 1214, "short": "Jin Paper Money", "title": "The Jin dynasty prints notes without limit", "region": "china", "line": "Fighting the Mongols, northern China’s Jin dynasty printed notes without limit; by 1214 it issued 1,000-string notes, and people turned to silver."}, {"year": 1330, "short": "Tughluq Tokens", "title": "Delhi’s token currency collapses", "region": "india", "line": "Sultan Muhammad bin Tughluq issued brass and copper tokens valued as silver; people forged them at home until the coins were worthless."}, {"year": 1352, "short": "Yuan Paper Money", "title": "The Yuan dynasty’s paper money collapse", "region": "china", "line": "To fund wars against rebels, China’s Mongol-led Yuan dynasty printed paper money ever faster in the 1350s until it was nearly worthless."}, {"year": 1779, "short": "Continentals", "title": "The collapse of the Continental dollar", "region": "us", "line": "Congress printed Continental dollars to pay for the Revolution until they were nearly worthless, giving rise to “not worth a Continental.”"}, {"year": 1795, "short": "Assignats", "title": "Revolutionary France’s assignats collapse", "region": "europe", "line": "Revolutionary France printed about 45 billion livres in assignats to pay debts and wars; by 1796 they were nearly worthless."}, {"year": 1946, "short": "Hungary’s Pengő", "title": "Hungary’s record hyperinflation", "region": "europe", "line": "In the worst hyperinflation ever recorded, Hungarian prices doubled about every 15 hours, and a 100 quintillion pengő note was issued."}, {"year": 1948, "short": "Gold Yuan", "title": "Nationalist China’s gold yuan collapse", "region": "china", "line": "Launched in August 1948, Nationalist China’s gold yuan was printed without limit and was nearly worthless within a year, sapping middle-class support."}, {"year": 1993, "short": "Yugoslav Dinar", "title": "Yugoslavia’s hyperinflation under sanctions", "region": "europe", "line": "Printing money to cover deficits amid war and sanctions, Yugoslavia saw prices rise about 313 million percent in January 1994 alone."}, {"year": 2008, "short": "Zimbabwe", "title": "Zimbabwe’s hyperinflation", "region": "africa", "line": "Zimbabwe’s central bank printed money until monthly inflation hit about 80 billion percent and a 100 trillion dollar note appeared."}], "opp": {"lastTime": "Debtors holding real assets gained: industrialist Hugo Stinnes borrowed marks, built an empire of some 4,500 companies and repaid in near-worthless money, while savers lost. In Venezuela, people turned to US dollars, remittances and dollar stablecoins, and import shops called bodegones spread.", "ideas": [{"kind": "build", "title": "Independent price tracking", "line": "Independent price indexes and apps that track real prices when official inflation data is late or distrusted, as happened in Venezuela and Argentina.", "guide": {"what": "Apps and indexes that collect real prices from shops and websites to measure inflation independently, especially where official figures are late, distrusted or missing.", "why": "By autumn 1923 German prices doubled every few days. Venezuela’s central bank stopped publishing inflation data for years, and MIT’s Billion Prices Project showed Argentina’s official inflation figures were too low.", "how": ["Study the Billion Prices Project’s method for collecting online prices.", "Track 20 everyday items at three shops for a month and compare with official inflation.", "Ask an economist or journalist in a high-inflation country which price data they trust."], "read": [{"title": "The Billion Prices Project", "url": "https://thebillionpricesproject.com/"}]}}, {"kind": "build", "title": "Safe remittance and savings channels", "line": "Low-cost, regulated ways for families in high-inflation countries to receive remittances and hold savings in stable currencies, with fraud protection.", "guide": {"what": "Low-cost, licensed ways for families in high-inflation countries to receive money from relatives abroad and keep savings in a stable currency, with protection against fraud.", "why": "In 1923 German savers lost nearly everything while debtors holding real assets gained. In Venezuela people turned to US dollars, remittances and dollar stablecoins, often through informal channels with high fees and fraud risk.", "how": ["Compare fees on one sending corridor using World Bank remittance price data.", "Learn your target market’s rules on foreign currency accounts and money transfer licenses.", "Interview families who receive remittances about costs, delays and scams they have faced."], "read": [{"title": "World Bank Remittance Prices Worldwide", "url": "https://remittanceprices.worldbank.org/about-remittance-prices-worldwide"}]}}, {"kind": "work", "title": "Inflation-aware finance and payroll staff", "line": "Accountants, payroll and treasury staff skilled in indexed contracts, multi-currency books and hyperinflation accounting for firms in unstable economies.", "guide": {"what": "Accountants, payroll and treasury staff who keep company books accurate when prices rise fast, using indexed contracts, several currencies and special accounting rules.", "why": "In 1923 German firms struggled to set prices and wages as money lost value by the day. Argentina, Turkey and Venezuela have recently been treated as hyperinflationary under IAS 29, so these skills are used today.", "how": ["Read the IFRS summary of IAS 29 and work through one example.", "Ask a multinational’s finance team how they keep books in Argentina or Turkey.", "Build a simple multi-currency payroll sheet with indexed wages in a spreadsheet."], "read": [{"title": "IFRS: IAS 29 Financial Reporting in Hyperinflationary Economies", "url": "https://www.ifrs.org/issued-standards/list-of-standards/ias-29-financial-reporting-in-hyperinflationary-economies/"}]}}, {"kind": "learn", "title": "Monetary history and inflation accounting", "line": "How hyperinflations start and end, from the Rentenmark to dollarization, plus IAS 29, the accounting standard for hyperinflationary economies.", "guide": {"what": "How hyperinflations start and end, from Germany’s 1923 Rentenmark to Zimbabwe and Venezuela, plus IAS 29, the accounting rule companies use in hyperinflationary economies.", "why": "Weimar savers lost nearly everything, a wound many historians link to later support for extremists. Governments buried in debt, with central banks funding them directly, could face this again, and knowing the warning signs may help.", "how": ["Read Thomas Sargent’s classic essay The Ends of Four Big Inflations.", "Read the IFRS summary of IAS 29 to learn how accounts are restated.", "Track one high-inflation country’s official and street exchange rates weekly for a month."], "read": [{"title": "Thomas Sargent, The Ends of Four Big Inflations (NBER)", "url": "https://www.nber.org/books-and-chapters/inflation-causes-and-effects/ends-four-big-inflations"}, {"title": "IFRS: IAS 29 Financial Reporting in Hyperinflationary Economies", "url": "https://www.ifrs.org/issued-standards/list-of-standards/ias-29-financial-reporting-in-hyperinflationary-economies/"}]}}], "watch": "Watch for central banks funding governments directly, a widening gap between official and street exchange rates, and rising emigration."}}, {"id": "crash", "theme": "A speculative boom ends in a global crash", "rhyme": 3, "then": {"year": 1929, "short": "Wall St Crash", "title": "The Wall Street Crash", "where": "New York, USA", "region": "us", "hook": "Black Tuesday: the day Wall Street's Roaring Twenties boom collapsed into panic.", "text": "On Black Thursday, 24 October 1929, panic selling hit Wall Street. Over the next Monday and Tuesday the Dow fell about 23%, as a record 16 million shares changed hands on 29 October. By July 1932, the Dow had lost 89% of its 1929 peak."}, "now": {"year": 2008, "short": "Lehman Crash", "title": "The Global Financial Crisis", "where": "New York, USA", "region": "us", "hook": "September 2008: Lehman Brothers staff leaving their offices carrying cardboard boxes.", "text": "On 15 September 2008, Lehman Brothers filed for bankruptcy with $639 billion in assets, the largest in US history. Credit froze worldwide. Congress passed a $700 billion bank rescue, and governments from Britain to China spent heavily to stop a collapse."}, "followed": "The Great Depression followed. Thousands of banks failed, US unemployment reached about 25% in 1933, and economic misery helped extremist movements rise in Europe.", "next": {"short": "The Next Bust", "title": "A crash in machine-run markets", "text": "Around 2087, a crash might begin in assets that barely exist today, traded by AI systems in milliseconds. Panic could cross the globe before any human trader or central banker has time to react.", "watch": "Soaring debt, a new asset everyone says is different this time, and risk piling up in lightly regulated corners of finance."}, "breaks": "Governments in 2008 rescued banks and pumped in money within weeks, so the Great Recession, with US unemployment peaking at 10%, stayed far milder than the Depression.", "older": "The South Sea Bubble, 1720", "topic": "money", "echoes": [{"year": 1345, "short": "Bardi & Peruzzi", "title": "Florence’s great banks collapse", "region": "europe", "line": "Florence’s Bardi and Peruzzi banks, with branches across Europe, had lent fortunes to warring kings; defaults helped topple both by 1346."}, {"year": 1720, "short": "South Sea Bubble", "title": "The South Sea Bubble bursts", "region": "europe", "line": "South Sea Company shares soared from £128 to £1,000 in 1720, then fell to £150 by September as Paris’s Mississippi bubble burst."}, {"year": 1857, "short": "Panic of 1857", "title": "The Panic of 1857", "region": "world", "line": "When a US railroad and land boom collapsed, panic spread to Britain and Europe in what is called the first worldwide crisis."}, {"year": 1873, "short": "Panic of 1873", "title": "The Panic of 1873", "region": "world", "line": "A railway and property boom burst on the Vienna stock exchange, spread to New York, and opened a long worldwide slump."}, {"year": 1987, "short": "Black Monday", "title": "Black Monday", "region": "us", "line": "After a five-year bull market, the Dow fell 22.6% on 19 October 1987, its worst day ever, as markets crashed worldwide."}, {"year": 1990, "short": "Japan’s Bubble", "title": "Japan’s asset bubble bursts", "region": "china", "line": "After a stock and property frenzy, Tokyo’s Nikkei peaked in December 1989 and lost about 60% by 1992, starting Japan’s “Lost Decade.”"}, {"year": 1997, "short": "Asian Crisis", "title": "The Asian financial crisis", "region": "world", "line": "Southeast Asia’s borrowing and property boom ended when Thailand’s baht collapsed, and panic spread to South Korea, Russia and Wall Street."}, {"year": 2000, "short": "Dot-com Bust", "title": "The dot-com bubble bursts", "region": "us", "line": "Investors poured money into internet startups until the Nasdaq peaked in March 2000, then it lost about 78% over two years."}], "opp": {"lastTime": "After 1929, new US securities laws required audited accounts, lifting demand for accountants, while 60 to 80 million Americans a week sought cheap escape at the movies. After 2008, the Dodd-Frank Act set off waves of hiring in bank compliance and risk.", "ideas": [{"kind": "build", "title": "Reporting tools for lightly regulated finance", "line": "Compliance and reporting software for private credit, crypto and AI-run trading, where new rules tend to land after a crash.", "guide": {"what": "Software that gathers and checks data on loans, crypto holdings or automated trades, then turns it into the reports that investors, auditors and regulators ask for.", "why": "After 1929 and 2008, new laws demanded audited accounts and fuller risk reporting. Private credit has grown to about $2 trillion with light oversight, the IMF said in 2024, so a crash there may bring similar rules.", "how": ["Ask three compliance staff at funds or crypto firms which reports take them longest.", "Read the EU's MiCA crypto rules and list the reports firms must file.", "Build a spreadsheet prototype that turns sample loan data into a simple risk report."], "read": [{"title": "IMF Global Financial Stability Report, April 2024 (private credit chapter)", "url": "https://www.imf.org/en/Publications/GFSR/Issues/2024/04/16/global-financial-stability-report-april-2024"}, {"title": "ESMA: MiCA interactive single rulebook", "url": "https://www.esma.europa.eu/publications-and-data/interactive-single-rulebook/mica"}]}}, {"kind": "build", "title": "Budgeting and debt repair services", "line": "Low-cost budgeting, debt counseling and repair-over-replace services, which tend to see demand rise as households cut back after a bust.", "guide": {"what": "Low-cost help for households to plan spending, pay down debt and fix things instead of replacing them, through apps, nonprofit counseling or local repair shops.", "why": "In the 1930s and after 2008, households cut back hard and many fell behind on debts. If a new crash hits jobs and savings, demand for cheap budgeting help, debt advice and repairs may rise again.", "how": ["Shadow or volunteer at a nonprofit credit counseling agency to learn common client problems.", "Run a free budgeting session for five neighbors and note what they found useful.", "Check whether giving debt advice needs a license where you live; in some places it does."], "read": [{"title": "National Foundation for Credit Counseling (NFCC)", "url": "https://www.nfcc.org/"}, {"title": "CFPB: Your Money, Your Goals toolkit", "url": "https://www.consumerfinance.gov/consumer-tools/educator-tool/your-money-your-goals/"}]}}, {"kind": "work", "title": "Risk, audit and compliance roles", "line": "Auditors, compliance officers and risk analysts tend to be hired in waves after crashes, as new rules follow the losses.", "guide": {"what": "Jobs that check whether a firm's numbers are true, its risks are measured and it follows the rules. Titles include internal auditor, compliance officer and risk analyst.", "why": "The 1930s securities laws made audited accounts standard, lifting demand for accountants, and Dodd-Frank set off compliance hiring after 2008. New rules for private credit, crypto or AI trading may bring a similar wave.", "how": ["Ask a risk or compliance worker about their first year in the job.", "Compare entry certifications such as the IIA's CIA and GARP's FRM, including cost and study time.", "Read the risk section of one bank's annual report and summarise it in a page."], "read": [{"title": "The IIA: Certified Internal Auditor (CIA)", "url": "https://www.theiia.org/en/certifications/cia/"}, {"title": "GARP: Financial Risk Manager (FRM) certification", "url": "https://www.garp.org/frm"}]}}, {"kind": "learn", "title": "Reading leverage and liquidity", "line": "How to read leverage, liquidity and funding risk in filings, the warning signs behind 1929 margin loans and 2008 mortgage debt.", "guide": {"what": "The skill of reading company and bank filings to see how much money is borrowed, how soon debts come due and whether there is enough cash to cover them.", "why": "In 1929, shares bought with margin loans were dumped in a rush. In 2008, short-term funding for mortgage debt vanished. Spotting these signs in filings may help you judge where the next strain could appear.", "how": ["Work through the SEC's free beginners' guide to financial statements.", "Pick one listed company and calculate its debt-to-equity and current ratios from its filings.", "Read the summary of the Federal Reserve's latest Financial Stability Report on leverage and funding."], "read": [{"title": "SEC: Beginners' Guide to Financial Statements", "url": "https://www.sec.gov/about/reports-publications/beginners-guide-financial-statements"}, {"title": "Federal Reserve: Financial Stability Report", "url": "https://www.federalreserve.gov/publications/financial-stability-report.htm"}]}}], "watch": "Borrowed money piling into one hot asset, and regulators opening inquiries into private credit or AI-driven trading."}}, {"id": "tariffs", "theme": "Tariff walls rise and trading partners hit back", "rhyme": 2, "then": {"year": 1930, "short": "Smoot–Hawley", "title": "The Smoot–Hawley Tariff", "where": "Washington, DC, USA", "region": "us", "hook": "The tariff law often blamed for deepening the Great Depression.", "text": "President Herbert Hoover signed the Smoot–Hawley Tariff Act on 17 June 1930, raising duties on over 20,000 imported goods. More than 1,000 economists had urged him to veto it. Canada, France, Italy, Spain and others answered with tariffs of their own."}, "now": {"year": 2025, "short": "Liberation Day", "title": "Trump's “Liberation Day” Tariffs", "where": "Washington, DC, USA", "region": "us", "hook": "2 April 2025: Trump's Rose Garden chart of tariff rates, then plunging stock markets.", "text": "On 2 April 2025, President Donald Trump announced a 10% tariff on most imports and higher rates on dozens of countries. Supporters said it would revive American industry and counter unfair trade, while critics warned of higher prices. China retaliated, and US tariffs on Chinese goods briefly reached 145%."}, "followed": "As the Depression deepened, world trade shrank by about two-thirds between 1929 and 1934. In 1934 Congress let the president negotiate tariff cuts, paving the way for the GATT trade system in 1947.", "next": {"short": "Trade Blocs", "title": "A world split into trade blocs", "text": "Around 2120, a leading power might wall off its markets over AI, data or carbon, and rivals could answer in kind. The world might split into blocs that trade freely inside and little across.", "watch": "Rising tariffs and carbon border taxes, hardening trade blocs, and leaders promising that self-sufficiency will bring back jobs."}, "breaks": "Smoot–Hawley was a law passed by Congress as a depression began; the 2025 tariffs came by presidential emergency order, which the Supreme Court ruled unlawful in February 2026.", "older": "The Tariff of Abominations, 1828", "topic": "money", "echoes": [{"year": -220, "short": "Bosporus Toll", "title": "Rhodes goes to war over Byzantium’s toll", "region": "europe", "line": "Byzan
